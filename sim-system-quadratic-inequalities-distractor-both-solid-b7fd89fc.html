<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities — Distractor (Both Solid)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 6.5, 7.5, -10.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.1, -0.6, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.25, 6.1, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Functions
        function f(x) { return -x * x + 2 * x + 3; }
        function g(x) { return x * x - 4 * x - 5; }

        // Shaded region: above both parabolas = above max(f(x), g(x))
        var Y_TOP = 6.5;

        var shadePts = [];
        var xMin = -3.5, xMax = 7.5;
        var steps = 200;
        var dx = (xMax - xMin) / steps;

        for (var i = 0; i <= steps; i++) {
            var xx = xMin + i * dx;
            var yy = Math.max(f(xx), g(xx));
            if (yy > Y_TOP) yy = Y_TOP;
            shadePts.push([xx, yy]);
        }
        shadePts.push([xMax, Y_TOP]);
        shadePts.push([xMin, Y_TOP]);

        var shadeX = [];
        var shadeY = [];
        for (var j = 0; j < shadePts.length; j++) {
            shadeX.push(shadePts[j][0]);
            shadeY.push(shadePts[j][1]);
        }

        board.create('curve', [shadeX, shadeY], {
            strokeWidth: 0,
            fillColor: '#888888',
            fillOpacity: 0.15,
            fixed: true,
            highlight: false
        });

        // Parabola 1: f(x) = -x² + 2x + 3 — SOLID (distractor)
        board.create('functiongraph', [f, -3.5, 7.5], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Parabola 2: g(x) = x² - 4x - 5 — SOLID (distractor)
        board.create('functiongraph', [g, -3.5, 7.5], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // Labels — name only
        board.create('text', [-2.8, 3.5, 'f(x)'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [5.8, 3.5, 'g(x)'], {
            fontSize: 10, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
