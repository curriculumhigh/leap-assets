<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Intersecting Lines — Four Angles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 4, 5, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var O = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        var halfAngle = 28;
        var ang1 = (90 + halfAngle) * Math.PI / 180;
        var ang2 = (90 - halfAngle) * Math.PI / 180;

        var len = 4.5;

        var A1 = board.create('point', [len * Math.cos(ang1), len * Math.sin(ang1)], {
            name: '', visible: false, fixed: true
        });
        var A2 = board.create('point', [-len * Math.cos(ang1), -len * Math.sin(ang1)], {
            name: '', visible: false, fixed: true
        });

        var B1 = board.create('point', [len * Math.cos(ang2), len * Math.sin(ang2)], {
            name: '', visible: false, fixed: true
        });
        var B2 = board.create('point', [-len * Math.cos(ang2), -len * Math.sin(ang2)], {
            name: '', visible: false, fixed: true
        });

        board.create('segment', [A1, A2], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [B1, B2], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var arcRadius = 0.7;

        board.create('nonReflexAngle', [B1, O, A1], {
            radius: arcRadius,
            fillColor: 'none', fillOpacity: 0,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [A1, O, B2], {
            radius: arcRadius,
            fillColor: 'none', fillOpacity: 0,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [B2, O, A2], {
            radius: arcRadius,
            fillColor: 'none', fillOpacity: 0,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [A2, O, B1], {
            radius: arcRadius,
            fillColor: 'none', fillOpacity: 0,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var labelDist = 1.15;

        var bisect1 = Math.PI / 2;
        board.create('text', [
            labelDist * Math.cos(bisect1),
            labelDist * Math.sin(bisect1),
            '1'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight: 600; font-style: italic;'
        });

        var bisect2 = 0;
        board.create('text', [
            labelDist * Math.cos(bisect2),
            labelDist * Math.sin(bisect2),
            '2'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight: 600; font-style: italic;'
        });

        var bisect3 = 3 * Math.PI / 2;
        board.create('text', [
            labelDist * Math.cos(bisect3),
            labelDist * Math.sin(bisect3),
            '3'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight: 600; font-style: italic;'
        });

        var bisect4 = Math.PI;
        board.create('text', [
            labelDist * Math.cos(bisect4),
            labelDist * Math.sin(bisect4),
            '4'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight: 600; font-style: italic;'
        });

        var measureDist = 2.0;
        board.create('text', [
            measureDist * Math.cos(bisect1),
            measureDist * Math.sin(bisect1),
            '56\u00B0'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight: 500;'
        });
    </script>
</body>
</html>
