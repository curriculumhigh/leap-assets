<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpendicular Chord Bisector Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;

        // ── Center P ────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, 8], useKatex: true }
        });

        // ── Circle ──────────────────────────────────────────────────────
        var circle = board.create('circle', [P, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Diameter endpoints W (top) and Y (bottom) ───────────────────
        var W = board.create('point', [0, R], {
            name: 'W', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, 12], useKatex: true }
        });

        var Y = board.create('point', [0, -R], {
            name: 'Y', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, -16], useKatex: true }
        });

        // ── Diameter segment WY ─────────────────────────────────────────
        board.create('segment', [W, Y], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Intersection point Z (on diameter, below center) ────────────
        var Zy = -1.0;
        var Z = board.create('point', [0, Zy], {
            name: 'Z', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -12], useKatex: true }
        });

        // ── Chord VX — horizontal through Z ─────────────────────────────
        var halfChord = Math.sqrt(R * R - Zy * Zy);

        var V = board.create('point', [-halfChord, Zy], {
            name: 'V', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-16, -10], useKatex: true }
        });

        var X = board.create('point', [halfChord, Zy], {
            name: 'X', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [10, -10], useKatex: true }
        });

        // ── Chord segment VX ────────────────────────────────────────────
        board.create('segment', [V, X], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle mark at Z ───────────────────────────────────────
        var sqSize = 0.35;
        var sq1 = board.create('point', [sqSize, Zy], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, Zy - sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, Zy - sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
