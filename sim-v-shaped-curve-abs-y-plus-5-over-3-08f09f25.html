<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-shaped curve x = |y+5|/3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 1.5, 8.5, -11.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Draw major gridlines manually at every integer
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]);
        var xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]);
        var yMax = Math.floor(bb[1]);
        var i;

        // Vertical gridlines
        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // Horizontal gridlines
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // Create axes manually for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        // Axis labels
        board.create('text', [8.0, -0.6, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.2, 1.1, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Draw lower branch (t < -5)
        board.create('curve', [
            function(t) { return Math.abs(t + 5) / 3; },
            function(t) { return t; },
            -11.5, -5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Draw upper branch (t > -5)
        board.create('curve', [
            function(t) { return Math.abs(t + 5) / 3; },
            function(t) { return t; },
            -5, 1.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points (marked dots, no labels)
        board.create('point', [0, -5], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [1, -2], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [2, 1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [1, -8], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [2, -11], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });

        // Orientation arrows
        // Lower branch at (1, -8): direction (-1/3, 1) — up-left toward vertex
        var adx1 = -1 / 3, ady1 = 1;
        var len1 = Math.sqrt(adx1 * adx1 + ady1 * ady1);
        var scale1 = 0.7;
        board.create('arrow', [[1, -8], [1 + scale1 * adx1 / len1, -8 + scale1 * ady1 / len1]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // Upper branch at (1, -2): direction (1/3, 1) — up-right away from vertex
        var adx2 = 1 / 3, ady2 = 1;
        var len2 = Math.sqrt(adx2 * adx2 + ady2 * ady2);
        var scale2 = 0.7;
        board.create('arrow', [[1, -2], [1 + scale2 * adx2 / len2, -2 + scale2 * ady2 / len2]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });
    </script>
</body>
</html>
