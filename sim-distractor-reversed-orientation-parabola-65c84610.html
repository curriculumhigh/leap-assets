<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor — Reversed Orientation Parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 6.5, 18, -4.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9, offset: [0, -10] },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9, offset: [-12, 0] },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [17.3, -0.5, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 6.0, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Parametric curve: x = t^2, y = 5 - 2t, t in [0, 4]
        board.create('curve', [
            function(t) { return t * t; },
            function(t) { return 5 - 2 * t; },
            0, 4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points (no labels, just markers)
        var pts = [[0, 5], [1, 3], [4, 1], [9, -1], [16, -3]];
        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 2.5, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });
        }

        // Orientation arrows — REVERSED: pointing from (16,-3) toward (0,5)
        function addArrow(tVal) {
            var dt = 0.15;
            var tA = tVal + dt;
            var tB = tVal - dt;

            var ax = tA * tA;
            var ay = 5 - 2 * tA;
            var bx = tB * tB;
            var by = 5 - 2 * tB;

            board.create('arrow', [[ax, ay], [bx, by]], {
                strokeColor: '#222222',
                strokeWidth: 1.6,
                lastArrow: { type: 2, size: 5 },
                fixed: true,
                highlight: false
            });
        }

        addArrow(1.3);
        addArrow(3.0);
    </script>
</body>
</html>
