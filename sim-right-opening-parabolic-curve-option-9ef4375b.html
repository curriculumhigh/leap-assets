<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right-Opening Parabolic Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7, 18, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [17.2, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 6.5, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Parametric curve: x = t^2, y = 5 - 2t, t in [0, 4]
        board.create('curve', [
            function(t) { return t * t; },
            function(t) { return 5 - 2 * t; },
            0, 4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points (no labels)
        var pts = [[0, 5], [1, 3], [4, 1], [9, -1], [16, -3]];
        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '',
                size: 2.5,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }

        // Orientation arrows along the curve (triangular arrowheads)
        function arrowAt(t, len) {
            var dt = 0.01;
            var x0 = t * t;
            var y0 = 5 - 2 * t;
            var x1 = (t + dt) * (t + dt);
            var y1 = 5 - 2 * (t + dt);
            var dx = x1 - x0;
            var dy = y1 - y0;
            var mag = Math.sqrt(dx * dx + dy * dy);
            dx /= mag;
            dy /= mag;
            var ax = x0 - dx * len;
            var ay = y0 - dy * len;
            board.create('segment', [[ax, ay], [x0, y0]], {
                strokeColor: '#222222',
                strokeWidth: 1.4,
                fixed: true,
                highlight: false,
                lastArrow: { type: 2, size: 5 }
            });
        }

        arrowAt(1.3, 0.6);
        arrowAt(3.2, 0.6);
    </script>
</body>
</html>
