<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Age vs Resale Price</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 180px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 4px;
        }
        .data-list { list-style: none; padding: 0; margin: 0; }
        .data-list li {
            font-size: 13px; padding: 3px 0; color: #333;
            min-height: 20px;
        }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #2563EB;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Data Points</div>
                    <ul class="data-list" id="data-list"></ul>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 32, 10.8, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [10.2, -1.2, '\\text{Age (years)}'], { fontSize: 13, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.15, 31, '\\text{Resale Price (\\$1000s)}'], { fontSize: 13, fixed: true, highlight: false, useKatex: true, anchorX: 'left' });

        // Data points
        var data = [
            [1, 26], [2, 23], [2, 21], [3, 20], [4, 18],
            [5, 15], [6, 14], [7, 11], [8, 9], [9, 7]
        ];

        var COL_PT = '#2563EB';
        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function showTooltip(pt) {
            var xCoord = pt.X();
            var yCoord = pt.Y();
            var latex = '\\color{' + COL_PT + '}{(' + Math.round(xCoord) + ',\\,' + Math.round(yCoord) + ')}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [xCoord, yCoord], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // Create points on board
        for (var i = 0; i < data.length; i++) {
            (function(idx) {
                var pt = board.create('point', [data[idx][0], data[idx][1]], {
                    name: '', size: 4, color: COL_PT, fixed: true,
                    showInfobox: false, highlight: true,
                    highlightFillColor: COL_PT, highlightStrokeColor: '#1d4ed8',
                    highlightSize: 5
                });
                pt.on('over', function() { showTooltip(pt); });
                pt.on('out', function() { hideTooltip(); });
            })(i);
        }

        // Populate panel list with KaTeX
        var listEl = document.getElementById('data-list');
        for (var j = 0; j < data.length; j++) {
            var li = document.createElement('li');
            var span = document.createElement('span');
            li.appendChild(span);
            listEl.appendChild(li);
            katex.render('(' + data[j][0] + ',\\,' + data[j][1] + ')', span, { throwOnError: false });
        }
    </script>
</body>
</html>
