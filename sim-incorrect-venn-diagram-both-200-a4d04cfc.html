<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorrect Venn Diagram — Both shows 200</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [0, 8, 12, 0],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_ENGLISH = '#2563EB';
        var COL_FRENCH = '#059669';
        var COL_BOTH = '#222222';
        var COL_BORDER = '#555555';

        // Universal set rectangle
        var rectPts = [
            board.create('point', [0.5, 0.5], { visible: false, fixed: true, name: '' }),
            board.create('point', [11.5, 0.5], { visible: false, fixed: true, name: '' }),
            board.create('point', [11.5, 7.5], { visible: false, fixed: true, name: '' }),
            board.create('point', [0.5, 7.5], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', rectPts, {
            fillColor: '#f9fafb', fillOpacity: 1,
            borders: { strokeColor: COL_BORDER, strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // S label (top-left) — KaTeX, Computer Modern Math Italic, 15px
        board.create('text', [1.1, 7.0, 'S'], {
            fontSize: 15, color: COL_BORDER, fixed: true, highlight: false, useKatex: true
        });

        // Circle positions
        var cxL = 4.8, cxR = 7.2, cy = 3.9, radius = 2.3;

        // French circle (right)
        board.create('circle', [[cxR, cy], radius], {
            strokeColor: COL_FRENCH, strokeWidth: 2.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });

        // English circle (left)
        board.create('circle', [[cxL, cy], radius], {
            strokeColor: COL_ENGLISH, strokeWidth: 2.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });

        // Circle labels (above circles) — KaTeX \text{}, 14px, normal weight
        board.create('text', [cxL - 1.0, 6.8, '\\text{English}'], {
            fontSize: 14, color: COL_ENGLISH, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [cxR + 0.2, 6.8, '\\text{French}'], {
            fontSize: 14, color: COL_FRENCH, fixed: true, highlight: false, useKatex: true
        });

        // Region values — KaTeX \textbf{}, bold, 16px inner / 15px neither
        // English only (left region)
        board.create('text', [cxL - 1.4, cy, '\\textbf{200}'], {
            fontSize: 16, color: COL_ENGLISH, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, layer: 9, useKatex: true
        });

        // Both (intersection) — THE INCORRECT VALUE
        var midX = (cxL + cxR) / 2;
        board.create('text', [midX, cy, '\\textbf{200}'], {
            fontSize: 16, color: COL_BOTH, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, layer: 9, useKatex: true
        });

        // French only (right region)
        board.create('text', [cxR + 1.4, cy, '\\textbf{200}'], {
            fontSize: 16, color: COL_FRENCH, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, layer: 9, useKatex: true
        });

        // Neither (outside circles, bottom-right) — 15px
        board.create('text', [10.3, 1.3, '\\textbf{100}'], {
            fontSize: 15, color: '#666666', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, layer: 9, useKatex: true
        });
    </script>
</body>
</html>
