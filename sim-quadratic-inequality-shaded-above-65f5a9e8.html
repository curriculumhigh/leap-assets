<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Inequality y ≥ x² − 2x − 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 4, 5, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                gridX: 1,
                gridY: 1,
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 3.7, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola function
        var parabola = board.create('functiongraph', [function(x) { return x * x - 2 * x - 3; }, -4, 5], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Shaded region above the parabola
        var ineq = board.create('inequality', [parabola], {
            inverse: false,
            fillColor: '#222222',
            fillOpacity: 0.12,
            strokeWidth: 0,
            fixed: true,
            highlight: false
        });

        // X-intercepts: (x-3)(x+1) = 0 => x = -1, 3
        board.create('point', [-1, 0], {
            size: 3, fillColor: '#222222', strokeColor: '#222222',
            fixed: true, name: '', highlight: false
        });
        board.create('point', [3, 0], {
            size: 3, fillColor: '#222222', strokeColor: '#222222',
            fixed: true, name: '', highlight: false
        });

        // Vertex: x = 1, y = 1 - 2 - 3 = -4
        board.create('point', [1, -4], {
            size: 3, fillColor: '#222222', strokeColor: '#222222',
            fixed: true, name: '', highlight: false
        });

        // Labels for intercepts and vertex
        board.create('text', [-1.9, 0.4, '(-1, 0)'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [3.2, 0.4, '(3, 0)'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [1.3, -4.6, '(1, -4)'], { fontSize: 11, fixed: true, highlight: false });

        // Inequality label
        board.create('text', [2.2, 3.2, 'y \\geq x^2 - 2x - 3'], {
            fontSize: 12, fixed: true, highlight: false, useKatex: true, color: '#222222'
        });
    </script>
</body>
</html>
