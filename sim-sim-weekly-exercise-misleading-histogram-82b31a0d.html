<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Exercise Histogram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 28.5, 4.8, 2.0],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BAR_LEFT = 0.5;
        var BAR_WIDTH = 1.0;
        var Y_MIN = 5;
        var Y_MAX = 25;

        var COL_BAR_FILL = '#2563EB';
        var COL_BAR_STROKE = '#2563EB';
        var COL_AXIS = '#444444';
        var COL_GRID = '#D1D5DB';
        var COL_TEXT = '#333333';

        var bins = [
            { label: '0\u201319',  height: 8,  x0: 0.5 },
            { label: '20\u201339', height: 14, x0: 1.5 },
            { label: '40\u201399', height: 22, x0: 2.5 }
        ];

        var yTicks = [5, 10, 15, 20, 25];
        for (var g = 0; g < yTicks.length; g++) {
            board.create('segment', [[BAR_LEFT, yTicks[g]], [BAR_LEFT + 3 * BAR_WIDTH, yTicks[g]]], {
                strokeColor: COL_GRID, strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        board.create('segment', [[BAR_LEFT, Y_MIN], [BAR_LEFT, Y_MAX + 1.5]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
        });

        board.create('segment', [[BAR_LEFT, Y_MIN], [BAR_LEFT + 3 * BAR_WIDTH, Y_MIN]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
        });

        for (var t = 0; t < yTicks.length; t++) {
            board.create('segment', [[BAR_LEFT - 0.08, yTicks[t]], [BAR_LEFT, yTicks[t]]], {
                strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [BAR_LEFT - 0.18, yTicks[t], String(yTicks[t])], {
                fontSize: 11, color: COL_AXIS, anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        for (var b = 0; b < bins.length; b++) {
            var x0 = bins[b].x0;
            var x1 = x0 + BAR_WIDTH;
            var yTop = bins[b].height;

            var p1 = board.create('point', [x0, Y_MIN], { visible: false, name: '' });
            var p2 = board.create('point', [x1, Y_MIN], { visible: false, name: '' });
            var p3 = board.create('point', [x1, yTop], { visible: false, name: '' });
            var p4 = board.create('point', [x0, yTop], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: COL_BAR_FILL, fillOpacity: 0.35,
                borders: { strokeColor: COL_BAR_STROKE, strokeWidth: 1.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            board.create('text', [x0 + BAR_WIDTH / 2, Y_MIN - 0.9, bins[b].label], {
                fontSize: 11, color: COL_TEXT, anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });

            board.create('segment', [[x0, Y_MIN], [x0, Y_MIN - 0.3]], {
                strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
            });
            if (b === bins.length - 1) {
                board.create('segment', [[x1, Y_MIN], [x1, Y_MIN - 0.3]], {
                    strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
                });
            }
        }

        board.create('text', [2.0, 27.5, '\\textbf{Weekly Exercise}'], {
            fontSize: 16, color: COL_TEXT, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        board.create('text', [2.0, Y_MIN - 2.5, '\\text{Minutes}'], {
            fontSize: 13, color: COL_TEXT, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        board.create('text', [-1.1, 15, '\\text{Number of Users}'], {
            fontSize: 13, color: COL_TEXT, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true,
            rotate: 90
        });
    </script>
</body>
</html>
