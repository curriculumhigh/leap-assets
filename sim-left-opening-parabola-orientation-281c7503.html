<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left-Opening Parabola x = 9 - y²</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); position: relative; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
            <div class="coord-tooltip" id="tooltip"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 4.5, 11, -4.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.0,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.0,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels (small for option card)
        board.create('text', [10.4, -0.35, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.2, 4.1, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Parametric curve: x = 9sin²θ, y = 3cosθ, θ ∈ [0, π]
        // At θ=0: x=0, y=3  →  At θ=π/2: x=9, y=0  →  At θ=π: x=0, y=-3
        var curve = board.create('curve', [
            function(t) { return 9 * Math.sin(t) * Math.sin(t); },
            function(t) { return 3 * Math.cos(t); },
            0, Math.PI
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Orientation arrows along the curve
        // Place arrowheads at θ = π/4, π/2, 3π/4
        var arrowThetas = [Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4];

        function paramX(t) { return 9 * Math.sin(t) * Math.sin(t); }
        function paramY(t) { return 3 * Math.cos(t); }

        for (var i = 0; i < arrowThetas.length; i++) {
            (function(theta) {
                var dt = 0.05;
                var x1 = paramX(theta - dt);
                var y1 = paramY(theta - dt);
                var x2 = paramX(theta + dt);
                var y2 = paramY(theta + dt);

                // Direction vector
                var dx = x2 - x1;
                var dy = y2 - y1;
                var len = Math.sqrt(dx * dx + dy * dy);
                dx /= len;
                dy /= len;

                // Arrow tip at (xm, ym), tail slightly behind
                var xm = paramX(theta);
                var ym = paramY(theta);
                var arrowLen = 0.5;

                board.create('line', [
                    [xm - arrowLen * dx, ym - arrowLen * dy],
                    [xm, ym]
                ], {
                    straightFirst: false, straightLast: false,
                    strokeColor: '#222222', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    fixed: true, highlight: false
                });
            })(arrowThetas[i]);
        }

        // Key points
        var COL_PT = '#222222';

        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function showTooltip(pt, latex) {
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var sx = coords.scrCoords[1];
            var sy = coords.scrCoords[2];
            tooltip.style.left = (sx + 10) + 'px';
            tooltip.style.top = (sy - 24) + 'px';
        }

        function hideTooltip() { tooltip.style.display = 'none'; }

        // Point (0, 3) — θ = 0
        var pt1 = board.create('point', [0, 3], {
            name: '', size: 3, color: COL_PT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_PT, highlightStrokeColor: COL_PT
        });
        pt1.on('over', function() { showTooltip(pt1, '(0,\\, 3)'); });
        pt1.on('out', hideTooltip);

        // Point (9, 0) — θ = π/2
        var pt2 = board.create('point', [9, 0], {
            name: '', size: 3, color: COL_PT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_PT, highlightStrokeColor: COL_PT
        });
        pt2.on('over', function() { showTooltip(pt2, '(9,\\, 0)'); });
        pt2.on('out', hideTooltip);

        // Point (0, -3) — θ = π
        var pt3 = board.create('point', [0, -3], {
            name: '', size: 3, color: COL_PT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_PT, highlightStrokeColor: COL_PT
        });
        pt3.on('over', function() { showTooltip(pt3, '(0,\\, -3)'); });
        pt3.on('out', hideTooltip);
    </script>
</body>
</html>
