<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-and-Whisker Plot — Distractor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 1.6, 64, -1.0],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Data ────────────────────────────────────────────────────────
        var MIN = 3, Q1 = 10, Q2 = 22.3, Q3 = 40, MAX = 55;
        var MID = 0.6;          // vertical center of plot
        var BOX_H = 0.2;       // box half-height (total box height = 0.4)
        var CAP_H = 0.15;      // whisker end-cap half-height
        var COL = '#222222';
        var COL_MED = '#DC2626'; // red median line
        var COL_FILL = '#E5E7EB';

        // ── Number line (horizontal axis) ───────────────────────────────
        board.create('segment', [[-2, 0], [62, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // Tick marks every 5 from 0 to 60
        var i;
        for (i = 0; i <= 60; i += 5) {
            board.create('segment', [[i, -0.12], [i, 0.12]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [i, -0.22, String(i)], {
                anchorX: 'middle', anchorY: 'top', fontSize: 9,
                color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Whiskers ────────────────────────────────────────────────────
        // Left whisker: Min → Q1
        board.create('segment', [[MIN, MID], [Q1, MID]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });
        // Right whisker: Q3 → Max
        board.create('segment', [[Q3, MID], [MAX, MID]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // End caps
        board.create('segment', [[MIN, MID - CAP_H], [MIN, MID + CAP_H]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[MAX, MID - CAP_H], [MAX, MID + CAP_H]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Box (Q1 → Q3) ──────────────────────────────────────────────
        var bx1 = board.create('point', [Q1, MID + BOX_H], { visible: false, fixed: true, name: '' });
        var bx2 = board.create('point', [Q3, MID + BOX_H], { visible: false, fixed: true, name: '' });
        var bx3 = board.create('point', [Q3, MID - BOX_H], { visible: false, fixed: true, name: '' });
        var bx4 = board.create('point', [Q1, MID - BOX_H], { visible: false, fixed: true, name: '' });
        board.create('polygon', [bx1, bx2, bx3, bx4], {
            fillColor: COL_FILL, fillOpacity: 0.5,
            borders: { strokeColor: COL, strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Median line (red) ───────────────────────────────────────────
        board.create('segment', [[Q2, MID - BOX_H], [Q2, MID + BOX_H]], {
            strokeColor: COL_MED, strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Key-point numeric labels ────────────────────────────────────
        var LABEL_Y = MID + BOX_H + 0.15;
        var lblFontSize = 9;

        board.create('text', [MIN, LABEL_Y, '3'], {
            anchorX: 'middle', anchorY: 'bottom', fontSize: lblFontSize,
            color: COL, useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [Q1, LABEL_Y, '10'], {
            anchorX: 'middle', anchorY: 'bottom', fontSize: lblFontSize,
            color: COL, useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [Q2, LABEL_Y, '22.3'], {
            anchorX: 'middle', anchorY: 'bottom', fontSize: lblFontSize,
            color: COL, useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [Q3, LABEL_Y, '40'], {
            anchorX: 'middle', anchorY: 'bottom', fontSize: lblFontSize,
            color: COL, useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [MAX, LABEL_Y, '55'], {
            anchorX: 'middle', anchorY: 'bottom', fontSize: lblFontSize,
            color: COL, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
