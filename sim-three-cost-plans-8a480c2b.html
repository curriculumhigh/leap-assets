<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Cost Plans</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 90, 34, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [28, -5, '\\text{Number of flyers}'], {
            fontSize: 12, fixed: true, highlight: false, useKatex: true, anchorX: 'middle'
        });
        board.create('text', [1.2, 87, '\\text{Cost (dollars)}'], {
            fontSize: 12, fixed: true, highlight: false, useKatex: true, anchorX: 'left'
        });

        // Colors
        var COL_A = '#222222';
        var COL_B = '#2563EB';
        var COL_C = '#059669';

        // Plan A: y = 2x + 30
        board.create('functiongraph', [function(x) { return 2 * x + 30; }, 0, 30], {
            strokeColor: COL_A, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Plan B: y = 5x
        board.create('functiongraph', [function(x) { return 5 * x; }, 0, 30], {
            strokeColor: COL_B, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Plan C: y = 3x + 10
        board.create('functiongraph', [function(x) { return 3 * x + 10; }, 0, 30], {
            strokeColor: COL_C, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Labels — hardcoded positions
        board.create('text', [27, 82, 'A'], {
            fontSize: 13, color: COL_A, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [7, 55, 'B'], {
            fontSize: 13, color: COL_B, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [19, 72, 'C'], {
            fontSize: 13, color: COL_C, fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
