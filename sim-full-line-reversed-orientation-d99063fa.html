<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Line through (-3,-1) and (1,7)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 9.5, 3.5, -3.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 8, anchorX: 'middle', offset: [0, -10] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 8, anchorX: 'right', offset: [-6, 0] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.0, -0.5, 'x'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.3, 9.0, 'y'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });

        // Full line through (-3,-1) and (1,7): y = 2x + 5
        board.create('line', [[1, 7], [-3, -1]], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            straightFirst: true,
            straightLast: true,
            firstArrow: false,
            lastArrow: false
        });

        // Orientation arrows pointing from (1,7) toward (-3,-1)
        var dx = -0.4472;
        var dy = -0.8944;

        var arrowPositions = [
            [1.6, 8.2],
            [-0.6, 3.8],
            [-2.8, -0.6]
        ];

        for (var i = 0; i < arrowPositions.length; i++) {
            var ax = arrowPositions[i][0];
            var ay = arrowPositions[i][1];
            board.create('segment', [
                [ax - dx * 0.35, ay - dy * 0.35],
                [ax + dx * 0.35, ay + dy * 0.35]
            ], {
                strokeColor: '#222222',
                strokeWidth: 1.8,
                fixed: true,
                highlight: false,
                lastArrow: { type: 2, size: 5 }
            });
        }

        // Key points
        board.create('point', [-3, -1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [1, 7], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels
        board.create('text', [-4.4, -1.0, '(-3, -1)'], {
            fontSize: 9, color: '#222222', useKatex: true, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [2.2, 7.0, '(1, 7)'], {
            fontSize: 9, color: '#222222', useKatex: true, fixed: true, highlight: false, anchorX: 'left'
        });
    </script>
</body>
</html>
