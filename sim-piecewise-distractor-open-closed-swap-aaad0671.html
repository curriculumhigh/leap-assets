<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Distractor – Open/Closed Swap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var bb = [-7.5, 8.5, 8.5, -4.5];
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: bb,
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // ── Manual grid lines ───────────────────────────────────────────
        var GRID_COL = '#D1D5DB';
        var GRID_W = 0.4;
        var i;

        // Vertical grid lines every 1 unit
        for (i = Math.ceil(bb[0]); i <= Math.floor(bb[2]); i++) {
            if (i === 0) continue;
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // Horizontal grid lines every 1 unit
        for (i = Math.ceil(bb[3]); i <= Math.floor(bb[1]); i++) {
            if (i === 0) continue;
            board.create('line', [[0, i], [1, i]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // ── Manual x-axis with ticks every 2 ───────────────────────────
        var xAxis = board.create('line', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            firstArrow: false,
            fixed: true, highlight: false
        });
        board.create('ticks', [xAxis, 2], {
            strokeColor: '#444444',
            majorHeight: 8,
            minorTicks: 0,
            drawLabels: true,
            label: { fontSize: 9, offset: [0, -12] },
            drawZero: false
        });

        // ── Manual y-axis with ticks every 1 ───────────────────────────
        var yAxis = board.create('line', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            firstArrow: false,
            fixed: true, highlight: false
        });
        board.create('ticks', [yAxis, 1], {
            strokeColor: '#444444',
            majorHeight: 8,
            minorTicks: 0,
            drawLabels: true,
            label: { fontSize: 9, offset: [-12, 0] },
            drawZero: false
        });

        var COL = '#222222';

        // ── Piece 1: y = -2x - 5, x < -2 (ray going left) ─────────────
        board.create('functiongraph', [
            function(x) { return -2 * x - 5; },
            -8, -2
        ], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // DISTRACTOR ERROR: closed circle at (-2, -1) on piece 1
        board.create('point', [-2, -1], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });

        // ── Piece 2: y = x + 1, -2 <= x <= 4 ──────────────────────────
        board.create('functiongraph', [
            function(x) { return x + 1; },
            -2, 4
        ], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // DISTRACTOR ERROR: open circle at (-2, -1) on piece 2
        board.create('point', [-2, -1], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5
        });

        // Closed circle at (4, 5) on piece 2
        board.create('point', [4, 5], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });

        // ── Piece 3: y = -x + 9, x > 4 (ray going right) ──────────────
        board.create('functiongraph', [
            function(x) { return -x + 9; },
            4, 9
        ], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Open circle at (4, 5) on piece 3
        board.create('point', [4, 5], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5
        });
    </script>
</body>
</html>
