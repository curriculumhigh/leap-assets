<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Satisfaction Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 520px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 11.5, 64, -2.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var i, v, x;

        // ── Axes (manual, no arrows — data plot style) ──────────────────

        // X-axis line
        board.create('segment', [[0, 0], [62, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Y-axis line
        board.create('segment', [[0, 0], [0, 10.5]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Grid lines ──────────────────────────────────────────────────

        // Vertical grid lines at every 5 from 5 to 60
        for (x = 5; x <= 60; x += 5) {
            board.create('segment', [[x, 0], [x, 10]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Horizontal grid lines at every 0.5 from 0.5 to 10
        for (v = 0.5; v <= 10; v += 0.5) {
            board.create('segment', [[0, v], [60, v]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Tick marks and labels — X-axis ──────────────────────────────

        // Tick marks at every 5
        for (x = 5; x <= 60; x += 5) {
            board.create('segment', [[x, -0.2], [x, 0.2]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
        }

        // Labels only at multiples of 10
        var xLabels = [10, 20, 30, 40, 50, 60];
        for (i = 0; i < xLabels.length; i++) {
            board.create('text', [xLabels[i], -0.7, String(xLabels[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Tick marks and labels — Y-axis (every 0.5) ─────────────────

        for (v = 0.5; v <= 10; v += 0.5) {
            var isInteger = (Math.abs(v - Math.round(v)) < 0.01);
            var tickHalf = isInteger ? 0.5 : 0.3;

            // Tick mark
            board.create('segment', [[-tickHalf, v], [tickHalf, v]], {
                strokeColor: '#444444', strokeWidth: isInteger ? 1.2 : 0.8,
                fixed: true, highlight: false
            });

            // Labels only at integers
            if (isInteger) {
                board.create('text', [-1.6, v, String(Math.round(v))], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // Origin label
        board.create('text', [-1.6, -0.7, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Axis labels ─────────────────────────────────────────────────

        // X-axis label
        board.create('text', [30, -1.6, 'Average commute time (minutes)'], {
            fontSize: 13, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // Y-axis label — single rotated text
        board.create('text', [-5.2, 5, 'Satisfaction rating'], {
            fontSize: 13, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-style: italic; transform: rotate(-90deg); white-space: nowrap;'
        });

        // ── Title ───────────────────────────────────────────────────────

        board.create('text', [30, 11, 'Employee Satisfaction'], {
            fontSize: 16, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight: bold;'
        });

        // ── Data points ─────────────────────────────────────────────────

        var data = [
            [5, 9.2], [10, 8.5], [15, 8.0], [15, 7.5], [25, 6.5],
            [30, 5.5], [35, 5.0], [40, 4.0], [45, 3.5], [50, 3.0]
        ];

        for (i = 0; i < data.length; i++) {
            board.create('point', [data[i][0], data[i][1]], {
                name: '',
                size: 4,
                color: '#2563EB',
                strokeColor: '#2563EB',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
