<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Function Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.7, 270, 5.9, -25],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 20
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        /* Axis labels */
        board.create('text', [5.6, -10, 'x'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.15, 262, 'y'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });

        /* Step function data: (0,1] \u2192 80, (1,2] \u2192 120, (2,3] \u2192 160, (3,4] \u2192 200, (4,5] \u2192 240 */
        var steps = [80, 120, 160, 200, 240];
        var N = steps.length;

        for (var i = 0; i < N; i++) {
            var xL = i;
            var xR = i + 1;
            var yV = steps[i];

            /* Horizontal segment */
            board.create('segment', [[xL, yV], [xR, yV]], {
                strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
            });

            /* Open dot at left endpoint (not included) */
            board.create('point', [xL, yV], {
                name: '', size: 4,
                fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5,
                fixed: true, highlight: false, showInfobox: false
            });

            /* Closed dot at right endpoint (included) */
            board.create('point', [xR, yV], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
