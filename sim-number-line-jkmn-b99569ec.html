<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line — J, K, M, N</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 2.5, 11.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Main line with arrows on both ends ────────────────── */
        board.create('line', [[0, 0.5], [10, 0.5]], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            straightFirst: false,
            straightLast: false,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            point1: { visible: false },
            point2: { visible: false },
            fixed: true,
            highlight: false
        });

        /* ── Points: evenly spaced at x = 2, 4, 6, 8 ─────────── */
        var positions = [
            { x: 2, label: 'J' },
            { x: 4, label: 'K' },
            { x: 6, label: 'M' },
            { x: 8, label: 'N' }
        ];

        for (var i = 0; i < positions.length; i++) {
            var px = positions[i].x;
            var pl = positions[i].label;

            /* Tick mark */
            board.create('segment', [[px, 0.2], [px, 0.8]], {
                strokeColor: '#222222',
                strokeWidth: 1.5,
                fixed: true,
                highlight: false
            });

            /* Point dot */
            board.create('point', [px, 0.5], {
                name: '',
                size: 2.5,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            /* Label above */
            board.create('text', [px, 1.4, '<b>' + pl + '</b>'], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 15,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
