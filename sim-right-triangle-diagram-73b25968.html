<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 10.5, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices (invisible)
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [8, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [0, 5.5], { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('segment', [A, B], { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [C, A], { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false });

        // Right-angle marker at A (small square)
        var sq = 0.55;
        var sqP1 = board.create('point', [sq, 0], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [sq, sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [0, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sqP2, sqP3], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // Label: '6' to the left of vertical leg AC
        board.create('text', [-0.75, 2.75, '6'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Label: 'x' below horizontal base AB (italic)
        board.create('text', [4, -0.75, '<i>x</i>'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Label: '18' along hypotenuse BC, offset outward
        var hypMidX = 4;
        var hypMidY = 2.75;
        var normLen = Math.sqrt(5.5 * 5.5 + 8 * 8);
        var offsetDist = 0.85;
        var labelX = hypMidX + (5.5 / normLen) * offsetDist;
        var labelY = hypMidY + (8 / normLen) * offsetDist;

        board.create('text', [labelX, labelY, '18'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
