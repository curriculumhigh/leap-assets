<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of g — Option Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 8, 7, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9, anchorY: 'top', offset: [0, -3] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: true,
                        includeBoundaries: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: true
                    }
                }
            },
            grid: false
        });

        // ── Manual grid lines at every integer ──
        var bbx0 = -7, bbx1 = 7, bby0 = -4, bby1 = 8;

        // Vertical grid lines
        var ix;
        for (ix = Math.ceil(bbx0); ix <= Math.floor(bbx1); ix++) {
            if (ix === 0) continue;
            board.create('line', [[ix, 0], [ix, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Horizontal grid lines
        var iy;
        for (iy = Math.ceil(bby0); iy <= Math.floor(bby1); iy++) {
            if (iy === 0) continue;
            board.create('line', [[0, iy], [1, iy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Axis labels
        board.create('text', [6.4, -0.55, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.35, 7.4, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // ── Piece 1: domain [-5, 2), decreasing ──
        // y = -0.4x + 3.8, through (-3, 5) and approaching (2, 3)
        var piece1 = board.create('functiongraph', [
            function(x) { return -0.4 * x + 3.8; },
            -5, 2
        ], {
            strokeColor: '#222222', strokeWidth: 2.3, fixed: true, highlight: false
        });

        // ── Piece 2: domain [2, 5], decreasing ──
        // y = -x + 3, through (2, 1) and (5, -2)
        var piece2 = board.create('functiongraph', [
            function(x) { return -x + 3; },
            2, 5
        ], {
            strokeColor: '#222222', strokeWidth: 2.3, fixed: true, highlight: false
        });

        // ── Key points ──

        // Open circle at (-3, 5) — g undefined, limit = 5
        board.create('point', [-3, 5], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5
        });

        // Open circle at (2, 3) — left-hand limit
        board.create('point', [2, 3], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5
        });

        // Closed dot at (2, 1) — g(2) = 1
        board.create('point', [2, 1], {
            name: '', size: 4, fixed: true, highlight: false,
            fillColor: '#222222', strokeColor: '#222222'
        });

        // ── Label ──
        board.create('text', [-5.8, 7, 'g(x)'], {
            fontSize: 11, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
