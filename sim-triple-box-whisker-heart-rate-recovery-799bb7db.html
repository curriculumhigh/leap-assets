<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple Box-and-Whisker Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [36, 10, 96, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_BOX = '#222222';
        var COL_MED = '#DC2626';
        var COL_FILL = '#E5E7EB';
        var COL_AXIS = '#444444';
        var COL_GRID = '#D1D5DB';
        var COL_LABEL = '#444444';

        // ── Data ────────────────────────────────────────────────────────
        var plots = [
            { name: 'Morning',   min: 52, q1: 60, med: 68, q3: 74, max: 82, y: 7.8 },
            { name: 'Afternoon', min: 44, q1: 54, med: 62, q3: 70, max: 88, y: 5.2 },
            { name: 'Evening',   min: 58, q1: 66, med: 76, q3: 86, max: 90, y: 2.6 }
        ];

        var boxHalf = 0.3;
        var capHalf = 0.18;

        // ── Vertical grid lines ─────────────────────────────────────────
        for (var g = 40; g <= 92; g += 2) {
            board.create('segment', [[g, -0.5], [g, 9.5]], {
                strokeColor: COL_GRID, strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Horizontal axis ─────────────────────────────────────────────
        board.create('arrow', [[39, 0.5], [94, 0.5]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels every 10, minor ticks every 2
        for (var t = 40; t <= 90; t += 2) {
            var tickLen = (t % 10 === 0) ? 0.3 : 0.15;
            board.create('segment', [[t, 0.5 - tickLen], [t, 0.5 + tickLen]], {
                strokeColor: COL_AXIS, strokeWidth: 1.0, fixed: true, highlight: false
            });
            if (t % 10 === 0) {
                board.create('text', [t, -0.15, String(t)], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 11, color: COL_AXIS, fixed: true, highlight: false
                });
            }
        }

        // Axis label centered below
        board.create('text', [65, -1.1, 'Heart-Rate Recovery (in seconds)'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: COL_AXIS, fixed: true, highlight: false,
            cssStyle: 'font-style:italic'
        });

        // ── Draw each box plot ──────────────────────────────────────────
        function drawBoxPlot(d) {
            var y = d.y;
            var yTop = y + boxHalf;
            var yBot = y - boxHalf;

            // Whisker: min to Q1
            board.create('segment', [[d.min, y], [d.q1, y]], {
                strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
            });

            // Whisker: Q3 to max
            board.create('segment', [[d.q3, y], [d.max, y]], {
                strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
            });

            // Min cap
            board.create('segment', [[d.min, y - capHalf], [d.min, y + capHalf]], {
                strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
            });

            // Max cap
            board.create('segment', [[d.max, y - capHalf], [d.max, y + capHalf]], {
                strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
            });

            // Box (Q1 to Q3) — filled polygon
            var bp1 = board.create('point', [d.q1, yBot], { visible: false, fixed: true, name: '' });
            var bp2 = board.create('point', [d.q3, yBot], { visible: false, fixed: true, name: '' });
            var bp3 = board.create('point', [d.q3, yTop], { visible: false, fixed: true, name: '' });
            var bp4 = board.create('point', [d.q1, yTop], { visible: false, fixed: true, name: '' });
            board.create('polygon', [bp1, bp2, bp3, bp4], {
                fillColor: COL_FILL, fillOpacity: 0.5,
                borders: { strokeColor: COL_BOX, strokeWidth: 1.8 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Median line
            board.create('segment', [[d.med, yBot], [d.med, yTop]], {
                strokeColor: COL_MED, strokeWidth: 2.0, fixed: true, highlight: false
            });

            // ── Value labels (just below the plot) ──────────────────────
            var labelY = yBot - 0.5;
            var vals = [d.min, d.q1, d.med, d.q3, d.max];
            for (var i = 0; i < vals.length; i++) {
                board.create('text', [vals[i], labelY, String(vals[i])], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 11, color: COL_LABEL, fixed: true, highlight: false
                });
            }

            // ── Category label (centered above the plot) ────────────────
            var centerX = (d.min + d.max) / 2;
            var labelAboveY = yTop + 0.55;
            board.create('text', [centerX, labelAboveY, d.name], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 14, color: '#222222', fixed: true, highlight: false,
                cssStyle: 'font-weight:bold'
            });
        }

        for (var p = 0; p < plots.length; p++) {
            drawBoxPlot(plots[p]);
        }
    </script>
</body>
</html>
