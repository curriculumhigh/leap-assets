<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle 15-8-17</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 11, 18, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var A = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var B = board.create('point', [15, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var C = board.create('point', [0, 8], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle sides (no fill)
        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Side labels — offset outward from each side midpoint
        // Bottom side AB: midpoint (7.5, 0), offset below
        board.create('text', [7.5, -1.1, '15 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Left side AC: midpoint (0, 4), offset to the left
        board.create('text', [-1.6, 4, '8 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Hypotenuse BC: midpoint (7.5, 4), offset outward (up-right)
        board.create('text', [8.6, 4.9, '17 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
