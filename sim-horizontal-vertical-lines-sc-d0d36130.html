<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal and Vertical Lines</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { max-width: 300px; margin: 0 auto; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 7.5, 7.5, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                }
            },
            grid: false
        });

        // Horizontal line at y = 5
        board.create('line', [[0, 5], [1, 5]], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false,
            straightFirst: true, straightLast: true,
            point1: { visible: false },
            point2: { visible: false }
        });

        // Label for y = 5
        board.create('text', [4.5, 6.3, 'y = 5'], {
            fontSize: 11, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle'
        });

        // Vertical line at x = -3
        board.create('line', [[-3, 0], [-3, 1]], {
            strokeColor: '#2563EB', strokeWidth: 1.5,
            fixed: true, highlight: false,
            straightFirst: true, straightLast: true,
            point1: { visible: false },
            point2: { visible: false }
        });

        // Label for x = -3
        board.create('text', [-5.5, -1.5, 'x = \u22123'], {
            fontSize: 11, color: '#2563EB', fixed: true, highlight: false,
            anchorX: 'middle'
        });
    </script>
</body>
</html>
