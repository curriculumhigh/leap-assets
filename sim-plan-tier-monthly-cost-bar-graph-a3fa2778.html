<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Tier Monthly Cost Bar Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 68, 5.3, -10],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Data ────────────────────────────────────────────────────────
        var tiers = [1, 2, 3, 4];
        var costs = [12, 27, 42, 57];
        var BAR_COLOR = '#2563EB';
        var BAR_WIDTH = 0.6;
        var HALF_W = BAR_WIDTH / 2;

        // ── Horizontal gridlines (every 10, from 0 to 60) ──────────────
        var i, y;
        for (i = 0; i <= 6; i++) {
            y = i * 10;
            board.create('segment', [[0, y], [4.7, y]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        // Vertical axis (y)
        board.create('segment', [[0, 0], [0, 63]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
        // Horizontal axis (x)
        board.create('segment', [[0, 0], [4.7, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Y-axis tick marks and labels (0–60 by 10) ──────────────────
        for (i = 0; i <= 6; i++) {
            y = i * 10;
            // Tick mark
            board.create('segment', [[-0.12, y], [0, y]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [-0.22, y, String(y)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── X-axis tick marks and labels (1, 2, 3, 4) ──────────────────
        for (i = 0; i < tiers.length; i++) {
            var tx = tiers[i];
            // Tick mark
            board.create('segment', [[tx, 0], [tx, -0.8]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [tx, -2.2, String(tx)], {
                fontSize: 12, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Axis titles ─────────────────────────────────────────────────
        // X-axis title
        board.create('text', [2.5, -6.5, 'Plan tier'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600'
        });

        // Y-axis title (rotated via CSS)
        board.create('text', [-0.65, 30, 'Monthly cost (dollars)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight:600; transform:rotate(-90deg); white-space:nowrap;'
        });

        // ── Bars ────────────────────────────────────────────────────────
        for (i = 0; i < tiers.length; i++) {
            var x = tiers[i];
            var h = costs[i];

            // Bar as a filled polygon
            var p1 = board.create('point', [x - HALF_W, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x + HALF_W, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x + HALF_W, h], { visible: false, name: '' });
            var p4 = board.create('point', [x - HALF_W, h], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_COLOR, fillOpacity: 0.85,
                borders: { strokeColor: BAR_COLOR, strokeWidth: 1.2 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Value label above bar
            board.create('text', [x, h + 2.2, '$' + h], {
                fontSize: 12, color: '#222222', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false, cssStyle: 'font-weight:600'
            });
        }
    </script>
</body>
</html>
