<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Segment y = 14 - x</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 16, 16, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [15.2, -0.6, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 15.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Solid segment: y = 14 - x from (0,14) to (14,0)
        var p1 = board.create('point', [0, 14], { visible: false, fixed: true, name: '' });
        var p2 = board.create('point', [14, 0], { visible: false, fixed: true, name: '' });

        board.create('segment', [p1, p2], {
            strokeColor: '#2563EB', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Open circles at endpoints
        board.create('point', [0, 14], {
            name: '', size: 5, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: '#2563EB', strokeWidth: 1.5
        });
        board.create('point', [14, 0], {
            name: '', size: 5, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: '#2563EB', strokeWidth: 1.5
        });
    </script>
</body>
</html>
