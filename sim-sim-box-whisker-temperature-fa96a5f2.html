<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-and-Whisker Plot — Temperature</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [22, 5, 83, -5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Five-number summary ─────────────────────────────────────────
        var MIN = 30, Q1 = 38, Q2 = 50, Q3 = 56, MAX = 74;

        // ── Layout constants ────────────────────────────────────────────
        var NL_Y = -1.5;
        var BOX_Y = 1.2;
        var BOX_H = 0.7;
        var CAP_H = 0.7;

        // ── Number line ─────────────────────────────────────────────────
        board.create('segment', [[24, NL_Y], [81, NL_Y]], {
            strokeColor: '#222222',
            strokeWidth: 2,
            fixed: true,
            highlight: false,
            lastArrow: false
        });

        // Tick marks and labels every 5 from 25 to 80
        var tickH = 0.4;
        for (var t = 25; t <= 80; t += 5) {
            board.create('segment', [[t, NL_Y - tickH], [t, NL_Y + tickH]], {
                strokeColor: '#222222',
                strokeWidth: 1.5,
                fixed: true,
                highlight: false
            });
            board.create('text', [t, NL_Y - tickH - 0.55, String(t)], {
                fontSize: 11,
                color: '#444444',
                anchorX: 'middle',
                anchorY: 'top',
                fixed: true,
                highlight: false
            });
        }

        // Axis label
        board.create('text', [52.5, NL_Y - 1.7, '\\text{Temperature (°F)}'], {
            fontSize: 13,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'top',
            fixed: true,
            highlight: false,
            useKatex: true
        });

        // ── Box (Q1 to Q3) — outline only ───────────────────────────────
        var boxPts = [
            board.create('point', [Q1, BOX_Y - BOX_H], { visible: false, fixed: true, name: '' }),
            board.create('point', [Q3, BOX_Y - BOX_H], { visible: false, fixed: true, name: '' }),
            board.create('point', [Q3, BOX_Y + BOX_H], { visible: false, fixed: true, name: '' }),
            board.create('point', [Q1, BOX_Y + BOX_H], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', boxPts, {
            fillColor: 'none',
            fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // ── Median line (red — reference/attention) ─────────────────────
        board.create('segment', [[Q2, BOX_Y - BOX_H], [Q2, BOX_Y + BOX_H]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Whiskers ────────────────────────────────────────────────────
        board.create('segment', [[MIN, BOX_Y], [Q1, BOX_Y]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
        board.create('segment', [[Q3, BOX_Y], [MAX, BOX_Y]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // ── Whisker caps ────────────────────────────────────────────────
        board.create('segment', [[MIN, BOX_Y - CAP_H], [MIN, BOX_Y + CAP_H]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
        board.create('segment', [[MAX, BOX_Y - CAP_H], [MAX, BOX_Y + CAP_H]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // ── Value labels below plot: all five key values ────────────────
        var LABEL_Y = BOX_Y - BOX_H - 0.55;
        var labelVals = [
            [MIN, '30'],
            [Q1, '38'],
            [Q2, '50'],
            [Q3, '56'],
            [MAX, '74']
        ];
        for (var v = 0; v < labelVals.length; v++) {
            board.create('text', [labelVals[v][0], LABEL_Y, labelVals[v][1]], {
                fontSize: 12,
                color: '#222222',
                cssStyle: 'font-weight:bold',
                anchorX: 'middle',
                anchorY: 'top',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
