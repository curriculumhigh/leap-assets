<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity vs Time</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 72, 11.5, -8],
            axis: true,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                }
            }
        });

        // Manual grid lines — darker for visibility
        var GRID_COL = '#B0B5BD';
        var GRID_W = 0.6;
        var i;

        // Vertical grid lines every 1 unit
        for (i = -1; i <= 11; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true,
                layer: 1
            });
        }
        // Horizontal grid lines every 10 units
        for (i = -10; i <= 70; i += 10) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true,
                layer: 1
            });
        }

        // Axis labels (KaTeX)
        board.create('text', [11.0, -2.5, 't'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.35, 69, 'v(t)'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Monotone cubic Hermite spline (Fritsch-Carlson) through data points
        var dataX = [0, 2, 4, 6, 8, 10];
        var dataY = [60, 45, 25, 10, 3, 0];
        var n = dataX.length;

        var dx = [];
        var dy = [];
        var slopes = [];
        var m = [];

        for (i = 0; i < n - 1; i++) {
            dx[i] = dataX[i + 1] - dataX[i];
            dy[i] = dataY[i + 1] - dataY[i];
            slopes[i] = dy[i] / dx[i];
        }

        m[0] = slopes[0];
        for (i = 1; i < n - 1; i++) {
            if (slopes[i - 1] * slopes[i] <= 0) {
                m[i] = 0;
            } else {
                m[i] = (slopes[i - 1] + slopes[i]) / 2;
            }
        }
        m[n - 1] = slopes[n - 2];

        for (i = 0; i < n - 1; i++) {
            if (Math.abs(slopes[i]) < 1e-12) {
                m[i] = 0;
                m[i + 1] = 0;
            } else {
                var alpha = m[i] / slopes[i];
                var beta = m[i + 1] / slopes[i];
                var tau = alpha * alpha + beta * beta;
                if (tau > 9) {
                    var s = 3 / Math.sqrt(tau);
                    m[i] = s * alpha * slopes[i];
                    m[i + 1] = s * beta * slopes[i];
                }
            }
        }

        function vOfT(t) {
            if (t <= dataX[0]) return dataY[0];
            if (t >= dataX[n - 1]) return dataY[n - 1];

            var k = 0;
            for (var j = 0; j < n - 1; j++) {
                if (t >= dataX[j] && t <= dataX[j + 1]) {
                    k = j;
                    break;
                }
            }

            var h = dx[k];
            var sv = (t - dataX[k]) / h;
            var s2 = sv * sv;
            var s3 = s2 * sv;

            var h00 = 2 * s3 - 3 * s2 + 1;
            var h10 = s3 - 2 * s2 + sv;
            var h01 = -2 * s3 + 3 * s2;
            var h11 = s3 - s2;

            return h00 * dataY[k] + h10 * h * m[k] + h01 * dataY[k + 1] + h11 * h * m[k + 1];
        }

        // Plot the curve
        board.create('functiongraph', [
            function(t) { return vOfT(t); },
            0, 10
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            layer: 5
        });

        // Curve label — name only
        board.create('text', [1.2, 55, 'v(t)'], {
            fontSize: 13,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
