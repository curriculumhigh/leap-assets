<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Garden with Fountain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 14.5, 14.5, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var G = 12;
        var GX = 0, GY = 0;
        var cx = 6, cy = 6;

        var F = 6.6;
        var fHalf = F / 2;

        var COL_GARDEN_FILL = '#059669';
        var COL_GARDEN_STROKE = '#065F46';
        var COL_FOUNTAIN_FILL = '#2563EB';
        var COL_FOUNTAIN_STROKE = '#1D4ED8';
        var COL_DIM = '#222222';

        function pt(x, y) {
            return board.create('point', [x, y], { visible: false, fixed: true, name: '' });
        }

        var g1 = pt(GX, GY);
        var g2 = pt(GX + G, GY);
        var g3 = pt(GX + G, GY + G);
        var g4 = pt(GX, GY + G);

        board.create('polygon', [g1, g2, g3, g4], {
            fillColor: COL_GARDEN_FILL, fillOpacity: 0.12,
            borders: { strokeColor: COL_GARDEN_STROKE, strokeWidth: 2.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var f1 = pt(cx - fHalf, cy - fHalf);
        var f2 = pt(cx + fHalf, cy - fHalf);
        var f3 = pt(cx + fHalf, cy + fHalf);
        var f4 = pt(cx - fHalf, cy + fHalf);

        board.create('polygon', [f1, f2, f3, f4], {
            fillColor: COL_FOUNTAIN_FILL, fillOpacity: 0.15,
            borders: { strokeColor: COL_FOUNTAIN_STROKE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('circle', [pt(cx, cy), 0.85], {
            strokeColor: COL_FOUNTAIN_STROKE, strokeWidth: 1.0,
            fillColor: COL_FOUNTAIN_FILL, fillOpacity: 0.10,
            fixed: true, highlight: false
        });
        board.create('circle', [pt(cx, cy), 0.4], {
            strokeColor: COL_FOUNTAIN_STROKE, strokeWidth: 0.8,
            fillColor: COL_FOUNTAIN_FILL, fillOpacity: 0.18,
            fixed: true, highlight: false
        });
        board.create('point', [cx, cy], {
            name: '', fixed: true, size: 1.5, color: COL_FOUNTAIN_STROKE,
            strokeColor: COL_FOUNTAIN_STROKE, highlight: false
        });

        board.create('text', [cx, GY + G - 1.2, '\\text{Garden}'], {
            useKatex: true, fontSize: 14, color: COL_GARDEN_STROKE,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [cx, cy + fHalf - 0.7, '\\text{Fountain}'], {
            useKatex: true, fontSize: 12, color: COL_FOUNTAIN_STROKE,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var dimY = -1.2;
        var arrOff = 0.15;

        board.create('arrow', [[GX + arrOff, dimY], [GX + G - arrOff, dimY]], {
            strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, firstArrow: { type: 2, size: 5 }
        });

        board.create('segment', [[GX, dimY - 0.3], [GX, dimY + 0.3]], {
            strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[GX + G, dimY - 0.3], [GX + G, dimY + 0.3]], {
            strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false
        });

        board.create('text', [cx, dimY - 0.7, '12 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: COL_DIM,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var fdimX = cx + fHalf + 0.9;

        board.create('arrow', [[fdimX, cy - fHalf + arrOff], [fdimX, cy + fHalf - arrOff]], {
            strokeColor: COL_FOUNTAIN_STROKE, strokeWidth: 1.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, firstArrow: { type: 2, size: 5 }
        });

        board.create('segment', [[fdimX - 0.25, cy - fHalf], [fdimX + 0.25, cy - fHalf]], {
            strokeColor: COL_FOUNTAIN_STROKE, strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[fdimX - 0.25, cy + fHalf], [fdimX + 0.25, cy + fHalf]], {
            strokeColor: COL_FOUNTAIN_STROKE, strokeWidth: 1.0, fixed: true, highlight: false
        });

        board.create('text', [fdimX + 0.7, cy, 'x'], {
            useKatex: true, fontSize: 15, color: COL_FOUNTAIN_STROKE,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight: bold;',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
