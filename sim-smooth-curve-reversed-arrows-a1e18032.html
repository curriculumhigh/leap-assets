<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Curve — Reversed Arrows</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 8.5, 18, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 8, anchorX: 'middle' },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        minTicksDistance: 0,
                        includeBoundaries: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [17.2, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 8.0, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // The five points: (0,-1), (1,1), (4,3), (9,5), (16,7)
        // Parametric: x(t) = t^2, y(t) = 2t - 1, t from 0 to 4
        board.create('curve', [
            function(t) { return t * t; },
            function(t) { return 2 * t - 1; },
            0, 4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Plot the five key points
        var pts = [[0, -1], [1, 1], [4, 3], [9, 5], [16, 7]];
        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 3, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });
        }

        // Directional arrows pointing RIGHT-TO-LEFT (toward decreasing t)
        var arrowTs = [3.5, 2.2, 0.8];
        var dt = 0.12;
        for (var a = 0; a < arrowTs.length; a++) {
            var t1 = arrowTs[a] + dt;
            var t2 = arrowTs[a] - dt;
            board.create('segment', [
                [t1 * t1, 2 * t1 - 1],
                [t2 * t2, 2 * t2 - 1]
            ], {
                strokeColor: '#222222',
                strokeWidth: 1.8,
                lastArrow: { type: 2, size: 5 },
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
