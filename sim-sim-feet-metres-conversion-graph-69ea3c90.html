<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Graph — Feet to Metres</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-700, 2200, 7500, -250],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Minor grid lines every 100 units ────────────────────────────
        var i;
        for (i = 0; i <= 7000; i += 100) {
            board.create('segment', [[i, 0], [i, 2000]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.3,
                fixed: true,
                highlight: false
            });
        }
        for (i = 0; i <= 2000; i += 100) {
            board.create('segment', [[0, i], [7000, i]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.3,
                fixed: true,
                highlight: false
            });
        }

        // ── Major grid lines ────────────────────────────────────────────
        for (i = 0; i <= 7000; i += 1000) {
            board.create('segment', [[i, 0], [i, 2000]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.6,
                fixed: true,
                highlight: false
            });
        }
        for (i = 0; i <= 2000; i += 500) {
            board.create('segment', [[0, i], [7000, i]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.6,
                fixed: true,
                highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        board.create('arrow', [[0, 0], [7300, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.0,
            lastArrow: { type: 2, size: 4 },
            fixed: true,
            highlight: false
        });
        board.create('arrow', [[0, 0], [0, 2100]], {
            strokeColor: '#444444',
            strokeWidth: 1.0,
            lastArrow: { type: 2, size: 4 },
            fixed: true,
            highlight: false
        });

        // ── Tick marks and labels — X-axis (every 1000) ────────────────
        for (i = 1000; i <= 7000; i += 1000) {
            board.create('segment', [[i, -30], [i, 30]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -80, String(i)], {
                fontSize: 8,
                color: '#444444',
                anchorX: 'middle',
                anchorY: 'top',
                fixed: true,
                highlight: false
            });
        }

        // ── Tick marks and labels — Y-axis (every 500) ─────────────────
        for (i = 500; i <= 2000; i += 500) {
            board.create('segment', [[-50, i], [50, i]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            board.create('text', [-100, i, String(i)], {
                fontSize: 8,
                color: '#444444',
                anchorX: 'right',
                anchorY: 'middle',
                fixed: true,
                highlight: false
            });
        }

        // Origin label
        board.create('text', [-100, -80, '0'], {
            fontSize: 8,
            color: '#444444',
            anchorX: 'right',
            anchorY: 'top',
            fixed: true,
            highlight: false
        });

        // ── Axis name labels ────────────────────────────────────────────
        board.create('text', [7100, -130, '<i>Feet</i>'], {
            fontSize: 10,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'top',
            fixed: true,
            highlight: false
        });
        board.create('text', [-200, 2080, '<i>Metres</i>'], {
            fontSize: 10,
            color: '#222222',
            anchorX: 'right',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // ── Conversion line — through (0,0) and (6200, 1900) ───────────
        var slope = 1900 / 6200;
        var xEnd = 2000 / slope;

        board.create('segment', [[0, 0], [xEnd, 2000]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // ── Key points ──────────────────────────────────────────────────
        board.create('point', [0, 0], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        board.create('point', [6200, 1900], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
