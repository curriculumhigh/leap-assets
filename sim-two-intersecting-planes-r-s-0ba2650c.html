<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Intersecting Planes R and S</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 8, 12, -1],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Intersection line endpoints (the shared edge of both planes) ──
        var intL = [2.5, 3.0];
        var intR = [9.5, 3.0];

        // ── Plane R (more horizontal, tilted back — contains E, F, G) ──
        var planeR_pts = [
            board.create('point', [0.5, 1.2], { visible: false, fixed: true, name: '' }),
            board.create('point', [10.5, 1.2], { visible: false, fixed: true, name: '' }),
            board.create('point', [intR[0], intR[1]], { visible: false, fixed: true, name: '' }),
            board.create('point', [intL[0], intL[1]], { visible: false, fixed: true, name: '' })
        ];

        var planeR = board.create('polygon', planeR_pts, {
            fillColor: '#2563EB', fillOpacity: 0.07,
            borders: { strokeColor: '#555555', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Plane S (angled upward from intersection line) ──
        var planeS_pts = [
            board.create('point', [intL[0], intL[1]], { visible: false, fixed: true, name: '' }),
            board.create('point', [intR[0], intR[1]], { visible: false, fixed: true, name: '' }),
            board.create('point', [10.8, 6.8], { visible: false, fixed: true, name: '' }),
            board.create('point', [1.2, 6.8], { visible: false, fixed: true, name: '' })
        ];

        var planeS = board.create('polygon', planeS_pts, {
            fillColor: '#059669', fillOpacity: 0.07,
            borders: { strokeColor: '#555555', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Intersection line (drawn on top, prominent) ──
        board.create('segment', [planeR_pts[3], planeR_pts[2]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false, layer: 7
        });

        // ── Line EF in Plane R ──
        var ptE = [3.5, 1.8];
        var ptF = [8.5, 2.6];

        // Extend line slightly beyond E and F
        var dx = ptF[0] - ptE[0];
        var dy = ptF[1] - ptE[1];
        var ext = 0.6;
        var lineEF_start = [ptE[0] - ext * dx / Math.sqrt(dx * dx + dy * dy) * 2, ptE[1] - ext * dy / Math.sqrt(dx * dx + dy * dy) * 2];
        var lineEF_end = [ptF[0] + ext * dx / Math.sqrt(dx * dx + dy * dy) * 2, ptF[1] + ext * dy / Math.sqrt(dx * dx + dy * dy) * 2];

        board.create('segment', [lineEF_start, lineEF_end], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Points on Plane R ──
        // Point E
        board.create('point', ptE, {
            name: 'E', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });

        // Point F
        board.create('point', ptF, {
            name: 'F', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [6, -14] }
        });

        // Point G (off line EF, but on Plane R)
        board.create('point', [5.2, 1.4], {
            name: 'G', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-2, -16] }
        });

        // ── Points on Plane S ──
        // Point H
        board.create('point', [4.5, 5.5], {
            name: 'H', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-6, 8] }
        });

        // Point N
        board.create('point', [7.8, 5.0], {
            name: 'N', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [6, 8] }
        });

        // ── Plane labels ──
        board.create('text', [8.8, 1.6, '<i style="font-size:16px; color:#2563EB; font-weight:600;">R</i>'], {
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        board.create('text', [9.2, 6.0, '<i style="font-size:16px; color:#059669; font-weight:600;">S</i>'], {
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
