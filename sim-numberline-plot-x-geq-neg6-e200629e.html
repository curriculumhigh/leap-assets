<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line Plot: x ≥ -6</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9, 3, 9, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_LINE = '#2563EB';
        var COL_TICK = '#444444';
        var COL_BASE = '#222222';
        var Y = 0;

        // Base number line (thin, dark, with arrows on both ends)
        board.create('arrow', [[-8.5, Y], [8.5, Y]], {
            strokeColor: COL_BASE,
            strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });
        board.create('arrow', [[8.5, Y], [-8.5, Y]], {
            strokeColor: COL_BASE,
            strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels at each integer from -8 to 8
        var i;
        for (i = -8; i <= 8; i++) {
            // Short tick mark
            board.create('segment', [[i, Y - 0.15], [i, Y + 0.15]], {
                strokeColor: COL_TICK,
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            // Label below tick
            board.create('text', [i, Y - 0.5, String(i)], {
                fontSize: 12,
                anchorX: 'middle',
                anchorY: 'top',
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Solution ray: x >= -6 (thick blue from -6 to the right with arrow)
        board.create('arrow', [[-6, Y], [8.5, Y]], {
            strokeColor: COL_LINE,
            strokeWidth: 3.5,
            lastArrow: { type: 2, size: 7 },
            fixed: true,
            highlight: false
        });

        // Closed endpoint at x = -6 (filled blue circle)
        board.create('point', [-6, Y], {
            name: '',
            size: 5,
            color: COL_LINE,
            fillColor: COL_LINE,
            strokeColor: COL_LINE,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
