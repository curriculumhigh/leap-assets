<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square and Rectangle with Dimensions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 9, 19.5, -3.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_OUTLINE = '#555555';
        var COL_MEASURE = '#3B82F6';
        var COL_RIGHT = '#DC2626';
        var COL_VERTEX = '#222222';
        var RA = 0.45;

        function drawRightAngle(cx, cy, dx1, dy1, dx2, dy2) {
            var p1x = cx + RA * dx1, p1y = cy + RA * dy1;
            var p2x = cx + RA * dx1 + RA * dx2, p2y = cy + RA * dy1 + RA * dy2;
            var p3x = cx + RA * dx2, p3y = cy + RA * dy2;

            board.create('segment', [[p1x, p1y], [p2x, p2y]], {
                strokeColor: COL_RIGHT, strokeWidth: 1.5, fixed: true, highlight: false
            });
            board.create('segment', [[p2x, p2y], [p3x, p3y]], {
                strokeColor: COL_RIGHT, strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        function makeVertex(x, y, name, offsetX, offsetY) {
            return board.create('point', [x, y], {
                name: name, fixed: true, size: 2, color: COL_VERTEX,
                highlight: false, showInfobox: false,
                label: { fontSize: 14, color: COL_VERTEX, offset: [offsetX, offsetY], fontWeight: 'bold' }
            });
        }

        function dimLabel(x, y, text) {
            board.create('text', [x, y, text], {
                useKatex: true, fontSize: 13, color: COL_MEASURE,
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ================================================================
        // SQUARE: side = 3, bottom-left at (0, 0)
        // ================================================================
        var sq = { x: 0, y: 0, s: 3 };

        var A = makeVertex(sq.x, sq.y, 'A', -14, -14);
        var B = makeVertex(sq.x + sq.s, sq.y, 'B', 8, -14);
        var C = makeVertex(sq.x + sq.s, sq.y + sq.s, 'C', 8, 8);
        var D = makeVertex(sq.x, sq.y + sq.s, 'D', -14, 8);

        board.create('polygon', [A, B, C, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        drawRightAngle(sq.x, sq.y, 1, 0, 0, 1);
        drawRightAngle(sq.x + sq.s, sq.y, 0, 1, -1, 0);
        drawRightAngle(sq.x + sq.s, sq.y + sq.s, -1, 0, 0, -1);
        drawRightAngle(sq.x, sq.y + sq.s, 0, -1, 1, 0);

        dimLabel(sq.x + sq.s / 2, sq.y - 0.7, '3');
        dimLabel(sq.x + sq.s / 2, sq.y + sq.s + 0.7, '3');
        dimLabel(sq.x - 0.7, sq.y + sq.s / 2, '3');
        dimLabel(sq.x + sq.s + 0.7, sq.y + sq.s / 2, '3');

        // ================================================================
        // RECTANGLE: 9 wide × 6 tall, bottom-left at (7, 0)
        // ================================================================
        var rc = { x: 7, y: 0, w: 9, h: 6 };

        var E = makeVertex(rc.x, rc.y, 'E', -14, -14);
        var F = makeVertex(rc.x + rc.w, rc.y, 'F', 8, -14);
        var G = makeVertex(rc.x + rc.w, rc.y + rc.h, 'G', 8, 8);
        var H = makeVertex(rc.x, rc.y + rc.h, 'H', -14, 8);

        board.create('polygon', [E, F, G, H], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        drawRightAngle(rc.x, rc.y, 1, 0, 0, 1);
        drawRightAngle(rc.x + rc.w, rc.y, 0, 1, -1, 0);
        drawRightAngle(rc.x + rc.w, rc.y + rc.h, -1, 0, 0, -1);
        drawRightAngle(rc.x, rc.y + rc.h, 0, -1, 1, 0);

        dimLabel(rc.x + rc.w / 2, rc.y - 0.7, '9');
        dimLabel(rc.x + rc.w / 2, rc.y + rc.h + 0.7, '9');
        dimLabel(rc.x - 0.7, rc.y + rc.h / 2, '6');
        dimLabel(rc.x + rc.w + 0.7, rc.y + rc.h / 2, '6');
    </script>
</body>
</html>
