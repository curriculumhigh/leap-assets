<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of sqrt(-x+5)+4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 9.5, 7.5, -1.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        /* Manual axes with forced tick distance */
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                label: { fontSize: 8, offset: [0, -10], anchorX: 'middle' },
                drawZero: false,
                includeBoundaries: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                label: { fontSize: 8, offset: [-12, 0], anchorX: 'right' },
                drawZero: false,
                includeBoundaries: false
            }
        });

        /* Axis labels near arrow tips */
        board.create('text', [7.0, -0.6, '<i>x</i>'], {
            fontSize: 11, fixed: true, highlight: false
        });
        board.create('text', [0.3, 9.0, '<i>y</i>'], {
            fontSize: 11, fixed: true, highlight: false
        });

        /* f(x) = sqrt(5 - x) + 4, domain x <= 5 */
        board.create('functiongraph', [
            function(x) {
                if (x > 5) return NaN;
                return Math.sqrt(5 - x) + 4;
            },
            -7, 5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        /* Endpoint at (5, 4) */
        board.create('point', [5, 4], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
