<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Function — Four Segments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.8, 4.8, 7.8, -9.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.4, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 4.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Color & style constants ─────────────────────────────────────
        var COL = '#222222';
        var SEG_WIDTH = 1.8;
        var PT_SIZE = 5;

        // ── Piece definitions ───────────────────────────────────────────
        // Each piece: [xLeft, xRight, yVal]
        var pieces = [
            [-3, -1,  2],
            [-1,  1, -1],
            [ 1,  3, -4],
            [ 3,  5, -7]
        ];

        // ── Draw each piece ─────────────────────────────────────────────
        for (var i = 0; i < pieces.length; i++) {
            var xL = pieces[i][0];
            var xR = pieces[i][1];
            var yV = pieces[i][2];

            // Horizontal segment
            board.create('segment', [[xL, yV], [xR, yV]], {
                strokeColor: COL, strokeWidth: SEG_WIDTH, fixed: true, highlight: false
            });

            // Open circle at left endpoint
            board.create('point', [xL, yV], {
                name: '', size: PT_SIZE,
                fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
                fixed: true, highlight: false, showInfobox: false
            });

            // Closed circle at right endpoint
            board.create('point', [xR, yV], {
                name: '', size: PT_SIZE,
                fillColor: COL, strokeColor: COL,
                fixed: true, highlight: false, showInfobox: false
            });
        }

        // ── Function label ──────────────────────────────────────────────
        board.create('text', [5.8, 2.5, 'f(x)'], {
            fontSize: 13, color: COL, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
