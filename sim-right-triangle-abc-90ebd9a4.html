<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle ABC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 11.5, 15, -3.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var B = board.create('point', [0, 0], { name: '', visible: false, fixed: true });
        var C = board.create('point', [12, 0], { name: '', visible: false, fixed: true });
        var A = board.create('point', [0, 9], { name: '', visible: false, fixed: true });

        // Triangle — no fill, dark gray stroke
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Right-angle marker at B (small square in interior corner)
        var sqSize = 0.8;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // Vertex labels — bold, offset from corners
        board.create('text', [-1.0, 9.4, '<b>A</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [-1.0, -0.6, '<b>B</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [13.0, -0.6, '<b>C</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // Side labels
        // AB = 9, left of midpoint of vertical side
        board.create('text', [-1.2, 4.5, '<b>9</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // BC = 12, below midpoint of horizontal side
        board.create('text', [6, -1.2, '<b>12</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // AC = 15, above-right of midpoint of hypotenuse
        board.create('text', [7.2, 5.4, '<b>15</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
