<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola and Horizontal Line — No Intersection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 7.5, 5.5, -3.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 7.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Primary curve: f(x) = -3x² + 6x ────────────────────────────
        board.create('functiongraph', [
            function(x) { return -3 * x * x + 6 * x; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Secondary curve: g(x) = 5 ──────────────────────────────────
        board.create('functiongraph', [
            function(x) { return 5; }
        ], { strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Key points ──────────────────────────────────────────────────
        // Origin (0, 0)
        board.create('point', [0, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [-0.15, -0.65, '(0,\\,0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'right', fixed: true, highlight: false
        });

        // (2, 0)
        board.create('point', [2, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [2.15, -0.65, '(2,\\,0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });

        // Vertex (1, 3)
        board.create('point', [1, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [1.25, 3.45, '(1,\\,3)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });

        // ── Function labels (name only) ─────────────────────────────────
        // f(x) label — placed on the falling right branch
        board.create('text', [3.2, -3.0, 'f(x)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });

        // g(x) label — placed to the right on the line
        board.create('text', [4.2, 5.45, 'g(x)'], {
            useKatex: true, fontSize: 13, color: '#2563EB',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
