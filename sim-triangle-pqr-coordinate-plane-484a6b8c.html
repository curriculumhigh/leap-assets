<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle PQR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 5.8, 5.5, -6.8],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.1, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 5.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices — reduced size
        var P = board.create('point', [-5, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var Q = board.create('point', [3, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var R = board.create('point', [3, -4], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Triangle sides (no fill)
        board.create('segment', [P, Q], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [Q, R], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [R, P], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Vertex labels — KaTeX
        // P(-5, 3) — upper-left, shifted a bit more to the right
        board.create('text', [-5.0, 3.7, 'P(-5,\\, 3)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // Q(3, 3) — upper-right
        board.create('text', [3.4, 3.7, 'Q(3,\\, 3)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // R(3, -4) — lower-right
        board.create('text', [3.4, -4.5, 'R(3,\\, -4)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
