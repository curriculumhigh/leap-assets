<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Inequality Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.2, 5.8, 5.2, -3.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.8, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 5.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola function: y = -x^2 + 2x + 3 = -(x+1)(x-3), vertex at (1,4)
        var f = function(x) { return -x * x + 2 * x + 3; };

        // Shaded region below the parabola
        var shadedRegion = board.create('curve', [[], []], {
            strokeWidth: 0,
            fillColor: '#888888',
            fillOpacity: 0.15,
            fixed: true,
            highlight: false
        });

        var xMin = -3.2;
        var xMax = 5.2;
        var yMin = -3.8;
        var nPts = 200;
        var xCoords = [];
        var yCoords = [];

        // Top boundary: the parabola from left to right
        for (var i = 0; i <= nPts; i++) {
            var x = xMin + (xMax - xMin) * i / nPts;
            xCoords.push(x);
            yCoords.push(f(x));
        }
        // Bottom boundary: straight line along the bottom of bounding box, right to left
        xCoords.push(xMax);
        yCoords.push(yMin);
        xCoords.push(xMin);
        yCoords.push(yMin);
        // Close back to start
        xCoords.push(xMin);
        yCoords.push(f(xMin));

        shadedRegion.dataX = xCoords;
        shadedRegion.dataY = yCoords;

        // Dashed parabola boundary curve
        board.create('functiongraph', [f, -3.2, 5.2], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            dash: 2,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
