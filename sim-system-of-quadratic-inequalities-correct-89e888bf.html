<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities — Correct</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 12, 9, -11],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.4, -0.8, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 11.3, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Functions
        function f(x) { return -x * x + 2 * x + 3; }
        function g(x) { return x * x - 4 * x - 5; }

        // Upper envelope: max(f, g)
        function upperEnvelope(x) { return Math.max(f(x), g(x)); }

        var X_LEFT = -7;
        var X_RIGHT = 9;
        var Y_TOP = 12;
        var STEP = 0.12;

        // Shaded region: y >= max(f(x), g(x))
        var shadePts = [];
        var xi;
        for (xi = X_LEFT; xi <= X_RIGHT + 0.001; xi += STEP) {
            shadePts.push([xi, upperEnvelope(xi)]);
        }
        shadePts.push([X_RIGHT, upperEnvelope(X_RIGHT)]);
        shadePts.push([X_RIGHT, Y_TOP]);
        shadePts.push([X_LEFT, Y_TOP]);

        var shadePoints = [];
        for (var i = 0; i < shadePts.length; i++) {
            shadePoints.push(board.create('point', shadePts[i], { visible: false, fixed: true, name: '' }));
        }
        board.create('polygon', shadePoints, {
            fillColor: '#888888', fillOpacity: 0.15,
            borders: { strokeWidth: 0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Parabola 1: f(x) = -x^2 + 2x + 3 — SOLID, primary
        board.create('functiongraph', [f, X_LEFT, X_RIGHT], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Parabola 2: g(x) = x^2 - 4x - 5 — DASHED, secondary
        board.create('functiongraph', [g, X_LEFT, X_RIGHT], {
            strokeColor: '#2563EB', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Labels (name only)
        board.create('text', [-5.5, -3, 'f(x)'], {
            fontSize: 9, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [7, 5.5, 'g(x)'], {
            fontSize: 9, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
