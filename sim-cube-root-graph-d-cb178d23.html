<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Root Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.5, 12.5, -9.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Create axes manually for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false,
                label: { fontSize: 9, offset: [0, -10] },
                drawZero: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false,
                label: { fontSize: 9, offset: [-12, 0] },
                drawZero: false
            }
        });

        // Grid — create manually since axis:false
        board.create('grid', [], {
            strokeColor: '#D1D5DB',
            strokeWidth: 0.4
        });

        // Axis labels near arrow tips
        board.create('text', [12.0, -0.7, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.3, 5.0, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // f(x) = 2 * cbrt(x - 4) - 3
        board.create('functiongraph', [
            function(x) {
                var inner = x - 4;
                var cbrt = (inner >= 0) ? Math.pow(inner, 1 / 3) : -Math.pow(-inner, 1 / 3);
                return 2 * cbrt - 3;
            },
            -1.5, 12.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
