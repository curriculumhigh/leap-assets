<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Alternating Signs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 8px; height: calc(100% - 16px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 7.5, 7.5, -11.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 7,
                        minorHeight: 8,
                        ticksDistance: 2
                    }
                }
            },
            grid: false
        });

        // Major gridlines — every 1 unit on x, every 2 units on y
        var bb = board.getBoundingBox();
        var ix, iy;
        for (ix = Math.ceil(bb[0]); ix <= Math.floor(bb[2]); ix++) {
            board.create('line', [[ix, 0], [ix, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        for (iy = Math.ceil(bb[3] / 2) * 2; iy <= Math.floor(bb[1] / 2) * 2; iy += 2) {
            board.create('line', [[0, iy], [1, iy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Minor gridlines — every 0.25 units on y axis only
        for (iy = Math.ceil(bb[3] * 4) / 4; iy <= Math.floor(bb[1] * 4) / 4; iy += 0.25) {
            // Skip positions where a major gridline already exists
            if (Math.abs(iy - Math.round(iy / 2) * 2) < 0.01) continue;
            board.create('line', [[0, iy], [1, iy]], {
                strokeColor: '#E5E7EB', strokeWidth: 0.3,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Axis labels
        board.create('text', [7.0, -0.9, 'n'], { useKatex: true, fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.25, 6.8, 'a_n'], { useKatex: true, fontSize: 11, fixed: true, highlight: false });

        // Data points
        var data = [
            [1, -8],
            [2, 4],
            [3, -2],
            [4, 1],
            [5, -0.5],
            [6, 0.25]
        ];

        for (var i = 0; i < data.length; i++) {
            board.create('point', [data[i][0], data[i][1]], {
                name: '',
                size: 3,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
