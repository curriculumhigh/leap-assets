<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Beach Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #222222;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            font-weight: 600;
            color: #222222;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
            <div class="coord-tooltip" id="tooltip"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [35, 215, 265, 35],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Tooltip logic ───────────────────────────────────────────────
        var tooltip = document.getElementById('tooltip');
        var boardWrapper = document.querySelector('.board-wrapper');

        function showTooltip(pt) {
            var xVal = Math.round(pt.X());
            var yVal = Math.round(pt.Y());
            tooltip.textContent = '(' + xVal + ', ' + yVal + ')';
            tooltip.style.display = 'block';

            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var boardEl = document.getElementById('board');
            var boardRect = boardEl.getBoundingClientRect();
            var wrapperRect = boardWrapper.getBoundingClientRect();

            var sx = coords.scrCoords[1] + (boardRect.left - wrapperRect.left);
            var sy = coords.scrCoords[2] + (boardRect.top - wrapperRect.top);

            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 32) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // ── Grid lines (every 10 units) ─────────────────────────────────
        var i;
        for (i = 50; i <= 250; i += 10) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        for (i = 50; i <= 200; i += 10) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        board.create('arrow', [[50, 50], [255, 50]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        board.create('arrow', [[50, 50], [50, 210]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Tick marks and labels on x-axis (every 10, labels every 50) ─
        for (i = 50; i <= 250; i += 10) {
            board.create('segment', [[i, 49], [i, 51]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            if (i % 50 === 0) {
                board.create('text', [i, 44, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                    fixed: true, highlight: false
                });
            }
        }

        // ── Tick marks and labels on y-axis (every 10, labels every 50) ─
        for (i = 50; i <= 200; i += 10) {
            board.create('segment', [[49, i], [51, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            if (i % 50 === 0) {
                board.create('text', [46, i, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // ── Axis labels ─────────────────────────────────────────────────
        board.create('text', [150, 38, '<i>People at Beach 1</i>'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        board.create('text', [38, 130, '<i>People at Beach 2</i>'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'transform: rotate(-90deg); transform-origin: center center; white-space: nowrap;'
        });

        // ── Data points with hover tooltips ─────────────────────────────
        var data = [
            [120, 95],
            [80, 60],
            [200, 180],
            [150, 140],
            [60, 50],
            [170, 155],
            [100, 85]
        ];

        for (var d = 0; d < data.length; d++) {
            var pt = board.create('point', data[d], {
                name: '', size: 4, color: '#222222',
                fixed: true, showInfobox: false,
                highlight: true,
                highlightFillColor: '#222222',
                highlightStrokeColor: '#222222',
                highlightSize: 6
            });
            pt.on('over', (function(p) {
                return function() { showTooltip(p); };
            })(pt));
            pt.on('out', function() { hideTooltip(); });
        }
    </script>
</body>
</html>
