<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x > -4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 2.5, 6, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Y = 0;
        var TICK_H = 0.25;
        var COL_LINE = '#444444';
        var COL_RAY = '#2563EB';
        var COL_TICK = '#222222';

        // Base number line with arrows on both ends
        board.create('arrow', [[-5.5, Y], [5.5, Y]], {
            strokeColor: COL_LINE,
            strokeWidth: 1.8,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels at each integer from -5 to 5
        for (var i = -5; i <= 5; i++) {
            board.create('segment', [[i, Y - TICK_H], [i, Y + TICK_H]], {
                strokeColor: COL_TICK,
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, Y - 1.0, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 11,
                color: COL_TICK,
                fixed: true,
                highlight: false
            });
        }

        // Solution ray: from -4 to the right (x > -4)
        board.create('arrow', [[-4, Y], [5.5, Y]], {
            strokeColor: COL_RAY,
            strokeWidth: 3.5,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });

        // Open circle at x = -4 (strict inequality, not included)
        board.create('point', [-4, Y], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: COL_RAY,
            strokeWidth: 2,
            fixed: true,
            highlight: false
        });

    </script>
</body>
</html>
