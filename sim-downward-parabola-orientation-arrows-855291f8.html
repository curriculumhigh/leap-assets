<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downward-Opening Parabola — Orientation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 11, 4.5, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.9, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.25, 10.4, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Parabola y = 9 - x^2, parametrized left to right:
        // t goes from -3 to 3, point = (t, 9 - t^2)
        // Orientation: left to right, arrows from (-3, 0) to (3, 0)

        // Main curve
        board.create('curve', [
            function(t) { return t; },
            function(t) { return 9 - t * t; },
            -3, 3
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Endpoint dots — no labels
        board.create('point', [-3, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [3, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });

        // Orientation arrowheads along the curve
        // Direction of travel: t increases from -3 to 3 (left to right)
        // At parameter t, position = (t, 9 - t^2), tangent = (1, -2t)
        // Place arrowheads at t = -1.8, t = 0, t = 1.8

        var arrowParams = [-1.8, 0, 1.8];
        var arrowLen = 0.4;

        for (var i = 0; i < arrowParams.length; i++) {
            var t = arrowParams[i];
            var px = t;
            var py = 9 - t * t;
            // Tangent at t: dx/dt = 1, dy/dt = -2t
            var dx = 1;
            var dy = -2 * t;
            var mag = Math.sqrt(dx * dx + dy * dy);
            var ux = dx / mag;
            var uy = dy / mag;

            // Arrow from slightly behind to the point
            var x1 = px - arrowLen * ux;
            var y1 = py - arrowLen * uy;

            board.create('segment', [[x1, y1], [px, py]], {
                strokeColor: '#222222',
                strokeWidth: 1.5,
                fixed: true,
                highlight: false,
                lastArrow: { type: 2, size: 5 }
            });
        }
    </script>
</body>
</html>
