<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Function with Slant Asymptote</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { width: 300px; height: 300px; margin: 0; padding: 6px; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 8, 8, -8],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    firstArrow: { type: 2, size: 6 },
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    firstArrow: { type: 2, size: 6 },
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: false
        });

        // Manual 1x1 grid
        var i;
        for (i = -7; i <= 7; i++) {
            if (i === 0) continue;
            board.create('line', [[i, -8], [i, 8]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: false, straightLast: false
            });
            board.create('line', [[-8, i], [8, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: false, straightLast: false
            });
        }

        // Axis labels
        board.create('text', [7.4, -0.5, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.3, 7.4, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

        // f(x) = 2x - 3 - 5/(x + 1)
        // Left branch: x < -1
        board.create('functiongraph', [
            function(x) { return 2 * x - 3 - 5 / (x + 1); },
            -8, -1.05
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Right branch: x > -1
        board.create('functiongraph', [
            function(x) { return 2 * x - 3 - 5 / (x + 1); },
            -0.95, 8
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Vertical asymptote: x = -1 (blue dashed)
        board.create('line', [[-1, 0], [-1, 1]], {
            strokeColor: '#2563EB', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, straightFirst: true, straightLast: true
        });

        // Slant asymptote: y = 2x - 3 (blue dashed)
        board.create('functiongraph', [
            function(x) { return 2 * x - 3; },
            -8, 8
        ], {
            strokeColor: '#2563EB', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
