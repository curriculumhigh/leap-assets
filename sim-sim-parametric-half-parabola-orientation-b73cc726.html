<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Half-Parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9, 18, -3],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            },
            highlight: false
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            },
            highlight: false
        });

        board.create('text', [17.2, -0.7, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.4, 8.4, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Parametric curve: x = t^2, y = 2t - 1, t in [0, 4]
        board.create('curve', [
            function(t) { return t * t; },
            function(t) { return 2 * t - 1; },
            0, 4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points
        var keyPoints = [
            [0, -1],
            [1, 1],
            [4, 3],
            [9, 5],
            [16, 7]
        ];

        for (var i = 0; i < keyPoints.length; i++) {
            board.create('point', keyPoints[i], {
                name: '', size: 3, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });
        }

        // Directional arrows along the curve showing orientation (t increasing)
        var arrowTvals = [1, 2.5, 3.5];
        var dt = 0.01;

        for (var a = 0; a < arrowTvals.length; a++) {
            var tv = arrowTvals[a];
            var x1 = tv * tv;
            var y1 = 2 * tv - 1;
            var x2 = (tv + dt) * (tv + dt);
            var y2 = 2 * (tv + dt) - 1;

            var dx = x2 - x1;
            var dy = y2 - y1;
            var mag = Math.sqrt(dx * dx + dy * dy);
            var ux = dx / mag;
            var uy = dy / mag;

            var arrowLen = 0.6;
            var ax1 = x1 - ux * arrowLen * 0.3;
            var ay1 = y1 - uy * arrowLen * 0.3;
            var ax2 = x1 + ux * arrowLen * 0.7;
            var ay2 = y1 + uy * arrowLen * 0.7;

            board.create('arrow', [[ax1, ay1], [ax2, ay2]], {
                strokeColor: '#222222',
                strokeWidth: 1.8,
                lastArrow: { type: 2, size: 4 },
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
