<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphs of f(x) and g(x) with Intersection Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 8.5, 6.5, -5.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.1, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 8.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_F = '#222222';
        var COL_G = '#2563EB';
        var COL_INT = '#DC2626';

        // ── Primary curve: f(x) = -x² + 4x + 2 ────────────────────────
        board.create('functiongraph', [
            function(x) { return -x * x + 4 * x + 2; }
        ], { strokeColor: COL_F, strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Secondary curve: g(x) = 2x − 1 ────────────────────────────
        board.create('functiongraph', [
            function(x) { return 2 * x - 1; }
        ], { strokeColor: COL_G, strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Function labels (name + rule) ───────────────────────────────
        // f(x): at (1, 7) — above the vertex region, f(1) = 5 so label is 2 units above curve
        board.create('text', [1, 7, 'f(x) = -x^2 + 4x + 2'], {
            fontSize: 13, color: COL_F, useKatex: true, fixed: true, highlight: false
        });

        // g(x): just above the line. At x = 4.2, g(4.2) = 7.4.
        board.create('text', [4.2, 7.8, 'g(x) = 2x - 1'], {
            fontSize: 13, color: COL_G, useKatex: true, fixed: true, highlight: false
        });

        // ── Tooltip setup ───────────────────────────────────────────────
        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function formatValKatex(v) {
            if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v));
            return v.toFixed(2);
        }

        function showTooltip(pt, color) {
            var xCoord = pt.X();
            var yCoord = pt.Y();
            var latex = '\\color{' + color + '}{\\left(' + formatValKatex(xCoord)
                      + ',\\,' + formatValKatex(yCoord) + '\\right)}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [xCoord, yCoord], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() { tooltip.style.display = 'none'; }

        // ── Intersection points: (−1, −3) and (3, 5) ───────────────────
        var pt1 = board.create('point', [-1, -3], {
            name: '', size: 5, color: COL_INT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_INT, highlightStrokeColor: COL_INT
        });
        pt1.on('over', function() { showTooltip(pt1, COL_INT); });
        pt1.on('out', function() { hideTooltip(); });

        var pt2 = board.create('point', [3, 5], {
            name: '', size: 5, color: COL_INT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_INT, highlightStrokeColor: COL_INT
        });
        pt2.on('over', function() { showTooltip(pt2, COL_INT); });
        pt2.on('out', function() { hideTooltip(); });
    </script>
</body>
</html>
