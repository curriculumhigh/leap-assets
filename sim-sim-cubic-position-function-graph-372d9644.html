<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Position Function Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 43, 9.4, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 4
                    }
                }
            },
            grid: false
        });

        // Manual grid at correct intervals: every 1 unit on t, every 4 units on s
        // Vertical grid lines (every 1 unit on t-axis)
        var i;
        for (i = -0; i <= 9; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        // Horizontal grid lines (every 4 units on s-axis)
        for (i = -0; i <= 44; i += 4) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // Axis labels (custom: t and s)
        board.create('text', [9.0, -1.2, 't'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.25, 42, 's'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });

        // s(t) = t^3 - 12t^2 + 36t + 4
        function sFunc(t) {
            return t * t * t - 12 * t * t + 36 * t + 4;
        }

        // Plot the curve on [0, 8]
        board.create('functiongraph', [sFunc, 0, 8], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Curve label — name only, no equation
        board.create('text', [1.0, 39, 's(t)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });

        // Key points: (0,4), (2,36), (6,4), (8,36)
        board.create('point', [0, 4], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [2, 36], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [6, 4], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [8, 36], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
