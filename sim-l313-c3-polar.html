<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L313 c3-polar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;
            pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .container{width:460px;height:460px;margin:0;padding:0;}
  .board-wrapper{background:white;border-radius:8px;padding:10px;
                 width:calc(100% - 20px);height:calc(100% - 20px);}
  #board{width:100%;height:100%;}
</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
  var RMAX=7, SPAN=9.5;
  var board=JXG.JSXGraph.initBoard('board',{
    boundingbox:[-SPAN,SPAN,SPAN,-SPAN],axis:false,grid:false,keepAspectRatio:true,
    showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
  var GC='#D1D5DB', GW=0.4;
  for(var i=1;i<=RMAX;i++)
    board.create('circle',[[0,0],i],{strokeColor:GC,strokeWidth:GW,fillColor:'none',
      fixed:true,highlight:false});
  for(var i=0;i<24;i++){ var a=i*Math.PI/12;
    board.create('segment',[[0,0],[RMAX*Math.cos(a),RMAX*Math.sin(a)]],
      {strokeColor:GC,strokeWidth:GW,fixed:true,highlight:false}); }
  board.create('arrow',[[0,0],[RMAX+1.4,0]],{strokeColor:'#444',strokeWidth:1.0,
    lastArrow:{type:2,size:5},fixed:true,highlight:false});
  board.create('text',[RMAX+1.3,0.55,'<i>polar axis</i>'],{fontSize:11,color:'#444',
    fixed:true,highlight:false,anchorX:'right'});
  board.create('point',[0,0],{name:'',size:2,color:'#222',fixed:true,highlight:false});
  board.create('text',[-0.6,-0.6,'O'],{fontSize:13,color:'#222',fixed:true,
    highlight:false,cssStyle:'font-weight:600'});
  for(var i=2;i<=RMAX;i+=2)
    board.create('text',[i,-0.5,String(i)],{fontSize:10,color:'#666',fixed:true,highlight:false,anchorX:'middle',anchorY:'top'});
  var F=function(t){return 2-5*Math.sin(t);};
  board.create('curve',[function(t){return F(t)*Math.cos(t);},
    function(t){return F(t)*Math.sin(t);},0,2*Math.PI],
    {strokeColor:'#2563EB',strokeWidth:2.4,fixed:true,highlight:false});
  board.create('segment',[[0,0],[-1.8369701987210297e-16,-3.0]],{strokeColor:'#DC2626',strokeWidth:2,fixed:true,highlight:false});
  board.create('point',[-1.8369701987210297e-16,-3.0],{name:'',size:3,color:'#DC2626',fixed:true,highlight:false,showInfobox:false});
  board.create('text',[2.9,-2.6,'\\text{distance } 3'],{useKatex:true,fontSize:12,color:'#DC2626',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[0,0],[-1.2858791391047208e-15,-7.0]],{strokeColor:'#DC2626',strokeWidth:2,fixed:true,highlight:false});
  board.create('point',[-1.2858791391047208e-15,-7.0],{name:'',size:3,color:'#DC2626',fixed:true,highlight:false,showInfobox:false});
  board.create('text',[3.0,-6.6,'\\text{distance } 7'],{useKatex:true,fontSize:12,color:'#DC2626',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
</script></body></html>
