<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tank</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        .graph-title { text-align: center; font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; }
        #board { width: 100%; height: calc(100% - 24px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div class="graph-title">Water Tank</div>
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 82, 5.8, -12],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 15
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.4, -4, '<i>t</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.15, 78, 'Liters'], { fontSize: 13, fixed: true, highlight: false });

        // Line with arrow extending beyond (4,60)
        // The line goes from (0,0) through (4,60) and extends with an arrow
        // Slope is 15, so at x=5.2 y=78
        board.create('arrow', [[0, 0], [5.2, 78]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Key points
        var points = [[0,0], [1,15], [2,30], [3,45], [4,60]];
        for (var i = 0; i < points.length; i++) {
            board.create('point', points[i], {
                name: '', size: 4, color: '#222222', fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
