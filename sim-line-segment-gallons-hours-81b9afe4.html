<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Segment (0, 4800) to (15, 0) with Arrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 5800, 21, -1000],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1200
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [20, -450, 'x'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.5, 5500, 'y'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });

        // Key points
        var A = board.create('point', [0, 4800], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        var B = board.create('point', [15, 0], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        // Solid segment from A to B
        board.create('segment', [A, B], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Arrow extending beyond B in the same direction
        var C = board.create('point', [18, -960], {
            name: '', visible: false, fixed: true
        });
        board.create('arrow', [B, C], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Coordinate labels
        board.create('text', [1, 5100, '(0,\\,4800)'], {
            useKatex: true, fontSize: 10, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [15.5, 350, '(15,\\,0)'], {
            useKatex: true, fontSize: 10, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
