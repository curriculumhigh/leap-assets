<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Plot — m vs c</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 49, 8.8, -6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.3, -2.2, 'c'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.3, 47.5, 'm'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });

        // Data points — (c, m)
        var data = [
            [0, 0], [1, 6], [2, 12], [3, 18],
            [4, 24], [5, 30], [6, 36], [7, 42]
        ];

        // Label offsets — (0,0) goes right-up to clear axis corner; (7,42) goes left to avoid right edge
        var offsets = [
            [0.35, 1.5],
            [0.35, 1.5],
            [0.35, 1.5],
            [0.35, 1.5],
            [0.35, 1.5],
            [0.35, 1.5],
            [0.35, 1.5],
            [-0.2, 2.8]
        ];

        var anchorX = [
            'left', 'left', 'left', 'left',
            'left', 'left', 'left', 'right'
        ];

        for (var i = 0; i < data.length; i++) {
            var px = data[i][0];
            var py = data[i][1];

            board.create('point', [px, py], {
                name: '',
                size: 2,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            board.create('text', [
                px + offsets[i][0],
                py + offsets[i][1],
                '(' + px + ',\\,' + py + ')'
            ], {
                useKatex: true,
                fontSize: 8,
                color: '#222222',
                fixed: true,
                highlight: false,
                anchorX: anchorX[i]
            });
        }
    </script>
</body>
</html>
