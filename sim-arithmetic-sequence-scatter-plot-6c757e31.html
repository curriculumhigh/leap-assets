<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Sequence Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 62, 5.4, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.0, -3.5, 'n'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.2, 59.5, 'a_n'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Data points
        var data = [
            [1, 8],
            [2, 23],
            [3, 38],
            [4, 53]
        ];

        // Plot points and labels
        for (var i = 0; i < data.length; i++) {
            var n = data[i][0];
            var an = data[i][1];

            board.create('point', [n, an], {
                name: '', size: 5, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });

            // Coordinate label — offset to the right and slightly above
            board.create('text', [n + 0.18, an + 2.5, '(' + n + ',\\,' + an + ')'], {
                fontSize: 12, color: '#222222', fixed: true, highlight: false,
                useKatex: true, anchorX: 'left', anchorY: 'bottom'
            });
        }
    </script>
</body>
</html>
