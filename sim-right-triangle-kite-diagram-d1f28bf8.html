<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — Kite Problem</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 12.5, 12.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var SCALE = 1 / 4;
        var GROUND_Y = 0;
        var HAND_Y = 3 * SCALE;
        var ANG = 62 * Math.PI / 180;
        var HYP = 40 * SCALE;
        var H_VIS = HYP * Math.sin(ANG);
        var HORIZ = HYP * Math.cos(ANG);

        var handX = 2;
        var handY = HAND_Y;

        var Ax = handX;
        var Ay = handY;
        var Bx = handX + HORIZ;
        var By = handY;
        var Cx = handX + HORIZ;
        var Cy = handY + H_VIS;

        // Ground line
        board.create('segment', [[-1.5, GROUND_Y], [11.5, GROUND_Y]], {
            strokeColor: '#888888', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // 3 ft vertical segment (ground to hand)
        board.create('segment', [[Ax, GROUND_Y], [Ax, HAND_Y]], {
            strokeColor: '#888888', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Tick marks at top and bottom of 3 ft segment
        board.create('segment', [[Ax - 0.25, GROUND_Y], [Ax + 0.25, GROUND_Y]], {
            strokeColor: '#888888', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[Ax - 0.25, HAND_Y], [Ax + 0.25, HAND_Y]], {
            strokeColor: '#888888', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // 3 ft label
        board.create('text', [Ax - 1.1, HAND_Y / 2, '3 \\text{ ft}'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false
        });

        // Dashed horizontal at hand height
        board.create('segment', [[Ax, HAND_Y], [Bx + 0.3, HAND_Y]], {
            strokeColor: '#cccccc', strokeWidth: 0.8, dash: 3, fixed: true, highlight: false
        });

        // Triangle edges — Hypotenuse
        board.create('segment', [[Ax, Ay], [Cx, Cy]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Vertical leg
        board.create('segment', [[Bx, By], [Cx, Cy]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Horizontal leg
        board.create('segment', [[Ax, Ay], [Bx, By]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Right angle marker at B
        var RA = 0.45;
        board.create('polygon', [
            [Bx - RA, By],
            [Bx - RA, By + RA],
            [Bx, By + RA],
            [Bx, By]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // 62 degree angle arc at A
        var pA = board.create('point', [Ax, Ay], { visible: false, name: '', fixed: true });
        var pB = board.create('point', [Bx, By], { visible: false, name: '', fixed: true });
        var pC = board.create('point', [Cx, Cy], { visible: false, name: '', fixed: true });

        board.create('nonReflexAngle', [pB, pA, pC], {
            radius: 1.2,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // 62 degree label
        var bisectorAng = ANG / 2;
        var labelR = 1.6;
        board.create('text', [
            Ax + labelR * Math.cos(bisectorAng),
            Ay + labelR * Math.sin(bisectorAng),
            '62^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false
        });

        // Hypotenuse label: 40 ft
        var hypMidX = (Ax + Cx) / 2;
        var hypMidY = (Ay + Cy) / 2;
        var hypDx = Cx - Ax;
        var hypDy = Cy - Ay;
        var hypLen = Math.sqrt(hypDx * hypDx + hypDy * hypDy);
        var normX = -hypDy / hypLen;
        var normY = hypDx / hypLen;
        var labelOff = 0.8;

        board.create('text', [
            hypMidX + normX * labelOff,
            hypMidY + normY * labelOff,
            '40 \\text{ ft}'
        ], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false
        });

        // Vertical leg label: h
        board.create('text', [Bx + 0.7, (By + Cy) / 2, 'h'], {
            useKatex: true, fontSize: 14, color: '#2563EB', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false,
            cssStyle: 'font-weight: bold'
        });

        // Total height annotation arrow
        var annoX = Bx + 2.2;

        board.create('segment', [[annoX, GROUND_Y], [annoX, Cy]], {
            strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 }
        });

        // Tick marks on annotation arrow
        board.create('segment', [[annoX - 0.25, GROUND_Y], [annoX + 0.25, GROUND_Y]], {
            strokeColor: '#2563EB', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[annoX - 0.25, Cy], [annoX + 0.25, Cy]], {
            strokeColor: '#2563EB', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // h + 3 label
        board.create('text', [annoX + 0.9, (GROUND_Y + Cy) / 2, 'h + 3'], {
            useKatex: true, fontSize: 14, color: '#2563EB', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false,
            cssStyle: 'font-weight: bold'
        });

        // Dashed line from kite to annotation
        board.create('segment', [[Cx, Cy], [annoX, Cy]], {
            strokeColor: '#cccccc', strokeWidth: 0.8, dash: 3, fixed: true, highlight: false
        });

        // Kite symbol at C
        var kS = 0.35;
        board.create('polygon', [
            [Cx, Cy + kS * 1.3],
            [Cx + kS * 0.7, Cy],
            [Cx, Cy - kS * 0.5],
            [Cx - kS * 0.7, Cy]
        ], {
            fillColor: '#D97706', fillOpacity: 0.5,
            borders: { strokeColor: '#D97706', strokeWidth: 1.2, fixed: true, highlight: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Hand point
        board.create('point', [Ax, Ay], {
            name: '', size: 3, color: '#555555', fixed: true, highlight: false
        });

        // "String" label
        board.create('text', [
            hypMidX + normX * labelOff - 0.15,
            hypMidY + normY * labelOff - 0.6,
            '\\small\\text{(string)}'
        ], {
            useKatex: true, fontSize: 10, color: '#888888', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false
        });

        // "Ground" label
        board.create('text', [8.5, -0.5, '\\small\\text{ground}'], {
            useKatex: true, fontSize: 10, color: '#888888', fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false
        });

    </script>
</body>
</html>
