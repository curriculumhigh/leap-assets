<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Long Division</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { display: flex; align-items: center; justify-content: center; height: 100%; padding: 10px; box-sizing: border-box; }
        .division-wrapper { background: white; border-radius: 8px; padding: 20px 16px; }
        .division-grid { display: grid; grid-template-columns: auto auto; row-gap: 2px; align-items: end; }
        .divisor-cell { padding-right: 4px; display: flex; align-items: center; justify-content: flex-end; }
        .dividend-area { position: relative; padding-left: 8px; padding-top: 28px; border-left: 2px solid #444; }
        .dividend-area::before { content: ''; position: absolute; top: 26px; left: -2px; right: 0; height: 2px; background: #444; }
        .quotient-line { position: absolute; top: 2px; left: 8px; white-space: nowrap; }
        .step-row { margin-bottom: 2px; white-space: nowrap; }
        .subtraction-row { border-bottom: 1.5px solid #444; padding-bottom: 3px; margin-bottom: 4px; display: inline-block; }
        .result-row { margin-bottom: 4px; white-space: nowrap; }
        .katex-row { min-height: 22px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="division-wrapper">
            <div class="division-grid">
                <div class="divisor-cell">
                    <span id="divisor"></span>
                </div>
                <div class="dividend-area">
                    <div class="quotient-line" id="quotient"></div>
                    <div class="katex-row" id="dividend"></div>
                    <div class="katex-row subtraction-row" id="sub1"></div>
                    <div class="katex-row result-row" id="result1"></div>
                    <div class="katex-row subtraction-row" id="sub2"></div>
                    <div class="katex-row result-row" id="remainder"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var COL_DIVISOR = '#2563EB';
        var COL_Q1 = '#059669';
        var COL_Q2 = '#D97706';
        var COL_DARK = '#222222';

        function render(id, latex) {
            katex.render(latex, document.getElementById(id), { throwOnError: false, displayMode: false });
        }

        // Divisor
        render('divisor', '\\color{' + COL_DIVISOR + '}{2x^3 - 3x^2 + 1}');

        // Quotient
        render('quotient', '\\color{' + COL_Q1 + '}{4x} \\color{' + COL_DARK + '}{+} \\color{' + COL_Q2 + '}{9}');

        // Dividend
        render('dividend', '8x^4 + 6x^3 - x^2 + 5');

        // First subtraction: 4x(2x³ - 3x² + 1) = 8x⁴ - 12x³ + 4x
        render('sub1', '\\color{' + COL_Q1 + '}{-(8x^4 - 12x^3 + 4x)}');

        // Result after first subtraction: 18x³ - x² - 4x + 5
        render('result1', '18x^3 - x^2 - 4x + 5');

        // Second subtraction: 9(2x³ - 3x² + 1) = 18x³ - 27x² + 9
        render('sub2', '\\color{' + COL_Q2 + '}{-(18x^3 - 27x^2 + 9)}');

        // Remainder: 26x² - 4x - 4
        render('remainder', '\\color{' + COL_DARK + '}{26x^2 - 4x - 4}');
    </script>
</body>
</html>
