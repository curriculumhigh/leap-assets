<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle XYZ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 7, 9, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var Y = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var Z = board.create('point', [6, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var X = board.create('point', [0, 5], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle (no fill) ──────────────────────────────────────────
        board.create('polygon', [X, Y, Z], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at Y ─────────────────────────────────────
        var sq = 0.45;
        var raP1 = board.create('point', [sq, 0], { visible: false, fixed: true, name: '' });
        var raP2 = board.create('point', [sq, sq], { visible: false, fixed: true, name: '' });
        var raP3 = board.create('point', [0, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [raP1, raP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raP2, raP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Vertex labels (bold, KaTeX) ─────────────────────────────────
        board.create('text', [-0.55, 5.35, '\\textbf{X}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [-0.65, -0.55, '\\textbf{Y}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [6.25, -0.55, '\\textbf{Z}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });

        // ── Side labels (KaTeX) ─────────────────────────────────────────
        // XY = 5, to the left of the vertical leg
        board.create('text', [-0.85, 2.5, '5'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // YZ = 6, below the horizontal leg
        board.create('text', [3, -0.7, '6'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // XZ = sqrt(61), along hypotenuse, offset up-right from midpoint
        board.create('text', [3.65, 3.2, '\\sqrt{61}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
