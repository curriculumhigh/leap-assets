<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphs of y = x² + 2 and y = −x − 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px; margin: 0; padding: 6px;
            height: calc(100% - 12px);
        }
        .sim-layout {
            display: flex; gap: 10px; height: 100%;
        }
        .left-panel {
            width: 130px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 14px 12px;
            display: flex; flex-direction: column; justify-content: center; gap: 14px;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 4px;
        }
        .legend-item {
            display: flex; align-items: center; gap: 8px;
        }
        .legend-swatch {
            width: 22px; height: 3px; border-radius: 2px; flex-shrink: 0;
        }
        .legend-text {
            font-size: 14px; line-height: 1.4;
        }
        .board-wrapper {
            flex: 1; background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }

        .JXGtext { user-select: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Functions</div>
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px;">
                        <div class="legend-item">
                            <div class="legend-swatch" style="background: #222222;"></div>
                            <div class="legend-text" id="legend1"></div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-swatch" style="background: #2563EB;"></div>
                            <div class="legend-text" id="legend2"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        katex.render('y = x^2 + 2', document.getElementById('legend1'), { throwOnError: false });
        katex.render('y = -x - 1', document.getElementById('legend2'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 8.5, 5.5, -4.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        tickEndings: [0, 0],
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false,
                        label: {
                            fontSize: 11,
                            color: '#333333',
                            anchorX: 'middle',
                            offset: [0, -14]
                        }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        tickEndings: [0, 0],
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false,
                        label: {
                            fontSize: 11,
                            color: '#333333',
                            anchorY: 'middle',
                            offset: [-14, 0]
                        }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        board.create('text', [5.1, -0.45, '<i>x</i>'], {
            fontSize: 14, fixed: true, highlight: false, color: '#333333'
        });
        board.create('text', [0.3, 8.1, '<i>y</i>'], {
            fontSize: 14, fixed: true, highlight: false, color: '#333333'
        });

        board.create('functiongraph', [
            function(x) { return x * x + 2; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        board.create('functiongraph', [
            function(x) { return -x - 1; }
        ], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
