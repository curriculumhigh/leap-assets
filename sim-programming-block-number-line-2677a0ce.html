<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Block Number Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-18, 10, 138, -10],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        /* ── Number line (main axis) ──────────────────────────────── */
        board.create('segment', [[0, 0], [120, 0]], {
            strokeColor: '#444444', strokeWidth: 1.5, fixed: true, highlight: false
        });

        /* ── Tick marks ───────────────────────────────────────────── */
        var ticks = [0, 20, 40, 60, 80, 100, 120];
        for (var i = 0; i < ticks.length; i++) {
            board.create('segment', [[ticks[i], -0.2], [ticks[i], 0.2]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [ticks[i], -2.0, String(ticks[i])], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 11, color: '#444444', fixed: true, highlight: false
            });
        }

        /* ── "min" unit label ─────────────────────────────────────── */
        board.create('text', [130, -2.0, 'min'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 11, color: '#888888', fixed: true, highlight: false
        });

        /* ── Highlighted sub-interval: Mia's segment 0→20 ────────── */
        board.create('segment', [[0, 0], [20, 0]], {
            strokeColor: '#2563EB', strokeWidth: 6, fixed: true, highlight: false, layer: 7
        });
        /* Blue endpoint dots */
        board.create('point', [0, 0], {
            name: '', size: 3, color: '#2563EB', fixed: true, highlight: false, layer: 8
        });
        board.create('point', [20, 0], {
            name: '', size: 3, color: '#2563EB', fixed: true, highlight: false, layer: 8
        });

        /* ── Bottom bracket: Mia's segment label ──────────────────── */
        var bY1 = -4.0;
        var bY2 = -5.2;
        /* Left vertical cap */
        board.create('segment', [[0, bY1], [0, bY2]], {
            strokeColor: '#2563EB', strokeWidth: 1.2, fixed: true, highlight: false
        });
        /* Right vertical cap */
        board.create('segment', [[20, bY1], [20, bY2]], {
            strokeColor: '#2563EB', strokeWidth: 1.2, fixed: true, highlight: false
        });
        /* Horizontal bar */
        board.create('segment', [[0, bY2], [20, bY2]], {
            strokeColor: '#2563EB', strokeWidth: 1.2, fixed: true, highlight: false
        });
        /* Label */
        board.create('text', [10, -7.2, "Mia's segment = 20 min"], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 12, color: '#2563EB', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        /* ── Top bracket: full programming block label ────────────── */
        var tY1 = 2.8;
        var tY2 = 4.0;
        /* Left vertical cap */
        board.create('segment', [[0, tY1], [0, tY2]], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });
        /* Right vertical cap */
        board.create('segment', [[120, tY1], [120, tY2]], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });
        /* Horizontal bar */
        board.create('segment', [[0, tY2], [120, tY2]], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });
        /* Label */
        board.create('text', [60, 6.4, 'Programming block = 120 min'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });
    </script>
</body>
</html>
