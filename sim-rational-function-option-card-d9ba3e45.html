<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y=(x+3)/(x-1)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 7.5, 5.5, -7.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Create axes manually for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 8, anchorX: 'middle', offset: [0, -10] },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                drawZero: false
            },
            highlight: false
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 8, anchorX: 'right', offset: [-6, 0] },
                minorTicks: 0,
                ticksDistance: 2,
                insertTicks: false,
                drawZero: false
            },
            highlight: false
        });

        // Axis labels
        board.create('text', [5.0, -0.55, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 7.0, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Function
        function f(x) {
            return (x + 3) / (x - 1);
        }

        // Left branch (x < 1)
        board.create('functiongraph', [
            function(x) { return f(x); },
            -5.5, 0.92
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Right branch (x > 1)
        board.create('functiongraph', [
            function(x) { return f(x); },
            1.08, 5.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Vertical asymptote x = 1
        board.create('line', [[1, 0], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Horizontal asymptote y = 1
        board.create('line', [[0, 1], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Key points — no labels
        board.create('point', [-3, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [0, -3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Orientation arrows — small arrow segments tangent to curve
        function addOrientationArrow(xc, dx) {
            var x1 = xc - dx;
            var x2 = xc + dx;
            var y1 = f(x1);
            var y2 = f(x2);
            board.create('arrow', [[x1, y1], [x2, y2]], {
                strokeColor: '#222222', strokeWidth: 1.5,
                lastArrow: { type: 2, size: 5 },
                fixed: true, highlight: false
            });
        }

        // Left branch arrows (left to right as t increases)
        addOrientationArrow(-3.5, 0.25);
        addOrientationArrow(-0.5, 0.2);

        // Right branch arrows (left to right as t increases)
        addOrientationArrow(2.2, 0.25);
        addOrientationArrow(4.5, 0.25);
    </script>
</body>
</html>
