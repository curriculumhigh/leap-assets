<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Pair and Angle Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.5, 11.5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_LINE = '#555555';
        var COL_POINT = '#222222';
        var COL_MARK = '#DC2626';

        var ptJ = board.create('point', [0, 0], {
            name: 'J', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-5, -18] }
        });

        var ptK = board.create('point', [3, 0], {
            name: 'K', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-5, -18] }
        });

        var ptM = board.create('point', [5.5, 0], {
            name: 'M', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-5, -18] }
        });

        var ptP = board.create('point', [7.5, 0], {
            name: 'P', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-5, -18] }
        });

        var ptQ = board.create('point', [10, 0], {
            name: 'Q', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-5, -18] }
        });

        board.create('line', [ptJ, ptQ], {
            strokeColor: COL_LINE, strokeWidth: 2.0, fixed: true, highlight: false,
            straightFirst: true, straightLast: true,
            firstArrow: false, lastArrow: false
        });

        var ptL = board.create('point', [4.5, 4.5], {
            name: 'L', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [4, 6] }
        });

        board.create('segment', [ptK, ptL], {
            strokeColor: COL_LINE, strokeWidth: 2.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        var ptN = board.create('point', [5.2, -3.5], {
            name: 'N', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-6, -16] }
        });

        board.create('segment', [ptP, ptN], {
            strokeColor: COL_LINE, strokeWidth: 2.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        board.create('nonReflexAngle', [ptJ, ptK, ptL], {
            radius: 0.7,
            fillColor: COL_MARK, fillOpacity: 0.08,
            strokeColor: COL_MARK, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [ptL, ptK, ptM], {
            radius: 0.9,
            fillColor: COL_MARK, fillOpacity: 0.08,
            strokeColor: COL_MARK, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [ptN, ptP, ptQ], {
            radius: 0.7,
            fillColor: COL_MARK, fillOpacity: 0.08,
            strokeColor: COL_MARK, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

    </script>
</body>
</html>
