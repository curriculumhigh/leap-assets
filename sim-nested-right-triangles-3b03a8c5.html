<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Right Triangles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var A = [0, 0];
        var B = [9, 0];
        var C = [0, 12];
        var D = [25, 12];

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 16, 29, -3.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var pA = board.create('point', A, { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pB = board.create('point', B, { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pC = board.create('point', C, { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pD = board.create('point', D, { name: '', size: 2, color: '#222222', fixed: true, highlight: false });

        board.create('polygon', [pA, pB, pC], {
            fillColor: '#2563EB', fillOpacity: 0.06,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('polygon', [pC, pB, pD], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var raSize = 0.9;
        board.create('segment', [[A[0] + raSize, A[1]], [A[0] + raSize, A[1] + raSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[A[0] + raSize, A[1] + raSize], [A[0], A[1] + raSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        var bcU = [-3 / 5, 4 / 5];
        var bdU = [4 / 5, 3 / 5];
        var ra2 = 0.9;
        var rB1 = [B[0] + ra2 * bcU[0], B[1] + ra2 * bcU[1]];
        var rB2 = [B[0] + ra2 * (bcU[0] + bdU[0]), B[1] + ra2 * (bcU[1] + bdU[1])];
        var rB3 = [B[0] + ra2 * bdU[0], B[1] + ra2 * bdU[1]];

        board.create('segment', [rB1, rB2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [rB2, rB3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('text', [4.5, -1.2, '9 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [-1.8, 6, '12 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [3.2, 7.0, '15 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [18.2, 5.0, '20 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [12.5, 13.2, 'x'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
