<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Dashed Boundary Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 8, 7, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'none',
                        strokeWidth: 0,
                        label: { fontSize: 11, offset: [0, -14] },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'none',
                        strokeWidth: 0,
                        label: { fontSize: 11, offset: [-14, 0] },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 7.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Quadratic function: y = x^2 - 4x + 1
        function f(x) {
            return x * x - 4 * x + 1;
        }

        // Shaded region above the parabola (outside)
        var shadedAbove = board.create('inequality', [
            board.create('functiongraph', [f, -2, 7], {
                strokeColor: '#2563EB',
                strokeWidth: 1.8,
                dash: 2,
                fixed: true,
                highlight: false
            })
        ], {
            inverse: true,
            fillColor: '#2563EB',
            fillOpacity: 0.12,
            strokeWidth: 0,
            fixed: true,
            highlight: false
        });

        // Point at (0, 0) — marked but not labeled
        board.create('point', [0, 0], {
            name: '',
            size: 5,
            color: '#2563EB',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Function rule label — inside the parabola, below the vertex
        board.create('text', [2, -4.2, 'y = x^2 - 4x + 1'], {
            fontSize: 13,
            color: '#2563EB',
            fixed: true,
            highlight: false,
            useKatex: true,
            anchorX: 'middle'
        });
    </script>
</body>
</html>
