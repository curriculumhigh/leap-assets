<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x > -5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { height: 100%; padding: 4px; box-sizing: border-box; }
        .board-wrapper { background: white; border-radius: 6px; height: 100%; }
        #board { width: 100%; height: 100%; }
        .jxgbox { border: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9, 2.2, 7, -2.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Number line with arrows on both ends
        board.create('arrow', [[-8.5, 0], [6.5, 0]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 }
        });

        // Tick marks and labels from -8 to 6
        var i;
        for (i = -8; i <= 6; i++) {
            board.create('segment', [[i, -0.2], [i, 0.2]], {
                strokeColor: '#222222',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -0.8, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 11,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Shaded ray from -5 to the right (arrow indicates extends to +infinity)
        board.create('arrow', [[-5, 0], [6.5, 0]], {
            strokeColor: '#2563EB',
            strokeWidth: 3.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Open circle at x = -5
        board.create('point', [-5, 0], {
            name: '',
            size: 4,
            fillColor: '#ffffff',
            strokeColor: '#2563EB',
            strokeWidth: 2,
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
