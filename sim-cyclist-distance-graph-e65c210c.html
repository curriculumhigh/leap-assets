<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclist Distance Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 38, 5.5, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels — custom: t (horizontal), d (vertical)
        board.create('text', [5.1, -1.5, 't'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.2, 36.5, 'd'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Colors
        var COL_A = '#222222';
        var COL_B = '#2563EB';

        // Cyclist A: d = 10t (primary curve)
        board.create('functiongraph', [
            function(t) { return 10 * t; }, 0, 5.5
        ], {
            strokeColor: COL_A, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Cyclist B: d = 6 + 7t (secondary curve)
        board.create('functiongraph', [
            function(t) { return 6 + 7 * t; }, 0, 5.5
        ], {
            strokeColor: COL_B, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Function labels — name only: A and B
        board.create('text', [3.7, 35.5, 'A'], {
            fontSize: 13, color: COL_A, useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [4.1, 34, 'B'], {
            fontSize: 13, color: COL_B, useKatex: true, fixed: true, highlight: false
        });

        // Intersection point at (2, 20) — small structural dot
        board.create('point', [2, 20], {
            name: '', size: 3, color: COL_A, fixed: true, highlight: false,
            showInfobox: false
        });

        // Intersection coordinate label — moved down
        board.create('text', [2.15, 17.5, '(2,\\, 20)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
