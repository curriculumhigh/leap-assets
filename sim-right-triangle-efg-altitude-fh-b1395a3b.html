<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle EFG with Altitude FH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var EH = 2.4, HG = 5.4;
        var EG = EH + HG;
        var FH = Math.sqrt(EH * HG);

        var Ex = 0,   Ey = 0;
        var Gx = EG,  Gy = 0;
        var Hx = EH,  Hy = 0;
        var Fx = EH,  Fy = FH;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, FH + 1.8, EG + 1.8, -1.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var E = board.create('point', [Ex, Ey], {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-18, -14] }
        });
        var G = board.create('point', [Gx, Gy], {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [8, -14] }
        });
        var F = board.create('point', [Fx, Fy], {
            name: 'F', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-4, 12] }
        });
        var H = board.create('point', [Hx, Hy], {
            name: 'H', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-4, -16] }
        });

        board.create('segment', [E, F], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [F, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [E, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('segment', [F, H], {
            strokeColor: '#0EA5E9', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        var RA_SIZE = 0.35;

        var feLen = Math.sqrt((Ex - Fx) * (Ex - Fx) + (Ey - Fy) * (Ey - Fy));
        var fgLen = Math.sqrt((Gx - Fx) * (Gx - Fx) + (Gy - Fy) * (Gy - Fy));
        var feUx = (Ex - Fx) / feLen, feUy = (Ey - Fy) / feLen;
        var fgUx = (Gx - Fx) / fgLen, fgUy = (Gy - Fy) / fgLen;

        var raF1 = board.create('point', [Fx + RA_SIZE * feUx, Fy + RA_SIZE * feUy], { visible: false, fixed: true, name: '' });
        var raF2 = board.create('point', [Fx + RA_SIZE * (feUx + fgUx), Fy + RA_SIZE * (feUy + fgUy)], { visible: false, fixed: true, name: '' });
        var raF3 = board.create('point', [Fx + RA_SIZE * fgUx, Fy + RA_SIZE * fgUy], { visible: false, fixed: true, name: '' });

        board.create('segment', [raF1, raF2], { strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false });
        board.create('segment', [raF2, raF3], { strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false });

        var raH1 = board.create('point', [Hx - RA_SIZE, Hy], { visible: false, fixed: true, name: '' });
        var raH2 = board.create('point', [Hx - RA_SIZE, Hy + RA_SIZE], { visible: false, fixed: true, name: '' });
        var raH3 = board.create('point', [Hx, Hy + RA_SIZE], { visible: false, fixed: true, name: '' });

        board.create('segment', [raH1, raH2], { strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false });
        board.create('segment', [raH2, raH3], { strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false });

        board.create('text', [(Ex + Hx) / 2, -0.55, '2.4\\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false
        });

        board.create('text', [(Hx + Gx) / 2, -0.55, '5.4\\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false
        });

        board.create('text', [Hx + 0.35, Fy / 2, 'x'], {
            useKatex: true, fontSize: 14, color: '#0EA5E9',
            anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });
    </script>
</body>
</html>
