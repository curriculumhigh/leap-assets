<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle WUV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 10.5, 15, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var U = board.create('point', [0, 0], { name: '', visible: false, fixed: true });
        var W = board.create('point', [0, 8], { name: '', visible: false, fixed: true });
        var V = board.create('point', [13, 0], { name: '', visible: false, fixed: true });

        // Triangle (no fill)
        board.create('polygon', [W, U, V], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at U (red square)
        var sqSize = 0.8;
        var sq1 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        board.create('polygon', [U, sq1, sq2, sq3], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels (bold black)
        board.create('text', [-1.2, 8, '\\mathbf{W}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [-1.2, -0.8, '\\mathbf{U}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [13.8, -0.8, '\\mathbf{V}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // Side labels (blue, measurement color)
        // "8" at midpoint of WU, offset to the left
        board.create('text', [-1.2, 4, '8'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // "13" at midpoint of UV, offset below
        board.create('text', [6.5, -1.2, '13'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
