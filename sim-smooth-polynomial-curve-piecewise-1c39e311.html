<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Polynomial Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // ── Piecewise curve ─────────────────────────────────────────────
        function polyVal(t) {
            if (t <= 3) {
                return 3 + 3.5 * t - (7 / 54) * t * t * t;
            } else if (t <= 6) {
                var u = t - 3;
                return 10 - 4 * u * u + (8 / 9) * u * u * u;
            } else {
                var v = t - 6;
                return -2 + 1.5 * v * v;
            }
        }

        // ── Board ───────────────────────────────────────────────────────
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 12, 9.5, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                gridX: 1,
                gridY: 1
            }
        });

        // Axis labels: t (horizontal), p (vertical)
        board.create('text', [9.1, -0.5, 't'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 11.5, 'p'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // ── Plot the piecewise curve on [0, 8] ─────────────────────────
        board.create('functiongraph', [
            function(x) { return polyVal(x); },
            0, 8
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Key points with coordinate labels ───────────────────────────
        var pts = [
            { t: 0, p: 3,   offX: 12,  offY: -16 },
            { t: 3, p: 10,  offX: 12,  offY: 14 },
            { t: 6, p: -2,  offX: 12,  offY: -14 },
            { t: 8, p: 4,   offX: -58, offY: 10 }
        ];

        for (var i = 0; i < pts.length; i++) {
            (function(pt) {
                board.create('point', [pt.t, pt.p], {
                    name: '', size: 3, color: '#222222', fixed: true,
                    highlight: false, showInfobox: false
                });

                var labelStr = '(' + pt.t + ',\\,' + pt.p + ')';
                board.create('text', [pt.t, pt.p, labelStr], {
                    useKatex: true, fontSize: 12, color: '#222222', fixed: true,
                    highlight: false,
                    offset: [pt.offX, pt.offY],
                    anchorX: 'left', anchorY: 'middle'
                });
            })(pts[i]);
        }
    </script>
</body>
</html>
