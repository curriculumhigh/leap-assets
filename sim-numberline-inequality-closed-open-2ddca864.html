<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: -2 ≤ x < 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 3, 9, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_LINE = '#444444';
        var COL_SOLUTION = '#2563EB';
        var Y = 0;

        // Number line with arrows on both ends
        board.create('arrow', [[-4.5, Y], [8.5, Y]], {
            strokeColor: COL_LINE,
            strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });
        board.create('arrow', [[8.5, Y], [-4.5, Y]], {
            strokeColor: COL_LINE,
            strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels from -4 to 8
        var i;
        for (i = -4; i <= 8; i++) {
            board.create('segment', [[i, -0.25], [i, 0.25]], {
                strokeColor: COL_LINE,
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -0.7, String(i)], {
                anchorX: 'middle',
                anchorY: 'top',
                fontSize: 12,
                color: COL_LINE,
                fixed: true,
                highlight: false
            });
        }

        // Solution segment: -2 to 5 (blue, thicker)
        board.create('segment', [[-2, Y], [5, Y]], {
            strokeColor: COL_SOLUTION,
            strokeWidth: 3.5,
            fixed: true,
            highlight: false
        });

        // Closed circle at x = -2 (filled blue)
        board.create('point', [-2, Y], {
            name: '',
            size: 5,
            fillColor: COL_SOLUTION,
            strokeColor: COL_SOLUTION,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // Open circle at x = 5 (white fill, blue stroke)
        board.create('point', [5, Y], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: COL_SOLUTION,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
