<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detour Route — Park Entrance, Bridge, Lookout, Campsite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.2, 7.5, 10, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Compass direction labels
        board.create('text', [9.6, -0.4, '<b>E</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });
        board.create('text', [-1.9, -0.4, '<b>W</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });
        board.create('text', [0.25, 7.1, '<b>N</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });
        board.create('text', [0.25, -1.7, '<b>S</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });

        // ── Points ──────────────────────────────────────────────────────
        var PE = board.create('point', [0, 0], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var BR = board.create('point', [6, 0], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var LO = board.create('point', [7, 5], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var CS = board.create('point', [0, 4], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });

        // ── Segments forming the detour route (closed loop) ─────────────
        board.create('segment', [PE, BR], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [BR, LO], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [LO, CS], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [CS, PE], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Labels — positioned to avoid axes, ticks, and segments ──────
        board.create('text', [0.35, -0.8, '\\text{Park Entrance}\\;(0,\\,0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        board.create('text', [4.8, -0.8, '\\text{Bridge}\\;(6,\\,0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        board.create('text', [7.4, 5.2, '\\text{Lookout}\\;(7,\\,5)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        board.create('text', [-2, 4.45, '\\text{Campsite}\\;(0,\\,4)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
