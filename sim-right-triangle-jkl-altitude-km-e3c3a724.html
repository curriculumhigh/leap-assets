<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle JKL with Altitude KM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 10.5, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices: J bottom-left, L bottom-right, K at top
        var J = board.create('point', [0, 0], {
            name: 'J', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-18, -10] }
        });
        var L = board.create('point', [9, 0], {
            name: 'L', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [8, -10] }
        });
        var K = board.create('point', [3, 6], {
            name: 'K', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-5, 12] }
        });

        // Triangle edges
        board.create('segment', [J, K], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [K, L], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [J, L], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // M: foot of perpendicular from K to JL (JL is along y=0)
        var M = board.create('point', [3, 0], {
            name: 'M', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-5, -14] }
        });

        // Altitude KM
        board.create('segment', [K, M], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // Right angle marker at K (angle JKL = 90°)
        var markSize = 0.45;
        var KJx = J.X() - K.X(), KJy = J.Y() - K.Y();
        var KLx = L.X() - K.X(), KLy = L.Y() - K.Y();
        var lenKJ = Math.sqrt(KJx * KJx + KJy * KJy);
        var lenKL = Math.sqrt(KLx * KLx + KLy * KLy);
        var uKJx = KJx / lenKJ, uKJy = KJy / lenKJ;
        var uKLx = KLx / lenKL, uKLy = KLy / lenKL;

        var raK1 = [K.X() + markSize * uKJx, K.Y() + markSize * uKJy];
        var raK2 = [K.X() + markSize * (uKJx + uKLx), K.Y() + markSize * (uKJy + uKLy)];
        var raK3 = [K.X() + markSize * uKLx, K.Y() + markSize * uKLy];

        board.create('segment', [raK1, raK2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [raK2, raK3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Right angle marker at M (KM perpendicular to JL)
        var raM1 = [M.X(), M.Y() + markSize];
        var raM2 = [M.X() + markSize, M.Y() + markSize];
        var raM3 = [M.X() + markSize, M.Y()];

        board.create('segment', [raM1, raM2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [raM2, raM3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
    </script>
</body>
</html>
