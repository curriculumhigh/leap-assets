<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 7, 5, -4],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 6.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var A = board.create('point', [-3, -2], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var B = board.create('point', [3, -2], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var C = board.create('point', [1, 5], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Triangle (no fill)
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels (KaTeX, name-only style with coordinates)
        board.create('text', [-3.2, -2.7, 'A(-3,\\,-2)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'right', fixed: true, highlight: false
        });
        board.create('text', [3.2, -2.7, 'B(3,\\,-2)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });
        board.create('text', [1, 5.5, 'C(1,\\,5)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });
    </script>
</body>
</html>
