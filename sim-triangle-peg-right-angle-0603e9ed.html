<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle PEG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 6.5, 16, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var E = board.create('point', [0, 0], {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -14], useKatex: true }
        });

        var P = board.create('point', [0, 4], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 6], useKatex: true }
        });

        var G = board.create('point', [13, 0], {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -14], useKatex: true }
        });

        // Triangle edges
        board.create('segment', [P, E], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [E, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [P, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Right-angle marker at E
        var raSize = 0.7;
        board.create('segment', [[raSize, 0], [raSize, raSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[raSize, raSize], [0, raSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Angle arc at G for theta
        board.create('nonReflexAngle', [P, G, E], {
            radius: 2.5,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.8,
            fixed: true, name: '', withLabel: false
        });

        // Theta label — inside the triangle along the angle bisector from G
        var angPGE = Math.atan2(4, 13);
        var bisAngle = Math.PI - angPGE / 2;
        var labelR = 3.4;
        var thetaX = 13 + labelR * Math.cos(bisAngle);
        var thetaY = 0 + labelR * Math.sin(bisAngle);

        board.create('text', [thetaX, thetaY, '\\theta'], {
            useKatex: true, fontSize: 16, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Side label: 4 cm along PE (to the left)
        board.create('text', [-1.2, 2, '4 \\text{ cm}'], {
            useKatex: true, fontSize: 13, color: '#3B82F6',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Side label: 13 cm along EG (below)
        board.create('text', [6.5, -1.2, '13 \\text{ cm}'], {
            useKatex: true, fontSize: 13, color: '#3B82F6',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
