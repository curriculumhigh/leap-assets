<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 8.8, 6.8, -6.8],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Create axes manually with forced ticksDistance
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 10 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 10 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            }
        });

        // Grid
        board.create('grid', [], {
            strokeColor: '#D1D5DB',
            strokeWidth: 0.4,
            gridX: 1,
            gridY: 1
        });

        // Axis labels
        board.create('text', [6.4, -0.5, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.2, 8.4, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Points: (1,-5), (2,-3), (3,-1), (4,1), (5,3)
        var points = [
            [1, -5],
            [2, -3],
            [3, -1],
            [4, 1],
            [5, 3]
        ];

        for (var i = 0; i < points.length; i++) {
            board.create('point', points[i], {
                name: '',
                size: 4,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
