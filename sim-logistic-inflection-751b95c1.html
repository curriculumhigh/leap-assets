<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic Growth Solutions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); display: flex; flex-direction: column; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px 10px 6px 10px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #board { width: 100%; flex: 1; min-height: 0; }
        .btn-row { display: flex; gap: 8px; padding-top: 6px; justify-content: center; }
        .toggle-btn {
            font-size: 13px; padding: 5px 16px; border: 2px solid #ccc;
            border-radius: 6px; background: #f5f5f5; color: #555; cursor: pointer;
            font-weight: 600; transition: all 0.15s;
            display: flex; align-items: center;
        }
        .toggle-btn .katex { font-size: 1em; }
        .toggle-btn.active-a { border-color: #222222; background: #F5F5F5; color: #222222; }
        .toggle-btn.active-b { border-color: #059669; background: #ECFDF5; color: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
            <div class="btn-row">
                <button class="toggle-btn active-a" id="btn-a" onclick="showCurve('a')"><span id="btn-a-label"></span></button>
                <button class="toggle-btn" id="btn-b" onclick="showCurve('b')"><span id="btn-b-label"></span></button>
            </div>
        </div>
    </div>
    <script>
        /* Render KaTeX button labels */
        katex.render('P(0) = 40', document.getElementById('btn-a-label'), { throwOnError: false });
        katex.render('P(0) = 350', document.getElementById('btn-b-label'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 580, 13.5, -60],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* —— Manual axes ——————————————————————————————— */
        // t-axis
        board.create('arrow', [[0, 0], [13, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });
        // P-axis
        board.create('arrow', [[0, 0], [0, 565]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        /* —— Tick marks and labels ———————————————————— */
        var i;
        for (i = 2; i <= 12; i += 2) {
            board.create('segment', [[i, -8], [i, 8]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [i, -28, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#333', fixed: true, highlight: false
            });
        }
        for (i = 100; i <= 500; i += 100) {
            board.create('segment', [[-0.2, i], [0.2, i]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [-0.45, i, String(i)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle',
                color: '#333', fixed: true, highlight: false
            });
        }

        /* —— Axis labels (KaTeX) ————————————————————— */
        board.create('text', [12.7, -28, 't'], {
            fontSize: 14, color: '#333', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.45, 555, 'P'], {
            fontSize: 14, color: '#333', fixed: true, highlight: false, useKatex: true
        });

        /* —— Dashed reference lines ——————————————————— */
        // P = 500 asymptote (cyan)
        board.create('segment', [[0, 500], [12.5, 500]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 3, fixed: true, highlight: false
        });
        board.create('text', [10.5, 520, 'P = 500'], {
            fontSize: 13, color: '#0EA5E9', anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false, useKatex: true
        });

        // P = 250 reference (red, no label)
        board.create('segment', [[0, 250], [12.5, 250]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 3, fixed: true, highlight: false
        });

        /* —— Solution curves ————————————————————————— */
        var P0_A = 40;
        var bA = (500 - P0_A) / P0_A; // 11.5

        function curveA(t) {
            return 500 / (1 + bA * Math.exp(-t));
        }

        var P0_B = 350;
        var bB = (500 - P0_B) / P0_B;

        function curveB(t) {
            return 500 / (1 + bB * Math.exp(-t));
        }

        // Draw curve A — primary curve (#222222)
        var graphA = board.create('functiongraph', [
            function(t) { return curveA(t); }, 0, 12.5
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Draw curve B — second curve (#059669)
        var graphB = board.create('functiongraph', [
            function(t) { return curveB(t); }, 0, 12.5
        ], { strokeColor: '#059669', strokeWidth: 1.5, fixed: true, highlight: false, visible: false });

        /* —— Toggle logic ———————————————————————————— */
        var btnA = document.getElementById('btn-a');
        var btnB = document.getElementById('btn-b');

        function showCurve(which) {
            if (which === 'a') {
                graphA.setAttribute({ visible: true });
                graphB.setAttribute({ visible: false });
                btnA.className = 'toggle-btn active-a';
                btnB.className = 'toggle-btn';
            } else {
                graphA.setAttribute({ visible: false });
                graphB.setAttribute({ visible: true });
                btnA.className = 'toggle-btn';
                btnB.className = 'toggle-btn active-b';
            }
        }

        window.showCurve = showCurve;
    </script>
</body>
</html>
