<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment CD and Translated Image C'D'</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var COL_ORIG = '#2563EB';
        var COL_IMAGE = '#DC2626';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 7, 11, -7],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                gridX: 1,
                gridY: 1
            }
        });

        // Axis labels
        board.create('text', [10.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 6.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Original segment CD (blue) ──────────────────────────────────
        var C = board.create('point', [-1, 4], {
            name: '', size: 3, color: COL_ORIG, fixed: true, highlight: false, showInfobox: false
        });
        var D = board.create('point', [3, -1], {
            name: '', size: 3, color: COL_ORIG, fixed: true, highlight: false, showInfobox: false
        });
        board.create('segment', [C, D], {
            strokeColor: COL_ORIG, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Labels for C and D
        board.create('text', [-2.8, 4.5, 'C(-1,\\,4)'], {
            useKatex: true, fontSize: 13, color: COL_ORIG, fixed: true, highlight: false
        });
        board.create('text', [3.3, -1.6, 'D(3,\\,-1)'], {
            useKatex: true, fontSize: 13, color: COL_ORIG, fixed: true, highlight: false
        });

        // ── Translated segment C'D' (red) ───────────────────────────────
        var Cp = board.create('point', [5, 1], {
            name: '', size: 3, color: COL_IMAGE, fixed: true, highlight: false, showInfobox: false
        });
        var Dp = board.create('point', [9, -4], {
            name: '', size: 3, color: COL_IMAGE, fixed: true, highlight: false, showInfobox: false
        });
        board.create('segment', [Cp, Dp], {
            strokeColor: COL_IMAGE, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Labels for C' and D'
        board.create('text', [5.3, 1.6, "C'(5,\\,1)"], {
            useKatex: true, fontSize: 13, color: COL_IMAGE, fixed: true, highlight: false
        });
        board.create('text', [6.8, -4.6, "D'(9,\\,-4)"], {
            useKatex: true, fontSize: 13, color: COL_IMAGE, fixed: true, highlight: false
        });
    </script>
</body>
</html>
