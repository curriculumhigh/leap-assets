<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Trellis Schematic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 21, 23, -6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Triangle vertices ───────────────────────────────────────────
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [0, 12], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [16, 0], { visible: false, fixed: true, name: '' });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2.2, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2.2, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2.2, fixed: true, highlight: false
        });

        // ── Flat base segments under bottom vertices ────────────────────
        var baseLen = 2.0;
        board.create('segment', [[-baseLen, 0], [baseLen, 0]], {
            strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[16 - baseLen, 0], [16 + baseLen, 0]], {
            strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Dimension line: vertical (left of post) ────────────────────
        var dimOffX = -2.2;
        var tickHalf = 0.45;

        board.create('segment', [[dimOffX, 0], [dimOffX, 12]], {
            strokeColor: '#888888', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[dimOffX - tickHalf, 0], [dimOffX + tickHalf, 0]], {
            strokeColor: '#888888', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[dimOffX - tickHalf, 12], [dimOffX + tickHalf, 12]], {
            strokeColor: '#888888', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // ── Dimension line: horizontal (below rail) ────────────────────
        var dimOffY = -2.2;

        board.create('segment', [[0, dimOffY], [16, dimOffY]], {
            strokeColor: '#888888', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[0, dimOffY - tickHalf], [0, dimOffY + tickHalf]], {
            strokeColor: '#888888', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[16, dimOffY - tickHalf], [16, dimOffY + tickHalf]], {
            strokeColor: '#888888', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        board.create('text', [-4.2, 6, '12 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [8, -3.8, '16 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var diagMidX = 8;
        var diagMidY = 6;
        var normLen = Math.sqrt(12 * 12 + 16 * 16);
        var normX = 12 / normLen;
        var normY = 16 / normLen;
        var labelOffset = 1.8;
        board.create('text', [diagMidX + normX * labelOffset, diagMidY + normY * labelOffset, '21 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Lattice / cross-hatch decoration above top vertex ───────────
        var latticeBase = 12.6;
        var latticeTop = 16.5;
        var latticeHalf = 2.0;
        var latColor = '#555555';
        var latWidth = 1.2;
        var latticeHeight = latticeTop - latticeBase;

        var botLeft = -latticeHalf;
        var botRight = latticeHalf;
        var topLeft = -latticeHalf * 0.3;
        var topRight = latticeHalf * 0.3;

        function lerpX(frac) {
            var leftX = botLeft + (topLeft - botLeft) * frac;
            var rightX = botRight + (topRight - botRight) * frac;
            return [leftX, rightX];
        }

        board.create('segment', [[botLeft, latticeBase], [topLeft, latticeTop]], {
            strokeColor: latColor, strokeWidth: latWidth, fixed: true, highlight: false
        });
        board.create('segment', [[botRight, latticeBase], [topRight, latticeTop]], {
            strokeColor: latColor, strokeWidth: latWidth, fixed: true, highlight: false
        });
        board.create('segment', [[topLeft, latticeTop], [topRight, latticeTop]], {
            strokeColor: latColor, strokeWidth: latWidth, fixed: true, highlight: false
        });

        var spacing = 0.8;
        var steps = Math.ceil(latticeHeight / spacing);

        function clipLatticeLine(x1, y1, x2, y2) {
            var numSamples = 50;
            var validPts = [];
            for (var s = 0; s <= numSamples; s++) {
                var t = s / numSamples;
                var frac = t;
                var bounds = lerpX(frac);
                var xAtT = x1 + t * (x2 - x1);
                var yAtT = y1 + t * (y2 - y1);
                if (xAtT >= bounds[0] && xAtT <= bounds[1]) {
                    validPts.push([xAtT, yAtT]);
                }
            }
            if (validPts.length < 2) return null;
            return [validPts[0], validPts[validPts.length - 1]];
        }

        for (var i = -steps; i <= steps * 2; i++) {
            var x1start = botLeft + i * spacing;
            var x2start = x1start - latticeHeight * 0.4;
            var pts = clipLatticeLine(x1start, latticeBase, x2start, latticeTop);
            if (pts) {
                board.create('segment', [pts[0], pts[1]], {
                    strokeColor: latColor, strokeWidth: 0.8, fixed: true, highlight: false
                });
            }
        }

        for (var j = -steps; j <= steps * 2; j++) {
            var x1b = botLeft + j * spacing;
            var x2b = x1b + latticeHeight * 0.4;
            var pts2 = clipLatticeLine(x1b, latticeBase, x2b, latticeTop);
            if (pts2) {
                board.create('segment', [pts2[0], pts2[1]], {
                    strokeColor: latColor, strokeWidth: 0.8, fixed: true, highlight: false
                });
            }
        }

        board.create('segment', [[0, latticeTop], [0, latticeTop + 0.8]], {
            strokeColor: latColor, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('point', [0, latticeTop + 0.8], {
            name: '', size: 1.5, color: latColor, fixed: true, highlight: false
        });

    </script>
</body>
</html>
