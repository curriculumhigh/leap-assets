<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x ≤ -20</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-33, 3, 13, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Number line (horizontal axis with arrow on right)
        board.create('arrow', [[-31, 0], [11, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels every 5 units from -30 to 10
        var ticks = [-30, -25, -20, -15, -10, -5, 0, 5, 10];
        for (var i = 0; i < ticks.length; i++) {
            var t = ticks[i];
            // Short tick mark
            board.create('segment', [[t, -0.2], [t, 0.2]], {
                strokeColor: '#444444',
                strokeWidth: 1,
                fixed: true,
                highlight: false
            });
            // Tick label
            board.create('text', [t, -0.8, String(t)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Solution ray: from -20 going left to -31 (with arrow indicating extends to -∞)
        board.create('arrow', [[-20, 0], [-31, 0]], {
            strokeColor: '#2563EB',
            strokeWidth: 3,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Closed endpoint at x = -20
        board.create('point', [-20, 0], {
            name: '',
            size: 5,
            fillColor: '#2563EB',
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
