<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of h(t) = -16t² + 12t + 48</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .sim-layout {
            display: flex;
            gap: 12px;
            height: 100%;
        }
        .left-panel {
            width: 210px;
            flex-shrink: 0;
            background: white;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .panel-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 10px;
        }
        .equation-display {
            white-space: nowrap;
        }
        .board-wrapper {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="panel-label">Function</div>
                <div class="equation-display" id="equation"></div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        // Render equation in panel
        katex.render('h(t)=-16t^2+12t+48', document.getElementById('equation'), {
            throwOnError: false,
            displayMode: false
        });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 58, 3.5, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: {
                            fontSize: 11,
                            offset: [0, -12]
                        }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 5,
                        label: {
                            fontSize: 11,
                            offset: [-5, 0]
                        }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels near arrow tips
        board.create('text', [3.1, -2.5, '<i>t</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.25, 56, '<i>h</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        // Function: h(t) = -16t^2 + 12t + 48
        function h(t) {
            return -16 * t * t + 12 * t + 48;
        }

        // Draw the parabola
        board.create('functiongraph', [
            function(t) { return h(t); },
            -2.2, 3.2
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
