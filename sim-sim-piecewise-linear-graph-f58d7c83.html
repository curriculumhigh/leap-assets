<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Linear Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 7.8, 7, -1.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.6, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 7.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Left piece: y = 2x - 1, drawn as a ray from (3,5) extending left with arrow
        // Extend past visible left edge: at x = -0.8, y = 2(-0.8) - 1 = -2.6
        var leftEnd = board.create('point', [-0.8, -2.6], { visible: false, name: '' });
        var leftMeet = board.create('point', [3, 5], { visible: false, name: '' });

        board.create('arrow', [leftMeet, leftEnd], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Right piece: y = -x + 8, drawn as a ray from (3,5) extending right with arrow
        // Extend past visible right edge: at x = 7, y = -7 + 8 = 1
        var rightStart = board.create('point', [3, 5], { visible: false, name: '' });
        var rightEnd = board.create('point', [7, 1], { visible: false, name: '' });

        board.create('arrow', [rightStart, rightEnd], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Open circle at (3, 5) — right piece excludes x = 3 (drawn first, lower layer)
        board.create('point', [3, 5], {
            name: '', size: 5,
            fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false,
            layer: 8
        });

        // Closed dot at (3, 5) — left piece includes x = 3 (drawn on top)
        board.create('point', [3, 5], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false,
            layer: 9
        });
    </script>
</body>
</html>
