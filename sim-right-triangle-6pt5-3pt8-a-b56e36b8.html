<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — 6.5 m, 3.8 m, a</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 350px; margin: 0 auto; padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 7, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices — right angle at C (bottom-left)
        var C = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [3.8, 0], { visible: false, fixed: true, name: '' });
        var A = board.create('point', [0, 5.27], { visible: false, fixed: true, name: '' });

        // Triangle polygon — no fill, dark gray edges
        board.create('polygon', [C, B, A], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Right angle marker at C
        var raSize = 0.4;
        var ra1 = board.create('point', [raSize, 0], { visible: false, fixed: true, name: '' });
        var ra2 = board.create('point', [raSize, raSize], { visible: false, fixed: true, name: '' });
        var ra3 = board.create('point', [0, raSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [ra1, ra2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [ra2, ra3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Labels — KaTeX rendered

        // Bottom leg: 3.8 m (centered below the horizontal leg)
        board.create('text', [1.9, -0.6, '3.8 \\text{ m}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Left leg: a (centered to the left of the vertical leg)
        board.create('text', [-0.7, 2.63, 'a'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Hypotenuse: 6.5 m (centered along the hypotenuse, offset to the right)
        board.create('text', [2.5, 3.1, '6.5 \\text{ m}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
