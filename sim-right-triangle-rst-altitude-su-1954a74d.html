<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle RST with Altitude SU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 13.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertex coordinates (schematic, not to scale) ────────────────
        var Rx = 0,   Ry = 0;
        var Tx = 11,  Ty = 0;
        var Sx = 4,   Sy = 6;
        var Ux = 4,   Uy = 0;

        // ── Vertices (small fixed points) ───────────────────────────────
        var R = board.create('point', [Rx, Ry], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-18, -10], fontWeight: 'bold' }
        });
        var T = board.create('point', [Tx, Ty], {
            name: 'T', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [8, -10], fontWeight: 'bold' }
        });
        var S = board.create('point', [Sx, Sy], {
            name: 'S', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-4, 14], fontWeight: 'bold' }
        });
        var U = board.create('point', [Ux, Uy], {
            name: 'U', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-4, -16], fontWeight: 'bold' }
        });

        // ── Segments ────────────────────────────────────────────────────
        board.create('segment', [R, T], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [R, S], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [S, T], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [S, U], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Right-angle marker at S (angle RST = 90°) ──────────────────
        var markSize = 0.55;

        var dSR_x = Rx - Sx, dSR_y = Ry - Sy;
        var lenSR = Math.sqrt(dSR_x * dSR_x + dSR_y * dSR_y);
        var uSR_x = dSR_x / lenSR * markSize, uSR_y = dSR_y / lenSR * markSize;

        var dST_x = Tx - Sx, dST_y = Ty - Sy;
        var lenST = Math.sqrt(dST_x * dST_x + dST_y * dST_y);
        var uST_x = dST_x / lenST * markSize, uST_y = dST_y / lenST * markSize;

        var sM1 = [Sx + uSR_x, Sy + uSR_y];
        var sM2 = [Sx + uSR_x + uST_x, Sy + uSR_y + uST_y];
        var sM3 = [Sx + uST_x, Sy + uST_y];

        board.create('segment', [sM1, sM2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sM2, sM3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle marker at U (altitude meets hypotenuse at 90°) ─
        var uRight_x = markSize, uRight_y = 0;
        var uUp_x = 0, uUp_y = markSize;

        var uM1 = [Ux + uRight_x, Uy + uRight_y];
        var uM2 = [Ux + uRight_x + uUp_x, Uy + uRight_y + uUp_y];
        var uM3 = [Ux + uUp_x, Uy + uUp_y];

        board.create('segment', [uM1, uM2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [uM2, uM3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Segment labels (KaTeX) ─────────────────────────────────────

        // RU = (p + 2)
        var midRU_x = (Rx + Ux) / 2;
        var midRU_y = (Ry + Uy) / 2 - 0.7;
        board.create('text', [midRU_x, midRU_y, '(p + 2)'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // UT = 7
        var midUT_x = (Ux + Tx) / 2;
        var midUT_y = (Uy + Ty) / 2 - 0.7;
        board.create('text', [midUT_x, midUT_y, '7'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // RS = 12
        var midRS_x = (Rx + Sx) / 2;
        var midRS_y = (Ry + Sy) / 2;
        var nRS_x = -(Sy - Ry) / lenSR;
        var nRS_y = (Sx - Rx) / lenSR;
        board.create('text', [midRS_x + nRS_x * 0.9, midRS_y + nRS_y * 0.9, '12'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // SU = q
        var midSU_x = (Sx + Ux) / 2;
        var midSU_y = (Sy + Uy) / 2;
        board.create('text', [midSU_x + 0.7, midSU_y, 'q'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
