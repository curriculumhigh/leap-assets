<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Parabolas A–D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var COL_A = '#222222';
        var COL_B = '#2563EB';
        var COL_C = '#059669';
        var COL_D = '#D97706';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 12, 7, -6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 11.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Graph A: y = x² − 4, opens up, x-intercepts at −2 and 2 ────
        board.create('functiongraph', [
            function(x) { return x * x - 4; }
        ], { strokeColor: COL_A, strokeWidth: 1.8, fixed: true, highlight: false });

        board.create('text', [3.3, 5.5, 'A'], {
            fontSize: 15, color: COL_A, useKatex: true, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });

        // ── Graph B: y = −(x + 1)(x − 3), opens down ──────────────────
        board.create('functiongraph', [
            function(x) { return -(x + 1) * (x - 3); }
        ], { strokeColor: COL_B, strokeWidth: 1.5, fixed: true, highlight: false });

        board.create('text', [-1.5, 2.2, 'B'], {
            fontSize: 15, color: COL_B, useKatex: true, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });

        // ── Graph C: y = (x − 3)², opens up, tangent at x = 3 ──────────
        board.create('functiongraph', [
            function(x) { return (x - 3) * (x - 3); }
        ], { strokeColor: COL_C, strokeWidth: 1.5, fixed: true, highlight: false });

        board.create('text', [5.3, 4.5, 'C'], {
            fontSize: 15, color: COL_C, useKatex: true, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });

        // ── Graph D: y = (x − 2)² + 2, opens up, no x-intercepts ──────
        board.create('functiongraph', [
            function(x) { return (x - 2) * (x - 2) + 2; }
        ], { strokeColor: COL_D, strokeWidth: 1.5, fixed: true, highlight: false });

        board.create('text', [-1.7, 10.5, 'D'], {
            fontSize: 15, color: COL_D, useKatex: true, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });
    </script>
</body>
</html>
