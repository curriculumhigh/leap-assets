<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle RST with Altitude SU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 13, 28, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var R = board.create('point', [0, 0], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -10] }
        });
        var T = board.create('point', [25, 0], {
            name: 'T', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });
        var S = board.create('point', [5, 10], {
            name: 'S', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-6, 12] }
        });
        var U = board.create('point', [5, 0], {
            name: 'U', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [R, S], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [S, T], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [R, T], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Altitude SU (dashed) ────────────────────────────────────────
        board.create('segment', [S, U], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Right-angle marker at S (between SR and ST) ─────────────────
        var sLen = 1.2;
        var dSR_x = R.X() - S.X();
        var dSR_y = R.Y() - S.Y();
        var magSR = Math.sqrt(dSR_x * dSR_x + dSR_y * dSR_y);
        var uSR_x = dSR_x / magSR;
        var uSR_y = dSR_y / magSR;
        var dST_x = T.X() - S.X();
        var dST_y = T.Y() - S.Y();
        var magST = Math.sqrt(dST_x * dST_x + dST_y * dST_y);
        var uST_x = dST_x / magST;
        var uST_y = dST_y / magST;

        var raS1 = board.create('point', [S.X() + sLen * uSR_x, S.Y() + sLen * uSR_y], { visible: false, fixed: true, name: '' });
        var raS2 = board.create('point', [S.X() + sLen * uST_x, S.Y() + sLen * uST_y], { visible: false, fixed: true, name: '' });
        var raS3 = board.create('point', [S.X() + sLen * (uSR_x + uST_x), S.Y() + sLen * (uSR_y + uST_y)], { visible: false, fixed: true, name: '' });

        board.create('segment', [raS1, raS3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raS3, raS2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle marker at U (between SU and RT) ─────────────────
        var uLen = 1.2;
        var raU1 = board.create('point', [U.X(), U.Y() + uLen], { visible: false, fixed: true, name: '' });
        var raU2 = board.create('point', [U.X() + uLen, U.Y()], { visible: false, fixed: true, name: '' });
        var raU3 = board.create('point', [U.X() + uLen, U.Y() + uLen], { visible: false, fixed: true, name: '' });

        board.create('segment', [raU1, raU3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raU3, raU2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Segment labels ──────────────────────────────────────────────
        board.create('text', [2.5, -1.3, '5'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        board.create('text', [15, -1.3, '20'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        board.create('text', [6.3, 5, 'x'], {
            fontSize: 14, color: '#222222', anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
