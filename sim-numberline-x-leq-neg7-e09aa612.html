<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x ≤ -7</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-12.5, 1.2, 2.5, -1.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Number line with right arrow
        board.create('arrow', [[-12, 0], [2, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels — SHORT ticks
        var tickHeight = 0.08;
        for (var i = -11; i <= 1; i++) {
            board.create('segment', [[i, -tickHeight], [i, tickHeight]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -0.4, String(i)], {
                fontSize: 11,
                anchorX: 'middle',
                anchorY: 'middle',
                color: '#333333',
                fixed: true,
                highlight: false
            });
        }

        // Shaded ray from -7 extending left with arrow (toward -∞)
        board.create('arrow', [[-7, 0], [-12, 0]], {
            strokeColor: '#2563EB',
            strokeWidth: 3,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Closed circle at x = -7 (filled — includes -7)
        board.create('point', [-7, 0], {
            name: '',
            size: 5,
            fillColor: '#2563EB',
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
