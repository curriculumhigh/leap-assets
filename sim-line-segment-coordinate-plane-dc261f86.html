<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Segment on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 10.5, 7.5, -6.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: false
        });

        // Manual grid at every 1 unit
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]);
        var xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]);
        var yMax = Math.floor(bb[1]);
        var i;

        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // Axis labels
        board.create('text', [7.1, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 10.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Endpoints (invisible, used to define the segment)
        var pA = board.create('point', [-1, -4], { visible: false, fixed: true, name: '' });
        var pB = board.create('point', [5, 8], { visible: false, fixed: true, name: '' });

        // Line segment
        board.create('segment', [pA, pB], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Filled dot at (-1, -4)
        board.create('point', [-1, -4], {
            name: '', fixed: true, size: 3,
            fillColor: '#222222', strokeColor: '#222222',
            highlight: false, showInfobox: false
        });

        // Filled dot at (5, 8)
        board.create('point', [5, 8], {
            name: '', fixed: true, size: 3,
            fillColor: '#222222', strokeColor: '#222222',
            highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
