<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grain Silo — 3D Model</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
        }
        .container {
            width: 350px;
            height: 300px;
            margin: 0;
            padding: 0;
        }
        #scene-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="scene-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        // ── Scene setup ─────────────────────────────────────────────────
        var scene = new THREE.Scene();

        var container = document.getElementById('scene-container');
        var WIDTH = 350;
        var HEIGHT = 300;

        var camera = new THREE.PerspectiveCamera(40, WIDTH / HEIGHT, 0.1, 100);
        camera.position.set(6, 5, 8);
        camera.lookAt(0, 2.2, 0);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(WIDTH, HEIGHT);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);

        // ── Lighting ────────────────────────────────────────────────────
        var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(4, 6, 5);
        scene.add(dirLight);

        var fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
        fillLight.position.set(-3, 2, -2);
        scene.add(fillLight);

        // ── Silo dimensions ─────────────────────────────────────────────
        var cylRadius = 1.2;
        var cylHeight = 3.2;
        var coneHeight = 1.4;
        var coneBaseY = cylHeight;

        // ── Materials ───────────────────────────────────────────────────
        var cylMaterial = new THREE.MeshStandardMaterial({
            color: 0xD2A679,
            roughness: 0.7,
            metalness: 0.05
        });

        var coneMaterial = new THREE.MeshStandardMaterial({
            color: 0x8B5E3C,
            roughness: 0.6,
            metalness: 0.05
        });

        var baseMaterial = new THREE.MeshStandardMaterial({
            color: 0xC49A6C,
            roughness: 0.8,
            metalness: 0.0
        });

        var rimMaterial = new THREE.MeshStandardMaterial({
            color: 0x6B4226,
            roughness: 0.5,
            metalness: 0.1
        });

        // ── Cylinder body ───────────────────────────────────────────────
        var cylGeometry = new THREE.CylinderGeometry(cylRadius, cylRadius, cylHeight, 64, 1, false);
        var cylinder = new THREE.Mesh(cylGeometry, cylMaterial);
        cylinder.position.y = cylHeight / 2;
        scene.add(cylinder);

        // ── Cylinder bottom cap (base) ──────────────────────────────────
        var baseGeometry = new THREE.CircleGeometry(cylRadius, 64);
        var baseCap = new THREE.Mesh(baseGeometry, baseMaterial);
        baseCap.rotation.x = -Math.PI / 2;
        baseCap.position.y = 0.001;
        scene.add(baseCap);

        // ── Rim ring at cylinder-cone junction ──────────────────────────
        var rimGeometry = new THREE.TorusGeometry(cylRadius, 0.035, 12, 64);
        var rim = new THREE.Mesh(rimGeometry, rimMaterial);
        rim.rotation.x = Math.PI / 2;
        rim.position.y = coneBaseY;
        scene.add(rim);

        // ── Cone roof ───────────────────────────────────────────────────
        var coneGeometry = new THREE.ConeGeometry(cylRadius, coneHeight, 64, 1, false);
        var cone = new THREE.Mesh(coneGeometry, coneMaterial);
        cone.position.y = coneBaseY + coneHeight / 2;
        scene.add(cone);

        // ── Ground shadow hint (subtle ellipse) ─────────────────────────
        var shadowGeometry = new THREE.CircleGeometry(cylRadius * 1.3, 64);
        var shadowMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.06
        });
        var shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = -0.01;
        scene.add(shadow);

        // ── Render (single frame — static) ──────────────────────────────
        renderer.render(scene, camera);
    </script>
</body>
</html>
