<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle with Diagonal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 340px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.4, 6.3, 8.4, -1.6],
            axis: false, grid: false, showNavigation: false, showCopyright: false,
            keepAspectRatio: true, pan: { enabled: false }, zoom: { enabled: false }
        });

        // Rectangle vertices (width 7, height 5)
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [7, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [7, 5], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [0, 5], { visible: false, fixed: true, name: '' });

        // Rectangle outline
        board.create('polygon', [A, B, C, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false }, fixed: true, highlight: false
        });

        // Dashed diagonal from A (0,0) to C (7,5)
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Dimension labels (medium blue) — width along bottom, height along left
        board.create('text', [3.5, -0.65, '7'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 15, color: '#3B82F6', fixed: true, highlight: false
        });
        board.create('text', [-0.6, 2.5, '5'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 15, color: '#3B82F6', fixed: true, highlight: false
        });

        // Diagonal label "x" (KaTeX) — offset above-left of the diagonal midpoint
        board.create('text', [2.9, 2.95, 'x'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 16, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // Right-angle marker at the bottom-left corner A (0,0) — geometric mark (red/coral)
        var ra = 0.55;
        board.create('segment', [[ra, 0], [ra, ra]], { strokeColor: '#DC2626', strokeWidth: 1.3, fixed: true, highlight: false });
        board.create('segment', [[0, ra], [ra, ra]], { strokeColor: '#DC2626', strokeWidth: 1.3, fixed: true, highlight: false });
    </script>
</body>
</html>
