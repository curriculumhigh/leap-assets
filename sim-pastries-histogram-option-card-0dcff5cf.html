<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histogram — Pastries Sold Per Day</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px; margin: 0; padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white; border-radius: 6px; padding: 4px;
            height: calc(100% - 8px);
        }
        #board { width: 100%; height: 100%; }
        /* Hide JSXGraph default infobox */
        .JXGinfobox { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // Intervals and heights
        var intervals = ['0\u20139','10\u201319','20\u201329','30\u201339','40\u201349','50\u201359','60\u201369'];
        var heights = [2, 5, 9, 15, 24, 35, 28];
        var numBars = intervals.length;
        var barWidth = 10; // each bar spans 10 units on x

        // Board: x from -14 to 80, y from -12 to 46
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 46, 80, -12],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Grid: horizontal lines at y = 0,5,10,...,40 ────────────────
        var yTicks = [0, 5, 10, 15, 20, 25, 30, 35, 40];
        for (var g = 0; g < yTicks.length; g++) {
            board.create('segment', [[0, yTicks[g]], [70, yTicks[g]]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        // X-axis
        board.create('segment', [[0, 0], [72, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
        // Y-axis
        board.create('segment', [[0, 0], [0, 43]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Y-axis tick marks and labels ────────────────────────────────
        for (var t = 0; t < yTicks.length; t++) {
            // Tick mark
            board.create('segment', [[-1.2, yTicks[t]], [0, yTicks[t]]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            // Label
            board.create('text', [-2.5, yTicks[t], String(yTicks[t])], {
                fontSize: 8, anchorX: 'right', anchorY: 'middle',
                color: '#333', fixed: true, highlight: false
            });
        }

        // ── X-axis tick labels (interval names at bar centers) ──────────
        for (var i = 0; i < numBars; i++) {
            var cx = i * barWidth + barWidth / 2;
            board.create('text', [cx, -3.2, intervals[i]], {
                fontSize: 7, anchorX: 'middle', anchorY: 'top',
                color: '#333', fixed: true, highlight: false
            });
        }

        // ── Bars ────────────────────────────────────────────────────────
        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#1e4fc2';

        for (var b = 0; b < numBars; b++) {
            var x0 = b * barWidth;
            var x1 = x0 + barWidth;
            var h = heights[b];

            // Create bar as polygon
            var p1 = board.create('point', [x0, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x1, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x1, h], { visible: false, name: '' });
            var p4 = board.create('point', [x0, h], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.72,
                borders: { strokeColor: BAR_STROKE, strokeWidth: 1.2 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });
        }

        // ── Axis title labels ───────────────────────────────────────────
        // X-axis title
        board.create('text', [35, -8.5, 'Pastries sold per day'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333', fixed: true, highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // Y-axis title (rotated via CSS)
        board.create('text', [-11.5, 20, 'Frequency'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333', fixed: true, highlight: false,
            cssStyle: 'font-style: italic; transform: rotate(-90deg); transform-origin: center center;'
        });
    </script>
</body>
</html>
