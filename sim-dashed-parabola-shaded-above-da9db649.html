<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashed Parabola y = -x² + 4x - 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 4.2, 5.2, -2.2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.9, -0.35, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.15, 3.9, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Parabola function
        function f(x) {
            return -x * x + 4 * x - 3;
        }

        // Shaded region above the parabola
        var shadePts = [];
        var xMin = -1.2;
        var xMax = 5.2;
        var yTop = 4.2;
        var steps = 120;
        var dx = (xMax - xMin) / steps;

        for (var i = 0; i <= steps; i++) {
            var xv = xMin + i * dx;
            var yv = f(xv);
            if (yv < -2.2) yv = -2.2;
            shadePts.push(board.create('point', [xv, yv], { visible: false, fixed: true, name: '' }));
        }
        shadePts.push(board.create('point', [xMax, yTop], { visible: false, fixed: true, name: '' }));
        shadePts.push(board.create('point', [xMin, yTop], { visible: false, fixed: true, name: '' }));

        board.create('polygon', shadePts, {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Dashed parabola
        board.create('functiongraph', [f, -1.2, 5.2], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Key points
        board.create('point', [2, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [1, 0], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [3, 0], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
