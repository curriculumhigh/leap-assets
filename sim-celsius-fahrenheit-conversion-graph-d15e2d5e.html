<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Graph: Celsius to Fahrenheit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-38, 280, 115, -45],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid: vertical lines every 10 °C from -20 to 100 ──────────
        var ix, iy;
        for (ix = -20; ix <= 100; ix += 10) {
            board.create('segment', [[ix, 0], [ix, 250]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                fixed: true,
                highlight: false
            });
        }
        // ── Grid: horizontal lines every 10 °F from 0 to 250 ──────────
        for (iy = 0; iy <= 250; iy += 10) {
            board.create('segment', [[-20, iy], [100, iy]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                fixed: true,
                highlight: false
            });
        }

        // ── Axes ───────────────────────────────────────────────────────
        // Horizontal axis (x): Temperature in °C
        var xAxis = board.create('arrow', [[-20, 0], [108, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Vertical axis (y): Temperature in °F
        var yAxis = board.create('arrow', [[-20, 0], [-20, 265]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // ── X-axis ticks and labels (every 10, from -20 to 100) ───────
        var tickLen = 3;
        for (ix = -20; ix <= 100; ix += 10) {
            // Tick mark
            board.create('segment', [[ix, -tickLen], [ix, 0]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            // Label every 20 (and 0) to avoid crowding
            if (ix % 20 === 0) {
                board.create('text', [ix, -10, String(ix)], {
                    fontSize: 11,
                    color: '#444444',
                    anchorX: 'middle',
                    anchorY: 'middle',
                    fixed: true,
                    highlight: false
                });
            }
        }

        // ── Y-axis ticks and labels (every 10 tick, label every 50) ───
        for (iy = 0; iy <= 250; iy += 10) {
            // Tick mark
            board.create('segment', [[-20 - 1.5, iy], [-20, iy]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            // Label every 50
            if (iy % 50 === 0) {
                board.create('text', [-28, iy, String(iy)], {
                    fontSize: 11,
                    color: '#444444',
                    anchorX: 'middle',
                    anchorY: 'middle',
                    fixed: true,
                    highlight: false
                });
            }
        }

        // ── Axis name labels ──────────────────────────────────────────
        board.create('text', [40, -28, '<i>Temperature in \u00B0C</i>'], {
            fontSize: 13,
            color: '#444444',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        board.create('text', [-34, 125, '<i>Temperature in \u00B0F</i>'], {
            fontSize: 13,
            color: '#444444',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false,
            rotate: 90,
            display: 'html'
        });

        // ── Title ─────────────────────────────────────────────────────
        board.create('text', [40, 270, '<b>Conversion graph, Celsius to Fahrenheit</b>'], {
            fontSize: 14,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // ── Conversion line: passes through (0, 32) and (100, 212) ───
        // Formula: °F = (9/5) × °C + 32
        board.create('functiongraph', [
            function(x) { return (9 / 5) * x + 32; },
            -20, 100
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Key points (subtle, for reference) ───────────────────────
        board.create('point', [0, 32], {
            name: '',
            size: 2.5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
        board.create('point', [100, 212], {
            name: '',
            size: 2.5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
