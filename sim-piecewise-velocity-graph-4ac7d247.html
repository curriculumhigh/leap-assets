<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise-linear velocity graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // Static graph of a piecewise-linear velocity v(t), 0 <= t <= 11 (rule not shown).
        // Corners: (0,-4) (2,4) (3,4) (8,-6) (9,0) (11,0); crosses the t-axis at t = 1 and t = 5; at rest for 9 <= t <= 11.
        var PTS = [[0, -4], [2, 4], [3, 4], [8, -6], [9, 0], [11, 0]];

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.85, 4.85, 11.7, -6.7],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });
        var i, AX = '#444444', CURVE = '#222222';

        // Grid — 1 unit spacing
        for (i = 1; i <= 11; i++) {
            board.create('segment', [[i, -6.5], [i, 4.6]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }
        for (i = -6; i <= 4; i++) {
            if (i === 0) continue;
            board.create('segment', [[0, i], [11.35, i]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }

        // Axes
        board.create('arrow', [[-0.15, 0], [11.55, 0]], { strokeColor: AX, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false });
        board.create('arrow', [[0, -6.5], [0, 4.75]], { strokeColor: AX, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false });

        // t ticks and numbers (just below the axis, nudged to the side of the tick away from the graph)
        for (i = 1; i <= 11; i++) {
            board.create('segment', [[i, -0.08], [i, 0.08]], { strokeColor: AX, strokeWidth: 1.0, fixed: true, highlight: false });
            // at t = 5 the graph falls through the axis to the right, so that number goes on the left of its tick
            var left = (i === 5);
            board.create('text', [left ? i - 0.12 : i + 0.12, -0.38, String(i)], { fontSize: 11, color: AX, anchorX: left ? 'right' : 'left', anchorY: 'middle', fixed: true, highlight: false });
        }
        // v ticks and numbers
        for (i = -6; i <= 4; i++) {
            if (i === 0) continue;
            board.create('segment', [[-0.08, i], [0.08, i]], { strokeColor: AX, strokeWidth: 1.0, fixed: true, highlight: false });
            board.create('text', [-0.2, i, String(i)], { fontSize: 11, color: AX, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });
        }
        board.create('text', [-0.2, -0.38, '0'], { fontSize: 11, color: AX, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });

        // Axis names
        board.create('text', [11.5, 0.38, 't'], { useKatex: true, fontSize: 14, color: AX, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.15, 4.7, 'v'], { useKatex: true, fontSize: 14, color: AX, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false });

        // Graph: line segments; the at-rest piece on the t-axis is drawn thicker so it stands out
        for (i = 0; i < PTS.length - 1; i++) {
            var onAxis = PTS[i][1] === 0 && PTS[i + 1][1] === 0;
            board.create('segment', [PTS[i], PTS[i + 1]], {
                strokeColor: CURVE, strokeWidth: onAxis ? 3.2 : 1.8, lineCap: 'round', fixed: true, highlight: false
            });
        }
        board.create('text', [4.95, 1.9, 'v(t)'], { useKatex: true, fontSize: 13, color: CURVE, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false });
    </script>
</body>
</html>
