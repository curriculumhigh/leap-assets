<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Rectangles JKLM and PQRS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 18, 28, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_OUTLINE = '#555555';
        var COL_DIM = '#3B82F6';
        var COL_VERTEX = '#222222';

        // ── Rectangle JKLM: 6 wide × 10 tall ───────────────────────────
        var jklm_x = 1;
        var jklm_y = 16;
        var jklm_w = 6;
        var jklm_h = 10;

        var J = board.create('point', [jklm_x, jklm_y], { name: '', visible: false, fixed: true });
        var K = board.create('point', [jklm_x + jklm_w, jklm_y], { name: '', visible: false, fixed: true });
        var Lpt = board.create('point', [jklm_x + jklm_w, jklm_y - jklm_h], { name: '', visible: false, fixed: true });
        var M = board.create('point', [jklm_x, jklm_y - jklm_h], { name: '', visible: false, fixed: true });

        board.create('polygon', [J, K, Lpt, M], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Vertex labels — JKLM
        board.create('text', [jklm_x - 0.6, jklm_y + 0.6, 'J'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [jklm_x + jklm_w + 0.6, jklm_y + 0.6, 'K'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [jklm_x + jklm_w + 0.6, jklm_y - jklm_h - 0.6, 'L'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [jklm_x - 0.6, jklm_y - jklm_h - 0.6, 'M'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });

        // Dimension labels — JKLM
        board.create('text', [jklm_x + jklm_w / 2, jklm_y + 1.2, '6'], { fontSize: 13, color: COL_DIM, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [jklm_x - 1.4, jklm_y - jklm_h / 2, '10'], { fontSize: 13, color: COL_DIM, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });

        // ── Rectangle PQRS: 9 wide × 15 tall ────────────────────────────
        var pqrs_x = 11;
        var pqrs_y = 16;
        var pqrs_w = 9;
        var pqrs_h = 15;

        var P = board.create('point', [pqrs_x, pqrs_y], { name: '', visible: false, fixed: true });
        var Q = board.create('point', [pqrs_x + pqrs_w, pqrs_y], { name: '', visible: false, fixed: true });
        var R = board.create('point', [pqrs_x + pqrs_w, pqrs_y - pqrs_h], { name: '', visible: false, fixed: true });
        var S = board.create('point', [pqrs_x, pqrs_y - pqrs_h], { name: '', visible: false, fixed: true });

        board.create('polygon', [P, Q, R, S], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Vertex labels — PQRS
        board.create('text', [pqrs_x - 0.6, pqrs_y + 0.6, 'P'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [pqrs_x + pqrs_w + 0.6, pqrs_y + 0.6, 'Q'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [pqrs_x + pqrs_w + 0.6, pqrs_y - pqrs_h - 0.6, 'R'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [pqrs_x - 0.6, pqrs_y - pqrs_h - 0.6, 'S'], { fontSize: 14, color: COL_VERTEX, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });

        // Dimension labels — PQRS
        board.create('text', [pqrs_x + pqrs_w / 2, pqrs_y + 1.2, '9'], { fontSize: 13, color: COL_DIM, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [pqrs_x + pqrs_w + 1.4, pqrs_y - pqrs_h / 2, '15'], { fontSize: 13, color: COL_DIM, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
    </script>
</body>
</html>
