<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilateral Triangle with Height</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 23, 27, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [0, 0], { name: '', visible: false, fixed: true });
        var B = board.create('point', [24, 0], { name: '', visible: false, fixed: true });
        var C = board.create('point', [12, 12 * Math.sqrt(3)], { name: '', visible: false, fixed: true });
        var M = board.create('point', [12, 0], { name: '', visible: false, fixed: true });

        // Triangle sides
        board.create('segment', [A, B], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [A, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // Height (dashed, red)
        board.create('segment', [C, M], { strokeColor: '#DC2626', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false });

        // Right angle marker at M
        var raSize = 0.9;
        var ra1 = board.create('point', [12 + raSize, 0], { visible: false, fixed: true, name: '' });
        var ra2 = board.create('point', [12 + raSize, raSize], { visible: false, fixed: true, name: '' });
        var ra3 = board.create('point', [12, raSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [ra1, ra2], { strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false });
        board.create('segment', [ra2, ra3], { strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false });

        // Vertex points (small)
        board.create('point', [0, 0], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [24, 0], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [12, 12 * Math.sqrt(3)], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [12, 0], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });

        // --- Vertex Labels ---

        // A — bottom-left
        board.create('text', [-1.2, -0.5, 'A'], { useKatex: true, fontSize: 14, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // B — bottom-right
        board.create('text', [25.2, -0.5, 'B'], { useKatex: true, fontSize: 14, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // C — top
        board.create('text', [12, 12 * Math.sqrt(3) + 1.3, 'C'], { useKatex: true, fontSize: 14, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // M — midpoint of base
        board.create('text', [12, -1.0, 'M'], { useKatex: true, fontSize: 14, anchorX: 'middle', anchorY: 'top', color: '#222222', fixed: true, highlight: false });

        // --- Side Labels ---

        // Full base label: "24 cm" below the base
        board.create('text', [12, -2.4, '24 \\text{ cm}'], { useKatex: true, fontSize: 13, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // Left side label: "24 cm" (along AC)
        var lsMidX = (0 + 12) / 2 - 1.8;
        var lsMidY = (0 + 12 * Math.sqrt(3)) / 2 + 0.3;
        board.create('text', [lsMidX, lsMidY, '24 \\text{ cm}'], { useKatex: true, fontSize: 12, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // Right side label: "24 cm" (along BC)
        var rsMidX = (24 + 12) / 2 + 1.8;
        var rsMidY = (0 + 12 * Math.sqrt(3)) / 2 + 0.3;
        board.create('text', [rsMidX, rsMidY, '24 \\text{ cm}'], { useKatex: true, fontSize: 12, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // Height label: "h"
        board.create('text', [10.5, 12 * Math.sqrt(3) * 0.45, 'h'], { useKatex: true, fontSize: 14, anchorX: 'middle', anchorY: 'middle', color: '#DC2626', fixed: true, highlight: false });

        // --- Angle markers ---

        // 60° at vertex A (bottom-left)
        board.create('nonReflexAngle', [B, A, C], {
            radius: 2.2,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });
        board.create('text', [2.8, 1.6, '60\u00b0'], { useKatex: true, fontSize: 11, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // 60° at vertex B (bottom-right)
        board.create('nonReflexAngle', [C, B, A], {
            radius: 2.2,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });
        board.create('text', [21.2, 1.6, '60\u00b0'], { useKatex: true, fontSize: 11, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // 30° at top-left (angle between AC and CM)
        board.create('nonReflexAngle', [A, C, M], {
            radius: 2.0,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });
        board.create('text', [10.8, 12 * Math.sqrt(3) - 2.8, '30\u00b0'], { useKatex: true, fontSize: 11, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

        // 30° at top-right (angle between CM and CB)
        board.create('nonReflexAngle', [M, C, B], {
            radius: 2.0,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });
        board.create('text', [13.2, 12 * Math.sqrt(3) - 2.8, '30\u00b0'], { useKatex: true, fontSize: 11, anchorX: 'middle', anchorY: 'middle', color: '#222222', fixed: true, highlight: false });

    </script>
</body>
</html>
