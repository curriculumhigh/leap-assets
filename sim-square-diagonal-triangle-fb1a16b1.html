<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square with Diagonal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 8, 8, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Square vertices
        var A = board.create('point', [1, 1], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [6, 1], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [6, 6], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [1, 6], { visible: false, fixed: true, name: '' });

        // Square outline
        board.create('segment', [A, B], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [C, D], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [D, A], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });

        // Dashed diagonal from A (bottom-left) to C (top-right)
        board.create('segment', [A, C], {
            strokeColor: '#222222', strokeWidth: 2, dash: 2,
            fixed: true, highlight: false
        });

        // Right angle markers at all four corners
        var raSize = 0.4;

        // Bottom-left (A)
        board.create('segment', [[1 + raSize, 1], [1 + raSize, 1 + raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [[1 + raSize, 1 + raSize], [1, 1 + raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Bottom-right (B)
        board.create('segment', [[6 - raSize, 1], [6 - raSize, 1 + raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [[6 - raSize, 1 + raSize], [6, 1 + raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Top-right (C)
        board.create('segment', [[6 - raSize, 6], [6 - raSize, 6 - raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [[6 - raSize, 6 - raSize], [6, 6 - raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Top-left (D)
        board.create('segment', [[1 + raSize, 6], [1 + raSize, 6 - raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [[1 + raSize, 6 - raSize], [1, 6 - raSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Side labels — "x" on all four sides
        // Bottom
        board.create('text', [3.5, 0.3, 'x'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Top
        board.create('text', [3.5, 6.7, 'x'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Left
        board.create('text', [0.3, 3.5, 'x'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Right
        board.create('text', [6.7, 3.5, 'x'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // 45° label at bottom-left (angle between bottom side and diagonal)
        board.create('text', [2.0, 1.6, '45^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // 45° label at top-right (angle between right side and diagonal)
        board.create('text', [5.0, 5.4, '45^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
