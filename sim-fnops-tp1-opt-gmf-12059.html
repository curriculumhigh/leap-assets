<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of a parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .tick-lbl { text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 3px #fff; color: #222222; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board" role="img" aria-label="Graph of a parabola"></div>
        </div>
    </div>
    <script>
      var BB = [-5.8, 7.9, 5.8, -7.6];
      var FS = 10, AXFS = 12, TICK_H = 5;
      var XLAB = [-4, -2, 2, 4];
      var YLAB = [];   // y labels are placed per card in build()
      var AXN = [0.3, 0.9, 0.4, 0.55];

      var board = null;
      var el = document.getElementById('board');

      // Fixed plotting window, stretched to the board (non-square scale, keepAspectRatio false)
      // so the window always fills the card exactly regardless of iframe size.
      function fitBox(w, h) { return BB.slice(); }

      var AXIS = {
        strokeColor: '#444444', strokeWidth: 1.2, highlight: false, fixed: true,
        lastArrow: { type: 2, size: 6 },
        ticks: { strokeColor: '#444444', strokeWidth: 1, majorHeight: TICK_H, minorTicks: 0,
                 ticksDistance: 1, insertTicks: false, drawLabels: false, drawZero: false }
      };

      // Tick labels (labels only, no marks) at fixed positions.
      function tickLabels(axis, pos, isX) {
        board.create('ticks', [axis, pos], {
          minorTicks: 0, majorHeight: 0, drawZero: false, drawLabels: true,
          strokeOpacity: 0, highlight: false,
          label: isX
            ? { fontSize: FS, anchorX: 'middle', anchorY: 'top', offset: [0, -3], cssClass: 'tick-lbl', highlightCssClass: 'tick-lbl' }
            : { fontSize: FS, anchorX: 'right', anchorY: 'middle', offset: [-4, 0], cssClass: 'tick-lbl', highlightCssClass: 'tick-lbl' }
        });
      }

      function initBoard() {
        board = JXG.JSXGraph.initBoard('board', {
          boundingbox: fitBox(el.clientWidth, el.clientHeight),
          keepAspectRatio: false,
          axis: true,
          grid: false,
          showNavigation: false,
          showCopyright: false,
          pan: { enabled: false },
          zoom: { enabled: false, wheel: false },
          defaultAxes: { x: AXIS, y: AXIS }
        });
        board.create('grid', [], {
          majorStep: [1, 1], minorElements: 0,
          strokeColor: '#D1D5DB', strokeWidth: 0.4, strokeOpacity: 1,
          major: { face: 'line', strokeColor: '#D1D5DB', strokeWidth: 0.4, strokeOpacity: 1 },
          minor: { visible: false },
          highlight: false, fixed: true, layer: 0
        });
        tickLabels(board.defaultAxes.x, XLAB, true);
        if (YLAB.length) { tickLabels(board.defaultAxes.y, YLAB, false); }
        // Axis-name labels
        board.create('text', [function () { return board.getBoundingBox()[2] - AXN[0]; }, AXN[1], 'x'], {
          useKatex: true, fontSize: AXFS, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [AXN[2], function () { return board.getBoundingBox()[1] - AXN[3]; }, 'y'], {
          useKatex: true, fontSize: AXFS, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
      }

      // y tick labels sit on the side of the y-axis away from the parabola's vertex; the label at the
      // y-intercept height is lifted just above (positive) / below (negative) its gridline so the
      // curve's near-flat run across the y-axis never passes through that value.
      var YSIDE = 'right';
      // axis-name 'y' goes on the opposite side from the y tick labels
      AXN[2] = YSIDE === 'right' ? -0.45 : 0.45;
      function yLabels(pos, mode) {
        board.create('ticks', [board.defaultAxes.y, pos], {
          minorTicks: 0, majorHeight: 0, drawZero: false, drawLabels: true,
          strokeOpacity: 0, highlight: false,
          label: { fontSize: FS, anchorX: YSIDE === 'right' ? 'left' : 'right', anchorY: mode,
                   offset: [YSIDE === 'right' ? 4 : -4, 0],
                   cssClass: 'tick-lbl', highlightCssClass: 'tick-lbl' }
        });
      }
      function build() {
        initBoard();
        yLabels([-4, -2, 2, 4, 6], 'middle');
        yLabels([-6], 'top');
        board.create('functiongraph', [function (x) { return x * x + x - 6; }], {
          strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
      }

      // Build only once the board has a real size (the editor may load this iframe while hidden),
      // and refit the bounding box whenever the iframe is resized.
      function sync() {
        var w = el.clientWidth, h = el.clientHeight;
        if (w < 20 || h < 20) return;
        if (!board) { build(); return; }
        board.resizeContainer(w, h, true, true);
        board.setBoundingBox(fitBox(w, h), false);
        board.fullUpdate();
      }
      if (window.ResizeObserver) { new ResizeObserver(sync).observe(el); }
      window.addEventListener('resize', sync);
      window.addEventListener('load', sync);
      sync();
    </script>
</body>
</html>
