<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle 20-21-29</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var Ax = 0, Ay = 0;
        var Bx = 29, By = 0;
        var Cx = 800 / 58;
        var Cy = -Math.sqrt(400 - (800/58)*(800/58));

        var centerX = (Ax + Bx + Cx) / 3;
        var centerY = (Ay + By + Cy) / 3;

        var padX = 4.5;
        var padY = 3.5;
        var bbLeft   = Math.min(Ax, Bx, Cx) - padX;
        var bbRight  = Math.max(Ax, Bx, Cx) + padX;
        var bbTop    = Math.max(Ay, By, Cy) + padY;
        var bbBottom = Math.min(Ay, By, Cy) - padY;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [bbLeft, bbTop, bbRight, bbBottom],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [Ax, Ay], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [Bx, By], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [Cx, Cy], { visible: false, fixed: true, name: '' });

        board.create('polygon', [A, B, C], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#555555',
                strokeWidth: 2.0,
                fixed: true,
                highlight: false
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        function labelPos(p1x, p1y, p2x, p2y, offset) {
            var mx = (p1x + p2x) / 2;
            var my = (p1y + p2y) / 2;
            var dx = mx - centerX;
            var dy = my - centerY;
            var len = Math.sqrt(dx * dx + dy * dy);
            if (len < 0.001) len = 1;
            return [mx + offset * dx / len, my + offset * dy / len];
        }

        var posAB = labelPos(Ax, Ay, Bx, By, 1.8);
        board.create('text', [posAB[0], posAB[1], '29 in.'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#555555',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        var posAC = labelPos(Ax, Ay, Cx, Cy, 1.8);
        board.create('text', [posAC[0], posAC[1], '20 in.'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#555555',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        var posBC = labelPos(Bx, By, Cx, Cy, 1.8);
        board.create('text', [posBC[0], posBC[1], '21 in.'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#555555',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
