<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Chords and Radii</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 6, 6, -6],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 4;

        // EF spans 100°–160° (upper-left region)
        var angE = 100 * Math.PI / 180;
        var angF = 160 * Math.PI / 180;
        // GH at 190°–250° (lower-left region)
        var angG = 190 * Math.PI / 180;
        var angH = 250 * Math.PI / 180;

        // Center
        var Q = board.create('point', [0, 0], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, 8] }
        });

        // Circle
        board.create('circle', [Q, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Points on circumference
        var E = board.create('point', [R * Math.cos(angE), R * Math.sin(angE)], {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-6, 10] }
        });

        var F = board.create('point', [R * Math.cos(angF), R * Math.sin(angF)], {
            name: 'F', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-14, 6] }
        });

        var G = board.create('point', [R * Math.cos(angG), R * Math.sin(angG)], {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-14, -8] }
        });

        var H = board.create('point', [R * Math.cos(angH), R * Math.sin(angH)], {
            name: 'H', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-10, -10] }
        });

        // Chords — solid segments
        board.create('segment', [E, F], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [G, H], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Radii — dashed segments from circumference points to center
        board.create('segment', [Q, E], {
            strokeColor: '#555555', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [Q, F], {
            strokeColor: '#555555', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [Q, G], {
            strokeColor: '#555555', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [Q, H], {
            strokeColor: '#555555', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // ── Congruence tick marks on chords EF and GH ───────────────────
        function drawTickMark(p1, p2) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickLen = 0.25;
            board.create('segment', [
                [mx - px * tickLen, my - py * tickLen],
                [mx + px * tickLen, my + py * tickLen]
            ], {
                strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
            });
        }

        drawTickMark(E, F);
        drawTickMark(G, H);
    </script>
</body>
</html>
