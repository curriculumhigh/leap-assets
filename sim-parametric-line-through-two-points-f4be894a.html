<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Line through (-3,-1) and (1,7)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 10, 4, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Manual grid at 1-unit spacing
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]), xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]), yMax = Math.floor(bb[1]);
        var i;
        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }

        // X-axis with ticks every 2
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 2
            }
        });

        // Y-axis with ticks every 2
        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 2
            }
        });

        // Axis labels
        board.create('text', [3.5, -0.8, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 9.4, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Parametric line: x(t) = -3 + 4t, y(t) = -1 + 8t
        // Direction from (-3,-1) toward (1,7), extended beyond both points
        // At t=0: (-3,-1), at t=1: (1,7)
        // Extend: t from -0.35 to 1.3 to fill the bounding box
        var paramCurve = board.create('curve', [
            function(t) { return -3 + 4 * t; },
            function(t) { return -1 + 8 * t; },
            -0.35, 1.3
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Directional arrows along the curve using small arrow segments
        // Place arrows at roughly 1/4, 1/2, 3/4 along the visible portion
        var arrowPositions = [0.1, 0.5, 0.9];
        var dx = 4, dy = 8;
        var len = Math.sqrt(dx * dx + dy * dy);
        var ux = dx / len, uy = dy / len;
        var arrowLen = 0.45;

        for (i = 0; i < arrowPositions.length; i++) {
            (function(t) {
                var cx = -3 + 4 * t;
                var cy = -1 + 8 * t;
                board.create('arrow', [
                    [cx - ux * arrowLen, cy - uy * arrowLen],
                    [cx + ux * arrowLen, cy + uy * arrowLen]
                ], {
                    strokeColor: '#222222', strokeWidth: 1.8,
                    lastArrow: { type: 2, size: 5 },
                    fixed: true, highlight: false
                });
            })(arrowPositions[i]);
        }

        // Key points
        board.create('point', [-3, -1], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [1, 7], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
