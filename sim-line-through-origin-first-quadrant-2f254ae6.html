<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Through Origin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 30, 8.8, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 7
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.4, -1.2, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 29.2, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Line segment from (0,0) to (8,28)
        var pStart = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var pEnd = board.create('point', [8, 28], { visible: false, fixed: true, name: '' });
        board.create('segment', [pStart, pEnd], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points with permanent coordinate labels
        var keyPoints = [
            { x: 0,  y: 0,  offX: 0.35,  offY: -1.5 },
            { x: 2,  y: 7,  offX: 0.35,  offY: -1.5 },
            { x: 4,  y: 14, offX: 0.35,  offY: -1.5 },
            { x: 6,  y: 21, offX: 0.35,  offY: -1.5 }
        ];

        var COL = '#222222';

        for (var i = 0; i < keyPoints.length; i++) {
            var kp = keyPoints[i];

            board.create('point', [kp.x, kp.y], {
                name: '', size: 3, color: COL, fixed: true,
                showInfobox: false, highlight: false
            });

            board.create('text', [kp.x + kp.offX, kp.y + kp.offY,
                '(' + kp.x + ',\\,' + kp.y + ')'], {
                useKatex: true, fontSize: 12, color: COL,
                fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
