<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y = 2x² − 3x − 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 7, 4.5, -4.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // ── Custom grid at 0.5 spacing ──────────────────────────────────
        var bb = board.getBoundingBox();
        var xMin = bb[0], yMax = bb[1], xMax = bb[2], yMin = bb[3];
        var step = 0.5;
        var i;

        // Vertical grid lines
        for (i = Math.ceil(xMin / step) * step; i <= xMax; i += step) {
            if (Math.abs(i) < 0.001) continue;
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // Horizontal grid lines
        for (i = Math.ceil(yMin / step) * step; i <= yMax; i += step) {
            if (Math.abs(i) < 0.001) continue;
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // ── X-axis ──────────────────────────────────────────────────────
        board.create('arrow', [[xMin, 0], [xMax, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // X-axis tick marks at 0.5 intervals
        for (i = Math.ceil(xMin / step) * step; i <= xMax; i += step) {
            if (Math.abs(i) < 0.001) continue;
            board.create('segment', [[i, -0.08], [i, 0.08]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
        }

        // X-axis labels at integer positions only
        for (i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
            if (i === 0) continue;
            board.create('text', [i, -0.45, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Y-axis ──────────────────────────────────────────────────────
        board.create('arrow', [[0, yMin], [0, yMax]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Y-axis tick marks at 1-unit intervals
        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            if (i === 0) continue;
            board.create('segment', [[-0.08, i], [0.08, i]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
        }

        // Y-axis labels at integer positions only
        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            if (i === 0) continue;
            board.create('text', [-0.35, i, String(i)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Axis labels ─────────────────────────────────────────────────
        board.create('text', [4.1, -0.45, '<i>x</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.2, 6.6, '<i>y</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        // ── Function: y = 2x² − 3x − 2 ────────────────────────────────
        board.create('functiongraph', [
            function(x) { return 2 * x * x - 3 * x - 2; },
            -2.5, 4.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Function label ────────────────────────────────────────────
        board.create('text', [0.8, 1.5, 'y = 2x^2 - 3x - 2'], {
            fontSize: 13,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false,
            anchorX: 'middle'
        });
    </script>
</body>
</html>
