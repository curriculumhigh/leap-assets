<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Function f(x)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 5.5, 7, -4.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        var COL = '#2563EB';

        // Axis labels
        board.create('text', [6.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 5.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Piece 1: f(x) = -2 for -5 ≤ x < -2 ────────────────────────
        board.create('segment', [[-5, -2], [-2, -2]], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Closed endpoint at (-5, -2)
        board.create('point', [-5, -2], {
            name: '', size: 5, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });

        // Open endpoint at (-2, -2)
        board.create('point', [-2, -2], {
            name: '', size: 5, fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false
        });

        // ── Piece 2: f(x) = 2 for -2 ≤ x < 1 ──────────────────────────
        board.create('segment', [[-2, 2], [1, 2]], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Closed endpoint at (-2, 2)
        board.create('point', [-2, 2], {
            name: '', size: 5, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });

        // Open endpoint at (1, 2)
        board.create('point', [1, 2], {
            name: '', size: 5, fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false
        });

        // ── Piece 3: f(x) = 3 for 1 ≤ x ≤ 5 ───────────────────────────
        board.create('segment', [[1, 3], [5, 3]], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Closed endpoint at (1, 3)
        board.create('point', [1, 3], {
            name: '', size: 5, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });

        // Closed endpoint at (5, 3)
        board.create('point', [5, 3], {
            name: '', size: 5, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });

        // ── Function label ──────────────────────────────────────────────
        board.create('text', [-6, 4.5, 'f(x)'], {
            useKatex: true, fontSize: 13, color: COL, fixed: true, highlight: false
        });
    </script>
</body>
</html>
