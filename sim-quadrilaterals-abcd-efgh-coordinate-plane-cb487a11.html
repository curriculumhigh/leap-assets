<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilaterals ABCD and EFGH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 8, 6, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10, anchorX: 'middle', offset: [0, -12] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawLabels: true,
                        includeBoundaryTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10, anchorX: 'right', offset: [-6, 0] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawLabels: true,
                        includeBoundaryTicks: false
                    }
                }
            },
            grid: {
                strokeColor: '#C4C8CD',
                strokeWidth: 0.7,
                gridX: 1,
                gridY: 1
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.5, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.5, 'y'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // Colors
        var COL_ABCD = '#2563EB';
        var COL_EFGH = '#DC2626';

        // ── Quadrilateral ABCD ──────────────────────────────────────────
        var A = board.create('point', [1, 0], {
            name: '', size: 3, color: COL_ABCD, fixed: true, highlight: false, showInfobox: false
        });
        var B = board.create('point', [3, 1], {
            name: '', size: 3, color: COL_ABCD, fixed: true, highlight: false, showInfobox: false
        });
        var C = board.create('point', [4, -1], {
            name: '', size: 3, color: COL_ABCD, fixed: true, highlight: false, showInfobox: false
        });
        var D = board.create('point', [2, -2], {
            name: '', size: 3, color: COL_ABCD, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [A, B, C, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_ABCD, strokeWidth: 2.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ABCD labels
        board.create('text', [1, 0.5, 'A'], { useKatex: true, fontSize: 13, color: COL_ABCD, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [3, 1.5, 'B'], { useKatex: true, fontSize: 13, color: COL_ABCD, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [4.5, -1, 'C'], { useKatex: true, fontSize: 13, color: COL_ABCD, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [2, -2.6, 'D'], { useKatex: true, fontSize: 13, color: COL_ABCD, fixed: true, highlight: false, anchorX: 'middle' });

        // ── Quadrilateral EFGH ──────────────────────────────────────────
        var E = board.create('point', [-3, 0], {
            name: '', size: 3, color: COL_EFGH, fixed: true, highlight: false, showInfobox: false
        });
        var F = board.create('point', [-9, -3], {
            name: '', size: 3, color: COL_EFGH, fixed: true, highlight: false, showInfobox: false
        });
        var G = board.create('point', [-12, 3], {
            name: '', size: 3, color: COL_EFGH, fixed: true, highlight: false, showInfobox: false
        });
        var H = board.create('point', [-6, 6], {
            name: '', size: 3, color: COL_EFGH, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [E, F, G, H], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EFGH, strokeWidth: 2.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // EFGH labels
        board.create('text', [-2.5, 0.5, 'E'], { useKatex: true, fontSize: 13, color: COL_EFGH, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [-9, -3.6, 'F'], { useKatex: true, fontSize: 13, color: COL_EFGH, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [-12.7, 3, 'G'], { useKatex: true, fontSize: 13, color: COL_EFGH, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [-6, 6.5, 'H'], { useKatex: true, fontSize: 13, color: COL_EFGH, fixed: true, highlight: false, anchorX: 'middle' });
    </script>
</body>
</html>
