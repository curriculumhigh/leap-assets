<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Reflection — Parallel Lines k and m</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 8, 9.5, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [9.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 7.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Parallel vertical lines k and m ─────────────────────────────
        // Line k at x = 2
        board.create('line', [[2, 0], [2, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.5, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Line m at x = 5
        board.create('line', [[5, 0], [5, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.5, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Line labels near the top
        board.create('text', [2.25, 7.2, 'k'], {
            fontSize: 15, color: '#0EA5E9', fixed: true, highlight: false,
            cssStyle: 'font-style: italic; font-weight: 600;'
        });
        board.create('text', [5.25, 7.2, 'm'], {
            fontSize: 15, color: '#0EA5E9', fixed: true, highlight: false,
            cssStyle: 'font-style: italic; font-weight: 600;'
        });

        // ── Points B, B', B'' along y = 4 ──────────────────────────────
        var yLevel = 4;

        // Dashed segment B → B'
        board.create('segment', [[0, yLevel], [4, yLevel]], {
            strokeColor: '#222222', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Dashed segment B' → B''
        board.create('segment', [[4, yLevel], [6, yLevel]], {
            strokeColor: '#222222', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Point B at x = 0
        board.create('point', [0, yLevel], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0, yLevel + 0.55, 'B'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', fixed: true, highlight: false,
            useKatex: true
        });

        // Point B' at x = 4
        board.create('point', [4, yLevel], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [4, yLevel + 0.55, "B'"], {
            fontSize: 14, color: '#222222', anchorX: 'middle', fixed: true, highlight: false,
            useKatex: true
        });

        // Point B'' at x = 6
        board.create('point', [6, yLevel], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [6, yLevel + 0.55, "B''"], {
            fontSize: 14, color: '#222222', anchorX: 'middle', fixed: true, highlight: false,
            useKatex: true
        });

        // ── Distance label d = 3 between k and m ───────────────────────
        var dY = 1.2; // y-level for the distance indicator

        // Double-arrow between lines k and m
        board.create('arrow', [[2, dY], [5, dY]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, firstArrow: { type: 2, size: 5 }
        });

        // Small vertical ticks at endpoints of the distance arrow
        board.create('segment', [[2, dY - 0.25], [2, dY + 0.25]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[5, dY - 0.25], [5, dY + 0.25]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // Label "d = 3"
        board.create('text', [3.5, dY + 0.55, 'd = 3'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', fixed: true, highlight: false,
            useKatex: true
        });

    </script>
</body>
</html>
