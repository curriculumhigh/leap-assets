<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilateral Triangle JKL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 5.5, 5.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Triangle vertices ───────────────────────────────────────────
        var side = 5;
        var Kx = -0.5, Ky = 0;
        var Lx = Kx + side, Ly = 0;
        var Jx = Kx + side / 2, Jy = Ky + side * Math.sqrt(3) / 2;

        var ptJ = board.create('point', [Jx, Jy], {
            name: 'J', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 14] }
        });
        var ptK = board.create('point', [Kx, Ky], {
            name: 'K', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -10] }
        });
        var ptL = board.create('point', [Lx, Ly], {
            name: 'L', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, -10] }
        });

        // ── Triangle polygon ────────────────────────────────────────────
        board.create('polygon', [ptJ, ptK, ptL], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });
        ptJ.setAttribute({ visible: true });
        ptK.setAttribute({ visible: true });
        ptL.setAttribute({ visible: true });

        // ── Congruence tick marks ───────────────────────────────────────
        var TICK_LEN = 0.28;
        var TICK_COL = '#DC2626';
        var TICK_W = 1.8;

        function drawTick(ax, ay, bx, by) {
            var mx = (ax + bx) / 2;
            var my = (ay + by) / 2;
            var dx = bx - ax;
            var dy = by - ay;
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            board.create('segment',
                [[mx - px * TICK_LEN, my - py * TICK_LEN],
                 [mx + px * TICK_LEN, my + py * TICK_LEN]], {
                strokeColor: TICK_COL, strokeWidth: TICK_W,
                fixed: true, highlight: false
            });
        }

        drawTick(Jx, Jy, Kx, Ky);
        drawTick(Kx, Ky, Lx, Ly);
        drawTick(Lx, Ly, Jx, Jy);

        // ── Angle arc at L ──────────────────────────────────────────────
        board.create('nonReflexAngle', [ptK, ptL, ptJ], {
            radius: 0.7,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // ── Angle label at L ────────────────────────────────────────────
        var dKx = Kx - Lx, dKy = Ky - Ly;
        var dJx = Jx - Lx, dJy = Jy - Ly;
        var lenK = Math.sqrt(dKx * dKx + dKy * dKy);
        var lenJ = Math.sqrt(dJx * dJx + dJy * dJy);
        var bisX = dKx / lenK + dJx / lenJ;
        var bisY = dKy / lenK + dJy / lenJ;
        var bisLen = Math.sqrt(bisX * bisX + bisY * bisY);
        var labelDist = 1.35;
        var lblX = Lx + labelDist * bisX / bisLen;
        var lblY = Ly + labelDist * bisY / bisLen;

        board.create('text', [lblX, lblY, '(5x)^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
