<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Graph — Feet to Metres</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1100, 2850, 7600, -500],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Minor grid lines
        var i;
        for (i = 200; i <= 7000; i += 200) {
            board.create('segment', [[i, 0], [i, 2400]], {
                strokeColor: '#E5E7EB', strokeWidth: 0.3, fixed: true, highlight: false
            });
        }
        for (i = 100; i <= 2400; i += 100) {
            board.create('segment', [[0, i], [7000, i]], {
                strokeColor: '#E5E7EB', strokeWidth: 0.3, fixed: true, highlight: false
            });
        }

        // Major grid lines
        for (i = 1000; i <= 7000; i += 1000) {
            board.create('segment', [[i, 0], [i, 2400]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 400; i <= 2400; i += 400) {
            board.create('segment', [[0, i], [7000, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // X-axis
        board.create('arrow', [[0, 0], [7400, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });
        // Y-axis
        board.create('arrow', [[0, 0], [0, 2700]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // X-axis tick marks
        for (i = 1000; i <= 7000; i += 1000) {
            board.create('segment', [[i, -60], [i, 60]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
        }
        // X-axis tick labels every 2000
        var xTickLabels = [2000, 4000, 6000];
        for (var t = 0; t < xTickLabels.length; t++) {
            board.create('text', [xTickLabels[t], -200, String(xTickLabels[t])], {
                fontSize: 9, anchorX: 'middle', anchorY: 'top', color: '#333',
                fixed: true, highlight: false
            });
        }

        // Y-axis tick marks
        for (i = 400; i <= 2400; i += 400) {
            board.create('segment', [[-100, i], [100, i]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
        }
        // Y-axis tick labels every 800
        var yTickLabels = [800, 1600, 2400];
        for (var u = 0; u < yTickLabels.length; u++) {
            board.create('text', [-180, yTickLabels[u], String(yTickLabels[u])], {
                fontSize: 9, anchorX: 'right', anchorY: 'middle', color: '#333',
                fixed: true, highlight: false
            });
        }

        // Axis name labels
        board.create('text', [6800, -350, '\\textit{Feet}'], {
            fontSize: 10, useKatex: true, fixed: true, highlight: false, color: '#333'
        });
        board.create('text', [250, 2650, '\\textit{Metres}'], {
            fontSize: 10, useKatex: true, fixed: true, highlight: false, color: '#333'
        });

        // Conversion line: (0,0) to (7000, 7000*2400/6200)
        board.create('segment', [[0, 0], [7000, 7000 * 2400 / 6200]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points (no labels)
        board.create('point', [0, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [6200, 2400], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
