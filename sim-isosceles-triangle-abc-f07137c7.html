<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 5.5, 4, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var B = board.create('point', [-3, -1], {
            name: 'B', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-12, -12] }
        });
        var C = board.create('point', [3, -1], {
            name: 'C', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [6, -12] }
        });
        var A = board.create('point', [0, 3], {
            name: 'A', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, 10] }
        });

        // Triangle outline
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Show vertex points on top of polygon
        A.setAttribute({ visible: true });
        B.setAttribute({ visible: true });
        C.setAttribute({ visible: true });

        // Equal angle arcs at B and C
        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false
        });

        // Tick marks on congruent sides AB and AC
        function drawTick(p1, p2) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickLen = 0.3;
            board.create('segment', [
                [mx - px * tickLen, my - py * tickLen],
                [mx + px * tickLen, my + py * tickLen]
            ], {
                strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        drawTick(A, B);
        drawTick(A, C);
    </script>
</body>
</html>
