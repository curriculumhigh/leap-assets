<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle with Altitude</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 8.5, 9.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [1, 0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var B = board.create('point', [8, 0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var C = board.create('point', [5.5, 7], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        // Triangle polygon (no fill)
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Foot of altitude (directly below apex on the base)
        var F = board.create('point', [5.5, 0], { name: '', fixed: true, size: 0, color: '#222222', visible: false });

        // Altitude (dashed)
        board.create('segment', [C, F], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Right-angle mark at foot
        var sqSize = 0.45;
        board.create('polygon', [
            [5.5, 0],
            [5.5 + sqSize, 0],
            [5.5 + sqSize, sqSize],
            [5.5, sqSize]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Label: base "3x + 4" centered below
        board.create('text', [4.5, -0.9, '3x + 4'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Label: altitude "x + 5" to the left of the altitude
        board.create('text', [4.3, 3.5, 'x + 5'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
