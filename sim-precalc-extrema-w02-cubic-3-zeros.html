<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Polynomial with Three Zeros and Two Turning Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 520px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var COL_CURVE = '#222222';
        var COL_ZERO  = '#888888';
        var COL_P     = '#2563EB';
        var COL_Q     = '#059669';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 12, 5, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 2 }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        board.create('text', [4.6, -0.6, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 11.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Curve: f(x) = (x+2)(x-1)(x-4)
        var f = function(x) { return (x + 2) * (x - 1) * (x - 4); };
        board.create('functiongraph', [f, -3.5, 5], {
            strokeColor: COL_CURVE, strokeWidth: 2.2, fixed: true, highlight: false
        });

        // Zeros at x = -2, 1, 4
        var zeros = [-2, 1, 4];
        zeros.forEach(function(z) {
            board.create('point', [z, 0], {
                name: '', size: 3, fillColor: COL_ZERO, strokeColor: COL_ZERO,
                fixed: true, showInfobox: false, highlight: false
            });
        });
        board.create('text', [-2, -1.4, 'x = -2'], { fontSize: 12, color: COL_ZERO, fixed: true, anchorX: 'middle', highlight: false });
        board.create('text', [1, -1.4, 'x = 1'], { fontSize: 12, color: COL_ZERO, fixed: true, anchorX: 'middle', highlight: false });
        board.create('text', [4, -1.4, 'x = 4'], { fontSize: 12, color: COL_ZERO, fixed: true, anchorX: 'middle', highlight: false });

        // Turning points: P (local max) and Q (local min)
        // f'(x) = 3x^2 - 6x - 6 = 0 -> x = 1 ± sqrt(3)
        var xP = 1 - Math.sqrt(3); // ≈ -0.732
        var xQ = 1 + Math.sqrt(3); // ≈  2.732
        var yP = f(xP);            // ≈  8.392
        var yQ = f(xQ);            // ≈ -8.392

        board.create('point', [xP, yP], {
            name: 'P', size: 4, fillColor: COL_P, strokeColor: COL_P,
            fixed: true, showInfobox: false, highlight: false,
            label: { offset: [10, 2], fontSize: 14, color: COL_P, cssStyle: 'font-weight:700;' }
        });
        board.create('point', [xQ, yQ], {
            name: 'Q', size: 4, fillColor: COL_Q, strokeColor: COL_Q,
            fixed: true, showInfobox: false, highlight: false,
            label: { offset: [10, -2], fontSize: 14, color: COL_Q, cssStyle: 'font-weight:700;' }
        });

        // Small direction arrows on the curve segments — placed at representative x values
        // Tick marks (small triangle decorators)
        function arrow(xa, dir) {
            var ya = f(xa);
            var dx = 0.001;
            var slope = (f(xa + dx) - f(xa - dx)) / (2 * dx);
            // arrow tip direction unit vector
            var nrm = Math.sqrt(1 + slope * slope);
            var ux = dir / nrm;
            var uy = (dir * slope) / nrm;
            board.create('arrow', [[xa - 0.15 * ux, ya - 0.15 * uy], [xa + 0.15 * ux, ya + 0.15 * uy]], {
                strokeColor: COL_CURVE, strokeWidth: 1.5, fixed: true, highlight: false,
                lastArrow: { type: 1, size: 4 }, firstArrow: false
            });
        }
        // Increasing before P (left side)
        arrow(-1.7, 1);
        // Decreasing after P, before Q
        arrow(1, -1);
        // Increasing after Q (right side)
        arrow(3.7, 1);
    </script>
</body>
</html>
