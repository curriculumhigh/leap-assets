<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — 60° Angle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 8, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [0, 0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var B = board.create('point', [6, 0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var C = board.create('point', [0, 5.5], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        // Triangle edges
        board.create('segment', [A, B], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [A, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // Right angle marker at A (bottom-left)
        var raSize = 0.55;
        var ra1 = board.create('point', [raSize, 0], { visible: false, fixed: true, name: '' });
        var ra2 = board.create('point', [raSize, raSize], { visible: false, fixed: true, name: '' });
        var ra3 = board.create('point', [0, raSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [ra1, ra2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [ra2, ra3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // 60° angle arc at B (bottom-right)
        board.create('nonReflexAngle', [C, B, A], {
            radius: 0.8,
            fillColor: '#DC2626',
            fillOpacity: 0.08,
            strokeColor: '#DC2626',
            strokeWidth: 1.5,
            fixed: true,
            name: '',
            withLabel: false,
            highlight: false
        });

        // 60° label near the arc at B
        board.create('text', [4.85, 0.55, '60^\\circ'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Side labels

        // Vertical leg (left side): 2√5
        board.create('text', [-0.9, 2.75, '2\\sqrt{5}'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Horizontal leg (bottom): x
        board.create('text', [3, -0.7, 'x'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Hypotenuse: y
        board.create('text', [3.7, 3.2, 'y'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });
    </script>
</body>
</html>
