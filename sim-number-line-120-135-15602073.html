<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line 120–135</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [119.0, 3.5, 136.0, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Number line (horizontal segment with arrows on both ends) ───
        board.create('arrow', [[119.5, 0], [135.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // ── Tick marks ──────────────────────────────────────────────────
        var MAJOR_HALF = 0.55;
        var MINOR_HALF = 0.30;

        for (var v = 120; v <= 135; v += 0.5) {
            var isInteger = (v === Math.round(v));
            var h = isInteger ? MAJOR_HALF : MINOR_HALF;

            board.create('segment', [[v, -h], [v, h]], {
                strokeColor: '#444444',
                strokeWidth: isInteger ? 1.2 : 0.8,
                fixed: true,
                highlight: false
            });

            if (isInteger) {
                board.create('text', [v, -MAJOR_HALF - 0.45, String(Math.round(v))], {
                    anchorX: 'middle',
                    anchorY: 'top',
                    fontSize: 11,
                    color: '#444444',
                    fixed: true,
                    highlight: false
                });
            }
        }

        // ── Solid dots at 124.5 and 128 ─────────────────────────────────
        board.create('point', [124.5, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        board.create('point', [128, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // ── Point labels (above the dots) ───────────────────────────────
        board.create('text', [124.5, 1.2, '124.5'], {
            anchorX: 'middle',
            anchorY: 'bottom',
            fontSize: 13,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });

        board.create('text', [128, 1.2, '128'], {
            anchorX: 'middle',
            anchorY: 'bottom',
            fontSize: 13,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
