<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downward Parabola — Shaded Above (Error)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var xMin = -1.5, xMax = 5.5, yMin = -2, yMax = 6;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [xMin, yMax, xMax, yMin],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [xMax - 0.4, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, yMax - 0.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola: y = -3/4 (x - 2)^2 + 3
        // Vertex (2, 3), x-intercepts at 2 ± 2 = 0.27 and 3.73
        var a = -3 / 4;
        var h = 2;
        var k = 3;

        function f(x) {
            return a * (x - h) * (x - h) + k;
        }

        // Shaded region ABOVE the parabola (the error region)
        var shadePts = [];
        var nSamples = 200;
        var dx = (xMax - xMin) / nSamples;

        // Top-left corner
        shadePts.push(board.create('point', [xMin, yMax], { visible: false, fixed: true, name: '' }));
        // Top-right corner
        shadePts.push(board.create('point', [xMax, yMax], { visible: false, fixed: true, name: '' }));

        // Right edge down to the parabola value at xMax
        var yAtXMax = f(xMax);
        if (yAtXMax < yMin) yAtXMax = yMin;
        shadePts.push(board.create('point', [xMax, yAtXMax], { visible: false, fixed: true, name: '' }));

        // Trace parabola from right to left
        for (var i = nSamples; i >= 0; i--) {
            var xi = xMin + i * dx;
            var yi = f(xi);
            if (yi < yMin) yi = yMin;
            shadePts.push(board.create('point', [xi, yi], { visible: false, fixed: true, name: '' }));
        }

        board.create('polygon', shadePts, {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Parabola curve (on top of shading)
        board.create('functiongraph', [f, xMin, xMax], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points
        // Vertex
        board.create('point', [h, k], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // x-intercepts: 2 - 2 and 2 + 2
        var xInt1 = 2 - 2;
        var xInt2 = 2 + 2;
        board.create('point', [xInt1, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [xInt2, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Function label (name only)
        board.create('text', [-0.8, 4.5, 'f(x)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
