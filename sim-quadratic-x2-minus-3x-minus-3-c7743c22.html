<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of f(x) = x² − 3x − 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.8, 17, 4.8, -7],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 1,
                        minorHeight: -1,
                        ticksDistance: 0.5
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 1,
                        minorHeight: -1,
                        ticksDistance: 2
                    }
                }
            },
            grid: false
        });

        var i;

        // Major vertical grid lines every 0.5
        for (i = -4; i <= 4; i += 0.5) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                fixed: true,
                highlight: false,
                straightFirst: true,
                straightLast: true
            });
        }

        // Major horizontal grid lines every 2
        for (i = -6; i <= 16; i += 2) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                fixed: true,
                highlight: false,
                straightFirst: true,
                straightLast: true
            });
        }

        // Minor vertical grid lines every 0.25 (between the 0.5 majors)
        for (i = -4.75; i <= 4.75; i += 0.5) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#E5E7EB',
                strokeWidth: 0.25,
                fixed: true,
                highlight: false,
                straightFirst: true,
                straightLast: true
            });
        }

        // Minor horizontal grid lines every 1 (between the 2-unit majors)
        for (i = -5; i <= 15; i += 2) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#E5E7EB',
                strokeWidth: 0.25,
                fixed: true,
                highlight: false,
                straightFirst: true,
                straightLast: true
            });
        }

        // Axis labels
        board.create('text', [4.4, -0.8, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 16.3, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // f(x) = x^2 - 3x - 3
        board.create('functiongraph', [
            function(x) { return x * x - 3 * x - 3; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // X-intercepts: x = (3 ± sqrt(21)) / 2
        var sqrt21 = Math.sqrt(21);
        var xInt1 = (3 - sqrt21) / 2;
        var xInt2 = (3 + sqrt21) / 2;

        board.create('point', [xInt1, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        board.create('point', [xInt2, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Function label — name only
        board.create('text', [-3.5, 12, 'f(x)'], {
            fontSize: 13,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
