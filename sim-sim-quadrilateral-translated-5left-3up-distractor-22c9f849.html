<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral Translated 5 Left 3 Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9.5, 5.5, 9.5, -1.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [9.0, -0.4, 'x'], { fontSize: 12, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.3, 5.1, 'y'], { fontSize: 12, fixed: true, highlight: false, useKatex: true });

        // Vertices
        var Ap = board.create('point', [-6, 1], {
            name: '', size: 4, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        var Bp = board.create('point', [-8, 4], {
            name: '', size: 4, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        var Cp = board.create('point', [-4, 4], {
            name: '', size: 4, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        var Dp = board.create('point', [0, 0], {
            name: '', size: 4, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });

        // Polygon with no fill
        board.create('polygon', [Ap, Bp, Cp, Dp], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#2563EB', strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Labels (KaTeX)
        board.create('text', [-6.6, 0.4, "A'"], { fontSize: 12, color: '#DC2626', useKatex: true, fixed: true, highlight: false });
        board.create('text', [-8.5, 4.3, "B'"], { fontSize: 12, color: '#DC2626', useKatex: true, fixed: true, highlight: false });
        board.create('text', [-4.2, 4.3, "C'"], { fontSize: 12, color: '#DC2626', useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.3, -0.6, "D'"], { fontSize: 12, color: '#DC2626', useKatex: true, fixed: true, highlight: false });
    </script>
</body>
</html>
