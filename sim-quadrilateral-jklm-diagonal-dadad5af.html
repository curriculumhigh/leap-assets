<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral JKLM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 8.5, 12.5, -0.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var J = board.create('point', [2, 1.5], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var K = board.create('point', [2, 6.9], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var L = board.create('point', [9.8, 6.9], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var M = board.create('point', [9.8, 1.5], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });

        board.create('polygon', [J, K, L, M], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('segment', [J, L], {
            strokeColor: '#555555', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        board.create('text', [1.3, 0.9, 'J'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });
        board.create('text', [1.3, 7.3, 'K'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });
        board.create('text', [10.2, 7.3, 'L'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });
        board.create('text', [10.2, 0.9, 'M'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        board.create('text', [0.5, 4.2, '7 cm'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style:italic'
        });

        board.create('text', [5.9, 7.7, '9 cm'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style:italic'
        });

        board.create('text', [11.2, 4.2, '7 cm'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style:italic'
        });

        board.create('text', [5.9, 0.7, '9 cm'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style:italic'
        });
    </script>
</body>
</html>
