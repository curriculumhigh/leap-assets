<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle WXY with Midsegment PQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 10.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Vertices ────────────────────────────────────── */
        var W = board.create('point', [4, 6.5], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var X = board.create('point', [0.5, 0.5], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var Y = board.create('point', [9, 0.5], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        /* ── Triangle ────────────────────────────────────── */
        board.create('polygon', [W, X, Y], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        /* ── Midpoints ───────────────────────────────────── */
        var P = board.create('midpoint', [W, X], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var Q = board.create('midpoint', [W, Y], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        /* ── Midsegment PQ ───────────────────────────────── */
        board.create('segment', [P, Q], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        /* ── Tick marks (midpoint indicators) ────────────── */
        function drawTick(p1, p2, color) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickLen = 0.25;
            board.create('segment', [
                [mx - px * tickLen, my - py * tickLen],
                [mx + px * tickLen, my + py * tickLen]
            ], {
                strokeColor: color, strokeWidth: 1.8, fixed: true, highlight: false
            });
        }

        drawTick(W, P, '#222222');
        drawTick(P, X, '#222222');

        function drawDoubleTick(p1, p2, color) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var ux = dx / len;
            var uy = dy / len;
            var tickLen = 0.25;
            var gap = 0.12;
            board.create('segment', [
                [mx - gap * ux - px * tickLen, my - gap * uy - py * tickLen],
                [mx - gap * ux + px * tickLen, my - gap * uy + py * tickLen]
            ], {
                strokeColor: color, strokeWidth: 1.8, fixed: true, highlight: false
            });
            board.create('segment', [
                [mx + gap * ux - px * tickLen, my + gap * uy - py * tickLen],
                [mx + gap * ux + px * tickLen, my + gap * uy + py * tickLen]
            ], {
                strokeColor: color, strokeWidth: 1.8, fixed: true, highlight: false
            });
        }

        drawDoubleTick(W, Q, '#222222');
        drawDoubleTick(Q, Y, '#222222');

        /* ── Vertex labels ───────────────────────────────── */
        board.create('text', [W.X() - 0.1, W.Y() + 0.55, '<b>W</b>'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [X.X() - 0.5, X.Y() - 0.15, '<b>X</b>'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
        board.create('text', [Y.X() + 0.5, Y.Y() - 0.15, '<b>Y</b>'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        /* ── Midpoint labels ─────────────────────────────── */
        board.create('text', [P.X() - 0.55, P.Y() + 0.15, '<b>P</b>'], {
            fontSize: 14, color: '#222222', anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [Q.X() + 0.55, Q.Y() + 0.15, '<b>Q</b>'], {
            fontSize: 14, color: '#222222', anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
