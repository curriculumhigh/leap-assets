<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congruent Chords Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.8;

        var angQ = 90 * Math.PI / 180;
        var angP = 175 * Math.PI / 180;
        var angR = 5 * Math.PI / 180;

        // Center O
        var O = board.create('point', [0, 0], {
            name: 'O', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [6, -10] }
        });

        // Circle
        var circle = board.create('circle', [O, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Points on circle
        var P = board.create('point', [R * Math.cos(angP), R * Math.sin(angP)], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-16, 2] }
        });

        var Q = board.create('point', [R * Math.cos(angQ), R * Math.sin(angQ)], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, 12] }
        });

        var Rpt = board.create('point', [R * Math.cos(angR), R * Math.sin(angR)], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [10, 2] }
        });

        // Chords PQ and QR
        var chordPQ = board.create('segment', [P, Q], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        var chordQR = board.create('segment', [Q, Rpt], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        function drawTickMark(p1, p2) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickLen = 0.28;
            var t1 = board.create('point', [mx + px * tickLen, my + py * tickLen], { visible: false, fixed: true, name: '' });
            var t2 = board.create('point', [mx - px * tickLen, my - py * tickLen], { visible: false, fixed: true, name: '' });
            board.create('segment', [t1, t2], {
                strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
            });
        }

        drawTickMark(P, Q);
        drawTickMark(Q, Rpt);

        var majorArcMidAngle = 270 * Math.PI / 180;
        var labelR = R + 0.85;

        board.create('text', [
            labelR * Math.cos(majorArcMidAngle),
            labelR * Math.sin(majorArcMidAngle),
            '190^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var arcR = R + 0.15;

        var indStart1 = 270 - 35;
        var indEnd1 = 270 - 15;
        board.create('curve', [
            function(t) { return arcR * Math.cos(t * Math.PI / 180); },
            function(t) { return arcR * Math.sin(t * Math.PI / 180); },
            indEnd1, indStart1
        ], {
            strokeColor: '#888888', strokeWidth: 0.8, fixed: true, highlight: false
        });

        var indStart2 = 270 + 15;
        var indEnd2 = 270 + 35;
        board.create('curve', [
            function(t) { return arcR * Math.cos(t * Math.PI / 180); },
            function(t) { return arcR * Math.sin(t * Math.PI / 180); },
            indStart2, indEnd2
        ], {
            strokeColor: '#888888', strokeWidth: 0.8, fixed: true, highlight: false
        });

    </script>
</body>
</html>
