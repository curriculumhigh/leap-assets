<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise-Linear Velocity Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 7, 9.8, -11],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels (KaTeX)
        board.create('text', [9.3, -0.7, 't\\text{ (seconds)}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.25, 6.5, 'v\\text{ (ft/sec)}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Piecewise-linear segments
        var dataX = [0, 3, 6, 8];
        var dataY = [4, -8, 4, 0];

        for (var i = 0; i < dataX.length - 1; i++) {
            board.create('segment',
                [[dataX[i], dataY[i]], [dataX[i + 1], dataY[i + 1]]],
                { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false }
            );
        }

        // Key points
        for (var j = 0; j < dataX.length; j++) {
            board.create('point', [dataX[j], dataY[j]], {
                name: '', size: 3, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });
        }

        // Coordinate labels — placed to avoid overlaps
        // (0, 4): on v-axis, place to the right and slightly above
        board.create('text', [0.3, 4.6, '(0,\\, 4)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // (3, -8): lowest point, place to the right and below
        board.create('text', [3.25, -8.7, '(3,\\, {-8})'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // (6, 4): place to the right and above
        board.create('text', [6.25, 4.6, '(6,\\, 4)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // (8, 0): on t-axis, place to the right and above
        board.create('text', [8.2, 0.6, '(8,\\, 0)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // Function label (name only)
        board.create('text', [7.5, 5.5, 'v(t)'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
