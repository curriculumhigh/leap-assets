<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle DEF — ASA Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var angD_rad = 52 * Math.PI / 180;
        var angF_rad = 71 * Math.PI / 180;

        var baseLen = 8;

        var Dx = 0, Dy = 0;
        var Fx = baseLen, Fy = 0;

        var dxD = Math.cos(angD_rad), dyD = Math.sin(angD_rad);
        var dxF = Math.cos(Math.PI - angF_rad), dyF = Math.sin(Math.PI - angF_rad);

        var det = dxD * (-dyF) - (-dxF) * dyD;
        var t = ((Fx - Dx) * (-dyF) - (Fy - Dy) * (-dxF)) / det;

        var Ex = Dx + t * dxD;
        var Ey = Dy + t * dyD;

        var allX = [Dx, Fx, Ex];
        var allY = [Dy, Fy, Ey];
        var minX = Math.min.apply(null, allX), maxX = Math.max.apply(null, allX);
        var minY = Math.min.apply(null, allY), maxY = Math.max.apply(null, allY);
        var padX = (maxX - minX) * 0.25;
        var padY = (maxY - minY) * 0.25;
        var padTop = (maxY - minY) * 0.32;
        var padBot = (maxY - minY) * 0.35;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [minX - padX, maxY + padTop, maxX + padX, minY - padBot],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var D = board.create('point', [Dx, Dy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var E = board.create('point', [Ex, Ey], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var F = board.create('point', [Fx, Fy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        board.create('polygon', [D, E, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('text', [Dx - 0.55, Dy - 0.25, 'D'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [Fx + 0.55, Fy - 0.25, 'F'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [Ex, Ey + 0.55, 'E'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        board.create('nonReflexAngle', [F, D, E], {
            radius: 0.8,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        board.create('nonReflexAngle', [E, F, D], {
            radius: 0.8,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        var bisD = 26 * Math.PI / 180;
        var lblDistD = 1.25;
        board.create('text', [Dx + lblDistD * Math.cos(bisD), Dy + lblDistD * Math.sin(bisD), '52^\\circ'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        var bisF = (Math.PI + (Math.PI - angF_rad)) / 2;
        var lblDistF = 1.25;
        board.create('text', [Fx + lblDistF * Math.cos(bisF), Fy + lblDistF * Math.sin(bisF), '71^\\circ'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        var midDFx = (Dx + Fx) / 2;
        var midDFy = (Dy + Fy) / 2;
        board.create('text', [midDFx, midDFy - 0.65, '18'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
