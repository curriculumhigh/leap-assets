<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola x = ((y+1)/2)^2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 6, 10, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [9.5, -0.5, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 5.5, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Parabola: x = ((y+1)/2)^2
        board.create('curve', [
            function(t) { return Math.pow((t + 1) / 2, 2); },
            function(t) { return t; },
            -8, 6
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Directional arrows at the ends of the curve
        var arrowLen = 1.2;

        // Upper arrow
        var tUp = 5.5;
        var xUp = Math.pow((tUp + 1) / 2, 2);
        var yUp = tUp;
        var dxUp = (tUp + 1) / 2;
        var dyUp = 1;
        var lenUp = Math.sqrt(dxUp * dxUp + dyUp * dyUp);

        board.create('arrow', [
            [xUp, yUp],
            [xUp + arrowLen * dxUp / lenUp, yUp + arrowLen * dyUp / lenUp]
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Lower arrow
        var tLo = -7.5;
        var xLo = Math.pow((tLo + 1) / 2, 2);
        var yLo = tLo;
        var dxLo = -(tLo + 1) / 2;
        var dyLo = -1;
        var lenLo = Math.sqrt(dxLo * dxLo + dyLo * dyLo);

        board.create('arrow', [
            [xLo, yLo],
            [xLo + arrowLen * dxLo / lenLo, yLo + arrowLen * dyLo / lenLo]
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Vertex point at (0, -1)
        board.create('point', [0, -1], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
