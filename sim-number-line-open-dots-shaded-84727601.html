<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x &lt; -3 or x &gt; 7</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 2, 9.5, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var NL_COLOR = '#444444';
        var SOL_COLOR = '#2563EB';
        var TICK_HALF = 0.25;
        var Y = 0;

        // Number line base (arrows on both ends)
        board.create('arrow', [[-7, Y], [9, Y]], {
            strokeColor: NL_COLOR,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        board.create('arrow', [[9, Y], [-7, Y]], {
            strokeColor: NL_COLOR,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Tick marks and labels from -6 to 8
        var i;
        for (i = -6; i <= 8; i++) {
            board.create('segment', [[i, -TICK_HALF], [i, TICK_HALF]], {
                strokeColor: NL_COLOR,
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -TICK_HALF - 0.2, String(i)], {
                anchorX: 'middle',
                anchorY: 'top',
                fontSize: 12,
                color: '#333333',
                fixed: true,
                highlight: false
            });
        }

        // Solution ray: left of -3
        board.create('arrow', [[-3, Y], [-7, Y]], {
            strokeColor: SOL_COLOR,
            strokeWidth: 3,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 7 }
        });

        // Solution ray: right of 7
        board.create('arrow', [[7, Y], [9, Y]], {
            strokeColor: SOL_COLOR,
            strokeWidth: 3,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 7 }
        });

        // Open circles at -3 and 7
        board.create('point', [-3, Y], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: SOL_COLOR,
            strokeWidth: 2,
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        board.create('point', [7, Y], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: SOL_COLOR,
            strokeWidth: 2,
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
