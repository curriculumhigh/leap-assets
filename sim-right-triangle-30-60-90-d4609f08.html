<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-60-90 Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 8, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var A = board.create('point', [0, 0], {
            name: 'A', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -14] }
        });
        var B = board.create('point', [6, 0], {
            name: 'B', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -14] }
        });
        var C = board.create('point', [0, 5.5], {
            name: 'C', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 6] }
        });

        // ── Triangle (no fill) ──────────────────────────────────────────
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at A (red square) ────────────────────────
        var sq = 0.5;
        var sqP1 = board.create('point', [sq, 0], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [sq, sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [0, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── 30° angle arc at B ──────────────────────────────────────────
        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.9,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        // 30° label along the bisector of angle B
        var angBA = Math.atan2(0 - 0, 0 - 6);
        var angBC = Math.atan2(5.5 - 0, 0 - 6);
        var bisector = (angBA + angBC) / 2;
        var labelR = 1.4;
        board.create('text', [
            6 + labelR * Math.cos(bisector),
            0 + labelR * Math.sin(bisector),
            '30^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────

        // Horizontal leg label: "x" centered below AB
        board.create('text', [3, -0.7, 'x'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Vertical leg label: "3√7" centered left of AC
        board.create('text', [-0.9, 2.75, '3\\sqrt{7}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Hypotenuse label: "y" centered along BC, offset to the right
        var midX = (6 + 0) / 2;
        var midY = (0 + 5.5) / 2;
        var nLen = Math.sqrt(5.5 * 5.5 + 6 * 6);
        var nxDir = 5.5 / nLen;
        var nyDir = 6 / nLen;
        var labelOffset = 0.7;
        board.create('text', [
            midX + labelOffset * nxDir,
            midY + labelOffset * nyDir,
            'y'
        ], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
