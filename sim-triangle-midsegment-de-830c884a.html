<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle ABC with Midsegment DE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 8.5, 12.5, -2.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var A = board.create('point', [-2, 6], {
            name: 'A', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-8, 10] }
        });
        var B = board.create('point', [4, 0], {
            name: 'B', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -18] }
        });
        var C = board.create('point', [10, 2], {
            name: 'C', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, -4] }
        });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Midsegment DE (highlighted) ─────────────────────────────────
        var D = board.create('point', [1, 3], {
            name: '', fixed: true, size: 2, color: '#2563EB',
            showInfobox: false, highlight: false
        });
        var E = board.create('point', [7, 1], {
            name: '', fixed: true, size: 2, color: '#2563EB',
            showInfobox: false, highlight: false
        });

        board.create('segment', [D, E], {
            strokeColor: '#2563EB', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Coordinate labels — placed clear of points and lines ────────
        board.create('text', [1, 3, 'D(1,\\, 3)'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'top', offset: [-8, -6]
        });

        board.create('text', [7, 1, 'E(7,\\, 1)'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'top', offset: [8, -8]
        });
    </script>
</body>
</html>
