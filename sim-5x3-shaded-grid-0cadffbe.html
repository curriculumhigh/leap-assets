<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x3 Shaded Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 3.8, 5.8, -0.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var GOLD = '#EAB308';
        var WHITE = '#FFFFFF';
        var BORDER = '#555555';

        var shaded = {
            '1,1': true, '1,3': true, '1,5': true,
            '2,2': true, '2,4': true,
            '3,1': true, '3,5': true
        };

        var r, c, x0, y0, fill, key;
        for (r = 1; r <= 3; r++) {
            for (c = 1; c <= 5; c++) {
                x0 = c - 1;
                y0 = 3 - r;

                key = r + ',' + c;
                fill = shaded[key] ? GOLD : WHITE;

                var p1 = board.create('point', [x0, y0], { visible: false, name: '' });
                var p2 = board.create('point', [x0 + 1, y0], { visible: false, name: '' });
                var p3 = board.create('point', [x0 + 1, y0 + 1], { visible: false, name: '' });
                var p4 = board.create('point', [x0, y0 + 1], { visible: false, name: '' });

                board.create('polygon', [p1, p2, p3, p4], {
                    fillColor: fill,
                    fillOpacity: fill === GOLD ? 0.85 : 1.0,
                    borders: { strokeColor: BORDER, strokeWidth: 1.5 },
                    vertices: { visible: false },
                    hasInnerPoints: false,
                    fixed: true,
                    highlight: false
                });
            }
        }
    </script>
</body>
</html>
