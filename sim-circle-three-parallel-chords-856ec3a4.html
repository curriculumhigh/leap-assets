<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Three Parallel Chords</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var R = 13;
        var yTop = 5;
        var yMid = 0;
        var yBot = -12;

        var halfTop = 12;
        var halfMid = 13;
        var halfBot = 5;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-18, 17, 18, -17],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var N = board.create('point', [0, 0], {
            name: '', visible: false, fixed: true
        });

        var circle = board.create('circle', [N, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        board.create('point', [0, 0], {
            name: 'N', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });

        var topL = board.create('point', [-halfTop, yTop], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var topR = board.create('point', [halfTop, yTop], {
            name: 'A', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 2] }
        });
        board.create('segment', [topL, topR], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('text', [0, yTop + 1.6, '24'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        var midL = board.create('point', [-halfMid, yMid], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var midR = board.create('point', [halfMid, yMid], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        board.create('segment', [midL, midR], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('text', [0, yMid + 1.8, '26'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        var botL = board.create('point', [-halfBot, yBot], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var botR = board.create('point', [halfBot, yBot], {
            name: 'B', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 2] }
        });
        board.create('segment', [botL, botR], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('text', [0, yBot + 1.6, '10'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });
    </script>
</body>
</html>
