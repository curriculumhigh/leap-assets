<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola with Point P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 5, 6, -4],
            axis: true,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            }
        });

        // Manual grid lines at every 1 unit
        var i;
        // Vertical grid lines
        for (i = -3; i <= 5; i++) {
            if (i === 0) continue;
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }
        // Horizontal grid lines
        for (i = -3; i <= 4; i++) {
            if (i === 0) continue;
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // Axis labels
        board.create('text', [5.5, -0.5, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.3, 4.5, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

        // Parabola y = x^2 - 2x - 1
        board.create('functiongraph', [
            function(x) { return x * x - 2 * x - 1; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Point P at (1, 3)
        board.create('point', [1, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Label for P
        board.create('text', [1.4, 3.4, '<b>P</b>(1, 3)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
