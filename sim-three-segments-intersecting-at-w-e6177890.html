<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Segments Intersecting at W</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.2, 3.6, 5.2, -3.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Center point W ─────────────────────────────────── */
        var W = board.create('point', [0, 0], {
            name: 'W', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 11, color: '#222222', offset: [6, -10], useKatex: true }
        });

        /* ── Endpoint coordinates ───────────────────────────── */
        var pP = [-3.8, -0.4];
        var pQ = [3.8, 0.4];

        var pR = [-2.6, 2.4];
        var pS = [2.6, -2.4];

        var pT = [2.0, 2.6];
        var pU = [-2.0, -2.6];

        /* ── Helper: create segment with endpoints and tick ── */
        function makeSegment(coordA, coordB, nameA, nameB, offsetA, offsetB) {
            var ptA = board.create('point', coordA, {
                name: nameA, fixed: true, size: 2, color: '#222222', highlight: false,
                label: { fontSize: 11, color: '#222222', offset: offsetA, useKatex: true }
            });
            var ptB = board.create('point', coordB, {
                name: nameB, fixed: true, size: 2, color: '#222222', highlight: false,
                label: { fontSize: 11, color: '#222222', offset: offsetB, useKatex: true }
            });
            board.create('segment', [ptA, ptB], {
                strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
            });

            var dx = coordB[0] - coordA[0];
            var dy = coordB[1] - coordA[1];
            var len = Math.sqrt(dx * dx + dy * dy);
            var nx = -dy / len;
            var ny = dx / len;
            var tickLen = 0.3;

            board.create('segment', [
                [0 + nx * tickLen, 0 + ny * tickLen],
                [0 - nx * tickLen, 0 - ny * tickLen]
            ], {
                strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
            });
        }

        /* ── Segment PQ (roughly horizontal) ────────────────── */
        makeSegment(pP, pQ, 'P', 'Q', [-12, -6], [8, -6]);

        /* ── Segment RS (steep, upper-left to lower-right) ──── */
        makeSegment(pR, pS, 'R', 'S', [-12, 4], [8, -8]);

        /* ── Segment TU (steep, upper-right to lower-left) ──── */
        makeSegment(pT, pU, 'T', 'U', [6, 4], [-14, -8]);

    </script>
</body>
</html>
