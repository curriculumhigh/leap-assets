<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congruent Quadrilaterals PQRS and VWXY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9.5, 19, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_SIDE = '#2563EB';
        var COL_ANGLE = '#059669';
        var COL_OUTLINE = '#555555';
        var COL_LABEL = '#222222';

        // ── Helpers ─────────────────────────────────────────────────────
        function edgeLabelPos(ax, ay, bx, by, offset) {
            var mx = (ax + bx) / 2;
            var my = (ay + by) / 2;
            var ddx = bx - ax;
            var ddy = by - ay;
            var len = Math.sqrt(ddx * ddx + ddy * ddy);
            var nx = -ddy / len * offset;
            var ny = ddx / len * offset;
            return [mx + nx, my + ny];
        }

        function angleLabelPos(vx, vy, ax, ay, bx, by, dist) {
            var d1x = ax - vx, d1y = ay - vy;
            var d2x = bx - vx, d2y = by - vy;
            var len1 = Math.sqrt(d1x * d1x + d1y * d1y);
            var len2 = Math.sqrt(d2x * d2x + d2y * d2y);
            d1x /= len1; d1y /= len1;
            d2x /= len2; d2y /= len2;
            var bsx = d1x + d2x, bsy = d1y + d2y;
            var blen = Math.sqrt(bsx * bsx + bsy * bsy);
            if (blen < 0.001) { bsx = -d1y; bsy = d1x; blen = 1; }
            return [vx + bsx / blen * dist, vy + bsy / blen * dist];
        }

        // ── Draw an interior angle arc using a parametric curve ─────────
        function drawAngleArc(p1, vertex, p2, radius) {
            var a1 = Math.atan2(p1[1] - vertex[1], p1[0] - vertex[0]);
            var a2 = Math.atan2(p2[1] - vertex[1], p2[0] - vertex[0]);
            var diff = a2 - a1;
            if (diff > Math.PI) diff -= 2 * Math.PI;
            if (diff < -Math.PI) diff += 2 * Math.PI;
            var startA, endA;
            if (Math.abs(diff) <= Math.PI) {
                startA = a1;
                endA = a1 + diff;
            } else {
                startA = a2;
                var diff2 = a1 - a2;
                if (diff2 > Math.PI) diff2 -= 2 * Math.PI;
                if (diff2 < -Math.PI) diff2 += 2 * Math.PI;
                endA = a2 + diff2;
            }
            var sa = startA;
            var ea = endA;
            board.create('curve', [
                function(t) { return vertex[0] + radius * Math.cos(t); },
                function(t) { return vertex[1] + radius * Math.sin(t); },
                Math.min(sa, ea),
                Math.max(sa, ea)
            ], {
                strokeColor: COL_ANGLE, strokeWidth: 1.5,
                fillColor: 'none', fixed: true, highlight: false
            });
        }

        // ═════════════════════════════════════════════════════════════════
        // Quadrilateral PQRS (left)
        // ═════════════════════════════════════════════════════════════════
        var pP = [1, 6];
        var pQ = [4.2, 7.8];
        var pR = [6, 4.5];
        var pS = [2.5, 2.8];

        var P = board.create('point', pP, { name: '', visible: false, fixed: true });
        var Q = board.create('point', pQ, { name: '', visible: false, fixed: true });
        var R = board.create('point', pR, { name: '', visible: false, fixed: true });
        var S = board.create('point', pS, { name: '', visible: false, fixed: true });

        board.create('polygon', [P, Q, R, S], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Vertex labels — PQRS
        board.create('text', [pP[0] - 0.7, pP[1] + 0.2, 'P'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });
        board.create('text', [pQ[0] + 0.05, pQ[1] + 0.6, 'Q'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });
        board.create('text', [pR[0] + 0.65, pR[1] + 0.15, 'R'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });
        board.create('text', [pS[0] - 0.55, pS[1] - 0.5, 'S'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });

        // Side PQ label: "5x − 2" (blue)
        var lPQ = edgeLabelPos(pP[0], pP[1], pQ[0], pQ[1], 0.6);
        board.create('text', [lPQ[0], lPQ[1], '5x - 2'], {
            fontSize: 12, color: COL_SIDE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // Angle arc at S (R-S-P)
        drawAngleArc(pR, pS, pP, 0.55);

        // Angle S label
        var lAngS = angleLabelPos(pS[0], pS[1], pR[0], pR[1], pP[0], pP[1], 1.5);
        board.create('text', [lAngS[0], lAngS[1], '(3y + 10)\u00B0'], {
            fontSize: 11, color: COL_ANGLE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // ═════════════════════════════════════════════════════════════════
        // Quadrilateral VWXY (right) — translated copy
        // ═════════════════════════════════════════════════════════════════
        var dx = 9.5;

        var pV = [pP[0] + dx, pP[1]];
        var pW = [pQ[0] + dx, pQ[1]];
        var pX = [pR[0] + dx, pR[1]];
        var pY = [pS[0] + dx, pS[1]];

        var V = board.create('point', pV, { name: '', visible: false, fixed: true });
        var W = board.create('point', pW, { name: '', visible: false, fixed: true });
        var X = board.create('point', pX, { name: '', visible: false, fixed: true });
        var Y = board.create('point', pY, { name: '', visible: false, fixed: true });

        board.create('polygon', [V, W, X, Y], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Vertex labels — VWXY
        board.create('text', [pV[0] - 0.7, pV[1] + 0.2, 'V'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });
        board.create('text', [pW[0] + 0.05, pW[1] + 0.6, 'W'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });
        board.create('text', [pX[0] + 0.65, pX[1] + 0.15, 'X'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });
        board.create('text', [pY[0] - 0.55, pY[1] - 0.5, 'Y'], {
            fontSize: 14, color: COL_LABEL, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', cssStyle: 'font-weight:600'
        });

        // ── All four side labels on VWXY (blue) ─────────────────────────
        // VW = 18
        var lVW = edgeLabelPos(pV[0], pV[1], pW[0], pW[1], 0.6);
        board.create('text', [lVW[0], lVW[1], '18'], {
            fontSize: 12, color: COL_SIDE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // WX = 14
        var lWX = edgeLabelPos(pW[0], pW[1], pX[0], pX[1], 0.6);
        board.create('text', [lWX[0], lWX[1], '14'], {
            fontSize: 12, color: COL_SIDE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // XY = 11
        var lXY = edgeLabelPos(pX[0], pX[1], pY[0], pY[1], 0.6);
        board.create('text', [lXY[0], lXY[1], '11'], {
            fontSize: 12, color: COL_SIDE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // YV = 15
        var lYV = edgeLabelPos(pY[0], pY[1], pV[0], pV[1], 0.6);
        board.create('text', [lYV[0], lYV[1], '15'], {
            fontSize: 12, color: COL_SIDE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // ── All four angle arcs + labels on VWXY (green) ────────────────
        // Angle V (Y-V-W) = 85°
        drawAngleArc(pY, pV, pW, 0.55);
        var lAngV = angleLabelPos(pV[0], pV[1], pY[0], pY[1], pW[0], pW[1], 1.3);
        board.create('text', [lAngV[0], lAngV[1], '85\u00B0'], {
            fontSize: 11, color: COL_ANGLE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Angle W (V-W-X) = 110°
        drawAngleArc(pV, pW, pX, 0.55);
        var lAngW = angleLabelPos(pW[0], pW[1], pV[0], pV[1], pX[0], pX[1], 1.3);
        board.create('text', [lAngW[0], lAngW[1], '110\u00B0'], {
            fontSize: 11, color: COL_ANGLE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Angle X (W-X-Y) = 92°
        drawAngleArc(pW, pX, pY, 0.55);
        var lAngX = angleLabelPos(pX[0], pX[1], pW[0], pW[1], pY[0], pY[1], 1.3);
        board.create('text', [lAngX[0], lAngX[1], '92\u00B0'], {
            fontSize: 11, color: COL_ANGLE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Angle Y (X-Y-V) = 73°
        drawAngleArc(pX, pY, pV, 0.55);
        var lAngY = angleLabelPos(pY[0], pY[1], pX[0], pX[1], pV[0], pV[1], 1.5);
        board.create('text', [lAngY[0], lAngY[1], '73\u00B0'], {
            fontSize: 11, color: COL_ANGLE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

    </script>
</body>
</html>
