<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binomial Distribution Histogram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.4, 0.52, 6.8, -0.13],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Data ────────────────────────────────────────────────────────
        var xVals = [0, 1, 2, 3, 4, 5];
        var pVals = [0.078, 0.259, 0.346, 0.230, 0.077, 0.010];
        var BAR_COL = '#2563EB';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        // ── Horizontal grid lines ───────────────────────────────────────
        var gridYs = [0.1, 0.2, 0.3, 0.4];
        for (var g = 0; g < gridYs.length; g++) {
            board.create('segment', [[-0.5, gridYs[g]], [6.0, gridYs[g]]], {
                strokeColor: GRID_COL, strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Bars (polygons) ─────────────────────────────────────────────
        for (var i = 0; i < xVals.length; i++) {
            var x = xVals[i];
            var h = pVals[i];
            var x0 = x - 0.5;
            var x1 = x + 0.5;

            // Bar rectangle
            var p1 = board.create('point', [x0, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x1, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x1, h], { visible: false, name: '' });
            var p4 = board.create('point', [x0, h], { visible: false, name: '' });
            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_COL, fillOpacity: 0.75,
                borders: { strokeColor: BAR_COL, strokeWidth: 1.2 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Probability label above bar
            board.create('text', [x, h + 0.015, pVals[i].toFixed(3)], {
                anchorX: 'middle', anchorY: 'bottom',
                fontSize: 12, color: '#222222',
                useKatex: true, fixed: true, highlight: false
            });
        }

        // ── Manual axes ─────────────────────────────────────────────────
        // x-axis: from just left of first bar to right with arrow
        board.create('arrow', [[-0.5, 0], [6.3, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // y-axis: from bottom to top with arrow
        board.create('arrow', [[-0.5, 0], [-0.5, 0.48]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── x-axis tick marks and labels ────────────────────────────────
        for (var t = 0; t < xVals.length; t++) {
            var tx = xVals[t];
            // Tick mark
            board.create('segment', [[tx, -0.008], [tx, 0.008]], {
                strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [tx, -0.025, String(tx)], {
                anchorX: 'middle', anchorY: 'top',
                fontSize: 11, color: '#222222',
                fixed: true, highlight: false
            });
        }

        // ── y-axis tick marks and labels ────────────────────────────────
        for (var yt = 0; yt < gridYs.length; yt++) {
            var yv = gridYs[yt];
            // Tick mark
            board.create('segment', [[-0.54, yv], [-0.46, yv]], {
                strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [-0.6, yv, yv.toFixed(1)], {
                anchorX: 'right', anchorY: 'middle',
                fontSize: 11, color: '#222222',
                fixed: true, highlight: false
            });
        }

        // ── Origin label "0" ────────────────────────────────────────────
        board.create('text', [-0.6, -0.025, '0'], {
            anchorX: 'right', anchorY: 'top',
            fontSize: 11, color: '#222222',
            fixed: true, highlight: false
        });

        // ── Axis labels ─────────────────────────────────────────────────
        // x-axis label: "Number of residents"
        board.create('text', [2.75, -0.075, '\\text{Number of residents}'], {
            anchorX: 'middle', anchorY: 'top',
            fontSize: 13, color: '#222222',
            useKatex: true, fixed: true, highlight: false
        });

        // y-axis label: P(x)
        board.create('text', [-1.15, 0.26, 'P(x)'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222',
            useKatex: true, fixed: true, highlight: false,
            rotate: 90
        });
    </script>
</body>
</html>
