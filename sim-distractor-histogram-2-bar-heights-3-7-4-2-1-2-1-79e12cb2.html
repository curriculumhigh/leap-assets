<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor Histogram 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 9.5, 79, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#ffffff';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        var barStarts = [0, 10, 20, 30, 40, 50, 60];
        var heights   = [3, 7, 4, 2, 1, 2, 1];
        var labels    = ['20\u201329','30\u201339','40\u201349','50\u201359','60\u201369','70\u201379','80\u201389'];

        /* Horizontal grid lines at y = 1 to 8 */
        for (var g = 1; g <= 8; g++) {
            board.create('segment', [[0, g], [70, g]], {
                strokeColor: GRID_COL, strokeWidth: 0.4, fixed: true, highlight: false, layer: 0
            });
        }

        /* Bars */
        for (var i = 0; i < heights.length; i++) {
            var x1 = barStarts[i];
            var x2 = x1 + 10;
            var h = heights[i];

            var p1 = board.create('point', [x1, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x2, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x2, h], { visible: false, name: '' });
            var p4 = board.create('point', [x1, h], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.9,
                borders: { strokeColor: BAR_STROKE, strokeWidth: 0.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false,
                layer: 5
            });
        }

        /* Axes (plain lines, no arrows) */
        board.create('segment', [[0, 0], [70, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false, layer: 7
        });
        board.create('segment', [[0, 0], [0, 8.6]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false, layer: 7
        });

        /* Y-axis ticks & labels at every integer 0-8 */
        for (var y = 0; y <= 8; y++) {
            board.create('segment', [[-0.5, y], [0.5, y]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
            board.create('text', [-2.0, y, String(y)], {
                fontSize: 9, anchorX: 'right', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        /* X-axis tick marks at bar boundaries */
        for (var t = 0; t <= 70; t += 10) {
            board.create('segment', [[t, -0.15], [t, 0.15]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
        }

        /* Interval labels centered under each bar */
        for (var j = 0; j < labels.length; j++) {
            var cx = barStarts[j] + 5;
            board.create('text', [cx, -0.65, labels[j]], {
                fontSize: 7, anchorX: 'middle', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        /* Axis title: Minutes exercising */
        board.create('text', [35, -1.8, '\\textit{Minutes exercising}'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false, useKatex: true
        });

        /* Axis title: Frequency (rotated) */
        board.create('text', [-10.5, 4.25, '\\textit{Frequency}'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false, useKatex: true,
            rotate: 90
        });
    </script>
</body>
</html>
