<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola y = -x² + 4x - 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var BB = [-1, 3.5, 5, -2.5];

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: BB,
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.65, -0.3, 'x'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.15, 3.2, 'y'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });

        // Parabola function
        function f(x) {
            return -x * x + 4 * x - 3;
        }

        // Shaded region above the parabola
        var NUM_PTS = 120;
        var xMin = BB[0];
        var xMax = BB[2];
        var yTop = BB[1];
        var shadePts = [];

        // Top-left corner
        shadePts.push(board.create('point', [xMin, yTop], { visible: false, fixed: true, name: '' }));

        // Top-right corner
        shadePts.push(board.create('point', [xMax, yTop], { visible: false, fixed: true, name: '' }));

        // Down the right edge to the curve
        shadePts.push(board.create('point', [xMax, f(xMax)], { visible: false, fixed: true, name: '' }));

        // Along the curve from right to left
        var dx = (xMax - xMin) / NUM_PTS;
        for (var i = 0; i <= NUM_PTS; i++) {
            var xi = xMax - i * dx;
            shadePts.push(board.create('point', [xi, f(xi)], { visible: false, fixed: true, name: '' }));
        }

        // Close: back up left edge
        shadePts.push(board.create('point', [xMin, f(xMin)], { visible: false, fixed: true, name: '' }));

        board.create('polygon', shadePts, {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Parabola curve (solid, primary)
        board.create('functiongraph', [f, xMin, xMax], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points
        // Vertex (2, 1)
        board.create('point', [2, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false
        });

        // x-intercepts (1, 0) and (3, 0)
        board.create('point', [1, 0], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [3, 0], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false
        });

        // Function label — name only
        board.create('text', [3.6, 1.8, 'f(x)'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
