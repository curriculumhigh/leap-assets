<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Root Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9.5, 7.5, 3.5, -1.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        majorHeight: 0,
                        minorHeight: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        minorTicks: 0,
                        label: {
                            fontSize: 9,
                            color: '#444444',
                            anchorX: 'middle',
                            offset: [0, -10]
                        },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        majorHeight: 0,
                        minorHeight: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        minorTicks: 0,
                        label: {
                            fontSize: 9,
                            color: '#444444',
                            anchorX: 'right',
                            offset: [-6, 0]
                        },
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels near arrow tips
        board.create('text', [3.0, -0.45, '<i>x</i>'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.2, 7.1, '<i>y</i>'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false
        });

        // Function: f(x) = (1/2) * cbrt(x + 4) + 3
        board.create('functiongraph', [
            function(x) {
                var inner = x + 4;
                var cbrt = (inner >= 0) ? Math.pow(inner, 1/3) : -Math.pow(-inner, 1/3);
                return 0.5 * cbrt + 3;
            },
            -9.5, 3.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
