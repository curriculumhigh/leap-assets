<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity of a particle, v(t)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // Static graph of the velocity v(t) = (3/8)(t - 2)(t - 4) for 0 <= t <= 6 (rule not shown).
        // Vertical gridlines every 1 (t), horizontal gridlines every 0.5 (v), so the dip below the t-axis is clearly visible.
        function V(t) { return 0.375 * (t - 2) * (t - 4); }

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 3.45, 6.6, -0.78],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });
        var i, AX = '#444444';

        // Grid
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, -0.7], [i, 3.3]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[0, i * 0.5], [6.35, i * 0.5]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }

        // Axes
        board.create('arrow', [[-0.12, 0], [6.45, 0]], { strokeColor: AX, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false });
        board.create('arrow', [[0, -0.7], [0, 3.4]], { strokeColor: AX, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false });

        // t ticks; labels sit below the dip of the curve (min v = -0.375 at t = 3)
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, -0.05], [i, 0.05]], { strokeColor: AX, strokeWidth: 1.0, fixed: true, highlight: false });
            board.create('text', [i, -0.56, String(i)], { fontSize: 11, color: AX, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        }
        // v ticks every 0.5
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[-0.06, i * 0.5], [0.06, i * 0.5]], { strokeColor: AX, strokeWidth: 1.0, fixed: true, highlight: false });
            board.create('text', [-0.16, i * 0.5, String(i * 0.5)], { fontSize: 11, color: AX, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });
        }
        board.create('text', [-0.16, -0.14, '0'], { fontSize: 11, color: AX, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });

        // Axis names
        board.create('text', [6.42, 0.15, 't'], { useKatex: true, fontSize: 14, color: AX, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.12, 3.38, 'v'], { useKatex: true, fontSize: 14, color: AX, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false });

        // Curve
        board.create('functiongraph', [V, 0, 6], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('text', [5.35, 2.75, 'v(t)'], { useKatex: true, fontSize: 13, color: '#222222', anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });
    </script>
</body>
</html>
