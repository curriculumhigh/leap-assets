<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Parabolas — Discriminant Cases</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 500px; height: 300px; margin: 0; padding: 6px; box-sizing: border-box; }
        .graphs-row { display: flex; gap: 6px; height: 100%; }
        .graph-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .graph-title { text-align: center; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 3px; padding-top: 2px; }
        .board-wrap { flex: 1; background: white; border-radius: 6px; overflow: hidden; }
        .board-wrap > div { width: 100%; height: 100%; }
        .jxgbox { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="graphs-row">
            <div class="graph-col">
                <div class="graph-title">Graph A</div>
                <div class="board-wrap"><div id="boardA"></div></div>
            </div>
            <div class="graph-col">
                <div class="graph-title">Graph B</div>
                <div class="board-wrap"><div id="boardB"></div></div>
            </div>
            <div class="graph-col">
                <div class="graph-title">Graph C</div>
                <div class="board-wrap"><div id="boardC"></div></div>
            </div>
        </div>
    </div>

    <script>
        function makeBoard(id, bb) {
            return JXG.JSXGraph.initBoard(id, {
                boundingbox: bb,
                axis: true,
                showNavigation: false,
                showCopyright: false,
                pan: { enabled: false },
                zoom: { enabled: false },
                defaultAxes: {
                    x: {
                        strokeColor: '#444444', strokeWidth: 1.2,
                        lastArrow: { type: 2, size: 5 },
                        ticks: { strokeColor: '#444444', label: { fontSize: 9 }, minorTicks: 0, ticksDistance: 1 }
                    },
                    y: {
                        strokeColor: '#444444', strokeWidth: 1.2,
                        lastArrow: { type: 2, size: 5 },
                        ticks: { strokeColor: '#444444', label: { fontSize: 9 }, minorTicks: 0, ticksDistance: 2 }
                    }
                },
                grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
            });
        }

        // Graph A: y = x² − 4x + 3, roots at x=1, x=3, vertex (2, -1)
        var bA = makeBoard('boardA', [-1.5, 7, 5.5, -3]);

        bA.create('functiongraph', [function(x) { return x * x - 4 * x + 3; }], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        bA.create('point', [1, 0], { name: '', size: 4, color: '#222222', fixed: true, highlight: false });
        bA.create('point', [3, 0], { name: '', size: 4, color: '#222222', fixed: true, highlight: false });

        bA.create('text', [0.5, 5.4, 'y = x^2 - 4x + 3'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, anchorX: 'left'
        });

        // Graph B: y = x² − 6x + 9, touches at x=3, vertex (3, 0)
        var bB = makeBoard('boardB', [-0.5, 7, 6.5, -3]);

        bB.create('functiongraph', [function(x) { return x * x - 6 * x + 9; }], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        bB.create('point', [3, 0], { name: '', size: 4, color: '#222222', fixed: true, highlight: false });

        bB.create('text', [3.2, 5.5, 'y = x^2 - 6x + 9'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, anchorX: 'middle'
        });

        // Graph C: y = x² − 2x + 5, vertex (1, 4), no real roots
        var bC = makeBoard('boardC', [-2, 12, 4.5, -2]);

        bC.create('functiongraph', [function(x) { return x * x - 2 * x + 5; }], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        bC.create('text', [2, 2.5, 'y = x^2 - 2x + 5'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, anchorX: 'middle'
        });
    </script>
</body>
</html>
