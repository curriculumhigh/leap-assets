<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of f(x) = -1/2(x-6)² + 12</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 14, 11, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [10.5, -0.6, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 13.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola: f(x) = -1/2 (x - 6)^2 + 12
        board.create('functiongraph', [
            function(x) { return -0.5 * Math.pow(x - 6, 2) + 12; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Function label — KaTeX rendered via katex.render into a DOM element
        window.addEventListener('load', function() {
            var labelEl = document.createElement('div');
            labelEl.style.position = 'absolute';
            labelEl.style.pointerEvents = 'none';
            labelEl.style.fontSize = '13px';
            labelEl.style.color = '#222222';

            var boardEl = document.getElementById('board');
            boardEl.style.position = 'relative';
            boardEl.appendChild(labelEl);

            katex.render('f(x) = -\\tfrac{1}{2}(x-6)^2 + 12', labelEl, { throwOnError: false });

            // Convert board coords (2.3, 3.8) to pixel coords
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [2.3, 3.8], board);
            labelEl.style.left = coords.scrCoords[1] + 'px';
            labelEl.style.top = coords.scrCoords[2] + 'px';
        });
    </script>
</body>
</html>
