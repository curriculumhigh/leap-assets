<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle PQR Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 8.5, 4.5, -6.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.0, -0.5, 'x'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.3, 8.0, 'y'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });

        // --- Vertices ---
        var P = board.create('point', [-4, 6], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var Q = board.create('point', [2, 2], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var R = board.create('point', [-2, -4], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // --- Triangle sides ---
        board.create('segment', [P, Q], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [Q, R], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [R, P], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // --- Midpoints M and N ---
        var M = board.create('point', [-1, 4], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var N = board.create('point', [0, -1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // --- Midsegment MN ---
        board.create('segment', [M, N], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // --- Vertex labels with coordinates ---
        board.create('text', [-4.3, 6.7, 'P(-4, 6)'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false, anchorX: 'right'
        });
        board.create('text', [2.3, 2.5, 'Q(2, 2)'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [-2.3, -4.8, 'R(-2, -4)'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false, anchorX: 'right'
        });

        // --- Midpoint labels (name only) ---
        board.create('text', [-0.7, 4.6, 'M'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [0.15, -1.6, 'N'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
