<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-and-Whisker Plot — Distractor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 2.4, 64, -2.0],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Data ────────────────────────────────────────────────────
        var MIN = 3;
        var Q1 = 9.4;
        var Q2 = 20;
        var Q3 = 39.2;
        var MAX = 55;

        var Y = 0.5;
        var BH = 0.4;
        var CAP = 0.35;
        var LABEL_Y = Y + BH + 0.35;

        var COL = '#222222';
        var COL_MEDIAN = '#DC2626';
        var FILL = '#E5E7EB';

        // ── Number line ─────────────────────────────────────────────
        board.create('segment', [[0, -0.4], [60, -0.4]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // Ticks and labels every 5 units, 0 to 60
        var i;
        for (i = 0; i <= 60; i += 5) {
            var tickLen = 0.22;
            board.create('segment', [[i, -0.4 - tickLen], [i, -0.4 + tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -0.4 - tickLen - 0.32, String(i)], {
                anchorX: 'middle', anchorY: 'top',
                fontSize: 9, color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Whiskers ────────────────────────────────────────────────
        board.create('segment', [[MIN, Y], [Q1, Y]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[Q3, Y], [MAX, Y]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Whisker caps
        board.create('segment', [[MIN, Y - CAP], [MIN, Y + CAP]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[MAX, Y - CAP], [MAX, Y + CAP]], {
            strokeColor: COL, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Box ─────────────────────────────────────────────────────
        var boxPts = [
            board.create('point', [Q1, Y - BH], { visible: false, fixed: true, name: '' }),
            board.create('point', [Q3, Y - BH], { visible: false, fixed: true, name: '' }),
            board.create('point', [Q3, Y + BH], { visible: false, fixed: true, name: '' }),
            board.create('point', [Q1, Y + BH], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', boxPts, {
            fillColor: FILL, fillOpacity: 1.0,
            borders: { strokeColor: COL, strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Median line (red) ───────────────────────────────────────
        board.create('segment', [[Q2, Y - BH], [Q2, Y + BH]], {
            strokeColor: COL_MEDIAN, strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Key-point numeric labels (KaTeX) ────────────────────────
        var labels = [
            { x: MIN, val: '3' },
            { x: Q1, val: '9.4' },
            { x: Q2, val: '20' },
            { x: Q3, val: '39.2' },
            { x: MAX, val: '55' }
        ];

        for (i = 0; i < labels.length; i++) {
            board.create('text', [labels[i].x, LABEL_Y, labels[i].val], {
                anchorX: 'middle', anchorY: 'bottom',
                fontSize: 9, color: COL,
                useKatex: true, fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
