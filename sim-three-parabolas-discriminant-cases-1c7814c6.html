<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Parabolas — Discriminant Cases</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var COL_P = '#222222';
        var COL_Q = '#2563EB';
        var COL_R = '#059669';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 8, 8, -7],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── p(x) = -(x-1)² - 2 — opens down, vertex (1,-2), no x-intercepts ──
        board.create('functiongraph', [
            function(x) { return -(x - 1) * (x - 1) - 2; }
        ], { strokeColor: COL_P, strokeWidth: 1.8, fixed: true, highlight: false });

        // Vertex of p
        board.create('point', [1, -2], {
            name: '', size: 5, color: COL_P, fixed: true, highlight: false, showInfobox: false
        });

        // Label for p
        board.create('text', [-3.2, -5.5, 'p(x)'], {
            fontSize: 13, color: COL_P, useKatex: true, fixed: true, highlight: false
        });

        // ── q(x) = (x+2)² - 4 — opens up, vertex (-2,-4), two x-intercepts ──
        board.create('functiongraph', [
            function(x) { return (x + 2) * (x + 2) - 4; }
        ], { strokeColor: COL_Q, strokeWidth: 1.5, fixed: true, highlight: false });

        // Vertex of q
        board.create('point', [-2, -4], {
            name: '', size: 5, color: COL_Q, fixed: true, highlight: false, showInfobox: false
        });

        // x-intercepts of q: (x+2)²=4 → x=-4, x=0
        board.create('point', [-4, 0], {
            name: '', size: 4, color: COL_Q, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [0, 0], {
            name: '', size: 4, color: COL_Q, fixed: true, highlight: false, showInfobox: false
        });

        // Label for q
        board.create('text', [-5.8, 4.5, 'q(x)'], {
            fontSize: 13, color: COL_Q, useKatex: true, fixed: true, highlight: false
        });

        // ── r(x) = (x-3)² — opens up, vertex (3,0), one x-intercept ──
        board.create('functiongraph', [
            function(x) { return (x - 3) * (x - 3); }
        ], { strokeColor: COL_R, strokeWidth: 1.5, fixed: true, highlight: false });

        // Vertex of r (on x-axis)
        board.create('point', [3, 0], {
            name: '', size: 5, color: COL_R, fixed: true, highlight: false, showInfobox: false
        });

        // Label for r
        board.create('text', [5.5, 4.5, 'r(x)'], {
            fontSize: 13, color: COL_R, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
