<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Intersecting Lines</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var O = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2.5, color: '#222222', highlight: false
        });

        var DEG = Math.PI / 180;
        var lineAngles = [0, 35, 90];
        var R = 5.2;

        for (var i = 0; i < 3; i++) {
            var a = lineAngles[i] * DEG;
            var x1 = R * Math.cos(a);
            var y1 = R * Math.sin(a);
            board.create('segment', [[-x1, -y1], [x1, y1]], {
                strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false
            });
        }

        var sectors = [
            { start: 270, end: 360, label: '(12x - 6)^\\circ', labeled: true },
            { start: 215, end: 270, label: '(5y + 10)^\\circ', labeled: true },
            { start: 180, end: 215, label: '', labeled: false },
            { start: 90, end: 180, label: '(9x + 18)^\\circ', labeled: true },
            { start: 35, end: 90, label: '(8y - 17)^\\circ', labeled: true },
            { start: 0, end: 35, label: '', labeled: false }
        ];

        var ARC_R = 1.1;
        var LABEL_R = 1.9;
        var ARC_COL = '#3B82F6';

        for (var s = 0; s < sectors.length; s++) {
            var sec = sectors[s];
            if (!sec.labeled) continue;

            var a1 = sec.start * DEG;
            var a2 = sec.end * DEG;

            var startPt = board.create('point', [ARC_R * Math.cos(a1), ARC_R * Math.sin(a1)], {
                visible: false, fixed: true, name: ''
            });
            var endPt = board.create('point', [ARC_R * Math.cos(a2), ARC_R * Math.sin(a2)], {
                visible: false, fixed: true, name: ''
            });

            board.create('arc', [O, startPt, endPt], {
                strokeColor: ARC_COL, strokeWidth: 1.2, fixed: true, highlight: false,
                firstArrow: false, lastArrow: false
            });

            var midAngle = (sec.start + sec.end) / 2 * DEG;
            var sectorSize = sec.end - sec.start;

            var lr = LABEL_R;
            if (sectorSize < 45) {
                lr = 2.5;
            } else if (sectorSize < 60) {
                lr = 2.1;
            }

            var lx = lr * Math.cos(midAngle);
            var ly = lr * Math.sin(midAngle);

            board.create('text', [lx, ly, sec.label], {
                useKatex: true, fontSize: 13, color: '#222222',
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
