<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle XYZ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 6.5, 7.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertex coordinates
        var Yc = [1, 0.5];
        var Xc = [1, 4.5];
        var Zc = [1 + 2 * Math.sqrt(5), 0.5];

        // Create vertices
        var Y = board.create('point', Yc, {
            name: 'Y', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -14], cssStyle: 'font-weight:bold' }
        });
        var X = board.create('point', Xc, {
            name: 'X', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 8], cssStyle: 'font-weight:bold' }
        });
        var Z = board.create('point', Zc, {
            name: 'Z', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -14], cssStyle: 'font-weight:bold' }
        });

        // Triangle — no fill
        board.create('polygon', [X, Y, Z], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        X.setAttribute({ visible: true });
        Y.setAttribute({ visible: true });
        Z.setAttribute({ visible: true });

        // Right-angle marker at Y
        var markerSize = 0.45;
        var rp1 = board.create('point', [Yc[0], Yc[1] + markerSize], { visible: false, fixed: true, name: '' });
        var rp2 = board.create('point', [Yc[0] + markerSize, Yc[1] + markerSize], { visible: false, fixed: true, name: '' });
        var rp3 = board.create('point', [Yc[0] + markerSize, Yc[1]], { visible: false, fixed: true, name: '' });

        board.create('segment', [rp1, rp2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [rp2, rp3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Side labels (KaTeX)
        var midXY_x = (Xc[0] + Yc[0]) / 2 - 0.9;
        var midXY_y = (Xc[1] + Yc[1]) / 2;
        board.create('text', [midXY_x, midXY_y, '4'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var midYZ_x = (Yc[0] + Zc[0]) / 2;
        var midYZ_y = (Yc[1] + Zc[1]) / 2 - 0.7;
        board.create('text', [midYZ_x, midYZ_y, '2\\sqrt{5}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var midXZ_x = (Xc[0] + Zc[0]) / 2;
        var midXZ_y = (Xc[1] + Zc[1]) / 2;
        var dx = Zc[0] - Xc[0];
        var dy = Zc[1] - Xc[1];
        var len = Math.sqrt(dx * dx + dy * dy);
        var perpX = dy / len;
        var perpY = -dx / len;
        var offsetDist = 0.7;
        board.create('text', [midXZ_x + perpX * offsetDist, midXZ_y + perpY * offsetDist, '6'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
