<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Radius and Area</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 5.5, 5, -5.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3;

        // Center point
        var O = board.create('point', [0, 0], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });

        // Circle with light blue fill
        var circle = board.create('circle', [O, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: '#BFDBFE', fillOpacity: 0.6
        });

        // Radius segment from center to right
        var radiusEnd = board.create('point', [R, 0], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });

        board.create('segment', [O, radiusEnd], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Radius label below the segment
        board.create('text', [R / 2, -0.55, '2x - 1'], {
            anchorX: 'middle', anchorY: 'top',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true
        });

        // Area label above the circle
        board.create('text', [0, 4.8, '\\text{Area of circle} = 49\\pi'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true
        });
    </script>
</body>
</html>
