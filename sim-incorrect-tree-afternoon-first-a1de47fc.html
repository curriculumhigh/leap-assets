<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorrect Tree — Afternoon First</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { height: 100%; padding: 0; }
        .board-wrapper { background: white; border-radius: 8px; border: 1.5px solid #c8e6c9; height: 100%; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 10.5, 18.5, -0.5],
            axis: false, grid: false,
            showNavigation: false, showCopyright: false,
            pan: { enabled: false }, zoom: { enabled: false },
            keepAspectRatio: false
        });

        var COL_BLACK = '#222222';
        var COL_BLUE = '#2563EB';
        var COL_GREEN = '#059669';

        // Layout x-positions
        var X0 = 1.2;   // root
        var X1 = 5.2;   // level 1 (Afternoon activities)
        var X2 = 10.5;  // level 2 (Morning activities)
        var X3 = 15.0;  // level 3 (Evening activities)

        // Y positions
        var headerY = 10.0;

        // Level 1: 3 branches (Paint, Music, Drama)
        var l1Y = [8.0, 5.0, 2.0];
        var l1Names = ['Paint', 'Music', 'Drama'];

        // Level 2: 2 branches per L1 node (Yoga, Swim)
        var l2Names = ['Yoga', 'Swim'];
        var l2Spread = 1.1;

        // Level 3: 2 branches per L2 node (Quiz, Debate)
        var l3Names = ['Quiz', 'Debate'];
        var l3Spread = 0.5;

        // Headers
        board.create('text', [X1, headerY, 'Afternoon'], { fontSize: 9, color: COL_BLACK, anchorX: 'middle', fixed: true, highlight: false, cssStyle: 'font-weight:500' });
        board.create('text', [X2, headerY, 'Morning'], { fontSize: 9, color: COL_BLACK, anchorX: 'middle', fixed: true, highlight: false, cssStyle: 'font-weight:500' });
        board.create('text', [X3, headerY, 'Evening'], { fontSize: 9, color: COL_BLACK, anchorX: 'middle', fixed: true, highlight: false, cssStyle: 'font-weight:500' });

        // Root node
        var rootY = 5.0;
        var root = board.create('point', [X0, rootY], { name: '', size: 3, color: COL_BLACK, fixed: true, highlight: false });

        // Build tree
        var i, j, k;
        for (i = 0; i < 3; i++) {
            var l1x = X1;
            var l1y = l1Y[i];

            // Line root -> L1
            board.create('segment', [[X0, rootY], [l1x, l1y]], { strokeColor: COL_BLACK, strokeWidth: 1.2, fixed: true, highlight: false });
            // L1 node
            board.create('point', [l1x, l1y], { name: '', size: 2.5, color: COL_BLACK, fixed: true, highlight: false });
            // L1 label
            board.create('text', [l1x + 0.3, l1y + 0.45, l1Names[i]], { fontSize: 8, color: COL_BLUE, anchorX: 'left', fixed: true, highlight: false, cssStyle: 'font-style:italic' });

            for (j = 0; j < 2; j++) {
                var l2x = X2;
                var l2y = l1y + (0.5 - j) * l2Spread * 2;

                // Line L1 -> L2
                board.create('segment', [[l1x, l1y], [l2x, l2y]], { strokeColor: COL_BLUE, strokeWidth: 1.0, fixed: true, highlight: false });
                // L2 node
                board.create('point', [l2x, l2y], { name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false });
                // L2 label
                board.create('text', [l2x + 0.3, l2y + 0.4, l2Names[j]], { fontSize: 7, color: COL_BLUE, anchorX: 'left', fixed: true, highlight: false, cssStyle: 'font-style:italic' });

                for (k = 0; k < 2; k++) {
                    var l3x = X3;
                    var l3y = l2y + (0.5 - k) * l3Spread * 2;

                    // Line L2 -> L3
                    board.create('segment', [[l2x, l2y], [l3x, l3y]], { strokeColor: COL_GREEN, strokeWidth: 0.8, fixed: true, highlight: false });
                    // L3 node
                    board.create('point', [l3x, l3y], { name: '', size: 1.5, color: COL_GREEN, fixed: true, highlight: false });
                    // L3 label
                    board.create('text', [l3x + 0.3, l3y, l3Names[k]], { fontSize: 7, color: COL_GREEN, anchorX: 'left', fixed: true, highlight: false, cssStyle: 'font-style:italic' });
                }
            }
        }
    </script>
</body>
</html>
