<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle PQR Midsegment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.5, 8.5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_MN = '#2563EB';

        // ── Vertices ────────────────────────────────────────────────────
        var P = board.create('point', [0.5, 4], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-16, 4] }
        });
        var Q = board.create('point', [6.5, 4], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [8, 4] }
        });
        var R = board.create('point', [3.5, -2.5], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, -16] }
        });

        // ── Triangle edges ──────────────────────────────────────────────
        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // ── Midpoints ───────────────────────────────────────────────────
        var M = board.create('midpoint', [P, Q], {
            name: 'M', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, 10] }
        });
        var N = board.create('midpoint', [Q, R], {
            name: 'N', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [10, -4] }
        });

        // ── Midsegment MN (blue) ───────────────────────────────────────
        board.create('segment', [M, N], {
            strokeColor: COL_MN, strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Label: x on midsegment MN (blue) ───────────────────────────
        var mnMidX = (M.X() + N.X()) / 2;
        var mnMidY = (M.Y() + N.Y()) / 2;
        board.create('text', [mnMidX + 0.35, mnMidY + 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: COL_MN,
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // ── Label: 18 on side PR ────────────────────────────────────────
        var prMidX = (P.X() + R.X()) / 2;
        var prMidY = (P.Y() + R.Y()) / 2;
        board.create('text', [prMidX - 1.1, prMidY - 0.15, '18'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
