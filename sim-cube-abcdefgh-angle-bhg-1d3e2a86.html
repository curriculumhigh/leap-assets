<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cube ABCD-EFGH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 9.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var E = 4;
        var DX = 1.8;
        var DY = 1.4;

        var hX = 1,       hY = 0.5;
        var gX = hX + E,  gY = hY;
        var eX = hX + DX, eY = hY + DY;
        var fX = gX + DX, fY = gY + DY;

        var dX = hX,      dY = hY + E;
        var cX = gX,      cY = gY + E;
        var aX = eX,      aY = eY + E;
        var bX = fX,      bY = fY + E;

        var ptA = board.create('point', [aX, aY], { name: '', visible: false, fixed: true });
        var ptB = board.create('point', [bX, bY], { name: '', visible: false, fixed: true });
        var ptC = board.create('point', [cX, cY], { name: '', visible: false, fixed: true });
        var ptD = board.create('point', [dX, dY], { name: '', visible: false, fixed: true });
        var ptE = board.create('point', [eX, eY], { name: '', visible: false, fixed: true });
        var ptF = board.create('point', [fX, fY], { name: '', visible: false, fixed: true });
        var ptG = board.create('point', [gX, gY], { name: '', visible: false, fixed: true });
        var ptH = board.create('point', [hX, hY], { name: '', visible: false, fixed: true });

        board.create('polygon', [ptA, ptB, ptC, ptD], {
            fillColor: '#2563EB', fillOpacity: 0.10,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('polygon', [ptA, ptD, ptH, ptE], {
            fillColor: '#2563EB', fillOpacity: 0.10,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var hiddenStyle = { strokeColor: '#AAAAAA', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false };

        board.create('segment', [ptE, ptF], hiddenStyle);
        board.create('segment', [ptE, ptA], hiddenStyle);
        board.create('segment', [ptF, ptB], hiddenStyle);

        var visStyle = { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false };

        board.create('segment', [ptH, ptG], visStyle);
        board.create('segment', [ptG, ptF], visStyle);
        board.create('segment', [ptH, ptE], visStyle);

        board.create('segment', [ptA, ptD], visStyle);
        board.create('segment', [ptD, ptC], visStyle);
        board.create('segment', [ptC, ptB], visStyle);
        board.create('segment', [ptA, ptB], visStyle);

        board.create('segment', [ptH, ptD], visStyle);
        board.create('segment', [ptG, ptC], visStyle);
        board.create('segment', [ptF, ptB], visStyle);

        var hlStyle = { strokeColor: '#0EA5E9', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false };

        board.create('segment', [ptH, ptF], hlStyle);
        board.create('segment', [ptH, ptB], hlStyle);

        board.create('nonReflexAngle', [ptB, ptH, ptG], {
            radius: 0.7,
            fillColor: '#DC2626', fillOpacity: 0.12,
            strokeColor: '#DC2626', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false,
            highlight: false
        });

        var dotStyle = { name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false };

        board.create('point', [aX, aY], dotStyle);
        board.create('point', [bX, bY], dotStyle);
        board.create('point', [cX, cY], dotStyle);
        board.create('point', [dX, dY], dotStyle);
        board.create('point', [eX, eY], dotStyle);
        board.create('point', [fX, fY], dotStyle);
        board.create('point', [gX, gY], dotStyle);
        board.create('point', [hX, hY], dotStyle);

        var lblStyle = { useKatex: true, fontSize: 14, color: '#222222', fixed: true, highlight: false };

        board.create('text', [aX - 0.9, aY + 0.3, 'A'], lblStyle);
        board.create('text', [bX + 0.3, bY + 0.3, 'B'], lblStyle);
        board.create('text', [cX + 0.3, cY + 0.6, 'C'], lblStyle);
        board.create('text', [dX - 0.7, dY + 0.3, 'D'], lblStyle);

        board.create('text', [eX - 0.5, eY + 0.4, 'E'], lblStyle);
        board.create('text', [fX + 0.3, fY + 0.4, 'F'], lblStyle);
        board.create('text', [gX + 0.3, gY - 0.5, 'G'], lblStyle);
        board.create('text', [hX - 0.7, hY - 0.5, 'H'], lblStyle);

        board.create('text', [hX - 1.4, hY + E / 2, '7\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [hX + E / 2, hY - 0.6, '7\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222', anchorX: 'middle', fixed: true, highlight: false
        });

        board.create('text', [gX + 0.6, gY + E / 2, '7\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
