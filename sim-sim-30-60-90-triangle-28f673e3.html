<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-60-90 Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5, 5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices: 90° at bottom-left, 60° at top, 30° at bottom-right
        var scale = 2.2;
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [0, 1 * scale], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [Math.sqrt(3) * scale, 0], { visible: false, fixed: true, name: '' });

        // Triangle polygon — no fill
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Right angle marker at A (90°)
        var raSize = 0.28;
        board.create('polygon', [
            [0, raSize], [raSize, raSize], [raSize, 0], [0, 0]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.5 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Angle arc at B (60°)
        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.4,
            fillColor: '#444444', fillOpacity: 0.06,
            strokeColor: '#444444', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // Angle arc at C (30°)
        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.5,
            fillColor: '#444444', fillOpacity: 0.06,
            strokeColor: '#444444', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // Angle label: 60° at B
        var ang60x = 0.22;
        var ang60y = 1 * scale - 0.75;
        board.create('text', [ang60x, ang60y, '60\\degree'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });

        // Angle label: 30° at C
        var ang30x = Math.sqrt(3) * scale - 1.1;
        var ang30y = 0.35;
        board.create('text', [ang30x, ang30y, '30\\degree'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // Side label: "1" on the shorter leg (vertical, left side)
        board.create('text', [-0.5, 1 * scale / 2, '1'], {
            useKatex: true, fontSize: 14, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
