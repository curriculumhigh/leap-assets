<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF with Altitude EG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var Dx = 0, Dy = 0;
        var Fx = 9, Fy = 0;
        var Ex = 4, Ey = 2 * Math.sqrt(5);
        var Gx = 4, Gy = 0;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 6.4, 11.2, -2.4],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Triangle DEF (no fill) ──────────────────────────────────── */
        var pD = board.create('point', [Dx, Dy], { visible: false, fixed: true, name: '' });
        var pE = board.create('point', [Ex, Ey], { visible: false, fixed: true, name: '' });
        var pF = board.create('point', [Fx, Fy], { visible: false, fixed: true, name: '' });

        board.create('polygon', [pD, pE, pF], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        /* ── Altitude EG ─────────────────────────────────────────────── */
        var pG = board.create('point', [Gx, Gy], { visible: false, fixed: true, name: '' });

        board.create('segment', [pE, pG], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        /* ── Vertex dots (small, fixed) ──────────────────────────────── */
        board.create('point', [Dx, Dy], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [Ex, Ey], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [Fx, Fy], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [Gx, Gy], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });

        /* ── Right angle markers ─────────────────────────────────────── */
        var RA_SIZE = 0.45;

        function drawRightAngle(vertex, p1, p2, size) {
            var v1x = p1[0] - vertex[0], v1y = p1[1] - vertex[1];
            var len1 = Math.sqrt(v1x * v1x + v1y * v1y);
            v1x /= len1; v1y /= len1;

            var v2x = p2[0] - vertex[0], v2y = p2[1] - vertex[1];
            var len2 = Math.sqrt(v2x * v2x + v2y * v2y);
            v2x /= len2; v2y /= len2;

            var a = [vertex[0] + size * v1x, vertex[1] + size * v1y];
            var b = [vertex[0] + size * (v1x + v2x), vertex[1] + size * (v1y + v2y)];
            var c = [vertex[0] + size * v2x, vertex[1] + size * v2y];

            var pA = board.create('point', a, { visible: false, fixed: true, name: '' });
            var pB = board.create('point', b, { visible: false, fixed: true, name: '' });
            var pC = board.create('point', c, { visible: false, fixed: true, name: '' });

            board.create('segment', [pA, pB], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
            board.create('segment', [pB, pC], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        }

        drawRightAngle([Ex, Ey], [Dx, Dy], [Fx, Fy], RA_SIZE);
        drawRightAngle([Gx, Gy], [Ex, Ey], [Dx, Dy], RA_SIZE);

        /* ── Vertex labels (KaTeX, bold) ─────────────────────────────── */
        board.create('text', [Dx - 0.6, Dy - 0.5, '\\mathbf{D}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [Ex - 0.15, Ey + 0.55, '\\mathbf{E}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle'
        });
        board.create('text', [Fx + 0.4, Fy - 0.5, '\\mathbf{F}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [Gx + 0.15, Gy - 0.55, '\\mathbf{G}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle'
        });

        /* ── Side labels ─────────────────────────────────────────────── */

        // DE = 6 — along the left leg, offset to the left
        var midDEx = (Dx + Ex) / 2 - 0.7;
        var midDEy = (Dy + Ey) / 2 + 0.15;
        board.create('text', [midDEx, midDEy, '6'], {
            useKatex: true, fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // DF = 9 — shifted right, centered between G and F below the hypotenuse
        var label9x = (Gx + Fx) / 2 + 0.5;
        var label9y = -0.7;
        board.create('text', [label9x, label9y, '9'], {
            useKatex: true, fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // DG = x — along hypotenuse segment D to G, above the line
        var midDGx = (Dx + Gx) / 2;
        var midDGy = (Dy + Gy) / 2 + 0.45;
        board.create('text', [midDGx, midDGy, 'x'], {
            useKatex: true, fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
