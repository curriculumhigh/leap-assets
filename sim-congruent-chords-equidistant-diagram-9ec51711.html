<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Congruent Chords — Equidistant from Center</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 7.5, 7.5, -7.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 4.5;
        var COL_SHAPE = '#555555';
        var COL_POINT = '#222222';
        var COL_MEASURE = '#3B82F6';
        var COL_MARK = '#DC2626';

        var topY = 2.0;
        var botY = -2.0;

        var topHalf = Math.sqrt(R * R - topY * topY);
        var botHalf = Math.sqrt(R * R - botY * botY);

        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2, color: COL_POINT,
            highlight: false, showInfobox: false,
            label: { fontSize: 15, color: COL_POINT, offset: [10, 2] }
        });

        board.create('circle', [P, R], {
            strokeColor: COL_SHAPE, strokeWidth: 2.0, fixed: true, highlight: false
        });

        var J = board.create('point', [-topHalf, topY], {
            name: 'J', fixed: true, size: 2, color: COL_POINT,
            highlight: false, showInfobox: false,
            label: { fontSize: 15, color: COL_POINT, offset: [-18, 4] }
        });
        var K = board.create('point', [topHalf, topY], {
            name: 'K', fixed: true, size: 2, color: COL_POINT,
            highlight: false, showInfobox: false,
            label: { fontSize: 15, color: COL_POINT, offset: [10, 4] }
        });
        board.create('segment', [J, K], {
            strokeColor: COL_SHAPE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        var M = board.create('point', [-botHalf, botY], {
            name: 'M', fixed: true, size: 2, color: COL_POINT,
            highlight: false, showInfobox: false,
            label: { fontSize: 15, color: COL_POINT, offset: [-20, -12] }
        });
        var N = board.create('point', [botHalf, botY], {
            name: 'N', fixed: true, size: 2, color: COL_POINT,
            highlight: false, showInfobox: false,
            label: { fontSize: 15, color: COL_POINT, offset: [10, -12] }
        });
        board.create('segment', [M, N], {
            strokeColor: COL_SHAPE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        var A = board.create('point', [0, topY], {
            name: '', fixed: true, visible: false, showInfobox: false
        });
        var B = board.create('point', [0, botY], {
            name: '', fixed: true, visible: false, showInfobox: false
        });

        board.create('segment', [P, A], {
            strokeColor: COL_SHAPE, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, B], {
            strokeColor: COL_SHAPE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        var sq = 0.32;

        board.create('polygon', [
            [-sq, topY], [-sq, topY - sq], [0, topY - sq], [0, topY]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_MARK, strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        board.create('polygon', [
            [-sq, botY], [-sq, botY + sq], [0, botY + sq], [0, botY]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_MARK, strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        var tickLen = 0.28;
        var tickX = 2.2;

        board.create('segment', [[tickX, topY - tickLen], [tickX, topY + tickLen]], {
            strokeColor: COL_MARK, strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [[tickX, botY - tickLen], [tickX, botY + tickLen]], {
            strokeColor: COL_MARK, strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('text', [-1.8, topY + 0.6, '18'], {
            fontSize: 15, color: COL_MEASURE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'bottom',
            cssStyle: 'font-weight:600'
        });

        board.create('text', [-0.7, topY / 2, '5x - 2'], {
            fontSize: 14, color: COL_MEASURE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'right', anchorY: 'middle'
        });

        board.create('text', [-0.7, botY / 2, '3x + 4'], {
            fontSize: 14, color: COL_MEASURE, fixed: true, highlight: false,
            useKatex: true, anchorX: 'right', anchorY: 'middle'
        });

    </script>
</body>
</html>
