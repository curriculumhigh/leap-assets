<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle CDE on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 14, 9, -1],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 13.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var C = board.create('point', [1, 1], {
            name: '', size: 3, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var D = board.create('point', [7, 4], {
            name: '', size: 3, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var E = board.create('point', [3, 12], {
            name: '', size: 3, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });

        // Triangle edges (no fill)
        board.create('polygon', [C, D, E], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels — name + coordinates, KaTeX
        board.create('text', [1.3, 0.2, 'C(1,1)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [7.3, 3.5, 'D(7,4)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [1.2, 12.3, 'E(3,12)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
