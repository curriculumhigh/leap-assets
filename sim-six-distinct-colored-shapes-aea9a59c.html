<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Six Distinct Colored Shapes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.3, 2.6, 12.3, -1.0],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: true
        });

        var COL = ['#222222', '#2563EB', '#059669', '#D97706', '#7C3AED', '#DC2626'];
        var FILL_OP = 0.35;
        var SW = 2;
        var CX = [1, 3, 5, 7, 9, 11];
        var CY = 0.9;
        var S = 0.75;

        function makePoly(verts, idx) {
            var pts = [];
            for (var i = 0; i < verts.length; i++) {
                pts.push(board.create('point', verts[i], { visible: false, fixed: true, name: '' }));
            }
            board.create('polygon', pts, {
                fillColor: COL[idx], fillOpacity: FILL_OP,
                borders: { strokeColor: COL[idx], strokeWidth: SW },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });
        }

        var circleCenter = board.create('point', [CX[0], CY], { visible: false, fixed: true, name: '' });
        board.create('circle', [circleCenter, S], {
            strokeColor: COL[0], strokeWidth: SW,
            fillColor: COL[0], fillOpacity: FILL_OP,
            fixed: true, highlight: false
        });

        var sq = S;
        makePoly([
            [CX[1] - sq, CY - sq],
            [CX[1] + sq, CY - sq],
            [CX[1] + sq, CY + sq],
            [CX[1] - sq, CY + sq]
        ], 1);

        var rw = S;
        var rh = S * 0.6;
        makePoly([
            [CX[2] - rw, CY - rh],
            [CX[2] + rw, CY - rh],
            [CX[2] + rw, CY + rh],
            [CX[2] - rw, CY + rh]
        ], 2);

        var tH = S * Math.sqrt(3);
        var tCentroidOffset = tH / 3;
        makePoly([
            [CX[3], CY + tH - tCentroidOffset],
            [CX[3] - S, CY - tCentroidOffset],
            [CX[3] + S, CY - tCentroidOffset]
        ], 3);

        var pentVerts = [];
        for (var i = 0; i < 5; i++) {
            var ang = Math.PI / 2 + i * 2 * Math.PI / 5;
            pentVerts.push([CX[4] + S * Math.cos(ang), CY + S * Math.sin(ang)]);
        }
        makePoly(pentVerts, 4);

        var hexVerts = [];
        for (var j = 0; j < 6; j++) {
            var ang2 = Math.PI / 6 + j * 2 * Math.PI / 6;
            hexVerts.push([CX[5] + S * Math.cos(ang2), CY + S * Math.sin(ang2)]);
        }
        makePoly(hexVerts, 5);
    </script>
</body>
</html>
