<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base-3 Logarithmic Scale</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 1.4, 6.6, -1.0],
            axis: false, grid: false, showNavigation: false, showCopyright: false,
            pan: { enabled: false }, zoom: { enabled: false }, keepAspectRatio: false
        });

        board.create('arrow', [[-0.3, 0], [6.4, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        for (var i = 0; i <= 6; i++) {
            board.create('segment', [[i, -0.1], [i, 0.1]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -0.35, String(i)], {
                anchorX: 'middle', anchorY: 'middle', fontSize: 12, color: '#444444',
                fixed: true, highlight: false
            });
        }

        board.create('point', [3, 0], {
            name: 'P', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [0, 18], anchorX: 'middle', cssStyle: 'font-weight:bold' }
        });

        board.create('point', [5, 0], {
            name: 'Q', size: 5, color: '#2563EB', fixed: true, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#2563EB', offset: [0, 18], anchorX: 'middle', cssStyle: 'font-weight:bold' }
        });
    </script>
</body>
</html>
