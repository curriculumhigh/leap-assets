<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kite PQRS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-48, 38, 48, -58],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var P = board.create('point', [0, 27], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-5, 14], cssStyle: 'font-weight:bold' }
        });
        var Q = board.create('point', [36, 0], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [12, -4], cssStyle: 'font-weight:bold' }
        });
        var S = board.create('point', [0, -48], {
            name: 'S', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-5, -18], cssStyle: 'font-weight:bold' }
        });
        var R = board.create('point', [-36, 0], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-20, -4], cssStyle: 'font-weight:bold' }
        });
        var T = board.create('point', [0, 0], {
            name: 'T', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [8, -14], cssStyle: 'font-weight:bold' }
        });

        // ── Kite outline (no fill) ──────────────────────────────────────
        board.create('polygon', [P, Q, S, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Dashed diagonals ────────────────────────────────────────────
        board.create('segment', [P, S], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [Q, R], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Right-angle marker at T (first quadrant corner) ─────────────
        var sqSize = 3.5;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Measurement labels (blue, KaTeX) ────────────────────────────
        // "45 cm" along PQ — midpoint offset outward (upper-right)
        var midPQ_x = (0 + 36) / 2;
        var midPQ_y = (27 + 0) / 2;
        board.create('text', [midPQ_x + 5, midPQ_y + 4, '45 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // "60 cm" along SQ — midpoint offset outward (lower-right)
        var midSQ_x = (0 + 36) / 2;
        var midSQ_y = (-48 + 0) / 2;
        board.create('text', [midSQ_x + 5, midSQ_y - 4, '60 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // "75 cm" along PS — midpoint offset to the left
        var midPS_x = 0;
        var midPS_y = (27 + (-48)) / 2;
        board.create('text', [midPS_x - 7, midPS_y, '75 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
