<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangles DEF and PQR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 10, 14, -1.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#9CA3AF',
                strokeWidth: 0.6,
                gridX: 1,
                gridY: 1
            }
        });

        // Axis labels
        board.create('text', [13.5, -0.5, '\\textit{x}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.3, 9.6, '\\textit{y}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_BLUE = '#2563EB';
        var COL_RED = '#DC2626';

        // ── Triangle PQR (red) — drawn first so blue sits on top ────────
        var P = board.create('point', [0, 8], {
            name: '', size: 2, color: COL_RED, fixed: true, highlight: false, showInfobox: false
        });
        var Q = board.create('point', [12, 8], {
            name: '', size: 2, color: COL_RED, fixed: true, highlight: false, showInfobox: false
        });
        var R = board.create('point', [0, 2], {
            name: '', size: 2, color: COL_RED, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [P, Q, R], {
            fillColor: COL_RED, fillOpacity: 0.12,
            borders: { strokeColor: COL_RED, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // PQR labels
        board.create('text', [-0.9, 8.5, 'P'], { fontSize: 13, color: COL_RED, fixed: true, highlight: false, useKatex: true });
        board.create('text', [12.4, 8.5, 'Q'], { fontSize: 13, color: COL_RED, fixed: true, highlight: false, useKatex: true });
        board.create('text', [-0.9, 1.6, 'R'], { fontSize: 13, color: COL_RED, fixed: true, highlight: false, useKatex: true });

        // Right-angle marker at P(0,8)
        var raSize = 0.6;
        board.create('segment', [[0 + raSize, 8], [0 + raSize, 8 - raSize]], {
            strokeColor: COL_RED, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[0 + raSize, 8 - raSize], [0, 8 - raSize]], {
            strokeColor: COL_RED, strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Triangle DEF (blue) ─────────────────────────────────────────
        var D = board.create('point', [1, 3], {
            name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false, showInfobox: false
        });
        var E = board.create('point', [5, 3], {
            name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false, showInfobox: false
        });
        var F = board.create('point', [1, 1], {
            name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [D, E, F], {
            fillColor: COL_BLUE, fillOpacity: 0.12,
            borders: { strokeColor: COL_BLUE, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // DEF labels
        board.create('text', [0.5, 3.4, 'D'], { fontSize: 13, color: COL_BLUE, fixed: true, highlight: false, useKatex: true });
        board.create('text', [5.3, 3.4, 'E'], { fontSize: 13, color: COL_BLUE, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 0.4, 'F'], { fontSize: 13, color: COL_BLUE, fixed: true, highlight: false, useKatex: true });

        // Right-angle marker at D(1,3)
        var raS = 0.4;
        board.create('segment', [[1 + raS, 3], [1 + raS, 3 - raS]], {
            strokeColor: COL_BLUE, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[1 + raS, 3 - raS], [1, 3 - raS]], {
            strokeColor: COL_BLUE, strokeWidth: 1.2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
