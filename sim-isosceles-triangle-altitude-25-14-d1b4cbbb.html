<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle with Altitude</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-12, 29, 12, -5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [0, 24], {
            name: '', fixed: true, visible: false
        });
        var B = board.create('point', [-7, 0], {
            name: '', fixed: true, visible: false
        });
        var C = board.create('point', [7, 0], {
            name: '', fixed: true, visible: false
        });
        var M = board.create('point', [0, 0], {
            name: '', fixed: true, visible: false
        });

        board.create('polygon', [A, B, C], {
            fillColor: '#93C5FD',
            fillOpacity: 0.2,
            borders: {
                strokeColor: '#555555',
                strokeWidth: 2
            },
            vertices: { visible: false },
            fixed: true,
            hasInnerPoints: false,
            highlight: false
        });

        board.create('segment', [A, M], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            dash: 2,
            fixed: true,
            highlight: false
        });

        var boxSize = 1.2;
        var raPts = [
            board.create('point', [boxSize, 0], { visible: false, fixed: true, name: '' }),
            board.create('point', [boxSize, boxSize], { visible: false, fixed: true, name: '' }),
            board.create('point', [0, boxSize], { visible: false, fixed: true, name: '' })
        ];
        board.create('segment', [raPts[0], raPts[1]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [raPts[1], raPts[2]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        var tickLen = 0.8;
        board.create('segment', [[-3.5, -tickLen], [-3.5, tickLen]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[3.5, -tickLen], [3.5, tickLen]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('text', [-5.8, 12.5, '25 \\text{ cm}'], {
            useKatex: true, fontSize: 13, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [5.8, 12.5, '25 \\text{ cm}'], {
            useKatex: true, fontSize: 13, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [-3.5, -2.0, '7 \\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [3.5, -2.0, '7 \\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [1.3, 12, 'h'], {
            useKatex: true, fontSize: 14, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
