<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x ≥ 6</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 2, 10, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var COL = '#2563EB';
        var TICK_MIN = -2;
        var TICK_MAX = 9;

        // Base number line — thin black, both arrows
        board.create('line', [[0, 0], [1, 0]], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Solution ray: bold blue from x=6 to right with arrow
        board.create('arrow', [[6, 0], [9.7, 0]], {
            strokeColor: COL,
            strokeWidth: 3.5,
            lastArrow: { type: 2, size: 7 },
            fixed: true,
            highlight: false
        });

        // Tick marks — black, short height
        var i;
        for (i = TICK_MIN; i <= TICK_MAX; i++) {
            board.create('segment', [[i, -0.12], [i, 0.12]], {
                strokeColor: '#222222',
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -0.45, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Closed circle at x = 6 (inclusive endpoint)
        board.create('point', [6, 0], {
            name: '',
            size: 5,
            fillColor: COL,
            strokeColor: COL,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
