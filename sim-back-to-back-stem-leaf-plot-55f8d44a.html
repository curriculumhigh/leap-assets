<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-to-Back Stem-and-Leaf Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 8, 14, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL = '#222222';
        var COL_LINE = '#444444';
        var FS = 15;
        var MONO = 'font-family: "Courier New", Courier, monospace; font-weight: 600;';

        var PIPE_L_X = -1.3;
        var PIPE_R_X = 1.3;
        var STEM_X = 0;
        var DIGIT_W = 1.05;
        var ROW_H = 1.15;
        var HEADER_Y = 6.0;
        var FIRST_Y = 4.5;

        var stems = [23, 24, 25, 26];
        var leftLeaves = [
            [],
            [1, 2, 3, 4, 4, 5, 6, 7],
            [],
            []
        ];
        var rightLeaves = [
            [8],
            [2, 6],
            [0, 0, 4, 8],
            [2]
        ];

        function txt(x, y, str, opts) {
            opts = opts || {};
            board.create('text', [x, y, str], {
                anchorX: opts.anchorX || 'middle',
                anchorY: 'middle',
                fontSize: FS,
                color: COL,
                fixed: true,
                highlight: false,
                useKatex: opts.useKatex || false,
                cssStyle: opts.css || MONO
            });
        }

        var lineTopY = HEADER_Y + 0.7;
        var lineBotY = FIRST_Y - (stems.length - 1) * ROW_H - 0.7;

        board.create('segment', [[PIPE_L_X, lineTopY], [PIPE_L_X, lineBotY]], {
            strokeColor: COL_LINE, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[PIPE_R_X, lineTopY], [PIPE_R_X, lineBotY]], {
            strokeColor: COL_LINE, strokeWidth: 1.2, fixed: true, highlight: false
        });

        txt(-6.5, HEADER_Y, 'Machine P');
        txt(STEM_X, HEADER_Y, 'Stem');
        txt(6.5, HEADER_Y, 'Machine Q');

        board.create('segment', [[PIPE_L_X - 10, HEADER_Y - 0.6], [PIPE_R_X + 10, HEADER_Y - 0.6]], {
            strokeColor: COL_LINE, strokeWidth: 0.6, fixed: true, highlight: false
        });

        for (var r = 0; r < stems.length; r++) {
            var y = FIRST_Y - r * ROW_H;

            txt(STEM_X, y, String(stems[r]));

            var ll = leftLeaves[r];
            for (var i = 0; i < ll.length; i++) {
                var lx = PIPE_L_X - 1.0 - i * DIGIT_W;
                txt(lx, y, String(ll[i]));
            }

            var rl = rightLeaves[r];
            for (var j = 0; j < rl.length; j++) {
                var rx = PIPE_R_X + 1.0 + j * DIGIT_W;
                txt(rx, y, String(rl[j]));
            }
        }

        var keyY = lineBotY - 1.2;

        board.create('text', [0, keyY,
            '\\textbf{Key:}\\; 1 \\,|\\, 24 = 241 \\text{ mL (Machine P), and } 24 \\,|\\, 2 = 242 \\text{ mL (Machine Q)}'
        ], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 14,
            color: COL, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
