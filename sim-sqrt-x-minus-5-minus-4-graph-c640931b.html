<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of sqrt(x-5) - 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 3.5, 15.5, -6.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // ── Manual x-axis ──────────────────────────────────────────────
        var xAxis = board.create('arrow', [[-1.5, 0], [15.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // x-axis tick labels (every 1 unit, skip 0)
        var xMin = -1, xMax = 15;
        for (var xi = xMin; xi <= xMax; xi++) {
            if (xi === 0) continue;
            board.create('text', [xi, -0.55, String(xi)], {
                fontSize: 9,
                color: '#444444',
                anchorX: 'middle',
                anchorY: 'top',
                fixed: true,
                highlight: false
            });
        }

        // ── Manual y-axis ──────────────────────────────────────────────
        var yAxis = board.create('arrow', [[0, -6.5], [0, 3.5]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // y-axis tick labels (every 2 units, skip 0)
        var yMin = -6, yMax = 3;
        for (var yi = yMin; yi <= yMax; yi += 2) {
            if (yi === 0) continue;
            board.create('text', [-0.4, yi, String(yi)], {
                fontSize: 10,
                color: '#444444',
                anchorX: 'right',
                anchorY: 'middle',
                fixed: true,
                highlight: false
            });
        }

        // ── Manual grid ────────────────────────────────────────────────
        // Vertical grid lines every 1 unit
        for (var gx = xMin; gx <= xMax; gx++) {
            if (gx === 0) continue;
            board.create('segment', [[gx, -6.5], [gx, 3.5]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }
        // Horizontal grid lines every 1 unit
        for (var gy = yMin; gy <= yMax; gy++) {
            if (gy === 0) continue;
            board.create('segment', [[-1.5, gy], [15.5, gy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // Axis labels near arrow tips
        board.create('text', [14.9, -0.55, '<i>x</i>'], {
            fontSize: 13, fixed: true, highlight: false, color: '#444444'
        });
        board.create('text', [0.3, 3.1, '<i>y</i>'], {
            fontSize: 13, fixed: true, highlight: false, color: '#444444'
        });

        // ── Function: f(x) = sqrt(x - 5) - 4 ──────────────────────────
        board.create('functiongraph', [
            function(x) {
                if (x < 5) return NaN;
                return Math.sqrt(x - 5) - 4;
            },
            5, 16
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Starting point at (5, -4)
        board.create('point', [5, -4], {
            name: '',
            size: 4,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
