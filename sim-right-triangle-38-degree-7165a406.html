<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — 38° Angle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9.5, 10, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Triangle vertices ───────────────────────────────────────────
        var A = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var B = board.create('point', [0, 7], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var C = board.create('point', [8, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle edges ──────────────────────────────────────────────
        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Right-angle mark at A (red square) ─────────────────────────
        var sq = 0.6;
        var raPts = [
            board.create('point', [sq, 0], { visible: false, fixed: true, name: '' }),
            board.create('point', [sq, sq], { visible: false, fixed: true, name: '' }),
            board.create('point', [0, sq], { visible: false, fixed: true, name: '' })
        ];
        board.create('segment', [raPts[0], raPts[1]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raPts[1], raPts[2]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Angle arc at B ──────────────────────────────────────────────
        board.create('nonReflexAngle', [A, B, C], {
            radius: 1.0,
            fillColor: '#222222',
            fillOpacity: 0.06,
            strokeColor: '#555555',
            strokeWidth: 1.2,
            fixed: true,
            name: '',
            withLabel: false
        });

        // ── Angle label: 38° ───────────────────────────────────────────
        board.create('text', [0.65, 5.75, '38^\\circ'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        // n — left vertical leg (A to B)
        board.create('text', [-0.8, 3.5, 'n'], {
            useKatex: true,
            fontSize: 15,
            color: '#222222',
            fixed: true,
            highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // m — bottom horizontal leg (A to C)
        board.create('text', [4, -0.8, 'm'], {
            useKatex: true,
            fontSize: 15,
            color: '#222222',
            fixed: true,
            highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // 30 — hypotenuse (B to C)
        board.create('text', [4.8, 4.2, '30'], {
            useKatex: true,
            fontSize: 15,
            color: '#222222',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
