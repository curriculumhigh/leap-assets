<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line — Midpoint and Distance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 4.5, 10.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Y_LINE = 0;
        var TICK_HALF = 0.2;
        var COL_LINE = '#444444';
        var COL_PT = '#222222';
        var COL_ARROW = '#2563EB';

        // ── Number line (segment with arrows on both ends) ──────────────
        board.create('segment', [[-4, Y_LINE], [10, Y_LINE]], {
            strokeColor: COL_LINE, strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var i;
        for (i = -3; i <= 9; i++) {
            board.create('segment', [[i, Y_LINE - TICK_HALF], [i, Y_LINE + TICK_HALF]], {
                strokeColor: COL_LINE, strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            board.create('text', [i, Y_LINE - 0.7, String(i)], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 12, color: COL_LINE,
                fixed: true, highlight: false
            });
        }

        // ── Solid dots at −2, 3, and 8 ─────────────────────────────────
        board.create('point', [-2, Y_LINE], {
            name: '', size: 5, color: COL_PT, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [3, Y_LINE], {
            name: '', size: 5, color: COL_PT, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [8, Y_LINE], {
            name: '', size: 5, color: COL_PT, fixed: true,
            highlight: false, showInfobox: false
        });

        // ── Point labels below the line ─────────────────────────────────
        board.create('text', [-2, Y_LINE - 1.3, '\\mathbf{-2}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_PT, useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [3, Y_LINE - 1.3, '\\mathbf{3}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_PT, useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [8, Y_LINE - 1.3, '\\mathbf{8}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_PT, useKatex: true,
            fixed: true, highlight: false
        });

        // ── Distance arrows above the line ──────────────────────────────
        var Y_ARROW = 1.6;

        // Left arrow: 3 → −2
        board.create('arrow', [[3, Y_ARROW], [-2, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Right arrow: 3 → 8
        board.create('arrow', [[3, Y_ARROW], [8, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Vertical whiskers connecting arrows to the number line
        board.create('segment', [[-2, Y_LINE + 0.35], [-2, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
        board.create('segment', [[3, Y_LINE + 0.35], [3, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
        board.create('segment', [[8, Y_LINE + 0.35], [8, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // ── Distance labels above arrows ────────────────────────────────
        board.create('text', [0.5, Y_ARROW + 0.7, '\\color{#2563EB}{3}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [5.5, Y_ARROW + 0.7, '\\color{#2563EB}{3}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, useKatex: true,
            fixed: true, highlight: false
        });

    </script>
</body>
</html>
