<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Plot — Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 3.6, 8.8, -1.4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Number line — plain segment (bounded data axis)
        board.create('segment', [[-0.2, 0], [8.4, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false
        });

        // Tick marks and labels 0–8
        var tickLen = 0.15;
        for (var t = 0; t <= 8; t++) {
            board.create('segment', [[t, -tickLen], [t, tickLen]], {
                strokeColor: '#444444',
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            board.create('text', [t, -0.45, String(t)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // Axis label — centered below the number line
        board.create('text', [4, -0.5, '\\textit{Books}'], {
            useKatex: true,
            anchorX: 'middle',
            anchorY: 'top',
            fontSize: 14,
            color: '#444444',
            fixed: true,
            highlight: false
        });

        // Dot data
        var data = [
            { x: 1, count: 2 },
            { x: 2, count: 3 },
            { x: 3, count: 5 },
            { x: 4, count: 4 },
            { x: 5, count: 3 },
            { x: 6, count: 2 },
            { x: 8, count: 1 }
        ];

        var DOT_COLOR = '#2563EB';
        var DOT_SIZE = 3.5;
        var Y_START = 0.6;
        var Y_GAP = 0.5;

        for (var d = 0; d < data.length; d++) {
            var xVal = data[d].x;
            var count = data[d].count;
            for (var i = 0; i < count; i++) {
                board.create('point', [xVal, Y_START + i * Y_GAP], {
                    name: '',
                    size: DOT_SIZE,
                    color: DOT_COLOR,
                    strokeColor: DOT_COLOR,
                    fixed: true,
                    highlight: false,
                    showInfobox: false
                });
            }
        }
    </script>
</body>
</html>
