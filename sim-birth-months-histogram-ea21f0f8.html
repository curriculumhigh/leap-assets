<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Months Histogram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var data   = [4, 7, 12, 18, 24, 28, 27, 23, 17, 11, 6, 3];

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 34, 13.5, -5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Horizontal gridlines ────────────────────────────────────────
        var gridTicks = [5, 10, 15, 20, 25, 30];
        var i;
        for (i = 0; i < gridTicks.length; i++) {
            board.create('segment', [[0, gridTicks[i]], [12.5, gridTicks[i]]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Y-axis ─────────────────────────────────────────────────────
        board.create('segment', [[0, 0], [0, 32]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Y-axis ticks and labels
        var yTicks = [0, 5, 10, 15, 20, 25, 30];
        for (i = 0; i < yTicks.length; i++) {
            // Tick mark
            board.create('segment', [[-0.25, yTicks[i]], [0, yTicks[i]]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [-0.5, yTicks[i], String(yTicks[i])], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Y-axis label
        board.create('text', [-1.2, 16, 'Frequency'], {
            fontSize: 13, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            rotate: 90, fixed: true, highlight: false
        });

        // ── X-axis (baseline) ───────────────────────────────────────────
        board.create('segment', [[0, 0], [12.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Bars ────────────────────────────────────────────────────────
        var barWidth = 0.85;
        var gap = 0.15;
        var barFill = '#2563EB';
        var barStroke = '#1D4ED8';

        for (i = 0; i < data.length; i++) {
            var x0 = 0.25 + i * (barWidth + gap);
            var x1 = x0 + barWidth;
            var h = data[i];

            // Bar as polygon
            var p1 = board.create('point', [x0, 0],  { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [x1, 0],  { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [x1, h],   { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [x0, h],   { visible: false, fixed: true, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: barFill, fillOpacity: 0.7,
                borders: { strokeColor: barStroke, strokeWidth: 1 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Month label centered below bar
            var cx = x0 + barWidth / 2;
            board.create('text', [cx, -1.2, months[i]], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── X-axis label ────────────────────────────────────────────────
        board.create('text', [6.25, -3.5, 'Birth Month'], {
            fontSize: 13, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
