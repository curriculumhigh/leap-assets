<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle PQR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 6, 3.5, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var P = board.create('point', [0, 4.5], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var Q = board.create('point', [-2.2, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var R = board.create('point', [2.2, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        // Triangle edges
        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            highlightFillColor: 'none', highlightFillOpacity: 0,
            borders: {
                strokeColor: '#555555', strokeWidth: 2.0,
                highlightStrokeColor: '#555555', highlightStrokeWidth: 2.0,
                highlight: false
            },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // Vertex labels
        board.create('text', [0, 5.0, 'P'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [-2.6, -0.1, 'Q'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [2.6, -0.1, 'R'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false, useKatex: true
        });

        // Side labels - PQ labeled "x" (left leg midpoint, offset left)
        var midPQ_x = (P.X() + Q.X()) / 2;
        var midPQ_y = (P.Y() + Q.Y()) / 2;
        board.create('text', [midPQ_x - 0.55, midPQ_y, 'x'], {
            fontSize: 14, color: '#222222', anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        // Side labels - PR labeled "7" (right leg midpoint, offset right)
        var midPR_x = (P.X() + R.X()) / 2;
        var midPR_y = (P.Y() + R.Y()) / 2;
        board.create('text', [midPR_x + 0.55, midPR_y, '7'], {
            fontSize: 14, color: '#222222', anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        // Congruent angle arcs at Q and R
        board.create('nonReflexAngle', [P, Q, R], {
            radius: 0.55,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [Q, R, P], {
            radius: 0.55,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Tick marks on arcs to indicate congruence
        var angQ_bisector = Math.atan2(
            ((P.Y() - Q.Y()) / Math.sqrt(Math.pow(P.X()-Q.X(),2)+Math.pow(P.Y()-Q.Y(),2)) +
             (R.Y() - Q.Y()) / Math.sqrt(Math.pow(R.X()-Q.X(),2)+Math.pow(R.Y()-Q.Y(),2))),
            ((P.X() - Q.X()) / Math.sqrt(Math.pow(P.X()-Q.X(),2)+Math.pow(P.Y()-Q.Y(),2)) +
             (R.X() - Q.X()) / Math.sqrt(Math.pow(R.X()-Q.X(),2)+Math.pow(R.Y()-Q.Y(),2)))
        );
        var tickLen = 0.12;
        var tickDist = 0.55;
        var tickQ_cx = Q.X() + tickDist * Math.cos(angQ_bisector);
        var tickQ_cy = Q.Y() + tickDist * Math.sin(angQ_bisector);
        var tickQ_perp = angQ_bisector + Math.PI / 2;
        board.create('segment', [
            [tickQ_cx - tickLen * Math.cos(tickQ_perp), tickQ_cy - tickLen * Math.sin(tickQ_perp)],
            [tickQ_cx + tickLen * Math.cos(tickQ_perp), tickQ_cy + tickLen * Math.sin(tickQ_perp)]
        ], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        var angR_bisector = Math.atan2(
            ((Q.Y() - R.Y()) / Math.sqrt(Math.pow(Q.X()-R.X(),2)+Math.pow(Q.Y()-R.Y(),2)) +
             (P.Y() - R.Y()) / Math.sqrt(Math.pow(P.X()-R.X(),2)+Math.pow(P.Y()-R.Y(),2))),
            ((Q.X() - R.X()) / Math.sqrt(Math.pow(Q.X()-R.X(),2)+Math.pow(Q.Y()-R.Y(),2)) +
             (P.X() - R.X()) / Math.sqrt(Math.pow(P.X()-R.X(),2)+Math.pow(P.Y()-R.Y(),2)))
        );
        var tickR_cx = R.X() + tickDist * Math.cos(angR_bisector);
        var tickR_cy = R.Y() + tickDist * Math.sin(angR_bisector);
        var tickR_perp = angR_bisector + Math.PI / 2;
        board.create('segment', [
            [tickR_cx - tickLen * Math.cos(tickR_perp), tickR_cy - tickLen * Math.sin(tickR_perp)],
            [tickR_cx + tickLen * Math.cos(tickR_perp), tickR_cy + tickLen * Math.sin(tickR_perp)]
        ], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

    </script>
</body>
</html>
