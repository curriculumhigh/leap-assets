<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponential Decay Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 11.5, 7.8, -1.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        ticksDistance: 1,
                        minorTicks: 3,
                        minorHeight: 5
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        ticksDistance: 2,
                        minorTicks: 7,
                        minorHeight: 5
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.3, -0.7, '<i>n</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.2, 10.9, 'a_n'], { fontSize: 11, fixed: true, highlight: false, useKatex: true });

        // Smooth exponential decay curve: a_n = 16 * (1/2)^n
        board.create('functiongraph', [
            function(n) { return 16 * Math.pow(0.5, n); },
            0.3, 7.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Scatter points
        var pts = [[1,8], [2,4], [3,2], [4,1], [5,0.5], [6,0.25]];
        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 3, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
