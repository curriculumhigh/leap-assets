<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4974</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;
            pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .container{width:400px;height:400px;margin:0;padding:0;}
  .board-wrapper{background:white;border-radius:8px;padding:10px;
                 width:calc(100% - 20px);height:calc(100% - 20px);}
  #board{width:100%;height:100%;}
</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
  var RMAX=12, SPAN=15.942857142857143, RS=2;
  var board=JXG.JSXGraph.initBoard('board',{
    boundingbox:[-SPAN,SPAN,SPAN,-SPAN],axis:false,grid:false,keepAspectRatio:true,
    showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
  var GC='#D1D5DB', GW=0.4;
  for(var i=RS;i<=RMAX+1e-9;i+=RS)
    board.create('circle',[[0,0],i],{strokeColor:GC,strokeWidth:GW,fillColor:'none',fixed:true,highlight:false});
  for(var i=0;i<24;i++){ var a=i*Math.PI/12;
    board.create('segment',[[0,0],[RMAX*Math.cos(a),RMAX*Math.sin(a)]],{strokeColor:GC,strokeWidth:GW,fixed:true,highlight:false}); }
  board.create('arrow',[[0,0],[RMAX+1.2*1.7142857142857142,0]],{strokeColor:'#444',strokeWidth:1.0,lastArrow:{type:2,size:5},fixed:true,highlight:false});
  board.create('point',[0,0],{name:'',size:2,color:'#222',fixed:true,highlight:false});
  board.create('text',[RMAX+1.1*1.7142857142857142,0.6,'<i>polar axis</i>'],{fontSize:10,color:'#444',fixed:true,highlight:false,anchorX:'right',anchorY:'bottom'});
  board.create('text',[-0.6000,2.0000,'2'],{fontSize:9,color:'#666',fixed:true,highlight:false,anchorX:'right',anchorY:'middle'});
  board.create('text',[-0.6000,4.0000,'4'],{fontSize:9,color:'#666',fixed:true,highlight:false,anchorX:'right',anchorY:'middle'});
  board.create('text',[-0.6000,6.0000,'6'],{fontSize:9,color:'#666',fixed:true,highlight:false,anchorX:'right',anchorY:'middle'});
  board.create('text',[-0.6000,8.0000,'8'],{fontSize:9,color:'#666',fixed:true,highlight:false,anchorX:'right',anchorY:'middle'});
  board.create('text',[-0.6000,10.0000,'10'],{fontSize:9,color:'#666',fixed:true,highlight:false,anchorX:'right',anchorY:'middle'});
  board.create('text',[-0.6000,12.0000,'12'],{fontSize:9,color:'#666',fixed:true,highlight:false,anchorX:'right',anchorY:'middle'});
  board.create('text',[12.0254,6.9429,'\\tfrac{\\pi}{6}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[9.8187,9.8187,'\\tfrac{\\pi}{4}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[6.9429,12.0254,'\\tfrac{\\pi}{3}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[0.0000,13.8857,'\\tfrac{\\pi}{2}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-6.9429,12.0254,'\\tfrac{2\\pi}{3}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-9.8187,9.8187,'\\tfrac{3\\pi}{4}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-12.0254,6.9429,'\\tfrac{5\\pi}{6}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-13.8857,0.0000,'\\pi'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-12.0254,-6.9429,'\\tfrac{7\\pi}{6}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-9.8187,-9.8187,'\\tfrac{5\\pi}{4}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-6.9429,-12.0254,'\\tfrac{4\\pi}{3}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[-0.0000,-13.8857,'\\tfrac{3\\pi}{2}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[6.9429,-12.0254,'\\tfrac{5\\pi}{3}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[9.8187,-9.8187,'\\tfrac{7\\pi}{4}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('text',[12.0254,-6.9429,'\\tfrac{11\\pi}{6}'],{fontSize:11,color:'#555',fixed:true,highlight:false,anchorX:'middle',anchorY:'middle',useKatex:true});
  board.create('curve',[function(t){return (10*Math.cos(t))*Math.cos(t);},function(t){return (10*Math.cos(t))*Math.sin(t);},0,2*Math.PI],{strokeColor:'#2563EB',strokeWidth:2.4,fixed:true,highlight:false});
</script></body></html>
