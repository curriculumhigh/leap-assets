<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane M — Intersecting Segments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.2, 3.8, 5.2, -3.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Plane M (light gray parallelogram) ─────────────────────────
        var planeCorners = [
            board.create('point', [-4.6, -2.6], { visible: false, fixed: true, name: '' }),
            board.create('point', [4.6, -2.6], { visible: false, fixed: true, name: '' }),
            board.create('point', [3.8, 2.6], { visible: false, fixed: true, name: '' }),
            board.create('point', [-3.0, 2.6], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', planeCorners, {
            fillColor: '#F3F4F6', fillOpacity: 0.7,
            borders: { strokeColor: '#9CA3AF', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // Plane label M — italic, bottom-left area
        board.create('text', [-4.0, -2.1, 'M'], {
            fontSize: 13, color: '#555555', fixed: true, highlight: false,
            cssStyle: 'font-style:italic; font-weight:600;'
        });

        // ── Central intersection point W ────────────────────────────────
        var W = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // W label
        board.create('text', [0.25, -0.5, 'W'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false
        });

        // ── Segment endpoints ───────────────────────────────────────────
        var P = board.create('point', [-3.6, 0.6], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var Q = board.create('point', [3.6, -0.6], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        var R = board.create('point', [-2.4, -2.0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var S = board.create('point', [2.4, 2.0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        var T = board.create('point', [-1.0, 2.2], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var U = board.create('point', [1.0, -2.2], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        // ── Segments ────────────────────────────────────────────────────
        board.create('segment', [P, Q], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [R, S], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [T, U], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Point labels (KaTeX) ────────────────────────────────────────
        board.create('text', [-3.9, 1.0, 'P'], { useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false });
        board.create('text', [3.7, -1.1, 'Q'], { useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false });
        board.create('text', [-2.9, -2.2, 'R'], { useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false });
        board.create('text', [2.6, 2.1, 'S'], { useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false });
        board.create('text', [-1.5, 2.3, 'T'], { useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false });
        board.create('text', [1.2, -2.5, 'U'], { useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false });

        // ── Tick marks (congruence indicators) ──────────────────────────
        function drawTicks(pA, pB, n, color) {
            var mx = (pA.X() + pB.X()) / 2;
            var my = (pA.Y() + pB.Y()) / 2;
            var dx = pB.X() - pA.X();
            var dy = pB.Y() - pA.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickHalf = 0.22;
            var spacing = 0.18;

            var startOffset = -(n - 1) / 2 * spacing;

            for (var i = 0; i < n; i++) {
                var along = startOffset + i * spacing;
                var ux = dx / len;
                var uy = dy / len;
                var cx = mx + along * ux;
                var cy = my + along * uy;

                var p1 = board.create('point', [cx + px * tickHalf, cy + py * tickHalf], { visible: false, fixed: true, name: '' });
                var p2 = board.create('point', [cx - px * tickHalf, cy - py * tickHalf], { visible: false, fixed: true, name: '' });
                board.create('segment', [p1, p2], {
                    strokeColor: color, strokeWidth: 1.8, fixed: true, highlight: false
                });
            }
        }

        var TICK_COL = '#DC2626';

        drawTicks(P, W, 1, TICK_COL);
        drawTicks(W, Q, 1, TICK_COL);

        drawTicks(R, W, 2, TICK_COL);
        drawTicks(W, S, 2, TICK_COL);

        drawTicks(T, W, 3, TICK_COL);
        drawTicks(W, U, 3, TICK_COL);

    </script>
</body>
</html>
