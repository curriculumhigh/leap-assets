<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Stops — L, B, F, G, P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 2.5, 11, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Horizontal line
        var xStart = 0;
        var xEnd = 10;
        board.create('segment', [[xStart, 0], [xEnd, 0]], {
            strokeColor: '#222222',
            strokeWidth: 2,
            fixed: true,
            highlight: false
        });

        // Point positions (evenly spaced)
        var labels = ['L', 'B', 'F', 'G', 'P'];
        var positions = [1, 3.25, 5.5, 7.75, 10];

        for (var i = 0; i < labels.length; i++) {
            // Point dot
            board.create('point', [positions[i], 0], {
                name: '',
                size: 2.5,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            // Label above point
            board.create('text', [positions[i], 0.7, '<b>' + labels[i] + '</b>'], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 15,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
