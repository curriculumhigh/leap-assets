<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cone on Hemisphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 6.5, 4.5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 2.8;
        var coneH = 3.2;
        var ellipseK = 0.28;

        var yBase = 0;
        var yApex = yBase + coneH;

        function drawEllipseArc(cx, cy, rx, ry, startAng, endAng, attrs) {
            return board.create('curve', [
                function(t) { return cx + rx * Math.cos(t); },
                function(t) { return cy + ry * Math.sin(t); },
                startAng,
                endAng
            ], attrs);
        }

        drawEllipseArc(0, yBase, R, R * ellipseK, Math.PI, 2 * Math.PI, {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        drawEllipseArc(0, yBase, R, R * ellipseK, 0, Math.PI, {
            strokeColor: '#555555', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [[-R, yBase], [0, yApex]], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('segment', [[R, yBase], [0, yApex]], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('point', [0, yApex], {
            name: '', size: 1.5, color: '#555555', fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return R * Math.cos(t); },
            function(t) { return yBase + R * Math.sin(t); },
            -Math.PI, 0
        ], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.update();
    </script>
</body>
</html>
