<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of h(t) = -250t + 3000</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 520px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.2, 3500, 13.8, -500],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Custom x-axis
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                minorTicks: 0,
                ticksDistance: 2,
                label: { fontSize: 11, offset: [0, -14] },
                drawZero: true
            },
            highlight: false
        });

        // Custom y-axis — tick labels to the left
        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                minorTicks: 0,
                ticksDistance: 500,
                label: { fontSize: 11, offset: [-8, 0], anchorX: 'right' },
                drawZero: false
            },
            highlight: false
        });

        // Grid lines
        var gridXvals = [2, 4, 6, 8, 10, 12];
        var gridYvals = [500, 1000, 1500, 2000, 2500, 3000];

        for (var i = 0; i < gridXvals.length; i++) {
            board.create('segment', [[gridXvals[i], 0], [gridXvals[i], 3000]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (var j = 0; j < gridYvals.length; j++) {
            board.create('segment', [[0, gridYvals[j]], [12, gridYvals[j]]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Axis label — x-axis
        board.create('text', [6, -350, 'Time (minutes)'], {
            fontSize: 13, anchorX: 'middle', fixed: true, highlight: false
        });

        // Axis label — y-axis (rotated, positioned with enough clearance)
        board.create('text', [-1.4, 1500, 'Height (feet)'], {
            fontSize: 13, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false,
            rotate: 90, display: 'internal'
        });

        // Line segment: h(t) = -250t + 3000 from (0,3000) to (12,0)
        board.create('segment', [[0, 3000], [12, 0]], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points — y-intercept (0, 3000)
        board.create('point', [0, 3000], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Key points — x-intercept (12, 0)
        board.create('point', [12, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
