<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diagram — Disjoint Sets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 5.5, 10.5, -0.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Universal set rectangle
        var rectP1 = board.create('point', [0.5, 0.5], { visible: false, fixed: true, name: '' });
        var rectP2 = board.create('point', [9.5, 0.5], { visible: false, fixed: true, name: '' });
        var rectP3 = board.create('point', [9.5, 5.0], { visible: false, fixed: true, name: '' });
        var rectP4 = board.create('point', [0.5, 5.0], { visible: false, fixed: true, name: '' });
        board.create('polygon', [rectP1, rectP2, rectP3, rectP4], {
            fillColor: '#f9fafb', fillOpacity: 0.5,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Label S — top-left corner
        board.create('text', [1.0, 4.6, '<b>S</b>'], {
            fontSize: 15, color: '#333333', fixed: true, highlight: false
        });

        // Circle A — left side
        var centerA = board.create('point', [3.2, 2.75], { visible: false, fixed: true, name: '' });
        board.create('circle', [centerA, 1.5], {
            strokeColor: '#555555', strokeWidth: 2,
            fillColor: '#2563EB', fillOpacity: 0.10,
            fixed: true, highlight: false
        });

        // Label A
        board.create('text', [2.85, 3.6, '<b>A</b>'], {
            fontSize: 15, color: '#2563EB', fixed: true, highlight: false
        });

        // Circle B — right side (clearly separated)
        var centerB = board.create('point', [6.8, 2.75], { visible: false, fixed: true, name: '' });
        board.create('circle', [centerB, 1.5], {
            strokeColor: '#555555', strokeWidth: 2,
            fillColor: '#059669', fillOpacity: 0.10,
            fixed: true, highlight: false
        });

        // Label B
        board.create('text', [6.45, 3.6, '<b>B</b>'], {
            fontSize: 15, color: '#059669', fixed: true, highlight: false
        });
    </script>
</body>
</html>
