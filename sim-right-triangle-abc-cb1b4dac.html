<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle ABC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 10, -2.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices: C at bottom-right (right angle), B at bottom-left, A at top
        var C = board.create('point', [7, 0], { name: 'C', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [8, -12] } });
        var B = board.create('point', [0, 0], { name: 'B', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [-18, -12] } });
        var A = board.create('point', [7, 5], { name: 'A', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [8, 5] } });

        // Triangle
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Right angle marker at C
        var markerSize = 0.55;
        board.create('segment', [[7 - markerSize, 0], [7 - markerSize, markerSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [[7 - markerSize, markerSize], [7, markerSize]], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Side labels
        // BC = 7 (horizontal, bottom)
        board.create('text', [3.5, -0.7, '7'], { fontSize: 14, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false, useKatex: true });

        // AC = 5 (vertical, right side)
        board.create('text', [7.7, 2.5, '5'], { fontSize: 14, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false, useKatex: true });

        // AB = c (hypotenuse, left side)
        board.create('text', [2.8, 3.0, 'c'], { fontSize: 14, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false, useKatex: true, cssStyle: 'font-style: italic;' });
    </script>
</body>
</html>
