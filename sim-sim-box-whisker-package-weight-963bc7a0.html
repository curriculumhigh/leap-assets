<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-and-Whisker Plots — Package Weight</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 9.3, 27.5, -1.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_P = '#222222';
        var COL_Q = '#2563EB';
        var COL_R = '#059669';
        var COL_AXIS = '#444444';

        // ── Data (y-centers updated: gap increased from 2.0 to 2.5) ────
        var warehouses = [
            { name: 'Warehouse P', color: COL_P, min: 1, q1: 4, med: 6, q3: 12, max: 16, yCenter: 6.5 },
            { name: 'Warehouse Q', color: COL_Q, min: 3, q1: 8, med: 13, q3: 18, max: 23, yCenter: 4.0 },
            { name: 'Warehouse R', color: COL_R, min: 5, q1: 14, med: 19, q3: 21, max: 24, yCenter: 1.5 }
        ];

        var BOX_HALF = 0.4;
        var CAP_HALF = 0.25;
        var LABEL_OFFSET_Y = 0.55;

        // ── X-axis (number line) ────────────────────────────────────────
        board.create('segment', [[-0.5, 0.8], [26.8, 0.8]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Tick marks and labels on x-axis
        var i;
        for (i = 0; i <= 26; i += 2) {
            board.create('segment', [[i, 0.6], [i, 1.0]], {
                strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [i, 0.2, String(i)], {
                fontSize: 11, color: COL_AXIS, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis label just below tick labels
        board.create('text', [13, -0.5, '\\textit{Package Weight (kg)}'], {
            fontSize: 13, color: COL_AXIS, anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // ── Draw box-and-whisker plots ──────────────────────────────────
        function drawBoxPlot(data) {
            var y = data.yCenter;
            var yTop = y + BOX_HALF;
            var yBot = y - BOX_HALF;
            var col = data.color;

            // ── Whiskers (horizontal lines) ─────────────────────────────
            // Left whisker: min → Q1
            board.create('segment', [[data.min, y], [data.q1, y]], {
                strokeColor: col, strokeWidth: 1.5, fixed: true, highlight: false
            });
            // Right whisker: Q3 → max
            board.create('segment', [[data.q3, y], [data.max, y]], {
                strokeColor: col, strokeWidth: 1.5, fixed: true, highlight: false
            });

            // ── End-caps ────────────────────────────────────────────────
            // Min cap
            board.create('segment', [[data.min, y - CAP_HALF], [data.min, y + CAP_HALF]], {
                strokeColor: col, strokeWidth: 1.5, fixed: true, highlight: false
            });
            // Max cap
            board.create('segment', [[data.max, y - CAP_HALF], [data.max, y + CAP_HALF]], {
                strokeColor: col, strokeWidth: 1.5, fixed: true, highlight: false
            });

            // ── Box (Q1 to Q3) ──────────────────────────────────────────
            var p1 = board.create('point', [data.q1, yBot], { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [data.q3, yBot], { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [data.q3, yTop], { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [data.q1, yTop], { visible: false, fixed: true, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: col, fillOpacity: 0.12,
                borders: { strokeColor: col, strokeWidth: 2.0 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // ── Median line ─────────────────────────────────────────────
            board.create('segment', [[data.med, yBot], [data.med, yTop]], {
                strokeColor: col, strokeWidth: 2.5, fixed: true, highlight: false
            });

            // ── Category label (centered above the plot) ────────────────
            var boxMidX = (data.q1 + data.q3) / 2;
            board.create('text', [boxMidX, yTop + 1.05, data.name], {
                fontSize: 12, color: col, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: 'font-weight:600'
            });

            // ── Value labels (adjacent to keypoints, just above) ────────
            var labelY = yTop + LABEL_OFFSET_Y;
            var vals = [
                { x: data.min, txt: String(data.min) },
                { x: data.q1, txt: String(data.q1) },
                { x: data.med, txt: String(data.med) },
                { x: data.q3, txt: String(data.q3) },
                { x: data.max, txt: String(data.max) }
            ];

            for (var v = 0; v < vals.length; v++) {
                board.create('text', [vals[v].x, labelY, vals[v].txt], {
                    fontSize: 11, color: col, anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false,
                    useKatex: true
                });
            }
        }

        for (var w = 0; w < warehouses.length; w++) {
            drawBoxPlot(warehouses[w]);
        }
    </script>
</body>
</html>
