<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position and velocity of particle P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // Position s(t): piecewise-linear, vertices below (rule not shown)
        var PTS = [[0, 0], [2, 2], [4, 2], [5, 0], [6, 0], [7, -4], [9, -4], [10, -2]];
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 3.6, 10.75, -5.6],
            axis: false, showNavigation: false, showCopyright: false,
            pan: { enabled: false }, zoom: { enabled: false }
        });
        var i, AX = '#444444', GRID = '#D1D5DB', S_COL = '#222222', V_COL = '#2563EB';

        // Grid every 1 unit
        for (i = 1; i <= 10; i++) board.create('segment', [[i, -5.3], [i, 3.3]], { strokeColor: GRID, strokeWidth: 0.4, fixed: true, highlight: false });
        for (i = -5; i <= 3; i++) { if (i === 0) continue; board.create('segment', [[0, i], [10.4, i]], { strokeColor: GRID, strokeWidth: 0.4, fixed: true, highlight: false }); }
        // Light dashed guides at the corners of s(t), where v(t) is not defined
        [2, 4, 5, 6, 7, 9].forEach(function (g) {
            board.create('segment', [[g, -5.3], [g, 3.3]], { strokeColor: '#9CA3AF', strokeWidth: 1, dash: 2, fixed: true, highlight: false });
        });
        // Axes
        board.create('arrow', [[-0.15, 0], [10.6, 0]], { strokeColor: AX, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false });
        board.create('arrow', [[0, -5.4], [0, 3.5]], { strokeColor: AX, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false });

        // t ticks + numbers; at t = 6 the graph leaves the axis down to the right, so that number sits on the left of its tick
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[i, -0.1], [i, 0.1]], { strokeColor: AX, strokeWidth: 1.0, fixed: true, highlight: false });
            var left = (i === 6);
            board.create('text', [left ? i - 0.1 : i + 0.1, -0.4, String(i)], { fontSize: 11, color: AX, anchorX: left ? 'right' : 'left', anchorY: 'middle', fixed: true, highlight: false });
        }
        for (i = -5; i <= 3; i++) {
            if (i === 0) continue;
            board.create('segment', [[-0.08, i], [0.08, i]], { strokeColor: AX, strokeWidth: 1.0, fixed: true, highlight: false });
            board.create('text', [-0.18, i, String(i)], { fontSize: 11, color: AX, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });
        }
        board.create('text', [-0.18, -0.4, '0'], { fontSize: 11, color: AX, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [10.6, 0.35, 't'], { useKatex: true, fontSize: 14, color: AX, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // s(t): line segments; the piece lying on the t-axis is drawn thicker so it stands out on top of the axis
        for (i = 0; i < PTS.length - 1; i++) {
            var onAxis = PTS[i][1] === 0 && PTS[i + 1][1] === 0;
            board.create('segment', [PTS[i], PTS[i + 1]], { strokeColor: S_COL, strokeWidth: onAxis ? 3.2 : 1.8, lineCap: 'round', fixed: true, highlight: false });
        }
        // v(t): horizontal steps (slope of each s-segment), open circles at both ends where v is not defined
        var VSEG = [[0, 2, 1], [2, 4, 0], [4, 5, -2], [5, 6, 0], [6, 7, -4], [7, 9, 0], [9, 10, 2]];
        VSEG.forEach(function (sg) {
            board.create('segment', [[sg[0], sg[2]], [sg[1], sg[2]]], { strokeColor: V_COL, strokeWidth: sg[2] === 0 ? 3.2 : 2.2, fixed: true, highlight: false, layer: 8 });
            [sg[0], sg[1]].forEach(function (x) {
                board.create('point', [x, sg[2]], { name: '', size: 3, strokeColor: V_COL, strokeWidth: 1.5, fillColor: '#ffffff', fixed: true, highlight: false, showInfobox: false, layer: 9 });
            });
        });
        board.create('text', [1.25, 2.0, 's(t)'], { useKatex: true, fontSize: 13, color: S_COL, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.3, 1.45, 'v(t)'], { useKatex: true, fontSize: 13, color: V_COL, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false });
    </script>
</body>
</html>
