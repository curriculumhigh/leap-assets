<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Library Visitors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.2, 9.5, 14.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Custom axes (origin at 0,0, positive direction only) ────────

        // x-axis: 0 → ~13.5
        var xAxis = board.create('arrow', [[0, 0], [13.8, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // y-axis: 0 → ~9
        var yAxis = board.create('arrow', [[0, 0], [0, 9]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Grid lines ──────────────────────────────────────────────────

        // Vertical grid lines at x = 2, 4, 6, 8, 10, 12
        var xi;
        for (xi = 2; xi <= 12; xi += 2) {
            board.create('segment', [[xi, 0], [xi, 8]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // Horizontal grid lines at y = 1, 2, ..., 8
        var yi;
        for (yi = 1; yi <= 8; yi += 1) {
            board.create('segment', [[0, yi], [12, yi]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // ── Tick marks & labels on x-axis (every 2) ────────────────────

        for (xi = 0; xi <= 12; xi += 2) {
            // Tick mark
            board.create('segment', [[xi, -0.15], [xi, 0.15]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            // Tick label
            board.create('text', [xi, -0.55, String(xi)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Tick marks & labels on y-axis (every 1) ────────────────────

        for (yi = 1; yi <= 8; yi += 1) {
            // Tick mark
            board.create('segment', [[-0.15, yi], [0.15, yi]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            // Tick label
            board.create('text', [-0.4, yi, String(yi)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Axis labels ─────────────────────────────────────────────────

        // x-axis label
        board.create('text', [6, -1.3, '\\text{Year}\\;(0 \\leftrightarrow 2005)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // y-axis label (placed vertically along y-axis using CSS rotation)
        board.create('text', [-1.7, 4.5,
            '<div style="transform:rotate(-90deg);white-space:nowrap;font-size:13px;color:#222222;">Visitors (millions)</div>'
        ], {
            fontSize: 13, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Title ───────────────────────────────────────────────────────

        board.create('text', [6, 9, '\\textbf{City Library Visitors}'], {
            fontSize: 16, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // ── Data line: (0, 3) to (12, 6) ───────────────────────────────

        board.create('segment', [[0, 3], [12, 6]], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Endpoint markers ────────────────────────────────────────────

        board.create('point', [0, 3], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        board.create('point', [12, 6], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

    </script>
</body>
</html>
