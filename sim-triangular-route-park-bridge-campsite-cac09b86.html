<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangular Route — Park Entrance, Bridge, Campsite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6, 8, -1.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Compass direction labels
        board.create('text', [7.6, -0.35, '<b>E</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });
        board.create('text', [-1.2, -0.35, '<b>W</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });
        board.create('text', [0.25, 5.6, '<b>N</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });
        board.create('text', [0.25, -1.45, '<b>S</b>'], { fontSize: 14, color: '#444444', fixed: true, highlight: false });

        // Points
        var O = board.create('point', [0, 0], {
            name: '', size: 3, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var B = board.create('point', [6, 0], {
            name: '', size: 3, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var C = board.create('point', [0, 4], {
            name: '', size: 3, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });

        // Segments forming the triangular route
        board.create('segment', [O, B], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [C, O], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Labels
        board.create('text', [0.3, -0.7, '\\text{Park Entrance}\\ (0,\\,0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        board.create('text', [6, -0.7, '\\text{Bridge}\\ (6,\\,0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        board.create('text', [0.4, 4.4, '\\text{Campsite}\\ (0,\\,4)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
