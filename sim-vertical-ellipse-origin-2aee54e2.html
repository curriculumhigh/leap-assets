<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Ellipse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 9, 7, -9],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            }
        });

        // Axis labels
        board.create('text', [6.4, -0.6, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.3, 8.4, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Ellipse: x²/16 + y²/36 = 1 → parametric: (4cos t, 6sin t)
        board.create('curve', [
            function(t) { return 4 * Math.cos(t); },
            function(t) { return 6 * Math.sin(t); },
            0, 2 * Math.PI
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Vertices (0, ±6)
        board.create('point', [0, 6], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [0, -6], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        // Co-vertices (±4, 0)
        board.create('point', [4, 0], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [-4, 0], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
