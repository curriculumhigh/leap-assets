<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle JKL Midsegment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.2, 8.5, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_MID = '#2563EB';
        var COL_EDGE = '#555555';
        var COL_VERT = '#222222';

        // ── Vertices ────────────────────────────────────────────────
        var J = board.create('point', [1, 4], {
            name: 'J', fixed: true, size: 2, color: COL_VERT, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: COL_VERT, offset: [-18, 4] }
        });
        var K = board.create('point', [7, 4], {
            name: 'K', fixed: true, size: 2, color: COL_VERT, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: COL_VERT, offset: [8, 4] }
        });
        var L = board.create('point', [3.5, -1.5], {
            name: 'L', fixed: true, size: 2, color: COL_VERT, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: COL_VERT, offset: [-4, -18] }
        });

        // ── Triangle outline ────────────────────────────────────────
        board.create('polygon', [J, K, L], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EDGE, strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // ── Midpoints ───────────────────────────────────────────────
        var M = board.create('midpoint', [J, L], {
            name: 'M', fixed: true, size: 2, color: COL_MID, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: COL_MID, offset: [-20, -6] }
        });
        var N = board.create('midpoint', [K, L], {
            name: 'N', fixed: true, size: 2, color: COL_MID, highlight: false, showInfobox: false,
            label: { fontSize: 14, color: COL_MID, offset: [10, -6] }
        });

        // ── Midsegment MN (blue) ───────────────────────────────────
        board.create('segment', [M, N], {
            strokeColor: COL_MID, strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Labels ──────────────────────────────────────────────────
        // JK label: "2x + 1" centered above the top side
        board.create('text', [4, 4.7, '2x + 1'], {
            useKatex: true, fontSize: 13, color: COL_VERT,
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // MN label: "11" centered below the midsegment (blue)
        board.create('text', [
            function() { return (M.X() + N.X()) / 2; },
            function() { return (M.Y() + N.Y()) / 2 - 0.55; },
            '11'
        ], {
            useKatex: true, fontSize: 13, color: COL_MID,
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
