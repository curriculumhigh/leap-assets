<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line 120–135</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [118.8, 3.5, 136.2, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Y = 0.8;
        var MAJOR_HALF = 0.45;
        var MINOR_HALF = 0.25;

        // Number line with arrows on both ends
        board.create('arrow', [[119.2, Y], [135.8, Y]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        board.create('arrow', [[135.8, Y], [119.2, Y]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        var i;
        // Major ticks at every integer 120–135
        for (i = 120; i <= 135; i++) {
            board.create('segment', [[i, Y - MAJOR_HALF], [i, Y + MAJOR_HALF]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            board.create('text', [i, Y - MAJOR_HALF - 0.45, String(i)], {
                anchorX: 'middle', anchorY: 'top',
                fontSize: 11, color: '#444444',
                fixed: true, highlight: false
            });
        }

        // Minor ticks at every 0.5
        for (i = 120.5; i <= 134.5; i += 1) {
            board.create('segment', [[i, Y - MINOR_HALF], [i, Y + MINOR_HALF]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
        }

        // Solid dots at 124 and 132
        board.create('point', [124, Y], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [132, Y], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Point labels above
        board.create('text', [124, Y + MAJOR_HALF + 0.55, '124'], {
            anchorX: 'middle', anchorY: 'bottom',
            fontSize: 13, color: '#222222',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });
        board.create('text', [132, Y + MAJOR_HALF + 0.55, '132'], {
            anchorX: 'middle', anchorY: 'bottom',
            fontSize: 13, color: '#222222',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
