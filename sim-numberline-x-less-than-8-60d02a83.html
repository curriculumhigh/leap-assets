<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x &lt; 8</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 3, 9.5, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Y = 0;
        var LINE_COLOR = '#222222';
        var RAY_COLOR = '#2563EB';

        // Number line base with arrows
        board.create('arrow', [[-5.2, Y], [9.2, Y]], {
            strokeColor: LINE_COLOR,
            strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });
        board.create('arrow', [[9.2, Y], [-5.2, Y]], {
            strokeColor: LINE_COLOR,
            strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels
        var tickMin = -4;
        var tickMax = 8;
        var tickHalf = 0.12;
        for (var i = tickMin; i <= tickMax; i++) {
            // Tick mark (short)
            board.create('segment', [[i, -tickHalf], [i, tickHalf]], {
                strokeColor: LINE_COLOR,
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            // Tick label
            board.create('text', [i, -0.5, String(i)], {
                anchorX: 'middle',
                anchorY: 'top',
                fontSize: 12,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Shaded ray from left arrow to x = 8 (blue)
        board.create('segment', [[-5.2, Y], [8, Y]], {
            strokeColor: RAY_COLOR,
            strokeWidth: 3,
            lastArrow: false,
            fixed: true,
            highlight: false
        });

        // Left arrow on the ray (indicating extends to -infinity)
        board.create('arrow', [[0, Y], [-5.2, Y]], {
            strokeColor: RAY_COLOR,
            strokeWidth: 3,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Open circle at x = 8
        board.create('point', [8, Y], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: RAY_COLOR,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
