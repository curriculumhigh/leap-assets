<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Solution — Line and Parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            width: 300px; height: 200px; background: transparent;
        }
        #board {
            width: 300px; height: 200px;
        }
        .JXGtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div id="board"></div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 5, 4, -1.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    firstArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 9, color: '#444444', offset: [0, -10] },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    firstArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 9, color: '#444444', offset: [-12, 0] },
                        drawZero: false
                    }
                }
            },
            grid: false
        });

        /* Axis labels */
        board.create('text', [3.6, -0.35, '<i>x</i>'], {
            fontSize: 11, fixed: true, highlight: false, color: '#444444'
        });
        board.create('text', [0.2, 4.6, '<i>y</i>'], {
            fontSize: 11, fixed: true, highlight: false, color: '#444444'
        });

        /* Horizontal line y = 0.5 (dark/black) */
        var lineY = 0.5;
        board.create('functiongraph', [
            function(x) { return lineY; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        /* Parabola y = x^2 + 0.5 (blue, vertex tangent to line) */
        board.create('functiongraph', [
            function(x) { return x * x + lineY; }
        ], {
            strokeColor: '#2563EB',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        /* Red tangent point at (0, 0.5) */
        board.create('point', [0, lineY], {
            name: '',
            size: 3,
            color: '#DC2626',
            strokeColor: '#DC2626',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
