<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Geometric Sequence r = -1/4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 10.5, 7.5, -4.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 7,
                        minorHeight: 6,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        /* Draw minor horizontal gridlines at every 0.25 units on the y-axis */
        var yMin = -4;
        var yMax = 10;
        var xMin = -0.8;
        var xMax = 7.5;
        for (var y = yMin; y <= yMax; y += 0.25) {
            /* Skip major gridlines (every 2 units) — those are drawn by the default grid */
            if (Math.abs(y % 2) < 0.01 || Math.abs(y % 2 - 2) < 0.01) continue;
            /* Also skip integer lines — they are already drawn by the grid at ticksDistance 1 on x */
            if (Math.abs(y - Math.round(y)) < 0.01) continue;
            board.create('line', [[0, y], [1, y]], {
                strokeColor: '#E5E7EB',
                strokeWidth: 0.3,
                fixed: true,
                highlight: false,
                straightFirst: true,
                straightLast: true,
                point1: { visible: false },
                point2: { visible: false }
            });
        }

        /* Axis labels */
        board.create('text', [7.0, -0.55, 'n'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false,
            useKatex: true
        });
        board.create('text', [0.2, 10.0, 'a_n'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false,
            useKatex: true
        });

        /* Data points */
        var pts = [
            [1, 8],
            [2, -2],
            [3, 0.5],
            [4, -0.125],
            [5, 0.03125],
            [6, -0.0078125]
        ];

        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '',
                size: 2.5,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
