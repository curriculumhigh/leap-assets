<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 300px; height: 300px; margin: 0; padding: 6px; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 6, 8, -6],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.5, -0.5, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.3, 5.5, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Define functions
        function f1(x) { return -x * x + 2 * x + 3; }
        function f2(x) { return x * x - 6 * x + 5; }

        // Shading: Inequality 1 — above f1 (y >= -x^2+2x+3)
        board.create('inequality', [
            board.create('functiongraph', [f1, -4, 8], { visible: false })
        ], {
            inverse: true,
            fillColor: '#222222',
            fillOpacity: 0.10,
            strokeWidth: 0,
            highlight: false,
            fixed: true
        });

        // Shading: Inequality 2 — below f2 (y < x^2-6x+5)
        board.create('inequality', [
            board.create('functiongraph', [f2, -4, 8], { visible: false })
        ], {
            inverse: false,
            fillColor: '#2563EB',
            fillOpacity: 0.10,
            strokeWidth: 0,
            highlight: false,
            fixed: true
        });

        // Overlap region: above f1 AND below f2
        // Intersection: -x^2+2x+3 = x^2-6x+5 -> x^2-4x+1=0 -> x = 2 +/- sqrt(3)
        var xLeft = 2 - Math.sqrt(3);
        var xRight = 2 + Math.sqrt(3);

        var N = 60;
        var xMin = -4;
        var xMax = 8;
        var dx, xi;

        // Left overlap region
        var overlapLeftX = [];
        var overlapLeftY = [];
        dx = (xLeft - xMin) / N;
        for (var i = 0; i <= N; i++) {
            xi = xMin + i * dx;
            overlapLeftX.push(xi);
            overlapLeftY.push(Math.min(f2(xi), 6));
        }
        for (var j = N; j >= 0; j--) {
            xi = xMin + j * dx;
            overlapLeftX.push(xi);
            overlapLeftY.push(Math.max(f1(xi), -6));
        }

        board.create('curve', [overlapLeftX, overlapLeftY], {
            strokeWidth: 0,
            fillColor: '#888888',
            fillOpacity: 0.22,
            fixed: true,
            highlight: false
        });

        // Right overlap region
        var overlapRightX = [];
        var overlapRightY = [];
        dx = (xMax - xRight) / N;
        for (var i = 0; i <= N; i++) {
            xi = xRight + i * dx;
            overlapRightX.push(xi);
            overlapRightY.push(Math.min(f2(xi), 6));
        }
        for (var j = N; j >= 0; j--) {
            xi = xRight + j * dx;
            overlapRightX.push(xi);
            overlapRightY.push(Math.max(f1(xi), -6));
        }

        board.create('curve', [overlapRightX, overlapRightY], {
            strokeWidth: 0,
            fillColor: '#888888',
            fillOpacity: 0.22,
            fixed: true,
            highlight: false
        });

        // Curve 1: y = -x^2 + 2x + 3 (SOLID)
        board.create('functiongraph', [f1, -4, 8], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Curve 2: y = x^2 - 6x + 5 (DASHED)
        board.create('functiongraph', [f2, -4, 8], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Labels
        board.create('text', [-3.2, 0.5, 'Inequality 1'], {
            fontSize: 9, color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [5.5, 1.5, 'Inequality 2'], {
            fontSize: 9, color: '#2563EB', fixed: true, highlight: false
        });
    </script>
</body>
</html>
