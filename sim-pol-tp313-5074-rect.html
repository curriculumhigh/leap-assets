<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pol-tp313 5074-rect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;
            pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .container{width:520px;height:380px;margin:0;padding:0;}
  .board-wrapper{background:white;border-radius:8px;padding:10px;
                 width:calc(100% - 20px);height:calc(100% - 20px);}
  #board{width:100%;height:100%;}
</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
  var XMIN=-0.3141592653589793, XMAX=3.455751918948773, YMIN=-9, YMAX=5, TMAX=3.141592653589793;
  var board=JXG.JSXGraph.initBoard('board',{boundingbox:[XMIN,YMAX,XMAX,YMIN],axis:false,grid:false,
    showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
  for(var gy=Math.ceil(YMIN); gy<YMAX; gy+=1){ if(gy!==0)
    board.create('line',[[XMIN,gy],[XMAX,gy]],{strokeColor:'#E5E7EB',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false}); }
  board.create('line',[[0.7853981633974483,YMIN],[0.7853981633974483,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('line',[[1.5707963267948966,YMIN],[1.5707963267948966,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('line',[[2.356194490192345,YMIN],[2.356194490192345,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('line',[[3.141592653589793,YMIN],[3.141592653589793,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('axis',[[0,0],[1,0]],{strokeColor:'#444444',strokeWidth:1.3,lastArrow:{type:2,size:6},ticks:{visible:false}});
  board.create('axis',[[0,0],[0,1]],{strokeColor:'#444444',strokeWidth:1.3,lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',minorTicks:0,
    ticksDistance:1,label:{fontSize:10,offset:[-14,0]},drawZero:false}});
  board.create('segment',[[0.7853981633974483,-0.252],[0.7853981633974483,0.252]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[0.7853981633974483,-8.23,'\\frac{\\pi}{4}'],{useKatex:true,fontSize:13,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[1.5707963267948966,-0.252],[1.5707963267948966,0.252]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[1.5707963267948966,-8.23,'\\frac{\\pi}{2}'],{useKatex:true,fontSize:13,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[2.356194490192345,-0.252],[2.356194490192345,0.252]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[2.356194490192345,-8.23,'\\frac{3\\pi}{4}'],{useKatex:true,fontSize:13,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[3.141592653589793,-0.252],[3.141592653589793,0.252]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[3.141592653589793,-8.23,'\\pi'],{useKatex:true,fontSize:13,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('text',[XMAX-0.04*TMAX,-(YMAX-YMIN)*0.06,'\\theta'],{useKatex:true,fontSize:14,color:'#222',fixed:true,highlight:false});
  board.create('text',[0.035*TMAX,YMAX-(YMAX-YMIN)*0.05,'r'],{useKatex:true,fontSize:14,color:'#222',fixed:true,highlight:false});
  board.create('functiongraph',[function(t){return -2+5*Math.sin(2*t);},0,TMAX],{strokeColor:'#2563EB',strokeWidth:2.6,fixed:true,highlight:false});
</script></body></html>
