<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; background: #ffffff; }
.container { height: calc(100% - 12px); padding: 6px; max-width: 560px; margin: 0 auto; }
#board { height: 100%; width: 100%; }
</style>
</head>
<body>
<div class="container"><div id="board"></div></div>
<script>
function _initSim() {

window.board = JXG.JSXGraph.initBoard('board', { boundingbox: [-7.4, 5.2, 7.4, -5.4], axis: false, showCopyright: false, showNavigation: false, keepAspectRatio: true, pan:{enabled:false}, zoom:{enabled:false} });
for (var gx = -7; gx <= 7; gx++) board.create('segment', [[gx,-5],[gx,4.8]], { strokeColor:'#E5E7EB', strokeWidth:0.4, fixed:true, highlight:false });
for (var gy = -5; gy <= 4; gy++) board.create('segment', [[-7,gy],[7,gy]], { strokeColor:'#E5E7EB', strokeWidth:0.4, fixed:true, highlight:false });
board.create('arrow', [[-7,0],[7,0]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('arrow', [[7,0],[-7,0]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('arrow', [[0,-5],[0,4.8]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('arrow', [[0,4.8],[0,-5]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('text', [6.9, -0.5, 'x'], { fontSize:14, color:'#222222', cssStyle:'font-style:italic;', fixed:true, highlight:false });
board.create('text', [0.3, 4.55, 'y'], { fontSize:14, color:'#222222', cssStyle:'font-style:italic;', fixed:true, highlight:false });
[-6,-4,-2,2,4,6].forEach(function(t){ board.create('text',[t,-0.45,String(t)],{fontSize:12,color:'#666666',anchorX:'middle',fixed:true, highlight:false}); });
[-4,-3,-2,-1,1,2,3,4].forEach(function(t){ board.create('text',[-0.25,t,String(t)],{fontSize:12,color:'#666666',anchorX:'right',fixed:true, highlight:false}); });
board.create('text', [-0.55, 0.4, 'O'], { fontSize:13, color:'#222222', cssStyle:'font-style:italic;', fixed:true, highlight:false });
board.create('segment', [[0,0],[3,-4]], { strokeColor:'#2563EB', strokeWidth:1.8, fixed:true, highlight:false });
board.create('point', [0,0], { name:'', size:2.5, color:'#222222', fixed:true, highlight:false, showInfobox:false });
board.create('point', [3,-4], { name:'', size:5, color:'#DC2626', fixed:true, highlight:false, showInfobox:false });
board.create('text', [3.45,-4.35,'\\color{#DC2626}{\\textbf{A}(3,\\,-4)}'], { fontSize:14, useKatex:true, fixed:true, highlight:false });

}
(function waitForSize(n) {
  var el = document.getElementById('board');
  if (el.clientWidth > 10 && el.clientHeight > 10) { _initSim(); return; }
  if (n > 600) { _initSim(); return; }
  setTimeout(function() { waitForSize(n + 1); }, 50);
})(0);
window.addEventListener('resize', function() {
  var el = document.getElementById('board');
  if (el.clientWidth > 10 && el.clientHeight > 10 && window.board && board.resizeContainer) {
    board.resizeContainer(el.clientWidth, el.clientHeight, true);
  }
});
</script>
</body>
</html>
