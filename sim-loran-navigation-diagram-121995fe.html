<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORAN Navigation Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-18, 98, 78, -18],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 20
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 20
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Distance segments
        board.create('segment', [[0, 0], [0, 80]], {
            strokeColor: '#AAAAAA', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('text', [-7, 40, '80 \\text{ mi}'], {
            fontSize: 12, color: '#666666', useKatex: true, fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'middle'
        });

        board.create('segment', [[0, 0], [60, 0]], {
            strokeColor: '#AAAAAA', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('text', [30, -7, '60 \\text{ mi}'], {
            fontSize: 12, color: '#666666', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle'
        });

        // Transmitter points
        board.create('point', [0, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-4, -5, 'O'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:700; font-style:italic'
        });

        board.create('point', [0, 80], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-5, 83, 'P'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'right',
            cssStyle: 'font-weight:700; font-style:italic'
        });

        board.create('point', [60, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [62, -5, 'R'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:700; font-style:italic'
        });

        // Ship point
        board.create('point', [48, 64], {
            name: '', size: 6, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [51, 66, '\\text{Ship}'], {
            fontSize: 14, color: '#DC2626', useKatex: true, fixed: true, highlight: false
        });

    </script>
</body>
</html>
