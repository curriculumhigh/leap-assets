<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Mosaic — 9 Isosceles Triangles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 320px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 4;
        var N = 9;
        var ANGLE_STEP = 2 * Math.PI / N;
        var HIGHLIGHT_INDEX = 1;
        var START_OFFSET = Math.PI / 2;

        var COL_FILL_NORMAL = '#E5E7EB';
        var COL_FILL_HIGHLIGHT = '#2563EB';
        var COL_BORDER = '#555555';

        // Center point
        var O = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        // Create vertices on the circle
        var vertices = [];
        for (var i = 0; i < N; i++) {
            var ang = START_OFFSET + i * ANGLE_STEP;
            var vx = R * Math.cos(ang);
            var vy = R * Math.sin(ang);
            vertices.push(board.create('point', [vx, vy], {
                name: '', fixed: true, visible: false
            }));
        }

        // Create triangles (polygons from center to two adjacent vertices)
        for (var i = 0; i < N; i++) {
            var j = (i + 1) % N;
            var isHighlighted = (i === HIGHLIGHT_INDEX);
            board.create('polygon', [O, vertices[i], vertices[j]], {
                fillColor: isHighlighted ? COL_FILL_HIGHLIGHT : COL_FILL_NORMAL,
                fillOpacity: isHighlighted ? 0.28 : 0.35,
                borders: {
                    strokeColor: COL_BORDER,
                    strokeWidth: isHighlighted ? 2.0 : 1.5,
                    fixed: true,
                    highlight: false
                },
                vertices: { visible: false },
                hasInnerPoints: false,
                fixed: true,
                highlight: false
            });
        }

        // Circle outline
        board.create('circle', [O, R], {
            strokeColor: COL_BORDER,
            strokeWidth: 2.0,
            fillColor: 'none',
            fixed: true,
            highlight: false
        });

        // Angle arc on the highlighted triangle
        var hA = vertices[HIGHLIGHT_INDEX];
        var hB = vertices[(HIGHLIGHT_INDEX + 1) % N];

        board.create('nonReflexAngle', [hA, O, hB], {
            radius: 0.7,
            fillColor: '#222222',
            fillOpacity: 0.08,
            strokeColor: '#222222',
            strokeWidth: 1.0,
            fixed: true,
            name: '',
            withLabel: false,
            highlight: false
        });

        // 40° label — pre-render with KaTeX, reduced font size
        var angA = START_OFFSET + HIGHLIGHT_INDEX * ANGLE_STEP;
        var angB = START_OFFSET + (HIGHLIGHT_INDEX + 1) * ANGLE_STEP;
        var bisector = (angA + angB) / 2;
        var labelR = 1.25;
        var lblX = labelR * Math.cos(bisector);
        var lblY = labelR * Math.sin(bisector);

        var labelDiv = document.createElement('span');
        labelDiv.style.fontSize = '9px';
        document.body.appendChild(labelDiv);
        katex.render('40^\circ', labelDiv, { throwOnError: false });
        var labelHTML = labelDiv.innerHTML;
        document.body.removeChild(labelDiv);

        board.create('text', [lblX, lblY, function() { return labelHTML; }], {
            fontSize: 9,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false,
            useMathJax: false,
            parse: false
        });
    </script>
</body>
</html>
