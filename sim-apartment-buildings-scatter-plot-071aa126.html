<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Buildings Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 23, 38, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var i;

        // Grid lines
        // Vertical grid lines every 5 from 0 to 35
        for (i = 0; i <= 35; i += 5) {
            board.create('segment', [[i, 0], [i, 20]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        // Horizontal grid lines every 1 from 0 to 20
        for (i = 0; i <= 20; i += 1) {
            board.create('segment', [[0, i], [35, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Axes
        board.create('arrow', [[0, 0], [37, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        board.create('arrow', [[0, 0], [0, 22]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // X-axis ticks and labels
        for (i = 5; i <= 35; i += 5) {
            board.create('segment', [[i, -0.3], [i, 0.3]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [i, -1.2, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Y-axis ticks every 1, labels every 2
        for (i = 1; i <= 20; i += 1) {
            board.create('segment', [[-0.5, i], [0.5, i]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            if (i % 2 === 0) {
                board.create('text', [-2, i, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // Axis labels
        board.create('text', [17.5, -2.5, 'Age (years)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-style: italic;'
        });
        board.create('text', [-4.8, 10, 'Monthly rent (in hundred dollars)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            display: 'html',
            cssStyle: 'font-style: italic; transform: rotate(-90deg); white-space: nowrap;'
        });

        // Title
        board.create('text', [17.5, 21.5, 'Apartment Buildings'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight: bold;'
        });

        // Data points
        var data = [
            [5, 6], [5, 7.5], [10, 8.5], [10, 10], [15, 11],
            [15, 12.5], [20, 14], [25, 15], [25, 16], [30, 19]
        ];

        for (i = 0; i < data.length; i++) {
            board.create('point', [data[i][0], data[i][1]], {
                name: '', size: 4, color: '#2563EB',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
