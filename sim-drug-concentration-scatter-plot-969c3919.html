<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Concentration Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 18, 16.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Manual grid ─────────────────────────────────────────────────
        var MINOR_GRID = '#D1D5DB';
        var MAJOR_GRID = '#B0B0B0';
        var i;

        // Horizontal minor gridlines every 1 unit from 0 to 17
        for (i = 0; i <= 17; i++) {
            var isMajor = (i % 4 === 0);
            board.create('line', [[0, i], [1, i]], {
                strokeColor: isMajor ? MAJOR_GRID : MINOR_GRID,
                strokeWidth: isMajor ? 0.8 : 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false,
                point1: { visible: false },
                point2: { visible: false }
            });
        }

        // Vertical gridlines at each integer n = 1..15
        for (i = 1; i <= 15; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: MINOR_GRID,
                strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false,
                point1: { visible: false },
                point2: { visible: false }
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        board.create('arrow', [[-0.8, 0], [16.2, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        board.create('arrow', [[0, -1.5], [0, 17.8]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // ── X-axis tick marks and labels ────────────────────────────────
        for (i = 1; i <= 15; i++) {
            board.create('segment', [[i, -0.2], [i, 0.2]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            if (i % 2 === 0 || i === 1 || i === 15) {
                board.create('text', [i, -0.7, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // ── Y-axis tick marks and labels (0, 4, 8, 12, 16) ─────────────
        var yTicks = [0, 4, 8, 12, 16];
        for (i = 0; i < yTicks.length; i++) {
            var yv = yTicks[i];
            board.create('segment', [[-0.15, yv], [0.15, yv]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [-0.45, yv, String(yv)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Axis labels (KaTeX) ────────────────────────────────────────
        board.create('text', [15.8, -0.9, 'n'], {
            fontSize: 14, useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [0.4, 17.4, 'C_n\\;\\text{(mg/L)}'], {
            fontSize: 13, useKatex: true, fixed: true, highlight: false
        });

        // ── Dashed horizontal asymptote at y = 16 ──────────────────────
        board.create('segment', [[-0.5, 16], [16.2, 16]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // ── Data points ─────────────────────────────────────────────────
        // Recurrence: C_1 = 4, C_{n+1} = 0.75 * C_n + 4
        // This gives limit L = 4 / (1 - 0.75) = 16
        var data = [];
        var c = 0;
        for (i = 1; i <= 15; i++) {
            c = 0.75 * c + 4;
            data.push([i, c]);
        }

        // Original 8 points — primary color, larger
        for (i = 0; i < 8; i++) {
            board.create('point', data[i], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }

        // Extended points (n = 9–15) — same style, slightly smaller
        for (i = 8; i < data.length; i++) {
            board.create('point', data[i], {
                name: '', size: 3.5, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
