<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle BCEF on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 6.5, 8.5, -5.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.1, -0.4, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 6.1, 'y'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // Points
        var B = board.create('point', [0, 4], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var C = board.create('point', [6, 0], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var E = board.create('point', [4, -3], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });
        var F = board.create('point', [-2, 1], {
            name: '', size: 4, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });

        // Polygon BCEF with shaded interior
        board.create('polygon', [B, C, E, F], {
            fillColor: '#888888',
            fillOpacity: 0.15,
            borders: {
                strokeColor: '#555555',
                strokeWidth: 1.8
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Labels: Name + coordinates, KaTeX rendered
        // B(0, 4) — offset left and up
        board.create('text', [-0.3, 4.6, 'B(0, 4)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // C(6, 0) — offset right and up
        board.create('text', [6.3, 0.5, 'C(6, 0)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // E(4, −3) — offset right and down
        board.create('text', [4.3, -3.5, 'E(4, -3)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });

        // F(−2, 1) — offset slightly left and below
        board.create('text', [-2.1, 0.5, 'F(-2, 1)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
