<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF with Altitude EG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 6.5, 13, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var D = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var F = board.create('point', [10, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var E = board.create('point', [2, 4], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var G = board.create('point', [2, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        board.create('polygon', [D, E, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        board.create('segment', [E, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var RM = 0.45;

        var edx = D.X() - E.X(), edy = D.Y() - E.Y();
        var edLen = Math.sqrt(edx * edx + edy * edy);
        var edux = edx / edLen, eduy = edy / edLen;

        var efx = F.X() - E.X(), efy = F.Y() - E.Y();
        var efLen = Math.sqrt(efx * efx + efy * efy);
        var efux = efx / efLen, efuy = efy / efLen;

        var eCorner1 = [E.X() + RM * edux, E.Y() + RM * eduy];
        var eDiag = [E.X() + RM * (edux + efux), E.Y() + RM * (eduy + efuy)];
        var eCorner2 = [E.X() + RM * efux, E.Y() + RM * efuy];

        board.create('segment', [eCorner1, eDiag], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [eDiag, eCorner2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        var geux = 0, geuy = 1;
        var gdux = -1, gduy = 0;

        var gCorner1 = [G.X() + RM * geux, G.Y() + RM * geuy];
        var gDiag = [G.X() + RM * (geux + gdux), G.Y() + RM * (geuy + gduy)];
        var gCorner2 = [G.X() + RM * gdux, G.Y() + RM * gduy];

        board.create('segment', [gCorner1, gDiag], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [gDiag, gCorner2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('text', [-0.5, -0.6, 'D'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [1.5, 4.7, 'E'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [10.3, -0.6, 'F'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [1.7, -0.75, 'G'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });

        board.create('text', [0.7, -1.5, '8'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', cssStyle: 'font-weight:600;'
        });

        board.create('text', [6, -1.5, '32'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', cssStyle: 'font-weight:600;'
        });

        board.create('text', [2.8, 2.0, 'x'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            useKatex: true, cssStyle: 'font-weight:600;'
        });
    </script>
</body>
</html>
