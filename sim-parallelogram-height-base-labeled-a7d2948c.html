<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallelogram with Height and Base</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 5.5, 9, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Parallelogram vertices
        var A = board.create('point', [1, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [7, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [5.5, 3.5], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [-0.5, 3.5], { visible: false, fixed: true, name: '' });

        // Parallelogram outline
        var para = board.create('polygon', [A, B, C, D], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true,
            hasInnerPoints: false
        });

        // Height line (dashed) — vertical from top edge down to base
        var hTop = board.create('point', [3.5, 3.5], { visible: false, fixed: true, name: '' });
        var hBot = board.create('point', [3.5, 0], { visible: false, fixed: true, name: '' });

        var heightLine = board.create('segment', [hTop, hBot], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Right-angle marker at base of height line
        var markerSize = 0.35;
        var raPt1 = board.create('point', [3.5 + markerSize, 0], { visible: false, fixed: true, name: '' });
        var raPt2 = board.create('point', [3.5 + markerSize, markerSize], { visible: false, fixed: true, name: '' });
        var raPt3 = board.create('point', [3.5, markerSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [raPt1, raPt2], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [raPt2, raPt3], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Label: height "x"
        board.create('text', [2.9, 1.75, 'x'], {
            useKatex: true,
            fontSize: 15,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // Label: base "x + 4"
        board.create('text', [4, -0.7, 'x + 4'], {
            useKatex: true,
            fontSize: 15,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
