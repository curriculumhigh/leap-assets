<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Externally Tangent Circles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 12, 28, -12],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [27.4, -0.7, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 11.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        var COL_CIRCLE = '#555555';
        var COL_CENTER = '#222222';
        var COL_ATTENTION = '#DC2626';
        var COL_DIM = '#3B82F6';

        // ── Circles ─────────────────────────────────────────────────────
        board.create('circle', [[0, 0], 5], {
            strokeColor: COL_CIRCLE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });
        board.create('circle', [[12, 0], 7], {
            strokeColor: COL_CIRCLE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });
        board.create('circle', [[22, 0], 3], {
            strokeColor: COL_CIRCLE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // ── Centers ─────────────────────────────────────────────────────
        board.create('point', [0, 0], {
            name: '', size: 2, color: COL_CENTER, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [12, 0], {
            name: '', size: 2, color: COL_CENTER, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [22, 0], {
            name: '', size: 2, color: COL_CENTER, fixed: true, highlight: false, showInfobox: false
        });

        // Center labels — above circles
        board.create('text', [0, 6.0, 'P'], {
            fontSize: 14, color: COL_CENTER, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold; font-style:italic;'
        });
        board.create('text', [12, 8.0, 'Q'], {
            fontSize: 14, color: COL_CENTER, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold; font-style:italic;'
        });
        board.create('text', [22, 4.0, 'R'], {
            fontSize: 14, color: COL_CENTER, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold; font-style:italic;'
        });

        // ── Tangent points (where circles touch) ───────────────────────
        board.create('point', [5, 0], {
            name: '', size: 2, color: COL_CENTER, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [19, 0], {
            name: '', size: 2, color: COL_CENTER, fixed: true, highlight: false, showInfobox: false
        });

        // ── Diameter segments (horizontal, through each center) ─────────
        board.create('segment', [[-5, 0], [5, 0]], {
            strokeColor: COL_DIM, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[5, 0], [19, 0]], {
            strokeColor: COL_DIM, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[19, 0], [25, 0]], {
            strokeColor: COL_DIM, strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Diameter dimension labels ───────────────────────────────────
        board.create('text', [0, 1.6, '10 \\text{ in.}'], {
            fontSize: 12, color: COL_DIM, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true,
            cssStyle: 'font-weight:bold;'
        });
        board.create('text', [12, 1.6, '14 \\text{ in.}'], {
            fontSize: 12, color: COL_DIM, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true,
            cssStyle: 'font-weight:bold;'
        });
        board.create('text', [22, 1.6, '6 \\text{ in.}'], {
            fontSize: 12, color: COL_DIM, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true,
            cssStyle: 'font-weight:bold;'
        });

        // ── Small tick marks at diameter endpoints ──────────────────────
        var tickLen = 0.5;
        var diameterEndpoints = [-5, 5, 19, 25];
        for (var i = 0; i < diameterEndpoints.length; i++) {
            board.create('segment', [[diameterEndpoints[i], -tickLen], [diameterEndpoints[i], tickLen]], {
                strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false
            });
        }
        // Center ticks
        board.create('segment', [[0, -tickLen], [0, tickLen]], {
            strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false, layer: 5
        });
        board.create('segment', [[12, -tickLen], [12, tickLen]], {
            strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false, layer: 5
        });
        board.create('segment', [[22, -tickLen], [22, tickLen]], {
            strokeColor: COL_DIM, strokeWidth: 1.0, fixed: true, highlight: false, layer: 5
        });

        // ── Points S and T (attention points) ──────────────────────────
        board.create('point', [-5, 0], {
            name: '', size: 4, color: COL_ATTENTION, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [25, 0], {
            name: '', size: 4, color: COL_ATTENTION, fixed: true, highlight: false, showInfobox: false
        });

        // S label
        board.create('text', [-5, -1.5, 'S'], {
            fontSize: 14, color: COL_ATTENTION, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold; font-style:italic;'
        });
        // T label
        board.create('text', [25, -1.5, 'T'], {
            fontSize: 14, color: COL_ATTENTION, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold; font-style:italic;'
        });

    </script>
</body>
</html>
