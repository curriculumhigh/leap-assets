<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph C — Parabola and Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 8, 6, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.35, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.15, 7.6, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Parabola: y = x^2 - 4x + 5
        board.create('functiongraph', [
            function(x) { return x * x - 4 * x + 5; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Line: y = x - 1
        board.create('functiongraph', [
            function(x) { return x - 1; }
        ], { strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false });

        // Intersection points
        board.create('point', [2, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [3, 2], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Function labels — name only
        board.create('text', [4.6, 5.2, 'f(x)'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [5.0, 3.5, 'g(x)'], {
            useKatex: true, fontSize: 11, color: '#2563EB', fixed: true, highlight: false
        });
    </script>
</body>
</html>
