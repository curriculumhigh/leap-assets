<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diagram — B subset of A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 4, 5.5, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Universal set rectangle S
        var p1 = board.create('point', [-4.5, 3.2], { visible: false, fixed: true, name: '' });
        var p2 = board.create('point', [4.5, 3.2], { visible: false, fixed: true, name: '' });
        var p3 = board.create('point', [4.5, -3.2], { visible: false, fixed: true, name: '' });
        var p4 = board.create('point', [-4.5, -3.2], { visible: false, fixed: true, name: '' });
        board.create('polygon', [p1, p2, p3, p4], {
            fillColor: '#f9fafb',
            fillOpacity: 1,
            borders: { strokeColor: '#444444', strokeWidth: 1.5 },
            vertices: { visible: false },
            fixed: true,
            highlight: false
        });

        // S label — top-left corner
        board.create('text', [-4.1, 2.8, '<b>S</b>'], {
            fontSize: 16,
            color: '#444444',
            fixed: true,
            highlight: false
        });

        // Circle A — larger, centered slightly left
        var centerA = board.create('point', [-0.3, 0], { visible: false, fixed: true, name: '' });
        var circleA = board.create('circle', [centerA, 2.5], {
            strokeColor: '#555555',
            strokeWidth: 2.0,
            fillColor: '#2563EB',
            fillOpacity: 0.10,
            fixed: true,
            highlight: false
        });

        // Circle B — smaller, entirely inside A
        var centerB = board.create('point', [0.4, -0.1], { visible: false, fixed: true, name: '' });
        var circleB = board.create('circle', [centerB, 1.2], {
            strokeColor: '#555555',
            strokeWidth: 2.0,
            fillColor: '#059669',
            fillOpacity: 0.15,
            fixed: true,
            highlight: false
        });

        // Label A — top-left area of circle A, inside but away from B
        board.create('text', [-2.0, 1.6, '<b>A</b>'], {
            fontSize: 18,
            color: '#2563EB',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Label B — center of circle B
        board.create('text', [0.4, -0.1, '<b>B</b>'], {
            fontSize: 16,
            color: '#059669',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });
    </script>
</body>
</html>
