<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polar Grid</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.container { height: calc(100% - 12px); padding: 6px; max-width: 500px; margin: 0; }
.board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
#board { height: 100%; width: 100%; }
</style>
</head>
<body>
<div class="container">
<div class="board-wrapper">
<div id="board"></div>
</div>
</div>
<script>
function _initSim() {
window.board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-8.5, 8.5, 8.5, -8.5],
    axis: false,
    showCopyright: false,
    showNavigation: false,
    keepAspectRatio: true,
    pan: { enabled: false },
    zoom: { enabled: false }
});

// Concentric circles
for (var r = 1; r <= 6; r++) {
    board.create('circle', [[0, 0], r], {
        strokeColor: '#C5CAD1', strokeWidth: 1, fixed: true, highlight: false
    });
}

// Radial lines at every pi/12 (except 0, handled by polar axis)
var radialAngles = [];
for (var i = 1; i < 24; i++) {
    radialAngles.push(i * Math.PI / 12);
}
radialAngles.forEach(function(a) {
    board.create('segment', [[0, 0], [6 * Math.cos(a), 6 * Math.sin(a)]], {
        strokeColor: '#C5CAD1', strokeWidth: 1, fixed: true, highlight: false
    });
});

// Polar axis — darkened, with arrowhead
board.create('arrow', [[0, 0], [6.9, 0]], {
    strokeColor: '#222222', strokeWidth: 2.2, fixed: true, highlight: false,
    lastArrow: { type: 2, size: 6 }
});

// Tick marks on polar axis
for (var t = 1; t <= 6; t++) {
    board.create('segment', [[t, -0.13], [t, 0.13]], {
        strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
    });
}

// Pole point labeled "O"
board.create('point', [0, 0], {
    name: '', size: 2.5, color: '#222222', fixed: true, highlight: false, showInfobox: false
});
board.create('text', [-0.55, -0.55, 'O'], {
    fontSize: 14, color: '#222222', useKatex: false,
    cssStyle: 'font-style:italic; font-weight:600',
    anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
});

// Radius number labels
[1, 2, 3, 4, 5, 6].forEach(function(t) {
    board.create('text', [t, -0.48, String(t)], {
        fontSize: 11, color: '#555555', anchorX: 'middle', fixed: true, highlight: false
    });
});

// "0" and "2pi" labels at polar axis end
board.create('text', [7.25, 0.5, '0'], {
    fontSize: 13, color: '#374151', useKatex: true,
    anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
});
board.create('text', [7.25, -0.55, '2\\pi'], {
    fontSize: 13, color: '#374151', useKatex: true,
    anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
});

// "Polar axis" caption — above the axis with white background
board.create('text', [5.2, 0.7, 'Polar axis'], {
    fontSize: 12, color: '#222222',
    cssStyle: 'font-style:italic; background:rgba(255,255,255,0.85); padding:1px 4px; border-radius:3px;',
    anchorX: 'middle', anchorY: 'bottom', fixed: true, highlight: false
});

// Angle labels (pi/6 family)
var angleLabels = [
    [Math.PI / 6, '\\pi/6'],
    [Math.PI / 3, '\\pi/3'],
    [Math.PI / 2, '\\pi/2'],
    [2 * Math.PI / 3, '2\\pi/3'],
    [5 * Math.PI / 6, '5\\pi/6'],
    [Math.PI, '\\pi'],
    [7 * Math.PI / 6, '7\\pi/6'],
    [4 * Math.PI / 3, '4\\pi/3'],
    [3 * Math.PI / 2, '3\\pi/2'],
    [5 * Math.PI / 3, '5\\pi/3'],
    [11 * Math.PI / 6, '11\\pi/6']
];

var labelRadius = 7.1;
angleLabels.forEach(function(item) {
    var a = item[0];
    var txt = item[1];
    var x = labelRadius * Math.cos(a);
    var y = labelRadius * Math.sin(a);
    board.create('text', [x, y, txt], {
        fontSize: 13, color: '#374151', useKatex: true,
        anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
    });
});
}

(function waitForSize(n) {
    var el = document.getElementById('board');
    if (el.clientWidth > 10 && el.clientHeight > 10) { _initSim(); return; }
    if (n > 600) { _initSim(); return; }
    setTimeout(function() { waitForSize(n + 1); }, 50);
})(0);

window.addEventListener('resize', function() {
    var el = document.getElementById('board');
    if (el.clientWidth > 10 && el.clientHeight > 10 && window.board && board.resizeContainer) {
        board.resizeContainer(el.clientWidth, el.clientHeight, true);
    }
});
</script>
</body>
</html>
