<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Path Geometry — Angles of Depression</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var MP = 3.4;
        var angM = 28 * Math.PI / 180;
        var angP = 56 * Math.PI / 180;

        var Mx = 0, My = 0;
        var Px = MP, Py = 0;
        var Nx = MP + 2.0, Ny = 0;

        var t = MP * Math.sin(angP) / Math.sin(angP - angM);
        var Tx = Mx + t * Math.cos(angM);
        var Ty = My - t * Math.sin(angM);

        var padLeft = 1.5;
        var padRight = 1.5;
        var padTop = 2.5;
        var padBot = 1.0;

        var xMin = Math.min(Mx, Tx) - padLeft;
        var xMax = Math.max(Nx, Tx) + padRight;
        var yMin = Ty - padBot;
        var yMax = My + padTop;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [xMin, yMax, xMax, yMin],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Flight path line (extends beyond M and N) ───────────────────
        var pathExtLeft = -1.2;
        var pathExtRight = Nx + 0.8;

        board.create('segment', [[pathExtLeft, 0], [pathExtRight, 0]], {
            strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 },
            firstArrow: { type: 2, size: 5 }
        });

        // ── Points M, P, N, T ───────────────────────────────────────────
        var M = board.create('point', [Mx, My], {
            name: 'M', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-12, 10] }
        });

        var P = board.create('point', [Px, Py], {
            name: 'P', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 10] }
        });

        var N = board.create('point', [Nx, Ny], {
            name: 'N', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [6, 10] }
        });

        var T = board.create('point', [Tx, Ty], {
            name: 'T', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });

        // ── Segments MT and PT (solid) ──────────────────────────────────
        board.create('segment', [M, T], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [P, T], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Angle arcs ──────────────────────────────────────────────────
        var arcM = board.create('nonReflexAngle', [T, M, N], {
            radius: 0.7,
            fillColor: '#2563EB', fillOpacity: 0.1,
            strokeColor: '#2563EB', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        var arcP = board.create('nonReflexAngle', [T, P, N], {
            radius: 0.6,
            fillColor: '#059669', fillOpacity: 0.1,
            strokeColor: '#059669', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // ── Angle labels ────────────────────────────────────────────────
        var bisM = (-angM) / 2;
        var lblMx = Mx + 1.1 * Math.cos(bisM);
        var lblMy = My + 1.1 * Math.sin(bisM);

        board.create('text', [lblMx, lblMy, '28^\\circ'], {
            useKatex: true, fontSize: 12, color: '#2563EB',
            anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        var bisP = (-angP) / 2;
        var lblPx = Px + 1.0 * Math.cos(bisP);
        var lblPy = Py + 1.0 * Math.sin(bisP);

        board.create('text', [lblPx, lblPy, '56^\\circ'], {
            useKatex: true, fontSize: 12, color: '#059669',
            anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // ── Dimension: MP = 3.4 km ─────────────────────────────────────
        var dimLineY = 0.8;
        var dimTextY = 1.3;

        // Horizontal dimension line with end ticks
        board.create('segment', [[Mx, dimLineY], [Px, dimLineY]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[Mx, dimLineY - 0.15], [Mx, dimLineY + 0.15]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[Px, dimLineY - 0.15], [Px, dimLineY + 0.15]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // Text label above the dimension line
        board.create('text', [Mx + MP / 2, dimTextY, '3.4 \\text{ km}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
    </script>
</body>
</html>
