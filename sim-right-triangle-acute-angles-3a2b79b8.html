<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle with Acute Angles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 9.5, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [8, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [0, 5.5], { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('segment', [A, B], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [C, A], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // Right angle mark at A (square corner)
        var markSize = 0.55;
        var rP1 = board.create('point', [markSize, 0], { visible: false, fixed: true, name: '' });
        var rP2 = board.create('point', [markSize, markSize], { visible: false, fixed: true, name: '' });
        var rP3 = board.create('point', [0, markSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [rP1, rP2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [rP2, rP3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Angle label: x° at B (bottom-right acute angle)
        var angB = Math.atan2(C.Y() - B.Y(), C.X() - B.X());
        var angBbase = Math.PI;
        var bisB = (angB + angBbase) / 2;
        var labelDistB = 1.4;
        board.create('text', [
            B.X() + labelDistB * Math.cos(bisB),
            B.Y() + labelDistB * Math.sin(bisB),
            'x^\\circ'
        ], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Angle label: y° at C (top acute angle)
        var angCA = Math.atan2(A.Y() - C.Y(), A.X() - C.X());
        var angCB = Math.atan2(B.Y() - C.Y(), B.X() - C.X());
        var bisC = (angCA + angCB) / 2;
        var labelDistC = 1.4;
        board.create('text', [
            C.X() + labelDistC * Math.cos(bisC),
            C.Y() + labelDistC * Math.sin(bisC),
            'y^\\circ'
        ], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
