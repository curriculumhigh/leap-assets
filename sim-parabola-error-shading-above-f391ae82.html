<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y = -x² + 4x - 1 (Error Shading)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var xMin = -2, xMax = 6, yMin = -2.5, yMax = 5.5;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [xMin, yMax, xMax, yMin],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [xMax - 0.4, -0.35, '<i>x</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.2, yMax - 0.3, '<i>y</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        // ── Parabola function ───────────────────────────────────────────
        function f(x) {
            return -x * x + 4 * x - 1;
        }

        // ── Shaded region: ABOVE the parabola (the deliberate error) ────
        var shadePtsX = [];
        var shadePtsY = [];
        var numSteps = 200;
        var dx = (xMax - xMin) / numSteps;

        for (var i = 0; i <= numSteps; i++) {
            var xi = xMin + i * dx;
            shadePtsX.push(xi);
            shadePtsY.push(f(xi));
        }

        // Close the polygon by going to the top-right, then top-left
        shadePtsX.push(xMax);
        shadePtsY.push(yMax);
        shadePtsX.push(xMin);
        shadePtsY.push(yMax);

        // Create invisible points for the polygon
        var shadePoints = [];
        for (var j = 0; j < shadePtsX.length; j++) {
            shadePoints.push(
                board.create('point', [shadePtsX[j], shadePtsY[j]], {
                    visible: false, fixed: true, name: ''
                })
            );
        }

        board.create('polygon', shadePoints, {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // ── Parabola curve (solid — on top of shading) ──────────────────
        board.create('functiongraph', [f, xMin, xMax], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Key points ──────────────────────────────────────────────────
        // Vertex (2, 3)
        board.create('point', [2, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Vertex label
        board.create('text', [2.25, 3.35, '(2,\\, 3)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        // x-intercepts: 2 - sqrt(3) ≈ 0.268, 2 + sqrt(3) ≈ 3.732
        var xInt1 = 2 - Math.sqrt(3);
        var xInt2 = 2 + Math.sqrt(3);

        board.create('point', [xInt1, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [xInt2, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // x-intercept labels
        board.create('text', [xInt1 - 0.15, -0.55, '(2\\!-\\!\\sqrt{3},\\, 0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });
        board.create('text', [xInt2 + 0.15, -0.55, '(2\\!+\\!\\sqrt{3},\\, 0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        // ── Function label (name only) ──────────────────────────────────
        board.create('text', [-0.8, f(-0.8) + 0.45, 'f(x)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
