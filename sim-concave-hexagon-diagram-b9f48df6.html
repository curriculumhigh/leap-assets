<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concave Hexagon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 5.5, 7, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [0, 3], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [3.5, 4], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [5.5, 1.5], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [2.8, 1.2], { visible: false, fixed: true, name: '' });
        var E = board.create('point', [4.5, -2.5], { visible: false, fixed: true, name: '' });
        var F = board.create('point', [0.5, -1.5], { visible: false, fixed: true, name: '' });

        board.create('polygon', [A, B, C, D, E, F], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#555555',
                strokeWidth: 2.0,
                fixed: true,
                highlight: false
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
