<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle LMN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 12.3, 23.5, -3.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var Lx = 0, Ly = 0;
        var Nx = 20, Ny = 0;
        var Mx = 7.39, My = 8.81;

        var L = board.create('point', [Lx, Ly], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var M = board.create('point', [Mx, My], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var N = board.create('point', [Nx, Ny], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Edges (no fill polygon) ─────────────────────────────────────
        board.create('polygon', [L, M, N], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Angle arcs (red, nonReflexAngle) ────────────────────────────
        board.create('nonReflexAngle', [N, L, M], {
            radius: 1.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [L, M, N], {
            radius: 1.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [M, N, L], {
            radius: 1.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // ── Helper: bisector direction from vertex ──────────────────────
        function bisectorOffset(vx, vy, ax, ay, bx, by, dist) {
            var dax = ax - vx, day = ay - vy;
            var dbx = bx - vx, dby = by - vy;
            var la = Math.sqrt(dax * dax + day * day);
            var lb = Math.sqrt(dbx * dbx + dby * dby);
            var ux = dax / la + dbx / lb;
            var uy = day / la + dby / lb;
            var lu = Math.sqrt(ux * ux + uy * uy);
            if (lu < 0.001) { ux = 0; uy = 1; lu = 1; }
            return [vx + dist * ux / lu, vy + dist * uy / lu];
        }

        // ── Angle labels (red, along bisector) ─────────────────────────
        var labelL_pos = bisectorOffset(Lx, Ly, Nx, Ny, Mx, My, 2.8);
        board.create('text', [labelL_pos[0], labelL_pos[1], '50\u00B0'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#DC2626', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        var labelM_pos = bisectorOffset(Mx, My, Lx, Ly, Nx, Ny, 2.2);
        board.create('text', [labelM_pos[0], labelM_pos[1], '95\u00B0'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#DC2626', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        var labelN_pos = bisectorOffset(Nx, Ny, Mx, My, Lx, Ly, 2.5);
        board.create('text', [labelN_pos[0], labelN_pos[1], '35\u00B0'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#DC2626', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        // ── Helper: outward perpendicular offset from side midpoint ─────
        function sideLabel(ax, ay, bx, by, label, offset, centerX, centerY) {
            var mx = (ax + bx) / 2;
            var my = (ay + by) / 2;
            var dx = bx - ax, dy = by - ay;
            var len = Math.sqrt(dx * dx + dy * dy);
            var nx = -dy / len, ny = dx / len;
            var testX = mx + nx;
            var testY = my + ny;
            var d1 = (testX - centerX) * (testX - centerX) + (testY - centerY) * (testY - centerY);
            var testX2 = mx - nx;
            var testY2 = my - ny;
            var d2 = (testX2 - centerX) * (testX2 - centerX) + (testY2 - centerY) * (testY2 - centerY);
            if (d2 > d1) { nx = -nx; ny = -ny; }
            return [mx + offset * nx, my + offset * ny];
        }

        var cx = (Lx + Mx + Nx) / 3;
        var cy = (Ly + My + Ny) / 3;

        // ── Side labels (blue, bold) ────────────────────────────────────
        var lblLM = sideLabel(Lx, Ly, Mx, My, '11.5', 1.2, cx, cy);
        board.create('text', [lblLM[0], lblLM[1], '11.5'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#3B82F6', cssStyle: 'font-weight:700',
            fixed: true, highlight: false
        });

        var lblMN = sideLabel(Mx, My, Nx, Ny, '15.4', 1.2, cx, cy);
        board.create('text', [lblMN[0], lblMN[1], '15.4'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#3B82F6', cssStyle: 'font-weight:700',
            fixed: true, highlight: false
        });

        var lblLN = sideLabel(Lx, Ly, Nx, Ny, '20', 1.2, cx, cy);
        board.create('text', [lblLN[0], lblLN[1], '20'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#3B82F6', cssStyle: 'font-weight:700',
            fixed: true, highlight: false
        });

        // ── Vertex labels (bold black) ──────────────────────────────────
        board.create('text', [Lx - 1.0, Ly - 1.0, '<b>L</b>'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });

        board.create('text', [Mx, My + 1.2, '<b>M</b>'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });

        board.create('text', [Nx + 1.0, Ny - 1.0, '<b>N</b>'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
