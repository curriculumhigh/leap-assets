<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral EFGH with Diagonal EG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 8.5, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices (general convex quadrilateral, not a parallelogram) ──
        var E = board.create('point', [1.0, 5.0], {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, 6] }
        });
        var F = board.create('point', [6.0, 5.5], {
            name: 'F', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 6] }
        });
        var G = board.create('point', [7.0, 1.0], {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -12] }
        });
        var H = board.create('point', [1.5, 0.5], {
            name: 'H', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -12] }
        });

        // ── Quadrilateral edges ───────────────────────────────────────────
        board.create('segment', [E, F], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [F, G], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [G, H], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [H, E], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Diagonal EG ──────────────────────────────────────────────────
        board.create('segment', [E, G], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Congruence tick marks ────────────────────────────────────────
        function drawTicks(p1, p2, n, color) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var ux = dx / len;
            var uy = dy / len;
            var px = -uy;
            var py = ux;
            var tickHalf = 0.25;
            var gap = 0.18;

            for (var i = 0; i < n; i++) {
                var offset = (i - (n - 1) / 2) * gap;
                var cx = mx + offset * ux;
                var cy = my + offset * uy;
                board.create('segment', [
                    [cx - tickHalf * px, cy - tickHalf * py],
                    [cx + tickHalf * px, cy + tickHalf * py]
                ], {
                    strokeColor: color, strokeWidth: 1.8,
                    fixed: true, highlight: false
                });
            }
        }

        var MARK_COL = '#DC2626';

        // FG ≅ HE — double tick only
        drawTicks(F, G, 2, MARK_COL);
        drawTicks(H, E, 2, MARK_COL);

        // ── Angle arcs: ∠FEG and ∠HGE ──────────────────────────────────
        board.create('nonReflexAngle', [F, E, G], {
            radius: 0.6,
            strokeColor: MARK_COL, strokeWidth: 1.5,
            fillColor: MARK_COL, fillOpacity: 0.06,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [H, G, E], {
            radius: 0.6,
            strokeColor: MARK_COL, strokeWidth: 1.5,
            fillColor: MARK_COL, fillOpacity: 0.06,
            fixed: true, name: '', withLabel: false
        });
    </script>
</body>
</html>
