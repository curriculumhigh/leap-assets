<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Inequality Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 6, 5, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.6, -0.4, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.2, 5.6, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

        // Parabola function: y = -x^2 + 2x + 3
        function f(x) {
            return -x * x + 2 * x + 3;
        }

        // Shaded region below the parabola
        var xMin = -3, xMax = 5, yMin = -4;
        var shadeCurve = board.create('curve', [[], []], {
            strokeWidth: 0,
            fillColor: '#222222',
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        var xData = [];
        var yData = [];
        var steps = 100;

        // Trace parabola left to right
        for (var i = 0; i <= steps; i++) {
            var x = xMin + (xMax - xMin) * i / steps;
            xData.push(x);
            yData.push(f(x));
        }
        // Close along the bottom of bounding box
        xData.push(xMax);
        yData.push(yMin);
        xData.push(xMin);
        yData.push(yMin);
        // Close back to start
        xData.push(xMin);
        yData.push(f(xMin));

        shadeCurve.dataX = xData;
        shadeCurve.dataY = yData;

        // Dashed boundary curve (strict inequality: y < f(x))
        board.create('functiongraph', [f, xMin, xMax], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            dash: 2,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
