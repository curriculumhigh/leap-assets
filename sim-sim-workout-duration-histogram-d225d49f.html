<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Duration Histogram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 23, 55, -5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid: y-lines every 2, x-lines every 5 ──────────────────────
        var i;
        for (i = 2; i <= 20; i += 2) {
            board.create('segment', [[0, i], [50, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 5; i <= 50; i += 5) {
            board.create('segment', [[i, 0], [i, 20]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Axes ─────────────────────────────────────────────────────────
        // x-axis
        board.create('arrow', [[0, 0], [53, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        // y-axis
        board.create('arrow', [[0, 0], [0, 22]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // x-axis ticks and labels (data values: 0, 10, 20, ... 100)
        for (i = 0; i <= 50; i += 5) {
            board.create('segment', [[i, -0.3], [i, 0.3]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [i, -1.3, String(i * 2)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // y-axis ticks and labels
        for (i = 2; i <= 20; i += 2) {
            board.create('segment', [[-0.6, i], [0.6, i]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [-2.2, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Axis title labels ────────────────────────────────────────────
        board.create('text', [25, -3.5, 'Workout Duration (minutes)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600'
        });
        board.create('text', [-5.5, 10, 'Number of Members'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600; writing-mode:vertical-rl; transform:rotate(180deg);'
        });

        // ── Bars ─────────────────────────────────────────────────────────
        var heights = [2, 12, 18, 14, 8, 3, 1, 0, 1, 1];
        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#2563EB';
        var BAR_WIDTH = 5;

        for (i = 0; i < heights.length; i++) {
            var h = heights[i];
            if (h === 0) continue; // skip 0-height bar

            var x0 = i * BAR_WIDTH;
            var x1 = x0 + BAR_WIDTH;

            // Bar as polygon
            var p1 = board.create('point', [x0, 0], { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [x1, 0], { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [x1, h], { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [x0, h], { visible: false, fixed: true, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.45,
                borders: { strokeColor: BAR_STROKE, strokeWidth: 1.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Height label above bar
            board.create('text', [x0 + BAR_WIDTH / 2, h + 0.7, String(h)], {
                fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'bottom',
                fixed: true, highlight: false, cssStyle: 'font-weight:700'
            });
        }
    </script>
</body>
</html>
