<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 6, 3, -4],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                gridX: 1,
                gridY: 1
            }
        });

        // Axis labels
        board.create('text', [4.25, 0.5, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.2, 5.6, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

        // Functions
        function f1(x) { return 3 * x * x - 3; }
        function f2(x) { return -2 * x * x + 4; }

        // Intersection x-values: 3x^2-3 = -2x^2+4 -> 5x^2=7 -> x = +/-sqrt(7/5)
        var xInt = Math.sqrt(7 / 5);

        var xMin = -3, xMax = 3, yBot = -4, yTop = 6;
        var nPts = 80;

        // --- Shading: region above parabola 1 (y >= 3x^2-3) ---
        var shadingAbovePoints = [];
        for (var j = 0; j <= nPts; j++) {
            var x = xMin + (xMax - xMin) * j / nPts;
            var y = Math.max(f1(x), yBot);
            shadingAbovePoints.push([x, Math.min(y, yTop)]);
        }
        shadingAbovePoints.push([xMax, yTop]);
        shadingAbovePoints.push([xMin, yTop]);

        board.create('polygon', shadingAbovePoints, {
            fillColor: '#222222', fillOpacity: 0.08,
            borders: { visible: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // --- Shading: region below parabola 2 (y < -2x^2+4) ---
        var shadingBelowPoints = [];
        for (var j = 0; j <= nPts; j++) {
            var x = xMin + (xMax - xMin) * j / nPts;
            var y = Math.min(f2(x), yTop);
            shadingBelowPoints.push([x, Math.max(y, yBot)]);
        }
        shadingBelowPoints.push([xMax, yBot]);
        shadingBelowPoints.push([xMin, yBot]);

        board.create('polygon', shadingBelowPoints, {
            fillColor: '#2563EB', fillOpacity: 0.08,
            borders: { visible: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // --- Overlap region: where 3x^2-3 <= y <= -2x^2+4 ---
        var overlapPoints = [];
        var nOv = 60;

        for (var j = 0; j <= nOv; j++) {
            var x = -xInt + (2 * xInt) * j / nOv;
            overlapPoints.push([x, f1(x)]);
        }
        for (var j = 0; j <= nOv; j++) {
            var x = xInt - (2 * xInt) * j / nOv;
            overlapPoints.push([x, f2(x)]);
        }

        board.create('polygon', overlapPoints, {
            fillColor: '#7C3AED', fillOpacity: 0.22,
            borders: { visible: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // --- Parabola 1: y = 3x^2 - 3 (solid, >=) ---
        board.create('functiongraph', [f1, -3, 3], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // --- Parabola 2: y = -2x^2 + 4 (dashed, <) ---
        board.create('functiongraph', [f2, -3, 3], {
            strokeColor: '#2563EB', strokeWidth: 1.5,
            dash: 2,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
