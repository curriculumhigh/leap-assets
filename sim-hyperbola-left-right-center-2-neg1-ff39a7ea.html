<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbola — Center (2, −1)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 8, 9, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { visible: false }
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { visible: false }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Hyperbola parameters
        var h = 2, k = -1, a = 3, b = 4;
        var slope = b / a;

        // Asymptotes (cyan, dashed)
        board.create('functiongraph', [
            function(x) { return k + slope * (x - h); }
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        board.create('functiongraph', [
            function(x) { return k - slope * (x - h); }
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // Right branch
        board.create('curve', [
            function(t) { return h + a * Math.cosh(t); },
            function(t) { return k + b * Math.sinh(t); },
            -3, 3
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Left branch
        board.create('curve', [
            function(t) { return h - a * Math.cosh(t); },
            function(t) { return k + b * Math.sinh(t); },
            -3, 3
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Center (2, −1)
        board.create('point', [h, k], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Vertex (5, −1)
        board.create('point', [h + a, k], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Vertex (−1, −1)
        board.create('point', [h - a, k], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
