<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line with Points A, B, C, D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-11.5, 2.5, 11.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Number line (horizontal segment with double arrow) ──────────
        board.create('arrow', [[-10.5, 0], [10.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // ── Tick marks and labels at every integer ──────────────────────
        var i;
        for (i = -10; i <= 10; i++) {
            // Taller tick marks (±0.12)
            board.create('segment', [[i, -0.12], [i, 0.12]], {
                strokeColor: '#444444',
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            // Tick label further below
            board.create('text', [i, -0.45, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 11,
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // ── Points and labels ───────────────────────────────────────────
        var points = [
            { name: 'A', x: -6, color: '#222222' },
            { name: 'B', x: -2, color: '#2563EB' },
            { name: 'C', x: 3,  color: '#059669' },
            { name: 'D', x: 7,  color: '#D97706' }
        ];

        for (i = 0; i < points.length; i++) {
            var p = points[i];

            // Point on the number line
            board.create('point', [p.x, 0], {
                name: '',
                size: 5,
                color: p.color,
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            // Label further above the point (KaTeX)
            board.create('text', [p.x, 0.55, p.name], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 15,
                color: p.color,
                useKatex: true,
                cssStyle: 'font-weight:bold',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
