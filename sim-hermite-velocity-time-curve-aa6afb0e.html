<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity-Time Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // Hermite cubic interpolation between two knots
        function hermite(t, t0, v0, d0, t1, v1, d1) {
            var h = t1 - t0;
            var s = (t - t0) / h;
            var s2 = s * s;
            var s3 = s2 * s;
            var h00 = 2 * s3 - 3 * s2 + 1;
            var h10 = s3 - 2 * s2 + s;
            var h01 = -2 * s3 + 3 * s2;
            var h11 = s3 - s2;
            return h00 * v0 + h10 * h * d0 + h01 * v1 + h11 * h * d1;
        }

        // Knots: (t, v, dv)
        var knots = [
            { t: 0,   v: 0,    dv: 4 },
            { t: 3,   v: 8,    dv: 0 },
            { t: 7,   v: 0,    dv: -4 },
            { t: 8.5, v: -4,   dv: 0 },
            { t: 10,  v: -0.5, dv: 2 }
        ];

        function vCurve(t) {
            if (t <= knots[0].t) return knots[0].v;
            if (t >= knots[knots.length - 1].t) return knots[knots.length - 1].v;
            for (var i = 0; i < knots.length - 1; i++) {
                if (t >= knots[i].t && t <= knots[i + 1].t) {
                    return hermite(t, knots[i].t, knots[i].v, knots[i].dv,
                                       knots[i + 1].t, knots[i + 1].v, knots[i + 1].dv);
                }
            }
            return 0;
        }

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 10, 11, -6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels — t (horizontal), v (vertical)
        board.create('text', [10.5, -0.5, 't'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 9.5, 'v'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // ── Blue shaded region: above t-axis, 0 ≤ t ≤ 7 ────────────────
        var nPts = 200;
        var blueVerts = [];
        var dt;
        var i;
        var tVal;
        var yVal;

        dt = 7 / nPts;
        for (i = 0; i <= nPts; i++) {
            tVal = i * dt;
            yVal = vCurve(tVal);
            if (yVal < 0) yVal = 0;
            blueVerts.push([tVal, yVal]);
        }
        blueVerts.push([7, 0]);
        blueVerts.push([0, 0]);

        var bluePoints = [];
        for (i = 0; i < blueVerts.length; i++) {
            bluePoints.push(board.create('point', blueVerts[i], { visible: false, fixed: true, name: '' }));
        }
        board.create('polygon', bluePoints, {
            fillColor: '#2563EB', fillOpacity: 0.12,
            borders: { strokeWidth: 0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Red shaded region: below t-axis, 7 ≤ t ≤ 10 ────────────────
        var redVerts = [];
        dt = 3 / nPts;
        redVerts.push([7, 0]);
        redVerts.push([10, 0]);
        for (i = nPts; i >= 0; i--) {
            tVal = 7 + i * dt;
            yVal = vCurve(tVal);
            if (yVal > 0) yVal = 0;
            redVerts.push([tVal, yVal]);
        }

        var redPoints = [];
        for (i = 0; i < redVerts.length; i++) {
            redPoints.push(board.create('point', redVerts[i], { visible: false, fixed: true, name: '' }));
        }
        board.create('polygon', redPoints, {
            fillColor: '#DC2626', fillOpacity: 0.12,
            borders: { strokeWidth: 0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Main curve ──────────────────────────────────────────────────
        board.create('functiongraph', [
            function(t) { return vCurve(t); }, 0, 10
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Key points (size 3) ─────────────────────────────────────────
        // Peak (3, 8)
        board.create('point', [3, 8], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [3.3, 8.6, '(3,\\,8)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        // Trough (8.5, -4)
        board.create('point', [8.5, -4], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [8.8, -4.6, '(8.5,\\,-4)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        // ── Function label ──────────────────────────────────────────────
        board.create('text', [1.0, 9.2, 'v(t)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
