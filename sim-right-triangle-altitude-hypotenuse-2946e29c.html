<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle with Altitude to Hypotenuse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 15, 28, -3.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var A = board.create('point', [0, 0], {
            name: 'A', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -10] }
        });

        var B = board.create('point', [25, 0], {
            name: 'B', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });

        var C = board.create('point', [9, 12], {
            name: 'C', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 12] }
        });

        var D = board.create('point', [9, 0], {
            name: 'D', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -14] }
        });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Altitude CD (construction line — cyan) ──────────────────────
        board.create('segment', [C, D], {
            strokeColor: '#0EA5E9', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Right-angle marker at C (angle ACB) ────────────────────────
        var markSize = 1.2;

        var cax = -0.6, cay = -0.8;
        var cbx = 0.8, cby = -0.6;

        var cP1 = board.create('point', [9 + markSize * cax, 12 + markSize * cay], { visible: false, fixed: true, name: '' });
        var cP2 = board.create('point', [9 + markSize * (cax + cbx), 12 + markSize * (cay + cby)], { visible: false, fixed: true, name: '' });
        var cP3 = board.create('point', [9 + markSize * cbx, 12 + markSize * cby], { visible: false, fixed: true, name: '' });

        board.create('segment', [cP1, cP2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [cP2, cP3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Right angle at D (altitude meets hypotenuse)
        var dP1 = board.create('point', [9 - markSize, 0], { visible: false, fixed: true, name: '' });
        var dP2 = board.create('point', [9 - markSize, markSize], { visible: false, fixed: true, name: '' });
        var dP3 = board.create('point', [9, markSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [dP1, dP2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [dP2, dP3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Segment labels (KaTeX, blue measurement color) ──────────────
        board.create('text', [4.5, -1.6, '9'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        board.create('text', [17, -1.6, '16'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        board.create('text', [10.4, 6, 'x'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        board.create('text', [3.0, 7.0, 'y'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        board.create('text', [18.5, 7.0, 'z'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
