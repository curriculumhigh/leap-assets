<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrong Graph — Option Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 6.5, 9, -6.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        /* ── Manual axes for full tick control ────────────────────────── */
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 2,
                insertTicks: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        /* Axis labels */
        board.create('text', [8.4, -0.55, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.35, 6.1, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        var COL = '#222222';

        /* ── Piece 1: Ray, slope −2, extending LEFT from (−2, −1) ─────
           y = −2(x + 2) − 1  →  at x = −5.75, y = 6.5 (top of box)        */
        board.create('arrow', [[-5.75, 6.5], [-2, -1]], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: false,
            firstArrow: { type: 1, size: 4 }
        });

        /* Open circle at (−2, −1) */
        board.create('point', [-2, -1], {
            name: '', size: 4,
            fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        /* ── Piece 2: Segment (−2, 3) → (4, −3), slope −1 ───────────── */
        board.create('segment', [[-2, 3], [4, -3]], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        /* Closed circle at (−2, 3) */
        board.create('point', [-2, 3], {
            name: '', size: 4, fillColor: COL, strokeColor: COL,
            fixed: true, highlight: false
        });

        /* Closed circle at (4, −3) — drawn first so the open circle overlays it */
        board.create('point', [4, -3], {
            name: '', size: 4, fillColor: COL, strokeColor: COL,
            fixed: true, highlight: false
        });

        /* ── Piece 3: Ray, slope −1, extending RIGHT from (4, −3) ────
           y = −(x − 4) − 3  →  at x = 7.5, y = −6.5 (bottom of box)       */
        board.create('arrow', [[4, -3], [7.5, -6.5]], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false,
            firstArrow: false,
            lastArrow: { type: 1, size: 4 }
        });

        /* Open circle at (4, −3) — on top of the closed one */
        board.create('point', [4, -3], {
            name: '', size: 4,
            fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, layer: 9
        });
    </script>
</body>
</html>
