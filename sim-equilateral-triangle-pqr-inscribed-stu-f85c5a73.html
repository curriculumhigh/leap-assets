<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilateral Triangle PQR with Inscribed Triangle STU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 4.5, 3.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Equilateral triangle PQR ────────────────────────────────────
        var sideLen = 4;
        var h = sideLen * Math.sqrt(3) / 2;

        var pxP = 0, pyP = h * 2 / 3;
        var pxQ = -sideLen / 2, pyQ = -h / 3;
        var pxR = sideLen / 2, pyR = -h / 3;

        var P = board.create('point', [pxP, pyP], {
            name: 'P', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 12] }
        });
        var Q = board.create('point', [pxQ, pyQ], {
            name: 'Q', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -8] }
        });
        var R = board.create('point', [pxR, pyR], {
            name: 'R', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -8] }
        });

        // Outer triangle PQR — solid edges, no fill
        var triPQR = board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // ── Points S, T, U at 1/3 from P, Q, R respectively ────────────
        var frac = 1 / 3;
        var sxS = pxP + frac * (pxQ - pxP);
        var syS = pyP + frac * (pyQ - pyP);
        var sxT = pxQ + frac * (pxR - pxQ);
        var syT = pyQ + frac * (pyR - pyQ);
        var sxU = pxR + frac * (pxP - pxR);
        var syU = pyR + frac * (pyP - pyR);

        var S = board.create('point', [sxS, syS], {
            name: 'S', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 4] }
        });
        var T = board.create('point', [sxT, syT], {
            name: 'T', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });
        var U = board.create('point', [sxU, syU], {
            name: 'U', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 4] }
        });

        // Inner triangle STU — dashed edges, no fill
        var triSTU = board.create('polygon', [S, T, U], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, dash: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // ── Tick mark helper ────────────────────────────────────────────
        function drawTicks(ptA, ptB, n) {
            var ax = ptA.X(), ay = ptA.Y();
            var bx = ptB.X(), by = ptB.Y();
            var mx = (ax + bx) / 2;
            var my = (ay + by) / 2;
            var dx = bx - ax;
            var dy = by - ay;
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickHalf = 0.15;
            var spacing = 0.12;
            var ux = dx / len;
            var uy = dy / len;

            for (var i = 0; i < n; i++) {
                var offset = (i - (n - 1) / 2) * spacing;
                var cx = mx + offset * ux;
                var cy = my + offset * uy;
                board.create('segment', [
                    [cx + tickHalf * px, cy + tickHalf * py],
                    [cx - tickHalf * px, cy - tickHalf * py]
                ], {
                    strokeColor: '#555555', strokeWidth: 1.5,
                    fixed: true, highlight: false
                });
            }
        }

        // One tick on PS, QT, RU (congruent sub-segments)
        drawTicks(P, S, 1);
        drawTicks(Q, T, 1);
        drawTicks(R, U, 1);
    </script>
</body>
</html>
