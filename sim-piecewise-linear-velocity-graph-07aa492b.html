<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise-Linear Velocity Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 580px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 7, 14, -5.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        insertTicks: false,
                        ticksDistance: 1,
                        minorTicks: 0,
                        drawZero: false,
                        label: {
                            fontSize: 11,
                            visible: true,
                            anchorX: 'middle',
                            offset: [0, -12]
                        }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        insertTicks: false,
                        ticksDistance: 1,
                        minorTicks: 0,
                        drawZero: false,
                        label: {
                            fontSize: 11,
                            visible: true,
                            anchorX: 'right',
                            offset: [-6, 0]
                        }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels (KaTeX)
        board.create('text', [11.5, -1.25, 't\\text{ (in seconds)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, 6.6, 'v\\text{ (in m/s)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });

        // Vertices
        var vertices = [
            [0, -3],
            [2, 0],
            [4, 5],
            [6, 5],
            [8, 0],
            [10, -3],
            [12, 3]
        ];

        // Draw segments between consecutive vertices
        var i;
        for (i = 0; i < vertices.length - 1; i++) {
            board.create('segment', [vertices[i], vertices[i + 1]], {
                strokeColor: '#222222',
                strokeWidth: 1.8,
                fixed: true,
                highlight: false
            });
        }

        // Plot filled dots at each vertex
        for (i = 0; i < vertices.length; i++) {
            board.create('point', vertices[i], {
                name: '',
                size: 4,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
