<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of s(t) = t³ - 6t² + 9t</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 8.5, 7, -2.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Grid — 1 unit spacing in both directions
        var i;
        // Vertical grid lines
        for (i = -1; i <= 7; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }
        // Horizontal grid lines
        for (i = -2; i <= 8; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // Horizontal axis (t) — positive only
        board.create('arrow', [[-0.2, 0], [6.7, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Vertical axis
        board.create('arrow', [[0, -2.0], [0, 8.2]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Horizontal tick marks and labels — every 1 unit
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, -0.12], [i, 0.12]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [i, -0.45, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Vertical tick marks and labels — every 1 unit
        for (i = -2; i <= 8; i++) {
            if (i === 0) continue;
            board.create('segment', [[-0.1, i], [0.1, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [-0.4, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Origin label
        board.create('text', [-0.35, -0.4, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Horizontal axis label (KaTeX)
        board.create('text', [6.55, -0.7, 't'], {
            fontSize: 14, useKatex: true, color: '#444444',
            fixed: true, highlight: false
        });

        // Curve: s(t) = t^3 - 6t^2 + 9t
        board.create('functiongraph', [
            function(t) { return t * t * t - 6 * t * t + 9 * t; },
            0, 6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Curve label — name only (moved down 2.5 units: 6.8 → 4.3)
        board.create('text', [0.6, 4.3, 's'], {
            fontSize: 13, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
