<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Function P(x)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 6, 7, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [6.6, -0.5, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.3, 5.6, 'y'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Colors
        var COL1 = '#222222';
        var COL2 = '#2563EB';
        var COL3 = '#059669';

        // ── Piece 1: P(x) = 2x + 4, x ≤ -2 ────────────────────────────
        board.create('functiongraph', [
            function(x) { return 2 * x + 4; }, -7, -2
        ], { strokeColor: COL1, strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Piece 2: P(x) = -x² + 4, -2 < x < 3 ───────────────────────
        board.create('functiongraph', [
            function(x) { return -x * x + 4; }, -2, 3
        ], { strokeColor: COL2, strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Piece 3: P(x) = -x - 2, x ≥ 3 ─────────────────────────────
        board.create('functiongraph', [
            function(x) { return -x - 2; }, 3, 7
        ], { strokeColor: COL3, strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Transition points ───────────────────────────────────────────

        // At x = -2: P(-2) = 0 for both pieces (continuous)
        // Open circle for Piece 2 (drawn first, behind)
        board.create('point', [-2, 0], {
            name: '', size: 5, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: COL2, strokeWidth: 1.5
        });
        // Closed circle for Piece 1 (drawn on top)
        board.create('point', [-2, 0], {
            name: '', size: 5, fixed: true, highlight: false,
            fillColor: COL1, strokeColor: COL1, strokeWidth: 1.5
        });

        // At x = 3: P(3) = -5 for both pieces (continuous)
        // Open circle for Piece 2 (drawn first, behind)
        board.create('point', [3, -5], {
            name: '', size: 5, fixed: true, highlight: false,
            fillColor: '#ffffff', strokeColor: COL2, strokeWidth: 1.5
        });
        // Closed circle for Piece 3 (drawn on top)
        board.create('point', [3, -5], {
            name: '', size: 5, fixed: true, highlight: false,
            fillColor: COL3, strokeColor: COL3, strokeWidth: 1.5
        });

        // ── Coordinate labels for transition points ─────────────────────

        // (-2, 0) — offset above-left to avoid x-axis tick overlap
        board.create('text', [-2.1, 0.7, '(-2,\\, 0)'], {
            fontSize: 12, color: COL1, fixed: true, highlight: false,
            useKatex: true, anchorX: 'right'
        });

        // (3, -5) — offset to the right to avoid crowding
        board.create('text', [3.3, -4.5, '(3,\\, -5)'], {
            fontSize: 12, color: COL3, fixed: true, highlight: false,
            useKatex: true, anchorX: 'left'
        });

        // ── Piece labels ────────────────────────────────────────────────

        // Piece 1 label — along the line in lower-left area
        board.create('text', [-5.8, -4.8, '\\text{Piece 1}'], {
            fontSize: 13, color: COL1, fixed: true, highlight: false, useKatex: true
        });

        // Piece 2 label — near the vertex of the parabola
        board.create('text', [0.3, 4.8, '\\text{Piece 2}'], {
            fontSize: 13, color: COL2, fixed: true, highlight: false, useKatex: true
        });

        // Piece 3 label — along the line in the right area
        board.create('text', [4.8, -6.2, '\\text{Piece 3}'], {
            fontSize: 13, color: COL3, fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
