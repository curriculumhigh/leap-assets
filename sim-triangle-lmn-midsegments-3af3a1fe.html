<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle LMN with Midsegments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 8.5, 9.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices of △LMN ────────────────────────────────────────
        var L = board.create('point', [0, 0], {
            name: 'L', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -10] }
        });
        var N = board.create('point', [8, 0], {
            name: 'N', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });
        var M = board.create('point', [3, 7], {
            name: 'M', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 12] }
        });

        // ── Sides of △LMN ───────────────────────────────────────────
        board.create('segment', [L, M], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [M, N], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [L, N], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Midpoints ───────────────────────────────────────────────
        var P = board.create('midpoint', [L, M], {
            name: 'P', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 2] }
        });
        var Q = board.create('midpoint', [M, N], {
            name: 'Q', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 2] }
        });
        var R = board.create('midpoint', [L, N], {
            name: 'R', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [0, -16] }
        });

        // ── Midsegments (inner △PQR) ────────────────────────────────
        board.create('segment', [P, Q], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, R], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [Q, R], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
    </script>
</body>
</html>
