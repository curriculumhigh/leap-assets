<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 19, 19, -1.5],
            axis: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // Draw x-axis
        var xAxis = board.create('arrow', [[0, 0], [18.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Draw y-axis
        var yAxis = board.create('arrow', [[0, 0], [0, 18.5]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // X-axis ticks and labels (every 2 units)
        var i;
        for (i = 2; i <= 18; i += 2) {
            board.create('segment', [[i, -0.2], [i, 0.2]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [i, -0.8, String(i)], {
                fontSize: 11, anchorX: 'middle', color: '#444444', fixed: true, highlight: false
            });
            // Grid line (vertical)
            board.create('segment', [[i, 0], [i, 18]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Y-axis ticks and labels (every 1 unit)
        for (i = 1; i <= 18; i += 1) {
            board.create('segment', [[-0.2, i], [0.2, i]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [-0.7, i, String(i)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle', color: '#444444', fixed: true, highlight: false
            });
            // Grid line (horizontal)
            board.create('segment', [[0, i], [18, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [18.2, -0.8, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 18.3, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Points data
        var points = [
            [2, 8], [4, 5], [6, 14], [8, 11],
            [10, 3], [12, 16], [14, 9], [16, 12]
        ];

        // Plot each point
        for (i = 0; i < points.length; i++) {
            board.create('point', points[i], {
                name: '',
                size: 4,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
