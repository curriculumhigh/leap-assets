<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squares JKLM and PQRS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9.5, 18, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Colors
        var COL_OUTLINE = '#555555';
        var COL_LABEL = '#222222';
        var COL_MEASURE = '#3B82F6';

        // ── Left Square JKLM (side = 4) ─────────────────────────────────
        var sqLeft = 1;
        var sqBottomY = 1;
        var side1 = 4;

        var J = board.create('point', [sqLeft, sqBottomY], {
            name: 'J', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [-14, -16] }
        });
        var K = board.create('point', [sqLeft, sqBottomY + side1], {
            name: 'K', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [-14, 8] }
        });
        var L = board.create('point', [sqLeft + side1, sqBottomY + side1], {
            name: 'L', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [8, 8] }
        });
        var M = board.create('point', [sqLeft + side1, sqBottomY], {
            name: 'M', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [8, -16] }
        });

        board.create('polygon', [J, K, L, M], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });
        J.setAttribute({ visible: true });
        K.setAttribute({ visible: true });
        L.setAttribute({ visible: true });
        M.setAttribute({ visible: true });

        // Side length label "4" on left side of square JKLM
        board.create('text', [sqLeft - 1.2, sqBottomY + side1 / 2, '4'], {
            fontSize: 15, color: COL_MEASURE, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600'
        });

        // ── Right Square PQRS (side = 6) ────────────────────────────────
        var sqRight = 9;
        var side2 = 6;

        var P = board.create('point', [sqRight, sqBottomY], {
            name: 'P', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [-14, -16] }
        });
        var Q = board.create('point', [sqRight, sqBottomY + side2], {
            name: 'Q', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [-14, 8] }
        });
        var R = board.create('point', [sqRight + side2, sqBottomY + side2], {
            name: 'R', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [8, 8] }
        });
        var S = board.create('point', [sqRight + side2, sqBottomY], {
            name: 'S', fixed: true, size: 2, color: COL_LABEL, highlight: false,
            label: { fontSize: 14, color: COL_LABEL, offset: [8, -16] }
        });

        board.create('polygon', [P, Q, R, S], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });
        P.setAttribute({ visible: true });
        Q.setAttribute({ visible: true });
        R.setAttribute({ visible: true });
        S.setAttribute({ visible: true });

        // Side length label "6" on left side of square PQRS
        board.create('text', [sqRight - 1.2, sqBottomY + side2 / 2, '6'], {
            fontSize: 15, color: COL_MEASURE, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600'
        });

        // ── Parallel arrow on JM (single arrow pointing J → M) ──────────
        var jmMidX = sqLeft + side1 / 2;
        var arrowHalf = 0.4;

        board.create('segment', [[jmMidX - arrowHalf, sqBottomY], [jmMidX + arrowHalf, sqBottomY]], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // ── Parallel arrow on PS (single arrow pointing P → S) ──────────
        var psMidX = sqRight + side2 / 2;

        board.create('segment', [[psMidX - arrowHalf, sqBottomY], [psMidX + arrowHalf, sqBottomY]], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

    </script>
</body>
</html>
