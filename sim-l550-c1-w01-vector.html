<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same Vector in Two Positions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 420px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 12, 8, -1],
            axis: true,
            keepAspectRatio: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2,
                        insertTicks: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 11.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Arrow 1: A(-4, 1) → B(2, 10) ───────────────────────────────
        var A = board.create('point', [-4, 1], {
            name: '', size: 5, color: '#2563EB', fixed: true, highlight: false
        });
        var B = board.create('point', [2, 10], {
            name: '', size: 5, color: '#2563EB', fixed: true, highlight: false
        });

        board.create('arrow', [A, B], {
            strokeColor: '#2563EB',
            strokeWidth: 2.2,
            lastArrow: { type: 2, size: 7 },
            fixed: true,
            highlight: false
        });

        // Label A(-4, 1) — offset to the right so it stays inside the window
        board.create('text', [-4, 1, 'A(-4,\\,1)'], {
            useKatex: true,
            fontSize: 13,
            color: '#2563EB',
            anchorX: 'left',
            anchorY: 'top',
            fixed: true,
            highlight: false,
            offset: [10, -6]
        });

        // Label B(2, 10) — offset to the left and above
        board.create('text', [2, 10, 'B(2,\\,10)'], {
            useKatex: true,
            fontSize: 13,
            color: '#2563EB',
            anchorX: 'right',
            anchorY: 'bottom',
            fixed: true,
            highlight: false,
            offset: [-14, 10]
        });

        // "same vector" label for arrow 1 — placed to the left of the arrow midpoint
        board.create('text', [-2.8, 6.2, 'same vector'], {
            fontSize: 12,
            color: '#2563EB',
            anchorX: 'right',
            anchorY: 'middle',
            fixed: true,
            highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // ── Arrow 2: (0, 0) → (6, 9) ───────────────────────────────────
        var O2 = board.create('point', [0, 0], {
            name: '', size: 5, color: '#059669', fixed: true, highlight: false
        });
        var P2 = board.create('point', [6, 9], {
            name: '', size: 5, color: '#059669', fixed: true, highlight: false
        });

        board.create('arrow', [O2, P2], {
            strokeColor: '#059669',
            strokeWidth: 2.2,
            lastArrow: { type: 2, size: 7 },
            fixed: true,
            highlight: false
        });

        // Label (6, 9) — offset to the right and above
        board.create('text', [6, 9, '(6,\\,9)'], {
            useKatex: true,
            fontSize: 13,
            color: '#059669',
            anchorX: 'left',
            anchorY: 'bottom',
            fixed: true,
            highlight: false,
            offset: [8, 4]
        });

        // "same vector" label for arrow 2 — placed to the right of the arrow midpoint
        board.create('text', [4.2, 4, 'same vector'], {
            fontSize: 12,
            color: '#059669',
            anchorX: 'left',
            anchorY: 'middle',
            fixed: true,
            highlight: false,
            cssStyle: 'font-style: italic;'
        });
    </script>
</body>
</html>
