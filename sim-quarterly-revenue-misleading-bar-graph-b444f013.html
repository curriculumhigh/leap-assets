<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly Revenue — Misleading Bar Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 600px; margin: 0; padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
        .jxgbox text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var quarters = ['Q1', 'Q2', 'Q3', 'Q4'];
        var values   = [485000, 492000, 504000, 498000];

        var yTicks = [
            { dollar: 480000, y: 0 },
            { dollar: 490000, y: 1 },
            { dollar: 495000, y: 2 },
            { dollar: 500000, y: 3 },
            { dollar: 510000, y: 4 }
        ];

        function dollarToY(d) {
            for (var i = 0; i < yTicks.length - 1; i++) {
                var lo = yTicks[i];
                var hi = yTicks[i + 1];
                if (d >= lo.dollar && d <= hi.dollar) {
                    var frac = (d - lo.dollar) / (hi.dollar - lo.dollar);
                    return lo.y + frac * (hi.y - lo.y);
                }
            }
            if (d < yTicks[0].dollar) {
                var seg = yTicks[0];
                var seg2 = yTicks[1];
                var rate = (seg2.y - seg.y) / (seg2.dollar - seg.dollar);
                return seg.y + rate * (d - seg.dollar);
            }
            var last = yTicks[yTicks.length - 1];
            var prev = yTicks[yTicks.length - 2];
            var rate2 = (last.y - prev.y) / (last.dollar - prev.dollar);
            return last.y + rate2 * (d - last.dollar);
        }

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.4, 5.4, 10.2, -1.4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var GRID_COLOR = '#D1D5DB';
        var GRID_WIDTH = 0.4;
        var AXIS_COLOR = '#444444';
        var AXIS_WIDTH = 1.2;
        var BAR_COLOR  = '#2563EB';

        var chartLeft  = 0;
        var chartRight = 9.6;
        var chartBottom = 0;
        var chartTop   = 4;

        for (var i = 0; i < yTicks.length; i++) {
            var yPos = yTicks[i].y;
            board.create('segment', [[chartLeft, yPos], [chartRight, yPos]], {
                strokeColor: (i === 0) ? AXIS_COLOR : GRID_COLOR,
                strokeWidth: (i === 0) ? AXIS_WIDTH : GRID_WIDTH,
                fixed: true, highlight: false
            });
        }

        board.create('segment', [[chartLeft, chartBottom], [chartLeft, chartTop + 0.3]], {
            strokeColor: AXIS_COLOR, strokeWidth: AXIS_WIDTH,
            fixed: true, highlight: false
        });

        function formatDollar(d) {
            return '\\$' + d.toLocaleString('en-US');
        }

        for (var t = 0; t < yTicks.length; t++) {
            var tick = yTicks[t];
            board.create('segment', [[-0.12, tick.y], [0, tick.y]], {
                strokeColor: AXIS_COLOR, strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [-0.2, tick.y, formatDollar(tick.dollar)], {
                anchorX: 'right', anchorY: 'middle',
                fontSize: 11, color: '#333333',
                useKatex: true, fixed: true, highlight: false
            });
        }

        var barCenters = [2, 4, 6, 8];
        var normalHalfWidth = 0.55;
        var wideHalfWidth   = 0.88;

        for (var b = 0; b < 4; b++) {
            var cx = barCenters[b];
            var hw = (b === 2) ? wideHalfWidth : normalHalfWidth;
            var barTop = dollarToY(values[b]);

            var x1 = cx - hw;
            var x2 = cx + hw;
            var y1 = 0;
            var y2 = barTop;

            var p1 = board.create('point', [x1, y1], { visible: false, name: '' });
            var p2 = board.create('point', [x2, y1], { visible: false, name: '' });
            var p3 = board.create('point', [x2, y2], { visible: false, name: '' });
            var p4 = board.create('point', [x1, y2], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_COLOR, fillOpacity: 0.82,
                borders: { strokeColor: BAR_COLOR, strokeWidth: 1.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            board.create('text', [cx, -0.35, quarters[b]], {
                anchorX: 'middle', anchorY: 'top',
                fontSize: 13, color: '#333333',
                cssStyle: 'font-weight:600',
                fixed: true, highlight: false
            });
        }

        // Title
        board.create('text', [(chartLeft + chartRight) / 2, 4.9, 'Quarterly Revenue'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: '#222222',
            cssStyle: 'font-weight:700',
            fixed: true, highlight: false
        });

        // Horizontal axis label — "Quarter"
        board.create('text', [(chartLeft + chartRight) / 2, -1.05, 'Quarter'], {
            anchorX: 'middle', anchorY: 'top',
            fontSize: 13, color: '#333333',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        // Vertical axis label — "Revenue (dollars)", rotated
        board.create('text', [-2.05, (chartBottom + chartTop) / 2, 'Revenue (dollars)'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#333333',
            cssStyle: 'font-weight:600; writing-mode:vertical-rl; transform:rotate(180deg);',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
