<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle PRQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 9, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Triangle vertices ───────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: '', fixed: true, size: 0, visible: false
        });
        var R = board.create('point', [6.5, 0], {
            name: '', fixed: true, size: 0, visible: false
        });
        var Q = board.create('point', [6.5, 5.65], {
            name: '', fixed: true, size: 0, visible: false
        });

        // ── Triangle polygon (no fill) ──────────────────────────────────
        var triangle = board.create('polygon', [P, R, Q], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right angle marker at R ─────────────────────────────────────
        var sqSize = 0.5;
        var sq1 = board.create('point', [R.X() - sqSize, R.Y()], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [R.X() - sqSize, R.Y() + sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [R.X(), R.Y() + sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── 41° angle arc at P ──────────────────────────────────────────
        board.create('nonReflexAngle', [R, P, Q], {
            radius: 1.0,
            fillColor: '#DC2626', fillOpacity: 0.06,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        var angleBisectorAngle = Math.atan2(Q.Y() - P.Y(), Q.X() - P.X()) / 2;
        var labelDist = 1.5;
        board.create('text', [
            P.X() + labelDist * Math.cos(angleBisectorAngle),
            P.Y() + labelDist * Math.sin(angleBisectorAngle),
            '41^\\circ'
        ], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [P.X() - 0.5, P.Y() - 0.5, 'P'], {
            fontSize: 15, color: '#222222', cssStyle: 'font-weight:bold; font-style:italic',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [R.X() + 0.5, R.Y() - 0.5, 'R'], {
            fontSize: 15, color: '#222222', cssStyle: 'font-weight:bold; font-style:italic',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [Q.X() + 0.5, Q.Y() + 0.4, 'Q'], {
            fontSize: 15, color: '#222222', cssStyle: 'font-weight:bold; font-style:italic',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        board.create('text', [R.X() + 0.7, (R.Y() + Q.Y()) / 2, '9'], {
            useKatex: true, fontSize: 15, color: '#3B82F6',
            cssStyle: 'font-weight:bold',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [(P.X() + R.X()) / 2, P.Y() - 0.6, 'x'], {
            useKatex: true, fontSize: 15, color: '#3B82F6',
            cssStyle: 'font-weight:bold',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
