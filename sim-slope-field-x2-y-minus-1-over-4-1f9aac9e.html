<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope Field — dy/dx = x²(y−1)/4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 6.5, 6.5, -6.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid lines at every integer ─────────────────────────────────
        var GRID_COL = '#D1D5DB';
        var GRID_W = 0.4;
        var i;

        for (i = -5; i <= 5; i++) {
            // Vertical grid lines
            board.create('segment', [[i, -5], [i, 5]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false, layer: 0
            });
            // Horizontal grid lines
            board.create('segment', [[-5, i], [5, i]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false, layer: 0
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        var AXIS_COL = '#444444';

        // x-axis
        board.create('arrow', [[-6.2, 0], [6.2, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false, layer: 1
        });
        // y-axis
        board.create('arrow', [[0, -6.2], [0, 6.2]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false, layer: 1
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var TICK_LEN = 0.15;

        for (i = -5; i <= 5; i++) {
            if (i === 0) continue;

            // x-axis ticks
            board.create('segment', [[i, -TICK_LEN], [i, TICK_LEN]], {
                strokeColor: AXIS_COL, strokeWidth: 1.2,
                fixed: true, highlight: false, layer: 1
            });
            // x-axis labels
            board.create('text', [i, -0.45, String(i)], {
                fontSize: 11, color: AXIS_COL, anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });

            // y-axis ticks
            board.create('segment', [[-TICK_LEN, i], [TICK_LEN, i]], {
                strokeColor: AXIS_COL, strokeWidth: 1.2,
                fixed: true, highlight: false, layer: 1
            });
            // y-axis labels
            board.create('text', [-0.4, i, String(i)], {
                fontSize: 11, color: AXIS_COL, anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Origin label — single "0" offset to bottom-left
        board.create('text', [-0.35, -0.4, '0'], {
            fontSize: 11, color: AXIS_COL, anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });

        // Axis name labels
        board.create('text', [6.0, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 6.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Slope field: dy/dx = x²(y − 1) / 4 ─────────────────────────
        var SEG_HALF = 0.28;
        var COL_FIELD = '#2563EB';

        function dydx(x, y) {
            return x * x * (y - 1) / 4;
        }

        for (var xi = -5; xi <= 5; xi++) {
            for (var yi = -5; yi <= 5; yi++) {
                var slope = dydx(xi, yi);
                var angle = Math.atan(slope);
                var dx = SEG_HALF * Math.cos(angle);
                var dy = SEG_HALF * Math.sin(angle);

                board.create('segment', [
                    [xi - dx, yi - dy],
                    [xi + dx, yi + dy]
                ], {
                    strokeColor: COL_FIELD,
                    strokeWidth: 1.75,
                    fixed: true,
                    highlight: false,
                    layer: 5
                });
            }
        }
    </script>
</body>
</html>
