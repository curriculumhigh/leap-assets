<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramp Cross-Section</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 6.5, 19.5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        // A = bottom-left (ground, where angle x° is)
        // B = bottom-right (ground, right angle corner)
        // C = top-right (top of rise)
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [16, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [16, 3], { visible: false, fixed: true, name: '' });

        // Triangle — no fill
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Right-angle marker at B (bottom-right)
        var sqSize = 0.8;
        var sq1 = board.create('point', [16 - sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [16 - sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [16, sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], { strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false });

        // Angle arc at A (bottom-left) for x°
        board.create('nonReflexAngle', [B, A, C], {
            radius: 2.0,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // Label: x° near the angle arc at A
        board.create('text', [2.8, 0.7, 'x^\\circ'], {
            useKatex: true, fontSize: 16, color: '#222222',
            fixed: true, highlight: false
        });

        // Label: 16 centered below the base
        board.create('text', [8, -1.4, '16'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Label: 3 to the right of the vertical rise
        board.create('text', [17.3, 1.5, '3'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
