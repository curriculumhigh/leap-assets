<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Translation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 5.5, 8, -5.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 7 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 7 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.3, -0.5, '<i>x</i>'], { fontSize: 9, fixed: true, highlight: false });
        board.create('text', [0.3, 5.0, '<i>y</i>'], { fontSize: 9, fixed: true, highlight: false });

        // Hexagon vertices
        var vertexData = [
            { name: "E'", coords: [-6, 2], offset: [-14, 4] },
            { name: "F'", coords: [-4, 4], offset: [-6, 8] },
            { name: "G'", coords: [-2, 4], offset: [4, 8] },
            { name: "H'", coords: [-1, 2], offset: [6, 4] },
            { name: "I'", coords: [-3, 0], offset: [2, -14] },
            { name: "J'", coords: [-4, 0], offset: [-12, -14] }
        ];

        var points = [];
        for (var i = 0; i < vertexData.length; i++) {
            var v = vertexData[i];
            var pt = board.create('point', v.coords, {
                name: v.name,
                fixed: true,
                size: 2.5,
                color: '#DC2626',
                strokeColor: '#DC2626',
                highlight: false,
                showInfobox: false,
                label: {
                    fontSize: 9,
                    color: '#DC2626',
                    useKatex: true,
                    offset: v.offset
                }
            });
            points.push(pt);
        }

        // Polygon
        board.create('polygon', points, {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#2563EB',
                strokeWidth: 1.8,
                fixed: true,
                highlight: false
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
