<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor Histogram — Scrambled Intervals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 300px; height: 200px; position: relative; }
        .y-label {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 9px;
            font-style: italic;
            color: #444444;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
        }
        .board-wrapper { position: absolute; top: 2px; left: 22px; right: 2px; bottom: 2px; }
        #board { width: 100%; height: 100%; }
        .jxgbox text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <div class="y-label">Frequency</div>
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#ffffff';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        // Scrambled order: interval labels and corresponding heights
        var intervals = ['40–49', '10–19', '60–69', '0–9', '30–39', '20–29', '50–59'];
        var heights   = [35,       2,       28,      5,     9,       15,      24];

        var barWidth = 10;
        var numBars = 7;
        var xMax = numBars * barWidth; // 70

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 44, 78, -10],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid: horizontal lines at every 5 units from 0 to 40 ───────
        var i;
        for (i = 0; i <= 40; i += 5) {
            board.create('line', [[0, i], [xMax, i]], {
                strokeColor: GRID_COL, strokeWidth: 0.4,
                straightFirst: false, straightLast: false,
                fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        // X-axis
        board.create('arrow', [[0, 0], [74, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            fixed: true, highlight: false
        });
        // Y-axis
        board.create('arrow', [[0, 0], [0, 43]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            fixed: true, highlight: false
        });

        // ── Y-axis tick labels (0, 5, 10, … 40) ────────────────────────
        for (i = 0; i <= 40; i += 5) {
            // Tick mark
            board.create('segment', [[-1, i], [0, i]], {
                strokeColor: AXIS_COL, strokeWidth: 1,
                fixed: true, highlight: false
            });
            board.create('text', [-2.5, i, String(i)], {
                fontSize: 8, color: AXIS_COL, anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Bars + X-axis interval labels ───────────────────────────────
        for (i = 0; i < numBars; i++) {
            var x0 = i * barWidth;
            var x1 = x0 + barWidth;
            var h = heights[i];

            // Bar as polygon
            var p1 = board.create('point', [x0, 0], { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [x1, 0], { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [x1, h], { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [x0, h], { visible: false, fixed: true, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.9,
                borders: { strokeColor: BAR_STROKE, strokeWidth: 0.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Interval label centered under bar
            board.create('text', [x0 + barWidth / 2, -3.5, intervals[i]], {
                fontSize: 8, color: AXIS_COL, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });

            // Small tick at bar boundary
            board.create('segment', [[x1, 0], [x1, -1]], {
                strokeColor: AXIS_COL, strokeWidth: 0.8,
                fixed: true, highlight: false
            });
        }
        // First bar left tick
        board.create('segment', [[0, 0], [0, -1]], {
            strokeColor: AXIS_COL, strokeWidth: 0.8,
            fixed: true, highlight: false
        });

        // ── X-axis title ────────────────────────────────────────────────
        board.create('text', [xMax / 2, -8, 'Pastries sold per day'], {
            fontSize: 9, color: AXIS_COL, anchorX: 'middle', anchorY: 'middle',
            fontStyle: 'italic',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
