<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Density Curves — Symmetric, Right-Skewed, Left-Skewed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-11, 1.15, 11, -0.22],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_P = '#222222';   // primary — symmetric
        var COL_Q = '#2563EB';   // 2nd — right-skewed
        var COL_R = '#059669';   // 3rd — left-skewed

        // ── Horizontal baseline ─────────────────────────────────────────
        board.create('line', [[-11, 0], [11, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            straightFirst: false, straightLast: false,
            fixed: true, highlight: false,
            point1: { visible: false },
            point2: { visible: false }
        });

        // ── Curve math helpers ──────────────────────────────────────────

        // Gaussian: symmetric bell
        function gaussian(x, mu, sigma, amp) {
            var z = (x - mu) / sigma;
            return amp * Math.exp(-0.5 * z * z);
        }

        // Skewed curve using split-normal (different sigma on each side)
        function skewedCurve(x, mu, sigmaL, sigmaR, amp) {
            var sigma = (x < mu) ? sigmaL : sigmaR;
            var z = (x - mu) / sigma;
            return amp * Math.exp(-0.5 * z * z);
        }

        // ── Curve R — left-skewed (tail extends LEFT, peak shifted RIGHT) ──
        var muR = -5.0;
        var sigmaR_L = 2.6;
        var sigmaR_R = 1.1;
        var ampR = 0.85;

        board.create('functiongraph', [
            function(x) { return skewedCurve(x, muR, sigmaR_L, sigmaR_R, ampR); },
            -11, -0.5
        ], {
            strokeColor: COL_R, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Curve P — symmetric bell (centered at 0) ───────────────────
        var muP = 0;
        var sigmaP = 1.3;
        var ampP = 0.92;

        board.create('functiongraph', [
            function(x) { return gaussian(x, muP, sigmaP, ampP); },
            -4.5, 4.5
        ], {
            strokeColor: COL_P, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Curve Q — right-skewed (tail extends RIGHT, peak shifted LEFT) ─
        var muQ = 5.0;
        var sigmaQ_L = 1.1;
        var sigmaQ_R = 2.6;
        var ampQ = 0.85;

        board.create('functiongraph', [
            function(x) { return skewedCurve(x, muQ, sigmaQ_L, sigmaQ_R, ampQ); },
            0.5, 11
        ], {
            strokeColor: COL_Q, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Labels ──────────────────────────────────────────────────────

        // P — above symmetric peak
        board.create('text', [muP, ampP + 0.1, 'P'], {
            fontSize: 16, color: COL_P, anchorX: 'middle', anchorY: 'bottom',
            cssStyle: 'font-weight:700; font-style:italic;',
            fixed: true, highlight: false
        });

        // Q — above right-skewed peak
        board.create('text', [muQ, ampQ + 0.1, 'Q'], {
            fontSize: 16, color: COL_Q, anchorX: 'middle', anchorY: 'bottom',
            cssStyle: 'font-weight:700; font-style:italic;',
            fixed: true, highlight: false
        });

        // R — above left-skewed peak
        board.create('text', [muR, ampR + 0.1, 'R'], {
            fontSize: 16, color: COL_R, anchorX: 'middle', anchorY: 'bottom',
            cssStyle: 'font-weight:700; font-style:italic;',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
