<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle WXY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 8.5, 7, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var W = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var Y = board.create('point', [5.4, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var X = board.create('point', [5.4, 6.9], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle (no fill)
        board.create('polygon', [W, Y, X], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at Y
        var sq = 0.5;
        var sqP1 = board.create('point', [5.4 - sq, 0], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [5.4 - sq, sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [5.4, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Angle arc at W (52 degrees)
        board.create('nonReflexAngle', [Y, W, X], {
            radius: 0.9,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // Angle label along bisector
        var angleRad = 52 * Math.PI / 180;
        var bisectorAngle = angleRad / 2;
        var labelR = 1.4;
        board.create('text', [
            labelR * Math.cos(bisectorAngle),
            labelR * Math.sin(bisectorAngle),
            '52^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Vertex labels (bold, KaTeX)
        board.create('text', [-0.55, -0.5, '\\mathbf{W}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [5.9, -0.5, '\\mathbf{Y}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [5.9, 7.3, '\\mathbf{X}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Side labels (blue, bold, values only)
        // 11 — right of the vertical leg (XY)
        board.create('text', [6.1, 3.45, '\\mathbf{\\color{#2563EB}{11}}'], {
            useKatex: true, fontSize: 14,
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // x — below the horizontal leg (WY)
        board.create('text', [2.7, -0.7, '\\mathbf{\\color{#2563EB}{x}}'], {
            useKatex: true, fontSize: 14,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
