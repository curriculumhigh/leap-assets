<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Cone Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 10.5, 5.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var apexX = 0, apexY = 9.5;
        var baseCenterX = 0, baseCenterY = 1.5;
        var baseRadius = 3.2;
        var ellipseRY = 0.75;

        var apex = board.create('point', [apexX, apexY], { visible: false, fixed: true, name: '' });
        var baseCenter = board.create('point', [baseCenterX, baseCenterY], { visible: false, fixed: true, name: '' });
        var baseLeft = board.create('point', [-baseRadius, baseCenterY], { visible: false, fixed: true, name: '' });
        var baseRight = board.create('point', [baseRadius, baseCenterY], { visible: false, fixed: true, name: '' });

        board.create('segment', [apex, baseLeft], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [apex, baseRight], {
            strokeColor: '#2563EB', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return baseCenterX + baseRadius * Math.cos(t); },
            function(t) { return baseCenterY + ellipseRY * Math.sin(t); },
            0, 2 * Math.PI
        ], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [apex, baseCenter], {
            strokeColor: '#555555', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [baseCenter, baseRight], {
            strokeColor: '#059669', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var sqSize = 0.45;
        board.create('segment', [[sqSize, baseCenterY], [sqSize, baseCenterY + sqSize]], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[sqSize, baseCenterY + sqSize], [0, baseCenterY + sqSize]], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });

        var slantMidX = (apexX + baseRadius) / 2;
        var slantMidY = (apexY + baseCenterY) / 2;
        board.create('text', [slantMidX + 0.9, slantMidY, '17\\text{ cm}'], {
            useKatex: true, fontSize: 13, color: '#2563EB',
            fixed: true, highlight: false, anchorX: 'left'
        });

        var radMidX = (baseCenterX + baseRadius) / 2;
        board.create('text', [radMidX, baseCenterY - 1.0, '8\\text{ cm}'], {
            useKatex: true, fontSize: 13, color: '#059669',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        board.create('point', [apexX, apexY], {
            name: '', size: 1.5, color: '#555555', fixed: true, highlight: false
        });
    </script>
</body>
</html>
