<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola Opening Right — Vertex (-3, 1)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 10, 6, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 9.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola: (y - 1)^2 = 12(x + 3)  =>  x = (y-1)^2 / 12 - 3
        // Upper branch: y from 1 upward
        board.create('curve', [
            function(t) { return (t - 1) * (t - 1) / 12 - 3; },
            function(t) { return t; },
            1, 12
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Lower branch: y from 1 downward
        board.create('curve', [
            function(t) { return (t - 1) * (t - 1) / 12 - 3; },
            function(t) { return t; },
            -10, 1
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Latus rectum segment from (0, 7) to (0, -5)
        var latusP1 = board.create('point', [0, 7], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        var latusP2 = board.create('point', [0, -5], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('segment', [latusP1, latusP2], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // Latus Rectum label — positioned to the right of the segment midpoint
        board.create('text', [1.0, 1, '\\text{Latus Rectum}'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true,
            anchorX: 'left', anchorY: 'middle', highlight: false
        });

        // Coordinate label (0, 7)
        board.create('text', [0.6, 7.5, '(0,\\,7)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true,
            anchorX: 'left', highlight: false
        });

        // Coordinate label (0, -5)
        board.create('text', [0.6, -5.7, '(0,\\,-5)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true,
            anchorX: 'left', highlight: false
        });
    </script>
</body>
</html>
