<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Exponential Decay Sequence</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 160px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 6px;
        }
        .hover-prompt {
            font-size: 12px; color: #666; line-height: 1.5;
        }
        .coord-display {
            min-height: 30px;
            margin-top: 4px;
        }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Coordinates</div>
                    <div class="hover-prompt">Hover over a point to see its coordinates.</div>
                    <div class="coord-display" id="coord-display"></div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 195, 5.8, -18],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 12 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 12 },
                        minorTicks: 0,
                        ticksDistance: 30,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.4, -8, 'n'], {
            fontSize: 14, fixed: true, highlight: false,
            useKatex: true
        });
        board.create('text', [0.2, 188, 'a_n'], {
            fontSize: 14, fixed: true, highlight: false,
            useKatex: true
        });

        // Tooltip setup
        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');
        var coordDisplay = document.getElementById('coord-display');
        var COL_PT = '#2563EB';

        function showTooltip(pt) {
            var xVal = Math.round(pt.X());
            var yVal = Math.round(pt.Y());
            var latex = '\\color{' + COL_PT + '}{\\left(' + xVal + ',\\,' + yVal + '\\right)}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = COL_PT;
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';

            // Also update panel
            var panelLatex = '(n,\\, a_n) = \\color{' + COL_PT + '}{(' + xVal + ',\\,' + yVal + ')}';
            katex.render(panelLatex, coordDisplay, { throwOnError: false });
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
            coordDisplay.innerHTML = '';
        }

        // Data points
        var data = [[1, 162], [2, 54], [3, 18], [4, 6]];

        for (var i = 0; i < data.length; i++) {
            (function(idx) {
                var pt = board.create('point', [data[idx][0], data[idx][1]], {
                    name: '',
                    size: 4,
                    color: COL_PT,
                    fixed: true,
                    showInfobox: false,
                    highlight: true,
                    highlightFillColor: COL_PT,
                    highlightStrokeColor: COL_PT
                });
                pt.on('over', function() { showTooltip(pt); });
                pt.on('out', function() { hideTooltip(); });
            })(i);
        }
    </script>
</body>
</html>
