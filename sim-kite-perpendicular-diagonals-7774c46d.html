<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kite with Perpendicular Diagonals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 10, 14, -19],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var Top    = board.create('point', [0, 6],    { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var Right  = board.create('point', [8, 0],    { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var Bottom = board.create('point', [0, -15],  { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var Left   = board.create('point', [-8, 0],   { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var Centre = board.create('point', [0, 0],    { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        // ── Kite outline (polygon) ──────────────────────────────────────
        board.create('polygon', [Top, Right, Bottom, Left], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Diagonals (dashed) ──────────────────────────────────────────
        board.create('segment', [Top, Bottom], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [Left, Right], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Right-angle boxes at the centre (all four quadrants) ────────
        var boxSize = 0.9;
        var COL_RA = '#DC2626';
        var raWidth = 1.5;

        // Quadrant I (top-right): box at (0,0) going right and up
        board.create('segment', [[boxSize, 0], [boxSize, boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });
        board.create('segment', [[boxSize, boxSize], [0, boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });

        // Quadrant II (top-left): box at (0,0) going left and up
        board.create('segment', [[-boxSize, 0], [-boxSize, boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });
        board.create('segment', [[-boxSize, boxSize], [0, boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });

        // Quadrant III (bottom-left): box at (0,0) going left and down
        board.create('segment', [[-boxSize, 0], [-boxSize, -boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });
        board.create('segment', [[-boxSize, -boxSize], [0, -boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });

        // Quadrant IV (bottom-right): box at (0,0) going right and down
        board.create('segment', [[boxSize, 0], [boxSize, -boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });
        board.create('segment', [[boxSize, -boxSize], [0, -boxSize]], { strokeColor: COL_RA, strokeWidth: raWidth, fixed: true, highlight: false });

        // ── Dimension labels ────────────────────────────────────────────
        // "6 in." — right of upper vertical segment (midpoint at (0, 3))
        board.create('text', [1.2, 3, '6 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            fixed: true, highlight: false
        });

        // "15 in." — right of lower vertical segment (midpoint at (0, -7.5))
        board.create('text', [1.2, -7.5, '15 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            fixed: true, highlight: false
        });

        // "8 in." — above left half of horizontal diagonal (midpoint at (-4, 0))
        board.create('text', [-4, 1.3, '8 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        // "8 in." — above right half of horizontal diagonal (midpoint at (4, 0))
        board.create('text', [4, 1.3, '8 \\text{ in.}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });
    </script>
</body>
</html>
