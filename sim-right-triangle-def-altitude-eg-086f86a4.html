<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF with Altitude EG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 8.5, 12.5, -2.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertex coordinates (schematic, not to scale) ────────────────
        var Dx = 0, Dy = 0;
        var Fx = 11, Fy = 0;
        var Ex = 3.5, Ey = 7;
        // G is the foot of the altitude from E to DF (on the x-axis)
        var Gx = 3.5, Gy = 0;

        // ── Segments ────────────────────────────────────────────────────
        // Triangle sides
        board.create('segment', [[Dx, Dy], [Ex, Ey]], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [[Ex, Ey], [Fx, Fy]], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        // Hypotenuse DF (drawn as one segment)
        board.create('segment', [[Dx, Dy], [Fx, Fy]], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        // Altitude EG
        board.create('segment', [[Ex, Ey], [Gx, Gy]], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Right-angle marker at E (angle DEF = 90°) ──────────────────
        var edx = Dx - Ex, edy = Dy - Ey;
        var edLen = Math.sqrt(edx * edx + edy * edy);
        var edux = edx / edLen, eduy = edy / edLen;

        var efx = Fx - Ex, efy = Fy - Ey;
        var efLen = Math.sqrt(efx * efx + efy * efy);
        var efux = efx / efLen, efuy = efy / efLen;

        var rSz = 0.45;
        var rE1x = Ex + rSz * edux, rE1y = Ey + rSz * eduy;
        var rE2x = Ex + rSz * efux, rE2y = Ey + rSz * efuy;
        var rEcx = Ex + rSz * (edux + efux), rEcy = Ey + rSz * (eduy + efuy);

        board.create('segment', [[rE1x, rE1y], [rEcx, rEcy]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[rE2x, rE2y], [rEcx, rEcy]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle marker at G (altitude meets hypotenuse at 90°) ─
        var rGsz = 0.45;
        var rG1x = Gx - rGsz, rG1y = Gy;
        var rG2x = Gx, rG2y = Gy + rGsz;
        var rGcx = Gx - rGsz, rGcy = Gy + rGsz;

        board.create('segment', [[rG1x, rG1y], [rGcx, rGcy]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[rG2x, rG2y], [rGcx, rGcy]], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Vertex points ──────────────────────────────────────────────
        board.create('point', [Dx, Dy], {
            name: 'D', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-18, -12], cssStyle: 'font-weight:bold' }
        });
        board.create('point', [Fx, Fy], {
            name: 'F', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [8, -12], cssStyle: 'font-weight:bold' }
        });
        board.create('point', [Ex, Ey], {
            name: 'E', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-6, 12], cssStyle: 'font-weight:bold' }
        });
        board.create('point', [Gx, Gy], {
            name: 'G', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [2, -16], cssStyle: 'font-weight:bold' }
        });

        // ── Segment labels (KaTeX) ─────────────────────────────────────
        // DG label: "(a+5)" — midpoint of DG, offset below
        var dgMidX = (Dx + Gx) / 2;
        var dgMidY = (Dy + Gy) / 2 - 0.7;
        board.create('text', [dgMidX, dgMidY, '(a+5)'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // GF label: "11" — midpoint of GF, offset below
        var gfMidX = (Gx + Fx) / 2;
        var gfMidY = (Gy + Fy) / 2 - 0.7;
        board.create('text', [gfMidX, gfMidY, '11'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // DE label: "30" — midpoint of DE, offset to the left
        var deMidX = (Dx + Ex) / 2;
        var deMidY = (Dy + Ey) / 2;
        var deNx = -(Ey - Dy) / edLen;
        var deNy = (Ex - Dx) / edLen;
        var triCenterX = (Dx + Ex + Fx) / 3;
        var triCenterY = (Dy + Ey + Fy) / 3;
        var testX = deMidX + deNx;
        var testY = deMidY + deNy;
        var dToCenter = Math.sqrt(Math.pow(testX - triCenterX, 2) + Math.pow(testY - triCenterY, 2));
        var dFromCenter = Math.sqrt(Math.pow(deMidX - deNx - triCenterX, 2) + Math.pow(deMidY - deNy - triCenterY, 2));
        if (dToCenter < dFromCenter) { deNx = -deNx; deNy = -deNy; }
        board.create('text', [deMidX + deNx * 0.8, deMidY + deNy * 0.8, '30'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // EG label: "b" — midpoint of EG, offset to the right
        var egMidX = (Ex + Gx) / 2 + 0.6;
        var egMidY = (Ey + Gy) / 2;
        board.create('text', [egMidX, egMidY, 'b'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
