<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grain Silo Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10, 19, 10, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var W = 6;
        var R = W / 2;
        var H_CYL = 12;
        var cx = 0;
        var yBase = 0;
        var yTop = yBase + H_CYL;
        var yDomeTop = yTop + R;

        var cylPts = [
            board.create('point', [cx - R, yBase], { visible: false, fixed: true, name: '' }),
            board.create('point', [cx + R, yBase], { visible: false, fixed: true, name: '' }),
            board.create('point', [cx + R, yTop],  { visible: false, fixed: true, name: '' }),
            board.create('point', [cx - R, yTop],  { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', cylPts, {
            fillColor: '#E5E7EB', fillOpacity: 0.30,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return cx + R * Math.cos(t); },
            function(t) { return yTop + R * Math.sin(t); },
            0, Math.PI
        ], {
            strokeColor: '#555555', strokeWidth: 2,
            fillColor: '#DBEAFE', fillOpacity: 0.30,
            fixed: true, highlight: false
        });

        board.create('segment', [[cx - R + 0.05, yTop], [cx + R - 0.05, yTop]], {
            strokeColor: '#E5E7EB', strokeWidth: 2.5, fixed: true, highlight: false, layer: 6
        });

        var dimX_left = cx - R - 1.8;
        board.create('segment', [[dimX_left, yBase], [dimX_left, yTop]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[dimX_left - 0.4, yTop], [dimX_left + 0.4, yTop]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[dimX_left - 0.4, yBase], [dimX_left + 0.4, yBase]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('text', [dimX_left - 0.3, yBase + H_CYL / 2, '48\\text{ ft}'], {
            useKatex: true, fontSize: 11, color: '#DC2626',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var dimX_right = cx + R + 1.8;
        board.create('segment', [[dimX_right, yTop], [dimX_right, yDomeTop]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[dimX_right - 0.4, yDomeTop], [dimX_right + 0.4, yDomeTop]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[dimX_right - 0.4, yTop], [dimX_right + 0.4, yTop]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('text', [dimX_right + 0.3, yTop + R / 2, '12\\text{ ft}'], {
            useKatex: true, fontSize: 11, color: '#DC2626',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var dimY_bot = yBase - 1.2;
        board.create('segment', [[cx - R, dimY_bot], [cx + R, dimY_bot]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[cx - R, dimY_bot - 0.4], [cx - R, dimY_bot + 0.4]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[cx + R, dimY_bot - 0.4], [cx + R, dimY_bot + 0.4]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('text', [cx, dimY_bot - 0.2, '24\\text{ ft}'], {
            useKatex: true, fontSize: 11, color: '#DC2626',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        board.create('segment', [[cx, yTop], [cx, yDomeTop]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
        board.create('point', [cx, yTop], {
            name: '', size: 1.5, color: '#0EA5E9', fixed: true, highlight: false
        });

        board.create('text', [cx, yBase + H_CYL / 2, '\\textit{cylinder}'], {
            useKatex: true, fontSize: 11, color: '#555555',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [cx + 0.2, yTop + R / 2 + 0.5, '\\textit{hemisphere}'], {
            useKatex: true, fontSize: 9, color: '#555555',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
