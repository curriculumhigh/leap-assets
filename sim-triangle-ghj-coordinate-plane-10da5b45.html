<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle GHJ on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 7.5, 8.5, -1.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 7.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var G = board.create('point', [-1, 2], {
            name: '', size: 3, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        var H = board.create('point', [3, 5], {
            name: '', size: 3, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        var J = board.create('point', [6, 1], {
            name: '', size: 3, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        // Triangle (no fill)
        board.create('polygon', [G, H, J], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels — name + coordinates, KaTeX
        // G: offset left-below
        board.create('text', [-1.2, 1.3, 'G(-1,\\,2)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // H: offset above
        board.create('text', [3, 5.6, 'H(3,\\,5)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // J: offset right-below
        board.create('text', [6.2, 0.3, 'J(6,\\,1)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle'
        });
    </script>
</body>
</html>
