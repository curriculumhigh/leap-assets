<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle with Altitude</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10, 20, 10, -4],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var A = board.create('point', [0, 15], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [-8, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [8, 0], { visible: false, fixed: true, name: '' });
        var M = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });

        // ── Triangle (shaded) ───────────────────────────────────────────
        board.create('polygon', [A, B, C], {
            fillColor: '#888888',
            fillOpacity: 0.12,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // ── Dashed altitude from apex to base midpoint ──────────────────
        board.create('segment', [A, M], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // ── Right-angle box at foot of altitude ─────────────────────────
        var boxSize = 0.8;
        var rp1 = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var rp2 = board.create('point', [boxSize, 0], { visible: false, fixed: true, name: '' });
        var rp3 = board.create('point', [boxSize, boxSize], { visible: false, fixed: true, name: '' });
        var rp4 = board.create('point', [0, boxSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [rp1, rp2], { strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false });
        board.create('segment', [rp2, rp3], { strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false });
        board.create('segment', [rp3, rp4], { strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false });

        // ── Tick marks on base halves (equal-length indicators) ─────────
        var tickLen = 0.6;
        board.create('segment', [[-4, -tickLen], [-4, tickLen]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[4, -tickLen], [4, tickLen]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Labels ──────────────────────────────────────────────────────

        // "17 in." on left side
        board.create('text', [-5.8, 8.2, '17 \\text{ in.}'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // "17 in." on right side
        board.create('text', [5.8, 8.2, '17 \\text{ in.}'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // "8 in." below left half of base
        board.create('text', [-4, -1.6, '8 \\text{ in.}'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // "8 in." below right half of base
        board.create('text', [4, -1.6, '8 \\text{ in.}'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // "h" beside the altitude
        board.create('text', [0.9, 7.5, 'h'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            anchorX: 'left',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
