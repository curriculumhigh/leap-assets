<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y = x/4 + 1 with Labeled Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 4, 8, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.6, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 3.65, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Line: y = x/4 + 1
        board.create('functiongraph', [function(x) { return x / 4 + 1; }], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Function label
        board.create('text', [4.8, 2.8, 'y = \\tfrac{x}{4} + 1'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        // All points — red, size 2
        board.create('point', [4, 2], {
            name: '', size: 2, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [0, 1], {
            name: '', size: 2, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [-4, 0], {
            name: '', size: 2, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [-2, 0], {
            name: '', size: 2, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [2, 2], {
            name: '', size: 2, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [6, 2], {
            name: '', size: 2, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });

        // Labels — all red, with clearance from axes and ticks
        board.create('text', [4.3, 2.25, 'A'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });
        board.create('text', [-2.4, 0.3, 'B'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });
        board.create('text', [0.3, 1.25, 'C'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });
        board.create('text', [2.3, 2.25, 'D'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });
        board.create('text', [-4.4, 0.3, 'E'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });
        board.create('text', [6.3, 2.25, 'F'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });
    </script>
</body>
</html>
