<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpendicular Chord Bisector Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.8, 5.5, -5.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;
        var COL_OUTLINE = '#555555';
        var COL_POINT = '#222222';
        var COL_MEASURE = '#3B82F6';
        var COL_MARK = '#DC2626';

        // ── Center P ────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [10, -10], useKatex: true }
        });

        // ── Circle ──────────────────────────────────────────────────────
        var circle = board.create('circle', [P, R], {
            strokeColor: COL_OUTLINE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // ── Diameter VW (vertical) ──────────────────────────────────────
        var V = board.create('point', [0, R], {
            name: 'V', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-4, 12], useKatex: true }
        });
        var W = board.create('point', [0, -R], {
            name: 'W', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-4, -18], useKatex: true }
        });
        board.create('segment', [V, W], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Intersection point N (on diameter, above center) ────────────
        var Ny = 1.5;
        var N = board.create('point', [0, Ny], {
            name: 'N', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [8, 8], useKatex: true }
        });

        // ── Chord EF (horizontal through N) ────────────────────────────
        var halfChord = Math.sqrt(R * R - Ny * Ny);

        var E = board.create('point', [-halfChord, Ny], {
            name: 'E', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-18, -4], useKatex: true }
        });
        var F = board.create('point', [halfChord, Ny], {
            name: 'F', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [10, -4], useKatex: true }
        });
        board.create('segment', [E, F], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle mark at N ───────────────────────────────────────
        var markSize = 0.35;
        board.create('segment', [[markSize, Ny], [markSize, Ny + markSize]], {
            strokeColor: COL_MARK, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[markSize, Ny + markSize], [0, Ny + markSize]], {
            strokeColor: COL_MARK, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Segment labels (measurement color, below chord) ─────────────
        var enMidX = (-halfChord + 0) / 2;
        var enMidY = Ny - 0.65;
        board.create('text', [enMidX, enMidY, '5x - 7'], {
            fontSize: 13, color: COL_MEASURE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });

        var nfMidX = (0 + halfChord) / 2;
        var nfMidY = Ny - 0.65;
        board.create('text', [nfMidX, nfMidY, '3x + 5'], {
            fontSize: 13, color: COL_MEASURE, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });
    </script>
</body>
</html>
