<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of a polynomial function</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .tick-lbl { text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 3px #fff; color: #222222; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board" role="img" aria-label="Graph of a polynomial function"></div>
        </div>
    </div>
    <script>
      // Answer-choice card: same fixed window, grid, ticks and stroke on every card in the set.
      var BB = [-3.75, 6.6, 3.75, -6.45];
      var FS = 10, AXFS = 12, TICK_H = 5;
      var CFG = {"xl": [{"pos": [1], "ax": "left", "ay": "bottom", "off": [3, 3]}, {"pos": [-1], "ax": "right", "ay": "bottom", "off": [-3, 3]}, {"pos": [2], "ax": "left", "ay": "top", "off": [3, -3]}, {"pos": [-2], "ax": "right", "ay": "top", "off": [-3, -3]}, {"pos": [3, -3], "ax": "middle", "ay": "top", "off": [0, -3]}], "yl": [{"pos": [4], "ay": "bottom", "off": [-4, 3]}, {"pos": [-4], "ay": "top", "off": [-4, -3]}]};
      var board = null;
      var el = document.getElementById('board');

      function f(x) { return (x * x - 1) * (x * x - 4); }

      // Fixed plotting window, stretched to the board (keepAspectRatio false) so the window
      // always fills the card exactly regardless of iframe size.
      function fitBox() { return BB.slice(); }

      var AXIS = {
        strokeColor: '#444444', strokeWidth: 1.2, highlight: false, fixed: true,
        lastArrow: { type: 2, size: 6 },
        ticks: { strokeColor: '#444444', strokeWidth: 1, majorHeight: TICK_H, minorTicks: 0,
                 ticksDistance: 1, insertTicks: false, drawLabels: false, drawZero: false }
      };

      // Tick labels (labels only, no marks); each group sits on the side of the axis/gridline
      // that the curve leaves clear: g = {pos, ax, ay, off}.
      function tickLabels(axis, g, isX) {
        board.create('ticks', [axis, g.pos], {
          minorTicks: 0, majorHeight: 0, drawZero: false, drawLabels: true,
          strokeOpacity: 0, highlight: false,
          label: { fontSize: FS, anchorX: g.ax || (isX ? 'middle' : 'right'), anchorY: g.ay || (isX ? 'top' : 'middle'),
                   offset: g.off || (isX ? [0, -3] : [-4, 0]), cssClass: 'tick-lbl', highlightCssClass: 'tick-lbl' }
        });
      }

      function build() {
        board = JXG.JSXGraph.initBoard('board', {
          boundingbox: fitBox(),
          keepAspectRatio: false,
          axis: true,
          grid: false,
          showNavigation: false,
          showCopyright: false,
          pan: { enabled: false },
          zoom: { enabled: false, wheel: false },
          defaultAxes: { x: AXIS, y: AXIS }
        });
        board.create('grid', [], {
          majorStep: [1, 1], minorElements: 0,
          strokeColor: '#D1D5DB', strokeWidth: 0.4, strokeOpacity: 1,
          major: { face: 'line', strokeColor: '#D1D5DB', strokeWidth: 0.4, strokeOpacity: 1 },
          minor: { visible: false },
          highlight: false, fixed: true, layer: 0
        });
        CFG.xl.forEach(function (g) { tickLabels(board.defaultAxes.x, g, true); });
        CFG.yl.forEach(function (g) { tickLabels(board.defaultAxes.y, g, false); });
        // Axis-name labels ("x" sits just below the arrow tip, clear of the "3" label on every card)
        board.create('text', [BB[2] - 0.25, -0.95, 'x'], {
          useKatex: true, fontSize: AXFS, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [0.4, BB[1] - 0.55, 'y'], {
          useKatex: true, fontSize: AXFS, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('functiongraph', [f], {
          strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
          numberPointsHigh: 2000, numberPointsLow: 800
        });
      }

      // Build only once the board has a real size (the editor may load this iframe while hidden),
      // and refit the bounding box whenever the iframe is resized.
      function sync() {
        var w = el.clientWidth, h = el.clientHeight;
        if (w < 20 || h < 20) return;
        if (!board) { build(); return; }
        board.resizeContainer(w, h, true, true);
        board.setBoundingBox(fitBox(), false);
        board.fullUpdate();
      }
      if (window.ResizeObserver) { new ResizeObserver(sync).observe(el); }
      window.addEventListener('resize', sync);
      window.addEventListener('load', sync);
      sync();
    </script>
</body>
</html>
