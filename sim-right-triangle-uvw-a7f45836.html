<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle UVW</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.5, 8.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var U = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false
        });
        var V = board.create('point', [6, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false
        });
        var W = board.create('point', [6, 3.5], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false
        });

        // Triangle edges
        board.create('segment', [U, V], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [V, W], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [U, W], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Right angle marker at V (small square)
        var sqSize = 0.45;
        var sq1 = board.create('point', [V.X() - sqSize, V.Y()], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [V.X() - sqSize, V.Y() + sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [V.X(), V.Y() + sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Vertex labels — bold, positioned just outside each corner
        board.create('text', [U.X() - 0.5, U.Y() - 0.5, '<b>U</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [V.X() + 0.5, V.Y() - 0.5, '<b>V</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [W.X() + 0.5, W.Y() + 0.5, '<b>W</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
