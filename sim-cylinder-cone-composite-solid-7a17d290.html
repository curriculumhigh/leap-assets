<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composite Solid: Cylinder + Cone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        canvas { width: 100%; height: 100%; cursor: grab; display: block; }
        canvas:active { cursor: grabbing; }
        .drag-hint {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: #999; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <canvas id="canvas3d"></canvas>
            <div class="drag-hint">Drag to rotate</div>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('canvas3d');
        var ctx = canvas.getContext('2d');

        // High-DPI support
        function resizeCanvas() {
            var wrapper = canvas.parentElement;
            var w = wrapper.clientWidth - 20;
            var h = wrapper.clientHeight - 20;
            var dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            draw();
        }

        // 3D parameters
        var R = 5;
        var hCyl = 9;
        var hCone = 7;
        var totalH = hCyl + hCone;

        // View angles (azimuth, elevation)
        var azimuth = -0.5;
        var elevation = 0.4;

        // Projection
        var scale = 8.5;

        function project(x, y, z) {
            var cosA = Math.cos(azimuth);
            var sinA = Math.sin(azimuth);
            var x1 = x * cosA - y * sinA;
            var y1 = x * sinA + y * cosA;
            var z1 = z;

            var cosE = Math.cos(elevation);
            var sinE = Math.sin(elevation);
            var y2 = y1 * cosE - z1 * sinE;
            var z2 = y1 * sinE + z1 * cosE;

            var cx = canvas.width / (2 * (window.devicePixelRatio || 1));
            var cy = canvas.height / (2 * (window.devicePixelRatio || 1));

            return {
                x: cx + x1 * scale,
                y: cy - z2 * scale,
                depth: y2
            };
        }

        function drawEllipse(centerX, centerY, centerZ, radius, color, lineWidth, dashed) {
            var nPts = 60;
            var pts = [];
            for (var i = 0; i <= nPts; i++) {
                var t = (2 * Math.PI * i) / nPts;
                var px = centerX + radius * Math.cos(t);
                var py = centerY + radius * Math.sin(t);
                pts.push(project(px, py, centerZ));
            }

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            if (dashed) ctx.setLineDash([4, 3]);
            else ctx.setLineDash([]);

            ctx.moveTo(pts[0].x, pts[0].y);
            for (var i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawSilhouetteLines(baseZ, topZ, radius, color, lineWidth) {
            var nSample = 60;
            var leftPts = [];
            var rightPts = [];

            for (var t = 0; t <= nSample; t++) {
                var angle = (2 * Math.PI * t) / nSample;
                var px = radius * Math.cos(angle);
                var py = radius * Math.sin(angle);
                var pBottom = project(px, py, baseZ);
                if (leftPts.length === 0 || pBottom.x < leftPts[0]) {
                    leftPts = [pBottom.x, angle];
                }
                if (rightPts.length === 0 || pBottom.x > rightPts[0]) {
                    rightPts = [pBottom.x, angle];
                }
            }

            var angles = [leftPts[1], rightPts[1]];
            for (var i = 0; i < angles.length; i++) {
                var a = angles[i];
                var p1 = project(radius * Math.cos(a), radius * Math.sin(a), baseZ);
                var p2 = project(radius * Math.cos(a), radius * Math.sin(a), topZ);
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }

            return angles;
        }

        function drawConeSlant(baseZ, apexZ, radius, color, lineWidth) {
            var nSample = 60;
            var leftAngle = 0, rightAngle = 0;
            var leftX = Infinity, rightX = -Infinity;

            for (var t = 0; t <= nSample; t++) {
                var angle = (2 * Math.PI * t) / nSample;
                var px = radius * Math.cos(angle);
                var py = radius * Math.sin(angle);
                var p = project(px, py, baseZ);
                if (p.x < leftX) { leftX = p.x; leftAngle = angle; }
                if (p.x > rightX) { rightX = p.x; rightAngle = angle; }
            }

            var apex = project(0, 0, apexZ);
            var angles = [leftAngle, rightAngle];
            for (var i = 0; i < angles.length; i++) {
                var a = angles[i];
                var base = project(radius * Math.cos(a), radius * Math.sin(a), baseZ);
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.moveTo(base.x, base.y);
                ctx.lineTo(apex.x, apex.y);
                ctx.stroke();
            }
        }

        function drawDimArrow(p1, p2, color, label, labelSide) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.setLineDash([3, 2]);
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);

            var dx = p2.x - p1.x;
            var dy = p2.y - p1.y;
            var len = Math.sqrt(dx * dx + dy * dy);
            var ux = dx / len;
            var uy = dy / len;
            var aSize = 5;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(p2.x - ux * aSize + uy * aSize * 0.4, p2.y - uy * aSize - ux * aSize * 0.4);
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(p2.x - ux * aSize - uy * aSize * 0.4, p2.y - uy * aSize + ux * aSize * 0.4);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p1.x + ux * aSize + uy * aSize * 0.4, p1.y + uy * aSize - ux * aSize * 0.4);
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p1.x + ux * aSize - uy * aSize * 0.4, p1.y + uy * aSize + ux * aSize * 0.4);
            ctx.stroke();

            var mx = (p1.x + p2.x) / 2;
            var my = (p1.y + p2.y) / 2;
            var offset = labelSide === 'left' ? -12 : 12;
            ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, mx + offset, my);
        }

        function drawRadiusDim(z, color) {
            var p1 = project(0, 0, z);
            var p2 = project(R, 0, z);

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.2;
            ctx.setLineDash([3, 2]);
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);

            var mx = (p1.x + p2.x) / 2;
            var my = (p1.y + p2.y) / 2;
            ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('5 cm', mx, my + 6);
        }

        function draw() {
            var w = canvas.width / (window.devicePixelRatio || 1);
            var h = canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, w, h);

            var COL_CYL = '#2563EB';
            var COL_CONE = '#059669';
            var COL_DIM = '#DC2626';

            var zOffset = -totalH / 2;

            ctx.save();

            // Draw cylinder
            drawEllipse(0, 0, zOffset, R, COL_CYL, 1.5, false);
            drawEllipse(0, 0, zOffset + hCyl, R, COL_CYL, 1.5, false);
            drawSilhouetteLines(zOffset, zOffset + hCyl, R, COL_CYL, 1.5);

            // Draw cone
            drawEllipse(0, 0, zOffset + hCyl, R, COL_CONE, 1.5, false);
            drawConeSlant(zOffset + hCyl, zOffset + totalH, R, COL_CONE, 1.5);

            // Apex point
            var apex = project(0, 0, zOffset + totalH);
            ctx.beginPath();
            ctx.arc(apex.x, apex.y, 3, 0, 2 * Math.PI);
            ctx.fillStyle = COL_CONE;
            ctx.fill();

            // Dimension labels
            var dimOffset = -R - 2;
            var hBot = project(dimOffset, 0, zOffset);
            var hTop = project(dimOffset, 0, zOffset + hCyl);
            drawDimArrow(hBot, hTop, COL_DIM, '9 cm', 'left');

            ctx.beginPath();
            ctx.strokeStyle = COL_DIM;
            ctx.lineWidth = 1;
            var tickH = 3;
            ctx.moveTo(hBot.x - tickH, hBot.y);
            ctx.lineTo(hBot.x + tickH, hBot.y);
            ctx.moveTo(hTop.x - tickH, hTop.y);
            ctx.lineTo(hTop.x + tickH, hTop.y);
            ctx.stroke();

            var dimOffset2 = R + 2;
            var cBot = project(dimOffset2, 0, zOffset + hCyl);
            var cTop = project(dimOffset2, 0, zOffset + totalH);
            drawDimArrow(cBot, cTop, COL_DIM, '7 cm', 'right');

            ctx.beginPath();
            ctx.strokeStyle = COL_DIM;
            ctx.lineWidth = 1;
            ctx.moveTo(cBot.x - tickH, cBot.y);
            ctx.lineTo(cBot.x + tickH, cBot.y);
            ctx.moveTo(cTop.x - tickH, cTop.y);
            ctx.lineTo(cTop.x + tickH, cTop.y);
            ctx.stroke();

            // Radius
            drawRadiusDim(zOffset, COL_DIM);

            ctx.restore();
        }

        // Drag to rotate
        var isDragging = false;
        var lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', function(e) {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            var dx = e.clientX - lastX;
            var dy = e.clientY - lastY;
            azimuth += dx * 0.01;
            elevation += dy * 0.01;
            elevation = Math.max(-1.2, Math.min(1.2, elevation));
            lastX = e.clientX;
            lastY = e.clientY;
            draw();
        });

        canvas.addEventListener('mouseup', function() { isDragging = false; });
        canvas.addEventListener('mouseleave', function() { isDragging = false; });

        // Touch support
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!isDragging) return;
            var dx = e.touches[0].clientX - lastX;
            var dy = e.touches[0].clientY - lastY;
            azimuth += dx * 0.01;
            elevation += dy * 0.01;
            elevation = Math.max(-1.2, Math.min(1.2, elevation));
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            draw();
        });

        canvas.addEventListener('touchend', function() { isDragging = false; });

        // Initial render
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
