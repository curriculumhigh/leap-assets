<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Graphs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 200px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 14px;
            justify-content: center;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 6px;
        }
        .legend-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }
        .legend-swatch {
            width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0;
        }
        .legend-eq { min-height: 22px; }
        .hover-msg {
            font-size: 11px; color: #888; line-height: 1.5;
            border-top: 1px solid #e5e7eb; padding-top: 12px; margin-top: 6px;
        }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Functions</div>
                    <div class="legend-row">
                        <div class="legend-swatch" style="background: #222222;"></div>
                        <div class="legend-eq" id="eq1"></div>
                    </div>
                    <div class="legend-row">
                        <div class="legend-swatch" style="background: #2563EB;"></div>
                        <div class="legend-eq" id="eq2"></div>
                    </div>
                </div>
                <div class="hover-msg">
                    Hover over the marked points to read their coordinates.
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>

    <script>
        // Render equations in panel
        katex.render('y = x^2 - 3x + 1', document.getElementById('eq1'), { throwOnError: false });
        katex.render('y = -x^2 + x + 1', document.getElementById('eq2'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 5.5, 5.5, -3.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'transparent',
                        label: { fontSize: 11, offset: [0, -14] },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'transparent',
                        label: { fontSize: 11, offset: [-14, 0] },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.1, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 5.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Colors
        var COL_F = '#222222';
        var COL_G = '#2563EB';
        var COL_INT = '#DC2626';

        // Function 1: y = x^2 - 3x + 1
        board.create('functiongraph', [function(x) { return x * x - 3 * x + 1; }], {
            strokeColor: COL_F, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Function 2: y = -x^2 + x + 1
        board.create('functiongraph', [function(x) { return -x * x + x + 1; }], {
            strokeColor: COL_G, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Tooltip logic
        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function formatValKatex(v) {
            var absV = Math.abs(v);
            var sign = v < 0 ? '-' : '';
            if (Math.abs(absV - 0.25) < 0.001) return sign + '\\tfrac{1}{4}';
            if (Math.abs(absV - 0.5) < 0.001) return sign + '\\tfrac{1}{2}';
            if (Math.abs(absV - 0.75) < 0.001) return sign + '\\tfrac{3}{4}';
            if (Math.abs(absV - 1.25) < 0.001) return sign + '\\tfrac{5}{4}';
            if (Math.abs(absV - 1.5) < 0.001) return sign + '\\tfrac{3}{2}';
            if (Math.abs(absV - 2.25) < 0.001) return sign + '\\tfrac{9}{4}';
            if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v));
            return v.toFixed(2);
        }

        function showTooltip(pt, color) {
            var xCoord = pt.X();
            var yCoord = pt.Y();
            var latex = '\\color{' + color + '}{\\left(' + formatValKatex(xCoord)
                      + ',\\,' + formatValKatex(yCoord) + '\\right)}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [xCoord, yCoord], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() { tooltip.style.display = 'none'; }

        // Intersection points: (0, 1) and (2, -1)
        var int1 = board.create('point', [0, 1], {
            name: '', size: 5, color: COL_INT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_INT, highlightStrokeColor: COL_INT
        });
        int1.on('over', function() { showTooltip(int1, COL_INT); });
        int1.on('out', function() { hideTooltip(); });

        var int2 = board.create('point', [2, -1], {
            name: '', size: 5, color: COL_INT, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_INT, highlightStrokeColor: COL_INT
        });
        int2.on('over', function() { showTooltip(int2, COL_INT); });
        int2.on('out', function() { hideTooltip(); });
    </script>
</body>
</html>
