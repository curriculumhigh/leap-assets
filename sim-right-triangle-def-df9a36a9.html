<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 24, 26, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var E = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            visible: true
        });
        var F = board.create('point', [21, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            visible: true
        });
        var D = board.create('point', [0, 20], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            visible: true
        });

        // ── Triangle ────────────────────────────────────────────────────
        board.create('polygon', [D, E, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at E ─────────────────────────────────────
        var sqSize = 1.4;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [-1.2, 20.4, '\\textbf{D}'], {
            fontSize: 15, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [-1.2, -1.2, '\\textbf{E}'], {
            fontSize: 15, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [22.2, -1.2, '\\textbf{F}'], {
            fontSize: 15, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // ── Side-length labels ──────────────────────────────────────────
        // DE = 20 (vertical leg, left side)
        board.create('text', [-2.2, 10, '20'], {
            fontSize: 14, color: '#3B82F6', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // EF = 21 (horizontal leg, bottom)
        board.create('text', [10.5, -2.2, '21'], {
            fontSize: 14, color: '#3B82F6', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // DF = 29 (hypotenuse)
        board.create('text', [12.2, 11.2, '29'], {
            fontSize: 14, color: '#3B82F6', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
