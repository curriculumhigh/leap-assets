<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise-linear velocity graph v(t)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 5.5, 11.8, -11.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Manual grid lines at every unit ──────────────────────────────
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]);
        var xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]);
        var yMax = Math.floor(bb[1]);
        var i;

        // Vertical grid lines
        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#9CA3AF', strokeWidth: 0.8,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        // Horizontal grid lines
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#9CA3AF', strokeWidth: 0.8,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        // ── Manual axes ──────────────────────────────────────────────────
        var xAxis = board.create('arrow', [[bb[0], 0], [bb[2], 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, bb[3]], [0, bb[1]]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Manual ticks + labels ────────────────────────────────────────
        var tickLen = 0.15;

        // X-axis ticks and labels (skip 0 and 11)
        for (i = xMin; i <= xMax; i++) {
            if (i === 0 || i === 11) continue;
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [i, -0.6, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Y-axis ticks and labels
        for (i = yMin; i <= yMax; i++) {
            if (i === 0) continue;
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [-0.55, i, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Axis labels (KaTeX)
        board.create('text', [11.0, -0.7, 't\\text{ (seconds)}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, 5.0, 'v\\text{ (cm/s)}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // ── Vertices ─────────────────────────────────────────────────────
        var P1 = [0, 3];
        var P2 = [4, -9];
        var P3 = [8, 3];
        var P4 = [10, 0];

        // Line segments — primary curve
        board.create('segment', [P1, P2], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [P2, P3], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [P3, P4], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points — size 3
        board.create('point', P1, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', P2, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', P3, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', P4, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels (KaTeX) — positioned to avoid overlaps
        board.create('text', [0.3, 3.6, '(0,\\, 3)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [4.3, -9.8, '(4,\\, {-9})'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [8.3, 3.6, '(8,\\, 3)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [10.15, 0.6, '(10,\\, 0)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Graph label v(t) — top-right area
        board.create('text', [9.5, 4.5, 'v(t)'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
