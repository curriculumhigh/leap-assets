<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment EF with Midpoint G and Line p</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 3.2, 14.5, -2.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Points E, G, F ─────────────────────────────────────────────
        var E = board.create('point', [1, 0], {
            name: 'E', fixed: true, size: 2.5, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, -18] }
        });

        var G = board.create('point', [7, 0], {
            name: 'G', fixed: true, size: 2.5, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, -18] }
        });

        var F = board.create('point', [13, 0], {
            name: 'F', fixed: true, size: 2.5, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, -18] }
        });

        // ── Segment EF ─────────────────────────────────────────────────
        board.create('segment', [E, F], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fixed: true, highlight: false
        });

        // ── Tick marks (congruence) on EG and GF ───────────────────────
        var tickH = 0.35;

        // Tick on EG (midpoint of EG = x:4, y:0)
        board.create('segment', [[4, -tickH], [4, tickH]], {
            strokeColor: '#555555', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Tick on GF (midpoint of GF = x:10, y:0)
        board.create('segment', [[10, -tickH], [10, tickH]], {
            strokeColor: '#555555', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Expression labels (KaTeX) above each half ───────────────────
        board.create('text', [4, 1.1, '7x - 4'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [10, 1.1, '4x + 8'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Line p through G at ~62° ───────────────────────────────────
        var angleRad = 62 * Math.PI / 180;
        var lineLen = 3.8;
        var dx = lineLen * Math.cos(angleRad);
        var dy = lineLen * Math.sin(angleRad);

        var pA = board.create('point', [7 - dx, 0 - dy], {
            name: '', visible: false, fixed: true
        });
        var pB = board.create('point', [7 + dx, 0 + dy], {
            name: '', visible: false, fixed: true
        });

        board.create('arrow', [pA, pB], {
            strokeColor: '#555555', strokeWidth: 1.5,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // Label p near the upper-right end of the line
        board.create('text', [7 + dx + 0.35, dy + 0.15, '<i>p</i>'], {
            fontSize: 14, color: '#555555',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
