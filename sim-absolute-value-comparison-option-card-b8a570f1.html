<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f(x)=|x-2| and g(x)=|2x-2|</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 5, 5, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.6, -0.35, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.15, 4.6, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // f(x) = |x - 2| — primary curve
        board.create('functiongraph', [function(x) { return Math.abs(x - 2); }], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // g(x) = |2x - 2| — secondary curve
        board.create('functiongraph', [function(x) { return Math.abs(2 * x - 2); }], {
            strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Labels — name only, shifted 0.5 units left
        board.create('text', [3.3, 2.2, 'f(x)'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [2.3, 4.2, 'g(x)'], {
            useKatex: true, fontSize: 12, color: '#2563EB', fixed: true, highlight: false
        });
    </script>
</body>
</html>
