<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph TP14</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 5, 4, -4],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        board.create('text', [3.55, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 4.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        board.create('segment', [[-4, 3], [-1, -2]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false, straightFirst: false, straightLast: false
        });
        board.create('segment', [[-1, -2], [3, 4]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false, straightFirst: false, straightLast: false
        });

        board.create('point', [-4, 3], {
            size: 4, fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5,
            fixed: true, name: '', showInfobox: false, highlight: false
        });
        board.create('point', [-1, -2], {
            size: 3, fillColor: '#222222', strokeColor: '#222222',
            fixed: true, name: '', showInfobox: false, highlight: false
        });
        board.create('point', [3, 4], {
            size: 4, fillColor: '#222222', strokeColor: '#222222',
            fixed: true, name: '', showInfobox: false, highlight: false
        });
    </script>
</body>
</html>
