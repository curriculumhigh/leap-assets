<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10, 770, 68, -80],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Grid lines — vertical (every 10 in t)
        var t;
        for (t = 0; t <= 60; t += 10) {
            board.create('line', [[t, 0], [t, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: false, straightLast: true,
                fixed: true, highlight: false
            });
            // Clip grid to data area
            board.create('segment', [[t, 0], [t, 700]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // Grid lines — horizontal (every 100 in P)
        var p;
        for (p = 0; p <= 700; p += 100) {
            board.create('segment', [[0, p], [60, p]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // Axes
        // t-axis (horizontal)
        board.create('arrow', [[-1, 0], [65, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // P-axis (vertical)
        board.create('arrow', [[0, -10], [0, 740]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels — t-axis
        for (t = 0; t <= 60; t += 10) {
            // Tick mark
            board.create('segment', [[t, -8], [t, 8]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [t, -30, String(t)], {
                fontSize: 11, color: '#333333', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Tick marks and labels — P-axis
        for (p = 100; p <= 700; p += 100) {
            // Tick mark
            board.create('segment', [[-1.2, p], [1.2, p]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [-5, p, String(p)], {
                fontSize: 11, color: '#333333', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [63, -30, '<i>t</i>'], {
            fontSize: 14, color: '#333333', anchorX: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [-5, 740, '<i>P</i>'], {
            fontSize: 14, color: '#333333', anchorX: 'right',
            fixed: true, highlight: false
        });

        // Logistic curve: P = 600 / (1 + 11 * e^(-0.12t))
        board.create('functiongraph', [
            function(x) {
                return 600 / (1 + 11 * Math.exp(-0.12 * x));
            },
            0, 60
        ], {
            strokeColor: '#2563EB', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
