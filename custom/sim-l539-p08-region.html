<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Region under y = 6/((x+1)(x+4)) from x = 0 to x = 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 1.8, 5.4, -0.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Axes ────────────────────────────────────────────────────────
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                drawLabels: true,
                label: { fontSize: 11, anchorX: 'middle', anchorY: 'top', offset: [0, -3] },
                strokeColor: '#444444',
                minorTicks: 0,
                ticksDistance: 1,
                majorHeight: 10,
                insertTicks: false,
                includeBoundaries: false,
                drawZero: false
            },
            highlight: false
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                drawLabels: true,
                label: { fontSize: 11, anchorX: 'right', anchorY: 'middle', offset: [-5, 0] },
                strokeColor: '#444444',
                minorTicks: 0,
                ticksDistance: 0.5,
                majorHeight: 10,
                insertTicks: false,
                includeBoundaries: false,
                drawZero: false
            },
            highlight: false
        });

        // Axis name labels
        board.create('text', [5.15, -0.06, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.08, 1.72, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Function ────────────────────────────────────────────────────
        function f(x) {
            return 6 / ((x + 1) * (x + 4));
        }

        // ── Shaded region (0 ≤ x ≤ 2) ──────────────────────────────────
        var N = 200;
        var shadePtsX = [];
        var shadePtsY = [];
        var dx = 2 / N;
        var i;

        // Bottom-left corner
        shadePtsX.push(0);
        shadePtsY.push(0);

        // Along the curve from x=0 to x=2
        for (i = 0; i <= N; i++) {
            var xi = i * dx;
            shadePtsX.push(xi);
            shadePtsY.push(f(xi));
        }

        // Bottom-right corner
        shadePtsX.push(2);
        shadePtsY.push(0);

        board.create('polygon', shadePtsX.map(function(px, idx) {
            return board.create('point', [px, shadePtsY[idx]], { visible: false, fixed: true, name: '' });
        }), {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { strokeWidth: 0, strokeColor: 'none', visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // ── Primary curve ───────────────────────────────────────────────
        board.create('functiongraph', [f, -0.5, 5], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Vertical dashed reference line at x = 2 ────────────────────
        board.create('segment', [[2, 0], [2, f(2)]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.0,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // ── Function label ──────────────────────────────────────────────
        board.create('text', [2.65, 1.1, 'y = \\dfrac{6}{(x+1)(x+4)}'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
