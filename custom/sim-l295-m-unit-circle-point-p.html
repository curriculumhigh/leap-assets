<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle on the Unit Circle</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
.wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
svg { width: 100%; height: 100%; max-width: 100%; max-height: 100%; display: block; background: #ffffff; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="-170 -170 340 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Unit circle with a shaded 120 degree angle at the origin and point P on the circle labeled with coordinates negative one half, root three over two">
  <circle cx="0" cy="0" r="110" fill="none" stroke="#7B8FB0" stroke-width="1.4"/>
  <line x1="-150" y1="0" x2="146" y2="0" stroke="#444444" stroke-width="1.5"/>
  <polygon points="156,0 144,-5 144,5" fill="#444444"/>
  <line x1="0" y1="150" x2="0" y2="-146" stroke="#444444" stroke-width="1.5"/>
  <polygon points="0,-156 -5,-144 5,-144" fill="#444444"/>
  <text x="152" y="20" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">x</text>
  <text x="14" y="-146" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">y</text>
  <path d="M 0 0 L 30.00 -0.00 A 30 30 0 0 0 -15.00 -25.98 Z" fill="#93C5FD" fill-opacity="0.75" stroke="#3B82F6" stroke-width="1"/>
  <text x="25.0" y="-38.3" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="middle">120°</text>
  <line x1="0" y1="0" x2="-55.00" y2="-95.26" stroke="#1E40AF" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="0.00" cy="0.00" r="3.2" fill="#222222"/>
  <text x="-10.0" y="18.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="end">O</text>
  <circle cx="-55.00" cy="-95.26" r="4.8" fill="#1E40AF"/>
  <text x="-63.0" y="-107.3" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="end">P</text>
  <text x="-61.0" y="-127.3" font-family="'Times New Roman', Times, serif" font-size="16" fill="#222222" text-anchor="end">(−1/2, √3/2)</text>
</svg>
</div>
</body>
</html>
