<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partial Sums S_n</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 5.5, 13.5, -0.7],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 8,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 11, offset: [0, -14] },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 8,
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { fontSize: 11, offset: [-14, 0] },
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels — positioned near arrow tips, clear of ticks
        board.create('text', [13.0, -0.4, 'n'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.35, 5.2, 'S_n'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });

        // Partial sums: S_n = 4 - 4(0.6)^n
        var data = [
            [1, 1.6],
            [2, 2.56],
            [3, 3.136],
            [4, 3.4816],
            [5, 3.68896],
            [6, 3.813376],
            [7, 3.8880256],
            [8, 3.93281536],
            [9, 3.959689216],
            [10, 3.97581353],
            [11, 3.985488118],
            [12, 3.991292871]
        ];

        for (var i = 0; i < data.length; i++) {
            board.create('point', [data[i][0], data[i][1]], {
                name: '',
                size: 4,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
