<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Option A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 320px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.6, 10.6, 10.6, -10.6],
            axis: false,
            grid: false,
            keepAspectRatio: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ──────────────────────────────────────────────── */
        var gridLayer = 1;
        var i;
        for (i = -8; i <= 10; i++) {
            board.create('line', [[i, -11], [i, 11]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true,
                straightFirst: true, straightLast: true, highlight: false,
                dash: 0, layer: gridLayer
            });
            board.create('line', [[-9, i], [11, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true,
                straightFirst: true, straightLast: true, highlight: false,
                dash: 0, layer: gridLayer
            });
        }

        /* ── Axes ──────────────────────────────────────────────── */
        var axisLayer = 6;

        // x-axis
        board.create('arrow', [[-8.6, 0], [10.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }, layer: axisLayer
        });
        // y-axis
        board.create('arrow', [[0, -10.6], [0, 10.6]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }, layer: axisLayer
        });

        /* ── Tick marks (small segments) ───────────────────────── */
        var tickSize = 0.25;
        for (i = -8; i <= 10; i++) {
            if (i === 0) continue;
            // x-axis ticks
            board.create('segment', [[i, -tickSize], [i, tickSize]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false, layer: axisLayer
            });
            // y-axis ticks
            board.create('segment', [[-tickSize, i], [tickSize, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false, layer: axisLayer
            });
        }

        /* ── Tick value labels ─────────────────────────────────── */
        var tickLabelLayer = 9;
        var xTickVals = [-6, -4, -2, 4, 6, 8];
        var yTickVals = [-8, -6, -4, -2, 2, 4, 6, 8];
        var tickBgStyle = 'background-color:#ffffff;padding:0 2px;';

        for (i = 0; i < xTickVals.length; i++) {
            board.create('text', [xTickVals[i], -0.7, String(xTickVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false, layer: tickLabelLayer,
                cssStyle: tickBgStyle
            });
        }
        for (i = 0; i < yTickVals.length; i++) {
            board.create('text', [-0.5, yTickVals[i], String(yTickVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false, layer: tickLabelLayer,
                cssStyle: tickBgStyle
            });
        }

        /* ── Axis name labels ──────────────────────────────────── */
        board.create('text', [10.5, 0.35, 'x'], {
            useKatex: true, fontSize: 13, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false, layer: tickLabelLayer
        });
        board.create('text', [-0.3, 10.0, 'y'], {
            useKatex: true, fontSize: 13, color: '#444444',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false, layer: tickLabelLayer
        });

        /* ── Asymptotes (dashed cyan, no labels) ────────────────── */
        var asymLayer = 3;

        // Vertical asymptote x = 1
        board.create('segment', [[1, -10.6], [1, 10.6]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: asymLayer
        });

        // Horizontal asymptote y = 3
        board.create('segment', [[-8.6, 3], [10.6, 3]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: asymLayer
        });

        /* ── Curve: y = -4/(x - 1) + 3, two branches ─────────── */
        var curveLayer = 5;
        var GAP = 0.12;

        // Left branch: x from -8.6 to 1 - GAP
        board.create('functiongraph', [
            function(x) { return -4 / (x - 1) + 3; },
            -8.6, 1 - GAP
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            layer: curveLayer
        });

        // Right branch: x from 1 + GAP to 10.6
        board.create('functiongraph', [
            function(x) { return -4 / (x - 1) + 3; },
            1 + GAP, 10.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            layer: curveLayer
        });

        /* ── Key point (2, -1) — layer above tick labels ──────── */
        var ptLayer = 10;

        board.create('point', [2, -1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false,
            showInfobox: false, layer: ptLayer
        });

        board.create('text', [2.3, -1.4, '(2,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false, layer: ptLayer,
            cssStyle: 'white-space:nowrap;'
        });

    </script>
</body>
</html>
