<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Region under y = ln x from x = 1 to x = e</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var E_VAL = Math.E;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 1.6, 4.6, -1.7],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── X-axis (no auto ticks/labels) ──────────────────────────
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: { drawLabels: false, majorHeight: 0, minorHeight: 0, drawZero: false, ticksDistance: 100 }
        });

        // ── Y-axis (no auto ticks/labels) ──────────────────────────
        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: { drawLabels: false, majorHeight: 0, minorHeight: 0, drawZero: false, ticksDistance: 100 }
        });

        // ── Axis name labels ──────────────────────────────────────
        board.create('text', [4.35, -0.18, '<i>x</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.12, 1.45, '<i>y</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        // ── Manual x-axis tick marks at 1, 2, 3, 4 ───────────────
        var xTickVals = [1, 2, 3, 4];
        for (var i = 0; i < xTickVals.length; i++) {
            board.create('segment', [[xTickVals[i], -0.05], [xTickVals[i], 0.05]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [xTickVals[i], -0.15, String(xTickVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Manual y-axis tick marks at -1 and 1 ──────────────────
        var yTickData = [
            { val: 1, label: '1' },
            { val: -1, label: '\u20131' }
        ];
        for (var j = 0; j < yTickData.length; j++) {
            board.create('segment', [[-0.05, yTickData[j].val], [0.05, yTickData[j].val]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [-0.12, yTickData[j].val, yTickData[j].label], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Custom tick mark at x = e ─────────────────────────────
        board.create('segment', [[E_VAL, -0.05], [E_VAL, 0.05]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // KaTeX "e" label below axis
        board.create('text', [E_VAL, -0.15, 'e'], {
            useKatex: true, fontSize: 11, anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        // ── Shaded region: y = ln(x) above x-axis, 1 ≤ x ≤ e ────
        var shadedN = 80;
        var shadedXcoords = [1];
        var shadedYcoords = [0];
        for (var k = 0; k <= shadedN; k++) {
            var sx = 1 + (E_VAL - 1) * k / shadedN;
            shadedXcoords.push(sx);
            shadedYcoords.push(Math.log(sx));
        }
        shadedXcoords.push(E_VAL);
        shadedYcoords.push(0);

        board.create('curve', [shadedXcoords, shadedYcoords], {
            strokeWidth: 0,
            fillColor: '#222222',
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        // ── Primary curve: y = ln(x) ──────────────────────────────
        board.create('functiongraph', [
            function(x) { return Math.log(x); },
            0.22, 4.4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Vertical dashed reference line at x = e ───────────────
        board.create('segment', [[E_VAL, 0], [E_VAL, Math.log(E_VAL)]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.0,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // ── Function label ────────────────────────────────────────
        board.create('text', [0.55, 1.2, 'y = \\ln x'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
