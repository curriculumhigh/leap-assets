<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Graph A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 320px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 14.9, 8.9, -1.3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ─────────────────────────────────────────────── */
        var i;
        // Vertical grid lines
        for (i = 0; i <= 8; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                straightFirst: true, straightLast: true,
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }
        // Horizontal grid lines
        for (i = 0; i <= 14; i++) {
            board.create('line', [[0, i], [1, i]], {
                straightFirst: true, straightLast: true,
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        /* ── Axes ─────────────────────────────────────────────── */
        // x-axis
        var xAxis = board.create('arrow', [[-0.9, 0], [8.9, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // y-axis
        var yAxis = board.create('arrow', [[0, -1.3], [0, 14.9]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks & labels ──────────────────────────────── */
        var tickLen = 0.18;
        var xLabelSet = [2, 4, 6, 8];
        var yLabelSet = [2, 4, 6, 8, 10, 12, 14];
        var tickStyle = 'background-color:#ffffff;padding:0 2px;';

        // x-axis ticks
        for (i = 1; i <= 8; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (xLabelSet.indexOf(i) !== -1) {
                board.create('text', [i, -0.55, String(i)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'middle', anchorY: 'top',
                    cssStyle: tickStyle,
                    fixed: true, highlight: false
                });
            }
        }

        // y-axis ticks
        for (i = 1; i <= 14; i++) {
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (yLabelSet.indexOf(i) !== -1) {
                board.create('text', [-0.25, i, String(i)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'right', anchorY: 'middle',
                    cssStyle: tickStyle,
                    fixed: true, highlight: false
                });
            }
        }

        /* ── Axis names ───────────────────────────────────────── */
        board.create('text', [8.8, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.25, 14.4, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        /* ── Line segment y = 2.5x, 0 ≤ x ≤ 5.8 ─────────────── */
        board.create('segment', [[0, 0], [5.8, 14.5]], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Key points ───────────────────────────────────────── */
        board.create('point', [2, 5], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [4, 10], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        /* ── Coordinate labels ────────────────────────────────── */
        board.create('text', [2.3, 4.6, '(2,\\,5)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            cssStyle: 'white-space:nowrap;',
            fixed: true, highlight: false
        });
        board.create('text', [4.3, 9.6, '(4,\\,10)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            cssStyle: 'white-space:nowrap;',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
