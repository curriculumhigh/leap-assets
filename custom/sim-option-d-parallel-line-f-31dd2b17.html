<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option D — f(x) = 3x + 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px; margin: 0; padding: 6px;
            height: calc(100% - 12px);
        }
        .sim-layout {
            display: flex; gap: 12px; height: 100%;
        }
        .left-panel {
            width: 130px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .hover-msg {
            font-size: 12px; color: #888; line-height: 1.5; text-align: center;
        }
        .hover-icon {
            display: block; text-align: center; font-size: 22px; margin-bottom: 8px;
        }
        .board-wrapper {
            flex: 1; background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
            position: relative;
        }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="hover-msg">
                    <span class="hover-icon">🖱️</span>
                    Hover over the points to see their coordinates
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
                <div class="coord-tooltip" id="tooltip"></div>
            </div>
        </div>
    </div>

    <script>
        var COL_F = '#222222';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 8, 4, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 0,
                        minorHeight: 0
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 0,
                        minorHeight: 0
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.6, -0.5, '<i>x</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.2, 7.6, '<i>y</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        // ── f(x) = 3x + 2 ──────────────────────────────────────────────
        board.create('functiongraph', [
            function(x) { return 3 * x + 2; }
        ], {
            strokeColor: COL_F, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Tooltip setup ───────────────────────────────────────────────
        var tooltip = document.getElementById('tooltip');
        var boardWrapper = document.querySelector('.board-wrapper');

        function formatVal(v) {
            if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v));
            return v.toFixed(2);
        }

        function showTooltip(pt, color) {
            var xCoord = pt.X();
            var yCoord = pt.Y();
            var latex = '\\color{' + color + '}{\\left(' + formatVal(xCoord)
                      + ',\\,' + formatVal(yCoord) + '\\right)}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';

            var boardEl = document.getElementById('board');
            var rect = boardEl.getBoundingClientRect();
            var wrapperRect = boardWrapper.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [xCoord, yCoord], board);
            var sx = coords.scrCoords[1] + rect.left - wrapperRect.left;
            var sy = coords.scrCoords[2] + rect.top - wrapperRect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // ── Key points on f(x) = 3x + 2 ────────────────────────────────
        var fPoints = [[-1, -1], [0, 2], [1, 5]];
        for (var i = 0; i < fPoints.length; i++) {
            (function(px, py) {
                var pt = board.create('point', [px, py], {
                    name: '', size: 4, color: COL_F, fixed: true,
                    showInfobox: false, highlight: true,
                    highlightFillColor: COL_F, highlightStrokeColor: COL_F,
                    highlightSize: 6
                });
                pt.on('over', function() { showTooltip(pt, COL_F); });
                pt.on('out', function() { hideTooltip(); });
            })(fPoints[i][0], fPoints[i][1]);
        }
    </script>
</body>
</html>
