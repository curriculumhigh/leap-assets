<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curve with Concavity and Monotonicity</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 5, 5.5, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.1, -0.35, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 4.65, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Define a smooth piecewise curve using cubic Bezier-like segments
        // We'll use a spline through control points that satisfy the concavity/monotonicity requirements
        //
        // Requirements:
        // (-3,-1): increasing, concave down → peak near (-1, 4)
        // (-1, 1): decreasing, concave down → inflection at x=1
        // (1, 3): decreasing, concave up → valley near (3, 0.5)
        // (3, 5): increasing, concave up
        //
        // Key points: (-1, 4) local max, (3, 0.5) local min, inflection at x=1

        // Build the curve using a parametric approach with cubic segments
        // Segment 1: x in [-3, -1], increasing & concave down
        // Segment 2: x in [-1, 1], decreasing & concave down
        // Segment 3: x in [1, 3], decreasing & concave up
        // Segment 4: x in [3, 5], increasing & concave up

        // Use a function defined piecewise with cubics ensuring C1 continuity and correct concavity
        // f(-3) ~ 1.5, f(-1) = 4 (peak), f(1) ~ 2.2 (inflection), f(3) = 0.5 (valley), f(5) ~ 3.5

        // Segment 1: [-3, -1] increasing, concave down
        // f(-3)=1.5, f(-1)=4, f'(-1)=0 (peak), concave down (f''<0)
        // Use cubic: f(x) = a(x+1)^3 + b(x+1)^2 + c(x+1) + d
        // At x=-1: f=4, f'=0 → d=4, c=0
        // At x=-3: f(−3) = a(-2)^3 + b(-2)^2 + 0 + 4 = -8a + 4b + 4 = 1.5 → -8a + 4b = -2.5
        // Concave down: f''(x) = 6a(x+1) + 2b < 0 on [-3,-1]
        // At x=-1: f''=2b<0 → b<0
        // At x=-3: f''= 6a(-2)+2b = -12a+2b < 0
        // Choose: b = -0.5, then -8a + 4(-0.5) = -2.5 → -8a -2 = -2.5 → a = 0.0625
        // Check concavity: f''(x) = 6(0.0625)(x+1) + 2(-0.5) = 0.375(x+1) - 1
        // At x=-1: f''= -1 < 0 ✓
        // At x=-3: f''= 0.375(-2)-1 = -1.75 < 0 ✓
        // f'(x) = 3(0.0625)(x+1)^2 + 2(-0.5)(x+1) = 0.1875(x+1)^2 - (x+1)
        // At x=-3: f'(-3) = 0.1875(4) - (-2) = 0.75 + 2 = 2.75 > 0 ✓ (increasing)

        // Segment 2: [-1, 1] decreasing, concave down
        // f(-1)=4, f'(-1)=0, need f(1) and f'(1) for C1 with segment 3
        // At inflection x=1: f''(1)=0, and concavity changes from down to up
        // Let f(1) = 2.2, f'(1) = -0.9 (still decreasing at inflection)
        // f(x) = a(x+1)^3 + b(x+1)^2 + c(x+1) + d
        // d=4, c=0 (from f(-1)=4, f'(-1)=0)
        // f(1) = a(2)^3 + b(2)^2 + 0 + 4 = 8a + 4b + 4 = 2.2 → 8a+4b = -1.8
        // f'(1) = 3a(2)^2 + 2b(2) = 12a + 4b = -0.9
        // From equations: 8a+4b=-1.8 and 12a+4b=-0.9
        // Subtract: 4a = 0.9 → a = 0.225
        // 4b = -1.8 - 8(0.225) = -1.8 - 1.8 = -3.6 → b = -0.9
        // f''(x) = 6(0.225)(x+1) + 2(-0.9) = 1.35(x+1) - 1.8
        // At x=-1: f''= -1.8 < 0 ✓ (concave down)
        // At x=1: f''= 1.35(2)-1.8 = 2.7-1.8 = 0.9 ... that's >0, not 0!
        // Need f''(1)=0 for inflection. Let me re-derive.

        // Segment 2: [-1, 1], f(-1)=4, f'(-1)=0, f''(1)=0, concave down throughout
        // Actually, the inflection is AT x=1, meaning f'' changes sign there.
        // On (-1,1) concave down means f''<0, and at x=1 f''=0.
        // Let's use: f(x) = a(x+1)^3 + b(x+1)^2 + c(x+1) + d, with t = x+1 ∈ [0,2]
        // f(-1)=4 → d=4; f'(-1)=0 → c=0
        // f''(x) = 6a(x+1)+2b; f''(1) = 12a+2b = 0 → b = -6a
        // f'' on (-1,1): 6a·t + 2(-6a) = 6a(t-2); for t∈[0,2), if a>0 then f''=6a(t-2)<0 ✓
        // f(1) = 8a + 4(-6a) + 4 = 8a - 24a + 4 = -16a + 4
        // f'(1) = 12a + 4(-6a) = 12a - 24a = -12a
        // Want f(1) reasonable, say ~2.5: -16a+4=2.5 → a=0.09375
        // Then b = -6(0.09375) = -0.5625
        // f(1) = 2.5, f'(1) = -12(0.09375) = -1.125
        // f'' on segment: 6(0.09375)(t-2) = 0.5625(t-2) ≤ 0 for t∈[0,2] ✓

        // Segment 3: [1, 3] decreasing, concave up
        // f(1)=2.5, f'(1)=-1.125, f(3)=0.5, f'(3)=0 (valley)
        // f(x) = a(x-1)^3 + b(x-1)^2 + c(x-1) + d, with t=x-1 ∈ [0,2]
        // d = 2.5, c = -1.125
        // f(3) = 8a+4b+2(-1.125)+2.5 = 8a+4b+0.25 = 0.5 → 8a+4b = 0.25
        // f'(3) = 12a+4b+(-1.125) = 0 → 12a+4b = 1.125
        // Subtract: 4a = 0.875 → a = 0.21875
        // 4b = 0.25-8(0.21875) = 0.25-1.75 = -1.5 → b = -0.375
        // f''(x) = 6(0.21875)(x-1)+2(-0.375) = 1.3125(x-1)-0.75
        // At x=1: f''= -0.75 < 0 ... should be ≥0 for concave up!
        // Hmm. Need concave up on (1,3) with f''(1)=0 (inflection).
        // f''(1) = 2b = 0 → b = 0
        // Then: 8a + 0 = 0.25 → a = 0.03125
        // f'(3) = 12(0.03125)+0+(-1.125) = 0.375-1.125 = -0.75 ≠ 0
        // Valley not at x=3 with these constraints. Let me adjust.

        // Let me try a different approach: define the whole curve as a single smooth function
        // that satisfies all the qualitative requirements.

        // Use: f(x) = A·sin(πx/4 + φ) + Bx + C won't easily work.
        // Better: define via datapoints and use JSXGraph cardinal spline.

        // Key points for the spline:
        // x=-3: y=1.5, increasing, concave down
        // x=-2: y≈3.2 (increasing, concave down)
        // x=-1: y=4 (local max)
        // x=0: y≈3.3 (decreasing, concave down)
        // x=1: y≈2.5 (inflection point)
        // x=2: y≈1.2 (decreasing, concave up)
        // x=3: y=0.5 (local min)
        // x=4: y≈1.8 (increasing, concave up)
        // x=5: y≈3.5 (increasing, concave up)

        // Actually let me just carefully construct a piecewise cubic and plot it directly.

        // I'll define f(x) piecewise with exact cubics ensuring C2 at junctions:

        // Let me use a simpler parametric approach. Define data points and use
        // JSXGraph's cardinalSpline for a smooth interpolation.

        var dataX = [-3, -2.5, -2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
        // Construct y-values satisfying:
        // (-3,-1): increasing, concave down (slope decreasing)
        // (-1,1): decreasing, concave down (slope decreasing, i.e. more negative)
        // Wait — decreasing and concave down means f'<0 and f''<0, so slope becomes more negative.
        // At x=1: inflection, f''=0
        // (1,3): decreasing, concave up (f'<0, f''>0, slope increasing toward 0)
        // (3,5): increasing, concave up (f'>0, f''>0)

        // Let me carefully pick values:
        // Peak at (-1, 4), valley at (3, 0.5)
        // f(-3) ≈ 1.5
        // Increasing concave down from 1.5 to 4:
        //   slopes decreasing: large positive → 0
        //   f(-2.5)≈2.3, f(-2)≈3.0, f(-1.5)≈3.6, f(-1)=4
        // Decreasing concave down from (-1,4):
        //   f'(-1)=0, f''<0, slopes: 0 → more negative
        //   f(-0.5)≈3.85, f(0)≈3.5, f(0.5)≈3.0, f(1)≈2.4
        // Inflection at x=1, f(1)≈2.4
        // Decreasing concave up from (1, 2.4) to (3, 0.5):
        //   slopes: negative → 0
        //   f(1.5)≈1.8, f(2)≈1.2, f(2.5)≈0.75, f(3)=0.5
        // Increasing concave up from (3, 0.5):
        //   f'(3)=0, f''>0
        //   f(3.5)≈0.65, f(4)≈1.2, f(4.5)≈2.1, f(5)≈3.5

        var dataY = [1.5, 2.3, 3.0, 3.6, 4.0, 3.85, 3.5, 3.0, 2.4, 1.85, 1.25, 0.75, 0.5, 0.6, 1.2, 2.1, 3.5];

        // Use cardinalSpline
        var splineData = [];
        for (var i = 0; i < dataX.length; i++) {
            splineData.push([dataX[i], dataY[i]]);
        }

        board.create('cardinalspline', [splineData, 0.5, 'centripetal'], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points: local max (-1, 4), local min (3, 0.5), inflection (1, 2.4)
        board.create('point', [-1, 4], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [3, 0.5], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [1, 2.4], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Labels for key points
        board.create('text', [-1, 4.4, '(-1,\\, 4)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [3, -0.3, '(3,\\, 0.5)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [1.0, 1.7, '(1,\\, 2.4)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false, anchorX: 'middle'
        });
    </script>
</body>
</html>
