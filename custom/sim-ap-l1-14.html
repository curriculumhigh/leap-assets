<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-hump rate curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); box-sizing: border-box; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); box-sizing: border-box; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
var board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-1, 52, 25, -3], axis: true,
    showNavigation: false, showCopyright: false,
    pan: { enabled: false }, zoom: { enabled: false },
    defaultAxes: {
        x: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
             ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 4 } },
        y: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
             ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 10 } }
    },
    grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
});

// Downward parabola hump: peak (12,40), endpoints (0,2) and (24,2)
// f(t) = 40 - 38 * ((t-12)/12)^2
function fFunc(t) { return 40 - 38 * Math.pow((t - 12) / 12, 2); }

// Shaded region under the curve over [0,24]
function regionPts(a, b) {
    var pts = [[a, 0]];
    var n = 80;
    for (var i = 0; i <= n; i++) {
        var x = a + (b - a) * i / n;
        pts.push([x, fFunc(x)]);
    }
    pts.push([b, 0]);
    return pts;
}
board.create('polygon', regionPts(0, 24), {
    fillColor: '#059669', fillOpacity: 0.13, highlight: false,
    borders: { visible: false }, vertices: { visible: false }, fixed: true
});

// Primary rate curve
board.create('functiongraph', [fFunc, 0, 24], { strokeColor: '#2563EB', strokeWidth: 1.8, fixed: true, highlight: false });

// Peak marker (12,40)
board.create('point', [12, 40], { name: '', size: 2.5, color: '#2563EB', fixed: true, highlight: false, showInfobox: false });

// Axis labels with units
board.create('text', [24.7, -1.9, 't (hr)'], { fontSize: 13, fixed: true, highlight: false, anchorX: 'right' });
board.create('text', [0.4, 49.5, 'f (gal/hr)'], { fontSize: 13, fixed: true, highlight: false });
</script>
</body>
</html>
