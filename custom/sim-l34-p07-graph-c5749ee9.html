<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Function Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 480px; margin: 0; padding: 6px; height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.6, 7.6, 12.6, -9.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid (every 1 unit) ──────────────────────────────────── */
        var xMin = -3.6, xMax = 12.6, yMin = -9.6, yMax = 7.6;
        var i;
        for (i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        /* ── Axes ─────────────────────────────────────────────────── */
        // x-axis
        board.create('arrow', [[xMin, 0], [xMax, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // y-axis
        board.create('arrow', [[0, yMin], [0, yMax]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks (every 1 unit on both axes) ── */
        var tickLen = 0.18;

        // x-axis ticks (all integers)
        for (i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
            if (i === 0) continue;
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
        }

        // y-axis ticks (all integers)
        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            if (i === 0) continue;
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
        }

        /* ── Asymptotes (dashed cyan, no labels) ──────────────────── */
        // Vertical asymptote x = 5
        board.create('segment', [[5, yMin], [5, yMax]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
        // Horizontal asymptote y = -1
        board.create('segment', [[xMin, -1], [xMax, -1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        /* ── Curve y = -2/(x-5) - 1, split at x = 5 ─────────────── */
        var GAP = 0.15;

        // Left branch: xMin to 5 - GAP
        board.create('functiongraph', [
            function(x) { return -2 / (x - 5) - 1; },
            xMin, 5 - GAP
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Right branch: 5 + GAP to xMax
        board.create('functiongraph', [
            function(x) { return -2 / (x - 5) - 1; },
            5 + GAP, xMax
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Tick-value labels with white background (layer 9, above curves) ── */
        var tickLabelStyle = 'background-color:#ffffff;padding:0 2px;';
        var tickLabelLayer = 9;

        // x-axis labels: only at -2, 2, 4, 6, 8, 10
        var xTickValues = [-2, 2, 4, 6, 8, 10];
        for (i = 0; i < xTickValues.length; i++) {
            board.create('text', [xTickValues[i], -0.7, String(xTickValues[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: tickLabelStyle,
                layer: tickLabelLayer
            });
        }

        // y-axis labels: even numbers only
        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            if (i === 0 || i % 2 !== 0) continue;
            board.create('text', [-0.55, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: tickLabelStyle,
                layer: tickLabelLayer
            });
        }

        /* ── Axis name labels ─────────────────────────────────────── */
        board.create('text', [12.4, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.35, 7.15, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            fixed: true, highlight: false
        });

        /* ── Key point (6, -3) ──────────────────────────────────── */
        board.create('point', [6, -3], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        board.create('text', [6.3, -3.4, '(6,\\,-3)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
