<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y = -6/(x+4) + 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10.6, 10.6, 5.6, -6.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ──────────────────────────────────────────── */
        /* Vertical grid lines */
        var xi, yi;
        for (xi = -10; xi <= 5; xi++) {
            board.create('line', [[xi, 0], [xi, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }
        /* Horizontal grid lines */
        for (yi = -6; yi <= 10; yi++) {
            board.create('line', [[0, yi], [1, yi]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        /* ── Axes ──────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-10.6, 0], [5.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        var yAxis = board.create('arrow', [[0, -6.6], [0, 10.6]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        /* ── Tick marks and labels (every 1, values at evens only) ── */
        var tickLen = 0.15;
        var tickStyle = 'background-color:#ffffff;padding:0 2px;';

        /* X-axis ticks */
        for (xi = -10; xi <= 5; xi++) {
            if (xi === 0) continue;
            board.create('segment', [[xi, -tickLen], [xi, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (xi % 2 === 0) {
                board.create('text', [xi, -0.55, String(xi)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'middle', anchorY: 'top',
                    fixed: true, highlight: false,
                    cssStyle: tickStyle
                });
            }
        }

        /* Y-axis ticks */
        for (yi = -6; yi <= 10; yi++) {
            if (yi === 0) continue;
            board.create('segment', [[-tickLen, yi], [tickLen, yi]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (yi % 2 === 0) {
                board.create('text', [-0.35, yi, String(yi)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'right', anchorY: 'middle',
                    fixed: true, highlight: false,
                    cssStyle: tickStyle
                });
            }
        }

        /* ── Axis name labels (KaTeX italic) ───────────────── */
        board.create('text', [5.5, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.3, 10.1, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        /* ── Asymptotes (dashed cyan, no labels) ───────────── */
        /* Vertical asymptote x = -4 */
        board.create('line', [[-4, 0], [-4, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            straightFirst: true, straightLast: true,
            fixed: true, highlight: false
        });
        /* Horizontal asymptote y = 1 */
        board.create('line', [[0, 1], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            straightFirst: true, straightLast: true,
            fixed: true, highlight: false
        });

        /* ── Curve y = -6/(x + 4) + 1 ─────────────────────── */
        var GAP = 0.12;

        /* Left branch: x < -4 - GAP */
        board.create('functiongraph', [
            function(x) { return -6 / (x + 4) + 1; },
            -10.6, -4 - GAP
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* Right branch: x > -4 + GAP */
        board.create('functiongraph', [
            function(x) { return -6 / (x + 4) + 1; },
            -4 + GAP, 5.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Key point (-2, -2) ────────────────────────────── */
        board.create('point', [-2, -2], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        board.create('text', [-1.75, -2.75, '(-2,\\,-2)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false,
            layer: 9,
            cssStyle: 'white-space:nowrap;display:inline-block;width:auto;background-color:#ffffff;padding:0 2px;'
        });
    </script>
</body>
</html>
