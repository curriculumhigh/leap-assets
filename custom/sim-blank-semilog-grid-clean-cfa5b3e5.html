<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blank semi-log grid (decades 1 to 1000)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.wrap { padding: 6px; }
.caption { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #555; text-align: center; margin: 0 0 4px 0; }
.board-card { background: white; border-radius: 6px; padding: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="caption">Semi-log grid — y-axis from 10⁰ to 10³</div>
  <div class="board-card"><div id="board" style="width:540px; height:420px;"></div></div>
</div>
<script>
var SUP = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
var COL_MAJOR = '#000000';
var COL_MINOR = '#777777';

var b = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-0.85, 3.32, 5.5, -0.30],
    axis: false, showNavigation: false, showCopyright: false,
    pan: { enabled: false }, zoom: { enabled: false }, keepAspectRatio: false
});

var xmin = 0, xmax = 5, xstep = 1;
var yMinDec = 0, yMaxDec = 3;

for (var i = yMinDec; i <= yMaxDec; i++) {
    b.create('line', [[xmin, i], [xmax, i]], {
        straightFirst:false, straightLast:false,
        strokeColor: COL_MAJOR, strokeWidth: 1.0, fixed:true, highlight:false
    });
}
for (var dec = yMinDec; dec < yMaxDec; dec++) {
    for (var k = 2; k <= 9; k++) {
        b.create('line', [[xmin, dec + Math.log(k)/Math.LN10], [xmax, dec + Math.log(k)/Math.LN10]], {
            straightFirst:false, straightLast:false,
            strokeColor: COL_MINOR, strokeWidth: 0.4, fixed:true, highlight:false
        });
    }
}
for (var x = xmin; x <= xmax + 0.0001; x += xstep) {
    b.create('line', [[x, yMinDec], [x, yMaxDec]], {
        straightFirst:false, straightLast:false,
        strokeColor: COL_MAJOR, strokeWidth: 1.0, fixed:true, highlight:false
    });
}

// Decade labels only (no minor-line value labels)
for (var i = yMinDec; i <= yMaxDec; i++) {
    b.create('text', [xmin - 0.20, i, '10' + SUP[i]], {
        fontSize: 16, color: '#000', anchorX: 'right', anchorY: 'middle',
        fixed: true, highlight: false, cssStyle: 'font-weight: 700;'
    });
}

// X-axis labels
for (var x = xmin; x <= xmax + 0.0001; x += xstep) {
    b.create('text', [x, yMinDec - 0.12, String(Math.round(x))], {
        fontSize: 13, color: '#000', anchorX: 'middle', anchorY: 'top',
        fixed: true, highlight: false
    });
}
</script>
</body>
</html>
