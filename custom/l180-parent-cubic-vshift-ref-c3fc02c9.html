<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 360px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 7, 8, -6], keepAspectRatio: false,
            axis: false, grid: false, showNavigation: false, showCopyright: false,
            pan: { enabled: false }, zoom: { enabled: false } });
        board.create('grid', [], { strokeColor: '#D1D5DB', strokeWidth: 0.4 });
        board.create('axis', [[0, 0], [1, 0]], { strokeColor: '#444444', strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 }, lastArrow: { type: 2, size: 6 },
            ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1, drawZero: false }, highlight: false });
        board.create('axis', [[0, 0], [0, 1]], { strokeColor: '#444444', strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 }, lastArrow: { type: 2, size: 6 },
            ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1, drawZero: false }, highlight: false });
        board.create('text', [7.4, -0.55, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 6.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('functiongraph', [function(x){ return (3/8)*(x+1)*(x-2)*(x-4); }], { strokeColor: '#3B5BDB', strokeWidth: 2.2, fixed: true, highlight: false });
        board.create('text', [-0.9, 1.2, '<i>f</i>(<i>x</i>)'], { fontSize: 15, cssStyle: 'color:#3B5BDB;', fixed: true, highlight: false });
        board.create('point', [1.25, 1.7402], { size: 3, fillColor: '#3B5BDB', strokeColor: '#3B5BDB', fixed: true, highlight: false, withLabel: false });
        board.create('text', [1.5, 2.45, '(x₀, y₀)'], { fontSize: 15, fixed: true, highlight: false });
    </script>
</body>
</html>
