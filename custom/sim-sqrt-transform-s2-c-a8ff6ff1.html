<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sqrt option S2-C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
.board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
#board { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="container">
<div class="board-wrapper">
<div id="board"></div>
</div>
</div>
<script>
var board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-3, 5, 9, -3],
    axis: true,
    grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
    showNavigation: false,
    showCopyright: false,
    pan: { enabled: false },
    zoom: { enabled: false },
    defaultAxes: {
        x: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 2 } },
        y: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 } }
    }
});
var COL_REF = '#2563EB';
var COL_CAND = '#D97706';
board.create('text', [8.5, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
board.create('text', [0.3, 4.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });
board.create('functiongraph', [function(x){ return Math.sqrt(x); }, 0, 9], { strokeColor: COL_REF, strokeWidth: 1.5, fixed: true, highlight: false });
board.create('point', [0, 0], { name: '', size: 3, fillColor: COL_REF, strokeColor: COL_REF, fixed: true, withLabel: false, highlight: false });
board.create('text', [1.3, 0.55, 'f'], { useKatex: true, fontSize: 13, color: COL_REF, fixed: true, highlight: false });
board.create('functiongraph', [function(x){ return Math.sqrt(x) + 2; }, 0, 9], { strokeColor: COL_CAND, strokeWidth: 1.8, fixed: true, highlight: false });
board.create('point', [0, 2], { name: '', size: 4, fillColor: COL_CAND, strokeColor: COL_CAND, fixed: true, withLabel: false, highlight: false });
</script>
</body>
</html>
