<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parabola: vertex (-3, 2), opens right</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:transparent;
              font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
.container { max-width:520px; margin:0 auto; padding:6px; height:calc(100% - 12px); box-sizing:border-box; }
.board-wrapper { background:white; border-radius:8px; padding:10px; height:100%; box-sizing:border-box; }
#board { width:100%; height:100%; }
</style>
</head>
<body>
<div class="container">
  <div class="board-wrapper"><div id="board"></div></div>
</div>
<script>
var board = JXG.JSXGraph.initBoard('board', {
  boundingbox: [-5, 6, 4, -3],
  axis: true,
  keepAspectRatio: true,
  showCopyright: false, showNavigation: false,
  pan: { enabled: false }, zoom: { wheel: false },
  defaultAxes: {
    x: {
      strokeColor: '#444444', strokeWidth: 1.2,
      lastArrow: { type: 2, size: 6 },
      ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
    },
    y: {
      strokeColor: '#444444', strokeWidth: 1.2,
      lastArrow: { type: 2, size: 6 },
      ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
    }
  },
  grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
});

// Axis labels
board.create('text', [3.5, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
board.create('text', [0.3, 5.65, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

// Parabola x = (y-2)²/8 - 3 (parametric, t = y - 2)
board.create('curve', [
  function(t) { return t*t / 8 - 3; },
  function(t) { return t + 2; },
  -3.7, 3.7
], { strokeColor: '#222222', strokeWidth: 1.8, highlight: false, fixed: true });

// Vertex at (-3, 2)
board.create('point', [-3, 2], {
  name: 'vertex', showInfobox: false,
  label: { offset: [-50, -2], cssStyle: 'font-weight:600;color:#222222;font-size:13px;' },
  fillColor: '#222222', strokeColor: '#fff', strokeWidth: 1.5, size: 4,
  fixed: true, highlight: false
});

// Focus at (-1, 2)
board.create('point', [-1, 2], {
  name: 'F', showInfobox: false,
  label: { offset: [10, -2], cssStyle: 'font-weight:600;color:#DC2626;font-size:14px;' },
  fillColor: '#DC2626', strokeColor: '#fff', strokeWidth: 2, size: 5,
  fixed: true, highlight: false
});

board.update();
</script>
</body>
</html>
