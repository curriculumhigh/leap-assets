<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation Equation y = af(b(x-h))+k</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
        /* Fluid stage: the whole diagram is a fixed 720x360 canvas, scaled to fit
           whatever iframe box we get, centered both axes, aspect ratio preserved. */
        #stage-wrap {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #stage {
            width: 720px;
            height: 360px;
            transform-origin: center center;
            flex: 0 0 auto;
        }
        .card {
            position: relative;
            width: 720px;
            height: 360px;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            overflow: hidden;
        }
        /* SVG arrow overlay sits above the card background, below label text */
        #arrows {
            position: absolute;
            top: 0; left: 0;
            width: 720px; height: 360px;
            pointer-events: none;
            z-index: 1;
        }
        .equation {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 34px;
            line-height: 1;
            white-space: nowrap;
            z-index: 2;
        }
        .label {
            position: absolute;
            font-size: 13.5px;
            line-height: 1.35;
            color: #222222;
            z-index: 3;
            width: 250px;
        }
        .label.tl { top: 20px; left: 22px; text-align: left; }
        .label.tr { top: 20px; right: 22px; text-align: right; }
        .label.bl { bottom: 20px; left: 22px; text-align: left; }
        .label.br { bottom: 20px; right: 22px; text-align: right; }
        .c-a { color: #2563EB; font-weight: 600; }
        .c-b { color: #DC2626; font-weight: 600; }
        .c-h { color: #059669; font-weight: 600; }
        .c-k { color: #7C3AED; font-weight: 600; }
    </style>
</head>
<body>
    <div id="stage-wrap">
      <div id="stage">
    <div class="card" id="card">
        <svg id="arrows" viewBox="0 0 720 360">
            <defs>
                <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
                    <path d="M0,0 L6,3 L0,6 Z" fill="#444444"></path>
                </marker>
            </defs>
            <line id="ln-a" stroke="#444444" stroke-width="1" marker-end="url(#arrowhead)"></line>
            <line id="ln-k" stroke="#444444" stroke-width="1" marker-end="url(#arrowhead)"></line>
            <line id="ln-b" stroke="#444444" stroke-width="1" marker-end="url(#arrowhead)"></line>
            <line id="ln-h" stroke="#444444" stroke-width="1" marker-end="url(#arrowhead)"></line>
        </svg>

        <div class="equation" id="eq"></div>

        <div class="label tl">Vertical Scale by a factor of <span id="m-abs-a"></span>. (+Vertical Reflection if <span id="m-a-lt0"></span>.)</div>
        <div class="label tr">Vertical Translation by <span id="m-k"></span> units.</div>
        <div class="label bl">Horizontal Scale by a factor of <span id="m-frac"></span>. (+Horizontal Reflection if <span id="m-b-lt0"></span>.)</div>
        <div class="label br">Horizontal Translation by <span id="m-h"></span> units.</div>
    </div>
      </div>
    </div>

    <script>
        // The whole diagram is a fixed 720x360 "stage" scaled with CSS transform to fit
        // the iframe. Everything (equation, labels, SVG arrows) lives inside the stage and
        // scales together, so arrow endpoints are computed ONCE in the fixed 720x360
        // viewBox space and stay aligned at any scale.
        var STAGE_W = 720, STAGE_H = 360;

        function fitStage() {
            var scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
            var stage = document.getElementById('stage');
            if (stage) { stage.style.transform = 'scale(' + scale + ')'; }
        }

        // Render the equation + the KaTeX bits embedded in the corner labels. Runs once.
        function renderMathContent() {
            var latex =
                'y = ' +
                '\\htmlId{p-a}{\\textcolor{#2563EB}{a}}' +
                '\\,f\\!\\left(' +
                '\\htmlId{p-b}{\\textcolor{#DC2626}{b}}' +
                '\\left(x\\textcolor{#059669}{-}\\htmlId{p-h}{\\textcolor{#059669}{h}}\\right)\\right)' +
                '\\textcolor{#7C3AED}{+}\\htmlId{p-k}{\\textcolor{#7C3AED}{k}}';
            katex.render(latex, document.getElementById('eq'), {
                throwOnError: false, trust: true, strict: false, displayMode: false
            });
            function rm(id, tex) {
                var el = document.getElementById(id);
                if (el) { katex.render(tex, el, { throwOnError: false, displayMode: false }); }
            }
            rm('m-abs-a', '\\textcolor{#2563EB}{|a|}');
            rm('m-a-lt0', '\\textcolor{#2563EB}{a}<0');
            rm('m-k', '\\textcolor{#7C3AED}{k}');
            rm('m-frac', '\\frac{1}{\\textcolor{#DC2626}{|b|}}');
            rm('m-b-lt0', '\\textcolor{#DC2626}{b}<0');
            rm('m-h', '\\textcolor{#059669}{h}');
        }

        // Measure glyph positions and (re)draw the arrows, converting the post-transform
        // screen coordinates back to viewBox units by dividing by the measured scale.
        function layoutArrows() {
            var card = document.getElementById('card');
            var cardRect = card.getBoundingClientRect();
            var s = (cardRect.width / STAGE_W) || 1;  // actual visual scale of the card

            function centerOf(id) {
                var r = document.getElementById(id).getBoundingClientRect();
                return {
                    x: (r.left + r.width / 2 - cardRect.left) / s,
                    y: (r.top + r.height / 2 - cardRect.top) / s
                };
            }
            function shorten(x1, y1, x2, y2, pad) {
                var dx = x2 - x1, dy = y2 - y1;
                var len = Math.sqrt(dx * dx + dy * dy) || 1;
                return { x: x2 - dx / len * pad, y: y2 - dy / len * pad };
            }
            function setLine(lineId, sx, sy, targetId, padExtra) {
                var t = centerOf(targetId);
                var end = shorten(sx, sy, t.x, t.y, 10 + (padExtra || 0));
                var ln = document.getElementById(lineId);
                ln.setAttribute('x1', sx); ln.setAttribute('y1', sy);
                ln.setAttribute('x2', end.x); ln.setAttribute('y2', end.y);
            }
            // Arrow start points are fixed in the 720x360 viewBox; endpoints track glyphs.
            setLine('ln-a', 150, 74, 'p-a');
            setLine('ln-k', 655, 62, 'p-k', 8);
            setLine('ln-b', 150, 286, 'p-b', 8);
            setLine('ln-h', 590, 298, 'p-h', 8);
        }

        function relayout() { fitStage(); layoutArrows(); }

        function start() {
            renderMathContent();
            fitStage();
            // Defer arrow layout until the KaTeX web fonts are loaded, so glyph metrics
            // are final (measuring earlier anchors arrows to fallback-font positions that
            // then reflow). Re-lay-out on resize so scale changes stay aligned.
            var go = function () { requestAnimationFrame(relayout); };
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(go);
            }
            window.addEventListener('load', go);   // belt-and-suspenders
            window.addEventListener('resize', relayout);
        }

        if (window.katex) { start(); } else { window.addEventListener('load', start); }
    </script>
</body>
</html>
