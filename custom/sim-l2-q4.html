<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity of a particle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 520px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 6.8, 5.8, -4.8],
            axis: true,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            keepAspectRatio: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                }
            }
        });

        var COL = '#2563EB';

        var verts = [[0, 6], [3, 0], [5, -4]];

        // Piecewise-linear velocity curve v = v(t)
        board.create('polygonalchain', verts, {
            borders: { strokeColor: COL, strokeWidth: 1.8, highlight: false },
            vertices: { visible: false }, fillColor: 'none', fixed: true, highlight: false
        });

        // Dots at each vertex
        var i;
        for (i = 0; i < verts.length; i++) {
            board.create('point', [verts[i][0], verts[i][1]], {
                name: '', size: 2.5, fillColor: COL, strokeColor: COL,
                fixed: true, highlight: false, showInfobox: false
            });
        }

        // Curve label near the top-left of the rising part, clear of curve and axes
        board.create('text', [0.3, 5.5, 'v = v(t)'], {
            fontSize: 13, color: COL, fixed: true, highlight: false
        });

        // Axis-tip labels
        board.create('text', [5.5, -0.4, '<i>t</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.18, 6.5, '<i>v</i>'], { fontSize: 14, fixed: true, highlight: false });
    </script>
</body>
</html>
