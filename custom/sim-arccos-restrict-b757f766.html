<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arccos-restrict</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .container{max-width:470px;margin:0 auto;padding:6px;height:calc(100% - 12px);}
  .board-wrapper{background:white;border-radius:8px;padding:6px;height:calc(100% - 12px);}
  #board{width:100%;height:100%;}
</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
  var PI=Math.PI, XMIN=-3.5, XMAX=6.7, YMIN=-1.85, YMAX=1.95;
  var board=JXG.JSXGraph.initBoard('board',{
    boundingbox:[XMIN,YMAX,XMAX,YMIN],axis:false,
    showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
  board.create('axis',[[0,0],[1,0]],{strokeColor:'#444444',strokeWidth:1.2,lastArrow:{type:2,size:6},
    ticks:{strokeColor:'#444444',minorTicks:0,ticksDistance:PI/2,label:{visible:false},drawZero:false}});
  board.create('axis',[[0,0],[0,1]],{strokeColor:'#444444',strokeWidth:1.2,lastArrow:{type:2,size:6},
    ticks:{strokeColor:'#444444',minorTicks:0,ticksDistance:1,label:{fontSize:10},drawZero:false}});
  board.create('text',[XMAX-0.4,-0.3,'x'],{useKatex:true,fontSize:14,fixed:true,highlight:false});
  board.create('text',[0.2,YMAX-0.28,'y'],{useKatex:true,fontSize:14,fixed:true,highlight:false});

  // full cosine — faint
  board.create('functiongraph',[function(x){return Math.cos(x);},XMIN+0.1,XMAX-0.1],
    {strokeColor:'#9CA3AF',strokeWidth:1.2,fixed:true,highlight:false});
  // restricted branch [0, pi] — highlighted
  board.create('functiongraph',[function(x){return Math.cos(x);},0,PI],
    {strokeColor:'#2563EB',strokeWidth:2.6,fixed:true,highlight:false});

  function dot(x,y){return board.create('point',[x,y],{name:'',size:3,strokeColor:'#222222',fillColor:'#222222',fixed:true,highlight:false,showInfobox:false});}
  dot(0,1); dot(PI,-1);
  board.create('text',[0.12,1.28,'(0,\\ 1)'],{useKatex:true,fontSize:12,anchorX:'left',fixed:true,highlight:false});
  board.create('text',[PI,-1.32,'(\\pi,\\ -1)'],{useKatex:true,fontSize:12,anchorX:'middle',fixed:true,highlight:false});
  board.create('text',[-3.3,1.68,'\\text{restricted to }\\lbrack 0,\\ \\pi\\rbrack'],{useKatex:true,fontSize:12,color:'#2563EB',anchorX:'left',fixed:true,highlight:false});
</script></body></html>
