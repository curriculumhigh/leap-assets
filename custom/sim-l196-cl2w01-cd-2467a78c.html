<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concave Down Parabola with Secant Chords</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 440px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.6, 2.6, 3.6, -0.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [3.2, -0.15, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [-1.45, 2.45, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Title
        board.create('text', [1, 2.4, '\\text{concave down}'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // Parabola g(x) = -0.5*(x-1)^2 + 2
        board.create('functiongraph', [
            function(x) { return -0.5 * (x - 1) * (x - 1) + 2; },
            -1.3, 3.3
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 }
        });

        // Key points with hover-coordinate tooltips
        var pts = [[-1, 0], [0, 1.5], [1, 2], [2, 1.5], [3, 0]];
        for (var i = 0; i < pts.length; i++) {
            (function(coord){
                var P = board.create('point', coord, {
                    name: '', size: 4, color: '#222222', fixed: true, highlight: true, showInfobox: false
                });
                var tip = board.create('text', [coord[0], coord[1] + 0.2, ''], {
                    fontSize: 13, fixed: true, highlight: false, anchorX: 'middle',
                    cssStyle: 'background:#fff;border:1px solid #999;border-radius:3px;padding:1px 5px;', visible: false
                });
                P.on('over', function(){ tip.setText('(' + coord[0] + ', ' + coord[1] + ')'); tip.setAttribute({ visible: true }); });
                P.on('out', function(){ tip.setAttribute({ visible: false }); });
            })(pts[i]);
        }

        // Secant chords (blue)
        for (var j = 0; j < pts.length - 1; j++) {
            board.create('segment', [pts[j], pts[j + 1]], {
                strokeColor: '#2563EB', strokeWidth: 2, fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
