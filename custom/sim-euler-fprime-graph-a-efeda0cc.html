<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f prime graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.1, 4.7, 5.1, -2.7],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        /* ── Grid lines every 1 unit ─────────────────────────────── */
        var i;
        for (i = 0; i <= 4; i++) {
            board.create('line', [[i, -2], [i, 4]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false,
                point1: { visible: false }, point2: { visible: false }
            });
        }
        for (i = -2; i <= 4; i++) {
            if (i === 0) continue;
            board.create('line', [[-0.5, i], [4.5, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false,
                point1: { visible: false }, point2: { visible: false }
            });
        }

        /* ── Axes ────────────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-0.5, 0], [4.85, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -2.2], [0, 4.45]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks and labels — x-axis ──────────────────────── */
        var tickLen = 0.12;
        for (i = 1; i <= 4; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            board.create('text', [i, -0.45, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        /* ── Tick marks and labels — y-axis ──────────────────────── */
        for (i = -2; i <= 4; i++) {
            if (i === 0) continue;
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            var lbl = (i < 0) ? '\u22121' : String(i);
            if (i === -2) lbl = '\u22122';
            board.create('text', [-0.4, i, lbl], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        /* ── Axis name labels ────────────────────────────────────── */
        board.create('text', [4.75, -0.4, '<i>x</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.25, 4.35, '<i>y</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });

        /* ── Piecewise-linear graph of f′ ────────────────────────── */
        var pts = [[0, 1], [1, 3], [2, 2], [3, -1], [4, 0]];

        for (i = 0; i < pts.length - 1; i++) {
            board.create('segment', [pts[i], pts[i + 1]], {
                strokeColor: '#2563EB', strokeWidth: 1.8,
                fixed: true, highlight: false
            });
        }

        /* ── Solid dots at vertices ──────────────────────────────── */
        for (i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 4, color: '#2563EB',
                fixed: true, highlight: false, showInfobox: false
            });
        }

        /* ── Graph label  y = f′(x) ─────────────────────────────── */
        board.create('text', [1.5, 3.15, 'y = f\u2032(x)'], {
            fontSize: 13, color: '#2563EB', anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
