<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Additive translation h and k</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.container{max-width:700px;margin:0;padding:6px;height:calc(100% - 12px);}
.sim-layout{display:flex;gap:12px;height:100%;}
.left-panel{width:200px;flex-shrink:0;background:white;border-radius:8px;padding:14px 16px;box-sizing:border-box;}
.board-wrapper{flex:1;background:white;border-radius:8px;padding:10px;}
#board{width:100%;height:100%;}
.row{margin:0 0 14px;}
.lbl{font-size:14px;color:#111;margin-bottom:4px;}
input[type=range]{width:100%;}
.readout{margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-size:15px;color:#111;line-height:1.5;}
.hv{color:#2563EB;font-weight:600;}
</style>
</head>
<body>
<div class="container">
  <div class="sim-layout">
    <div class="left-panel">
      <div class="row"><div class="lbl"><i>h</i> = <span id="hval" class="hv">2</span></div>
        <input type="range" id="sh" min="-4" max="4" step="1" value="2"></div>
      <div class="row"><div class="lbl"><i>k</i> = <span id="kval" class="hv">1</span></div>
        <input type="range" id="sk" min="-4" max="4" step="1" value="1"></div>
      <div class="readout">
        <div><i>g</i>(<i>x</i>) = <i>f</i>(<i>x</i> + <span id="rh" class="hv">2</span>) + <span id="rk" class="hv">1</span></div>
        <div style="margin-top:6px;">vertex: (<span id="vx" class="hv">-2</span>, <span id="vy" class="hv">1</span>)</div>
      </div>
    </div>
    <div class="board-wrapper"><div id="board"></div></div>
  </div>
</div>
<script>
var hVal=2, kVal=1;
var board=JXG.JSXGraph.initBoard('board',{boundingbox:[-9,9,9,-7],axis:true,showNavigation:false,showCopyright:false,
  pan:{enabled:false},zoom:{enabled:false},
  defaultAxes:{x:{strokeColor:'#444444',strokeWidth:1.2,lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2}},
               y:{strokeColor:'#444444',strokeWidth:1.2,lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2}}},
  grid:{strokeColor:'#D1D5DB',strokeWidth:0.4}});
board.create('text',[8.5,-0.6,'<i>x</i>'],{fontSize:14,fixed:true,highlight:false});
board.create('text',[0.35,8.4,'<i>y</i>'],{fontSize:14,fixed:true,highlight:false});
// parent f(x)=|x| (dashed gray)
board.create('functiongraph',[function(x){return Math.abs(x);},-9,9],{strokeColor:'#9CA3AF',strokeWidth:1.4,dash:2,fixed:true,highlight:false});
board.create('text',[5.4,6.2,'<i>f</i>'],{fontSize:15,color:'#9CA3AF',fixed:true,highlight:false});
// transformed g(x)=|x+h|+k (blue)
board.create('functiongraph',[function(x){return Math.abs(x+hVal)+kVal;},-9,9],{strokeColor:'#2563EB',strokeWidth:2,fixed:true,highlight:false});
board.create('text',[function(){return -hVal-2.6;},function(){return kVal+3.0;},'<i>g</i>'],{fontSize:15,color:'#2563EB',fixed:true,highlight:false});
// vertex of g
board.create('point',[function(){return -hVal;},function(){return kVal;}],{name:'',size:3,fillColor:'#2563EB',strokeColor:'#2563EB',fixed:true,highlight:false,showInfobox:false});
function upd(){
  hVal=parseInt(document.getElementById('sh').value,10);
  kVal=parseInt(document.getElementById('sk').value,10);
  document.getElementById('hval').textContent=hVal;
  document.getElementById('kval').textContent=kVal;
  document.getElementById('rh').textContent=hVal;
  document.getElementById('rk').textContent=kVal;
  document.getElementById('vx').textContent=-hVal;
  document.getElementById('vy').textContent=kVal;
  board.update();
}
document.getElementById('sh').addEventListener('input',upd);
document.getElementById('sk').addEventListener('input',upd);
upd();
</script>
</body>
</html>
