<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Continuous Function</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.6, 6, 5.6, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.2, -0.4, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.3, 5.6, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Piecewise function definition:
        // Piece 1: Increasing on (-5, -2). From (-5, 1) to (-2, 3).
        // Piece 2: Constant on (-2, 1). f(x) = 3.
        // Piece 3: Decreasing on (1, 3). From (1, 3) to (3, 1).
        // Piece 4: Increasing on (3, 5). From (3, 1) to (5, 4).

        // Use smooth curves for the non-constant pieces
        // Piece 1: cubic-like from (-5, 1) to (-2, 3), increasing, arriving flat at x=-2
        // Piece 3: cubic-like from (1, 3) to (3, 1), decreasing, leaving flat at x=1 and arriving flat at x=3
        // Piece 4: cubic-like from (3, 1) to (5, 4), increasing, leaving flat at x=3

        function f(x) {
            if (x <= -2) {
                // Increasing on [-5, -2], from y=1 to y=3, smooth arrival at (-2,3)
                // Use a function that has zero derivative at x=-2
                // Map t from 0 to 1 as x goes from -5 to -2
                var t = (x + 5) / 3;
                // Smooth: y = 1 + 2*(1 - (1-t)^2) would give derivative at t=1 is 0... 
                // Actually use: y = 3 - 2*(1-t)^2 → at t=0: y=1, at t=1: y=3, derivative at t=1: 0
                return 3 - 2 * (1 - t) * (1 - t);
            } else if (x <= 1) {
                // Constant at y=3
                return 3;
            } else if (x <= 3) {
                // Decreasing on [1, 3], from y=3 to y=1, smooth departure from (1,3) and arrival at (3,1)
                // Map t from 0 to 1 as x goes from 1 to 3
                var t2 = (x - 1) / 2;
                // Smooth both ends: use cubic hermite or cosine interpolation
                // Cosine: y = 3 - 2 * (1 - cos(pi*t))/2 = 3 - (1 - cos(pi*t))
                return 3 - (1 - Math.cos(Math.PI * t2));
            } else {
                // Increasing on [3, 5], from y=1 to y=4, smooth departure from (3,1)
                // Map t from 0 to 1 as x goes from 3 to 5
                var t3 = (x - 3) / 2;
                // y = 1 + 3*t^2 would give zero derivative at t=0, y(1)=4
                return 1 + 3 * t3 * t3;
            }
        }

        // Draw the curve
        board.create('functiongraph', [f, -5, 5], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points: endpoints and turning points
        // Left endpoint (-5, f(-5))
        board.create('point', [-5, f(-5)], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Transition point (-2, 3)
        board.create('point', [-2, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Transition point (1, 3)
        board.create('point', [1, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Transition point (3, 1)
        board.create('point', [3, 1], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Right endpoint (5, f(5))
        board.create('point', [5, f(5)], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
