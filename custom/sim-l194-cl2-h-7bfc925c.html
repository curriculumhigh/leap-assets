<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangent Lines on Concave Down Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 6, 9, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [8.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 5.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // h(x) = -0.2*(x-5)^2 + 5
        function h(x) {
            return -0.2 * (x - 5) * (x - 5) + 5;
        }

        // h'(x) = -0.4*(x-5)
        function hPrime(x) {
            return -0.4 * (x - 5);
        }

        // Plot the curve with arrowheads at both ends
        board.create('functiongraph', [h, 0.5, 9], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 }
        });

        // Define points
        var pts = [
            { name: 'A', x: 1.5, offX: -0.35, offY: 0.45 },
            { name: 'B', x: 3.5, offX: -0.35, offY: 0.45 },
            { name: 'D', x: 5.0, offX: 0.0, offY: 0.45 },
            { name: 'C', x: 7.5, offX: 0.35, offY: -0.5 }
        ];

        var tangentHalfWidth = 0.6; // ~1.2 units total width

        for (var i = 0; i < pts.length; i++) {
            var px = pts[i].x;
            var py = h(px);
            var slope = hPrime(px);

            // Tangent segment: centered on point, ~1.2 units wide in x
            var dx = tangentHalfWidth;
            var x1 = px - dx;
            var y1 = py - slope * dx;
            var x2 = px + dx;
            var y2 = py + slope * dx;

            // Draw tangent segment
            board.create('segment', [[x1, y1], [x2, y2]], {
                strokeColor: '#0EA5E9',
                strokeWidth: 2,
                fixed: true,
                highlight: false
            });

            // Draw key point (on top of tangent)
            board.create('point', [px, py], {
                name: '',
                size: 5,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            // Label with KaTeX
            board.create('text', [px + pts[i].offX, py + pts[i].offY, pts[i].name], {
                fontSize: 14,
                color: '#222222',
                useKatex: true,
                fixed: true,
                highlight: false,
                anchorX: 'middle',
                anchorY: 'middle'
            });
        }
    </script>
</body>
</html>
