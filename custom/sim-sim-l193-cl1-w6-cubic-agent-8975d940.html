<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f(x) = x³ − 3x with Turning Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 5.5, 4, -5.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [3.6, -0.45, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.25, 5.1, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Function curve with arrowheads on both ends
        board.create('functiongraph', [
            function(x) { return x * x * x - 3 * x; }, -3.8, 3.8
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 }
        });

        // Reference drop-lines for peak (-1, 2)
        board.create('segment', [[-1, 0], [-1, 2]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [[0, 2], [-1, 2]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Reference drop-lines for valley (1, -2)
        board.create('segment', [[1, 0], [1, -2]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [[0, -2], [1, -2]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Key point: peak (-1, 2)
        board.create('point', [-1, 2], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false
        });

        // Key point: valley (1, -2)
        board.create('point', [1, -2], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false
        });

        // Label for peak
        board.create('text', [-1.0, 2.55, '(-1,\\, 2)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', useKatex: true, fixed: true, highlight: false
        });

        // Label for valley
        board.create('text', [1.0, -2.6, '(1,\\, -2)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
