<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secant Approaching Tangent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 6.5, 5, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.7, -0.4, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 6.2, 'y'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // f(x) = (x-2)^2 + 1
        function f(x) {
            return (x - 2) * (x - 2) + 1;
        }

        // Plot curve
        board.create('functiongraph', [f, -0.8, 4.6], {
            strokeColor: '#2563EB', strokeWidth: 2.2, fixed: true, highlight: false
        });

        // Function label
        board.create('text', [3.4, 3, 'f(x)'], {
            fontSize: 13, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });

        // Fixed point P1 at (1, 2)
        var P1 = board.create('point', [1, 2], {
            name: '', withLabel: false, size: 4, color: '#DC2626', fixed: true, highlight: false
        });

        // Dashed vertical segment from (1,0) to (1,2)
        board.create('segment', [[1, 0], [1, 2]], {
            strokeColor: '#9CA3AF', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Draggable glider A on the x-axis
        var xAxis = board.create('line', [[0, 0], [1, 0]], { visible: false });
        var A = board.create('glider', [2.6, 0, xAxis], {
            name: '', withLabel: false, size: 4, color: '#222222',
            showInfobox: false, highlight: true,
            highlightFillColor: '#222222', highlightStrokeColor: '#222222'
        });

        // Clamp A between 1.1 and 3.3
        A.on('drag', function() {
            var ax = A.X();
            if (ax < 1.1) { A.moveTo([1.1, 0]); }
            if (ax > 3.3) { A.moveTo([3.3, 0]); }
        });

        // Label 'a' below the axis for A
        board.create('text', [
            function() { return A.X(); },
            function() { return -0.4; },
            'a'
        ], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true,
            anchorX: 'middle', anchorY: 'middle', highlight: false
        });

        // Moving point P2 on the curve at x = A.X()
        var P2 = board.create('point', [
            function() { return A.X(); },
            function() { return f(A.X()); }
        ], {
            name: '', withLabel: false, size: 4, color: '#DC2626', fixed: true, highlight: false
        });

        // Dashed vertical segment from A to P2
        board.create('segment', [
            function() { return [A.X(), 0]; },
            function() { return [A.X(), f(A.X())]; }
        ], {
            strokeColor: '#9CA3AF', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Secant line through P1 and P2 (green dashed)
        board.create('line', [P1, P2], {
            strokeColor: '#16A34A', strokeWidth: 2, dash: 2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
