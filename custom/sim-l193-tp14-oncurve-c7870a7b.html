<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sine Curve with Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 3, 12.5, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: false
                    }
                }
            }
        });

        // Axis labels
        board.create('text', [12.1, -0.35, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.3, 2.7, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Function: f(x) = 2*sin(pi*x/6)
        function f(x) {
            return 2 * Math.sin(Math.PI * x / 6);
        }

        // Plot the curve on [0, 12]
        board.create('functiongraph', [f, 0, 12], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points on the curve
        var xP = 2, xQ = 4, xR = 8, xS = 10;

        // Point P
        board.create('point', [xP, f(xP)], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [xP - 0.5, f(xP) + 0.35, 'P'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Point Q
        board.create('point', [xQ, f(xQ)], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [xQ + 0.25, f(xQ) + 0.35, 'Q'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Point R
        board.create('point', [xR, f(xR)], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [xR - 0.5, f(xR) - 0.45, 'R'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Point S
        board.create('point', [xS, f(xS)], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [xS + 0.25, f(xS) - 0.45, 'S'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
