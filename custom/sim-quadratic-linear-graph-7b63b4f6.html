<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y=x²−2x−3 and y=6x−19</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 700px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .sim-layout {
            display: flex;
            gap: 12px;
            height: 100%;
        }
        .left-panel {
            width: 175px;
            flex-shrink: 0;
            background: white;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }
        .curve-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .curve-swatch {
            width: 28px;
            height: 3px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .curve-label {
            min-height: 22px;
            line-height: 1.4;
        }
        .board-wrapper {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 10px;
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="curve-item">
                    <div class="curve-swatch" style="background: #222222;"></div>
                    <div class="curve-label" id="label-parabola"></div>
                </div>
                <div class="curve-item">
                    <div class="curve-swatch" style="background: #2563EB;"></div>
                    <div class="curve-label" id="label-line"></div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            katex.render('y = x^2 - 2x - 3', document.getElementById('label-parabola'), { throwOnError: false });
            katex.render('y = 6x - 19', document.getElementById('label-line'), { throwOnError: false });
        });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 8, 7, -6],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false,
                label: {
                    fontSize: 11,
                    color: '#444444',
                    anchorX: 'middle',
                    offset: [0, -12]
                }
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false,
                label: {
                    fontSize: 11,
                    color: '#444444',
                    anchorX: 'right',
                    offset: [-8, 0]
                }
            }
        });

        board.create('text', [6.6, -0.5, '<i>x</i>'], {
            fontSize: 14,
            fixed: true,
            highlight: false,
            color: '#444444'
        });
        board.create('text', [0.25, 7.6, '<i>y</i>'], {
            fontSize: 14,
            fixed: true,
            highlight: false,
            color: '#444444'
        });

        board.create('functiongraph', [
            function(x) { return x * x - 2 * x - 3; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        board.create('functiongraph', [
            function(x) { return 6 * x - 19; }
        ], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        board.create('point', [4, 5], {
            name: '',
            size: 4,
            color: '#DC2626',
            strokeColor: '#DC2626',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
