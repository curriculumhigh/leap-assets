<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-curve height vs time</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.3, 5, 5, -0.3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: false
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.7, -0.18, 't'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.15, 4.7, 'h'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // Logistic S-curve: h(t) = 4.3 / (1 + exp(-2*(t - 2.25))) + 0.2
        // At t=0: 4.3/(1+exp(4.5))+0.2 ≈ 4.3/91.5+0.2 ≈ 0.247
        // At t=4.5: 4.3/(1+exp(-4.5))+0.2 ≈ 4.3/1.011+0.2 ≈ 4.45
        // Inflection near t=2.25
        board.create('functiongraph', [
            function(t) {
                return 4.3 / (1 + Math.exp(-2 * (t - 2.25))) + 0.2;
            },
            0, 4.8
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
