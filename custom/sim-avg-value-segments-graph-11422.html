<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Segments Graph of f</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var BB = [-2.75, 5.75, 8.75, -4.7];
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: BB,
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // units per pixel (for pixel-sized offsets)
        var UX = (BB[2] - BB[0]) / board.canvasWidth;
        var UY = (BB[1] - BB[3]) / board.canvasHeight;
        var i;

        /* ── Grid lines ─────────────────────────────────────────────── */
        for (i = -2; i <= 8; i++) {
            board.create('segment', [[i, -4], [i, 5]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }
        for (i = -4; i <= 5; i++) {
            board.create('segment', [[-2, i], [8, i]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }

        /* ── Axes ───────────────────────────────────────────────────── */
        board.create('arrow', [[-2.4, 0], [8.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });
        board.create('arrow', [[0, -4.4], [0, 5.5]], {
            strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        /* ── Ticks and tick labels ──────────────────────────────────── */
        for (i = -2; i <= 8; i++) {
            if (i === 0) continue;
            board.create('segment', [[i, -4 * UY], [i, 4 * UY]], { strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false });
            // x = 5 is where f crosses the axis heading down-right: nudge that label left, off the segment
            var dx = (i === 5) ? -6 : 0;
            board.create('text', [i + dx * UX, -12 * UY, (i < 0 ? '−' : '') + String(Math.abs(i))], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
            });
        }
        for (i = -4; i <= 5; i++) {
            if (i === 0) continue;
            board.create('segment', [[-4 * UX, i], [4 * UX, i]], { strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false });
            // y = 2 is where f crosses the y-axis rising to the right: lift that label above its grid line
            var isCross = (i === 2);
            board.create('text', [-8 * UX, isCross ? i + 3 * UY : i, (i < 0 ? '−' : '') + String(Math.abs(i))], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: isCross ? 'bottom' : 'middle', fixed: true, highlight: false
            });
        }
        board.create('text', [-7 * UX, -11 * UY, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
        });

        /* ── Axis name labels ───────────────────────────────────────── */
        board.create('text', [8.5, 14 * UY, 'x'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [12 * UX, 5.5, 'y'], {
            fontSize: 14, color: '#222222', anchorX: 'left', anchorY: 'middle', useKatex: true, fixed: true, highlight: false
        });

        /* ── f: line segments ───────────────────────────────────────── */
        var COL = '#222222';   // primary curve
        var pts = [[-1, 0], [1, 4], [3, 4], [5, 0], [7, -3]];
        for (i = 0; i < pts.length - 1; i++) {
            board.create('segment', [pts[i], pts[i + 1]], {
                strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
            });
        }
        for (i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 3, color: COL, fixed: true, highlight: false, showInfobox: false
            });
        }

        /* ── Function label ─────────────────────────────────────────── */
        board.create('text', [5.6, 2.4, 'y = f(x)'], {
            fontSize: 13, color: COL, anchorX: 'left', anchorY: 'bottom',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
