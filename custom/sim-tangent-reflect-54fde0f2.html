<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tangent-reflect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<!-- KaTeX loaded WITHOUT defer so `katex` exists before the board script runs -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
  .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
  #board { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="container">
  <div class="board-wrapper"><div id="board"></div></div>
</div>
<script>
  var A = -3, B = 2, C = Math.PI/8, D = 1;
  var XMIN = -3.4, XMAX = 3.4, YMIN = -8.5, YMAX = 8.5;

  var board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [XMIN, YMAX, XMAX, YMIN],
    axis: true, grid: true, showNavigation: false, showCopyright: false,
    pan: { enabled: false }, zoom: { enabled: false },
    defaultAxes: {
      x: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
           ticks: { strokeColor: '#444444', minorTicks: 0, ticksDistance: Math.PI/8,
                    label: { visible: false }, drawZero: false } },
      y: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
           ticks: { strokeColor: '#444444', minorTicks: 0, ticksDistance: 2,
                    label: { fontSize: 10 }, drawZero: false } }
    },
    grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
  });

  function f(x) { return A * Math.tan(B * (x - C)) + D; }

  // vertical asymptotes: B(x - C) = pi/2 + k*pi  ->  x = C + (pi/2 + k*pi)/B
  var asy = [];
  for (var k = -30; k <= 30; k++) {
    var xa = C + (Math.PI / 2 + k * Math.PI) / B;
    if (xa > XMIN + 0.02 && xa < XMAX - 0.02) asy.push(xa);
  }
  asy.sort(function (p, q) { return p - q; });
  for (var i = 0; i < asy.length; i++) {
    board.create('line', [[asy[i], 0], [asy[i], 1]],
      { straightFirst: true, straightLast: true, strokeColor: '#0EA5E9',
        strokeWidth: 1.0, dash: 2, fixed: true, highlight: false });
  }

  // primary tangent curve as separate branches between consecutive asymptotes
  var edges = [XMIN].concat(asy).concat([XMAX]);
  for (var j = 0; j < edges.length - 1; j++) {
    var L = edges[j] + 0.04, R = edges[j + 1] - 0.04;
    if (R <= L) continue;
    board.create('functiongraph', [f, L, R],
      { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
  }

  // x-axis labels at every pi/8 (KaTeX stacked fractions), so asymptotes land on labeled ticks
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function piLabel(k) {                       // k = multiple of pi/8, nonzero
    var sign = k < 0 ? '-' : '', a = Math.abs(k);
    var g = gcd(a, 8), num = a / g, den = 8 / g;
    var top = (num === 1 ? '\\pi' : num + '\\pi');
    return den === 1 ? sign + top : sign + '\\frac{' + top + '}{' + den + '}';
  }
  for (var kk = -7; kk <= 7; kk++) {
    if (kk === 0) continue;                   // origin
    board.create('text', [kk * Math.PI / 8, -0.75, piLabel(kk)],
      { useKatex: true, fontSize: 8, color: '#333333',
        anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false });
  }
</script>
</body>
</html>
