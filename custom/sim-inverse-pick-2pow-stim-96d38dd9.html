<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css"><script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script><style>html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.container{max-width:400px;margin:0 auto;padding:6px;height:calc(100% - 12px)}.board-wrapper{background:white;border-radius:8px;padding:10px;height:calc(100% - 20px)}#board{width:100%;height:100%}</style></head><body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div><script>var board=JXG.JSXGraph.initBoard("board",{boundingbox:[-2.5, 5, 5, -2],axis:true,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false},keepAspectRatio:false,defaultAxes:{x:{strokeColor:"#444444",strokeWidth:1.2,lastArrow:{type:2,size:6},ticks:{strokeColor:"#444444",label:{fontSize:11},minorTicks:0,ticksDistance:1}},y:{strokeColor:"#444444",strokeWidth:1.2,lastArrow:{type:2,size:6},ticks:{strokeColor:"#444444",label:{fontSize:11},minorTicks:0,ticksDistance:1}}},grid:{strokeColor:"#D1D5DB",strokeWidth:0.4}});board.create("functiongraph",[function(x){return Math.pow(2,x);},-2.5,5],{strokeColor:"#222222",strokeWidth:1.8,fixed:true,highlight:false});board.create("point",[0,1],{name:"",size:3,fillColor:"#222222",strokeColor:"#222222",fixed:true,showInfobox:false,highlight:false});board.create("point",[1,2],{name:"",size:3,fillColor:"#222222",strokeColor:"#222222",fixed:true,showInfobox:false,highlight:false});</script></body></html>
