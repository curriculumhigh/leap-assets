<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle on the Unit Circle</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
.wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
svg { width: 100%; height: 100%; max-width: 100%; max-height: 100%; display: block; background: #ffffff; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="-160 -160 320 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Negative angle theta of about 65 degrees measured clockwise in standard position, terminal side in Quadrant IV meeting the unit circle at P">
  <!-- unit circle -->
  <circle cx="0" cy="0" r="110" fill="none" stroke="#7B8FB0" stroke-width="1.4"/>
  <!-- axes -->
  <line x1="-146" y1="0" x2="140" y2="0" stroke="#444444" stroke-width="1.5"/>
  <polygon points="150,0 138,-5 138,5" fill="#444444"/>
  <line x1="0" y1="146" x2="0" y2="-140" stroke="#444444" stroke-width="1.5"/>
  <polygon points="0,-150 -5,-138 5,-138" fill="#444444"/>
  <text x="146" y="20" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">x</text>
  <text x="14" y="-140" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">y</text>
  <!-- ticks -->
  <line x1="110" y1="-4" x2="110" y2="4" stroke="#444444" stroke-width="1.2"/>
  <line x1="-110" y1="-4" x2="-110" y2="4" stroke="#444444" stroke-width="1.2"/>
  <line x1="-4" y1="-110" x2="4" y2="-110" stroke="#444444" stroke-width="1.2"/>
  <line x1="-4" y1="110" x2="4" y2="110" stroke="#444444" stroke-width="1.2"/>
  <text x="115" y="17" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="start">1</text>
  <text x="-114" y="17" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="end">−1</text>
  <text x="-8" y="-115" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="end">1</text>
  <text x="-8" y="127" font-family="'Times New Roman', Times, serif" font-size="15" fill="#222222" text-anchor="end">−1</text>
  <!-- rotation arc (clockwise) -->
  <path d="M 36.00 -0.00 A 36 36 0 0 1 22.66 27.98" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="15.78,32.36 25.80,31.86 19.51,24.09" fill="#DC2626"/>
  <text x="44" y="34" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="20" fill="#DC2626" text-anchor="middle">θ</text>
  <!-- initial side -->
  <line x1="0" y1="0" x2="110" y2="0" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- terminal side -->
  <line x1="0" y1="0" x2="46.49" y2="99.69" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="3.2" fill="#222222"/>
  <circle cx="46.49" cy="99.69" r="4.5" fill="#1E40AF"/>
  <text x="55.49" y="119.69" font-family="'Times New Roman', Times, serif" font-size="17" fill="#222222" text-anchor="start"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>)</text>
</svg>
</div>
</body>
</html>
