<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inflection Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // f''(x) = (x+1)(x-2) = x^2 - x - 2
        // Integrate: f'(x) = x^3/3 - x^2/2 - 2x + C1  (set C1=0)
        // Integrate: f(x) = x^4/12 - x^3/6 - x^2 + C2  (set C2=3 for nice vertical placement)
        // f(x) = x^4/12 - x^3/6 - x^2 + 3

        function f(x) {
            return x*x*x*x/12 - x*x*x/6 - x*x + 3;
        }

        // Compute y-values at inflection points
        var yAt_neg1 = f(-1); // (-1)^4/12 - (-1)^3/6 - 1 + 3 = 1/12 + 1/6 - 1 + 3 = 1/12 + 2/12 + 24/12 = 27/12 = 2.25
        var yAt_2 = f(2);     // 16/12 - 8/6 - 4 + 3 = 4/3 - 4/3 - 1 = -1

        // Determine y range
        // Check extremes on [-4, 4]
        var yVals = [];
        for (var t = -4; t <= 4; t += 0.1) { yVals.push(f(t)); }
        var yMin = Math.min.apply(null, yVals);
        var yMax = Math.max.apply(null, yVals);
        var yPad = (yMax - yMin) * 0.15;
        var bbYTop = Math.ceil(yMax + yPad);
        var bbYBot = Math.floor(yMin - yPad);

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.6, bbYTop, 4.6, bbYBot],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    firstArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    firstArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.2, -0.6, 'x'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, bbYTop - 0.5, 'f(x)'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Primary curve with arrowheads at both ends
        board.create('functiongraph', [f, -4, 4], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 }
        });

        // Inflection point at x = -1
        board.create('point', [-1, yAt_neg1], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-1.0, yAt_neg1 + 1.0, '(-1,\\, 2.25)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle'
        });

        // Inflection point at x = 2
        board.create('point', [2, yAt_2], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [2.0, yAt_2 - 1.0, '(2,\\, -1)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle'
        });
    </script>
</body>
</html>
