<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — Q(12,−5)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.2, 3.6, 14.6, -7.2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 2 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 2 }
                }
            },
            grid: false
        });

        // Disable pointer events on the board container
        document.getElementById('board').style.pointerEvents = 'none';

        // Points
        var O = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var Q = board.create('point', [12, -5], { name: '', size: 4, color: '#222222', fixed: true, highlight: false });
        var foot = board.create('point', [12, 0], { visible: false, fixed: true, name: '' });

        // Hypotenuse (blue)
        board.create('segment', [O, Q], {
            strokeColor: '#2563EB', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Vertical leg (red dashed)
        board.create('segment', [Q, foot], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // Horizontal leg (red dashed)
        board.create('segment', [O, foot], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // Right-angle marker at (12,0)
        var raSize = 0.5;
        board.create('segment', [[12, -raSize], [12 - raSize, -raSize]], {
            strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[12 - raSize, -raSize], [12 - raSize, 0]], {
            strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // Angle arc at O — clockwise from +x-axis to OQ (below axis)
        // For clockwise sweep in QIV, we use angle from Q to O to xAxisPt
        var xAxisPt = board.create('point', [1, 0], { visible: false, fixed: true, name: '' });
        board.create('angle', [Q, O, xAxisPt], {
            radius: 1.5,
            strokeColor: '#2563EB', strokeWidth: 1.2,
            fillColor: '#2563EB', fillOpacity: 0.08,
            fixed: true, name: '', withLabel: false
        });

        // Labels (KaTeX)
        // r on hypotenuse
        board.create('text', [4.8, -1.0, 'r'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false
        });

        // theta label (inside the angle wedge, above blue line OQ and below +x axis)
        board.create('text', [1.5, -0.32, '\\theta'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false
        });

        // y = -5 (right of vertical leg)
        board.create('text', [12.5, -2.5, 'y = -5'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });

        // x = 12 (above horizontal leg)
        board.create('text', [5.5, 0.5, 'x = 12'], {
            useKatex: true, fontSize: 13, color: '#DC2626', fixed: true, highlight: false
        });

        // Point label Q (lower-right)
        board.create('text', [12.5, -5.5, 'Q'], {
            useKatex: true, fontSize: 14, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
