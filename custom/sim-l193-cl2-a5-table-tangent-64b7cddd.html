<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concavity and Tangent Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 6, 3.5, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [3.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 5.6, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // f(x) = 0.08*(x+2)^3 + 2
        // f'(x) = 0.24*(x+2)^2
        // f''(x) = 0.48*(x+2)
        // Inflection at x = -2: f''(-2) = 0
        // x < -2: f''(x) < 0 → concave down
        // x > -2: f''(x) > 0 → concave up

        function f(x) {
            return 0.08 * Math.pow(x + 2, 3) + 2;
        }

        function fp(x) {
            return 0.24 * Math.pow(x + 2, 2);
        }

        // Primary curve
        board.create('functiongraph', [f, -6, 2], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Inflection point marker (key point, fixed)
        board.create('point', [-2, f(-2)], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false
        });

        // Draggable point P as a glider on the curve
        var curve = board.create('functiongraph', [f, -6, 2], {
            visible: false, fixed: true
        });

        var P = board.create('glider', [0, f(0), curve], {
            name: 'P', size: 5, color: '#222222',
            showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [10, 10] }
        });

        // Tangent line through P (cyan)
        var tangentLine = board.create('line', [
            function() {
                var xp = P.X();
                var yp = f(xp);
                var slope = fp(xp);
                // Point-slope: y - yp = slope*(x - xp)
                // Standard form: slope*x - y + (yp - slope*xp) = 0
                return [yp - slope * xp, slope, -1];
            }
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, fixed: true, highlight: false, dash: 0
        });

    </script>
</body>
</html>
