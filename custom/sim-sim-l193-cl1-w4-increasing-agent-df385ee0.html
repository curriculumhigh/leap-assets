<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increasing Function</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.3, 5.5, 6, -1.3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, visible: false },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, visible: false },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.6, -0.45, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 5.1, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Function definition
        function f(x) {
            return Math.sqrt(x + 1) + 0.6;
        }

        // Key x-values
        var aX = 1;
        var bX = 4;
        var faVal = f(aX);
        var fbVal = f(bX);

        // Primary curve
        board.create('functiongraph', [function(x) { return f(x); }, -1, 5.8], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Dashed red vertical drop-lines (point to x-axis)
        board.create('segment', [[aX, faVal], [aX, 0]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [[bX, fbVal], [bX, 0]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Dashed red horizontal lines (point to y-axis)
        board.create('segment', [[aX, faVal], [0, faVal]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [[bX, fbVal], [0, fbVal]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Key points on the curve
        board.create('point', [aX, faVal], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [bX, fbVal], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false
        });

        // Labels on x-axis: a and b
        board.create('text', [aX, -0.5, 'a'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'top',
            useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [bX, -0.5, 'b'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'top',
            useKatex: true, fixed: true, highlight: false
        });

        // Labels on y-axis: f(a) and f(b)
        board.create('text', [-0.15, faVal, 'f(a)'], {
            fontSize: 12, color: '#222222', anchorX: 'right', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [-0.15, fbVal, 'f(b)'], {
            fontSize: 12, color: '#222222', anchorX: 'right', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // Coordinate labels near the points
        board.create('text', [aX + 0.2, faVal + 0.3, '(a,\\, f(a))'], {
            fontSize: 12, color: '#222222', anchorX: 'left', anchorY: 'bottom',
            useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [bX + 0.2, fbVal + 0.3, '(b,\\, f(b))'], {
            fontSize: 12, color: '#222222', anchorX: 'left', anchorY: 'bottom',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
