<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euler Method — One Step</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.22, 5.35, 1.38, 1.05],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Grid: every 0.25 in x, every 0.5 in y ────────────────────
        var gridColor = '#D1D5DB';
        var gridWidth = 0.4;
        var ix, iy, gx, gy;

        // Vertical grid lines every 0.25 from 0 to 1.25
        for (gx = 0; gx <= 1.251; gx += 0.25) {
            board.create('line', [[gx, 0], [gx, 1]], {
                strokeColor: gridColor, strokeWidth: gridWidth,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        // Horizontal grid lines every 0.5 from 1.5 to 5
        for (gy = 1.5; gy <= 5.01; gy += 0.5) {
            board.create('line', [[0, gy], [1, gy]], {
                strokeColor: gridColor, strokeWidth: gridWidth,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        // ── Axes ──────────────────────────────────────────────────────
        var axisColor = '#444444';

        // y-axis (x = 0)
        board.create('arrow', [[0, 1.05], [0, 5.35]], {
            strokeColor: axisColor, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // x-axis (y = 1.5)
        board.create('arrow', [[-0.22, 1.5], [1.35, 1.5]], {
            strokeColor: axisColor, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Tick marks and labels ───────────────────────────────────
        var tickLenX = 0.045; // y-units for x-axis ticks
        var tickLenY = 0.018; // x-units for y-axis ticks (short)

        // x-axis ticks at 0.25, 0.5, 0.75, 1.0 (on y=1.5 line)
        var xTicks = [0.25, 0.5, 0.75, 1.0];
        for (ix = 0; ix < xTicks.length; ix++) {
            var xt = xTicks[ix];
            board.create('segment', [[xt, 1.5 - tickLenX], [xt, 1.5 + tickLenX]], {
                strokeColor: axisColor, strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Format label: remove trailing zeros, show "1" not "1.0"
            var xLabel;
            if (xt === Math.floor(xt)) {
                xLabel = xt.toFixed(0);
            } else {
                xLabel = xt.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
            }
            board.create('text', [xt, 1.5 - 0.16, xLabel], {
                fontSize: 11, color: '#333', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // y-axis ticks at 2, 2.5, 3, 3.5, 4, 4.5, 5 (on x=0 line)
        var yTicks = [2, 2.5, 3, 3.5, 4, 4.5, 5];
        for (iy = 0; iy < yTicks.length; iy++) {
            var yt = yTicks[iy];
            board.create('segment', [[-tickLenY, yt], [tickLenY, yt]], {
                strokeColor: axisColor, strokeWidth: 1.2, fixed: true, highlight: false
            });
            var ytLabel = (yt === Math.floor(yt)) ? yt.toFixed(0) : yt.toFixed(1);
            board.create('text', [-0.035, yt, ytLabel], {
                fontSize: 11, color: '#333', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [1.28, 1.5 - 0.25, 'x'], {
            fontSize: 14, color: '#333', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [0.05, 5.22, 'y'], {
            fontSize: 14, color: '#333', useKatex: true, fixed: true, highlight: false
        });

        // ── Slope field ─────────────────────────────────────────────
        // dy/dx = y - x
        var sfColor = '#B0B0B0';
        var sfWidth = 0.8;

        var sfXmin = 0, sfXmax = 1.2, sfYmin = 1.5, sfYmax = 5.0;
        var sfNx = 13, sfNy = 15;
        var sfDx = (sfXmax - sfXmin) / (sfNx - 1);
        var sfDy = (sfYmax - sfYmin) / (sfNy - 1);

        var screenW = 580;
        var screenH = 400;
        var xRange = 1.6;
        var yRange = 4.3;
        var visualLen = 14;

        for (ix = 0; ix < sfNx; ix++) {
            for (iy = 0; iy < sfNy; iy++) {
                var sx = sfXmin + ix * sfDx;
                var sy = sfYmin + iy * sfDy;
                var slope = sy - sx;

                var sxFactor = screenW / xRange;
                var syFactor = screenH / yRange;
                var screenMag = Math.sqrt(sxFactor * sxFactor + slope * slope * syFactor * syFactor);
                var ddx = visualLen / screenMag;
                var ddy = slope * visualLen / screenMag;

                board.create('segment', [[sx - ddx, sy - ddy], [sx + ddx, sy + ddy]], {
                    strokeColor: sfColor, strokeWidth: sfWidth,
                    fixed: true, highlight: false, layer: 1
                });
            }
        }

        // ── Solution curve y = x + 1 + e^x through (0,2) ──────────
        var COL_CURVE = '#2563EB';
        var COL_EULER = '#DC2626';

        board.create('functiongraph', [
            function(x) { return x + 1 + Math.exp(x); },
            -0.05, 1.25
        ], {
            strokeColor: COL_CURVE, strokeWidth: 1.8, fixed: true, highlight: false, layer: 5
        });

        // Curve label — moved above-left of the curve into empty space
        board.create('text', [0.42, 4.65, 'y = f(x)'], {
            fontSize: 13, color: COL_CURVE, useKatex: true,
            fixed: true, highlight: false, anchorX: 'left'
        });

        // ── Dashed vertical guide at x = 0.5 ───────────────────────
        var curveAt05 = 0.5 + 1 + Math.exp(0.5);

        board.create('segment', [[0.5, 1.5], [0.5, curveAt05]], {
            strokeColor: COL_EULER, strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 4
        });

        // ── Euler tangent segment from (0,2) to (0.5, 3) ───────────
        board.create('segment', [[0, 2], [0.5, 3]], {
            strokeColor: COL_EULER, strokeWidth: 1.5,
            fixed: true, highlight: false, layer: 6
        });

        // ── Points ──────────────────────────────────────────────────
        // Start point (0, 2)
        board.create('point', [0, 2], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false,
            showInfobox: false, layer: 7
        });

        // Euler endpoint (0.5, 3)
        board.create('point', [0.5, 3], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false,
            showInfobox: false, layer: 7
        });

        // Blue dot where curve crosses x = 0.5
        board.create('point', [0.5, curveAt05], {
            name: '', size: 3, color: COL_CURVE, fixed: true, highlight: false,
            showInfobox: false, layer: 7
        });

        // ── Coordinate labels (KaTeX) ───────────────────────────────
        // (0, 2)
        board.create('text', [-0.04, 2.18, '(0,\\ 2)'], {
            fontSize: 12, color: '#222222', useKatex: true,
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // (0.5, 3)
        board.create('text', [0.55, 2.82, '(0.5,\\ 3)'], {
            fontSize: 12, color: '#222222', useKatex: true,
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });

    </script>
</body>
</html>
