<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riemann Sums — Left and Right Endpoint Rectangles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 0.50, 7.8, -0.07],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 8
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 0.1,
                        majorHeight: 8
                    }
                }
            }
        });

        // Axis labels
        board.create('text', [7.45, -0.018, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.12, 0.485, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Function ──────────────────────────────────────────
        function f(x) {
            var d = 3 * x + 1;
            return 6 / (d * d);
        }

        var COL_RIGHT = '#2563EB';   // blue — right-endpoint (under)
        var COL_LEFT  = '#059669';   // green — left-endpoint (over)

        // ── Helper: draw a rectangle from (x1, 0) to (x2, h) ───────────
        function makeRect(x1, h, x2, fillCol, fillOp, strokeCol, dashStyle) {
            var p1 = board.create('point', [x1, 0],  { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [x2, 0],  { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [x2, h],  { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [x1, h],  { visible: false, fixed: true, name: '' });
            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: fillCol, fillOpacity: fillOp,
                borders: { strokeColor: strokeCol, strokeWidth: 1.0, dash: dashStyle },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });
        }

        // ── Right-endpoint rectangles (under curve) — filled blue ───────
        // Intervals [1,2], [2,3], ..., [6,7]; heights f(2), f(3), ..., f(7)
        var i;
        for (i = 1; i <= 6; i++) {
            makeRect(i, f(i + 1), i + 1, COL_RIGHT, 0.12, COL_RIGHT, 0);
        }

        // ── Left-endpoint rectangles (over curve) — outline-only green ──
        // Intervals [1,2], [2,3], ..., [6,7]; heights f(1), f(2), ..., f(6)
        for (i = 1; i <= 6; i++) {
            makeRect(i, f(i), i + 1, 'none', 0, COL_LEFT, 2);
        }

        // ── Primary curve ─────────────────────────────────────────────────
        board.create('functiongraph', [
            function(x) { return f(x); },
            0.6, 7.3
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Curve label ───────────────────────────────────────────────────
        board.create('text', [2.6, 0.34, 'y = f(x)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        // ── a_2 label: inside the first blue (right-endpoint) rectangle on [1,2] ──
        board.create('text', [1.5, 0.06, 'a_2'], {
            useKatex: true, fontSize: 13, color: COL_RIGHT, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // ── a_1 label: inside the upper part of the first green (left-endpoint) rectangle on [1,2] ──
        // Placed to the right of the curve, clear of it
        board.create('text', [1.75, 0.27, 'a_1'], {
            useKatex: true, fontSize: 13, color: COL_LEFT, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
