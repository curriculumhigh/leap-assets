<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>volume-cross-section-perpendicular-to-y-axis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
      window.addEventListener('load', function () {
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 4.8, 2.8, -0.5],
            axis: true,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            }
        });

        // Palette
        var COL_CURVE = '#222222';
        var COL_TOP   = '#2563EB';
        var COL_SLICE = '#DC2626';

        var YTOP = 4;
        var XMAX = Math.sqrt(YTOP);

        function f(x) { return x * x; }

        // --- Shaded base region ---
        var regionPts = [];
        var N = 60, i, yy;
        regionPts.push([0, 0]);
        regionPts.push([0, YTOP]);
        for (i = N; i >= 0; i--) { yy = YTOP * i / N; regionPts.push([Math.sqrt(yy), yy]); }
        board.create('polygon', regionPts, {
            borders: { strokeColor: 'none', strokeWidth: 0 },
            fillColor: '#888888', fillOpacity: 0.15,
            vertices: { visible: false }, fixed: true, highlight: false, withLines: false
        });

        // --- Boundary curves ---
        board.create('functiongraph', [f, 0, XMAX], {
            strokeColor: COL_CURVE, strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[0, YTOP], [XMAX, YTOP]], {
            strokeColor: COL_TOP, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Corner point (2, 4)
        board.create('point', [XMAX, YTOP], { name: '', size: 2, color: COL_CURVE, fixed: true, highlight: false, showInfobox: false });

        // --- Representative horizontal cross-section slice at y = 2.25 ---
        var YS = 2.25;
        var XS = Math.sqrt(YS);

        board.create('segment', [[XS, YS], [0, YS]], {
            strokeColor: COL_SLICE, strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [[0, YS], [XS, YS]], {
            strokeColor: COL_SLICE, strokeWidth: 2.6, fixed: true, highlight: false, layer: 7
        });
        board.create('point', [XS, YS], { name: '', size: 2.5, color: COL_CURVE, fixed: true, highlight: false, showInfobox: false });

        // --- Labels ---
        // Slice label: just 's'
        board.create('text', [XS / 2, YS + 0.18, 's'], {
            useKatex: true, fontSize: 13, color: COL_SLICE, anchorX: 'middle', anchorY: 'bottom', fixed: true, highlight: false
        });

        // Curve label
        board.create('text', [1.62, 1.55, 'y=x^2'], {
            useKatex: true, fontSize: 13, color: COL_CURVE, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // Top line label
        board.create('text', [0.55, YTOP + 0.18, 'y=4'], {
            useKatex: true, fontSize: 13, color: COL_TOP, anchorX: 'left', anchorY: 'bottom', fixed: true, highlight: false
        });

        // Corner point label
        board.create('text', [XMAX + 0.08, YTOP - 0.02, '(2,\\,4)'], {
            useKatex: true, fontSize: 12, color: COL_CURVE, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // Axis labels
        board.create('text', [2.62, -0.22, 'x'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.16, 4.62, 'y'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
      });
    </script>
</body>
</html>
