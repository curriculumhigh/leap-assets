<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>P3 Option C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}</style>
</head>
<body>
<div id="board" style="width:290px;height:240px;background:white;"></div>

<script>
var b=JXG.JSXGraph.initBoard('board',{boundingbox:[-13,2800,55,-450],axis:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false},keepAspectRatio:false});
var xmin=0,xmax=50,xstep=10,yticks=[0,500,1000,1500,2000,2500];
yticks.forEach(function(y){b.create('line',[[xmin,y],[xmax,y]],{straightFirst:false,straightLast:false,strokeColor:'#000',strokeWidth:1,fixed:true,highlight:false});});
for(var x=xmin;x<=xmax+0.0001;x+=xstep){b.create('line',[[x,0],[x,2500]],{straightFirst:false,straightLast:false,strokeColor:'#000',strokeWidth:1,fixed:true,highlight:false});}
yticks.forEach(function(y){b.create('text',[xmin-3,y,String(y)],{fontSize:11,color:'#000',anchorX:'right',anchorY:'middle',fixed:true,highlight:false,cssStyle:'font-weight:600;'});});
for(var x=xmin;x<=xmax+0.0001;x+=xstep){b.create('text',[x,-150,String(x)],{fontSize:10,color:'#000',anchorX:'middle',anchorY:'top',fixed:true,highlight:false});}
var pts=[{x:10,y:30},{x:20,y:90},{x:30,y:270},{x:40,y:810},{x:50,y:2430}];
pts.forEach(function(p){b.create('point',[p.x,p.y],{name:'',size:3,fillColor:'#000',strokeColor:'#000',fixed:true,highlight:false,showInfobox:false});});
</script>
</body></html>
