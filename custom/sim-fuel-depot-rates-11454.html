<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Depot Rates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var BB = [-1.15, 11.4, 11.0, -1.7];
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: BB,
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // units per pixel (for pixel-sized offsets)
        var UX = (BB[2] - BB[0]) / board.canvasWidth;
        var UY = (BB[1] - BB[3]) / board.canvasHeight;
        var i;

        /* ── Grid lines ─────────────────────────────────────────────── */
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[i, 0], [i, 10]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[0, i], [10.4, i]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }

        /* ── Axes ───────────────────────────────────────────────────── */
        board.create('arrow', [[-0.3, 0], [10.7, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });
        board.create('arrow', [[0, 0], [0, 10.9]], {
            strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        /* ── Ticks and tick labels ──────────────────────────────────── */
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[i, -4 * UY], [i, 4 * UY]], { strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false });
            board.create('text', [i, -13 * UY, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
            });
        }
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[-4 * UX, i], [4 * UX, i]], { strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false });
            board.create('text', [-8 * UX, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
            });
        }
        board.create('text', [-8 * UX, -13 * UY, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
        });

        /* ── Axis name labels (KaTeX) ───────────────────────────────── */
        board.create('text', [10.7, -32 * UY, 't\\text{ (hours)}'], {
            fontSize: 14, color: '#222222', anchorX: 'right', anchorY: 'middle', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [10 * UX, 10.9, '\\text{thousand gallons per hour}'], {
            fontSize: 14, color: '#222222', anchorX: 'left', anchorY: 'middle', useKatex: true, fixed: true, highlight: false
        });

        /* ── U(t) = 5, 0 ≤ t ≤ 10 (2nd curve, solid) ────────────────── */
        var COL_U = '#2563EB';
        board.create('segment', [[0, 5], [10, 5]], {
            strokeColor: COL_U, strokeWidth: 1.5, fixed: true, highlight: false
        });

        /* ── S(t): piecewise linear (primary curve) ─────────────────── */
        var COL_S = '#222222';
        var pts = [[0, 7], [2, 7], [4, 3], [6, 1], [8, 9], [10, 9]];
        for (i = 0; i < pts.length - 1; i++) {
            board.create('segment', [pts[i], pts[i + 1]], {
                strokeColor: COL_S, strokeWidth: 1.8, fixed: true, highlight: false
            });
        }
        for (i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 3, color: COL_S, fixed: true, highlight: false, showInfobox: false
            });
        }

        /* ── Function labels ────────────────────────────────────────── */
        board.create('text', [9, 9 + 9 * UY, 'S(t)'], {
            fontSize: 13, color: COL_S, anchorX: 'middle', anchorY: 'bottom',
            useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [10 + 8 * UX, 5, 'U(t)'], {
            fontSize: 13, color: COL_U, anchorX: 'left', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
