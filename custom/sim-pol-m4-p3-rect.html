<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pol-m4 p3-rect</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;
            pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .container{width:520px;height:380px;margin:0;padding:0;}
  .board-wrapper{background:white;border-radius:8px;padding:10px;
                 width:calc(100% - 20px);height:calc(100% - 20px);}
  #board{width:100%;height:100%;}
</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
  var XMIN=-0.16, XMAX=1.7707963267948965, YMIN=-5, YMAX=5, TMAX=1.5707963267948966;
  var board=JXG.JSXGraph.initBoard('board',{boundingbox:[XMIN,YMAX,XMAX,YMIN],axis:false,grid:false,
    showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
  for(var gy=YMIN+1; gy<YMAX; gy++){ if(gy!==0)
    board.create('line',[[XMIN,gy],[XMAX,gy]],{strokeColor:'#E5E7EB',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false}); }
  board.create('line',[[0.39269908169872414,YMIN],[0.39269908169872414,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('line',[[0.7853981633974483,YMIN],[0.7853981633974483,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('line',[[1.1780972450961724,YMIN],[1.1780972450961724,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('line',[[1.5707963267948966,YMIN],[1.5707963267948966,YMAX]],{strokeColor:'#F3F4F6',strokeWidth:1,straightFirst:false,straightLast:false,fixed:true,highlight:false});
  board.create('axis',[[0,0],[1,0]],{strokeColor:'#444444',strokeWidth:1.3,lastArrow:{type:2,size:6},ticks:{visible:false}});
  board.create('axis',[[0,0],[0,1]],{strokeColor:'#444444',strokeWidth:1.3,lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',minorTicks:0,
    ticksDistance:2,label:{fontSize:10,offset:[-14,0]},drawZero:false}});
  board.create('segment',[[0.39269908169872414,-0.12],[0.39269908169872414,0.12]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[0.39269908169872414,-4.55,'\\frac{\\pi}{8}'],{useKatex:true,fontSize:11,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[0.7853981633974483,-0.12],[0.7853981633974483,0.12]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[0.7853981633974483,-4.55,'\\frac{\\pi}{4}'],{useKatex:true,fontSize:11,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[1.1780972450961724,-0.12],[1.1780972450961724,0.12]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[1.1780972450961724,-4.55,'\\frac{3\\pi}{8}'],{useKatex:true,fontSize:11,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('segment',[[1.5707963267948966,-0.12],[1.5707963267948966,0.12]],{strokeColor:'#444444',strokeWidth:1.2,fixed:true,highlight:false});
  board.create('text',[1.5707963267948966,-4.55,'\\frac{\\pi}{2}'],{useKatex:true,fontSize:11,color:'#444444',anchorX:'middle',anchorY:'middle',fixed:true,highlight:false});
  board.create('text',[XMAX-0.07,-0.45,'\\theta'],{useKatex:true,fontSize:14,color:'#222',fixed:true,highlight:false});
  board.create('text',[0.04,YMAX-0.35,'r'],{useKatex:true,fontSize:14,color:'#222',fixed:true,highlight:false});
  board.create('functiongraph',[function(t){return 4*Math.cos(2*t);},0,TMAX],{strokeColor:'#2563EB',strokeWidth:2.6,fixed:true,highlight:false});
</script></body></html>
