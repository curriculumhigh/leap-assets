<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>vsr-gen-slider</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.container{max-width:560px;margin:0;padding:6px;height:calc(100% - 12px);}
.sim-layout{display:flex;gap:12px;height:100%;}
.left-panel{width:175px;flex-shrink:0;background:white;border-radius:8px;padding:16px;box-sizing:border-box;}
.board-wrapper{flex:1;background:white;border-radius:8px;padding:10px;}
#board{width:100%;height:100%;}
.readout{font-size:20px;color:#2563EB;font-weight:600;margin-bottom:14px;}
input[type=range]{width:100%;accent-color:#2563EB;margin-top:6px;}
.lbl{font-size:13px;color:#444;}</style></head>
<body><div class="container"><div class="sim-layout">
<div class="left-panel">
<div class="readout">a = <span id="aval">-2</span></div>
<div class="lbl">factor a</div>
<input type="range" id="slider-a" min="-3" max="3" step="0.05" value="-2">
</div>
<div class="board-wrapper"><div id="board"></div></div>
</div></div><script>
var aVal=-2;
var board=JXG.JSXGraph.initBoard('board',{boundingbox:[-7,16,6,-16],keepAspectRatio:false,axis:false,grid:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
board.create('grid',[],{strokeColor:'#D1D5DB',strokeWidth:0.4});
board.create('axis',[[0,0],[1,0]],{strokeColor:'#444444',strokeWidth:1.2,firstArrow:{type:2,size:6},lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2,drawZero:false},highlight:false,fixed:true});
board.create('axis',[[0,0],[0,1]],{strokeColor:'#444444',strokeWidth:1.2,firstArrow:{type:2,size:6},lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:4,drawZero:false},highlight:false,fixed:true});
board.create('text',[5.4,-1.0,'<i>x</i>'],{fontSize:14,fixed:true,highlight:false});
board.create('text',[0.3,15.2,'<i>y</i>'],{fontSize:14,fixed:true,highlight:false});
function base(x){ return 3*(x*x*x + x*x - 20*x)/14; }
board.create('functiongraph',[function(x){ return base(x); }],{strokeColor:'#9CA3AF',strokeWidth:1.3,dash:2,fixed:true,highlight:false});
board.create('functiongraph',[function(x){ return aVal*base(x); }],{strokeColor:'#2563EB',strokeWidth:1.8,fixed:true,highlight:false});
board.create('point',[-5,0],{name:'',size:3,fillColor:'#DC2626',strokeColor:'#DC2626',fixed:true,highlight:false});
board.create('point',[0,0],{name:'',size:3,fillColor:'#DC2626',strokeColor:'#DC2626',fixed:true,highlight:false});
board.create('point',[4,0],{name:'',size:3,fillColor:'#DC2626',strokeColor:'#DC2626',fixed:true,highlight:false});
document.getElementById('slider-a').addEventListener('input',function(){
  aVal=parseFloat(this.value);
  document.getElementById('aval').innerHTML=parseFloat(aVal.toFixed(2));
  board.update();
});
</script></body></html>
