<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola with Tangent Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.3, 6.6, 5.3, -1.3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.9, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 6.2, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola f(x) = (x-2)^2 + 1
        board.create('functiongraph', [
            function(x) { return (x - 2) * (x - 2) + 1; },
            -1, 4.6
        ], {
            strokeColor: '#2563EB',
            strokeWidth: 2.2,
            fixed: true,
            highlight: false,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 }
        });

        // Tangent line t: y = -2x + 4 (extended across bounding box)
        board.create('functiongraph', [
            function(x) { return -2 * x + 4; },
            -1.3, 5.3
        ], {
            strokeColor: '#16A34A',
            strokeWidth: 2,
            fixed: true,
            highlight: false
        });

        // Point of tangency (1, 2) — solid red dot
        board.create('point', [1, 2], {
            name: '',
            size: 4,
            color: '#DC2626',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Label for parabola
        board.create('text', [3.3, 3, 'f(x)'], {
            fontSize: 13,
            color: '#2563EB',
            useKatex: true,
            fixed: true,
            highlight: false
        });

        // Label for tangent line
        board.create('text', [1.6, 0.4, 't'], {
            fontSize: 13,
            color: '#16A34A',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
