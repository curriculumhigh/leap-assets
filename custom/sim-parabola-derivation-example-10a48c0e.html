<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parabola Example: Focus (0, 3)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:transparent;
                  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    .container { max-width:700px; margin:0; padding:6px; height:calc(100% - 12px); box-sizing:border-box; }
    .sim-layout { display:flex; gap:12px; height:100%; }
    .left-panel {
      width:220px; flex-shrink:0; background:white; border-radius:8px;
      padding:14px 14px 12px; box-sizing:border-box; height:100%; overflow:hidden;
      font-size:13px; line-height:1.45; color:#222222;
    }
    .legend { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:12px; }
    .legend .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .focus-dot { background:#DC2626; }
    .p-dot     { background:#2563EB; }
    .d-dot     { background:#059669; }
    .v-dot     { background:#222222; }
    .readout {
      font-family:'SF Mono',Menlo,Consolas,monospace; font-size:12px;
      margin:6px 0; padding:5px 8px; background:#f9f7f2;
      border:1px solid #e6dfd0; border-radius:4px;
    }
    .readout .lbl { color:#444; }
    .readout .val { font-weight:600; color:#222222; }
    .board-wrapper { flex:1; background:white; border-radius:8px; padding:10px; height:100%; box-sizing:border-box; }
    #board { width:100%; height:100%; }
  </style>
</head>
<body>
<div class="container">
  <div class="sim-layout">
    <div class="left-panel">
      <div class="legend"><span class="dot focus-dot"></span> <b style="color:#DC2626">F</b> &mdash; focus (0, 3)</div>
      <div class="legend"><span class="dot p-dot"></span> <b style="color:#2563EB">P</b> &mdash; on parabola</div>
      <div class="legend"><span class="dot d-dot"></span> <b style="color:#059669">D</b> &mdash; foot on directrix</div>
      <div class="legend"><span class="dot v-dot"></span> <b style="color:#222222">V</b> &mdash; vertex (0, 0)</div>
      <div class="readout"><span class="lbl">P =</span> (<span class="val" id="px">&ndash;</span>, <span class="val" id="py">&ndash;</span>)</div>
      <div class="readout"><span class="lbl">D =</span> (<span class="val" id="dx">&ndash;</span>, <span class="val" id="dy">&ndash;</span>)</div>
      <div class="readout"><span class="lbl">|PF| =</span> <span class="val" id="pf">&ndash;</span></div>
      <div class="readout"><span class="lbl">|PD| =</span> <span class="val" id="pd">&ndash;</span></div>
    </div>
    <div class="board-wrapper"><div id="board"></div></div>
  </div>
</div>
<script>
  var board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-6.8, 5.5, 6.8, -4.2],
    axis: true,
        keepAspectRatio: true,
    grid: true,
    showCopyright: false, showNavigation: false,
    pan: { enabled: false }, zoom: { wheel: false },
    defaultAxes: {
      x: {
        strokeColor: '#444444', strokeWidth: 1.2,
        lastArrow: { type: 2, size: 6 },
        ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
      },
      y: {
        strokeColor: '#444444', strokeWidth: 1.2,
        lastArrow: { type: 2, size: 6 },
        ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
      }
    },
    grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
  });

  // Axis labels — manual text elements near arrow tips
  board.create('text', [6.4, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
  board.create('text', [0.3, 5.15, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

  // Parabola y = x²/12
  var parabola = board.create('functiongraph', [
    function(x) { return x*x / 12; },
    -6, 6
  ], { strokeColor: '#222222', strokeWidth: 1.8, highlight: false, fixed: true });

  // Directrix y = -3
  board.create('line', [[-6.5, -3], [6.5, -3]], {
    strokeColor: '#555555', strokeWidth: 1.0, dash: 2,
    straightFirst: true, straightLast: true,
    highlight: false, fixed: true
  });
  board.create('text', [-6.2, -3.55, 'directrix: y = -3'], {
    fontSize: 11, color: '#555555', fixed: true, highlight: false
  });

  // Vertex
  board.create('point', [0, 0], {
    name: 'V',
    label: { offset: [-14, -16], cssStyle: 'font-weight:600;color:#222222;font-size:13px;' },
    fillColor: '#222222', strokeColor: '#fff', strokeWidth: 1.5, size: 4,
    fixed: true, highlight: false
  });

  // Focus at (0, 3)
  var F = board.create('point', [0, 3], {
    name: 'F',
    label: { offset: [10, 0], cssStyle: 'font-weight:600;color:#DC2626;font-size:14px;' },
    fillColor: '#DC2626', strokeColor: '#fff', strokeWidth: 2, size: 5,
    fixed: true, highlight: false
  });

  // P glider on parabola — keep hover coords ON (per W03 design intent)
  var P = board.create('glider', [3, 9/12, parabola], {
    name: 'P',
    label: { offset: [10, 2], cssStyle: 'font-weight:600;color:#2563EB;font-size:14px;' },
    fillColor: '#2563EB', strokeColor: '#fff', strokeWidth: 2, size: 5
  });

  // D
  var D = board.create('point', [
    function() { return P.X(); },
    function() { return -3; }
  ], {
    name: 'D',
    label: { offset: [10, -16], cssStyle: 'font-weight:600;color:#059669;font-size:14px;' },
    fillColor: '#059669', strokeColor: '#fff', strokeWidth: 2, size: 5,
    fixed: true
  });

  // Segments
  var segPF = board.create('segment', [P, F], {
    strokeColor: '#DC2626', strokeWidth: 1.5, highlight: false, fixed: true
  });
  var segPD = board.create('segment', [P, D], {
    strokeColor: '#059669', strokeWidth: 1.5, highlight: false, fixed: true
  });

  // Equality tick marks
  function addEqTick(seg, color) {
    var p1 = seg.point1, p2 = seg.point2;
    var midX = function() { return (p1.X() + p2.X()) / 2; };
    var midY = function() { return (p1.Y() + p2.Y()) / 2; };
    var L = function() {
      var dx = p2.X() - p1.X(), dy = p2.Y() - p1.Y();
      return Math.sqrt(dx*dx + dy*dy) || 0.001;
    };
    var TL = 0.18;
    var t1x = function() { return midX() + (p2.Y()-p1.Y())/L() * TL; };
    var t1y = function() { return midY() - (p2.X()-p1.X())/L() * TL; };
    var t2x = function() { return midX() - (p2.Y()-p1.Y())/L() * TL; };
    var t2y = function() { return midY() + (p2.X()-p1.X())/L() * TL; };
    var a = board.create('point', [t1x, t1y], { visible:false, fixed:true, showInfobox:false });
    var b = board.create('point', [t2x, t2y], { visible:false, fixed:true, showInfobox:false });
    board.create('segment', [a, b], {
      strokeColor: color, strokeWidth: 2.0, highlight: false, fixed: true
    });
  }
  addEqTick(segPF, '#DC2626');
  addEqTick(segPD, '#059669');

  // Readouts
  function update() {
    document.getElementById('px').textContent = P.X().toFixed(2);
    document.getElementById('py').textContent = P.Y().toFixed(2);
    document.getElementById('dx').textContent = D.X().toFixed(2);
    document.getElementById('dy').textContent = D.Y().toFixed(2);
    var d = Math.sqrt(Math.pow(P.X()-F.X(),2) + Math.pow(P.Y()-F.Y(),2));
    document.getElementById('pf').textContent = d.toFixed(2);
    document.getElementById('pd').textContent = (P.Y() + 3).toFixed(2);
  }
  P.on('drag', update);
  P.on('up', update);
  update();
</script>
</body>
</html>
