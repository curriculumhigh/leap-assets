<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope Field — dy/dt = 0.5y(1 − y/4)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 6.8, 6.8, -1.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, anchorX: 'middle', anchorY: 'top', offset: [0, -3] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, anchorX: 'right', anchorY: 'middle', offset: [-5, 0] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels — plain text
        board.create('text', [6.45, -0.35, '<i>t</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 6.45, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Slope field
        var SEG_LEN = 0.32; // half-length of each segment in board coords

        function dydt(t, y) {
            return 0.5 * y * (1 - y / 4);
        }

        var tMin = 0.5, tMax = 6, tStep = 0.5;
        var yMin = -1, yMax = 6, yStep = 0.5;

        for (var t = tMin; t <= tMax + 0.001; t += tStep) {
            for (var y = yMin; y <= yMax + 0.001; y += yStep) {
                var slope = dydt(t, y);
                // Direction vector (1, slope), normalized, scaled to SEG_LEN
                var len = Math.sqrt(1 + slope * slope);
                var dx = SEG_LEN / len;
                var dy_seg = SEG_LEN * slope / len;

                board.create('segment', [
                    [t - dx, y - dy_seg],
                    [t + dx, y + dy_seg]
                ], {
                    strokeColor: '#555555',
                    strokeWidth: 1.2,
                    fixed: true,
                    highlight: false,
                    layer: 5
                });
            }
        }
    </script>
</body>
</html>
