<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiper Blade Region</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
.wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
svg { width: 100%; height: 100%; max-width: 100%; max-height: 100%; display: block; background: #ffffff; }
text { font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 420 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wiper arm sweeping 130 degrees; the blade wipes a band between two arcs">
  <!-- wiped region (band) -->
  <path d="M 384.01,156.86 A 192 192 0 0 0 35.99,156.86 L 154.63,212.18 A 61.09 61.09 0 0 1 265.37,212.18 Z" fill="#2563EB" fill-opacity="0.18" stroke="#1E40AF" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- arm positions -->
  <line x1="210" y1="238" x2="384.01" y2="156.86" stroke="#222222" stroke-width="1.5"/>
  <line x1="210" y1="238" x2="35.99" y2="156.86" stroke="#222222" stroke-width="1.5"/>
  <!-- blade (outer 15 in) on right arm -->
  <line x1="265.37" y1="212.18" x2="384.01" y2="156.86" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
  <!-- angle marker -->
  <path d="M 235.38,226.17 A 28 28 0 0 0 184.62,226.17" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <text x="210.00" y="196.00" font-size="14" fill="#222222" text-anchor="middle" dominant-baseline="middle">130°</text>
  <!-- dimensions -->
  <line x1="259.45" y1="199.49" x2="378.09" y2="144.17" stroke="#444444" stroke-width="1"/>
  <line x1="257.34" y1="194.96" x2="261.56" y2="204.03" stroke="#444444" stroke-width="1"/>
  <line x1="375.98" y1="139.64" x2="380.21" y2="148.70" stroke="#444444" stroke-width="1"/>
  <polygon points="259.45,199.49 267.97,198.83 265.43,193.39" fill="#444444"/>
  <polygon points="378.09,144.17 372.11,150.27 369.58,144.83" fill="#444444"/>
  <text x="312.86" y="159.14" font-size="14" fill="#222222" text-anchor="middle" dominant-baseline="middle">15 in</text>
  <line x1="215.92" y1="250.69" x2="389.93" y2="169.55" stroke="#444444" stroke-width="1"/>
  <line x1="213.80" y1="246.16" x2="218.03" y2="255.22" stroke="#444444" stroke-width="1"/>
  <line x1="387.81" y1="165.01" x2="392.04" y2="174.08" stroke="#444444" stroke-width="1"/>
  <polygon points="215.92,250.69 224.43,250.03 221.90,244.59" fill="#444444"/>
  <polygon points="389.93,169.55 383.95,175.65 381.41,170.21" fill="#444444"/>
  <text x="308.84" y="222.81" font-size="14" fill="#222222" text-anchor="middle" dominant-baseline="middle">22 in</text>
  <!-- pivot -->
  <circle cx="210" cy="238" r="3.5" fill="#222222"/>
  <text x="200" y="258" font-size="14" fill="#222222" text-anchor="end">pivot</text>
</svg>
</div>
</body>
</html>
