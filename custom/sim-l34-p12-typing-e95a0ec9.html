<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 520px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 82, 44, -9],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid lines ──────────────────────────────────────────
        // Vertical grid lines every 5 units on x
        var xi;
        for (xi = 5; xi <= 40; xi += 5) {
            board.create('segment', [[xi, -9], [xi, 82]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }
        // Horizontal grid lines every 10 units on y
        var yi;
        for (yi = 10; yi <= 70; yi += 10) {
            board.create('segment', [[-4, yi], [44, yi]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────
        // X-axis
        var xAxis = board.create('arrow', [[0, 0], [43, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // Y-axis
        var yAxis = board.create('arrow', [[0, 0], [0, 80]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── X-axis tick marks and labels ──
        var xTickVals = [5, 10, 15, 20, 25, 30, 35, 40];
        var xLabelVals = [10, 20, 30, 40];
        var t;
        for (t = 0; t < xTickVals.length; t++) {
            var xv = xTickVals[t];
            // Tick mark
            board.create('segment', [[xv, -1.2], [xv, 1.2]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            // Label only at 10, 20, 30, 40
            if (xLabelVals.indexOf(xv) !== -1) {
                board.create('text', [xv, -3.5, String(xv)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false,
                    cssStyle: 'background-color:#ffffff;padding:0 2px;',
                    layer: 9
                });
            }
        }

        // ── Y-axis tick marks and labels ──
        var yTickVals = [10, 20, 30, 40, 50, 60, 70];
        for (t = 0; t < yTickVals.length; t++) {
            var yv = yTickVals[t];
            // Tick mark
            board.create('segment', [[-0.6, yv], [0.6, yv]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [-1.8, yv, String(yv)], {
                fontSize: 11, color: '#444444',
                anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: 'background-color:#ffffff;padding:0 2px;',
                layer: 9
            });
        }

        // ── Axis titles ─────────────────────────────────────────
        // X-axis title: centered below the x-axis tick labels
        board.create('text', [20, -7, 'Days of practice, <i>x</i>'], {
            fontSize: 12, color: '#444444',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Y-axis title: horizontal, placed above y-axis arrow
        board.create('text', [1.0, 78, 'Words per minute, <i>W</i>'], {
            fontSize: 12, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Horizontal asymptote W = 60 (dashed cyan, no label) ────────
        board.create('line', [[0, 60], [1, 60]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0,
            dash: 2, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // ── Curve W = 60x/(x+4) for 0 <= x <= 42 ──────────────────────
        board.create('functiongraph', [
            function(x) { return 60 * x / (x + 4); },
            0, 42
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Key point (4, 30) ───────────────────────────────────────────
        board.create('point', [4, 30], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Label for the key point
        board.create('text', [5, 27, '(4,\\,30)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
