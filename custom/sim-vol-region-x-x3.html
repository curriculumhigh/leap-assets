<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>region-between-x-and-x3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
      window.addEventListener('load', function () {
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.3, 1.4, 1.4, -0.3],
            axis: true,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 0.5 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 0.5 }
                }
            }
        });

        var COL_LINE  = '#222222';   // line y = x
        var COL_CUBIC = '#2563EB';   // cubic y = x^3

        // Shaded region between y = x (upper) and y = x^3 (lower) on [0,1].
        // Sample the cubic finely on the return leg for a smooth fill edge.
        var N = 60;
        board.create('curve', [
            function (t) {
                if (t <= 1) { return t; }                  // forward along line y = x
                else {
                    var s = (t - 1);                        // 0 -> 1
                    return 1 - s;                            // x from 1 down to 0
                }
            },
            function (t) {
                if (t <= 1) { return t; }                  // line y = x
                else {
                    var s = (t - 1);
                    var x = 1 - s;
                    return x * x * x;                        // cubic y = x^3
                }
            },
            0, 2,
            { stepsperarc: N }
        ], {
            strokeColor: 'none', strokeWidth: 0,
            fillColor: '#888888', fillOpacity: 0.15,
            fixed: true, highlight: false,
            numberPointsHigh: 400
        });

        // Boundary: line y = x from (0,0) to (1,1)
        board.create('segment', [[0, 0], [1, 1]], {
            strokeColor: COL_LINE, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Boundary: cubic y = x^3 from (0,0) to (1,1)
        board.create('functiongraph', [function (x) { return x * x * x; }, 0, 1], {
            strokeColor: COL_CUBIC, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Corner points
        board.create('point', [0, 0], { name: '', size: 2, color: COL_LINE, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [1, 1], { name: '', size: 2, color: COL_LINE, fixed: true, highlight: false, showInfobox: false });

        // Curve labels
        board.create('text', [0.34, 0.55, 'y=x'], {
            useKatex: true, fontSize: 13, color: COL_LINE, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [1.04, 0.62, 'y=x^3'], {
            useKatex: true, fontSize: 13, color: COL_CUBIC, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // Axis labels near arrow tips
        board.create('text', [1.31, -0.15, 'x'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.1, 1.32, 'y'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
      });
    </script>
</body>
</html>
