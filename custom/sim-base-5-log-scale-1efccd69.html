<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base-5 Logarithmic Scale</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 2.2, 6.8, -1.4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Number line: arrow from left to right
        board.create('arrow', [[-0.4, 0], [6.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Major ticks and labels at positions 0–6
        var i;
        for (i = 0; i <= 6; i++) {
            // Tick mark (smaller: -0.1 to 0.1)
            board.create('segment', [[i, -0.1], [i, 0.1]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            // Tick label (closer to line: y = -0.35)
            board.create('text', [i, -0.35, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // Point A at position 1
        board.create('point', [1, 0], {
            name: 'A',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false,
            label: {
                fontSize: 14,
                color: '#222222',
                offset: [0, 18],
                anchorX: 'middle',
                cssStyle: 'font-weight:bold'
            }
        });

        // Point B at position 4
        board.create('point', [4, 0], {
            name: 'B',
            size: 5,
            color: '#2563EB',
            fixed: true,
            highlight: false,
            showInfobox: false,
            label: {
                fontSize: 14,
                color: '#2563EB',
                offset: [0, 18],
                anchorX: 'middle',
                cssStyle: 'font-weight:bold'
            }
        });
    </script>
</body>
</html>
