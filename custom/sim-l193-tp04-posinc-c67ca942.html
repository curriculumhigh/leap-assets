<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 5, 6.5, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [6.1, -0.4, 'x'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, 4.6, 'f(x)'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Define curve: f(x) using a carefully constructed function
        // Requirements:
        // - Negative and decreasing on (-4, -1)
        // - Local minimum at x = -1 (negative value)
        // - Negative and increasing on (-1, 1)
        // - f(1) = 0 (x-intercept)
        // - Positive and increasing on (1, 6)
        // - Fits within y: [-3, 5]
        //
        // Using: f(x) = 0.4 * (x - 1) * (1 / (1 + 0.08*(x + 1)^2 )) + 0.12*(x - 1)
        // Actually, let's use a well-tuned spline-like approach with a single smooth formula.
        //
        // f(x) = 0.52*(x-1) / (1 + 0.15*(x-1)^2) + 0.08*(x-1)
        // This gives a bounded S-curve through (1,0) plus a linear growth term.
        // Let me verify key points and adjust.
        //
        // Better: Use f(x) = A*atan(B*(x - C)) + D*(x - 1) tuned for the shape.
        // f(1) = A*atan(B*(1-C)) + 0 — need this = 0: A*atan(B*(1-C)) = 0 → C=1 or A=0.
        // Let C=1: f(x) = A*atan(B*(x-1)) + D*(x-1)
        // f(1) = 0 ✓
        // f'(x) = A*B/(1+B^2*(x-1)^2) + D
        // f'(-1) = A*B/(1+4B^2) + D = 0 → D = -A*B/(1+4B^2)
        // f(-1) = A*atan(-2B) + D*(-2) = -A*atan(2B) - 2D = -A*atan(2B) + 2AB/(1+4B^2)
        //
        // Let B = 0.8:
        // D = -A*0.8/(1+4*0.64) = -0.8A/3.56 = -0.2247A
        // f(-1) = -A*atan(1.6) + 2*0.2247*A = A*(-1.0122 + 0.4494) = -0.5628A
        // For f(-1) = -1.8: A = -1.8/(-0.5628) = 3.198
        // D = -0.2247*3.198 = -0.7188
        // f(-4) = 3.198*atan(0.8*(-5)) + (-0.7188)*(-5) = 3.198*atan(-4) + 3.594
        //       = 3.198*(-1.3258) + 3.594 = -4.24 + 3.594 = -0.646
        // f(6) = 3.198*atan(0.8*5) + (-0.7188)*5 = 3.198*atan(4) + (-3.594)
        //      = 3.198*1.3258 - 3.594 = 4.24 - 3.594 = 0.646
        // Hmm, symmetric. f(6) = 0.646 — quite low for "positive and increasing".
        // Also f(-4) = -0.646 — not very negative either.
        //
        // Let me increase D (make the linear term steeper) and re-balance:
        // Actually the issue is that atan saturates. Let me use a different approach entirely.
        //
        // FINAL APPROACH: Use a rational function.
        // f(x) = (x - 1) * (ax + b) / (cx^2 + dx + e) tuned for shape.
        // Or even simpler: just use a well-chosen piecewise polynomial that's C1 smooth.
        //
        // Actually, the SIMPLEST working solution: use a cubic but accept that the "decreasing on
        // (-4,-1)" requirement means the curve starts only slightly negative at x=-4 and goes down
        // to a valley. This IS decreasing. Let me just pick values that look good visually.
        //
        // f(x) = 0.18*(x-1)*(x+1.4)^2 - 0.18*(1-1)*(1+1.4)^2 ... no.
        //
        // Let me try: f(x) = 0.25*(x-1)^3 / (x^2 + 4)
        // f(1) = 0 ✓
        // f(-1) = 0.25*(-8)/(5) = -0.4. Too shallow.
        //
        // f(x) = 0.8*(x-1)^3 / (x^2 + 2)
        // f(1) = 0 ✓
        // f(-1) = 0.8*(-8)/3 = -2.133. Good valley!
        // f(-4) = 0.8*(-125)/18 = -5.56. Too low (below bbox bottom of -3).
        //
        // f(x) = 0.4*(x-1)^3 / (x^2 + 3)
        // f(-1) = 0.4*(-8)/4 = -0.8. Shallow.
        // f(-4) = 0.4*(-125)/19 = -2.63. Within bbox.
        // f(6) = 0.4*(125)/39 = 1.28. Low but visible.
        // f'(x)? Let me check if it's decreasing on (-4,-1):
        // f(x) = 0.4*(x-1)^3 * (x^2+3)^(-1)
        // f'(x) = 0.4*[3(x-1)^2*(x^2+3) - (x-1)^3*2x] / (x^2+3)^2
        //       = 0.4*(x-1)^2*[3(x^2+3) - 2x(x-1)] / (x^2+3)^2
        //       = 0.4*(x-1)^2*[3x^2+9-2x^2+2x] / (x^2+3)^2
        //       = 0.4*(x-1)^2*(x^2+2x+9) / (x^2+3)^2
        // x^2+2x+9 = (x+1)^2+8 > 0 always. (x-1)^2 ≥ 0. So f'(x) ≥ 0 for all x!
        // The function is monotonically increasing! No valley at all! ❌
        //
        // Odd-power rational functions through origin are monotone. Need different structure.
        //
        // DEFINITIVE APPROACH: I'll build the curve from a parameterized spline using JSXGraph's
        // functiongraph with a manually defined piecewise function that's smooth (C1) at the joins.
        //
        // Piece 1: x in [-4, -1] — decreasing from (-4, -0.8) to (-1, -1.8)
        //   Use quadratic: f1(x) = a(x+1)^2 - 1.8, f1(-1)=-1.8, f1(-4)=-0.8
        //   a*9 - 1.8 = -0.8 → 9a = 1 → a = 1/9 ≈ 0.111
        //   f1(x) = (1/9)*(x+1)^2 - 1.8
        //   f1'(x) = (2/9)*(x+1). f1'(-1) = 0. f1'(-4) = (2/9)*(-3) = -2/3.
        //   At x=-4: f1'(-4) = -0.667 (slope). Decreasing on [-4,-1] since vertex at x=-1. ✓
        //   Wait — this is a UPWARD parabola with vertex at (-1, -1.8). On (-4,-1) it's DECREASING. ✓
        //
        // Piece 2: x in [-1, 1] — increasing from (-1, -1.8) to (1, 0)
        //   Need f2(-1) = -1.8, f2(1) = 0, f2'(-1) = 0 (smooth join with piece 1)
        //   Use quadratic: f2(x) = A(x-1)^2 + B(x-1) + 0 → f2(1)=0. Hmm let me use:
        //   f2(x) = p*(x+1)^2 + q*(x+1) - 1.8
        //   f2(-1) = -1.8 ✓. f2'(-1) = 2p*0 + q = q. Need q = 0 for C1. So f2'(-1)=0. ✓
        //   f2(x) = p*(x+1)^2 - 1.8. f2(1) = 4p - 1.8 = 0 → p = 0.45.
        //   f2(x) = 0.45*(x+1)^2 - 1.8. f2'(x) = 0.9*(x+1). f2'(1) = 1.8.
        //   Check: on [-1,1], f2'(x) = 0.9*(x+1) ≥ 0. Increasing ✓.
        //   Note: f1(x) = (1/9)*(x+1)^2 - 1.8 and f2(x) = 0.45*(x+1)^2 - 1.8
        //   At x=-1: both = -1.8, both derivatives = 0. C1 smooth ✓.
        //   But they're the SAME form! Different coefficients though, so the curve has a kink in curvature (C1 but not C2). Visually fine.
        //
        // Piece 3: x in [1, 6] — increasing from (1, 0), positive
        //   Need f3(1) = 0, f3'(1) = f2'(1) = 1.8 (C1 smooth join)
        //   Use quadratic: f3(x) = r*(x-1)^2 + s*(x-1). f3(1)=0 ✓. f3'(1) = s = 1.8.
        //   f3(x) = r*(x-1)^2 + 1.8*(x-1). f3(6) = 25r + 9.
        //   For f3(6) ≈ 4.5 (fits in bbox): 25r + 9 = 4.5 → r = -0.18.
        //   f3(x) = -0.18*(x-1)^2 + 1.8*(x-1). f3'(x) = -0.36*(x-1) + 1.8.
        //   f3'(6) = -0.36*5 + 1.8 = -1.8 + 1.8 = 0. Hmm, slope goes to 0 at x=6. Still increasing on (1,6)?
        //   f3'(x) = -0.36*(x-1) + 1.8 > 0 when x-1 < 5, i.e., x < 6. At x=6, f'=0. So increasing on (1,6). ✓
        //   f3(x) > 0 on (1,6)? f3(x) = (x-1)*[-0.18*(x-1) + 1.8] = (x-1)*[-0.18x + 0.18 + 1.8] = (x-1)*(1.98 - 0.18x)
        //   For x in (1,6): (x-1)>0 and (1.98-0.18x) at x=6: 1.98-1.08=0.9>0. So f3>0 ✓.
        //
        // Summary:
        //   x in [-4, -1]: f(x) = (1/9)*(x+1)^2 - 1.8
        //   x in [-1, 1]:  f(x) = 0.45*(x+1)^2 - 1.8
        //   x in [1, 6]:   f(x) = -0.18*(x-1)^2 + 1.8*(x-1)
        //
        // Verify all requirements:
        //   f(-4) = (1/9)*9 - 1.8 = 1 - 1.8 = -0.8 (negative ✓)
        //   Decreasing on (-4,-1): f'(x) = (2/9)*(x+1) < 0 for x < -1 ✓
        //   f(-1) = -1.8 (negative, local min ✓)
        //   Increasing on (-1,1): f'(x) = 0.9*(x+1) > 0 for x > -1 ✓
        //   f(1) = 0.45*4 - 1.8 = 1.8 - 1.8 = 0 ✓
        //   Positive and increasing on (1,6) ✓
        //   f(6) = -0.18*25 + 1.8*5 = -4.5 + 9 = 4.5 (within bbox ✓)
        //   All values in [-1.8, 4.5] ⊂ [-3, 5] ✓

        function f(x) {
            if (x <= -1) {
                return (1.0/9.0) * (x + 1) * (x + 1) - 1.8;
            } else if (x <= 1) {
                return 0.45 * (x + 1) * (x + 1) - 1.8;
            } else {
                return -0.18 * (x - 1) * (x - 1) + 1.8 * (x - 1);
            }
        }

        // Plot the curve on [-4, 6]
        board.create('functiongraph', [f, -4, 6], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key point: x-intercept at (1, 0)
        board.create('point', [1, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Label for (1, 0) — offset to avoid tick mark
        board.create('text', [1, -0.45, '(1,\\, 0)'], {
            fontSize: 13,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'top',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
