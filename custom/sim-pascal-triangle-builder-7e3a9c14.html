<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal's Triangle Builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); display: flex; flex-direction: column; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; flex: 1; min-height: 0; }
        #board { width: 100%; height: 100%; }
        .controls { background: white; border-radius: 8px; margin-top: 6px; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn { font-size: 13px; padding: 6px 16px; border: 1px solid #d0d0d0; border-radius: 5px; background: #f5f5f5; color: #333; cursor: pointer; font-family: inherit; }
        .btn-next { background: #2563EB; color: #fff; border-color: #2563EB; }
        .btn:disabled { opacity: 0.45; cursor: default; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
        <div class="controls">
            <button class="btn btn-next" id="next-btn">Next</button>
            <button class="btn" id="reset-btn">Reset</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 6.2, 6.5, -5.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_NUM = '#222222';
        var COL_HILITE = '#2563EB';
        var COL_CONNECT = '#2563EB';
        var COL_SUM = '#2563EB';
        var COL_BLANK = '#555555';
        var COL_ROWLBL = '#888888';

        // Layout geometry
        var X_SPACING = 1.5;   // horizontal gap between adjacent entries in a row
        var Y_TOP = 5.2;       // y of row 0
        var Y_STEP = 2.0;      // vertical gap between rows
        var ROW_LABEL_X = -5.6;

        // Pascal values (row 4 interior intentionally NOT rendered as numbers)
        var rows = [
            [1],
            [1, 1],
            [1, 2, 1],
            [1, 3, 3, 1],
            [1, 1, 1, 1, 1]  // placeholder array length only; values used only for edges
        ];

        function posX(n, k) { return (k - n / 2) * X_SPACING; }
        function posY(n) { return Y_TOP - n * Y_STEP; }

        // ---- Row labels (n = k) on the left ----
        var i, j;
        var rowLabels = [];
        for (i = 0; i <= 4; i++) {
            rowLabels[i] = board.create('text', [ROW_LABEL_X, posY(i), 'n = ' + i], {
                anchorX: 'left', anchorY: 'middle',
                fontSize: 12, color: COL_ROWLBL,
                fixed: true, highlight: false,
                visible: false
            });
        }

        // ---- Number entries ----
        // entry[n][k] = JSXGraph text element
        var entries = [];
        for (i = 0; i <= 4; i++) {
            entries[i] = [];
            for (j = 0; j < rows[i].length; j++) {
                var isRow4Interior = (i === 4 && j > 0 && j < rows[i].length - 1);
                var labelStr, col;
                if (isRow4Interior) {
                    labelStr = '?';
                    col = COL_BLANK;
                } else {
                    labelStr = String(rows[i][j]);
                    col = COL_NUM;
                }
                var t = board.create('text', [posX(i, j), posY(i), labelStr], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 18, color: col,
                    fixed: true, highlight: false,
                    useKatex: false,
                    visible: false,
                    cssStyle: 'font-weight:600;' + (isRow4Interior ? 'border:1.5px dashed ' + COL_BLANK + ';border-radius:4px;padding:1px 7px;' : '')
                });
                entries[i][j] = t;
            }
        }

        // ---- Helper: build connector lines + parent highlight for a given interior cell ----
        // returns array of created (initially hidden) elements
        function makeParentLinks(n, k) {
            var els = [];
            var cx = posX(n, k), cy = posY(n);
            // parents are at (n-1, k-1) and (n-1, k)
            var p1x = posX(n - 1, k - 1), p1y = posY(n - 1);
            var p2x = posX(n - 1, k), p2y = posY(n - 1);
            // connector segments from each parent down to the child
            els.push(board.create('segment', [[p1x, p1y - 0.45], [cx - 0.18, cy + 0.45]], {
                strokeColor: COL_CONNECT, strokeWidth: 1.0, dash: 2,
                fixed: true, highlight: false, visible: false
            }));
            els.push(board.create('segment', [[p2x, p2y - 0.45], [cx + 0.18, cy + 0.45]], {
                strokeColor: COL_CONNECT, strokeWidth: 1.0, dash: 2,
                fixed: true, highlight: false, visible: false
            }));
            return els;
        }

        // ---- Plus sign in the V between a child's two dashed connectors ----
        // Sits above the child entry, symbolizing "add the two numbers above".
        function makePlus(n, k) {
            return board.create('text', [posX(n, k), (posY(n - 1) + posY(n)) / 2, '+'], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 17, color: COL_SUM,
                fixed: true, highlight: false,
                useKatex: false,
                cssStyle: 'font-weight:700;',
                visible: false
            });
        }

        // ---- Highlight overlays for parent entries (recolor effect via a circle behind) ----
        function makeParentHighlight(n, k) {
            // n-1 row, columns k-1 and k
            var els = [];
            var c1 = board.create('circle', [[posX(n - 1, k - 1), posY(n - 1)], 0.42], {
                strokeColor: COL_HILITE, strokeWidth: 1.4, fillColor: COL_HILITE, fillOpacity: 0.12,
                fixed: true, highlight: false, visible: false, layer: 3
            });
            var c2 = board.create('circle', [[posX(n - 1, k), posY(n - 1)], 0.42], {
                strokeColor: COL_HILITE, strokeWidth: 1.4, fillColor: COL_HILITE, fillOpacity: 0.12,
                fixed: true, highlight: false, visible: false, layer: 3
            });
            els.push(c1, c2);
            return els;
        }

        // Build per-row reveal groups.
        // Step 0 reveals rows 0 and 1. Steps 1,2,3 reveal rows 2,3,4 respectively.

        // Row 2 interior (k=1): + between its two connectors
        var row2Links = makeParentLinks(2, 1);
        var row2Hi = makeParentHighlight(2, 1);
        var row2Plus = makePlus(2, 1);

        // Row 3 interior cells: k=1, k=2 — a + in each V
        var row3Links = makeParentLinks(3, 1).concat(makeParentLinks(3, 2));
        var row3Hi = makeParentHighlight(3, 1).concat(makeParentHighlight(3, 2));
        var row3Plus = [makePlus(3, 1), makePlus(3, 2)];

        // Row 4 interior cells: k=1,2,3 — a + in each V (NO values; answers 4,6,4 stay blank)
        var row4Links = makeParentLinks(4, 1).concat(makeParentLinks(4, 2)).concat(makeParentLinks(4, 3));
        var row4Hi = makeParentHighlight(4, 1).concat(makeParentHighlight(4, 2)).concat(makeParentHighlight(4, 3));
        var row4Plus = [makePlus(4, 1), makePlus(4, 2), makePlus(4, 3)];

        function showArr(arr) {
            var m;
            for (m = 0; m < arr.length; m++) { arr[m].setAttribute({ visible: true }); }
        }
        function hideArr(arr) {
            var m;
            for (m = 0; m < arr.length; m++) { arr[m].setAttribute({ visible: false }); }
        }

        var step = -1;
        var MAX_STEP = 3;

        function applyStep(s) {
            // Step 0: rows 0 and 1 visible. (no highlights)
            if (s >= 0) {
                rowLabels[0].setAttribute({ visible: true });
                rowLabels[1].setAttribute({ visible: true });
                showArr(entries[0]);
                showArr(entries[1]);
            }
            // Step 1: reveal row 2 with highlights + plus
            if (s >= 1) {
                rowLabels[2].setAttribute({ visible: true });
                showArr(entries[2]);
                showArr(row2Hi);
                showArr(row2Links);
                row2Plus.setAttribute({ visible: true });
            } else {
                hideArr(row2Hi); hideArr(row2Links); row2Plus.setAttribute({ visible: false });
            }
            // Step 2: reveal row 3 with highlights + plus; clear row 2 working
            if (s >= 2) {
                rowLabels[3].setAttribute({ visible: true });
                showArr(entries[3]);
                showArr(row3Hi);
                showArr(row3Links);
                showArr(row3Plus);
                hideArr(row2Hi); hideArr(row2Links); row2Plus.setAttribute({ visible: false });
            } else {
                hideArr(row3Hi); hideArr(row3Links); hideArr(row3Plus);
            }
            // Step 3: reveal row 4 (edges=1, interior=? blanks) with highlights + plus, NO values
            if (s >= 3) {
                rowLabels[4].setAttribute({ visible: true });
                showArr(entries[4]);
                showArr(row4Hi);
                showArr(row4Links);
                showArr(row4Plus);
                hideArr(row3Hi); hideArr(row3Links); hideArr(row3Plus);
            } else {
                hideArr(row4Hi); hideArr(row4Links); hideArr(row4Plus);
            }
            board.update();
        }

        var nextBtn = document.getElementById('next-btn');
        var resetBtn = document.getElementById('reset-btn');

        function goNext() {
            if (step < MAX_STEP) {
                step++;
                applyStep(step);
            }
            if (step >= MAX_STEP) {
                nextBtn.disabled = true;
            }
        }

        function reset() {
            // hide everything, restore to step 0
            var n, k;
            for (n = 0; n <= 4; n++) {
                rowLabels[n].setAttribute({ visible: false });
                hideArr(entries[n]);
            }
            hideArr(row2Hi); hideArr(row2Links); row2Plus.setAttribute({ visible: false });
            hideArr(row3Hi); hideArr(row3Links); hideArr(row3Plus);
            hideArr(row4Hi); hideArr(row4Links); hideArr(row4Plus);
            step = 0;
            nextBtn.disabled = false;
            applyStep(0);
        }

        nextBtn.addEventListener('click', goNext);
        resetBtn.addEventListener('click', reset);

        // initial state: step 0 (rows 0 and 1 shown)
        step = 0;
        applyStep(0);

        });
    </script>
</body>
</html>
