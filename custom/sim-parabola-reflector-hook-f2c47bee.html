<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parabolic Reflector</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:transparent;
                  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    .container { max-width:700px; margin:0; padding:6px; height:calc(100% - 12px); box-sizing:border-box; }
    .sim-layout { display:flex; gap:12px; height:100%; }
    .left-panel {
      width:190px; flex-shrink:0; background:white; border-radius:8px;
      padding:14px 14px; box-sizing:border-box; height:100%;
      font-size:13px; line-height:1.5; color:#222222;
    }
    .legend { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12px; }
    .legend .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .focus-dot { background:#DC2626; }
    .v-dot     { background:#222222; }
    .axis-bar  { width:12px; height:0; border-top:2px dashed #555555; flex-shrink:0; }
    .ray-bar-in  { width:12px; height:0; border-top:1.5px solid #666666; flex-shrink:0; }
    .ray-bar-out { width:12px; height:0; border-top:1.5px solid #2563EB; flex-shrink:0; }
    .board-wrapper { flex:1; background:white; border-radius:8px; padding:10px; height:100%; box-sizing:border-box; }
    #board { width:100%; height:100%; }
  </style>
</head>
<body>
<div class="container">
  <div class="sim-layout">
    <div class="left-panel">
      <div class="legend"><span class="dot focus-dot"></span> <b style="color:#DC2626">F</b> &mdash; focus</div>
      <div class="legend"><span class="dot v-dot"></span> <b style="color:#222222">V</b> &mdash; vertex</div>
      <div class="legend"><span class="axis-bar"></span> Axis of symmetry</div>
      <div class="legend"><span class="ray-bar-in"></span> Incoming ray</div>
      <div class="legend"><span class="ray-bar-out"></span> Reflected ray</div>
    </div>
    <div class="board-wrapper">
      <div id="board"></div>
    </div>
  </div>
</div>
<script>
  var board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-5, 6.5, 5, -1],
        keepAspectRatio: true,
    axis: false, grid: false,
    showCopyright: false, showNavigation: false,
    pan: { enabled: false }, zoom: { wheel: false }
  });

  // Axis of symmetry — dashed gray vertical line
  board.create('segment', [[0, -1], [0, 6.5]], {
    strokeColor: '#555555', strokeWidth: 1.0, dash: 2,
    highlight: false, fixed: true
  });

  // Vertex at origin
  board.create('point', [0, 0], {
    name: 'V', showInfobox: false,
    label: { offset: [9, -16], cssStyle: 'font-weight:600;color:#222222;font-size:13px;' },
    fillColor: '#222222', strokeColor: '#fff', strokeWidth: 1.5, size: 4,
    fixed: true, highlight: false
  });

  // Focus glider on invisible vertical segment, p ∈ [1, 5]
  var axisSeg = board.create('segment', [[0, 1], [0, 5]], { visible: false, fixed: true });
  var F = board.create('glider', [0, 2.5, axisSeg], {
    name: 'F', showInfobox: false,
    label: { offset: [12, 0], cssStyle: 'font-weight:600;color:#DC2626;font-size:14px;' },
    fillColor: '#DC2626', strokeColor: '#fff', strokeWidth: 2, size: 6,
    highlightFillColor: '#DC2626', highlightStrokeColor: '#DC2626'
  });

  // Parabola y = x^2 / (4p) — primary curve
  board.create('functiongraph', [
    function(x) { return x*x / (4 * F.Y()); },
    -5, 5
  ], { strokeColor: '#222222', strokeWidth: 1.8, highlight: false, fixed: true });

  // Parallel rays at four x positions
  [-3.5, -2, 2, 3.5].forEach(function(rx) {
    var impact = board.create('point', [
      function() { return rx; },
      function() { return rx*rx / (4 * F.Y()); }
    ], { visible: false, fixed: true, showInfobox: false });
    board.create('arrow', [[rx, 6.2], impact], {
      strokeColor: '#666666', strokeWidth: 1.2,
      lastArrow: { type: 1, size: 6 }, highlight: false, fixed: true
    });
    board.create('arrow', [impact, F], {
      strokeColor: '#2563EB', strokeWidth: 1.2,
      lastArrow: { type: 1, size: 6 }, highlight: false, fixed: true
    });
  });

  board.update();
</script>
</body>
</html>
