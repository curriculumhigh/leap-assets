<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Piecewise ft3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; } .container { max-width: 380px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); } .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); } #board { width: 100%; height: 100%; }</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
var board = JXG.JSXGraph.initBoard('board', { boundingbox: [-5, 4, 5, -3], axis: true, grid: true, keepAspectRatio: true, showNavigation: false, showCopyright: false, pan: { enabled: false }, zoom: { enabled: false },
  defaultAxes: { x: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 } }, y: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 } } },
  grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 } });
board.create('text', [4.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
board.create('text', [0.25, 3.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });
var segOpts = { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, straightFirst: false, straightLast: false, highlight: false };
board.create('segment', [[-4, -1], [-1, 3]], segOpts);
board.create('segment', [[-1, 3], [1, 3]], segOpts);
board.create('segment', [[1, 3], [4, -2]], segOpts);
var endOpts = { face: 'o', size: 4, fillColor: '#222222', strokeColor: '#222222', fixed: true, name: '', showInfobox: false, highlight: false };
board.create('point', [-4, -1], endOpts);
board.create('point', [4, -2], endOpts);
var cornerOpts = { face: 'o', size: 3, fillColor: '#222222', strokeColor: '#222222', fixed: true, name: '', showInfobox: false, highlight: false };
board.create('point', [-1, 3], cornerOpts);
board.create('point', [1, 3], cornerOpts);
</script></body></html>
