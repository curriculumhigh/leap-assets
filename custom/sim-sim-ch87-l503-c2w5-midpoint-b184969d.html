<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midpoint on the Argand Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 660px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 190px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .explainer {
            font-size: 13px; color: #444; line-height: 1.65;
        }
        .explainer .green { color: #059669; font-weight: 600; }
        .explainer .katex { font-size: 1em; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="explainer" id="panel-text"></div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        // ── Panel text with inline KaTeX ────────────────────────────────
        (function() {
            var el = document.getElementById('panel-text');
            var html = '';
            html += '<span class="green" id="kt-m"></span> sits halfway along the segment.<br><br>';
            html += 'Its real part is halfway between &minus;2 and 8; its imaginary part is halfway between 5 and &minus;7.';
            el.innerHTML = html;
            katex.render('m', document.getElementById('kt-m'), { throwOnError: false });
        })();

        // ── Board ───────────────────────────────────────────────────────
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 7.5, 10.5, -9],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // ── Axis name labels ────────────────────────────────────────────
        board.create('text', [8.5, 0.85, '<i>Real</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.3, 6.0, '<i>Imaginary</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });

        // ── Coordinates ─────────────────────────────────────────────────
        var W1 = [-2, 5];
        var W2 = [8, -7];
        var M  = [3, -1];

        // ── Segment w₁ → w₂ ────────────────────────────────────────────
        board.create('segment', [W1, W2], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Dashed guide lines from m to each axis ──────────────────────
        board.create('segment', [[M[0], M[1]], [0, M[1]]], {
            strokeColor: '#999999', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [[M[0], M[1]], [M[0], 0]], {
            strokeColor: '#999999', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // ── Tick marks (equal-half indicators) ──────────────────────────
        var dx = W2[0] - W1[0];
        var dy = W2[1] - W1[1];
        var len = Math.sqrt(dx * dx + dy * dy);
        var px = -dy / len;
        var py = dx / len;
        var tickHalf = 0.45;

        var t1x = (W1[0] + M[0]) / 2;
        var t1y = (W1[1] + M[1]) / 2;
        board.create('segment', [
            [t1x - px * tickHalf, t1y - py * tickHalf],
            [t1x + px * tickHalf, t1y + py * tickHalf]
        ], {
            strokeColor: '#059669', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var t2x = (M[0] + W2[0]) / 2;
        var t2y = (M[1] + W2[1]) / 2;
        board.create('segment', [
            [t2x - px * tickHalf, t2y - py * tickHalf],
            [t2x + px * tickHalf, t2y + py * tickHalf]
        ], {
            strokeColor: '#059669', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Points ──────────────────────────────────────────────────────
        board.create('point', W1, {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', W2, {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', M, {
            name: '', size: 6, color: '#059669', fixed: true,
            highlight: false, showInfobox: false
        });

        // ── Point labels (KaTeX) ────────────────────────────────────────
        board.create('text', [-3.9, 6.8, 'w_1 = -2+5i'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [6.4, -8.0, 'w_2 = 8-7i'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [4.3, -1.2, 'm = 3-i'], {
            fontSize: 13, color: '#059669', fixed: true, highlight: false, useKatex: true,
            cssStyle: 'font-weight:600'
        });
    </script>
</body>
</html>
