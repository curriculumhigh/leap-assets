<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hlt-parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 8.6, 4, -1.4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 2 }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [3.7, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.28, 8.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola y = x^2 (primary)
        board.create('functiongraph', [function(x) { return x * x; }, -2.95, 2.95], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('text', [2.7, 8.1, 'y = x²'], { fontSize: 13, color: '#222222', fixed: true, highlight: false });

        // Dashed horizontal reference line y = 4
        board.create('line', [[-4, 4], [4, 4]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, straightFirst: false, straightLast: false,
            fixed: true, highlight: false
        });
        board.create('text', [-3.85, 4.55, 'y = 4'], { fontSize: 13, color: '#DC2626', fixed: true, highlight: false });

        // Drop segments (thin dashed gray)
        board.create('segment', [[-2, 4], [-2, 0]], { strokeColor: '#9CA3AF', strokeWidth: 0.8, dash: 2, fixed: true, highlight: false });
        board.create('segment', [[2, 4], [2, 0]], { strokeColor: '#9CA3AF', strokeWidth: 0.8, dash: 2, fixed: true, highlight: false });

        // Intersection points
        board.create('point', [-2, 4], { name: '', size: 2, fillColor: '#DC2626', strokeColor: '#DC2626', fixed: true, highlight: false, showInfobox: false });
        board.create('point', [2, 4], { name: '', size: 2, fillColor: '#DC2626', strokeColor: '#DC2626', fixed: true, highlight: false, showInfobox: false });

        // x-value labels below axis
        board.create('text', [-2, -0.8, 'x = −2'], { fontSize: 12, color: '#222222', anchorX: 'middle', fixed: true, highlight: false });
        board.create('text', [2, -0.8, 'x = 2'], { fontSize: 12, color: '#222222', anchorX: 'middle', fixed: true, highlight: false });
    </script>
</body>
</html>
