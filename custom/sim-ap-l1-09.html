<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concave-up velocity curve split at t=3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); box-sizing: border-box; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); box-sizing: border-box; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
var board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-0.5, 13, 6.6, -1], axis: true,
    showNavigation: false, showCopyright: false,
    pan: { enabled: false }, zoom: { enabled: false },
    defaultAxes: {
        x: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
             ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 } },
        y: { strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
             ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 2 } }
    },
    grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
});

// v(t) = t^2 / 3 : passes through (0,0), (3,3), (6,12) — increasing, concave up
function vFunc(t) { return (t * t) / 3; }

// Build filled regions under the curve by sampling it down to the x-axis.
function regionPts(a, b) {
    var pts = [[a, 0]];
    var n = 40;
    for (var i = 0; i <= n; i++) {
        var x = a + (b - a) * i / n;
        pts.push([x, vFunc(x)]);
    }
    pts.push([b, 0]);
    return pts;
}

// Left piece [0,3] shaded green
board.create('polygon', regionPts(0, 3), {
    fillColor: '#059669', fillOpacity: 0.13, highlight: false,
    borders: { visible: false }, vertices: { visible: false }, fixed: true
});
// Right piece [3,6] shaded green (same color, larger area)
board.create('polygon', regionPts(3, 6), {
    fillColor: '#059669', fillOpacity: 0.13, highlight: false,
    borders: { visible: false }, vertices: { visible: false }, fixed: true
});

// Primary curve
board.create('functiongraph', [vFunc, 0, 6], { strokeColor: '#2563EB', strokeWidth: 1.8, fixed: true, highlight: false });

// Vertical dashed divider at t = 3
board.create('segment', [[3, 0], [3, vFunc(3)]], {
    strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
});

// Endpoint markers
board.create('point', [6, vFunc(6)], { name: '', size: 2.5, color: '#2563EB', fixed: true, highlight: false, showInfobox: false });

// Axis labels with units
board.create('text', [6.5, -0.7, 't (s)'], { fontSize: 13, fixed: true, highlight: false, anchorX: 'right' });
board.create('text', [0.15, 12.4, 'v (m/s)'], { fontSize: 13, fixed: true, highlight: false });
</script>
</body>
</html>
