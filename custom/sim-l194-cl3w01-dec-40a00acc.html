<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decreasing Curve with Tangent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 420px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.4, 5, 5.2, -0.4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.9, -0.25, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.15, 4.7, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // h(x) = 0.16*(5-x)^2 + 0.35*(5-x) + 0.6
        function h(x) {
            var u = 5 - x;
            return 0.16 * u * u + 0.35 * u + 0.6;
        }

        // h'(x) = -0.32*(5-x) - 0.35
        function hPrime(x) {
            return -0.32 * (5 - x) - 0.35;
        }

        // Plot the curve with arrowheads at both ends
        board.create('functiongraph', [h, 0.4, 4.8], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 }
        });

        // Key point at x = 2.5
        var xPt = 2.5;
        var yPt = h(xPt);

        board.create('point', [xPt, yPt], {
            name: '',
            size: 4,
            color: '#222222',
            fixed: true,
            highlight: false
        });

        // Tangent segment centered on the point, ~1.6 units wide
        var slope = hPrime(xPt);
        var halfWidth = 0.8;
        var x1 = xPt - halfWidth;
        var y1 = yPt - halfWidth * slope;
        var x2 = xPt + halfWidth;
        var y2 = yPt + halfWidth * slope;

        board.create('segment', [[x1, y1], [x2, y2]], {
            strokeColor: '#0EA5E9',
            strokeWidth: 2.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
