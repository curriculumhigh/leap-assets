<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>generic-signed-area</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 3, 8.7, -3],
            axis: true,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            keepAspectRatio: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', drawLabels: false, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', drawLabels: false, minorTicks: 0, ticksDistance: 1 }
                }
            }
        });

        board.create('polygon', [[0, 0], [2.5, 2], [5, 0]], {
            borders: { strokeColor: 'none', strokeWidth: 0 },
            fillColor: '#059669', fillOpacity: 0.13, vertices: { visible: false }, fixed: true, highlight: false
        });
        board.create('polygon', [[5, 0], [6.5, -2], [8, 0]], {
            borders: { strokeColor: 'none', strokeWidth: 0 },
            fillColor: '#DC2626', fillOpacity: 0.13, vertices: { visible: false }, fixed: true, highlight: false
        });

        board.create('polygonalchain', [[0, 0], [2.5, 2], [5, 0], [6.5, -2], [8, 0]], {
            borders: { strokeColor: '#2563EB', strokeWidth: 1.8 },
            vertices: { visible: false }, fillColor: 'none', fixed: true, highlight: false
        });

        // Mark a, c, b on the curve
        var marks = [[0, 0], [5, 0], [8, 0]];
        for (var i = 0; i < marks.length; i++) {
            board.create('point', [marks[i][0], marks[i][1]], {
                name: '', size: 2.5, color: '#2563EB', fixed: true, showInfobox: false, highlight: false
            });
        }

        // x-axis position labels a, c, b
        board.create('text', [0, -0.32, 'a'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', fixed: true, highlight: false });
        board.create('text', [5, -0.32, 'c'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', fixed: true, highlight: false });
        board.create('text', [8, -0.32, 'b'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', fixed: true, highlight: false });

        board.create('text', [2.5, 0.75, 'area = 5'], { useKatex: true, fontSize: 13, color: '#047857', anchorX: 'middle', fixed: true, highlight: false });
        board.create('text', [6.5, -0.85, 'area = 3'], { useKatex: true, fontSize: 13, color: '#B91C1C', anchorX: 'middle', fixed: true, highlight: false });

        board.create('text', [8.35, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.18, 2.75, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });
    </script>
</body>
</html>
