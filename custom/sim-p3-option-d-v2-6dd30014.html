<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>P3 Option D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}</style>
</head>
<body>
<div id="board" style="width:290px;height:240px;background:white;"></div>

<script>
var b=JXG.JSXGraph.initBoard('board',{boundingbox:[0.83,5.6,2.17,-0.7],axis:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false},keepAspectRatio:false});
for(var yv=0;yv<=5;yv++){b.create('line',[[1,yv],[2,yv]],{straightFirst:false,straightLast:false,strokeColor:'#888',strokeWidth:0.35,fixed:true,highlight:false});}
[0,5].forEach(function(yv){b.create('line',[[1,yv],[2,yv]],{straightFirst:false,straightLast:false,strokeColor:'#000',strokeWidth:1,fixed:true,highlight:false});});
[1,2].forEach(function(xv){b.create('line',[[xv,0],[xv,5]],{straightFirst:false,straightLast:false,strokeColor:'#000',strokeWidth:1,fixed:true,highlight:false});});
[20,30,40,50,60,70,80,90].forEach(function(xv){var lx=Math.log(xv)/Math.LN10;b.create('line',[[lx,0],[lx,5]],{straightFirst:false,straightLast:false,strokeColor:'#888',strokeWidth:0.35,fixed:true,highlight:false});});
for(var yv=0;yv<=5;yv++){b.create('text',[0.95,yv,String(yv)],{fontSize:11,color:'#000',anchorX:'right',anchorY:'middle',fixed:true,highlight:false,cssStyle:'font-weight:600;'});}
b.create('text',[1,-0.25,'10'],{fontSize:11,color:'#000',anchorX:'middle',anchorY:'top',fixed:true,highlight:false,cssStyle:'font-weight:600;'});
b.create('text',[2,-0.25,'100'],{fontSize:11,color:'#000',anchorX:'middle',anchorY:'top',fixed:true,highlight:false,cssStyle:'font-weight:600;'});
var pts=[{x:10,y:30},{x:20,y:90},{x:30,y:270},{x:40,y:810},{x:50,y:2430}];
pts.forEach(function(p){var lx=Math.log(p.x)/Math.LN10;var ly=Math.log(p.y)/Math.LN10;b.create('point',[lx,ly],{name:'',size:3,fillColor:'#000',strokeColor:'#000',fixed:true,highlight:false,showInfobox:false});});
</script>
</body></html>
