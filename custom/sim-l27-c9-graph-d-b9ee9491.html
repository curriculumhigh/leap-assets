<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option D Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 320px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 14.9, 8.9, -1.3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ──────────────────────────────────────────────── */
        var i;
        for (i = 0; i <= 8; i++) {
            board.create('line', [[i, -1.3], [i, 14.9]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        for (i = 0; i <= 14; i++) {
            board.create('line', [[-0.9, i], [8.9, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        /* ── Axes ──────────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-0.9, 0], [8.9, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -1.3], [0, 14.9]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks (short segments) ───────────────────────── */
        var tickLen = 0.18;
        for (i = 1; i <= 8; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
        }
        for (i = 1; i <= 14; i++) {
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
        }

        /* ── Tick value labels (only selected values) ──────────── */
        var tickStyle = 'background-color:#ffffff;padding:0 2px;';
        var xTickVals = [2, 4, 6, 8];
        var yTickVals = [2, 4, 6, 8, 10, 12, 14];

        for (i = 0; i < xTickVals.length; i++) {
            board.create('text', [xTickVals[i], -0.55, String(xTickVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                cssStyle: tickStyle, fixed: true, highlight: false
            });
        }
        for (i = 0; i < yTickVals.length; i++) {
            board.create('text', [-0.4, yTickVals[i], String(yTickVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                cssStyle: tickStyle, fixed: true, highlight: false
            });
        }

        /* ── Axis name labels ──────────────────────────────────── */
        board.create('text', [8.8, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.25, 14.4, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        /* ── Curve y = 6/(x+1) ─────────────────────────────────── */
        board.create('functiongraph', [
            function(x) { return 6 / (x + 1); }, 0, 8.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Key points ────────────────────────────────────────── */
        var pts = [[0, 6], [1, 3], [2, 2], [5, 1]];
        var lblTexts = ['(0,\\, 6)', '(1,\\, 3)', '(2,\\, 2)', '(5,\\, 1)'];
        var lblPos = [[0.3, 6.4], [1.3, 3.4], [2.3, 2.4], [5.3, 1.4]];

        for (i = 0; i < pts.length; i++) {
            board.create('point', [pts[i][0], pts[i][1]], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
            board.create('text', [lblPos[i][0], lblPos[i][1], lblTexts[i]], {
                useKatex: true, fontSize: 12, color: '#222222',
                anchorX: 'left', anchorY: 'bottom',
                cssStyle: 'white-space:nowrap;',
                fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
