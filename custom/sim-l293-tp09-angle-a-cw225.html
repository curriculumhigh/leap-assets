<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle in Standard Position</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
.wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
svg { width: 100%; height: 100%; max-width: 100%; max-height: 100%; display: block; background: #ffffff; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="-150 -150 300 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Angle in standard position">
  <!-- axes -->
  <line x1="-138" y1="0" x2="132" y2="0" stroke="#444444" stroke-width="1.5"/>
  <polygon points="142,0 130,-5 130,5" fill="#444444"/>
  <line x1="0" y1="138" x2="0" y2="-132" stroke="#444444" stroke-width="1.5"/>
  <polygon points="0,-142 -5,-130 5,-130" fill="#444444"/>
  <text x="136" y="20" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">x</text>
  <text x="14" y="-132" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">y</text>
  <!-- rotation arc -->
  <path d="M 56.00 -0.00 A 56 56 0 1 1 -46.56 -31.11" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="-39.60,-39.60 -43.49,-27.93 -51.27,-35.71" fill="#DC2626"/>
  <!-- initial side -->
  <line x1="0" y1="0" x2="118" y2="0" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- terminal side -->
  <line x1="0" y1="0" x2="-83.44" y2="-83.44" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="3.2" fill="#222222"/>
</svg>
</div>
</body>
</html>
