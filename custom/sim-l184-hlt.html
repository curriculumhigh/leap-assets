<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>
html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.container{max-width:700px;margin:0 auto;padding:6px;height:calc(100% - 12px);}
.board-wrapper{background:white;border-radius:8px;padding:10px;height:calc(100% - 20px);}
#board{width:100%;height:100%;}
</style></head>
<body>
<div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
<script>
var board=JXG.JSXGraph.initBoard('board',{boundingbox:[-4,8.6,4,-1.4],keepaspectratio:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
board.create('axis',[[0,0],[1,0]],{strokeColor:'#444',strokeWidth:1.2,lastArrow:{type:2,size:6},ticks:{visible:false}});
board.create('axis',[[0,0],[0,1]],{strokeColor:'#444',strokeWidth:1.2,lastArrow:{type:2,size:6},ticks:{visible:false}});
board.create('text',[3.55,-0.55,'<i>x</i>'],{fontSize:15,fixed:true,highlight:false});
board.create('text',[0.28,8.15,'<i>y</i>'],{fontSize:15,fixed:true,highlight:false});
// parabola y = x^2
board.create('functiongraph',[function(x){return x*x;},-3,3],{strokeColor:'#2563EB',strokeWidth:2,fixed:true,highlight:false});
board.create('text',[2.15,7.3,'<i>y</i> = <i>x</i>²'],{fontSize:14,color:'#2563EB',fixed:true,highlight:false});
// horizontal line y = 4
board.create('line',[[-4,4],[4,4]],{strokeColor:'#DC2626',strokeWidth:1.6,dash:2,straightFirst:true,straightLast:true,fixed:true,highlight:false});
board.create('text',[-3.8,4.45,'<i>y</i> = 4'],{fontSize:13,color:'#DC2626',fixed:true,highlight:false});
// intersection points (-2,4) and (2,4)
board.create('point',[-2,4],{name:'',size:3,face:'o',fillColor:'#DC2626',strokeColor:'#DC2626',fixed:true,highlight:false});
board.create('point',[2,4],{name:'',size:3,face:'o',fillColor:'#DC2626',strokeColor:'#DC2626',fixed:true,highlight:false});
// drop segments to x-axis
board.create('segment',[[-2,4],[-2,0]],{strokeColor:'#9CA3AF',strokeWidth:1,dash:1,fixed:true,highlight:false});
board.create('segment',[[2,4],[2,0]],{strokeColor:'#9CA3AF',strokeWidth:1,dash:1,fixed:true,highlight:false});
board.create('text',[-2.35,-0.9,'<i>x</i> = −2'],{fontSize:12,color:'#444',fixed:true,highlight:false});
board.create('text',[1.75,-0.9,'<i>x</i> = 2'],{fontSize:12,color:'#444',fixed:true,highlight:false});
</script></body></html>
