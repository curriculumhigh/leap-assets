<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 4px;
            height: calc(100% - 8px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
        .JXGtext {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 26, 10.5, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false,
                        label: {
                            fontSize: 9,
                            color: '#444444',
                            anchorX: 'middle',
                            offset: [0, -10]
                        }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        drawZero: false,
                        label: {
                            fontSize: 9,
                            color: '#444444',
                            anchorX: 'right',
                            offset: [-6, 0]
                        }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        board.create('text', [10.0, -0.9, '<i>x</i>'], {
            fontSize: 12, fixed: true, highlight: false, color: '#444444'
        });
        board.create('text', [0.3, 25.0, '<i>y</i>'], {
            fontSize: 12, fixed: true, highlight: false, color: '#444444'
        });

        board.create('functiongraph', [
            function(x) {
                return (9 * Math.pow(x - 5, 2) + 8) / 2;
            },
            -1.5, 10.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
