<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Option D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 320px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 10.9, 10.9, -1.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ────────────────────────────────────────── */
        var i;
        for (i = 0; i <= 10; i++) {
            board.create('segment', [[i, 0], [i, 10]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 0; i <= 10; i++) {
            board.create('segment', [[0, i], [10, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        /* ── Axes ────────────────────────────────────────── */
        board.create('arrow', [[0, 0], [10.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });
        board.create('arrow', [[0, 0], [0, 10.5]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        /* ── Tick marks every 1 ────────────────────────── */
        var tickLen = 0.15;
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
        }

        /* ── Tick value labels at 2, 4, 6, 8, 10 ────── */
        var tickVals = [2, 4, 6, 8, 10];
        var t;
        for (t = 0; t < tickVals.length; t++) {
            /* x-axis values */
            board.create('text', [tickVals[t], -0.55, String(tickVals[t])], {
                fontSize: 11, anchorX: 'middle', anchorY: 'top',
                color: '#444444', fixed: true, highlight: false
            });
            /* y-axis values */
            board.create('text', [-0.45, tickVals[t], String(tickVals[t])], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        /* ── Axis name labels (KaTeX italic, 14px) ────── */
        board.create('text', [10.45, 0.4, 'x'], {
            fontSize: 14, useKatex: true, color: '#444444',
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.45, 10.45, 'y'], {
            fontSize: 14, useKatex: true, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        /* ── Curve: y = 8·(1/2)^x ───────────────────── */
        board.create('functiongraph', [
            function(x) { return 8 * Math.pow(0.5, x); },
            0, 10
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Key points ──────────────────────────────── */
        board.create('point', [0, 8], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [1, 4], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [2, 2], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [3, 1], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        /* ── Coordinate labels (KaTeX, 12px) ─────────── */
        /* (0,8) — above-right of point */
        board.create('text', [0.35, 8.4, '(0,\\, 8)'], {
            fontSize: 12, useKatex: true, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        /* (1,4) — above-right of point */
        board.create('text', [1.3, 4.4, '(1,\\, 4)'], {
            fontSize: 12, useKatex: true, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        /* (2,2) — above-right of point */
        board.create('text', [2.3, 2.4, '(2,\\, 2)'], {
            fontSize: 12, useKatex: true, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        /* (3,1) — above-right of point */
        board.create('text', [3.3, 1.45, '(3,\\, 1)'], {
            fontSize: 12, useKatex: true, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
