<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic Growth P vs t</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 385, 55, -45],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Grid lines — vertical (every 10 in t from 0 to 50)
        var t;
        for (t = 0; t <= 50; t += 10) {
            board.create('segment', [[t, 0], [t, 350]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // Grid lines — horizontal (every 50 in P from 0 to 350)
        var p;
        for (p = 0; p <= 350; p += 50) {
            board.create('segment', [[0, p], [50, p]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // Axes
        // t-axis (horizontal)
        board.create('arrow', [[0, 0], [53, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // P-axis (vertical)
        board.create('arrow', [[0, 0], [0, 370]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels — t-axis (every 10)
        for (t = 0; t <= 50; t += 10) {
            board.create('segment', [[t, -5], [t, 5]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            board.create('text', [t, -18, String(t)], {
                fontSize: 11, color: '#333333', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Tick marks and labels — P-axis (every 50)
        for (p = 0; p <= 350; p += 50) {
            board.create('segment', [[-1, p], [1, p]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (p === 0) continue; // skip 0 to avoid overlap with t-axis origin
            board.create('text', [-4.5, p, String(p)], {
                fontSize: 11, color: '#333333', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [52, -18, 't'], {
            fontSize: 14, color: '#333333', anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style:italic',
            fixed: true, highlight: false
        });
        board.create('text', [-4.5, 370, 'P'], {
            fontSize: 14, color: '#333333', anchorX: 'right', anchorY: 'middle',
            cssStyle: 'font-style:italic',
            fixed: true, highlight: false
        });

        // Logistic curve: P = 300 / (1 + 14 * e^(-0.2t))
        board.create('functiongraph', [
            function(x) {
                if (x < 0 || x > 50) return NaN;
                return 300 / (1 + 14 * Math.exp(-0.2 * x));
            }, 0, 50
        ], {
            strokeColor: '#2563EB', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
