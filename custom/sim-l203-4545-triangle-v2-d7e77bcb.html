<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-45-90 triangle on the unit circle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX loaded WITHOUT defer so `katex` is defined before the inline board script runs. -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 420px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.35, 1.5, 1.4, -0.32],
            keepAspectRatio: true,
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var s = Math.SQRT2 / 2; // sqrt(2)/2 ≈ 0.7071

        // Vertices
        var O = board.create('point', [0, 0], { name: '', size: 3, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false, showInfobox: false });
        var M = board.create('point', [s, 0], { name: '', size: 3, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false, showInfobox: false });
        var P = board.create('point', [s, s], { name: '', size: 3, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false, showInfobox: false });

        // Quarter unit circle (light, dashed, radius 1)
        var cX = board.create('point', [1, 0], { visible: false, fixed: true, name: '' });
        var cY = board.create('point', [0, 1], { visible: false, fixed: true, name: '' });
        board.create('arc', [O, cX, cY], { strokeColor: '#9CA3AF', strokeWidth: 1, dash: 2, fixed: true, highlight: false, withLabel: false, lastArrow: false });

        // Shaded triangle O-M-P
        board.create('polygon', [O, M, P], { fillColor: '#2563EB', fillOpacity: 0.10, borders: { visible: false }, hasInnerPoints: false, fixed: true, highlight: false });

        // Legs and emphasized hypotenuse (the radius = 1)
        board.create('segment', [O, M], { strokeColor: '#555555', strokeWidth: 1.6, fixed: true, highlight: false });
        board.create('segment', [M, P], { strokeColor: '#555555', strokeWidth: 1.6, fixed: true, highlight: false });
        board.create('segment', [O, P], { strokeColor: '#222222', strokeWidth: 2.4, fixed: true, highlight: false });

        // Right-angle mark at M
        var d = 0.09;
        board.create('segment', [[s - d, 0], [s - d, d]], { strokeColor: '#DC2626', strokeWidth: 1.3, fixed: true, highlight: false });
        board.create('segment', [[s - d, d], [s, d]], { strokeColor: '#DC2626', strokeWidth: 1.3, fixed: true, highlight: false });

        // 45 degree angle arc at O
        var aX = board.create('point', [0.30, 0], { visible: false, fixed: true, name: '' });
        var aP = board.create('point', [0.30 * Math.cos(Math.PI / 4), 0.30 * Math.sin(Math.PI / 4)], { visible: false, fixed: true, name: '' });
        board.create('arc', [O, aX, aP], { strokeColor: '#DC2626', strokeWidth: 1.3, fixed: true, highlight: false, withLabel: false, lastArrow: false });
        // Smaller "45°" label, nudged in closer to the arc (arc midpoint ~ r=0.30 @ 22.5°)
        board.create('text', [0.385, 0.158, '45^\\circ'], { useKatex: true, fontSize: 11, color: '#DC2626', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });

        // Hypotenuse length label (kept)
        board.create('text', [0.22, 0.54, '1'], { useKatex: true, fontSize: 16, color: '#222222', cssStyle: 'font-weight:bold', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });

        // Vertex labels
        board.create('text', [-0.10, -0.11, 'O'], { useKatex: true, fontSize: 16, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [0.79, -0.14, 'M'], { useKatex: true, fontSize: 16, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
        board.create('text', [0.81, 0.80, 'P'], { useKatex: true, fontSize: 16, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle' });
    </script>
</body>
</html>
