<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of f′(x)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.2, 4.8, 4.75, -2.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: {
                            fontSize: 11,
                            offset: [0, -14],
                            anchorX: 'middle'
                        },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: {
                            fontSize: 11,
                            offset: [-20, 0],
                            anchorX: 'right'
                        },
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Hide the tick label at x = 5 to avoid collision with the axis label
        board.on('update', function() {
            var xAxis = board.defaultAxes.x;
            if (xAxis && xAxis.ticks && xAxis.ticks[0]) {
                var ticks = xAxis.ticks[0];
                if (ticks.labels) {
                    for (var i = 0; i < ticks.labels.length; i++) {
                        var lbl = ticks.labels[i];
                        if (lbl && lbl.plaintext === '5') {
                            lbl.setAttribute({ visible: false });
                        }
                    }
                }
            }
        });
        board.update();

        // Axis labels
        board.create('text', [4.5, 0.3, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 4.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Piecewise-linear segments
        var vertices = [[-2, -1], [0, 2], [2, 1], [4, 3]];

        for (var i = 0; i < vertices.length - 1; i++) {
            board.create('segment', [vertices[i], vertices[i + 1]], {
                strokeColor: '#2563EB',
                strokeWidth: 1.8,
                fixed: true,
                highlight: false
            });
        }

        // Solid dots at each vertex
        for (var j = 0; j < vertices.length; j++) {
            board.create('point', vertices[j], {
                name: '',
                size: 4,
                color: '#2563EB',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }

        // Label: y = f′(x), placed in clear space upper-left area
        board.create('text', [-1.5, 3.2, 'y = f\u2032(x)'], {
            fontSize: 13,
            color: '#2563EB',
            fixed: true,
            highlight: false,
            anchorX: 'middle'
        });
    </script>
</body>
</html>
