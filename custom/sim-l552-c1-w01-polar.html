<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Point, Two Polar Names</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 420px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.8, 7.6, 7.8, -7.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var GRID_COL = '#9CA3AF';
        var GRID_W = 1;
        var MAX_R = 6;
        var COL_PRIMARY = '#222222';
        var COL_SECOND = '#2563EB';
        var COL_POINT  = '#DC2626';   // plotted/attention point + its label (spec)

        // ── Concentric circles ──────────────────────────────────────────
        var radii = [1, 2, 3, 4, 5, 6];
        for (var i = 0; i < radii.length; i++) {
            board.create('circle', [[0, 0], radii[i]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W, fillColor: 'none',
                fixed: true, highlight: false
            });
        }

        // ── Radial lines every π/12 (24 directions) ────────────────────
        for (var k = 0; k < 24; k++) {
            var ang = k * Math.PI / 12;
            var ex = MAX_R * Math.cos(ang);
            var ey = MAX_R * Math.sin(ang);
            board.create('segment', [[0, 0], [ex, ey]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false
            });
        }

        // ── Polar axis (0-direction) — darkened ─────────────────────────
        board.create('segment', [[0, 0], [MAX_R + 0.3, 0]], {
            strokeColor: COL_PRIMARY, strokeWidth: 2.2,
            fixed: true, highlight: false
        });

        // Tick marks on polar axis at each circle crossing
        for (var t = 1; t <= MAX_R; t++) {
            board.create('segment', [[t, -0.13], [t, 0.13]], {
                strokeColor: COL_PRIMARY, strokeWidth: 1.8,
                fixed: true, highlight: false
            });
        }

        // Radius labels: only 2, 4, 6
        var labelRadii = [2, 4, 6];
        for (var lr = 0; lr < labelRadii.length; lr++) {
            board.create('text', [labelRadii[lr], -0.42, String(labelRadii[lr])], {
                fontSize: 11, color: '#555555', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Angle labels (π/6 family only) ──────────────────────────────
        var angleLabels = [
            { num: '\\pi/6', a: Math.PI / 6 },
            { num: '\\pi/3', a: Math.PI / 3 },
            { num: '\\pi/2', a: Math.PI / 2 },
            { num: '2\\pi/3', a: 2 * Math.PI / 3 },
            { num: '5\\pi/6', a: 5 * Math.PI / 6 },
            { num: '\\pi', a: Math.PI },
            { num: '7\\pi/6', a: 7 * Math.PI / 6 },
            { num: '4\\pi/3', a: 4 * Math.PI / 3 },
            { num: '3\\pi/2', a: 3 * Math.PI / 2 },
            { num: '5\\pi/3', a: 5 * Math.PI / 3 },
            { num: '11\\pi/6', a: 11 * Math.PI / 6 }
        ];
        var LABEL_R = MAX_R + 0.7;
        for (var al = 0; al < angleLabels.length; al++) {
            var aObj = angleLabels[al];
            var lx = LABEL_R * Math.cos(aObj.a);
            var ly = LABEL_R * Math.sin(aObj.a);
            board.create('text', [lx, ly, aObj.num], {
                useKatex: true, fontSize: 10, color: '#374151',
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // 0 and 2π labels at polar axis end
        board.create('text', [MAX_R + 0.7, 0.28, '0'], {
            useKatex: true, fontSize: 10, color: '#374151',
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [MAX_R + 0.7, -0.28, '2\\pi'], {
            useKatex: true, fontSize: 10, color: '#374151',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        // ── Pole ────────────────────────────────────────────────────────
        board.create('point', [0, 0], {
            name: '', size: 2.5, color: COL_PRIMARY, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [0.35, -0.45, '\\text{pole}'], {
            useKatex: true, fontSize: 11, color: COL_PRIMARY,
            fixed: true, highlight: false
        });

        // ── Point A coordinates ─────────────────────────────────────────
        var angA = 5 * Math.PI / 6;
        var Ax = 5 * Math.cos(angA);
        var Ay = 5 * Math.sin(angA);

        // ── SOLID arrow: pole → A along 5π/6 direction (primary color) ─
        board.create('arrow', [[0, 0], [Ax, Ay]], {
            strokeColor: COL_SECOND, strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Label for the solid arrow: (5, 5π/6) — placed alongside midpoint
        var midSolidX = Ax * 0.5;
        var midSolidY = Ay * 0.5;
        // Offset perpendicular to the ray (to the left/above)
        var perpSolidX = -Math.sin(angA);
        var perpSolidY = Math.cos(angA);
        board.create('text', [midSolidX + perpSolidX * 1.45, midSolidY + perpSolidY * 1.45,
            '\\color{' + COL_PRIMARY + '}{\\left(5,\\,\\dfrac{5\\pi}{6}\\right)}'], {
            useKatex: true, fontSize: 13, anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── DASHED construction: negative-r path via 11π/6 ─────────────
        var angDash = 11 * Math.PI / 6;
        var dashTipX = 5 * Math.cos(angDash);
        var dashTipY = 5 * Math.sin(angDash);

        // Dashed ray: pole → tip of 11π/6 direction at r=5
        board.create('segment', [[0, 0], [dashTipX, dashTipY]], {
            strokeColor: '#4B5563', strokeWidth: 2, dash: 3,
            fixed: true, highlight: false
        });

        // Dashed arrow: from that tip, back through pole, to A
        board.create('arrow', [[dashTipX, dashTipY], [Ax, Ay]], {
            strokeColor: '#4B5563', strokeWidth: 2, dash: 3,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // The dashed construction is deliberately LEFT UNLABELLED: the widget asks the
        // student to name this second polar pair, so printing it here would give the
        // answer away. The geometry (ray at 11pi/6, then backwards through the pole)
        // is all that should be shown.

        // ── Point A — key point, on top of everything ───────────────────
        board.create('point', [Ax, Ay], {
            name: '', size: 5, color: COL_POINT,
            fixed: true, highlight: false, showInfobox: false,
            layer: 9
        });

        // Label A — offset to the upper-RIGHT so it clears the 5pi/6 ray label on the rim
        board.create('text', [Ax + 0.45, Ay + 0.35, '\\boldsymbol{A}'], {
            useKatex: true, fontSize: 15, color: COL_POINT,
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });

    </script>
</body>
</html>
