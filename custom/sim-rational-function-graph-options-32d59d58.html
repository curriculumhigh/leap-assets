<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Function Graph Options A–D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 760px; margin: 0; padding: 6px;
            height: calc(100% - 12px);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            height: 100%;
        }
        .graph-cell {
            background: white;
            border-radius: 8px;
            padding: 6px;
            position: relative;
        }
        .graph-label {
            position: absolute;
            top: 10px; left: 14px;
            font-size: 18px; font-weight: 700;
            color: #222222;
            z-index: 10;
            background: rgba(255,255,255,0.85);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .board-div {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="graph-cell">
                <div class="graph-label">A</div>
                <div class="board-div" id="boardA"></div>
            </div>
            <div class="graph-cell">
                <div class="graph-label">B</div>
                <div class="board-div" id="boardB"></div>
            </div>
            <div class="graph-cell">
                <div class="graph-label">C</div>
                <div class="board-div" id="boardC"></div>
            </div>
            <div class="graph-cell">
                <div class="graph-label">D</div>
                <div class="board-div" id="boardD"></div>
            </div>
        </div>
    </div>

    <script>
        // ── Board factory ───────────────────────────────────────────────
        function createBoard(id) {
            return JXG.JSXGraph.initBoard(id, {
                boundingbox: [-8, 10, 8, -10],
                axis: true,
                showNavigation: false,
                showCopyright: false,
                pan: { enabled: false },
                zoom: { enabled: false },
                defaultAxes: {
                    x: {
                        strokeColor: '#444444', strokeWidth: 1.2,
                        lastArrow: { type: 2, size: 5 },
                        ticks: {
                            strokeColor: '#444444',
                            label: { fontSize: 9 },
                            minorTicks: 0,
                            ticksDistance: 2
                        }
                    },
                    y: {
                        strokeColor: '#444444', strokeWidth: 1.2,
                        lastArrow: { type: 2, size: 5 },
                        ticks: {
                            strokeColor: '#444444',
                            label: { fontSize: 9 },
                            minorTicks: 0,
                            ticksDistance: 2
                        }
                    }
                },
                grid: {
                    strokeColor: '#D1D5DB',
                    strokeWidth: 0.4
                }
            });
        }

        // ── Draw rational function on a board ───────────────────────────
        // f(x) = numerator / (x - va) + ha
        // Split into two branches to avoid drawing through the asymptote
        function drawRational(board, numerator, va, ha) {
            var EPS = 0.05;
            var BB = board.getBoundingBox();
            var xMin = BB[0], xMax = BB[2];

            // Vertical asymptote (red reference, dashed)
            board.create('line', [[va, 0], [va, 1]], {
                strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2,
                fixed: true, highlight: false,
                point1: { visible: false }, point2: { visible: false }
            });

            // Horizontal asymptote (cyan construction, dashed)
            board.create('line', [[0, ha], [1, ha]], {
                strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
                fixed: true, highlight: false,
                point1: { visible: false }, point2: { visible: false }
            });

            // Left branch: x from xMin to va - EPS
            board.create('functiongraph', [
                function(x) { return numerator / (x - va) + ha; },
                xMin, va - EPS
            ], {
                strokeColor: '#222222', strokeWidth: 1.8,
                fixed: true, highlight: false
            });

            // Right branch: x from va + EPS to xMax
            board.create('functiongraph', [
                function(x) { return numerator / (x - va) + ha; },
                va + EPS, xMax
            ], {
                strokeColor: '#222222', strokeWidth: 1.8,
                fixed: true, highlight: false
            });
        }

        // ── Create the four boards ──────────────────────────────────────

        // Option A (correct): f(x) = -12/(x+2) + 3
        // VA: x = -2, HA: y = 3, passes through (0,-3) and (2,0)
        var boardA = createBoard('boardA');
        drawRational(boardA, -12, -2, 3);

        // Option B (wrong VA): f(x) = -12/(x-2) + 3
        // VA: x = 2, HA: y = 3
        var boardB = createBoard('boardB');
        drawRational(boardB, -12, 2, 3);

        // Option C (wrong HA): f(x) = -12/(x+2) - 3
        // VA: x = -2, HA: y = -3
        var boardC = createBoard('boardC');
        drawRational(boardC, -12, -2, -3);

        // Option D (flipped branches): f(x) = 12/(x+2) + 3
        // VA: x = -2, HA: y = 3, but branches flipped
        var boardD = createBoard('boardD');
        drawRational(boardD, 12, -2, 3);
    </script>
</body>
</html>
