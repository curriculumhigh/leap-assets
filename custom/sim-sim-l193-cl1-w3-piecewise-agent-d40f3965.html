<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Function Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 4, 5.4, -0.6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.0, -0.35, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 3.7, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Piecewise function segments (no arrowheads — finite domain)
        // Horizontal segment: y = 1 from x = 0 to x = 2
        board.create('segment', [[0, 1], [2, 1]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Rising segment: from (2, 1) to (4, 3)
        board.create('segment', [[2, 1], [4, 3]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points
        board.create('point', [0, 1], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [2, 1], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [4, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Point labels
        board.create('text', [-0.05, 1.35, '(0,\\,1)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true, anchorX: 'left'
        });
        board.create('text', [2.1, 0.55, '(2,\\,1)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true, anchorX: 'left'
        });
        board.create('text', [4.1, 3.05, '(4,\\,3)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true, anchorX: 'left'
        });
    </script>
</body>
</html>
