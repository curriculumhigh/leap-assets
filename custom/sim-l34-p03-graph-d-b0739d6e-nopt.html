<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 320px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.6, 9.6, 5.6, -10.6],
            keepAspectRatio: false,
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid every 1 ─────────────────────────────────────────── */
        var gridX, gridY;
        for (gridX = -7; gridX <= 5; gridX++) {
            board.create('line', [[gridX, 0], [gridX, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        for (gridY = -10; gridY <= 9; gridY++) {
            board.create('line', [[0, gridY], [1, gridY]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        /* ── Axes ───────────────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-7.6, 0], [5.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -10.6], [0, 9.6]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks (every 1, no labels here) ──────────────────── */
        var tickLen = 0.25;
        var i;

        for (i = -7; i <= 5; i++) {
            if (i === 0) continue;
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
        }

        for (i = -10; i <= 9; i++) {
            if (i === 0) continue;
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
        }

        /* ── Asymptotes (dashed cyan) ──────────────────────────────── */
        /* Vertical x = -1 */
        board.create('line', [[-1, 0], [-1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            straightFirst: true, straightLast: true,
            fixed: true, highlight: false
        });
        /* Horizontal y = -3 */
        board.create('line', [[0, -3], [1, -3]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            straightFirst: true, straightLast: true,
            fixed: true, highlight: false
        });

        /* ── Curve: y = -4/(x+1) - 3 ─────────────────────────────── */
        var GAP = 0.15;

        /* Right branch: x > -1 + GAP */
        board.create('functiongraph', [
            function(x) { return -4 / (x + 1) - 3; },
            -1 + GAP, 5.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* Left branch: x < -1 - GAP */
        board.create('functiongraph', [
            function(x) { return -4 / (x + 1) - 3; },
            -7.6, -1 - GAP
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Tick-value labels with white background (high layer) ──── */
        var LABEL_LAYER = 9;
        var labelStyle = 'background-color:#ffffff;padding:0 2px;';

        /* X-axis labels: only -6, -4, -2, 2, 4 */
        var xLabels = [-6, -4, -2, 2, 4];
        for (i = 0; i < xLabels.length; i++) {
            board.create('text', [xLabels[i], -0.9, String(xLabels[i])], {
                fontSize: 11, color: '#444444',
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: labelStyle,
                layer: LABEL_LAYER
            });
        }

        /* Y-axis labels: only -8, -6, -4, -2, 2, 4, 6, 8 */
        var yLabels = [-8, -6, -4, -2, 2, 4, 6, 8];
        for (i = 0; i < yLabels.length; i++) {
            board.create('text', [-0.6, yLabels[i], String(yLabels[i])], {
                fontSize: 11, color: '#444444',
                anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: labelStyle,
                layer: LABEL_LAYER
            });
        }

        /* ── Axis-name labels (KaTeX, italic) ─────────────────────── */
        board.create('text', [5.5, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.45, 9.1, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
