<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product/quotient as vertical translation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel { width: 240px; flex-shrink: 0; background: white; border-radius: 8px; padding: 14px; box-sizing: border-box; font-size: 13px; overflow-y: auto; }
        .panel-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin: 0 0 8px 0; }
        .slider-block { margin-bottom: 12px; }
        .slider-label { font-size: 14px; color: #2563EB; margin-bottom: 4px; min-height: 20px; }
        .slider-block input[type="range"] { width: 100%; accent-color: #2563EB; cursor: pointer; }
        .divider { height: 1px; background: #e5e7eb; margin: 10px 0; }
        .readout-label { font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
        .readout { font-size: 13px; color: #222222; min-height: 20px; margin-bottom: 6px; }
        .readout-blue { color: #2563EB; }
        .readout-red { color: #DC2626; }
        .readout-green { color: #16A34A; }
        .readout-orange { color: #EA580C; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; min-width: 0; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div class="sim-layout">
        <div class="left-panel">
            <div class="panel-header">Parameter</div>
            <div class="slider-block">
                <div class="slider-label" id="label-k"></div>
                <input type="range" id="slider-k" min="0.25" max="4" step="0.25" value="2">
            </div>
            <div class="divider"></div>
            <div class="readout-label">Shift size</div>
            <div class="readout" id="readout-shift"></div>
            <div class="divider"></div>
            <div class="readout-label">Product (blue)</div>
            <div class="readout readout-blue" id="readout-g"></div>
            <div class="readout-label">decomposition</div>
            <div class="readout readout-red" id="readout-hp"></div>
            <div class="divider"></div>
            <div class="readout-label">Quotient (green)</div>
            <div class="readout readout-green" id="readout-q"></div>
            <div class="readout-label">decomposition</div>
            <div class="readout readout-orange" id="readout-hq"></div>
        </div>
        <div class="board-wrapper"><div id="board"></div></div>
    </div>
</div>
<script>
    var COL_F = '#888888';
    var COL_G = '#2563EB';
    var COL_HP = '#DC2626';
    var COL_Q = '#16A34A';
    var COL_HQ = '#EA580C';
    var COL_AXIS = '#444444', COL_GRID = '#D1D5DB';

    var kVal = 2;

    function log2(x) { return Math.log(x) / Math.log(2); }

    var board = JXG.JSXGraph.initBoard('board', {
        boundingbox: [-0.5, 4, 8, -4],
        axis: true, keepAspectRatio: false,
        showNavigation: false, showCopyright: false,
        pan: { enabled: false }, zoom: { enabled: false },
        defaultAxes: {
            x: { strokeColor: COL_AXIS, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
                 ticks: { strokeColor: COL_AXIS, label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 } },
            y: { strokeColor: COL_AXIS, strokeWidth: 1.2, lastArrow: { type: 2, size: 6 },
                 ticks: { strokeColor: COL_AXIS, label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 } }
        },
        grid: { strokeColor: COL_GRID, strokeWidth: 0.4 }
    });

    // Axis labels
    board.create('text', [7.55, -0.4, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
    board.create('text', [0.2, 3.7, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

    // Vertical asymptote at x = 0 (dashed gray)
    board.create('line', [[0, -4], [0, 4]], {
        straightFirst: false, straightLast: false, strokeColor: '#888888', strokeWidth: 1.0, dash: 2,
        fixed: true, highlight: false
    });

    // f(x) = log_2(x) — gray reference
    board.create('functiongraph', [function(x) { return log2(x); }, 0.01, 8], {
        strokeColor: COL_F, strokeWidth: 1.5, fixed: true, highlight: false
    });
    // g(x) = log_2(k*x) — solid blue
    board.create('functiongraph', [function(x) { return log2(kVal * x); }, 0.01, 8], {
        strokeColor: COL_G, strokeWidth: 1.8, fixed: true, highlight: false
    });
    // h_p(x) = log_2(k) + log_2(x) — dashed red, overlays g
    board.create('functiongraph', [function(x) { return log2(kVal) + log2(x); }, 0.01, 8], {
        strokeColor: COL_HP, strokeWidth: 1.8, fixed: true, highlight: false, dash: 2
    });
    // q(x) = log_2(x/k) — solid green
    board.create('functiongraph', [function(x) { return log2(x / kVal); }, 0.01, 8], {
        strokeColor: COL_Q, strokeWidth: 1.8, fixed: true, highlight: false
    });
    // h_q(x) = log_2(x) - log_2(k) — dashed orange, overlays q
    board.create('functiongraph', [function(x) { return log2(x) - log2(kVal); }, 0.01, 8], {
        strokeColor: COL_HQ, strokeWidth: 1.8, fixed: true, highlight: false, dash: 2
    });

    function formatNum(v) {
        if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v));
        return v.toFixed(2);
    }

    function renderPanel() {
        if (typeof katex === 'undefined') return;
        var shift = log2(kVal);
        katex.render('k = ' + formatNum(kVal),
            document.getElementById('label-k'), { throwOnError: false });
        katex.render('\\log_2 ' + formatNum(kVal) + ' = ' + formatNum(shift),
            document.getElementById('readout-shift'), { throwOnError: false });
        katex.render('\\log_2(' + formatNum(kVal) + 'x)',
            document.getElementById('readout-g'), { throwOnError: false });
        katex.render('= ' + formatNum(shift) + ' + \\log_2 x',
            document.getElementById('readout-hp'), { throwOnError: false });
        katex.render('\\log_2\\!\\left(\\tfrac{x}{' + formatNum(kVal) + '}\\right)',
            document.getElementById('readout-q'), { throwOnError: false });
        katex.render('= \\log_2 x - ' + formatNum(shift),
            document.getElementById('readout-hq'), { throwOnError: false });
    }

    document.getElementById('slider-k').addEventListener('input', function(e) {
        kVal = parseFloat(e.target.value);
        board.update();
        renderPanel();
    });

    if (typeof katex !== 'undefined') { renderPanel(); }
    else {
        var poll = setInterval(function() {
            if (typeof katex !== 'undefined') { clearInterval(poll); renderPanel(); }
        }, 50);
    }
</script>
</body>
</html>
