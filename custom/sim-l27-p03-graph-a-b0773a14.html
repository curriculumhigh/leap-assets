<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Option</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 320px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 10.9, 10.9, -1.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ──────────────────────────────────────────── */
        var i;
        for (i = 0; i <= 10; i++) {
            board.create('segment', [[i, 0], [i, 10]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
            board.create('segment', [[0, i], [10, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        /* ── Axes ──────────────────────────────────────────── */
        board.create('arrow', [[-0.3, 0], [10.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });
        board.create('arrow', [[0, -0.3], [0, 10.5]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        /* ── Tick marks every 1 on both axes ───────────────── */
        var tickLen = 0.15;
        for (i = 1; i <= 10; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
        }

        /* ── Tick labels (even: 2, 4, 6, 8, 10) ───────────── */
        var evenVals = [2, 4, 6, 8, 10];
        for (i = 0; i < evenVals.length; i++) {
            var v = evenVals[i];
            board.create('text', [v, -0.55, String(v)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
            board.create('text', [-0.55, v, String(v)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        /* ── Axis-name labels ──────────────────────────────── */
        /* x label: above the right arrow tip, offset left of '10' tick */
        board.create('text', [10.45, 0.45, 'x'], {
            fontSize: 13, color: '#444444', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style: italic;'
        });
        /* y label: right of the top arrow tip */
        board.create('text', [0.5, 10.5, 'y'], {
            fontSize: 13, color: '#444444', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style: italic;'
        });

        /* ── Curve: y = 3x, 0 ≤ x ≤ 3.3 ──────────────────── */
        board.create('functiongraph', [
            function(x) { return 3 * x; }, 0, 3.3
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        /* ── Key points (filled, size 4) ───────────────────── */
        board.create('point', [1, 3], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [2, 6], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        /* ── Coordinate labels (KaTeX, 12px) ───────────────── */
        /* (1, 3): right of the point, away from the curve which goes up-left-to-right */
        board.create('text', [1.35, 2.35, '(1,\\, 3)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'left', anchorY: 'top'
        });
        /* (2, 6): left of the point, away from the curve */
        board.create('text', [0.25, 6.55, '(2,\\, 6)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'left', anchorY: 'bottom'
        });
    </script>
</body>
</html>
