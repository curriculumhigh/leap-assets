<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladder Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 380px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6, 6.5, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var b = 4.47;
        var h = 4.0;

        var O = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [b, 0], { visible: false, fixed: true, name: '' });
        var T = board.create('point', [b, h], { visible: false, fixed: true, name: '' });

        // Wall extension point (above T)
        var wallTop = board.create('point', [b, h + 0.8], { visible: false, fixed: true, name: '' });

        // Ground segment: O → B
        board.create('segment', [O, B], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Wall segment: B → wallTop (extends above T)
        board.create('segment', [B, wallTop], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Ladder (hypotenuse): O → T
        board.create('segment', [O, T], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Right-angle marker at B (between wall and ground)
        var raSize = 0.35;
        var ra1 = board.create('point', [b - raSize, 0], { visible: false, fixed: true, name: '' });
        var ra2 = board.create('point', [b - raSize, raSize], { visible: false, fixed: true, name: '' });
        var ra3 = board.create('point', [b, raSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [ra1, ra2], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [ra2, ra3], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // Angle arc at O (theta) — between ground and ladder
        board.create('nonReflexAngle', [B, O, T], {
            radius: 0.7,
            strokeColor: '#DC2626', strokeWidth: 1.0,
            fillColor: '#DC2626', fillOpacity: 0.06,
            fixed: true, name: '', withLabel: false,
            highlight: false
        });

        // Label: theta at the angle
        board.create('text', [0.95, 0.4, '\\theta'], {
            useKatex: true, fontSize: 14, color: '#DC2626',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // Label: "6 m" on the hypotenuse (midpoint, offset to the left/above)
        var ladderMidX = (0 + b) / 2 - 0.5;
        var ladderMidY = (0 + h) / 2 + 0.35;
        board.create('text', [ladderMidX, ladderMidY, '6\\text{ m}'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // Label: "h" on the wall (midpoint, offset to the right)
        board.create('text', [b + 0.4, h / 2, 'h'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            fixed: true, highlight: false, anchorX: 'left', anchorY: 'middle'
        });
    </script>
</body>
</html>
