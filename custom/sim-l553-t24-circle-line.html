<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Through the Pole and a Vertical Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 420px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 11, 19, -11],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var GRID_COL = '#D1D5DB';
        var GRID_W = 0.6;
        var COL_CIRCLE = '#222222';
        var COL_LINE = '#2563EB';
        var COL_SHADE = '#2563EB';
        var COL_PT = '#DC2626';

        // ── Polar grid: concentric circles at r = 2, 4, 6, ..., 16 ─────
        var maxR = 16;
        var i, ang, r;
        for (r = 2; r <= maxR; r += 2) {
            board.create('circle', [[0, 0], r], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fillColor: 'none', fixed: true, highlight: false,
                dash: 0
            });
        }

        // ── Polar grid: radial lines every 30° ─────────────────────────
        for (i = 0; i < 12; i++) {
            ang = i * Math.PI / 6;
            var x2 = maxR * Math.cos(ang);
            var y2 = maxR * Math.sin(ang);
            board.create('segment', [[0, 0], [x2, y2]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false
            });
        }

        // ── Pole dot ────────────────────────────────────────────────────
        board.create('point', [0, 0], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });

        // ── Shaded region: right half of disk (x >= 8) ─────────────────
        // The disk is (x-8)^2 + y^2 <= 64. For x >= 8, parameterise the
        // boundary: right arc from (8,-8) up to (8,8), then straight line
        // back down from (8,8) to (8,-8).
        // Arc portion: centre (8,0), radius 8, from -π/2 to π/2.
        var shadePtsX = [];
        var shadePtsY = [];
        var N = 80;
        var t, step;

        // Arc from angle = -π/2 to π/2 (right semicircle)
        for (i = 0; i <= N; i++) {
            t = -Math.PI / 2 + i * Math.PI / N;
            shadePtsX.push(8 + 8 * Math.cos(t));
            shadePtsY.push(8 * Math.sin(t));
        }
        // Close back along the line x = 8 (top to bottom)
        shadePtsX.push(8);
        shadePtsY.push(-8);

        board.create('curve', [shadePtsX, shadePtsY], {
            strokeWidth: 0,
            fillColor: COL_SHADE,
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        // ── Circle r = 16 cos θ  ⟺  (x-8)² + y² = 64 ────────────────
        board.create('circle', [[8, 0], 8], {
            strokeColor: COL_CIRCLE, strokeWidth: 1.8,
            fillColor: 'none', fixed: true, highlight: false
        });

        // ── Vertical line x = 8 ────────────────────────────────────────
        board.create('segment', [[8, -11], [8, 11]], {
            strokeColor: COL_LINE, strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // ── Intersection points (8, 8) and (8, −8) ─────────────────────
        board.create('point', [8, 8], {
            name: '', size: 5, color: COL_PT, fixed: true, highlight: false
        });
        board.create('point', [8, -8], {
            name: '', size: 5, color: COL_PT, fixed: true, highlight: false
        });

        // ── Point labels ────────────────────────────────────────────────
        board.create('text', [9.0, 8.6, '(8,\\,8)'], {
            useKatex: true, fontSize: 13, color: COL_PT,
            fixed: true, highlight: false
        });
        board.create('text', [9.0, -8.9, '(8,\\,-8)'], {
            useKatex: true, fontSize: 13, color: COL_PT,
            fixed: true, highlight: false
        });

        // ── Curve labels ────────────────────────────────────────────────
        // Circle label near top of the circle, offset left of shading
        board.create('text', [2.5, 9.2, 'r = 16\\cos\\theta'], {
            useKatex: true, fontSize: 13, color: COL_CIRCLE,
            fixed: true, highlight: false
        });

        // Line label at upper end
        board.create('text', [8.5, 10.2, 'x = 8'], {
            useKatex: true, fontSize: 13, color: COL_LINE,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
