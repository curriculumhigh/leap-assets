<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Graph B</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 14.9, 8.9, -1.3],
            keepAspectRatio: false,
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid every 1 ──────────────────────────────────────────── */
        var ix, iy;
        for (ix = 0; ix <= 8; ix++) {
            board.create('line', [[ix, -1.3], [ix, 14.9]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: false, straightLast: false
            });
        }
        for (iy = 0; iy <= 14; iy++) {
            board.create('line', [[-0.9, iy], [8.9, iy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: false, straightLast: false
            });
        }

        /* ── Axes ──────────────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-0.9, 0], [8.9, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -1.3], [0, 14.9]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks (small segments) + selective labels ────────── */
        var TICK_LEN = 0.18;
        var xTickVals = [2, 4, 6, 8];
        var yTickVals = [2, 4, 6, 8, 10, 12, 14];
        var tickStyle = "background-color:#ffffff;padding:0 2px;";

        /* X-axis ticks */
        for (ix = 1; ix <= 8; ix++) {
            board.create('segment', [[ix, -TICK_LEN], [ix, TICK_LEN]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (xTickVals.indexOf(ix) !== -1) {
                board.create('text', [ix, -0.55, String(ix)], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                    cssStyle: tickStyle, fixed: true, highlight: false
                });
            }
        }

        /* Y-axis ticks */
        for (iy = 1; iy <= 14; iy++) {
            board.create('segment', [[-TICK_LEN, iy], [TICK_LEN, iy]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (yTickVals.indexOf(iy) !== -1) {
                board.create('text', [-0.45, iy, String(iy)], {
                    fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                    cssStyle: tickStyle, fixed: true, highlight: false
                });
            }
        }

        /* ── Axis labels (KaTeX italic) ────────────────────────────── */
        board.create('text', [8.8, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [0.25, 14.4, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        /* ── Line segment y = -2x + 14,  0 <= x <= 7 ─────────────── */
        board.create('functiongraph', [
            function(x) { return -2 * x + 14; }, 0, 7
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Key points ────────────────────────────────────────────── */
        board.create('point', [1, 12], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [3, 8], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [6, 2], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        /* ── Coordinate labels (KaTeX, nowrap) ─────────────────────── */
        board.create('text', [1.3, 12.4, '(1,\\,12)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            cssStyle: 'white-space:nowrap;',
            fixed: true, highlight: false
        });
        board.create('text', [3.3, 8.4, '(3,\\,8)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            cssStyle: 'white-space:nowrap;',
            fixed: true, highlight: false
        });
        board.create('text', [6.3, 2.4, '(6,\\,2)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            cssStyle: 'white-space:nowrap;',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
