<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Hump Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 6, 8.6, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [8.2, -0.4, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.25, 5.6, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Define a smooth single-hump curve on [0,8]
        // Requirements:
        //   - increasing & concave up on (0,2)
        //   - increasing & concave down on (2,4), peak near x=4
        //   - decreasing & concave down on (4,6)
        //   - decreasing & concave up on (6,8)
        //   - inflection points at x=2 and x=6
        //   - symmetric bump shape
        //
        // Use: f(x) = 5 * sin^2(pi*x/8) which has peak at x=4, f(4)=5, f(0)=0, f(8)=0
        // Check concavity: f''(x) = (5*pi^2/32)*cos(pi*x/4)
        //   f''=0 at pi*x/4 = pi/2 => x=2 and pi*x/4 = 3pi/2 => x=6. Perfect!
        // f(0)=0, f(2)=5*sin^2(pi/4)=5*(sqrt(2)/2)^2=2.5, f(4)=5, f(6)=2.5, f(8)=0

        function f(x) {
            return 5 * Math.pow(Math.sin(Math.PI * x / 8), 2);
        }

        // Plot the curve on [0, 8]
        board.create('functiongraph', [f, 0, 8], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points: endpoints at (0,0) and (8,0)
        board.create('point', [0, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [8, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
