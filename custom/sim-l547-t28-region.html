<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbounded region under y = -ln x</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 3.2, 4.3, -1.6],
            axis: true,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 10,
                        minorHeight: 0,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 10,
                        minorHeight: 0,
                        drawZero: false
                    }
                }
            }
        });

        // Axis labels
        board.create('text', [4.0, -0.25, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.15, 3.0, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Shaded region between y = -ln(x) and x-axis for 0 < x <= 1
        // The curve is positive (above x-axis) for 0 < x < 1
        // Shade down to x = 0.005 to visually reach the y-axis
        var xLeft = 0.005;
        var yClip = 3.2;

        // Build shaded region as a filled curve from arrays
        var shadePtsX = [];
        var shadePtsY = [];
        var nPts = 400;

        // Start at top-left corner: (xLeft, yClip)
        shadePtsX.push(xLeft);
        shadePtsY.push(yClip);

        // Along the curve from xLeft to 1
        for (var i = 0; i <= nPts; i++) {
            var xx = xLeft + (1 - xLeft) * i / nPts;
            var yy = -Math.log(xx);
            if (yy > yClip) yy = yClip;
            shadePtsX.push(xx);
            shadePtsY.push(yy);
        }

        // Down to (1, 0) — already there since -ln(1) = 0
        // Back along x-axis to xLeft
        shadePtsX.push(xLeft);
        shadePtsY.push(0);

        // Close back to top
        shadePtsX.push(xLeft);
        shadePtsY.push(yClip);

        board.create('curve', [shadePtsX, shadePtsY], {
            strokeWidth: 0,
            fillColor: '#222222',
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        // Primary curve: y = -ln(x) from x = 0.02 to x = 4, clipped at y = 3
        board.create('functiongraph', [
            function(x) {
                var val = -Math.log(x);
                if (val > 3) return 3;
                return val;
            },
            0.02, 4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Function label
        board.create('text', [1.6, 1.4, 'y = -\\ln x'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
