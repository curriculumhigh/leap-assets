<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Curve with Three Roots</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 4, 4.5, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.1, -0.4, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.25, 3.6, 'f(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Cubic function: f(x) = (1/3.15)*x*(x-3)*(x+3) scaled to have local max/min around ±3
        // f(x) = k * x * (x+3) * (x-3) = k * x * (x²-9)
        // Local extrema at x = ±√3 ≈ ±1.73
        // At x = √3: f(√3) = k * √3 * (3-9) = k * √3 * (-6) = -6√3 k
        // Want max y ≈ 3.5 → k = -3.5/(6√3) ≈ -0.337
        // Use k = -1/3 for nice values: f(±√3) = ∓6√3/3 = ∓2√3 ≈ ∓3.46
        var k = -1 / 3;

        // Curve with arrowheads at both ends
        board.create('functiongraph', [
            function(x) { return k * x * (x + 3) * (x - 3); },
            -4, 4
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 }
        });

        // Key points (x-intercepts)
        board.create('point', [-3, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [0, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [3, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels for key points
        board.create('text', [-3, -0.55, '(-3, 0)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0, -0.55, '(0, 0)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [3, -0.55, '(3, 0)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
