<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<style>
 html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

 .box{border:2px solid #2563EB;background:#EFF4FF;border-radius:4px;padding:7px 14px;font-size:20px;color:#1f2937;display:flex;align-items:center;justify-content:center;min-width:36px;}

 <span class="box" id="box"></span>
 <span class="arrow"><svg width="44" height="16"><line x1="1" y1="8" x2="34" y2="8" stroke="#2563EB" stroke-width="1.8"/><path d="M34,3 L43,8 L34,13 z" fill="#2563EB"/></svg></span>
 <span class="lbl" id="out"></span>
</div>
<script>
 function R(id,tex){katex.render(tex,document.getElementById(id),{throwOnError:false});}
 R("in","x_0"); R("box","f"); R("out","y_0");
