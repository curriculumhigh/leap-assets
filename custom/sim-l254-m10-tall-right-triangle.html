<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tall right triangle with angle theta (legs 2 and 5)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 420px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.2, 5.6, 4.2, -0.8],
            keepAspectRatio: true,
            axis: false, grid: false,
            showNavigation: false, showCopyright: false,
            pan: { enabled: false }, zoom: { enabled: false }
        });

        var OUTLINE = '#555555', MARK = '#DC2626', MEAS = '#3B82F6';

        var A = board.create('point', [0, 0], { name: '', size: 2, color: '#222222', fixed: true, showInfobox: false });
        var B = board.create('point', [2, 0], { name: '', size: 2, color: '#222222', fixed: true, showInfobox: false });
        var C = board.create('point', [2, 5], { name: '', size: 2, color: '#222222', fixed: true, showInfobox: false });

        // Right-angle mark at B
        var s = 0.25;
        board.create('polygon', [[2 - s, 0], [2 - s, s], [2, s], [2, 0]], {
            fillColor: 'none', fillOpacity: 0, vertices: { visible: false },
            borders: { strokeColor: MARK, strokeWidth: 1.2 }, fixed: true,
            hasInnerPoints: false, highlight: false
        });

        // Triangle
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0, vertices: { visible: false },
            borders: { strokeColor: OUTLINE, strokeWidth: 2 }, fixed: true,
            hasInnerPoints: false, highlight: false
        });

        // Angle arc at A
        board.create('nonReflexAngle', [B, A, C], {
            radius: 0.45, name: '', withLabel: false, fillOpacity: 0,
            strokeColor: MARK, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Labels (plain Unicode)
        var half = Math.atan2(5, 2) / 2;
        board.create('text', [0.8 * Math.cos(half), 0.8 * Math.sin(half), 'θ'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 18, color: MARK,
            cssStyle: 'font-style:italic;font-family:"Times New Roman",serif',
            fixed: true, highlight: false
        });
        board.create('text', [1, -0.32, '2'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 18, color: MEAS,
            cssStyle: 'font-family:"Times New Roman",serif', fixed: true, highlight: false
        });
        board.create('text', [2.3, 2.5, '5'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 18, color: MEAS,
            cssStyle: 'font-family:"Times New Roman",serif', fixed: true, highlight: false
        });
    </script>
</body>
</html>
