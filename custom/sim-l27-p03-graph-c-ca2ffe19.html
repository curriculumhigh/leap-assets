<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Option C</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 320px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 10.9, 10.9, -1.2],
            axis: false,
            keepAspectRatio: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Grid lines every 1
        board.create('grid', [], {
            strokeColor: '#D1D5DB',
            strokeWidth: 0.4,
            majorStep: [1, 1],
            minorElements: 0,
            fixed: true,
            highlight: false
        });

        // X-axis: line from origin to (10, 0) with arrow
        var xAxis = board.create('arrow', [[0, 0], [10.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // Y-axis: line from origin to (0, 10) with arrow
        var yAxis = board.create('arrow', [[0, 0], [0, 10.5]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // X-axis tick marks and labels (values at 2, 4, 6, 8, 10; tick marks at every 1)
        var i;
        for (i = 1; i <= 10; i++) {
            // Tick mark
            board.create('segment', [[i, -0.15], [i, 0.15]], {
                strokeColor: '#444444',
                strokeWidth: 1,
                fixed: true,
                highlight: false
            });
            // Label only at even values
            if (i % 2 === 0) {
                board.create('text', [i, -0.55, String(i)], {
                    fontSize: 11,
                    color: '#444444',
                    fixed: true,
                    highlight: false,
                    anchorX: 'middle',
                    anchorY: 'middle'
                });
            }
        }

        // Y-axis tick marks and labels (values at 2, 4, 6, 8, 10; tick marks at every 1)
        for (i = 1; i <= 10; i++) {
            // Tick mark
            board.create('segment', [[-0.15, i], [0.15, i]], {
                strokeColor: '#444444',
                strokeWidth: 1,
                fixed: true,
                highlight: false
            });
            // Label only at even values
            if (i % 2 === 0) {
                board.create('text', [-0.55, i, String(i)], {
                    fontSize: 11,
                    color: '#444444',
                    fixed: true,
                    highlight: false,
                    anchorX: 'middle',
                    anchorY: 'middle'
                });
            }
        }

        // Axis-name labels — KaTeX italic, 14px, #444444
        board.create('text', [10.15, 0.25, '\\textit{x}'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false, useKatex: true,
            anchorX: 'left', anchorY: 'bottom'
        });
        board.create('text', [0.4, 10.45, '\\textit{y}'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false, useKatex: true,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Line y = -x + 9  for  0 <= x <= 9
        board.create('functiongraph', [
            function(x) { return -x + 9; },
            0, 9
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points
        board.create('point', [1, 8], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [4, 5], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [8, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels — placed above-right of curve in the empty region
        board.create('text', [1.35, 8.4, '(1,\\, 8)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true,
            anchorX: 'left', anchorY: 'bottom'
        });

        board.create('text', [4.35, 5.4, '(4,\\, 5)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true,
            anchorX: 'left', anchorY: 'bottom'
        });

        board.create('text', [8.25, 1.45, '(8,\\, 1)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true,
            anchorX: 'left', anchorY: 'bottom'
        });
    </script>
</body>
</html>
