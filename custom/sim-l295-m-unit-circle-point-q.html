<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle on the Unit Circle</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
.wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
svg { width: 100%; height: 100%; max-width: 100%; max-height: 100%; display: block; background: #ffffff; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="-170 -170 340 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Unit circle with axis points E, F, G, H, origin O, point Q on the circle in Quadrant II, perpendicular QN to the x-axis, and angle alpha measured counterclockwise from ray OE">
  <circle cx="0" cy="0" r="110" fill="none" stroke="#7B8FB0" stroke-width="1.4"/>
  <line x1="-150" y1="0" x2="146" y2="0" stroke="#444444" stroke-width="1.5"/>
  <polygon points="156,0 144,-5 144,5" fill="#444444"/>
  <line x1="0" y1="150" x2="0" y2="-146" stroke="#444444" stroke-width="1.5"/>
  <polygon points="0,-156 -5,-144 5,-144" fill="#444444"/>
  <text x="152" y="20" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">x</text>
  <text x="14" y="-146" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18" fill="#222222" text-anchor="middle">y</text>
  <circle cx="110.00" cy="0.00" r="3.6" fill="#222222"/>
  <text x="118.0" y="-8.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="start">E</text>
  <circle cx="0.00" cy="-110.00" r="3.6" fill="#222222"/>
  <text x="10.0" y="-116.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="start">F</text>
  <circle cx="-110.00" cy="0.00" r="3.6" fill="#222222"/>
  <text x="-118.0" y="-8.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="end">G</text>
  <circle cx="0.00" cy="110.00" r="3.6" fill="#222222"/>
  <text x="10.0" y="128.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="start">H</text>
  <text x="10.0" y="20.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="start">O</text>
  <line x1="0" y1="0" x2="-70.71" y2="-84.26" stroke="#1E40AF" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="-70.71" y1="-84.26" x2="-70.71" y2="0" stroke="#444444" stroke-width="2"/>
  <polyline points="-62.71,0 -62.71,-8.00 -70.71,-8.00" fill="none" stroke="#444444" stroke-width="1.3"/>
  <path d="M 34.00 -0.00 A 34 34 0 0 0 -14.90 -30.56" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="-21.40,-26.42 -17.10,-35.05 -12.71,-26.07" fill="#DC2626"/>
  <text x="22.0" y="-41.1" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="20" fill="#DC2626" text-anchor="middle">α</text>
  <circle cx="-70.71" cy="-84.26" r="4.8" fill="#1E40AF"/>
  <text x="-82.7" y="-92.3" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="end">Q</text>
  <text x="-70.7" y="18.0" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#222222" text-anchor="middle">N</text>
</svg>
</div>
</body>
</html>
