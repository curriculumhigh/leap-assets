<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>vscale-third-b</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.container{max-width:300px;margin:0 auto;padding:6px;height:calc(100% - 12px);}.board-wrapper{background:white;border-radius:8px;padding:10px;height:calc(100% - 20px);}#board{width:100%;height:100%;}</style></head>
<body><div class="container"><div class="board-wrapper"><div id="board"></div></div></div><script>
var board=JXG.JSXGraph.initBoard('board',{boundingbox:[-6,13,5,-11],keepAspectRatio:false,axis:false,grid:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
board.create('grid',[],{strokeColor:'#D1D5DB',strokeWidth:0.4});
board.create('axis',[[0,0],[1,0]],{strokeColor:'#444444',strokeWidth:1.2,firstArrow:{type:2,size:6},lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2,drawZero:false},highlight:false,fixed:true});
board.create('axis',[[0,0],[0,1]],{strokeColor:'#444444',strokeWidth:1.2,firstArrow:{type:2,size:6},lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2,drawZero:false},highlight:false,fixed:true});
board.create('text',[4.55,-0.7,'<i>x</i>'],{fontSize:14,fixed:true,highlight:false});
board.create('text',[0.3,12.3,'<i>y</i>'],{fontSize:14,fixed:true,highlight:false});
board.create('functiongraph',[function(x){ return 3*(x*x*x + x*x - 20*x)/14; }],{strokeColor:'#9CA3AF',strokeWidth:1.3,dash:2,fixed:true,highlight:false});
board.create('functiongraph',[function(x){ return 9*(x*x*x + x*x - 20*x)/14; }],{strokeColor:'#222222',strokeWidth:1.8,fixed:true,highlight:false});
</script></body></html>
