<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maclaurin Polynomial for e^{-x}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 720px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 200px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
            overflow: hidden;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 4px;
        }
        .slider-group { margin-bottom: 4px; }
        .slider-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 2px;
        }
        .slider-name { font-weight: 600; font-size: 13px; }
        .slider-val-display { min-height: 22px; text-align: right; }
        .slider-input {
            width: 100%; -webkit-appearance: none; appearance: none;
            height: 5px; border-radius: 3px; background: #e5e7eb; outline: none;
            margin-top: 2px;
        }
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 15px; height: 15px; border-radius: 50%; cursor: pointer;
            background: #2563EB;
        }
        .legend-section { border-top: 1px solid #e5e7eb; padding-top: 12px; }
        .legend-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .legend-swatch {
            width: 22px; height: 0; border-top: 3px solid;
            flex-shrink: 0;
        }
        .legend-label { min-height: 20px; font-size: 14px; }
        .instruction-section { border-top: 1px solid #e5e7eb; padding-top: 12px; }
        .instruction-text { font-size: 12px; color: #666; line-height: 1.5; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px 10px 10px 20px; min-width: 0; position: relative; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Degree</div>
                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-name" style="color: #2563EB;" id="label-n"></span>
                            <span class="slider-val-display" id="val-n"></span>
                        </div>
                        <input type="range" id="slider-n" class="slider-input" min="1" max="10" step="1" value="1">
                    </div>
                </div>

                <div class="legend-section">
                    <div class="panel-label">Legend</div>
                    <div class="legend-row">
                        <div class="legend-swatch" style="border-color: #222222;"></div>
                        <div class="legend-label" id="legend-f"></div>
                    </div>
                    <div class="legend-row">
                        <div class="legend-swatch" style="border-color: #2563EB;"></div>
                        <div class="legend-label" id="legend-p"></div>
                    </div>
                </div>

                <div class="instruction-section">
                    <div class="instruction-text">Drag the slider to increase the degree <i>n</i>.</div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        /* ── State ──────────────────────────────────────────────────────── */
        var nVal = 1;

        /* ── Maclaurin polynomial P_n(x) for e^{-x} ───────────────────── */
        /* P_n(x) = sum_{k=0}^{n} (-x)^k / k! = sum_{k=0}^{n} (-1)^k x^k / k! */
        function maclaurin(x, deg) {
            var s = 0;
            var term = 1; // k=0: (-1)^0 * x^0 / 0! = 1
            s += term;
            for (var k = 1; k <= deg; k++) {
                term *= (-x) / k;
                s += term;
            }
            return s;
        }

        /* ── Board ─────────────────────────────────────────────────────── */
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 8, 6, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, anchorX: 'middle', offset: [0, -14] },
                        minorTicks: 0,
                        majorHeight: 8,
                        insertTicks: false,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, anchorX: 'right', offset: [-8, 0] },
                        minorTicks: 0,
                        majorHeight: 8,
                        insertTicks: false,
                        ticksDistance: 1
                    }
                }
            }
        });

        /* ── Axis labels (KaTeX) ───────────────────────────────────────── */
        board.create('text', [5.6, -0.5, 'x'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, 7.6, 'y'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        /* ── f(x) = e^{-x} — primary curve (black) ────────────────────── */
        board.create('functiongraph', [
            function(x) { return Math.exp(-x); }
        ], {
            strokeColor: '#222222', strokeWidth: 2.5, fixed: true, highlight: false
        });

        /* ── P_n(x) — Maclaurin polynomial (blue) ─────────────────────── */
        board.create('functiongraph', [
            function(x) { return maclaurin(x, nVal); }
        ], {
            strokeColor: '#2563EB', strokeWidth: 2.5, fixed: true, highlight: false
        });

        /* ── Key point at (0, 1) ───────────────────────────────────────── */
        board.create('point', [0, 1], {
            name: '', size: 3, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        /* ── Panel updates ─────────────────────────────────────────────── */
        function updatePanel() {
            katex.render(
                '\\color{#2563EB}{n = ' + nVal + '}',
                document.getElementById('val-n'),
                { throwOnError: false }
            );

            katex.render(
                'P_{' + nVal + '}(x)',
                document.getElementById('legend-p'),
                { throwOnError: false }
            );
        }

        /* ── Render static labels ──────────────────────────────────────── */
        function renderLabels() {
            katex.render('n', document.getElementById('label-n'), { throwOnError: false });
            katex.render('f(x) = e^{-x}', document.getElementById('legend-f'), { throwOnError: false });
        }

        /* ── Slider wiring ─────────────────────────────────────────────── */
        var sliderN = document.getElementById('slider-n');

        sliderN.addEventListener('input', function() {
            nVal = parseInt(this.value);
            board.update();
            updatePanel();
        });

        /* ── Initial render ────────────────────────────────────────────── */
        renderLabels();
        updatePanel();
    </script>
</body>
</html>
