<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Function Reference Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 470px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 4.5, 4.5, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            showInfobox: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.1, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 4.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Line through (0,-1) and (2,2), slope 3/2, with arrowheads both ends
        // Extend line to bounding box edges for full coverage
        // y = (3/2)x - 1; at x=-2: y=-4; at x=4.5: y=5.75
        // Clip to bounding box: y in [-3, 4.5]
        // y=-3 => x = (-3+1)/(3/2) = -4/3 ≈ -1.333
        // y=4.5 => x = (4.5+1)/(3/2) = 5.5/1.5 ≈ 3.667
        var xStart = -4 / 3;
        var yStart = -3;
        var xEnd = 11 / 3;
        var yEnd = 4.5;

        board.create('line', [[0, -1], [2, 2]], {
            strokeColor: '#2563EB',
            strokeWidth: 2.2,
            fixed: true,
            highlight: false,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            straightFirst: true,
            straightLast: true
        });

        // Key points
        var p1 = board.create('point', [0, -1], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        var p2 = board.create('point', [2, 2], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // KaTeX labels for the points
        board.create('text', [0.15, -1.55, '(0,\\,-1)'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'left'
        });

        board.create('text', [2.15, 2.35, '(2,\\,2)'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'left'
        });
    </script>
</body>
</html>
