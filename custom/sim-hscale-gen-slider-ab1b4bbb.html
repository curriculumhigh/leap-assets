<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>hscale-gen-slider</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.container{max-width:560px;margin:0;padding:6px;height:calc(100% - 12px);}
.sim-layout{display:flex;gap:12px;height:100%;}
.left-panel{width:175px;flex-shrink:0;background:white;border-radius:8px;padding:16px;box-sizing:border-box;}
.board-wrapper{flex:1;background:white;border-radius:8px;padding:10px;}
#board{width:100%;height:100%;}
.readout{font-size:20px;color:#2563EB;font-weight:600;margin-bottom:14px;}
input[type=range]{width:100%;accent-color:#2563EB;margin-top:6px;}
.lbl{font-size:13px;color:#444;}</style></head>
<body><div class="container"><div class="sim-layout">
<div class="left-panel">
<div class="readout">b = <span id="bval">2</span></div>
<div class="lbl">factor b</div>
<input type="range" id="slider-b" min="-3" max="3" step="0.05" value="2">
</div>
<div class="board-wrapper"><div id="board"></div></div>
</div></div><script>
var bVal=2;
function F(x){ return 0.125*x*x*x - 0.375*x*x - 2.75*x + 3; }
var board=JXG.JSXGraph.initBoard('board',{boundingbox:[-9,10,9,-10],keepAspectRatio:false,axis:false,grid:false,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false}});
board.create('grid',[],{strokeColor:'#D1D5DB',strokeWidth:0.4});
board.create('axis',[[0,0],[1,0]],{strokeColor:'#444444',strokeWidth:1.2,firstArrow:{type:2,size:6},lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2,drawZero:false},highlight:false,fixed:true});
board.create('axis',[[0,0],[0,1]],{strokeColor:'#444444',strokeWidth:1.2,firstArrow:{type:2,size:6},lastArrow:{type:2,size:6},ticks:{strokeColor:'#444444',label:{fontSize:11},minorTicks:0,ticksDistance:2,drawZero:false},highlight:false,fixed:true});
board.create('text',[8.4,-0.8,'<i>x</i>'],{fontSize:14,fixed:true,highlight:false});
board.create('text',[0.3,9.3,'<i>y</i>'],{fontSize:14,fixed:true,highlight:false});
board.create('functiongraph',[function(x){ return F(x); }],{strokeColor:'#9CA3AF',strokeWidth:1.3,dash:2,fixed:true,highlight:false});
board.create('functiongraph',[function(x){ var b=bVal; if(Math.abs(b)<0.02){ b=(b<0?-0.02:0.02); } return F(b*x); }],{strokeColor:'#2563EB',strokeWidth:1.8,fixed:true,highlight:false});
board.create('point',[0,3],{name:'',size:3,fillColor:'#DC2626',strokeColor:'#DC2626',fixed:true,highlight:false});
document.getElementById('slider-b').addEventListener('input',function(){
  bVal=parseFloat(this.value);
  document.getElementById('bval').innerHTML=parseFloat(bVal.toFixed(2));
  board.update();
});
</script></body></html>
