<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph C — y = 12/x</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            width: 320px; height: 240px;
            padding: 0; margin: 0;
        }
        .board-wrapper {
            background: white; border-radius: 8px;
            padding: 6px; width: calc(100% - 12px); height: calc(100% - 12px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 14.9, 8.9, -1.3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid every 1 unit ─────────────────────────────────────── */
        var i;
        for (i = 0; i <= 8; i++) {
            board.create('line', [[i, -1.3], [i, 14.9]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, dash: 0,
                straightFirst: false, straightLast: false
            });
        }
        for (i = 0; i <= 14; i++) {
            board.create('line', [[-0.9, i], [8.9, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, dash: 0,
                straightFirst: false, straightLast: false
            });
        }

        /* ── Axes ──────────────────────────────────────────────────── */
        // x-axis
        board.create('arrow', [[-0.9, 0], [8.9, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // y-axis
        board.create('arrow', [[0, -1.3], [0, 14.9]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Tick marks (small segments every 1) ───────────────────── */
        var tickLen = 0.18;
        // x-axis ticks
        for (i = 1; i <= 8; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
        }
        // y-axis ticks
        for (i = 1; i <= 14; i++) {
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
        }

        /* ── Tick value labels ─────────────────────────────────────── */
        var tickStyle = 'background-color:#ffffff;padding:0 2px;';

        // x-axis: only 2, 4, 6, 8
        var xTickVals = [2, 4, 6, 8];
        for (i = 0; i < xTickVals.length; i++) {
            board.create('text', [xTickVals[i], -0.55, String(xTickVals[i])], {
                fontSize: 11, color: '#444444', fixed: true, highlight: false,
                anchorX: 'middle', anchorY: 'top',
                cssStyle: tickStyle
            });
        }

        // y-axis: 2, 4, 6, 8, 10, 12, 14
        var yTickVals = [2, 4, 6, 8, 10, 12, 14];
        for (i = 0; i < yTickVals.length; i++) {
            board.create('text', [-0.35, yTickVals[i], String(yTickVals[i])], {
                fontSize: 11, color: '#444444', fixed: true, highlight: false,
                anchorX: 'right', anchorY: 'middle',
                cssStyle: tickStyle
            });
        }

        /* ── Axis name labels (KaTeX) ──────────────────────────────── */
        board.create('text', [8.8, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'bottom'
        });
        board.create('text', [0.25, 14.4, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'middle'
        });

        /* ── Curve: y = 12/x, domain [0.86, 8.6] ──────────────────── */
        board.create('functiongraph', [
            function(x) { return 12 / x; },
            0.86, 8.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Key points ────────────────────────────────────────────── */
        var pts = [
            { x: 2, y: 6,  lx: 2.3, ly: 6.4, label: '(2,\\,6)' },
            { x: 3, y: 4,  lx: 3.3, ly: 4.5, label: '(3,\\,4)' },
            { x: 4, y: 3,  lx: 4.4, ly: 3.3, label: '(4,\\,3)' },
            { x: 6, y: 2,  lx: 6.3, ly: 2.4, label: '(6,\\,2)' }
        ];

        for (i = 0; i < pts.length; i++) {
            board.create('point', [pts[i].x, pts[i].y], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
            board.create('text', [pts[i].lx, pts[i].ly, pts[i].label], {
                useKatex: true, fontSize: 12, color: '#222222',
                fixed: true, highlight: false,
                anchorX: 'left', anchorY: 'bottom',
                cssStyle: 'white-space:nowrap;'
            });
        }
    </script>
</body>
</html>
