<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulus Triangle — z = 4+3i</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 640px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 180px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .panel-caption {
            font-size: 13px; color: #444; line-height: 1.55;
        }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-caption">
                        <span id="cap-om"></span> is the real part and <span id="cap-mp"></span> is the
                        imaginary part. <span id="cap-op"></span> is the distance of <span id="cap-z"></span>
                        from the origin.
                    </div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.2, 6.2, -1.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // ── Axis labels (custom: Real / Imaginary) ──────────────────────
        board.create('text', [4.85, 0.55, '\\text{Real}'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.15, 4.9, '\\text{Imaginary}'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false, useKatex: true
        });

        // ── Points ──────────────────────────────────────────────────────
        var O = board.create('point', [0, 0], {
            name: 'O', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -14], useKatex: true }
        });

        var P = board.create('point', [4, 3], {
            name: '', fixed: true, size: 5, color: '#222222',
            highlight: false, showInfobox: false
        });

        // P label with z = 4+3i — separate text element for clean KaTeX rendering
        board.create('text', [4.25, 3.35, 'P(z = 4+3i)'], {
            fontSize: 13, color: '#222222', anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false, useKatex: true
        });

        var M = board.create('point', [4, 0], {
            name: 'M', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -14], useKatex: true }
        });

        // ── Segments ────────────────────────────────────────────────────
        // Hypotenuse OP — solid, primary weight
        board.create('segment', [O, P], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Horizontal leg OM — dashed, construction color
        board.create('segment', [O, M], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // Vertical leg MP — dashed, construction color
        board.create('segment', [M, P], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // ── Right-angle marker at M ─────────────────────────────────────
        var sq = 0.3;
        board.create('polygon', [
            [4 - sq, 0],
            [4 - sq, sq],
            [4, sq],
            [4, 0]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // ── Annotations ─────────────────────────────────────────────────
        // Hypotenuse label "|z|" — above-left of OP midpoint
        board.create('text', [1.55, 2.0, '\\left|z\\right|'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false, useKatex: true
        });

        /* Caption math */
        katex.render('OM', document.getElementById('cap-om'), { throwOnError: false });
        katex.render('MP', document.getElementById('cap-mp'), { throwOnError: false });
        katex.render('OP', document.getElementById('cap-op'), { throwOnError: false });
        katex.render('z',  document.getElementById('cap-z'),  { throwOnError: false });
    </script>
</body>
</html>
