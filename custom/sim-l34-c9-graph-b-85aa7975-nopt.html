<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph B</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { width: 320px; height: 240px; padding: 0; }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
        .JXGtext { z-index: 10; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.6, 10.6, 10.6, -10.6],
            axis: false,
            grid: false,
            keepAspectRatio: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid ─────────────────────────────────────────── */
        var gi;
        for (gi = -8; gi <= 10; gi++) {
            board.create('line', [[gi, 0], [gi, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, layer: 1
            });
        }
        for (gi = -10; gi <= 10; gi++) {
            board.create('line', [[0, gi], [1, gi]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, layer: 1
            });
        }

        /* ── Axes ─────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-8.6, 0], [10.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false, layer: 5
        });
        var yAxis = board.create('arrow', [[0, -10.6], [0, 10.6]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false, layer: 5
        });

        /* ── Tick marks + selective labels ─────────────────── */
        var xLabelVals = [-6, -4, -2, 4, 6, 8];
        var yLabelVals = [-8, -6, -4, -2, 2, 4, 6, 8];
        var tickLen = 0.25;
        var tickStyle = 'background-color:#ffffff;padding:0 2px;';
        var ti;

        // X-axis ticks
        for (ti = -8; ti <= 10; ti++) {
            if (ti === 0) continue;
            board.create('segment', [[ti, -tickLen], [ti, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false, layer: 5
            });
            if (xLabelVals.indexOf(ti) !== -1) {
                board.create('text', [ti, -0.8, String(ti)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'middle', anchorY: 'top',
                    fixed: true, highlight: false, layer: 9,
                    cssStyle: tickStyle
                });
            }
        }

        // Y-axis ticks
        for (ti = -10; ti <= 10; ti++) {
            if (ti === 0) continue;
            board.create('segment', [[-tickLen, ti], [tickLen, ti]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false, layer: 5
            });
            if (yLabelVals.indexOf(ti) !== -1) {
                board.create('text', [-0.5, ti, String(ti)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'right', anchorY: 'middle',
                    fixed: true, highlight: false, layer: 9,
                    cssStyle: tickStyle
                });
            }
        }

        /* ── Axis name labels ─────────────────────────────── */
        board.create('text', [10.5, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false, layer: 9
        });
        board.create('text', [-0.3, 10.0, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false, layer: 9
        });

        /* ── Asymptotes (dashed cyan, no labels) ──────────── */
        board.create('segment', [[-1, -10.6], [-1, 10.6]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 3
        });
        board.create('segment', [[-8.6, 3], [10.6, 3]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 3
        });

        /* ── Curve: y = -4/(x+1) + 3 ─────────────────────── */
        var GAP = 0.12;

        board.create('functiongraph', [
            function(x) { return -4 / (x + 1) + 3; },
            -8.6, -1 - GAP
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false, layer: 4
        });

        board.create('functiongraph', [
            function(x) { return -4 / (x + 1) + 3; },
            -1 + GAP, 10.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false, layer: 4
        });

    </script>
</body>
</html>
