<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Graph — y = 7/(x+3) + 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 480px; margin: 0; padding: 6px; height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9.6, 10.6, 9.6, -6.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Grid (every 1 unit) ─────────────────────────────────────────── */
        var gx;
        for (gx = -9; gx <= 9; gx++) {
            board.create('line', [[gx, 0], [gx, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        var gy;
        for (gy = -6; gy <= 10; gy++) {
            board.create('line', [[0, gy], [1, gy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        /* ── Axes ──────────────────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-9.6, 0], [9.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -6.6], [0, 10.6]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Asymptotes (dashed cyan) ──────────────────────────────────── */
        /* Vertical: x = -3 */
        board.create('line', [[-3, 0], [-3, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            straightFirst: true, straightLast: true,
            fixed: true, highlight: false
        });
        /* Horizontal: y = 2 */
        board.create('line', [[0, 2], [1, 2]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            straightFirst: true, straightLast: true,
            fixed: true, highlight: false
        });

        /* ── Curve: y = 7/(x + 3) + 2 ─────────────────────────────────── */
        /* Left branch */
        board.create('functiongraph', [
            function(x) { return 7 / (x + 3) + 2; },
            -9.6, -3.15
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* Right branch */
        board.create('functiongraph', [
            function(x) { return 7 / (x + 3) + 2; },
            -2.85, 9.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        /* ── Tick marks + labels (white background, high layer) ────────── */
        var TICK_LEN = 0.18;
        var LABEL_LAYER = 9;
        var tx, ty;

        /* X-axis ticks */
        for (tx = -9; tx <= 9; tx++) {
            if (tx === 0) continue;
            board.create('segment', [[tx, -TICK_LEN], [tx, TICK_LEN]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (tx % 2 === 0) {
                board.create('text', [tx, -0.65, String(tx)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'middle', anchorY: 'middle',
                    cssStyle: 'background-color:#ffffff;padding:0 2px;',
                    layer: LABEL_LAYER,
                    fixed: true, highlight: false
                });
            }
        }

        /* Y-axis ticks */
        for (ty = -6; ty <= 10; ty++) {
            if (ty === 0) continue;
            board.create('segment', [[-TICK_LEN, ty], [TICK_LEN, ty]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            if (ty % 2 === 0) {
                board.create('text', [-0.55, ty, String(ty)], {
                    fontSize: 11, color: '#444444',
                    anchorX: 'right', anchorY: 'middle',
                    cssStyle: 'background-color:#ffffff;padding:0 2px;',
                    layer: LABEL_LAYER,
                    fixed: true, highlight: false
                });
            }
        }

        /* ── Axis labels (KaTeX italic) ──────────────────────────────── */
        board.create('text', [9.15, -0.55, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            fixed: true, highlight: false
        });
        board.create('text', [0.35, 10.15, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            fixed: true, highlight: false
        });

        /* ── Asymptote labels (KaTeX, cyan, 13px) ─────────────────────── */
        board.create('text', [-3.25, 9.8, 'x = -3'], {
            useKatex: true, fontSize: 13, color: '#0EA5E9',
            anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });
        board.create('text', [9.2, 1.7, 'y = 2'], {
            useKatex: true, fontSize: 13, color: '#0EA5E9',
            anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
