<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 320px; height: 240px; padding: 0; margin: 0; }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.6, 10.6, 10.6, -10.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ─── Grid ─────────────────────────────────────────── */
        var gridX, gridY;
        for (gridX = -8; gridX <= 10; gridX++) {
            board.create('line', [[gridX, -10.6], [gridX, 10.6]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true,
                straightFirst: false, straightLast: false, highlight: false,
                point1: { visible: false }, point2: { visible: false }
            });
        }
        for (gridY = -10; gridY <= 10; gridY++) {
            board.create('line', [[-8.6, gridY], [10.6, gridY]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true,
                straightFirst: false, straightLast: false, highlight: false,
                point1: { visible: false }, point2: { visible: false }
            });
        }

        /* ─── Axes ─────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-8.6, 0], [10.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        var yAxis = board.create('arrow', [[0, -10.6], [0, 10.6]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        /* ─── Tick marks (small segments) ──────────────────── */
        var tickLen = 0.25;
        var xTickVals = [-6, -4, -2, 2, 4, 6, 8];
        var xTickLabelVals = [-6, -4, -2, 4, 6, 8]; /* drop 2 from labels */
        var yTickVals = [-8, -6, -4, -2, 2, 4, 6, 8];
        var i;

        for (i = 0; i < xTickVals.length; i++) {
            board.create('segment', [[xTickVals[i], -tickLen], [xTickVals[i], tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
        }
        for (i = 0; i < yTickVals.length; i++) {
            board.create('segment', [[-tickLen, yTickVals[i]], [tickLen, yTickVals[i]]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
        }

        /* ─── Asymptotes (layer 5) ──────────────────────────── */
        board.create('segment', [[1, -10.6], [1, 10.6]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 5
        });
        board.create('segment', [[-8.6, 3], [10.6, 3]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 5
        });

        /* ─── Curve: y = 4/(x-1) + 3, two branches ───────── */
        var GAP = 0.12;

        // Left branch: x from -8.6 to 1 - GAP
        board.create('functiongraph', [
            function(x) { return 4 / (x - 1) + 3; },
            -8.6, 1 - GAP
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false, layer: 7
        });

        // Right branch: x from 1 + GAP to 10.6
        board.create('functiongraph', [
            function(x) { return 4 / (x - 1) + 3; },
            1 + GAP, 10.6
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false, layer: 7
        });

        /* ─── Tick value labels (layer 9) ──────────────────── */
        var tickLabelCSS = 'background-color:#ffffff;padding:0 2px;';

        for (i = 0; i < xTickLabelVals.length; i++) {
            board.create('text', [xTickLabelVals[i], -0.8, String(xTickLabelVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false, layer: 9,
                cssStyle: tickLabelCSS
            });
        }
        for (i = 0; i < yTickVals.length; i++) {
            board.create('text', [-0.6, yTickVals[i], String(yTickVals[i])], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false, layer: 9,
                cssStyle: tickLabelCSS
            });
        }

        /* ─── Axis name labels ─────────────────────────────── */
        board.create('text', [10.5, 0.35, 'x'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false, layer: 9
        });
        board.create('text', [-0.3, 10.0, 'y'], {
            useKatex: true, fontSize: 14, color: '#444444',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false, layer: 9
        });

        /* ─── Key point (2, 7) — layer 10 above tick labels ── */
        board.create('point', [2, 7], {
            name: '', size: 4, color: '#222222', fixed: true,
            highlight: false, showInfobox: false, layer: 10
        });

        board.create('text', [2.3, 7.4, '(2,\\, 7)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false, layer: 11,
            cssStyle: 'white-space:nowrap;'
        });
    </script>
</body>
</html>
