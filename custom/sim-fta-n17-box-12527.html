<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planter Box</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #fig { width: 100%; height: 100%; display: block; }
        .edge { stroke: #555555; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
        .hidden-edge { stroke: #555555; stroke-width: 1; fill: none; stroke-dasharray: 5 4; }
        .face-top { fill: #F3F4F6; stroke: none; }
        .face-side { fill: #E5E7EB; stroke: none; }
        .dim { fill: #3B82F6; font-size: 17px; font-family: 'Times New Roman', 'Latin Modern Roman', serif; }
        .dim .v { font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <!-- Pure SVG with a viewBox: scales to any container size (including after the iframe
                 is shown from display:none) with no JS initialization needed. -->
            <svg id="fig" viewBox="0 0 380 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                <!-- Oblique projection: front face 110 wide x 160 tall, depth offset (+62, -38) -->
                <!-- Front face: (125,225) (235,225) (235,65) (125,65); back offset (+62,-38) -->
                <!-- Light shading on the visible top and right faces for depth -->
                <polygon class="face-top" points="125,65 235,65 297,27 187,27"/>
                <polygon class="face-side" points="235,225 297,187 297,27 235,65"/>

                <!-- Hidden edges (dashed) meeting at the back-bottom-left corner (187,187) -->
                <line class="hidden-edge" x1="125" y1="225" x2="187" y2="187"/>
                <line class="hidden-edge" x1="187" y1="187" x2="297" y2="187"/>
                <line class="hidden-edge" x1="187" y1="187" x2="187" y2="27"/>

                <!-- Visible edges -->
                <polygon class="edge" points="125,225 235,225 235,65 125,65"/>
                <polyline class="edge" points="125,65 187,27 297,27 235,65"/>
                <polyline class="edge" points="235,225 297,187 297,27"/>

                <!-- Dimension labels -->
                <!-- Front base edge -->
                <text class="dim" x="180" y="248" text-anchor="middle"><tspan class="v">x</tspan> ft</text>
                <!-- Depth base edge (right, oblique) -->
                <text class="dim" x="272" y="222" text-anchor="start"><tspan class="v">x</tspan> ft</text>
                <!-- Vertical edge (front left) -->
                <text class="dim" x="114" y="150" text-anchor="end"><tspan class="v">x</tspan> + 2 ft</text>
            </svg>
        </div>
    </div>
</body>
</html>
