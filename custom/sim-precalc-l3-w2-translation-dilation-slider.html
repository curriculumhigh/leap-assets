<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation–dilation equivalence: slider</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 700px;
            margin: 0;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .sim-layout {
            display: flex;
            gap: 12px;
            height: 100%;
        }
        .left-panel {
            width: 210px;
            flex-shrink: 0;
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .panel-header {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin: 0 0 10px 0;
        }
        .slider-block {
            margin-bottom: 14px;
        }
        .slider-label {
            font-size: 14px;
            color: #2563EB;
            margin-bottom: 4px;
            min-height: 20px;
        }
        .slider-block input[type="range"] {
            width: 100%;
            accent-color: #2563EB;
            cursor: pointer;
        }
        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 14px 0 12px 0;
        }
        .readout-label {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .readout {
            font-size: 14px;
            color: #222222;
            min-height: 22px;
            margin-bottom: 10px;
        }
        .readout-blue { color: #2563EB; }
        .readout-red  { color: #DC2626; }
        .board-wrapper {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 10px;
            min-width: 0;
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div class="sim-layout">
        <div class="left-panel">
            <div class="panel-header">Parameter</div>
            <div class="slider-block">
                <div class="slider-label" id="label-k"></div>
                <input type="range" id="slider-k" min="-2" max="2" step="0.5" value="0">
            </div>
            <div class="divider"></div>
            <div class="readout-label">Translation</div>
            <div class="readout readout-blue" id="readout-g"></div>
            <div class="readout-label">Equivalent dilation</div>
            <div class="readout readout-red" id="readout-h"></div>
            <div class="readout-label">Dilation factor</div>
            <div class="readout" id="readout-factor"></div>
        </div>
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
</div>
<script>
    var COL_F       = '#888888';
    var COL_G       = '#2563EB';
    var COL_H       = '#DC2626';
    var COL_AXIS    = '#444444';
    var COL_GRID    = '#D1D5DB';

    var kVal = 0;

    var board = JXG.JSXGraph.initBoard('board', {
        boundingbox: [-2, 30, 2, -3],
        axis: true,
        keepAspectRatio: false,
        showNavigation: false,
        showCopyright: false,
        pan:  { enabled: false },
        zoom: { enabled: false },
        defaultAxes: {
            x: {
                strokeColor: COL_AXIS, strokeWidth: 1.2,
                lastArrow: { type: 2, size: 6 },
                ticks: {
                    strokeColor: COL_AXIS, label: { fontSize: 11 },
                    minorTicks: 0,
                    ticksDistance: 1
                }
            },
            y: {
                strokeColor: COL_AXIS, strokeWidth: 1.2,
                lastArrow: { type: 2, size: 6 },
                ticks: {
                    strokeColor: COL_AXIS, label: { fontSize: 11 },
                    minorTicks: 0,
                    ticksDistance: 5
                }
            }
        },
        grid: {
            strokeColor: COL_GRID,
            strokeWidth: 0.4
        }
    });

    // Axis labels
    board.create('text', [1.75, -1.0, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
    board.create('text', [0.15, 28.5, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

    // Fixed reference: f(x) = 5^x in muted gray
    board.create('functiongraph', [function(x) { return Math.pow(5, x); }, -2, 2], {
        strokeColor: COL_F, strokeWidth: 1.5, fixed: true, highlight: false
    });

    // g(x) = 5^(x+k) — solid blue, slider-driven
    board.create('functiongraph', [function(x) { return Math.pow(5, x + kVal); }, -2, 2], {
        strokeColor: COL_G, strokeWidth: 1.8, fixed: true, highlight: false
    });

    // h(x) = 5^k * 5^x — dashed red, slider-driven, overlays g
    board.create('functiongraph', [function(x) { return Math.pow(5, kVal) * Math.pow(5, x); }, -2, 2], {
        strokeColor: COL_H, strokeWidth: 1.8, fixed: true, highlight: false,
        dash: 2
    });

    function formatNum(v) {
        if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v));
        if (Math.abs(v) < 0.01) return v.toExponential(1);
        if (Math.abs(v) < 1) return v.toFixed(3);
        return v.toFixed(2);
    }

    function renderPanel() {
        if (typeof katex === 'undefined') return;
        katex.render('k = ' + formatNum(kVal),
            document.getElementById('label-k'), { throwOnError: false });
        katex.render('g(x) = 5^{x' + (kVal >= 0 ? '+' : '') + formatNum(kVal) + '}',
            document.getElementById('readout-g'), { throwOnError: false });
        var factor = Math.pow(5, kVal);
        katex.render('h(x) = ' + formatNum(factor) + ' \\cdot 5^{x}',
            document.getElementById('readout-h'), { throwOnError: false });
        katex.render('5^{' + formatNum(kVal) + '} = ' + formatNum(factor),
            document.getElementById('readout-factor'), { throwOnError: false });
    }

    document.getElementById('slider-k').addEventListener('input', function(e) {
        kVal = parseFloat(e.target.value);
        board.update();
        renderPanel();
    });

    if (typeof katex !== 'undefined') {
        renderPanel();
    } else {
        var pollKatex = setInterval(function() {
            if (typeof katex !== 'undefined') {
                clearInterval(pollKatex);
                renderPanel();
            }
        }, 50);
    }
</script>
</body>
</html>
