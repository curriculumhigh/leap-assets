<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increasing Functions — Concavity</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 640px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .boards-row { display: flex; gap: 12px; height: 100%; }
        .board-col { flex: 1; display: flex; flex-direction: column; }
        .board-title { text-align: center; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .board-wrapper { background: white; border-radius: 8px; padding: 8px; flex: 1; }
        .board-wrapper > div { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="boards-row">
            <div class="board-col">
                <div class="board-title">Figure I</div>
                <div class="board-wrapper"><div id="board1"></div></div>
            </div>
            <div class="board-col">
                <div class="board-title">Figure II</div>
                <div class="board-wrapper"><div id="board2"></div></div>
            </div>
        </div>
    </div>
    <script>
        function createBoard(id, curveFunc, yA, yB) {
            var board = JXG.JSXGraph.initBoard(id, {
                boundingbox: [-0.8, 5.5, 5.8, -0.8],
                axis: true,
                showNavigation: false,
                showCopyright: false,
                showInfobox: false,
                pan: { enabled: false },
                zoom: { enabled: false },
                defaultAxes: {
                    x: {
                        strokeColor: '#444444', strokeWidth: 1.2,
                        lastArrow: { type: 2, size: 6 },
                        ticks: { strokeColor: '#444444', label: { fontSize: 11, visible: false }, minorTicks: 0, ticksDistance: 1, drawLabels: false }
                    },
                    y: {
                        strokeColor: '#444444', strokeWidth: 1.2,
                        lastArrow: { type: 2, size: 6 },
                        ticks: { strokeColor: '#444444', label: { fontSize: 11, visible: false }, minorTicks: 0, ticksDistance: 1, drawLabels: false }
                    }
                },
                grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
            });

            // Axis labels
            board.create('text', [5.4, -0.45, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
            board.create('text', [0.2, 5.1, 'f(x)'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

            var aX = 1, bX = 4;

            // Curve
            board.create('functiongraph', [curveFunc, aX, bX], {
                strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
                highlightStrokeColor: '#222222'
            });

            // Points on x-axis
            var ptA = board.create('point', [aX, 0], {
                name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });
            var ptB = board.create('point', [bX, 0], {
                name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });

            // Labels a and b
            board.create('text', [aX, -0.4, 'a'], { useKatex: true, fontSize: 13, anchorX: 'middle', fixed: true, highlight: false });
            board.create('text', [bX, -0.4, 'b'], { useKatex: true, fontSize: 13, anchorX: 'middle', fixed: true, highlight: false });

            // Curve endpoints
            var ptCurveA = board.create('point', [aX, yA], {
                name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });
            var ptCurveB = board.create('point', [bX, yB], {
                name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });

            // Red dashed vertical drop lines
            board.create('segment', [[aX, yA], [aX, 0]], {
                strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false,
                highlightStrokeColor: '#DC2626'
            });
            board.create('segment', [[bX, yB], [bX, 0]], {
                strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false,
                highlightStrokeColor: '#DC2626'
            });

            return board;
        }

        // Figure I: Increasing, concave up (cup) — e.g. quadratic curving upward
        var funcI = function(x) { return 0.4 * Math.pow(x - 0.5, 2) + 0.5; };
        var yIA = funcI(1);
        var yIB = funcI(4);

        // Figure II: Increasing, concave down (cap) — e.g. sqrt-like
        var funcII = function(x) { return 2.0 * Math.sqrt(x - 0.5) + 0.3; };
        var yIIA = funcII(1);
        var yIIB = funcII(4);

        createBoard('board1', funcI, yIA, yIB);
        createBoard('board2', funcII, yIIA, yIIB);
    </script>
</body>
</html>
