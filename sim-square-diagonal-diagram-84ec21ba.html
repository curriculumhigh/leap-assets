<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square with Diagonal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 6.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Square vertices
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [5, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [5, 5], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [0, 5], { visible: false, fixed: true, name: '' });

        // Square outline
        board.create('polygon', [A, B, C, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Dashed diagonal from A (0,0) to C (5,5)
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2,
            fixed: true, highlight: false
        });

        // Side labels "5" — offset outward from each side midpoint
        board.create('text', [2.5, -0.6, '5'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#333333', fixed: true, highlight: false
        });
        board.create('text', [2.5, 5.6, '5'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#333333', fixed: true, highlight: false
        });
        board.create('text', [-0.55, 2.5, '5'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#333333', fixed: true, highlight: false
        });
        board.create('text', [5.55, 2.5, '5'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#333333', fixed: true, highlight: false
        });

        // Diagonal label "d" — offset above-left from midpoint of diagonal
        board.create('text', [2.1, 2.9, 'd'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#333333', useKatex: true,
            fixed: true, highlight: false
        });

        // Congruence tick marks — single tick on each side midpoint
        var tickLen = 0.25;
        var tickWidth = 1.5;

        // Bottom side tick (perpendicular to side = vertical)
        board.create('segment', [[2.5, -tickLen], [2.5, tickLen]], {
            strokeColor: '#555555', strokeWidth: tickWidth, fixed: true, highlight: false
        });
        // Top side tick
        board.create('segment', [[2.5, 5 - tickLen], [2.5, 5 + tickLen]], {
            strokeColor: '#555555', strokeWidth: tickWidth, fixed: true, highlight: false
        });
        // Left side tick (perpendicular to side = horizontal)
        board.create('segment', [[-tickLen, 2.5], [tickLen, 2.5]], {
            strokeColor: '#555555', strokeWidth: tickWidth, fixed: true, highlight: false
        });
        // Right side tick
        board.create('segment', [[5 - tickLen, 2.5], [5 + tickLen, 2.5]], {
            strokeColor: '#555555', strokeWidth: tickWidth, fixed: true, highlight: false
        });

        // Right angle marker at corner A (0,0)
        // Shows the 90° angle between the bottom side (+x direction) and the left side (+y direction)
        var raSize = 0.5;
        board.create('segment', [[raSize, 0], [raSize, raSize]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[0, raSize], [raSize, raSize]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
