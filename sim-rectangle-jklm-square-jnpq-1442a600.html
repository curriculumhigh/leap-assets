<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle JKLM and Square JNPQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 13.5, 12.5, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        ticksDistance: 2,
                        minorTicks: 1,
                        minorHeight: 6,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        ticksDistance: 2,
                        minorTicks: 1,
                        minorHeight: 6,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [12.0, -0.5, 'x'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.3, 13.0, 'y'], { useKatex: true, fontSize: 13, fixed: true, highlight: false });

        // ── Rectangle JKLM (grey) ───────────────────────────────────
        var COL_RECT = '#555555';
        var pJ = board.create('point', [1, 3], { name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false });
        var pK = board.create('point', [9, 3], { name: '', size: 2, color: COL_RECT, fixed: true, highlight: false, showInfobox: false });
        var pL = board.create('point', [9, 10], { name: '', size: 2, color: COL_RECT, fixed: true, highlight: false, showInfobox: false });
        var pM = board.create('point', [1, 10], { name: '', size: 2, color: COL_RECT, fixed: true, highlight: false, showInfobox: false });

        board.create('polygon', [pJ, pK, pL, pM], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_RECT, strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Square JNPQ (blue) ─────────────────────────────────────
        var COL_SQ = '#2563EB';
        var pN = board.create('point', [1, 8], { name: '', size: 2, color: COL_SQ, fixed: true, highlight: false, showInfobox: false });
        var pP = board.create('point', [6, 8], { name: '', size: 2, color: COL_SQ, fixed: true, highlight: false, showInfobox: false });
        var pQ = board.create('point', [6, 3], { name: '', size: 2, color: COL_SQ, fixed: true, highlight: false, showInfobox: false });

        board.create('polygon', [pJ, pN, pP, pQ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_SQ, strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Vertex labels (KaTeX) ──────────────────────────────────
        // J(1,3) — below, shifted right to clear y-axis ticks
        board.create('text', [1.3, 2.2, 'J(1,\\,3)'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'top'
        });

        // K(9,3) — right of point
        board.create('text', [9.8, 3.3, 'K(9,\\,3)'], {
            useKatex: true, fontSize: 11, color: COL_RECT, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'bottom'
        });

        // L(9,10) — right of point
        board.create('text', [9.5, 10.4, 'L(9,\\,10)'], {
            useKatex: true, fontSize: 11, color: COL_RECT, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'bottom'
        });

        // M(1,10) — above, shifted right to clear y-axis ticks
        board.create('text', [1.3, 10.9, 'M(1,\\,10)'], {
            useKatex: true, fontSize: 11, color: COL_RECT, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'bottom'
        });

        // N(1,8) — below, shifted further right to clear y-axis ticks
        board.create('text', [1.8, 7.2, 'N(1,\\,8)'], {
            useKatex: true, fontSize: 11, color: COL_SQ, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'top'
        });

        // P(6,8) — above and right
        board.create('text', [6.5, 8.4, 'P(6,\\,8)'], {
            useKatex: true, fontSize: 11, color: COL_SQ, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'bottom'
        });

        // Q(6,3) — below and right
        board.create('text', [6.5, 2.2, 'Q(6,\\,3)'], {
            useKatex: true, fontSize: 11, color: COL_SQ, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'top'
        });

        // ── Scale bar (1 ft) below x-axis ──────────────────────────
        var barY = -1.4;
        board.create('segment', [[5, barY], [6, barY]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[5, barY - 0.25], [5, barY + 0.25]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[6, barY - 0.25], [6, barY + 0.25]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('text', [5.5, barY - 0.2, '1\\text{ ft}'], {
            useKatex: true, fontSize: 10, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'top'
        });
    </script>
</body>
</html>
