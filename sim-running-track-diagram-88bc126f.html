<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Track Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 5, 7, -5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Dimensions ──────────────────────────────────────────────────
        var r = 2;
        var l = 5;
        var halfL = l / 2;

        // ── Key coordinates ─────────────────────────────────────────────
        var cxL = -halfL;
        var cxR = halfL;

        var TL = [cxL, r];
        var TR = [cxR, r];
        var BL = [cxL, -r];
        var BR = [cxR, -r];

        // ── Track outline ───────────────────────────────────────────────
        board.create('segment', [TL, TR], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('segment', [BL, BR], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return cxR + r * Math.cos(t); },
            function(t) { return r * Math.sin(t); },
            -Math.PI / 2,
            Math.PI / 2
        ], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return cxL + r * Math.cos(t); },
            function(t) { return r * Math.sin(t); },
            Math.PI / 2,
            3 * Math.PI / 2
        ], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Interior fill (subtle) ─────────────────────────────────────
        var fillPts = [];
        var steps = 60;
        var i, ang;

        fillPts.push(TL);
        fillPts.push(TR);

        for (i = 0; i <= steps; i++) {
            ang = Math.PI / 2 - (Math.PI * i / steps);
            fillPts.push([cxR + r * Math.cos(ang), r * Math.sin(ang)]);
        }

        fillPts.push(BL);

        for (i = 0; i <= steps; i++) {
            ang = -Math.PI / 2 - (Math.PI * i / steps);
            fillPts.push([cxL + r * Math.cos(ang), r * Math.sin(ang)]);
        }

        var fillVerts = [];
        for (i = 0; i < fillPts.length; i++) {
            fillVerts.push(
                board.create('point', fillPts[i], { visible: false, fixed: true, name: '' })
            );
        }

        board.create('polygon', fillVerts, {
            fillColor: '#D1D5DB', fillOpacity: 0.18,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Label: l on the top edge ────────────────────────────────────
        var tickH = 0.25;
        var tickY = r + 0.35;
        board.create('segment', [[cxL, tickY - tickH], [cxL, tickY + tickH]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[cxR, tickY - tickH], [cxR, tickY + tickH]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[cxL, tickY], [cxR, tickY]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('text', [0, tickY + 0.55, 'l'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // ── Label: r on the right semicircle ────────────────────────────
        var centerR = board.create('point', [cxR, 0], { visible: false, fixed: true, name: '' });
        var edgeR = board.create('point', [cxR + r, 0], { visible: false, fixed: true, name: '' });

        board.create('segment', [centerR, edgeR], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2,
            fixed: true, highlight: false
        });

        board.create('point', [cxR, 0], {
            name: '', size: 1.5, color: '#DC2626', fixed: true, highlight: false
        });

        board.create('text', [cxR + r / 2, 0.45, 'r'], {
            useKatex: true, fontSize: 16, color: '#DC2626',
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
