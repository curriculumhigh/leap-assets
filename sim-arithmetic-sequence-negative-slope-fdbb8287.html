<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Sequence Graph — Negative Slope</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
            <div class="coord-tooltip" id="tooltip"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 115, 6.8, -12],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Grid lines
        var i;
        for (i = 0; i <= 6; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        for (i = 0; i <= 100; i += 10) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // Axes
        board.create('arrow', [[0, 0], [6.4, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        board.create('arrow', [[0, 0], [0, 108]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels — n-axis
        var tickLen = 2.2;
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [i, -6, String(i)], {
                fontSize: 10, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Tick marks and labels — a_n axis
        var tickLenX = 0.12;
        for (i = 10; i <= 100; i += 10) {
            board.create('segment', [[-tickLenX, i], [tickLenX, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [-0.35, i, String(i)], {
                fontSize: 10, anchorX: 'right', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [6.15, -8, 'n'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false,
            useKatex: true
        });
        board.create('text', [0.3, 110, 'a_n'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false,
            useKatex: true
        });

        // Tooltip setup
        var tooltip = document.getElementById('tooltip');
        var boardWrapper = document.querySelector('.board-wrapper');

        function showTooltip(pt, color) {
            var xVal = Math.round(pt.X());
            var yVal = Math.round(pt.Y());
            var latex = '\\color{' + color + '}{(' + xVal + ',\\,' + yVal + ')}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';

            var boardEl = document.getElementById('board');
            var rect = boardEl.getBoundingClientRect();
            var wrapRect = boardWrapper.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var sx = coords.scrCoords[1] + rect.left - wrapRect.left;
            var sy = coords.scrCoords[2] + rect.top - wrapRect.top;
            tooltip.style.left = (sx + 10) + 'px';
            tooltip.style.top = (sy - 24) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // Data points with hover tooltips
        var data = [[1, 90], [2, 79], [3, 68], [4, 57]];
        var ptColor = '#222222';

        for (i = 0; i < data.length; i++) {
            (function(idx) {
                var pt = board.create('point', data[idx], {
                    name: '', size: 3, color: ptColor,
                    fixed: true, showInfobox: false,
                    highlight: true,
                    highlightFillColor: ptColor,
                    highlightStrokeColor: ptColor,
                    highlightSize: 4
                });
                pt.on('over', function() { showTooltip(pt, ptColor); });
                pt.on('out', function() { hideTooltip(); });
            })(i);
        }
    </script>
</body>
</html>
