<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle STV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 8, 12, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var S = board.create('point', [0, 5], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var T = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var V = board.create('point', [8, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle edges (no fill) ────────────────────────────────────
        board.create('polygon', [S, T, V], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at T ─────────────────────────────────────
        var sq = 0.8;
        var sqP1 = board.create('point', [sq, 0], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [sq, sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [0, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Vertex labels (bold KaTeX) ──────────────────────────────────
        board.create('text', [-0.8, 5.6, '\\textbf{S}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [-0.8, -0.7, '\\textbf{T}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [8.8, -0.7, '\\textbf{V}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // ── Side length labels (KaTeX) ──────────────────────────────────
        // ST = 5 (left of the vertical side)
        board.create('text', [-1.1, 2.5, '5'], {
            useKatex: true, fontSize: 14, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // TV = 8 (below the horizontal side)
        board.create('text', [4, -1.0, '8'], {
            useKatex: true, fontSize: 14, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // SV = sqrt(89) (offset outward upper-right of hypotenuse)
        board.create('text', [5.0, 3.4, '\\sqrt{89}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
