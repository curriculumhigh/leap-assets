<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Center (1, 2) and Radius 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 8.5, 9, -4.5],
            axis: true,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            }
        });

        // Axis labels
        board.create('text', [8.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false, anchorX: 'right' });
        board.create('text', [0.3, 8.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        var COL_P = '#059669';

        // Center C(1, 2)
        var C = board.create('point', [1, 2], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [1.35, 1.5, 'C(1,2)'], { fontSize: 12, color: '#222222', fixed: true, useKatex: true });

        // Circle with radius 5
        board.create('circle', [C, 5], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // General point P(x, y) in first quadrant — at (4, 6) which is on the circle
        board.create('point', [4, 6], {
            name: '', size: 4, color: COL_P, fixed: true, showInfobox: false, highlight: false
        });
        board.create('text', [4.3, 6.5, 'P(x,y)'], { fontSize: 12, color: COL_P, fixed: true, useKatex: true });
    </script>
</body>
</html>
