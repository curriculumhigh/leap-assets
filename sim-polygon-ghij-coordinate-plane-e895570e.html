<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon GHIJ on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.5, 5.5, 5.5, -5.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 5.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var G = board.create('point', [2, -3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var H = board.create('point', [3, 1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var I = board.create('point', [-5, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var J = board.create('point', [-6, -1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Polygon GHIJ
        board.create('polygon', [G, H, I, J], {
            fillColor: '#888888',
            fillOpacity: 0.15,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // KaTeX labels — offset to avoid overlap
        // G(2, -3) — below-right
        board.create('text', [2.4, -3.6, 'G(2,\\,-3)'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });

        // H(3, 1) — right
        board.create('text', [3.4, 1.0, 'H(3,\\,1)'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });

        // I(-5, 3) — above-left
        board.create('text', [-5.2, 3.5, 'I(-5,\\,3)'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false,
            anchorX: 'right'
        });

        // J(-6, -1) — below, shifted right
        board.create('text', [-5.8, -1.6, 'J(-6,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false,
            anchorX: 'right'
        });
    </script>
</body>
</html>
