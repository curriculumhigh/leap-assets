<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor — Domain starts at n=0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 33, 4.3, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Manual axes ─────────────────────────────────────────────────────
        var xAxis = board.create('arrow', [[-1.2, 0], [4.3, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -3], [0, 33]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        // ── Grid (every 1 unit) ─────────────────────────────────────────────
        var i;
        for (i = -1; i <= 4; i++) {
            if (i === 0) continue;
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        for (i = -2; i <= 32; i++) {
            if (i === 0) continue;
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // ── X-axis ticks + labels (every 1) ────────────────────────────────
        for (i = 1; i <= 4; i++) {
            board.create('segment', [[i, -0.4], [i, 0.4]], {
                strokeColor: '#444444', strokeWidth: 0.8, fixed: true, highlight: false
            });
            board.create('text', [i, -1.4, String(i)], {
                fontSize: 9, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Y-axis: tick marks at every 1, labels at every 5 ───────────────
        for (i = 1; i <= 32; i++) {
            board.create('segment', [[-0.15, i], [0.15, i]], {
                strokeColor: '#444444', strokeWidth: 0.8, fixed: true, highlight: false
            });
            if (i % 5 === 0) {
                board.create('text', [-0.55, i, String(i)], {
                    fontSize: 9, anchorX: 'right', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // ── Axis labels ─────────────────────────────────────────────────────
        board.create('text', [3.95, -1.8, 'n'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.3, 31.5, 'a_n'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });

        // ── Discrete points ─────────────────────────────────────────────────
        var pts = [[0, 8], [1, 15], [2, 22], [3, 29]];
        for (i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 3, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
