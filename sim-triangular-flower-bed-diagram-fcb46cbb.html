<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangular Flower Bed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 10, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var scale = 1 / 7;

        var Ax = 1, Ay = 1;

        var angleA_rad = 62 * Math.PI / 180;
        var sideBC = 48;
        var sideAC = 39;

        var sinB = sideAC * Math.sin(angleA_rad) / sideBC;
        var angleB_rad = Math.asin(sinB);
        var angleC_rad = Math.PI - angleA_rad - angleB_rad;
        var sideAB = sideBC * Math.sin(angleC_rad) / Math.sin(angleA_rad);

        var AB_vis = sideAB * scale;
        var AC_vis = sideAC * scale;

        var Bx = Ax + AB_vis;
        var By = Ay;

        var Cx = Ax + AC_vis * Math.cos(angleA_rad);
        var Cy = Ay + AC_vis * Math.sin(angleA_rad);

        var A = board.create('point', [Ax, Ay], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var B = board.create('point', [Bx, By], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var C = board.create('point', [Cx, Cy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        var triangle = board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('nonReflexAngle', [B, A, C], {
            radius: 0.7,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var bisectorAngle = angleA_rad / 2;
        var angleLabelR = 1.05;
        board.create('text', [
            Ax + angleLabelR * Math.cos(bisectorAngle),
            Ay + angleLabelR * Math.sin(bisectorAngle),
            '62^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var MEAS_COL = '#3B82F6';

        var bcMidX = (Bx + Cx) / 2;
        var bcMidY = (By + Cy) / 2;
        var bcDx = Cx - Bx;
        var bcDy = Cy - By;
        var bcLen = Math.sqrt(bcDx * bcDx + bcDy * bcDy);
        var bcNx = -bcDy / bcLen;
        var bcNy = bcDx / bcLen;
        var toA_x = Ax - bcMidX;
        var toA_y = Ay - bcMidY;
        if (bcNx * toA_x + bcNy * toA_y > 0) {
            bcNx = -bcNx;
            bcNy = -bcNy;
        }
        var bcOffset = 0.45;
        board.create('text', [
            bcMidX + bcNx * bcOffset,
            bcMidY + bcNy * bcOffset,
            '48\\text{ ft}'
        ], {
            useKatex: true, fontSize: 13, color: MEAS_COL,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var acMidX = (Ax + Cx) / 2;
        var acMidY = (Ay + Cy) / 2;
        var acDx = Cx - Ax;
        var acDy = Cy - Ay;
        var acLen = Math.sqrt(acDx * acDx + acDy * acDy);
        var acNx = -acDy / acLen;
        var acNy = acDx / acLen;
        var toB_x = Bx - acMidX;
        var toB_y = By - acMidY;
        if (acNx * toB_x + acNy * toB_y > 0) {
            acNx = -acNx;
            acNy = -acNy;
        }
        var acOffset = 0.5;
        board.create('text', [
            acMidX + acNx * acOffset,
            acMidY + acNy * acOffset,
            '39\\text{ ft}'
        ], {
            useKatex: true, fontSize: 13, color: MEAS_COL,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var centX = (Ax + Bx + Cx) / 3;
        var centY = (Ay + By + Cy) / 3;

        function vertexLabelPos(px, py, off) {
            var dx = px - centX;
            var dy = py - centY;
            var d = Math.sqrt(dx * dx + dy * dy);
            return [px + (dx / d) * off, py + (dy / d) * off];
        }

        var lblOff = 0.45;
        var posA = vertexLabelPos(Ax, Ay, lblOff);
        var posB = vertexLabelPos(Bx, By, lblOff);
        var posC = vertexLabelPos(Cx, Cy, lblOff);

        board.create('text', [posA[0], posA[1], 'A'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [posB[0], posB[1], 'B'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [posC[0], posC[1], 'C'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600; font-style:italic;'
        });
    </script>
</body>
</html>
