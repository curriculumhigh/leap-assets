<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities — Common Region</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 160px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; justify-content: center; gap: 18px;
        }
        .panel-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 6px;
        }
        .legend-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
        }
        .legend-line-solid {
            width: 24px; height: 0; border-top: 2.5px solid #222222; flex-shrink: 0;
        }
        .legend-line-dashed {
            width: 24px; height: 0; border-top: 2.5px dashed #2563EB; flex-shrink: 0;
        }
        .legend-label { font-size: 13px; color: #333; }
        .shading-section { border-top: 1px solid #e5e7eb; padding-top: 14px; }
        .shading-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
        }
        .shading-swatch {
            width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0;
            background: rgba(124, 58, 237, 0.25); border: 1px solid #7C3AED;
        }
        .shading-label { font-size: 12px; color: #555; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="panel-section">
                    <div class="panel-label">Functions</div>
                    <div class="legend-item">
                        <div class="legend-line-solid"></div>
                        <span class="legend-label" id="legend-f1"></span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-line-dashed"></div>
                        <span class="legend-label" id="legend-f2"></span>
                    </div>
                </div>
                <div class="panel-section shading-section">
                    <div class="panel-label">Shading</div>
                    <div class="shading-item">
                        <div class="shading-swatch"></div>
                        <span class="shading-label">Solution region</span>
                    </div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        katex.render('y = -x^2 + 6', document.getElementById('legend-f1'), { throwOnError: false });
        katex.render('y = x^2 - 4x', document.getElementById('legend-f2'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 7.5, 7.5, -5.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 7.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Functions
        var f1 = function(x) { return -x * x + 6; };
        var f2 = function(x) { return x * x - 4 * x; };

        // Intersection: x = -1 and x = 3
        var xLeft = -1;
        var xRight = 3;

        // Shaded common region (between curves from x=-1 to x=3)
        var numPts = 80;
        var shadePoints = [];
        var i, t;

        // Upper boundary: f1 from left to right
        for (i = 0; i <= numPts; i++) {
            t = xLeft + (xRight - xLeft) * i / numPts;
            shadePoints.push(board.create('point', [t, f1(t)], { visible: false, fixed: true, name: '' }));
        }
        // Lower boundary: f2 from right to left
        for (i = numPts; i >= 0; i--) {
            t = xLeft + (xRight - xLeft) * i / numPts;
            shadePoints.push(board.create('point', [t, f2(t)], { visible: false, fixed: true, name: '' }));
        }

        board.create('polygon', shadePoints, {
            fillColor: '#7C3AED',
            fillOpacity: 0.18,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            fixed: true,
            highlight: false,
            hasInnerPoints: false
        });

        // Curve 1: y = -x^2 + 6 (solid, black)
        board.create('functiongraph', [f1, -3.5, 7.5], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Curve 2: y = x^2 - 4x (dashed, blue)
        board.create('functiongraph', [f2, -3.5, 7.5], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            dash: 2,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
