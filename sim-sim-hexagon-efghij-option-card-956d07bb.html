<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon EFGHIJ — Option Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 7.5, 8, -7.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.4, -0.55, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 7.0, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Vertices of the hexagon EFGHIJ
        var coords = [
            [-6, 2],   // E
            [-4, 4],   // F
            [-2, 4],   // G
            [-1, 2],   // H
            [-3, 0],   // I
            [-4, 0]    // J
        ];

        var names = ['E', 'F', 'G', 'H', 'I', 'J'];
        var offsets = [
            [-12, 4],   // E — left
            [-4, 8],    // F — above
            [4, 8],     // G — above right
            [6, 4],     // H — right
            [2, -12],   // I — below
            [-10, -12]  // J — below left
        ];

        var points = [];
        for (var i = 0; i < coords.length; i++) {
            var pt = board.create('point', coords[i], {
                name: '',
                size: 2.5,
                color: '#DC2626',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
            // KaTeX label
            board.create('text', [
                coords[i][0] + offsets[i][0] * 0.08,
                coords[i][1] + offsets[i][1] * 0.08,
                names[i]
            ], {
                useKatex: true,
                fontSize: 9,
                color: '#DC2626',
                fixed: true,
                highlight: false,
                anchorX: 'middle',
                anchorY: 'middle'
            });
            points.push(pt);
        }

        // Polygon (hexagon edges)
        board.create('polygon', points, {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#2563EB',
                strokeWidth: 1.5
            },
            vertices: { visible: false },
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
