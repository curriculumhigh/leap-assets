<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Geometric Sequence</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 20, 5.4, -12],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // Manual axes with forced tick distances
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 10 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 10 },
                minorTicks: 0,
                ticksDistance: 2,
                insertTicks: false
            }
        });

        // Grid — manual, matching tick distances
        // Vertical grid lines at x = 1,2,3,4,5
        for (var gx = 1; gx <= 5; gx++) {
            board.create('line', [[gx, 0], [gx, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }
        // Horizontal grid lines at y = -12,-10,...,18,20 (step 2)
        for (var gy = -12; gy <= 20; gy += 2) {
            if (gy === 0) continue;
            board.create('line', [[0, gy], [1, gy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }

        // Axis labels
        board.create('text', [4.9, -1.8, 'n'], {
            fontSize: 11, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.25, 18.5, 'a_n'], {
            fontSize: 11, fixed: true, highlight: false, useKatex: true
        });

        // Data points
        var pts = [[1, -2], [2, 4], [3, -8], [4, 16]];
        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '',
                size: 3,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
