<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle PQR with Altitude QS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-12, 70, 180, -12],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var R = board.create('point', [169, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var Q = board.create('point', [25, 60], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var S = board.create('point', [25, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [P, Q], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [Q, R], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [P, R], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // ── Altitude QS ─────────────────────────────────────────────────
        board.create('segment', [Q, S], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // ── Right-angle marker at Q ─────────────────────────────────────
        var markerSize = 4.5;

        var qpDx = P.X() - Q.X(), qpDy = P.Y() - Q.Y();
        var qpLen = Math.sqrt(qpDx * qpDx + qpDy * qpDy);
        var uQP = [qpDx / qpLen, qpDy / qpLen];

        var qrDx = R.X() - Q.X(), qrDy = R.Y() - Q.Y();
        var qrLen = Math.sqrt(qrDx * qrDx + qrDy * qrDy);
        var uQR = [qrDx / qrLen, qrDy / qrLen];

        var qA = [Q.X() + markerSize * uQP[0], Q.Y() + markerSize * uQP[1]];
        var qB = [Q.X() + markerSize * (uQP[0] + uQR[0]), Q.Y() + markerSize * (uQP[1] + uQR[1])];
        var qC = [Q.X() + markerSize * uQR[0], Q.Y() + markerSize * uQR[1]];

        board.create('segment', [qA, qB], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [qB, qC], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Right-angle marker at S ─────────────────────────────────────
        var sMarkerSize = 4.5;
        var sA = [S.X() - sMarkerSize, S.Y()];
        var sB = [S.X() - sMarkerSize, S.Y() + sMarkerSize];
        var sC = [S.X(), S.Y() + sMarkerSize];

        board.create('segment', [sA, sB], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sB, sC], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [-6, -2, 'P'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [174, -2, 'R'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [25, 65, 'Q'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [25, -6, 'S'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // ── Segment labels ──────────────────────────────────────────────
        board.create('text', [12.5, -6, '25'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        board.create('text', [97, -6, '144'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        board.create('text', [31, 30, 'p'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'left', anchorY: 'middle'
        });

        board.create('text', [6, 33, 'q'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'right', anchorY: 'middle'
        });

        board.create('text', [103, 33, 'r'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'left', anchorY: 'middle'
        });
    </script>
</body>
</html>
