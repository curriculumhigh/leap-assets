<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities — Below Both</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 7, 8, -11],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.0,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.0,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [7.4, -0.7, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 6.4, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Functions
        function f(x) { return -x * x + 2 * x + 3; }
        function g(x) { return x * x - 4 * x - 5; }

        // Shaded region: below both parabolas = y <= min(f(x), g(x))
        var FLOOR = -11;
        var X_LEFT = -4;
        var X_RIGHT = 8;
        var STEPS = 200;
        var dx = (X_RIGHT - X_LEFT) / STEPS;

        // Build polygon vertices: top edge is min(f,g), bottom edge is floor
        var shadeVerts = [];
        var i;
        // Top edge left to right
        for (i = 0; i <= STEPS; i++) {
            var xi = X_LEFT + i * dx;
            var yi = Math.min(f(xi), g(xi));
            shadeVerts.push(board.create('point', [xi, yi], { visible: false, fixed: true, name: '' }));
        }
        // Bottom edge right to left
        shadeVerts.push(board.create('point', [X_RIGHT, FLOOR], { visible: false, fixed: true, name: '' }));
        shadeVerts.push(board.create('point', [X_LEFT, FLOOR], { visible: false, fixed: true, name: '' }));

        board.create('polygon', shadeVerts, {
            fillColor: '#888888',
            fillOpacity: 0.15,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Primary curve: f(x) = -x² + 2x + 3 — solid, dark
        board.create('functiongraph', [f, -4, 8], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Secondary curve: g(x) = x² - 4x - 5 — dashed, blue
        board.create('functiongraph', [g, -4, 8], {
            strokeColor: '#2563EB', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Function labels (name only)
        board.create('text', [-3.2, 3.5, 'f(x)'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [6, 3.5, 'g(x)'], {
            fontSize: 10, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
