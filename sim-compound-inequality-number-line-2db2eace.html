<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Inequality: y &lt; -3 or y ≥ 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 3, 10, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_LINE = '#444444';
        var COL_SOL = '#2563EB';
        var TICK_H = 0.15;

        // Number line with arrows on both ends
        board.create('arrow', [[-7.5, 0], [9.5, 0]], {
            strokeColor: COL_LINE, strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels
        var i;
        for (i = -7; i <= 9; i++) {
            board.create('segment', [[i, -TICK_H], [i, TICK_H]], {
                strokeColor: COL_LINE, strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -0.55, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'top',
                color: COL_LINE, fixed: true, highlight: false
            });
        }

        // Shaded ray: y < -3 (extends left from -3)
        board.create('segment', [[-7.5, 0], [-3, 0]], {
            strokeColor: COL_SOL, strokeWidth: 3, fixed: true, highlight: false
        });

        // Shaded ray: y >= 5 (extends right from 5)
        board.create('segment', [[5, 0], [9.5, 0]], {
            strokeColor: COL_SOL, strokeWidth: 3, fixed: true, highlight: false
        });

        // Open circle at -3 (strict inequality)
        board.create('point', [-3, 0], {
            name: '', size: 5,
            fillColor: '#ffffff', strokeColor: COL_SOL, strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // Closed circle at 5 (inclusive inequality)
        board.create('point', [5, 0], {
            name: '', size: 5,
            fillColor: COL_SOL, strokeColor: COL_SOL, strokeWidth: 1.5,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
