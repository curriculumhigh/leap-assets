<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6, 5.5, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.1, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 5.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parametric curve: x = t, y = t^2 - 4t + 3
        board.create('curve', [
            function(t) { return t; },
            function(t) { return t * t - 4 * t + 3; },
            -1.5, 5.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Direction arrow on the right branch
        board.create('curve', [
            function(t) { return t; },
            function(t) { return t * t - 4 * t + 3; },
            3.8, 4.6
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Key point: t = 0 → (0, 3)
        board.create('point', [0, 3], {
            name: '', size: 5, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [0.4, 3.15, 't = 0'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });

        // Key point: t = 1 → (1, 0)
        board.create('point', [1, 0], {
            name: '', size: 5, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [1, 0.45, 't = 1'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        // Key point: t = 2 → (2, -1)
        board.create('point', [2, -1], {
            name: '', size: 5, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [2, -1.5, 't = 2'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        // Key point: t = 3 → (3, 0)
        board.create('point', [3, 0], {
            name: '', size: 5, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [3, 0.45, 't = 3'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        // Curve label "C" near upper-right portion
        board.create('text', [4.7, 4.8, 'C'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });

        // Direction label "t" near arrowhead
        board.create('text', [4.75, 3.6, 't'], {
            useKatex: true, fontSize: 11, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
