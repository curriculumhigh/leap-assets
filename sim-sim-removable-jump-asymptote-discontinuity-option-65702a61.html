<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discontinuity Types Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.8, 4.8, 4.2, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.85, -0.3, '\\textit{x}'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.2, 4.45, '\\textit{y}'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });

        // Vertical asymptote at x = 1 (dashed cyan)
        board.create('line', [[1, 0], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // Piece 1: x < -1, y = x + 2
        board.create('functiongraph', [
            function(x) { return x + 2; },
            -3.8, -1.001
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Piece 2: -1 < x < 0, y = x + 2
        board.create('functiongraph', [
            function(x) { return x + 2; },
            -0.999, -0.001
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Piece 3: 0 <= x < 1, y = -1/(x-1)
        board.create('functiongraph', [
            function(x) { return -1 / (x - 1); },
            0.0, 0.99
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Piece 4: x > 1, y = 1/(x-1)
        board.create('functiongraph', [
            function(x) { return 1 / (x - 1); },
            1.01, 4.2
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Removable discontinuity at x = -1: open circle at (-1, 1)
        board.create('point', [-1, 1], {
            name: '', size: 4,
            fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // Jump discontinuity at x = 0
        // Open circle at (0, 2) — left-side limit
        board.create('point', [0, 2], {
            name: '', size: 4,
            fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // Filled dot at (0, 1) — function value
        board.create('point', [0, 1], {
            name: '', size: 4,
            fillColor: '#222222', strokeColor: '#222222',
            fixed: true, highlight: false
        });

        // Function label
        board.create('text', [2.9, 2.2, 'f(x)'], {
            fontSize: 11, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
