<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Region under y = 1/(x² - 2x + 5)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var f = function(x) { return 1 / (x * x - 2 * x + 5); };

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 0.32, 5.5, -0.05],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 10,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, anchorX: 'right', offset: [-6, 0] },
                        minorTicks: 0,
                        ticksDistance: 0.1,
                        majorHeight: 10,
                        drawZero: false
                    }
                }
            }
        });

        // Axis labels
        board.create('text', [5.2, -0.012, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.15, 0.31, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Shaded region between curve and x-axis for 1 <= x <= 3
        var shadedX = [];
        var shadedY = [];
        var nPts = 120;
        var dx = (3 - 1) / nPts;
        // Bottom edge along x-axis (left to right)
        shadedX.push(1);
        shadedY.push(0);
        // Curve (left to right)
        for (var i = 0; i <= nPts; i++) {
            var xi = 1 + i * dx;
            shadedX.push(xi);
            shadedY.push(f(xi));
        }
        // Close back down to x-axis
        shadedX.push(3);
        shadedY.push(0);

        board.create('curve', [shadedX, shadedY], {
            strokeWidth: 0,
            fillColor: '#222222',
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        // Vertical dashed reference lines at x = 1 and x = 3
        board.create('segment', [[1, 0], [1, f(1)]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [[3, 0], [3, f(3)]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Primary curve
        board.create('functiongraph', [f, -2.5, 5.5], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Function label — positioned right of shaded region, clear of curve and axes
        board.create('text', [3.35, 0.24, 'y = \\dfrac{1}{x^2 - 2x + 5}'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'top'
        });
    </script>
</body>
</html>
