<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which Club's Candidate Will You Vote For?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px; margin: 0 auto; padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.5, 9.5, 8.5, -8.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Data ────────────────────────────────────────────────────────
        var sectors = [
            { name: 'Science', pct: 38, color: '#2563EB', inside: true },
            { name: 'Arts',    pct: 29, color: '#DC2626', inside: true },
            { name: 'Sports',  pct: 19, color: '#059669', inside: false },
            { name: 'Tech',    pct:  9, color: '#D97706', inside: false },
            { name: 'Other',   pct:  5, color: '#9CA3AF', inside: false }
        ];

        var CX = 0, CY = -0.6;
        var R = 4.2;
        var WHITE = '#FFFFFF';

        // ── Title (centered, top) ───────────────────────────────────────
        board.create('text', [0, 8.5, "Which Club's Candidate Will You Vote For?"], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: '#222222',
            cssStyle: 'font-weight:700;',
            fixed: true, highlight: false
        });

        // ── Margin of error annotation (right-aligned, below title) ────
        board.create('text', [8.0, 7.3, 'Margin of Error: \u00B12%'], {
            anchorX: 'right', anchorY: 'middle',
            fontSize: 12, color: '#444444',
            cssStyle: 'font-weight:700;',
            fixed: true, highlight: false
        });

        // ── Draw pie sectors ────────────────────────────────────────────
        var startAngle = Math.PI / 2;

        function degToRad(d) { return d * Math.PI / 180; }

        function drawSector(cx, cy, r, aStart, aEnd, fillColor) {
            var pts = [];
            var center = board.create('point', [cx, cy], { visible: false, name: '' });
            pts.push(center);

            var steps = 80;
            var da = (aEnd - aStart) / steps;
            for (var i = 0; i <= steps; i++) {
                var a = aStart + da * i;
                var px = cx + r * Math.cos(a);
                var py = cy + r * Math.sin(a);
                var p = board.create('point', [px, py], { visible: false, name: '' });
                pts.push(p);
            }

            var poly = board.create('polygon', pts, {
                fillColor: fillColor,
                fillOpacity: 0.88,
                borders: { strokeColor: WHITE, strokeWidth: 2.5 },
                vertices: { visible: false },
                hasInnerPoints: false,
                fixed: true,
                highlight: false
            });
            return poly;
        }

        var currentAngle = startAngle;

        for (var i = 0; i < sectors.length; i++) {
            var s = sectors[i];
            var sweepRad = degToRad(s.pct / 100 * 360);
            var aStart = currentAngle;
            var aEnd = currentAngle - sweepRad;

            drawSector(CX, CY, R, aStart, aEnd, s.color);

            var midAngle = (aStart + aEnd) / 2;

            if (s.inside) {
                var labelR = R * 0.55;
                var lx = CX + labelR * Math.cos(midAngle);
                var ly = CY + labelR * Math.sin(midAngle);

                board.create('text', [lx, ly + 0.45, s.name], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 14, color: WHITE,
                    cssStyle: 'font-weight:700;',
                    fixed: true, highlight: false
                });
                board.create('text', [lx, ly - 0.45, s.pct + '%'], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 13, color: WHITE,
                    cssStyle: 'font-weight:600;',
                    fixed: true, highlight: false
                });
            } else {
                var innerR = R * 0.78;
                var outerR = R + 1.1;

                var ix = CX + innerR * Math.cos(midAngle);
                var iy = CY + innerR * Math.sin(midAngle);
                var ox = CX + outerR * Math.cos(midAngle);
                var oy = CY + outerR * Math.sin(midAngle);

                var extendRight = (Math.cos(midAngle) >= 0);
                var ex = ox + (extendRight ? 1.2 : -1.2);
                var ey = oy;

                var pInner = board.create('point', [ix, iy], { visible: false, name: '' });
                var pOuter = board.create('point', [ox, oy], { visible: false, name: '' });
                board.create('segment', [pInner, pOuter], {
                    strokeColor: '#666666', strokeWidth: 1.0,
                    fixed: true, highlight: false
                });

                var pExtend = board.create('point', [ex, ey], { visible: false, name: '' });
                board.create('segment', [pOuter, pExtend], {
                    strokeColor: '#666666', strokeWidth: 1.0,
                    fixed: true, highlight: false
                });

                board.create('point', [ix, iy], {
                    name: '', size: 1.5, color: '#666666',
                    fixed: true, highlight: false
                });

                var anchorSide = extendRight ? 'left' : 'right';
                var textX = ex + (extendRight ? 0.25 : -0.25);

                board.create('text', [textX, ey + 0.3, s.name], {
                    anchorX: anchorSide, anchorY: 'middle',
                    fontSize: 12, color: s.color,
                    cssStyle: 'font-weight:700;',
                    fixed: true, highlight: false
                });
                board.create('text', [textX, ey - 0.3, s.pct + '%'], {
                    anchorX: anchorSide, anchorY: 'middle',
                    fontSize: 11, color: '#444444',
                    cssStyle: 'font-weight:600;',
                    fixed: true, highlight: false
                });
            }

            currentAngle = aEnd;
        }

        board.create('circle', [[CX, CY], R], {
            strokeColor: WHITE, strokeWidth: 1.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });

    </script>
</body>
</html>
