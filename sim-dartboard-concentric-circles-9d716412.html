<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dartboard — 6 Concentric Circles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var R = 45;
        var CX = 0;
        var CY = 0;
        var DIM_X = R + 8;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-56, 58, 76, -58],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* Radii from outermost to innermost */
        var radii = [45, 37.5, 30, 22.5, 15, 7.5];

        /* True alternating: blue for odd rings (1,3,5), orange for even rings (2,4,6) */
        var COL_A = '#2563EB';
        var COL_B = '#D97706';
        var FILL_OP = 0.30;

        var i, r;
        for (i = 0; i < radii.length; i++) {
            r = radii[i];
            board.create('circle', [[CX, CY], r], {
                strokeColor: '#555555',
                strokeWidth: 1.5,
                fillColor: (i % 2 === 0) ? COL_A : COL_B,
                fillOpacity: FILL_OP,
                fixed: true,
                highlight: false
            });
        }

        /* Center dot */
        board.create('point', [CX, CY], {
            name: '', size: 2, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        /* ── Dimension line (vertical, right side) ─────────────────────── */

        /* Main vertical line */
        board.create('segment', [[DIM_X, CY + R], [DIM_X, CY - R]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        /* Top arrowhead */
        board.create('arrow', [[DIM_X, CY + R - 4], [DIM_X, CY + R]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        /* Bottom arrowhead */
        board.create('arrow', [[DIM_X, CY - R + 4], [DIM_X, CY - R]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        /* Serif caps */
        board.create('segment', [[DIM_X - 2.5, CY + R], [DIM_X + 2.5, CY + R]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[DIM_X - 2.5, CY - R], [DIM_X + 2.5, CY - R]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        /* Label — close to the dimension line */
        board.create('text', [DIM_X + 3, CY, '90 \\text{ cm}'], {
            useKatex: true, fontSize: 14, anchorX: 'left', anchorY: 'middle',
            color: '#444444', fixed: true, highlight: false
        });
    </script>
</body>
</html>
