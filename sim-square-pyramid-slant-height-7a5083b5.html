<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Pyramid Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 10, 7, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Pyramid geometry (3D projected to 2D)
        var FL = [-3.5, 0];
        var FR = [3.5, 0];
        var BR = [1.8, 2.4];
        var BL = [-1.8, 2.4];
        var apex = [0, 8.5];
        var midFront = [0, 0];

        // Base vertices (hidden points)
        var pFL = board.create('point', FL, { visible: false, name: '', fixed: true });
        var pFR = board.create('point', FR, { visible: false, name: '', fixed: true });
        var pBR = board.create('point', BR, { visible: false, name: '', fixed: true });
        var pBL = board.create('point', BL, { visible: false, name: '', fixed: true });
        var pApex = board.create('point', apex, { visible: false, name: '', fixed: true });
        var pMid = board.create('point', midFront, { visible: false, name: '', fixed: true });

        // Hidden (back) base edges — dashed
        board.create('segment', [pBL, pBR], {
            strokeColor: '#999999', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [pBL, pFL], {
            strokeColor: '#999999', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [pBR, pFR], {
            strokeColor: '#999999', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // Hidden lateral edges (back) — dashed
        board.create('segment', [pApex, pBL], {
            strokeColor: '#999999', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [pApex, pBR], {
            strokeColor: '#999999', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // Visible front base edge — solid
        board.create('segment', [pFL, pFR], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Visible lateral edges (front) — solid
        board.create('segment', [pApex, pFL], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [pApex, pFR], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Slant height x — dashed from apex to midpoint of front edge
        board.create('segment', [pApex, pMid], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Congruence ticks on both halves of front edge
        var tickSize = 0.25;
        var tickL_x = (FL[0] + midFront[0]) / 2;
        board.create('segment', [[tickL_x - 0.1, -tickSize], [tickL_x + 0.1, tickSize]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        var tickR_x = (midFront[0] + FR[0]) / 2;
        board.create('segment', [[tickR_x - 0.1, -tickSize], [tickR_x + 0.1, tickSize]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Right-angle marker at midpoint of front edge
        var raSize = 0.45;
        board.create('segment', [[midFront[0] + raSize, midFront[1]], [midFront[0] + raSize, midFront[1] + raSize]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[midFront[0] + raSize, midFront[1] + raSize], [midFront[0], midFront[1] + raSize]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Small dot at midpoint
        board.create('point', midFront, {
            name: '', size: 1.5, color: '#555555', fixed: true, highlight: false
        });

        // Labels
        // Base edge: "14 ft"
        board.create('text', [0, -1.0, '14 \\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Slant edge: "25 ft"
        var slantMidX = (apex[0] + FR[0]) / 2 + 0.6;
        var slantMidY = (apex[1] + FR[1]) / 2 + 0.1;
        board.create('text', [slantMidX, slantMidY, '25 \\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Slant height: "x"
        var shMidX = (apex[0] + midFront[0]) / 2 - 0.7;
        var shMidY = (apex[1] + midFront[1]) / 2;
        board.create('text', [shMidX, shMidY, 'x'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'right', anchorY: 'middle',
            cssStyle: 'font-style: italic;',
            fixed: true, highlight: false
        });

        // Half-base: "7 ft"
        var halfMidX = (midFront[0] + FR[0]) / 2;
        board.create('text', [halfMidX, -0.55, '7 \\text{ ft}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
