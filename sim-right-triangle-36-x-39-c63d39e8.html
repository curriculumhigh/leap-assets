<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 15.5, 14, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices (hidden)
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [10, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [0, 12], { visible: false, fixed: true, name: '' });

        // Triangle polygon — dark border, no fill
        board.create('polygon', [A, B, C], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true
        });

        // Right-angle marker at A (small square)
        var sqSize = 1.0;
        var raPt1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var raPt2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var raPt3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });

        board.create('polygon', [A, raPt1, raPt2, raPt3], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true
        });

        // Label: '36' to the left of segment AC (vertical leg)
        board.create('text', [-1.6, 6, '36'], {
            fontSize: 16,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        // Label: 'x' below segment AB (horizontal base)
        board.create('text', [5, -1.5, function() { return 'x'; }], {
            fontSize: 16,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            cssStyle: 'font-style: italic;',
            fixed: true,
            highlight: false
        });

        // Label: '39' along the hypotenuse BC, offset outward
        board.create('text', [6.2, 7.2, '39'], {
            fontSize: 16,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
