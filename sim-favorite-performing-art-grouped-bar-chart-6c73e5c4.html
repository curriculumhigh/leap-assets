<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Performing Art — Grouped Bar Chart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 600px; margin: 0; padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px;
            height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 58, 10.5, -8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_JUNIORS = '#2563EB';
        var COL_SENIORS = '#D97706';
        var COL_GRID = '#D1D5DB';
        var COL_AXIS = '#444444';

        // ── Data ────────────────────────────────────────────────────────
        var categories = ['Art', 'Music', 'Drama'];
        var juniors = [35, 20, 40];
        var seniors = [20, 45, 30];

        // ── Layout constants ────────────────────────────────────────────
        var groupCenters = [2.2, 5.2, 8.2];
        var barWidth = 0.7;
        var barGap = 0.15;

        // ── Y-axis (plain line, no arrow) ───────────────────────────────
        board.create('segment', [[0, 0], [0, 53]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // ── X-axis baseline ─────────────────────────────────────────────
        board.create('segment', [[0, 0], [10, 0]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // ── Horizontal dashed gridlines at every 5 ─────────────────────
        var i, yVal;
        for (i = 0; i <= 10; i++) {
            yVal = i * 5;
            if (yVal === 0) continue; // skip baseline
            board.create('segment', [[0, yVal], [10, yVal]], {
                strokeColor: COL_GRID, strokeWidth: 0.6,
                dash: 2, fixed: true, highlight: false
            });
        }

        // ── Y-axis tick marks and labels ────────────────────────────────
        for (i = 0; i <= 10; i++) {
            yVal = i * 5;
            // Tick mark
            board.create('segment', [[-0.2, yVal], [0, yVal]], {
                strokeColor: COL_AXIS, strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [-0.4, yVal, String(yVal)], {
                fontSize: 11, color: '#333', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Y-axis title ────────────────────────────────────────────────
        board.create('text', [-1.5, 25, '<span style="writing-mode:vertical-rl; transform:rotate(180deg); font-size:13px; font-weight:600; color:#333;">Number of Students</span>'], {
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // ── Chart title ─────────────────────────────────────────────────
        board.create('text', [5.1, 55.5, '<b style="font-size:15px; color:#222;">Favorite Performing Art</b>'], {
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // ── Helper: draw a filled bar ───────────────────────────────────
        function drawBar(xCenter, height, color) {
            var x1 = xCenter - barWidth / 2;
            var x2 = xCenter + barWidth / 2;
            var pts = [
                board.create('point', [x1, 0], { visible: false, fixed: true, name: '' }),
                board.create('point', [x2, 0], { visible: false, fixed: true, name: '' }),
                board.create('point', [x2, height], { visible: false, fixed: true, name: '' }),
                board.create('point', [x1, height], { visible: false, fixed: true, name: '' })
            ];
            board.create('polygon', pts, {
                fillColor: color, fillOpacity: 0.85,
                borders: { strokeColor: color, strokeWidth: 1.2 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });
        }

        // ── Draw bars ───────────────────────────────────────────────────
        var g, xJunior, xSenior;
        for (g = 0; g < categories.length; g++) {
            xJunior = groupCenters[g] - barGap / 2 - barWidth / 2;
            xSenior = groupCenters[g] + barGap / 2 + barWidth / 2;

            drawBar(xJunior, juniors[g], COL_JUNIORS);
            drawBar(xSenior, seniors[g], COL_SENIORS);
        }

        // ── Category labels ─────────────────────────────────────────────
        for (g = 0; g < categories.length; g++) {
            board.create('text', [groupCenters[g], -2.5, categories[g]], {
                fontSize: 13, color: '#333', fontWeight: 600,
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Legend (top-right) ──────────────────────────────────────────
        var legX = 7.8;
        var legY = 52;
        var legSize = 0.6;

        // Juniors swatch
        var jLegPts = [
            board.create('point', [legX, legY], { visible: false, fixed: true, name: '' }),
            board.create('point', [legX + legSize, legY], { visible: false, fixed: true, name: '' }),
            board.create('point', [legX + legSize, legY - legSize], { visible: false, fixed: true, name: '' }),
            board.create('point', [legX, legY - legSize], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', jLegPts, {
            fillColor: COL_JUNIORS, fillOpacity: 0.85,
            borders: { strokeColor: COL_JUNIORS, strokeWidth: 1 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });
        board.create('text', [legX + legSize + 0.3, legY - legSize / 2, 'Juniors'], {
            fontSize: 12, color: '#333', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Seniors swatch
        var sLegY = legY - 1.8;
        var sLegPts = [
            board.create('point', [legX, sLegY], { visible: false, fixed: true, name: '' }),
            board.create('point', [legX + legSize, sLegY], { visible: false, fixed: true, name: '' }),
            board.create('point', [legX + legSize, sLegY - legSize], { visible: false, fixed: true, name: '' }),
            board.create('point', [legX, sLegY - legSize], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', sLegPts, {
            fillColor: COL_SENIORS, fillOpacity: 0.85,
            borders: { strokeColor: COL_SENIORS, strokeWidth: 1 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });
        board.create('text', [legX + legSize + 0.3, sLegY - legSize / 2, 'Seniors'], {
            fontSize: 12, color: '#333', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
