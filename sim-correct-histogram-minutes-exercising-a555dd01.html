<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correct Histogram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [4, 9.8, 112, -3.6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BAR_FILL = '#2563EB';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        // Data: [leftEdge, rightEdge, height]
        var bars = [
            [20, 30, 3],
            [30, 40, 7],
            [40, 50, 4],
            [50, 60, 1],
            [60, 70, 2],
            [70, 80, 1],
            [80, 100, 2]
        ];

        // Interval labels centered under each bar
        var intervalLabels = [
            '20\u201329', '30\u201339', '40\u201349', '50\u201359',
            '60\u201369', '70\u201379', '80\u201399'
        ];

        // \u2500\u2500 Horizontal grid lines at y = 1 through 8 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        for (var g = 1; g <= 8; g++) {
            board.create('segment', [[20, g], [100, g]], {
                strokeColor: GRID_COL, strokeWidth: 0.4, fixed: true, highlight: false, layer: 0
            });
        }

        // \u2500\u2500 Bars \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        for (var i = 0; i < bars.length; i++) {
            var x1 = bars[i][0];
            var x2 = bars[i][1];
            var h = bars[i][2];

            var p1 = board.create('point', [x1, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x2, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x2, h], { visible: false, name: '' });
            var p4 = board.create('point', [x1, h], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.9,
                borders: { strokeColor: BAR_FILL, strokeWidth: 0.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false,
                layer: 5
            });
        }

        // \u2500\u2500 Axes (plain lines, no arrows) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        board.create('segment', [[20, 0], [100, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false, layer: 7
        });
        board.create('segment', [[20, 0], [20, 8.5]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false, layer: 7
        });

        // \u2500\u2500 Y-axis ticks & labels (0\u20138, step 1) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        for (var y = 0; y <= 8; y++) {
            board.create('segment', [[19, y], [20, y]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
            board.create('text', [17.5, y, String(y)], {
                fontSize: 9, anchorX: 'right', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        // \u2500\u2500 X-axis tick marks at bar boundaries \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        var xBoundaries = [20, 30, 40, 50, 60, 70, 80, 100];
        for (var t = 0; t < xBoundaries.length; t++) {
            board.create('segment', [[xBoundaries[t], -0.25], [xBoundaries[t], 0]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
        }

        // \u2500\u2500 X-axis interval labels (centered under each bar) \u2500\u2500\u2500\u2500\u2500
        for (var k = 0; k < bars.length; k++) {
            var midX = (bars[k][0] + bars[k][1]) / 2;
            board.create('text', [midX, -1.0, intervalLabels[k]], {
                fontSize: 8, anchorX: 'middle', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        // \u2500\u2500 Axis title: "Minutes exercising" \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        board.create('text', [60, -2.4, '\\textit{Minutes exercising}'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false, useKatex: true
        });

        // \u2500\u2500 Axis title: "Frequency" (rotated) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        board.create('text', [10, 4, '\\textit{Frequency}'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false, useKatex: true,
            rotate: 90
        });
    </script>
</body>
</html>
