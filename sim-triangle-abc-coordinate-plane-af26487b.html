<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle ABC on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 6, 8, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 2.0,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 1.5,
                        majorHeight: 10,
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: true,
                        label: { fontSize: 11, offset: [0, -12] }
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 2.0,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 1.5,
                        majorHeight: 10,
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawLabels: true,
                        label: { fontSize: 11, offset: [-12, 0] }
                    }
                }
            },
            grid: false
        });

        // Major gridlines at every unit — drawn manually for full visibility
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]);
        var xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]);
        var yMax = Math.floor(bb[1]);

        // Vertical gridlines
        for (var x = xMin; x <= xMax; x++) {
            if (x === 0) continue;
            board.create('line', [[x, 0], [x, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.6,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        // Horizontal gridlines
        for (var y = yMin; y <= yMax; y++) {
            if (y === 0) continue;
            board.create('line', [[0, y], [1, y]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.6,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Axis labels
        board.create('text', [7.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 5.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var A = board.create('point', [-3, 4], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var B = board.create('point', [5, -2], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var C = board.create('point', [-3, -2], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Triangle polygon
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#2563EB', strokeWidth: 2.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Labels (KaTeX)
        board.create('text', [-3.3, 4.5, 'A(-3, 4)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false, anchorX: 'right'
        });
        board.create('text', [5.3, -2, 'B(5, -2)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [-3.3, -2.6, 'C(-3, -2)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false, anchorX: 'right'
        });
    </script>
</body>
</html>
