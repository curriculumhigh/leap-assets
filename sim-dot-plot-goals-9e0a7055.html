<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Plot — Goals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 3.6, 10.8, -1.4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Number line (bounded segment, no arrows) ────────────────────
        board.create('segment', [[0, 0], [10, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // ── Tick marks and labels at every integer 0–10 ────────────────
        var TICK_HALF = 0.12;
        var i;
        for (i = 0; i <= 10; i++) {
            // Tick mark
            board.create('segment', [[i, -TICK_HALF], [i, TICK_HALF]], {
                strokeColor: '#444444',
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            // Tick label
            board.create('text', [i, -0.38, String(i)], {
                fontSize: 12,
                anchorX: 'middle',
                anchorY: 'middle',
                color: '#333333',
                fixed: true,
                highlight: false
            });
        }

        // ── Axis label "Goals" centered below ──────────────────────────
        board.create('text', [5, -0.9, '\\textit{Goals}'], {
            fontSize: 14,
            anchorX: 'middle',
            anchorY: 'middle',
            color: '#333333',
            useKatex: true,
            fixed: true,
            highlight: false
        });

        // ── Dot data ───────────────────────────────────────────────────
        var dotData = [
            { x: 1, count: 2 },
            { x: 2, count: 3 },
            { x: 3, count: 5 },
            { x: 4, count: 4 },
            { x: 5, count: 3 },
            { x: 6, count: 2 },
            { x: 9, count: 1 }
        ];

        var DOT_COLOR = '#2563EB';
        var DOT_SIZE = 3.5;
        var BASE_Y = 0.35;
        var SPACING = 0.45;

        for (var d = 0; d < dotData.length; d++) {
            var xVal = dotData[d].x;
            var count = dotData[d].count;
            for (var j = 0; j < count; j++) {
                board.create('point', [xVal, BASE_Y + j * SPACING], {
                    name: '',
                    size: DOT_SIZE,
                    color: DOT_COLOR,
                    strokeColor: DOT_COLOR,
                    fixed: true,
                    highlight: false,
                    showInfobox: false
                });
            }
        }
    </script>
</body>
</html>
