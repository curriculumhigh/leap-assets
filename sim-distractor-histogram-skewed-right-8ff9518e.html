<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor Histogram — Skewed Right</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 45, 79, -11],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#ffffff';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        var intervals = [0, 10, 20, 30, 40, 50, 60, 70];
        var heights = [32, 38, 27, 18, 11, 6, 3];
        var labels = ['0\u20139', '10\u201319', '20\u201329', '30\u201339', '40\u201349', '50\u201359', '60\u201369'];

        // ── Horizontal grid lines at y = 5, 10, 15, …, 40 ──────────────
        for (var g = 5; g <= 40; g += 5) {
            board.create('segment', [[0, g], [70, g]], {
                strokeColor: GRID_COL, strokeWidth: 0.4, fixed: true, highlight: false, layer: 0
            });
        }

        // ── Bars ────────────────────────────────────────────────────────
        for (var i = 0; i < heights.length; i++) {
            var x1 = intervals[i];
            var x2 = intervals[i + 1];
            var h = heights[i];

            var p1 = board.create('point', [x1, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x2, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x2, h], { visible: false, name: '' });
            var p4 = board.create('point', [x1, h], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.9,
                borders: { strokeColor: BAR_STROKE, strokeWidth: 0.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false,
                layer: 5
            });
        }

        // ── Axes (plain segments, no arrows) ────────────────────────────
        board.create('segment', [[0, 0], [74, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false, layer: 7
        });
        board.create('segment', [[0, 0], [0, 43]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false, layer: 7
        });

        // ── X-axis: centered range labels under each bar ────────────────
        for (var j = 0; j < labels.length; j++) {
            var midX = intervals[j] + 5;
            board.create('text', [midX, -2.8, labels[j]], {
                fontSize: 7, anchorX: 'middle', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        // ── Y-axis tick marks & labels at 0, 5, 10, …, 40 ─────────────
        for (var y = 0; y <= 40; y += 5) {
            board.create('segment', [[-0.8, y], [0.8, y]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
            board.create('text', [-2.5, y, String(y)], {
                fontSize: 9, anchorX: 'right', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        // ── Axis title: "Minutes exercising" ────────────────────────────
        board.create('text', [35, -7.2, 'Minutes exercising'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false,
            cssStyle: 'font-style:italic'
        });

        // ── Axis title: "Frequency" (rotated) ──────────────────────────
        board.create('text', [-10.5, 20, 'Frequency'], {
            fontSize: 9, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false,
            cssStyle: 'font-style:italic',
            rotate: 90
        });
    </script>
</body>
</html>
