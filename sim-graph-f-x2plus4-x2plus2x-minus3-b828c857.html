<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of f(x) = (x²+4)(x²+2x−3)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 60, 4.5, -25],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.1, -1.8, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 58, 'y'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // f(x) = (x^2 + 4)(x^2 + 2x - 3)
        function f(x) {
            return (x * x + 4) * (x * x + 2 * x - 3);
        }

        // Primary curve
        board.create('functiongraph', [f, -5.5, 4.5], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // x-intercepts
        var ptNeg3 = board.create('point', [-3, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var pt1 = board.create('point', [1, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels — offset to avoid tick overlap
        board.create('text', [-3, -3.5, '(-3,\\, 0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });
        board.create('text', [1, -3.5, '(1,\\, 0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', fixed: true, highlight: false
        });

        // Function label — name only
        board.create('text', [-4.8, 45, 'f(x)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
