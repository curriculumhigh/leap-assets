<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle JKL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 6.5, 4.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var J = board.create('point', [0, 5], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var K = board.create('point', [-3, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var L = board.create('point', [3, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });

        // ── Triangle (no fill) ──────────────────────────────────────────
        board.create('polygon', [J, K, L], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [0, 5.55, 'J'], {
            anchorX: 'middle', anchorY: 'bottom',
            fontSize: 15, color: '#222222', cssStyle: 'font-weight:bold;font-style:italic',
            fixed: true, highlight: false
        });
        board.create('text', [-3.45, -0.15, 'K'], {
            anchorX: 'right', anchorY: 'top',
            fontSize: 15, color: '#222222', cssStyle: 'font-weight:bold;font-style:italic',
            fixed: true, highlight: false
        });
        board.create('text', [3.45, -0.15, 'L'], {
            anchorX: 'left', anchorY: 'top',
            fontSize: 15, color: '#222222', cssStyle: 'font-weight:bold;font-style:italic',
            fixed: true, highlight: false
        });

        // ── Side labels (KaTeX) ─────────────────────────────────────────
        // JK side — "5y + 2" on the left, offset outward
        board.create('text', [-2.3, 2.8, '5y + 2'], {
            anchorX: 'right', anchorY: 'middle',
            fontSize: 13, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });

        // JL side — "32" on the right, offset outward
        board.create('text', [2.3, 2.8, '32'], {
            anchorX: 'left', anchorY: 'middle',
            fontSize: 13, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });

        // ── Congruence tick marks on JK and JL ──────────────────────────
        function drawTick(ax, ay, bx, by) {
            var mx = (ax + bx) / 2;
            var my = (ay + by) / 2;
            var dx = bx - ax;
            var dy = by - ay;
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var half = 0.25;
            board.create('segment', [
                [mx - px * half, my - py * half],
                [mx + px * half, my + py * half]
            ], {
                strokeColor: '#DC2626', strokeWidth: 2.0, fixed: true, highlight: false
            });
        }

        drawTick(0, 5, -3, 0);
        drawTick(0, 5, 3, 0);

        // ── Angle arcs and labels ───────────────────────────────────────
        board.create('nonReflexAngle', [J, K, L], {
            radius: 0.7,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var dKJ_x = (0 - (-3));
        var dKJ_y = (5 - 0);
        var lenKJ = Math.sqrt(dKJ_x * dKJ_x + dKJ_y * dKJ_y);
        var dKL_x = (3 - (-3));
        var dKL_y = (0 - 0);
        var lenKL = Math.sqrt(dKL_x * dKL_x + dKL_y * dKL_y);
        var bisK_x = dKJ_x / lenKJ + dKL_x / lenKL;
        var bisK_y = dKJ_y / lenKJ + dKL_y / lenKL;
        var bisK_len = Math.sqrt(bisK_x * bisK_x + bisK_y * bisK_y);
        board.create('text', [-3 + bisK_x / bisK_len * 1.4, 0 + bisK_y / bisK_len * 1.4, 'x^\\circ'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });

        board.create('nonReflexAngle', [K, L, J], {
            radius: 0.7,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var dLK_x = (-3 - 3);
        var dLK_y = (0 - 0);
        var lenLK = Math.sqrt(dLK_x * dLK_x + dLK_y * dLK_y);
        var dLJ_x = (0 - 3);
        var dLJ_y = (5 - 0);
        var lenLJ = Math.sqrt(dLJ_x * dLJ_x + dLJ_y * dLJ_y);
        var bisL_x = dLK_x / lenLK + dLJ_x / lenLJ;
        var bisL_y = dLK_y / lenLK + dLJ_y / lenLJ;
        var bisL_len = Math.sqrt(bisL_x * bisL_x + bisL_y * bisL_y);
        board.create('text', [3 + bisL_x / bisL_len * 1.4, 0 + bisL_y / bisL_len * 1.4, '54^\\circ'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
