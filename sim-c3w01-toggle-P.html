<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Grid — Point P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { width: 450px; height: 450px; margin: 0; padding: 0; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; width: calc(100% - 20px); height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.5, 8.5, 8.5, -8.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var GRID_COL = '#D1D5DB';
        var GRID_W = 0.4;
        var R_MAX = 6;
        var i, angle, x2, y2;

        // ── Concentric circles r = 1..6
        for (i = 1; i <= R_MAX; i++) {
            board.create('circle', [[0, 0], i], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fillColor: 'none', fixed: true, highlight: false
            });
        }

        // ── Radial rays every pi/12 (24 rays)
        for (i = 0; i < 24; i++) {
            angle = i * Math.PI / 12;
            x2 = R_MAX * Math.cos(angle);
            y2 = R_MAX * Math.sin(angle);
            board.create('segment', [[0, 0], [x2, y2]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false
            });
        }

        // ── Polar axis arrow
        board.create('arrow', [[0, 0], [7.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.0,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // ── Polar axis label
        board.create('text', [7.4, 0.5, '<i>polar axis</i>'], {
            fontSize: 11, color: '#444444', fixed: true, highlight: false, anchorX: 'right'
        });

        // ── Pole
        board.create('point', [0, 0], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [-0.55, -0.55, 'O'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        // ── r-ring numbers 1..6 BELOW the polar axis
        for (i = 1; i <= R_MAX; i++) {
            board.create('text', [i, -0.5, String(i)], {
                fontSize: 10, color: '#666666', fixed: true, highlight: false,
                anchorX: 'middle', anchorY: 'top'
            });
        }

        // ── Angle labels
        var LABEL_R = 7.1;
        var angleLabels = [
            { theta: Math.PI / 6,       tex: '\\tfrac{\\pi}{6}' },
            { theta: Math.PI / 4,       tex: '\\tfrac{\\pi}{4}' },
            { theta: Math.PI / 3,       tex: '\\tfrac{\\pi}{3}' },
            { theta: Math.PI / 2,       tex: '\\tfrac{\\pi}{2}' },
            { theta: 2 * Math.PI / 3,   tex: '\\tfrac{2\\pi}{3}' },
            { theta: 3 * Math.PI / 4,   tex: '\\tfrac{3\\pi}{4}' },
            { theta: 5 * Math.PI / 6,   tex: '\\tfrac{5\\pi}{6}' },
            { theta: Math.PI,           tex: '\\pi' },
            { theta: 7 * Math.PI / 6,   tex: '\\tfrac{7\\pi}{6}' },
            { theta: 5 * Math.PI / 4,   tex: '\\tfrac{5\\pi}{4}' },
            { theta: 4 * Math.PI / 3,   tex: '\\tfrac{4\\pi}{3}' },
            { theta: 3 * Math.PI / 2,   tex: '\\tfrac{3\\pi}{2}' },
            { theta: 5 * Math.PI / 3,   tex: '\\tfrac{5\\pi}{3}' },
            { theta: 7 * Math.PI / 4,   tex: '\\tfrac{7\\pi}{4}' },
            { theta: 11 * Math.PI / 6,  tex: '\\tfrac{11\\pi}{6}' }
        ];

        for (i = 0; i < angleLabels.length; i++) {
            var a = angleLabels[i];
            var lx = LABEL_R * Math.cos(a.theta);
            var ly = LABEL_R * Math.sin(a.theta);
            board.create('text', [lx, ly, a.tex], {
                fontSize: 11, color: '#555555', fixed: true, highlight: false,
                anchorX: 'middle', anchorY: 'middle', useKatex: true
            });
        }

        // ── Point P at (r=4, theta=pi/3)
        var P_THETA = Math.PI / 3;
        var P_R = 4;
        var px = P_R * Math.cos(P_THETA); // 2
        var py = P_R * Math.sin(P_THETA); // 2*sqrt(3) ≈ 3.464

        // Blue ray from O to P
        board.create('segment', [[0, 0], [px, py]], {
            strokeColor: '#3B82F6', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // Red point
        board.create('point', [px, py], {
            name: '', size: 5, color: '#DC2626', fixed: true, highlight: false
        });

        // Point label
        board.create('text', [px + 0.45, py + 0.45, 'P'], {
            fontSize: 13, color: '#DC2626', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        // ── Overlay elements (rectangular grid + triangle) — initially hidden
        var overlayElements = [];

        // Rectangular grid lines (x = -6..6, y = -6..6)
        for (i = -6; i <= 6; i++) {
            var vLine = board.create('segment', [[i, -6], [i, 6]], {
                strokeColor: '#e5e7eb', strokeWidth: 0.5,
                fixed: true, highlight: false, visible: false
            });
            overlayElements.push(vLine);
            var hLine = board.create('segment', [[-6, i], [6, i]], {
                strokeColor: '#e5e7eb', strokeWidth: 0.5,
                fixed: true, highlight: false, visible: false
            });
            overlayElements.push(hLine);
        }

        // Right triangle: O → M (foot on x-axis) → P
        // M is the foot at (px, 0) = (2, 0)
        var mx = px; // 2
        var my = 0;

        // Horizontal leg O → M (red dashed)
        var legH = board.create('segment', [[0, 0], [mx, my]], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2,
            fixed: true, highlight: false, visible: false
        });
        overlayElements.push(legH);

        // Vertical leg M → P (red dashed)
        var legV = board.create('segment', [[mx, my], [px, py]], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2,
            fixed: true, highlight: false, visible: false
        });
        overlayElements.push(legV);

        // Right-angle square at M
        var sqSize = 0.35;
        var raSeg1 = board.create('segment', [[mx, my], [mx, my + sqSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.0,
            fixed: true, highlight: false, visible: false
        });
        overlayElements.push(raSeg1);
        var raSeg2 = board.create('segment', [[mx, my + sqSize], [mx - sqSize, my + sqSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.0,
            fixed: true, highlight: false, visible: false
        });
        overlayElements.push(raSeg2);
        var raSeg3 = board.create('segment', [[mx - sqSize, my + sqSize], [mx - sqSize, my]], {
            strokeColor: '#DC2626', strokeWidth: 1.0,
            fixed: true, highlight: false, visible: false
        });
        overlayElements.push(raSeg3);

        // x-leg label: 'x' — placed below the horizontal leg
        var lblX = board.create('text', [mx / 2, -0.7, 'x'], {
            fontSize: 12, color: '#DC2626', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'top', useKatex: true, visible: false
        });
        overlayElements.push(lblX);

        // y-leg label: 'y' — placed to the right of the vertical leg
        var lblY = board.create('text', [mx + 0.5, py / 2, 'y'], {
            fontSize: 12, color: '#DC2626', fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'middle', useKatex: true, visible: false
        });
        overlayElements.push(lblY);

        // ── Checkbox (JSXGraph)
        var checkbox = board.create('checkbox', [-7.8, 7.8, 'Show rectangular grid & triangle'], {
            fontSize: 11, fixed: true, highlight: false
        });

        checkbox.rendNodeCheckbox.addEventListener('change', function() {
            var show = checkbox.Value();
            for (var j = 0; j < overlayElements.length; j++) {
                overlayElements[j].setAttribute({ visible: show });
            }
        });
    </script>
</body>
</html>
