<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Alternating Sequence</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 11, 7.5, -6.8],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // X-axis
        board.create('arrow', [[-1.0, 0], [7.3, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // Y-axis
        board.create('arrow', [[0, -6.5], [0, 10.7]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // X-axis ticks (every 1 unit, labeled)
        var tickLen = 0.15;
        for (var xi = 1; xi <= 7; xi++) {
            board.create('segment', [[xi, -tickLen], [xi, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [xi, -0.6, String(xi)], {
                fontSize: 9, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Y-axis ticks (every 0.25 units, labeled every 2 units)
        var yMin = -6;
        var yMax = 10;
        var step = 0.25;
        var labelEvery = 2;

        for (var yv = yMin; yv <= yMax; yv = Math.round((yv + step) * 100) / 100) {
            if (Math.abs(yv) < 0.001) continue;

            board.create('segment', [[-tickLen, yv], [tickLen, yv]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });

            var rounded = Math.round(yv * 100) / 100;
            if (Math.abs(rounded % labelEvery) < 0.001 && Math.abs(rounded) > 0.001) {
                board.create('text', [-0.25, yv, String(Math.round(rounded))], {
                    fontSize: 9, color: '#444444', anchorX: 'right', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // Axis labels
        board.create('text', [7.0, -0.55, 'n'], { useKatex: true, fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.25, 10.4, 'a_n'], { useKatex: true, fontSize: 11, fixed: true, highlight: false });

        // Data points (no coordinate labels)
        var pts = [
            [1, 8],
            [2, -4],
            [3, 2],
            [4, -1],
            [5, 0.5],
            [6, -0.25]
        ];

        for (var i = 0; i < pts.length; i++) {
            board.create('point', [pts[i][0], pts[i][1]], {
                name: '', size: 4, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
