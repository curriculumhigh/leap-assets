<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle with Altitude</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7, 8.5, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [1, 0.5], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [7, 0.5], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [4, 5.5], { visible: false, fixed: true, name: '' });

        // Foot of altitude (on base, directly below apex)
        var F = board.create('point', [4, 0.5], { visible: false, fixed: true, name: '' });

        // Triangle sides
        board.create('segment', [A, B], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });
        board.create('segment', [A, C], { strokeColor: '#222222', strokeWidth: 2, fixed: true, highlight: false });

        // Altitude (dashed)
        board.create('segment', [C, F], { strokeColor: '#222222', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false });

        // Right-angle marker at F
        var sqSize = 0.35;
        var sq1 = board.create('point', [F.X() + sqSize, F.Y()], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [F.X() + sqSize, F.Y() + sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [F.X(), F.Y() + sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], { strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false });

        // Label: base (centered below)
        board.create('text', [4, -0.4, '(x + 3) \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Label: altitude (inside the triangle, to the left of the dashed line)
        board.create('text', [2.9, 3.0, '(2x - 4) \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
