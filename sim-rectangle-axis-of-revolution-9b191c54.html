<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle with Axis of Revolution</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 13.5, 10, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Rectangle corners: left side on x=0, bottom at y=0, top at y=10, right at x=6
        var BL = [0, 0];
        var BR = [6, 0];
        var TR = [6, 10];
        var TL = [0, 10];

        // Rectangle edges
        board.create('segment', [BL, BR], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [BR, TR], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [TR, TL], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        // Dashed axis of revolution — extends beyond rectangle top and bottom
        board.create('segment', [[0, -1.2], [0, 12.2]], {
            strokeColor: '#444444', strokeWidth: 1.5, dash: 2,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Right-angle marks at all four corners
        var RA = 0.55;

        function drawRightAngle(corner, dir1, dir2) {
            var p1 = [corner[0] + RA * dir1[0], corner[1] + RA * dir1[1]];
            var p2 = [corner[0] + RA * dir1[0] + RA * dir2[0], corner[1] + RA * dir1[1] + RA * dir2[1]];
            var p3 = [corner[0] + RA * dir2[0], corner[1] + RA * dir2[1]];
            board.create('segment', [p1, p2], {
                strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
            });
            board.create('segment', [p2, p3], {
                strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        drawRightAngle(BL, [1, 0], [0, 1]);
        drawRightAngle(BR, [-1, 0], [0, 1]);
        drawRightAngle(TR, [-1, 0], [0, -1]);
        drawRightAngle(TL, [1, 0], [0, -1]);

        // Dimension labels
        board.create('text', [3, 10.8, '6'], {
            fontSize: 15, color: '#222222', useKatex: true,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [7, 5, '10'], {
            fontSize: 15, color: '#222222', useKatex: true,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
