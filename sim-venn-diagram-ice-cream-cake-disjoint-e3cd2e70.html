<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diagram — Ice Cream and Cake (Disjoint)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.3, 5.7, 10.7, -1.3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Universal set rectangle
        var rectP1 = board.create('point', [0.5, 0], { visible: false, fixed: true, name: '' });
        var rectP2 = board.create('point', [9.5, 0], { visible: false, fixed: true, name: '' });
        var rectP3 = board.create('point', [9.5, 5], { visible: false, fixed: true, name: '' });
        var rectP4 = board.create('point', [0.5, 5], { visible: false, fixed: true, name: '' });
        board.create('polygon', [rectP1, rectP2, rectP3, rectP4], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.8 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Ice Cream circle (left) — disjoint, no overlap
        var icCenter = board.create('point', [3.2, 2.5], { visible: false, fixed: true, name: '' });
        board.create('circle', [icCenter, 1.7], {
            strokeColor: '#2563EB', strokeWidth: 1.5,
            fillColor: '#2563EB', fillOpacity: 0.15,
            fixed: true, highlight: false
        });

        // Cake circle (right) — disjoint, no overlap
        var cakeCenter = board.create('point', [7.0, 2.5], { visible: false, fixed: true, name: '' });
        board.create('circle', [cakeCenter, 1.7], {
            strokeColor: '#059669', strokeWidth: 1.5,
            fillColor: '#059669', fillOpacity: 0.15,
            fixed: true, highlight: false
        });

        // Labels — category names (above circles)
        board.create('text', [3.2, 4.5, 'Ice Cream'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 12, color: '#2563EB', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });
        board.create('text', [7.0, 4.5, 'Cake'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 12, color: '#059669', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        // Labels — counts (centered in circles)
        board.create('text', [3.2, 2.5, '400'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#2563EB', cssStyle: 'font-weight:700',
            fixed: true, highlight: false
        });
        board.create('text', [7.0, 2.5, '500'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#059669', cssStyle: 'font-weight:700',
            fixed: true, highlight: false
        });

        // Outside region label
        board.create('text', [8.6, 0.5, '100'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 12, color: '#555555', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        // Total label (top-right corner, inside rectangle)
        board.create('text', [9.3, 4.7, 'Total = 1000'], {
            anchorX: 'right', anchorY: 'middle',
            fontSize: 10, color: '#222222', cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
