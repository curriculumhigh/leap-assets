<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Rays from Point R</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 4.8, 5.5, -4.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var angP = 145 * Math.PI / 180;
        var angQ = 185 * Math.PI / 180;
        var angT = 235 * Math.PI / 180;
        var angS = 275 * Math.PI / 180;

        var RAY_LEN = 4.2;
        var LABEL_R = RAY_LEN + 0.55;
        var SQ = 0.45;

        board.create('point', [0, 0], {
            name: '', fixed: true, size: 2.5, color: '#222222', highlight: false
        });

        board.create('text', [0.35, -0.4, 'R'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });

        function makeRay(ang) {
            var ex = RAY_LEN * Math.cos(ang);
            var ey = RAY_LEN * Math.sin(ang);
            board.create('segment', [[0, 0], [ex, ey]], {
                strokeColor: '#555555', strokeWidth: 1.5,
                fixed: true, highlight: false
            });
        }

        function labelPt(ang, letter) {
            var lx = LABEL_R * Math.cos(ang);
            var ly = LABEL_R * Math.sin(ang);
            board.create('text', [lx, ly, letter], {
                useKatex: true, fontSize: 15, color: '#222222',
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        function drawRightAngle(ang1, ang2) {
            var ux1 = Math.cos(ang1), uy1 = Math.sin(ang1);
            var ux2 = Math.cos(ang2), uy2 = Math.sin(ang2);

            var a = [SQ * ux1, SQ * uy1];
            var b = [SQ * ux1 + SQ * ux2, SQ * uy1 + SQ * uy2];
            var c = [SQ * ux2, SQ * uy2];

            board.create('segment', [a, b], {
                strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('segment', [b, c], {
                strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
            });
        }

        makeRay(angP);
        makeRay(angQ);
        makeRay(angT);
        makeRay(angS);

        labelPt(angP, 'P');
        labelPt(angQ, 'Q');
        labelPt(angT, 'T');
        labelPt(angS, 'S');

        drawRightAngle(angP, angT);
        drawRightAngle(angQ, angS);

    </script>
</body>
</html>
