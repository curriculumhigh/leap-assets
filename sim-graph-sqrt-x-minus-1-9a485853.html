<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of sqrt(x-1)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 4.2, 6.9, -1.2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid ────────────────────────────────────────────────────────
        var gridColor = '#D1D5DB';
        var gridWidth = 0.4;
        var i;

        for (i = -1; i <= 6; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: gridColor, strokeWidth: gridWidth,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }
        for (i = -1; i <= 4; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: gridColor, strokeWidth: gridWidth,
                fixed: true, highlight: false,
                straightFirst: true, straightLast: true
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        board.create('arrow', [[-1.0, 0], [6.7, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        board.create('arrow', [[0, -1.0], [0, 4.0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // ── Tick labels (no tick marks) ─────────────────────────────────
        var tickFontSize = 9;
        var tickColor = '#444444';

        for (i = 1; i <= 6; i++) {
            board.create('text', [i, -0.3, String(i)], {
                fontSize: tickFontSize, color: tickColor,
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        for (i = 1; i <= 3; i++) {
            board.create('text', [-0.3, i, String(i)], {
                fontSize: tickFontSize, color: tickColor,
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        board.create('text', [-0.3, -0.3, '0'], {
            fontSize: tickFontSize, color: tickColor,
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Axis labels ─────────────────────────────────────────────────
        board.create('text', [6.4, -0.5, '<i>x</i>'], {
            fontSize: 11, color: '#444444',
            fixed: true, highlight: false
        });
        board.create('text', [0.18, 3.8, '<i>y</i>'], {
            fontSize: 11, color: '#444444',
            fixed: true, highlight: false
        });

        // ── Curve: f(x) = sqrt(x - 1) ──────────────────────────────────
        board.create('functiongraph', [
            function(x) { return Math.sqrt(x - 1); },
            1, 7
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
