<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line — Favorable Minutes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 5.5, 23, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var BLUE = '#2563EB';
        var DARK = '#444444';
        var Y_LINE = 1.0;
        var Y_LABELS = Y_LINE - 0.75;

        // ── Highlighted (shaded) segment 8→20 ──────────────────────────
        var bandH = 0.45;
        board.create('polygon', [
            [8, Y_LINE - bandH],
            [20, Y_LINE - bandH],
            [20, Y_LINE + bandH],
            [8, Y_LINE + bandH]
        ], {
            fillColor: BLUE, fillOpacity: 0.12,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // ── Main number line (arrows both ends) ────────────────────────
        board.create('arrow', [[-1.5, Y_LINE], [21.5, Y_LINE]], {
            strokeColor: BLUE, strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }, touchLastPoint: false
        });
        board.create('arrow', [[21.5, Y_LINE], [-1.5, Y_LINE]], {
            strokeColor: BLUE, strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }, touchLastPoint: false
        });

        // ── Tick marks every 1 unit from 0 to 20 ──────────────────────
        var majorTicks = [0, 8, 20];
        var i, isMajor, tickH;
        for (i = 0; i <= 20; i++) {
            isMajor = (majorTicks.indexOf(i) !== -1);
            tickH = isMajor ? 0.55 : 0.1;
            board.create('segment', [[i, Y_LINE - tickH], [i, Y_LINE + tickH]], {
                strokeColor: BLUE, strokeWidth: isMajor ? 2.0 : 1.2,
                fixed: true, highlight: false
            });
        }

        // ── Key points (filled dots at 0, 8, 20) ──────────────────────
        board.create('point', [0, Y_LINE], {
            name: '', size: 4, color: BLUE, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [8, Y_LINE], {
            name: '', size: 4, color: BLUE, fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [20, Y_LINE], {
            name: '', size: 4, color: BLUE, fixed: true, highlight: false, showInfobox: false
        });

        // ── Numeric labels below ticks (moved up) ─────────────────────
        board.create('text', [0, Y_LABELS, '0'], {
            fontSize: 13, color: DARK, anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
        board.create('text', [8, Y_LABELS, '8'], {
            fontSize: 13, color: DARK, anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
        board.create('text', [20, Y_LABELS, '20'], {
            fontSize: 13, color: DARK, anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        // ── "Minutes" label at the left (moved up) ────────────────────
        board.create('text', [-2.2, Y_LABELS, '<b>Minutes</b>'], {
            fontSize: 13, color: DARK, anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        // ── Bracket above: Favorable (8→20) ───────────────────────────
        var bY1 = Y_LINE + 1.2;
        var bY2 = Y_LINE + 1.7;
        board.create('segment', [[8, bY1], [8, bY2]], {
            strokeColor: BLUE, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[20, bY1], [20, bY2]], {
            strokeColor: BLUE, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[8, bY2], [20, bY2]], {
            strokeColor: BLUE, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('text', [14, bY2 + 0.8, 'Favorable: 8 or more minutes'], {
            fontSize: 12, color: BLUE, anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });

        // ── Bracket below: Total (0→20) ───────────────────────────────
        var tY1 = Y_LINE - 1.8;
        var tY2 = Y_LINE - 2.3;
        board.create('segment', [[0, tY1], [0, tY2]], {
            strokeColor: DARK, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[20, tY1], [20, tY2]], {
            strokeColor: DARK, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [[0, tY2], [20, tY2]], {
            strokeColor: DARK, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('text', [10, tY2 - 0.8, 'Total: 20 minutes'], {
            fontSize: 12, color: DARK, anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight:600',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
