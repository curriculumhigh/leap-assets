<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle — Vertex 62°</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var vertexAngle = 62;
        var halfVertex = vertexAngle / 2 * Math.PI / 180;
        var sideLen = 4.2;

        var Ax = 0;
        var Ay = 3.2;

        var Bx = Ax - sideLen * Math.sin(halfVertex);
        var By = Ay - sideLen * Math.cos(halfVertex);
        var Cx = Ax + sideLen * Math.sin(halfVertex);
        var Cy = Ay - sideLen * Math.cos(halfVertex);

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 4.8, 4, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [Ax, Ay], {
            name: '', fixed: true, visible: false, showInfobox: false
        });
        var B = board.create('point', [Bx, By], {
            name: '', fixed: true, visible: false, showInfobox: false
        });
        var C = board.create('point', [Cx, Cy], {
            name: '', fixed: true, visible: false, showInfobox: false
        });

        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        function drawTick(p1, p2) {
            var mx = (p1[0] + p2[0]) / 2;
            var my = (p1[1] + p2[1]) / 2;
            var dx = p2[0] - p1[0];
            var dy = p2[1] - p1[1];
            var len = Math.sqrt(dx * dx + dy * dy);
            var nx = -dy / len;
            var ny = dx / len;
            var tickHalf = 0.2;
            board.create('segment', [
                [mx + nx * tickHalf, my + ny * tickHalf],
                [mx - nx * tickHalf, my - ny * tickHalf]
            ], {
                strokeColor: '#555555', strokeWidth: 1.8,
                fixed: true, highlight: false
            });
        }

        drawTick([Ax, Ay], [Bx, By]);
        drawTick([Ax, Ay], [Cx, Cy]);

        board.create('nonReflexAngle', [B, A, C], {
            radius: 0.55,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.55,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.55,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('text', [Ax, Ay - 1.05, '62^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var bLabelX = Bx + 0.95;
        var bLabelY = By + 0.55;
        board.create('text', [bLabelX, bLabelY, 'x^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var cLabelX = Cx - 0.95;
        var cLabelY = Cy + 0.55;
        board.create('text', [cLabelX, cLabelY, 'y^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
