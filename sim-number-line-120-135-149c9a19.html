<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line 120–135</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [119.2, 2.0, 135.8, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Number line (horizontal axis) ───────────────────────────────
        board.create('arrow', [[119.5, 0], [135.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Left end cap (small segment extending left)
        board.create('segment', [[119.5, 0], [120, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // ── Major ticks (integers) + labels ─────────────────────────────
        var i, tickTop, tickBot;
        for (i = 120; i <= 135; i++) {
            // Major tick
            board.create('segment', [[i, -0.25], [i, 0.25]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            // Label below
            board.create('text', [i, -0.55, String(i)], {
                anchorX: 'middle', anchorY: 'top',
                fontSize: 11, color: '#444444',
                fixed: true, highlight: false
            });
        }

        // ── Minor ticks (half-units) ────────────────────────────────────
        for (i = 120.5; i <= 134.5; i += 1) {
            board.create('segment', [[i, -0.15], [i, 0.15]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
        }

        // ── Key points ──────────────────────────────────────────────────
        board.create('point', [124.5, 0], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [124.5, 0.55, '124.5'], {
            anchorX: 'middle', anchorY: 'bottom',
            fontSize: 13, color: '#222222',
            useKatex: true, fixed: true, highlight: false
        });

        board.create('point', [131.5, 0], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [131.5, 0.55, '131.5'], {
            anchorX: 'middle', anchorY: 'bottom',
            fontSize: 13, color: '#222222',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
