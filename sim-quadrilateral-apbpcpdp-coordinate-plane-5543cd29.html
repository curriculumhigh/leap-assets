<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral A'B'C'D'</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 11, 15, -7],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var bb = board.getBoundingBox();
        var xMin = bb[0], yMax = bb[1], xMax = bb[2], yMin = bb[3];
        var i;

        // Gridlines (at every integer)
        for (i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
            if (i === 0) continue;
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }
        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            if (i === 0) continue;
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }

        // Axes
        var xAxis = board.create('arrow', [[xMin, 0], [xMax, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, yMin], [0, yMax]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels
        var TICK_LEN = 0.15;

        for (i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
            if (i === 0) continue;
            board.create('segment', [[i, -TICK_LEN], [i, TICK_LEN]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [i, -0.6, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        for (i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
            if (i === 0) continue;
            board.create('segment', [[-TICK_LEN, i], [TICK_LEN, i]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [-0.5, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis name labels
        board.create('text', [14.5, -0.6, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 10.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var Ap = board.create('point', [6, -4], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var Bp = board.create('point', [6, 8], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var Cp = board.create('point', [12, 8], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var Dp = board.create('point', [12, -4], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Polygon (blue edges, no fill)
        board.create('polygon', [Ap, Bp, Cp, Dp], {
            fillColor: 'none', fillOpacity: 0,
            borders: {
                strokeColor: '#2563EB',
                strokeWidth: 2.5
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Vertex labels (KaTeX, name only)
        board.create('text', [5.1, -4.7, "A'"], { useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false });
        board.create('text', [5.1, 8.4, "B'"], { useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false });
        board.create('text', [12.4, 8.4, "C'"], { useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false });
        board.create('text', [12.4, -4.7, "D'"], { useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false });
    </script>
</body>
</html>
