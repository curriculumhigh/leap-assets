<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Formula — Discriminant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            position: relative;
            width: 300px;
            height: 150px;
        }
        .formula {
            position: absolute;
            top: 24px;
            left: 24px;
        }
        .annotation {
            position: absolute;
            bottom: 14px;
            right: 20px;
            color: #DC2626;
            font-size: 14px;
            font-weight: 600;
        }
        .arrow-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="formula" id="formula"></div>
        <div class="annotation">Discriminant</div>
        <svg class="arrow-svg" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
            <!-- Vertical line going up -->
            <line x1="242" y1="122" x2="242" y2="55" stroke="#2563EB" stroke-width="1.8" />
            <!-- Horizontal line going left to the discriminant -->
            <line x1="242" y1="55" x2="210" y2="55" stroke="#2563EB" stroke-width="1.8" />
            <!-- Arrowhead pointing left -->
            <polygon points="210,52 202,55 210,58" fill="#2563EB" />
        </svg>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            katex.render(
                'x = \\dfrac{-b \\pm \\sqrt{\\,\\color{#DC2626}{b^2 - 4ac}\\,}}{2a}',
                document.getElementById('formula'),
                { throwOnError: false, displayMode: true }
            );
        });
    </script>
</body>
</html>
