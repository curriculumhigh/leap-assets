<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola f(x) = (x-4)²</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 21, 9, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 4
                    }
                }
            }
        });

        // Axis labels
        board.create('text', [8.5, -1.2, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.3, 20.2, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

        // Parabola f(x) = (x - 4)²
        board.create('functiongraph', [
            function(x) { return Math.pow(x - 4, 2); }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Curve label "f" — just to the right of the curve on the right branch
        board.create('text', [6.9, 7.2, 'f'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-style: italic;'
        });
    </script>
</body>
</html>
