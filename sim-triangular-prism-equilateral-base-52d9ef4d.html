<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangular Prism — Equilateral Base</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 9, 8, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var dx = 1.4;
        var dy = 0.9;

        var bw = 5;
        var bh = bw * Math.sqrt(3) / 2;

        var A = [0, 0];
        var B = [bw, 0];
        var C = [bw / 2 + dx, bh * 0.55 + dy];

        var ph = 5.8;

        var D = [A[0], A[1] + ph];
        var E = [B[0], B[1] + ph];
        var F = [C[0], C[1] + ph];

        board.create('segment', [A, C], {
            strokeColor: '#222222', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
        board.create('segment', [C, F], {
            strokeColor: '#222222', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#222222', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        var pFront = board.create('polygon', [A, B, E, D], {
            fillColor: '#93C5FD', fillOpacity: 0.10,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var pRight = board.create('polygon', [B, C, F, E], {
            fillColor: '#D1D5DB', fillOpacity: 0.12,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var pTop = board.create('polygon', [D, E, F], {
            fillColor: '#BBF7D0', fillOpacity: 0.12,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('segment', [A, B], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
        board.create('segment', [A, D], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
        board.create('segment', [B, E], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
        board.create('segment', [D, E], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
        board.create('segment', [E, F], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });
        board.create('segment', [F, D], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        board.create('text', [bw / 2, -0.9, '6 \\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [B[0] + 0.7, B[1] + ph / 2, '9.5 \\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('segment', [[0, -0.25], [0, 0.25]], {
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, highlight: false
        });
        board.create('segment', [[bw, -0.25], [bw, 0.25]], {
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        board.create('segment', [[B[0] - 0.15, B[1]], [B[0] + 0.35, B[1]]], {
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, highlight: false
        });
        board.create('segment', [[E[0] - 0.15, E[1]], [E[0] + 0.35, E[1]]], {
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
