<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downward-Opening Parabola — Dashed with Shading</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 5.5, 6, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 5.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola: f(x) = -(x-2)^2 + 3
        var f = function(x) { return -(x - 2) * (x - 2) + 3; };

        // Shaded region below the parabola (from curve down to bottom of bounding box)
        var yBottom = -3;
        var xLeft = -2;
        var xRight = 6;
        var NUM_PTS = 200;

        var shadePtsX = [];
        var shadePtsY = [];

        // Bottom-left corner
        shadePtsX.push(xLeft);
        shadePtsY.push(yBottom);

        // Along the curve from left to right
        for (var i = 0; i <= NUM_PTS; i++) {
            var xi = xLeft + (xRight - xLeft) * i / NUM_PTS;
            shadePtsX.push(xi);
            shadePtsY.push(f(xi));
        }

        // Bottom-right corner
        shadePtsX.push(xRight);
        shadePtsY.push(yBottom);

        // Create invisible points for the polygon
        var shadePoints = [];
        for (var j = 0; j < shadePtsX.length; j++) {
            shadePoints.push(
                board.create('point', [shadePtsX[j], shadePtsY[j]], {
                    visible: false, fixed: true, name: ''
                })
            );
        }

        // Shaded polygon
        board.create('polygon', shadePoints, {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Dashed parabola curve
        board.create('functiongraph', [f, xLeft, xRight], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Key points
        // Vertex (2, 3)
        board.create('point', [2, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // X-intercepts
        var xInt1 = 2 - Math.sqrt(3);
        var xInt2 = 2 + Math.sqrt(3);

        board.create('point', [xInt1, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [xInt2, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels (KaTeX)
        // Vertex label — offset above
        board.create('text', [2.15, 3.7, '(2,\\, 3)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });

        // Left intercept label — offset below-left
        board.create('text', [-1.1, -0.55, '(2\\!-\\!\\sqrt{3},\\, 0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        // Right intercept label — offset below-right, away from descending curve
        board.create('text', [3.9, -0.7, '(2\\!+\\!\\sqrt{3},\\, 0)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });

        // Function label (name only)
        board.create('text', [4.6, 1.2, 'f(x)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
