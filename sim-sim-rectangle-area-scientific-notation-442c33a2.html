<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Area Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 250px; margin: 0 auto; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 6, 9, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Rectangle corners
        var x1 = 0, y1 = 0, x2 = 8, y2 = 5;

        var pA = board.create('point', [x1, y1], { visible: false, fixed: true, name: '' });
        var pB = board.create('point', [x2, y1], { visible: false, fixed: true, name: '' });
        var pC = board.create('point', [x2, y2], { visible: false, fixed: true, name: '' });
        var pD = board.create('point', [x1, y2], { visible: false, fixed: true, name: '' });

        // Rectangle polygon
        board.create('polygon', [pA, pB, pC, pD], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right angle marker at bottom-left corner
        var markSize = 0.5;
        board.create('segment', [[x1 + markSize, y1], [x1 + markSize, y1 + markSize]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[x1 + markSize, y1 + markSize], [x1, y1 + markSize]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Area label — centered inside the rectangle
        board.create('text', [(x1 + x2) / 2, (y1 + y2) / 2, '3.48 \\times 10^{10} \\text{ ft}^2'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222',
            useKatex: true, fixed: true, highlight: false
        });

        // Length label — centered below the bottom edge
        board.create('text', [(x1 + x2) / 2, y1 - 0.9, '6 \\times 10^4 \\text{ ft}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#222222',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
