<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cone Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10, 18.5, 10, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Key points (all invisible) ──────────────────────────────────
        var apex = board.create('point', [0, 16], { visible: false, fixed: true, name: '' });
        var baseCenter = board.create('point', [0, 1], { visible: false, fixed: true, name: '' });
        var baseLeft = board.create('point', [-8, 1], { visible: false, fixed: true, name: '' });
        var baseRight = board.create('point', [8, 1], { visible: false, fixed: true, name: '' });

        // ── Slant edges (solid) ─────────────────────────────────────────
        board.create('segment', [apex, baseLeft], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [apex, baseRight], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Elliptical base ─────────────────────────────────────────────
        // Front half (solid) — bottom arc from angle π to 2π
        board.create('curve', [
            function(t) { return 8 * Math.cos(t); },
            function(t) { return 1 + 1.5 * Math.sin(t); },
            Math.PI, 2 * Math.PI
        ], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Back half (dashed) — top arc from angle 0 to π
        board.create('curve', [
            function(t) { return 8 * Math.cos(t); },
            function(t) { return 1 + 1.5 * Math.sin(t); },
            0, Math.PI
        ], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Height line (dashed) ────────────────────────────────────────
        board.create('segment', [apex, baseCenter], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Radius line (solid) ─────────────────────────────────────────
        board.create('segment', [baseCenter, baseRight], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle marker at base center ───────────────────────────
        var sqSize = 0.8;
        board.create('polygon', [
            [0, 1], [sqSize, 1], [sqSize, 1 + sqSize], [0, 1 + sqSize]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // ── Labels (KaTeX) ──────────────────────────────────────────────
        // "15 cm" — left of height line
        board.create('text', [-2.2, 8.5, '15 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // "8 cm" — below radius line
        board.create('text', [4, -0.6, '8 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // "x" — right of right slant edge
        board.create('text', [5.6, 9, 'x'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
