<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle XYZ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 3.0, 3.5, -2.6],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Fixed vertices
        var X = board.create('point', [0, 2.0], {
            name: 'X', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [0, 10] }
        });

        var Y = board.create('point', [-2.2, -1.6], {
            name: 'Y', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-14, -6] }
        });

        var Z = board.create('point', [2.2, -1.6], {
            name: 'Z', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -6] }
        });

        // Triangle polygon (no fill)
        board.create('polygon', [X, Y, Z], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Tick mark on XY (midpoint, perpendicular dash)
        var mXY_x = (X.X() + Y.X()) / 2;
        var mXY_y = (X.Y() + Y.Y()) / 2;
        var dXY_x = Y.X() - X.X();
        var dXY_y = Y.Y() - X.Y();
        var lenXY = Math.sqrt(dXY_x * dXY_x + dXY_y * dXY_y);
        var nXY_x = -dXY_y / lenXY;
        var nXY_y = dXY_x / lenXY;
        var tickSize = 0.18;

        board.create('segment', [
            [mXY_x + nXY_x * tickSize, mXY_y + nXY_y * tickSize],
            [mXY_x - nXY_x * tickSize, mXY_y - nXY_y * tickSize]
        ], {
            strokeColor: '#DC2626', strokeWidth: 2, fixed: true, highlight: false
        });

        // Tick mark on XZ (midpoint, perpendicular dash)
        var mXZ_x = (X.X() + Z.X()) / 2;
        var mXZ_y = (X.Y() + Z.Y()) / 2;
        var dXZ_x = Z.X() - X.X();
        var dXZ_y = Z.Y() - X.Y();
        var lenXZ = Math.sqrt(dXZ_x * dXZ_x + dXZ_y * dXZ_y);
        var nXZ_x = -dXZ_y / lenXZ;
        var nXZ_y = dXZ_x / lenXZ;

        board.create('segment', [
            [mXZ_x + nXZ_x * tickSize, mXZ_y + nXZ_y * tickSize],
            [mXZ_x - nXZ_x * tickSize, mXZ_y - nXZ_y * tickSize]
        ], {
            strokeColor: '#DC2626', strokeWidth: 2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
