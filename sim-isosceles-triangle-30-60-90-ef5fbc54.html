<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle — 30-60-90</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var h = 3 * Math.sqrt(3);

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, h + 1.8, 8.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var B = board.create('point', [0, 0], { name: '', visible: false, fixed: true });
        var C = board.create('point', [6, 0], { name: '', visible: false, fixed: true });
        var A = board.create('point', [3, h], { name: '', visible: false, fixed: true });
        var M = board.create('point', [3, 0], { name: '', visible: false, fixed: true });

        board.create('polygon', [B, C, A], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        board.create('segment', [A, M], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        var sqSize = 0.38;
        var sq1 = board.create('point', [3 + sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [3 + sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [3, sqSize], { visible: false, fixed: true, name: '' });
        board.create('polygon', [M, sq1, sq2, sq3], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        board.create('nonReflexAngle', [C, B, A], {
            radius: 0.7,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [A, C, B], {
            radius: 0.7,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [B, A, M], {
            radius: 0.8,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [M, A, C], {
            radius: 0.8,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        board.create('text', [0.95, 0.55, '60^\\circ'], {
            useKatex: true, fontSize: 12, color: '#555555',
            anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        board.create('text', [5.05, 0.55, '60^\\circ'], {
            useKatex: true, fontSize: 12, color: '#555555',
            anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
        });

        var angAB = Math.atan2(0 - h, 0 - 3);
        var angAM = Math.atan2(0 - h, 3 - 3);
        var bisL = (angAB + angAM) / 2;
        var lblDistL = 1.45;
        board.create('text', [3 + lblDistL * Math.cos(bisL), h + lblDistL * Math.sin(bisL), '30^\\circ'], {
            useKatex: true, fontSize: 11, color: '#555555',
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        var angAC = Math.atan2(0 - h, 6 - 3);
        var bisR = (angAM + angAC) / 2;
        var lblDistR = 1.45;
        board.create('text', [3 + lblDistR * Math.cos(bisR), h + lblDistR * Math.sin(bisR), '30^\\circ'], {
            useKatex: true, fontSize: 11, color: '#555555',
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        var midABx = (0 + 3) / 2 - 0.55;
        var midABy = (0 + h) / 2 + 0.15;
        board.create('text', [midABx, midABy, '6'], {
            useKatex: true, fontSize: 14, color: '#333333',
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        var midACx = (6 + 3) / 2 + 0.55;
        var midACy = (0 + h) / 2 + 0.15;
        board.create('text', [midACx, midACy, '6'], {
            useKatex: true, fontSize: 14, color: '#333333',
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        board.create('text', [1.5, -0.55, '3'], {
            useKatex: true, fontSize: 14, color: '#333333',
            anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false
        });

        board.create('text', [4.5, -0.55, '3'], {
            useKatex: true, fontSize: 14, color: '#333333',
            anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false
        });

        board.create('text', [2.35, h / 2, 'h'], {
            useKatex: true, fontSize: 14, color: '#DC2626',
            anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false,
            cssStyle: 'font-style: italic;'
        });
    </script>
</body>
</html>
