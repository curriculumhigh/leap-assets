<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral with Labeled Sides</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 5.5, 7.2, -1.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices of an irregular quadrilateral (roughly trapezoidal)
        var A = board.create('point', [0.8, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [5.8, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [5.0, 4.0], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [1.5, 4.0], { visible: false, fixed: true, name: '' });

        // Polygon — no fill
        board.create('polygon', [A, B, C, D], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Side labels — positioned outside each edge

        // Bottom side: 6.1 ft (between A and B, below)
        board.create('text', [3.3, -0.6, '6.1 ft'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Top side: 3.8 ft (between D and C, above)
        board.create('text', [3.25, 4.6, '3.8 ft'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Left side: 5.3 ft (between A and D, to the left)
        board.create('text', [-0.2, 2.0, '5.3 ft'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Right side: x ft (between B and C, to the right) — highlighted in blue
        board.create('text', [6.2, 2.0, '<i>x</i> ft'], {
            fontSize: 13, color: '#2563EB', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600'
        });
    </script>
</body>
</html>
