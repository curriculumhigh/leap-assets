<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Window Number Line</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 5.5, 50, -5.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Y = 0;
        var TICK_H = 0.45;
        var COL_LINE = '#444444';

        // ── Main number line (0 to 45) ──────────────────────────────────
        board.create('segment', [[0, Y], [45, Y]], {
            strokeColor: COL_LINE, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Tick marks at 0, 15, 30, 45 ────────────────────────────────
        var ticks = [0, 15, 30, 45];
        for (var i = 0; i < ticks.length; i++) {
            board.create('segment', [[ticks[i], Y - TICK_H], [ticks[i], Y + TICK_H]], {
                strokeColor: COL_LINE, strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        // ── Time labels just below ticks ────────────────────────────────
        var timeLabels = ['2:00', '2:15', '2:30', '2:45'];
        for (var j = 0; j < ticks.length; j++) {
            board.create('text', [ticks[j], Y - 0.9, timeLabels[j]], {
                anchorX: 'middle', anchorY: 'top', fontSize: 11,
                color: '#333333', fixed: true, highlight: false
            });
        }

        // ── "Call window" label above full segment ──────────────────────
        board.create('text', [22.5, Y + 3.2, 'Call window'], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 11,
            color: '#555555', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        // Bracket lines for "Call window"
        board.create('segment', [[0, Y + 2.2], [0, Y + 2.6]], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[0, Y + 2.6], [45, Y + 2.6]], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[45, Y + 2.2], [45, Y + 2.6]], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });
    </script>
</body>
</html>
