<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilateral Triangle PQR with Cevians</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 6.5, 5, -4],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Equilateral triangle PQR — P at top, Q bottom-left, R bottom-right
        var sideLen = 7;
        var h = sideLen * Math.sqrt(3) / 2;

        var Px = 0, Py = h * 2 / 3;
        var Qx = -sideLen / 2, Qy = -h / 3;
        var Rx = sideLen / 2, Ry = -h / 3;

        // Vertices of outer triangle
        var P = board.create('point', [Px, Py], {
            name: 'P', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 12], useKatex: true }
        });
        var Q = board.create('point', [Qx, Qy], {
            name: 'Q', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -8], useKatex: true }
        });
        var R = board.create('point', [Rx, Ry], {
            name: 'R', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -8], useKatex: true }
        });

        // Outer triangle edges
        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });
        // Show vertices on top (re-show after polygon hides them)
        P.setAttribute({ visible: true });
        Q.setAttribute({ visible: true });
        R.setAttribute({ visible: true });

        // Points X on QR, Y on RP, Z on PQ — at 1/3 along each side
        var t = 1 / 3;

        var Xx = Qx + t * (Rx - Qx);
        var Xy = Qy + t * (Ry - Qy);
        var Yx = Rx + t * (Px - Rx);
        var Yy = Ry + t * (Py - Ry);
        var Zx = Px + t * (Qx - Px);
        var Zy = Py + t * (Qy - Py);

        var X = board.create('point', [Xx, Xy], {
            name: 'X', fixed: true, size: 3, color: '#2563EB', highlight: false,
            label: { fontSize: 14, color: '#2563EB', offset: [0, -14], useKatex: true }
        });
        var Y = board.create('point', [Yx, Yy], {
            name: 'Y', fixed: true, size: 3, color: '#2563EB', highlight: false,
            label: { fontSize: 14, color: '#2563EB', offset: [10, 2], useKatex: true }
        });
        var Z = board.create('point', [Zx, Zy], {
            name: 'Z', fixed: true, size: 3, color: '#2563EB', highlight: false,
            label: { fontSize: 14, color: '#2563EB', offset: [-16, 2], useKatex: true }
        });

        // Cevians PX, QY, RZ — construction lines (cyan)
        board.create('segment', [P, X], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [Q, Y], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [R, Z], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // Interior triangle XYZ
        board.create('polygon', [X, Y, Z], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#2563EB', strokeWidth: 1.5 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Ensure XYZ points render on top
        X.setAttribute({ visible: true });
        Y.setAttribute({ visible: true });
        Z.setAttribute({ visible: true });
    </script>
</body>
</html>
