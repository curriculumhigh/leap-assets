<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparing f(x) = 3(2)^x and g(x) = 2^x</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .JXG_infobox { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important; font-size: 12px !important; background: rgba(255,255,255,0.95) !important; border: 1px solid #d0d0d0 !important; border-radius: 4px !important; padding: 3px 7px !important; color: #333 !important; box-shadow: 0 1px 4px rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 15, 4, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.6, -0.7, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 14.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Primary curve: g(x) = 2^x (dark/black) ─────────────────────
        board.create('functiongraph', [
            function(x) { return Math.pow(2, x); },
            -3.8, 3.8
        ], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Secondary curve: f(x) = 3(2)^x (deep blue) ────────────────
        board.create('functiongraph', [
            function(x) { return 3 * Math.pow(2, x); },
            -3.8, 3.8
        ], {
            strokeColor: '#2563EB', strokeWidth: 1.6, fixed: true, highlight: false
        });

        // ── Curve labels (KaTeX) ────────────────────────────────────────
        // g label: right side, just above g(2) = 4
        board.create('text', [2.4, 5.2, 'g(x) = 2^x'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // f label: left side, close above the curve
        board.create('text', [-3.6, 2.2, 'f(x) = 3(2)^x'], {
            fontSize: 13, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });

        // ── Key points on g(x) = 2^x (dark/black) ──────────────────────
        var xVals = [-2, -1, 0, 1, 2];
        var i;
        for (i = 0; i < xVals.length; i++) {
            (function(xv) {
                var yv = Math.pow(2, xv);
                var pt = board.create('point', [xv, yv], {
                    name: '',
                    size: 4,
                    color: '#222222',
                    fixed: true,
                    showInfobox: true,
                    highlight: true
                });
                pt.infoboxText = '(' + xv + ', ' + (Number.isInteger(yv) ? yv : yv.toFixed(2)) + ')';
            })(xVals[i]);
        }

        // ── Key points on f(x) = 3(2)^x (deep blue) ───────────────────
        for (i = 0; i < xVals.length; i++) {
            (function(xv) {
                var yv = 3 * Math.pow(2, xv);
                var pt = board.create('point', [xv, yv], {
                    name: '',
                    size: 4,
                    color: '#2563EB',
                    fixed: true,
                    showInfobox: true,
                    highlight: true
                });
                pt.infoboxText = '(' + xv + ', ' + (Number.isInteger(yv) ? yv : yv.toFixed(2)) + ')';
            })(xVals[i]);
        }
    </script>
</body>
</html>
