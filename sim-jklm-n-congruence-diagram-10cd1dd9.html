<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points J, K, L, M, N Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 5.5, 11, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Base points on horizontal line (unevenly spaced for natural look)
        var J = board.create('point', [1, 0], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });
        var K = board.create('point', [3.5, 0], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });
        var L = board.create('point', [6.5, 0], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });
        var M = board.create('point', [9, 0], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });

        // Point N above (between K and L, slightly left of center)
        var N = board.create('point', [4.5, 4], {
            name: '', fixed: true, size: 3, color: '#222222', highlight: false
        });

        // Segments from base points to N
        var segJN = board.create('segment', [J, N], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        var segKN = board.create('segment', [K, N], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        var segLN = board.create('segment', [L, N], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        var segMN = board.create('segment', [M, N], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Horizontal base line
        board.create('segment', [J, M], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Congruence tick marks on JN and MN
        function drawTickMark(p1, p2, numTicks) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickLen = 0.25;
            var spacing = 0.2;

            for (var i = 0; i < numTicks; i++) {
                var offset = (i - (numTicks - 1) / 2) * spacing;
                var cx = mx + offset * (dx / len);
                var cy = my + offset * (dy / len);
                board.create('segment', [
                    [cx + px * tickLen, cy + py * tickLen],
                    [cx - px * tickLen, cy - py * tickLen]
                ], {
                    strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
                });
            }
        }

        // Single tick mark on JN and MN (matching congruence)
        drawTickMark(J, N, 1);
        drawTickMark(M, N, 1);

        // Labels
        board.create('text', [1, -0.7, 'J'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [3.5, -0.7, 'K'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [6.5, -0.7, 'L'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [9, -0.7, 'M'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [4.5, 4.6, 'N'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
