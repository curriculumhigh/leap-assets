<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Root x minus 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
        .JXG_navigation { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 3, 8, -7],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Create axes manually for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                strokeWidth: 0,
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                label: {
                    fontSize: 10,
                    offset: [0, -12],
                    color: '#444444'
                },
                drawZero: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                strokeWidth: 0,
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                label: {
                    fontSize: 10,
                    offset: [-15, 0],
                    color: '#444444'
                },
                drawZero: false
            }
        });

        // Axis labels near arrow tips
        board.create('text', [7.4, -0.55, '<i>x</i>'], {
            fontSize: 12, fixed: true, highlight: false, color: '#444444'
        });
        board.create('text', [0.4, 2.6, '<i>y</i>'], {
            fontSize: 12, fixed: true, highlight: false, color: '#444444'
        });

        // Cube root function: f(x) = cbrt(x) - 4
        board.create('functiongraph', [
            function(x) {
                var cbrt = (x >= 0) ? Math.pow(x, 1 / 3) : -Math.pow(-x, 1 / 3);
                return cbrt - 4;
            },
            -6, 8
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
