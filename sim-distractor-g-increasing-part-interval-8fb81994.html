<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor — g increasing over part of interval</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 8.5, 6.5, -4.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Manual axes with forced ticksDistance = 1
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            }
        });

        // Axis labels
        board.create('text', [6.1, -0.4, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.25, 8.1, 'y'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        var COL_CURVE = '#2563EB';
        var COL_PT = '#DC2626';
        var SW = 2.5;

        // ── Left piece: x in [-5, -3) ──────────────────────────────────
        // Decreasing from ~(−5, 7) approaching (−3, 5)
        // g(x) = 5 + 0.9·(−3 − x)^0.8
        board.create('functiongraph', [
            function(x) {
                var d = -3 - x;
                return 5 + 0.9 * Math.pow(d, 0.8);
            },
            -5, -3.01
        ], {
            strokeColor: COL_CURVE, strokeWidth: SW, fixed: true, highlight: false
        });

        // ── Middle piece: x in (-3, 2) ─────────────────────────────────
        // g(x) = (-1/60)x³ + (17/60)x² + 2
        // Decreases from 5 at x=-3 to valley at x=0 (y=2), then increases to 3 at x=2
        // This is the distractor violation: increasing from x≈0 to x≈2
        var a_mid = -1 / 60;
        var b_mid = 17 / 60;
        var d_mid = 2;

        board.create('functiongraph', [
            function(x) {
                return a_mid * x * x * x + b_mid * x * x + d_mid;
            },
            -2.99, 1.99
        ], {
            strokeColor: COL_CURVE, strokeWidth: SW, fixed: true, highlight: false
        });

        // ── Right piece: x in (2, 5] ───────────────────────────────────
        // Right limit at x=2⁺ ≈ −1, decreasing to −3 at x=5
        // g(x) = -1 - (2/3)(x - 2)
        board.create('functiongraph', [
            function(x) {
                return -1 - (2 / 3) * (x - 2);
            },
            2.01, 5
        ], {
            strokeColor: COL_CURVE, strokeWidth: SW, fixed: true, highlight: false
        });

        // ── Open circle at (−3, 5) — g(−3) undefined ───────────────────
        board.create('point', [-3, 5], {
            name: '', size: 5,
            fillColor: '#ffffff', strokeColor: COL_PT, strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Filled dot at (2, 1) — g(2) = 1 ────────────────────────────
        board.create('point', [2, 1], {
            name: '', size: 5,
            fillColor: COL_PT, strokeColor: COL_PT,
            fixed: true, highlight: false
        });

        // ── Open circle at (2, 3) — left limit ─────────────────────────
        board.create('point', [2, 3], {
            name: '', size: 5,
            fillColor: '#ffffff', strokeColor: COL_PT, strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Open circle at (2, −1) — right limit ───────────────────────
        board.create('point', [2, -1], {
            name: '', size: 5,
            fillColor: '#ffffff', strokeColor: COL_PT, strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Function label ──────────────────────────────────────────────
        board.create('text', [-4.8, 7.2, 'g(x)'], {
            fontSize: 13, color: COL_CURVE, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
