<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of x ≤ 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 1.5, 6, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var COL_LINE = '#444444';
        var COL_HIGHLIGHT = '#2563EB';
        var TICK_HALF = 0.15;
        var Y_LINE = 0;
        var X_MIN = -5;
        var X_MAX = 5;

        // Number line with arrowheads on both ends
        board.create('arrow', [[X_MIN - 0.7, Y_LINE], [X_MAX + 0.7, Y_LINE]], {
            strokeColor: COL_LINE,
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels at integers
        var i;
        for (i = X_MIN; i <= X_MAX; i++) {
            board.create('segment', [[i, -TICK_HALF], [i, TICK_HALF]], {
                strokeColor: COL_LINE,
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -TICK_HALF - 0.15, String(i)], {
                fontSize: 11,
                color: COL_LINE,
                anchorX: 'middle',
                anchorY: 'top',
                fixed: true,
                highlight: false
            });
        }

        // Solution ray: from x = 3 extending left with arrowhead
        board.create('arrow', [[3, Y_LINE], [X_MIN - 0.7, Y_LINE]], {
            strokeColor: COL_HIGHLIGHT,
            strokeWidth: 2.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Closed dot at x = 3
        board.create('point', [3, Y_LINE], {
            name: '',
            size: 5,
            color: COL_HIGHLIGHT,
            fillColor: COL_HIGHLIGHT,
            strokeColor: COL_HIGHLIGHT,
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
