<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimming Pool Visitors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 385, 6.9, -35],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 50
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.5, -18, '<i>Week</i>'], {
            fontSize: 14, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [0.2, 372, '<i>Visitors</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        // Exponential decay curve: V(t) = 320 * (0.75)^t, domain [0, ~6.5]
        board.create('curve', [
            function(t) { return t; },
            function(t) { return 320 * Math.pow(0.75, t); },
            0, 6.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points and coordinate labels
        var keyPoints = [
            { x: 0, y: 320, lx: 0.18, ly: 325 },
            { x: 1, y: 240, lx: 1.18, ly: 245 },
            { x: 2, y: 180, lx: 2.18, ly: 185 },
            { x: 3, y: 135, lx: 3.18, ly: 140 }
        ];

        for (var i = 0; i < keyPoints.length; i++) {
            var p = keyPoints[i];

            board.create('point', [p.x, p.y], {
                name: '',
                size: 5,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            board.create('text', [p.lx, p.ly, '(' + p.x + ', ' + p.y + ')'], {
                fontSize: 13,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
