<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Graphs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 10px; height: 100%; }
        .left-panel {
            width: 150px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 14px;
            display: flex; flex-direction: column; justify-content: center; gap: 14px;
        }
        .func-row { display: flex; align-items: center; gap: 8px; }
        .func-swatch { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }
        .func-label { font-size: 13px; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 8px; height: calc(100% - 16px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="func-row">
                    <div class="func-swatch" style="background: #222222;"></div>
                    <div class="func-label" id="label-f"></div>
                </div>
                <div class="func-row">
                    <div class="func-swatch" style="background: #2563EB;"></div>
                    <div class="func-label" id="label-g"></div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        // Render KaTeX labels
        katex.render('y = 2x^2 - 3x - 9', document.getElementById('label-f'), { throwOnError: false });
        katex.render('y = -x^2 + 4x + 5', document.getElementById('label-g'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 11, 7, -12],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 11, offset: [0, -12] }
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 11, offset: [-12, 0] }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.6, -0.8, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 10.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Functions
        function f(x) { return 2 * x * x - 3 * x - 9; }
        function g(x) { return -x * x + 4 * x + 5; }

        // Find intersection points: 2x²-3x-9 = -x²+4x+5
        // 3x²-7x-14 = 0 → x = (7 ± √(49+168))/6 = (7 ± √217)/6
        var disc = Math.sqrt(217);
        var xLeft = (7 - disc) / 6;
        var xRight = (7 + disc) / 6;

        // Shaded region between parabolas (where g > f, between intersection points)
        var shadedCurve = board.create('curve', [[], []], {
            strokeWidth: 0,
            fillColor: '#888888',
            fillOpacity: 0.15,
            fixed: true,
            highlight: false
        });

        // Build the shaded polygon path: trace g(x) left to right, then f(x) right to left
        var xCoords = [];
        var yCoords = [];
        var steps = 100;
        var dx = (xRight - xLeft) / steps;

        // Top boundary: g(x) from left to right
        for (var i = 0; i <= steps; i++) {
            var x = xLeft + i * dx;
            xCoords.push(x);
            yCoords.push(g(x));
        }
        // Bottom boundary: f(x) from right to left
        for (var i = steps; i >= 0; i--) {
            var x = xLeft + i * dx;
            xCoords.push(x);
            yCoords.push(f(x));
        }

        shadedCurve.dataX = xCoords;
        shadedCurve.dataY = yCoords;

        // f(x) = 2x² - 3x - 9 — primary curve (dark)
        board.create('functiongraph', [f], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // g(x) = -x² + 4x + 5 — secondary curve (blue)
        board.create('functiongraph', [g], {
            strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false
        });
    </script>
</body>
</html>
