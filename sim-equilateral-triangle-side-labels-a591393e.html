<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilateral Triangle with Side Labels</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.5, 5.8, 7.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var s = 5;
        var Ax = 0, Ay = 0;
        var Bx = s, By = 0;
        var Cx = s / 2, Cy = s * Math.sqrt(3) / 2;

        var A = board.create('point', [Ax, Ay], {
            name: 'A', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -14] }
        });
        var B = board.create('point', [Bx, By], {
            name: 'B', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, -14] }
        });
        var C = board.create('point', [Cx, Cy], {
            name: 'C', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 14] }
        });

        board.create('polygon', [A, B, C], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        var LABEL_OFFSET = 0.55;

        var bottomMx = (Ax + Bx) / 2;
        var bottomMy = (Ay + By) / 2;
        board.create('text', [bottomMx, bottomMy - LABEL_OFFSET, '3x - 6'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        var leftMx = (Ax + Cx) / 2;
        var leftMy = (Ay + Cy) / 2;
        var ldx = Cx - Ax;
        var ldy = Cy - Ay;
        var lLen = Math.sqrt(ldx * ldx + ldy * ldy);
        var lnx = -ldy / lLen;
        var lny = ldx / lLen;
        board.create('text', [leftMx + lnx * LABEL_OFFSET * 1.6, leftMy + lny * LABEL_OFFSET * 1.6, '2y + 4'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var rightMx = (Bx + Cx) / 2;
        var rightMy = (By + Cy) / 2;
        var rdx = Cx - Bx;
        var rdy = Cy - By;
        var rLen = Math.sqrt(rdx * rdx + rdy * rdy);
        var rnx = -rdy / rLen;
        var rny = rdx / rLen;
        board.create('text', [rightMx - rnx * LABEL_OFFSET * 1.6, rightMy - rny * LABEL_OFFSET * 1.6, 'y + 14'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
