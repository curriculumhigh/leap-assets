<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Curve f(x) = (x+2)(x-1)(x-4)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 15, 6, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.7, '\\textit{x}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.25, 14.3, '\\textit{y}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // f(x) = (x+2)(x-1)(x-4)
        function f(x) {
            return (x + 2) * (x - 1) * (x - 4);
        }

        // Primary curve
        board.create('functiongraph', [f, -4, 6], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points — x-intercepts
        board.create('point', [-2, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [1, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [4, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Key point — y-intercept
        board.create('point', [0, 8], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels — offset for clearance
        // (-2, 0): place below
        board.create('text', [-2, -1.3, '(-2,\\, 0)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', useKatex: true, fixed: true, highlight: false
        });

        // (1, 0): place below
        board.create('text', [1, -1.3, '(1,\\, 0)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', useKatex: true, fixed: true, highlight: false
        });

        // (4, 0): place below
        board.create('text', [4, -1.3, '(4,\\, 0)'], {
            fontSize: 12, color: '#222222', anchorX: 'middle', useKatex: true, fixed: true, highlight: false
        });

        // (0, 8): place to the right
        board.create('text', [0.4, 8.8, '(0,\\, 8)'], {
            fontSize: 12, color: '#222222', anchorX: 'left', useKatex: true, fixed: true, highlight: false
        });

        // Function label — name only, upper-right area
        board.create('text', [4.8, 12, 'f(x)'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
