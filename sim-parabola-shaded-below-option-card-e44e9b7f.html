<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola y = -x² + 4x - 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 2.4, 4.8, -2.4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.45, -0.25, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.15, 2.15, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Parabola function
        function f(x) {
            return -x * x + 4 * x - 3;
        }

        // Shaded region below the parabola (between curve and bottom of bounding box)
        var shadingCurve = board.create('curve', [[], []], {
            strokeWidth: 0,
            fillColor: '#222222',
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        shadingCurve.updateDataArray = function() {
            var xMin = -0.8;
            var xMax = 4.8;
            var yBottom = -2.4;
            var steps = 120;
            var dx = (xMax - xMin) / steps;

            this.dataX = [];
            this.dataY = [];

            // Bottom-left corner
            this.dataX.push(xMin);
            this.dataY.push(yBottom);

            // Trace the parabola from left to right
            for (var i = 0; i <= steps; i++) {
                var xi = xMin + i * dx;
                this.dataX.push(xi);
                this.dataY.push(f(xi));
            }

            // Bottom-right corner
            this.dataX.push(xMax);
            this.dataY.push(yBottom);

            // Close back to bottom-left
            this.dataX.push(xMin);
            this.dataY.push(yBottom);
        };
        board.update();

        // Parabola curve (solid, primary)
        board.create('functiongraph', [f, -0.8, 4.8], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points
        // Vertex (2, 1)
        board.create('point', [2, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [2.15, 1.3, '(2, 1)'], {
            useKatex: true, fontSize: 10, color: '#222222', fixed: true, highlight: false
        });

        // x-intercept (1, 0)
        board.create('point', [1, 0], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0.25, -0.4, '(1, 0)'], {
            useKatex: true, fontSize: 10, color: '#222222', fixed: true, highlight: false
        });

        // x-intercept (3, 0)
        board.create('point', [3, 0], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [3.1, -0.4, '(3, 0)'], {
            useKatex: true, fontSize: 10, color: '#222222', fixed: true, highlight: false
        });

        // Function label (name only)
        board.create('text', [-0.3, 1.8, 'f(x)'], {
            useKatex: true, fontSize: 11, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
