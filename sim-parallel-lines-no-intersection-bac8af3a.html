<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Lines — No Intersection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 12, 30, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [29.2, -0.7, '\\textit{x}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.6, 11.5, '\\textit{y}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // ── Line 1: y = (1/5)x + 4 ─────────────────────────────────────
        var COL1 = '#222222';
        board.create('functiongraph', [
            function(x) { return (1 / 5) * x + 4; },
            -4, 30
        ], {
            strokeColor: COL1, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Line 1 label: standard form, above the line near x = 15
        board.create('text', [15, 8.0, '-x + 5y = 20'], {
            fontSize: 13, color: COL1, fixed: true, highlight: false, useKatex: true,
            anchorX: 'middle', anchorY: 'bottom'
        });

        // ── Line 2: y = (1/5)x + 3/2 ───────────────────────────────────
        var COL2 = '#2563EB';
        board.create('functiongraph', [
            function(x) { return (1 / 5) * x + 1.5; },
            -4, 30
        ], {
            strokeColor: COL2, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Line 2 label: standard form, between the lines near x = 18
        board.create('text', [18, 5.6, '10y = 2x + 15'], {
            fontSize: 13, color: COL2, fixed: true, highlight: false, useKatex: true,
            anchorX: 'middle', anchorY: 'bottom'
        });
    </script>
</body>
</html>
