<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorrect Venn Diagram — Swapped English/French</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 4.5, 5.5, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Universal set rectangle (white fill, gray border)
        var rectPts = [
            board.create('point', [-5, 4], { visible: false, fixed: true, name: '' }),
            board.create('point', [5, 4], { visible: false, fixed: true, name: '' }),
            board.create('point', [5, -3.5], { visible: false, fixed: true, name: '' }),
            board.create('point', [-5, -3.5], { visible: false, fixed: true, name: '' })
        ];
        board.create('polygon', rectPts, {
            fillColor: '#ffffff', fillOpacity: 1,
            borders: { strokeColor: '#888888', strokeWidth: 1.5 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // S label (top-left, italic)
        board.create('text', [-4.6, 3.6, 'S'], {
            fontSize: 16, color: '#666666', cssStyle: 'font-style:italic; font-weight:600;', fixed: true, highlight: false
        });

        // Circle centers and radius
        var cxL = -1.2, cxR = 1.2, cy = 0.2, r = 2.4;

        // English circle (blue)
        board.create('circle', [[cxL, cy], r], {
            strokeColor: '#2563EB', strokeWidth: 2.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });

        // French circle (green)
        board.create('circle', [[cxR, cy], r], {
            strokeColor: '#059669', strokeWidth: 2.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });

        // Circle labels above
        board.create('text', [cxL - 0.4, cy + r + 0.5, '\\text{English}'], {
            fontSize: 14, color: '#2563EB', useKatex: true,
            anchorX: 'middle', fixed: true, highlight: false
        });
        board.create('text', [cxR + 0.4, cy + r + 0.5, '\\text{French}'], {
            fontSize: 14, color: '#059669', useKatex: true,
            anchorX: 'middle', fixed: true, highlight: false
        });

        // Region values — SWAPPED (incorrect diagram)
        // English-only: 250 (should be 200 in correct version)
        board.create('text', [cxL - 1.1, cy, '\\textbf{250}'], {
            fontSize: 16, color: '#2563EB', useKatex: true,
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Intersection (Both): 150
        board.create('text', [0, cy, '\\textbf{150}'], {
            fontSize: 16, color: '#222222', useKatex: true,
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // French-only: 200 (should be 250 in correct version)
        board.create('text', [cxR + 1.1, cy, '\\textbf{200}'], {
            fontSize: 16, color: '#059669', useKatex: true,
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Outside (Neither): 100 — bottom-right corner
        board.create('text', [4.2, -2.9, '\\textbf{100}'], {
            fontSize: 14, color: '#666666', useKatex: true,
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
    </script>
</body>
</html>
