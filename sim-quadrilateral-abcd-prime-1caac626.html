<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral A'B'C'D'</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 0, 10, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 10 }, minorTicks: 0, ticksDistance: 2 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 10 }, minorTicks: 0, ticksDistance: 2 }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [9.5, 0.4, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.3, -0.4, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Vertices
        var Ap = board.create('point', [2, -7], {
            name: '', size: 3, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        var Bp = board.create('point', [0, -3], {
            name: '', size: 3, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        var Cp = board.create('point', [4, -4], {
            name: '', size: 3, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        var Dp = board.create('point', [8, -8], {
            name: '', size: 3, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });

        // Polygon (blue outline, no fill)
        board.create('polygon', [Ap, Bp, Cp, Dp], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#2563EB', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Vertex labels (KaTeX, name only)
        board.create('text', [2.3, -7.7, "A'"], { useKatex: true, fontSize: 12, color: '#DC2626', fixed: true, highlight: false });
        board.create('text', [-1.4, -3, "B'"], { useKatex: true, fontSize: 12, color: '#DC2626', fixed: true, highlight: false });
        board.create('text', [4.3, -3.5, "C'"], { useKatex: true, fontSize: 12, color: '#DC2626', fixed: true, highlight: false });
        board.create('text', [8.3, -8, "D'"], { useKatex: true, fontSize: 12, color: '#DC2626', fixed: true, highlight: false });
    </script>
</body>
</html>
