<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope Field: dy/dx = x/y (Distractor A)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 4.5, 4.5, -4.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.1, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 4.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Slope field parameters
        var SEG_LEN = 0.55;
        var halfLen = SEG_LEN / 2;

        // Draw slope segments at integer grid points from -3 to 3
        for (var xi = -3; xi <= 3; xi++) {
            for (var yi = -3; yi <= 3; yi++) {
                // Skip origin (0/0 indeterminate)
                if (xi === 0 && yi === 0) continue;

                var x0 = xi;
                var y0 = yi;

                if (yi === 0) {
                    // Slope undefined (vertical tangent) — draw vertical segment
                    board.create('segment', [[x0, y0 - halfLen], [x0, y0 + halfLen]], {
                        strokeColor: '#222222', strokeWidth: 1.2,
                        fixed: true, highlight: false
                    });
                } else {
                    // Slope = x/y (distractor — positive, not -x/y)
                    var slope = xi / yi;
                    // Direction vector (1, slope), normalized and scaled to halfLen
                    var mag = Math.sqrt(1 + slope * slope);
                    var dx = halfLen / mag;
                    var dy = (slope * halfLen) / mag;

                    board.create('segment', [[x0 - dx, y0 - dy], [x0 + dx, y0 + dy]], {
                        strokeColor: '#222222', strokeWidth: 1.2,
                        fixed: true, highlight: false
                    });
                }
            }
        }
    </script>
</body>
</html>
