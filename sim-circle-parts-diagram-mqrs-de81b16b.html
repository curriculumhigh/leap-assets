<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Center P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 6, 6, -6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.8;

        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 8] }
        });

        var circle = board.create('circle', [P, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var angM = 130 * Math.PI / 180;
        var M = board.create('point', [R * Math.cos(angM), R * Math.sin(angM)], {
            name: 'M', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-14, 8] }
        });

        var angQ = 50 * Math.PI / 180;
        var Q = board.create('point', [R * Math.cos(angQ), R * Math.sin(angQ)], {
            name: 'Q', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 8] }
        });

        var angS = angQ + Math.PI;
        var S = board.create('point', [R * Math.cos(angS), R * Math.sin(angS)], {
            name: 'S', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-14, -12] }
        });

        var angR = -40 * Math.PI / 180;
        var ptR = board.create('point', [R * Math.cos(angR), R * Math.sin(angR)], {
            name: 'R', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -12] }
        });

        board.create('segment', [M, ptR], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [P, S], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [Q, S], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
    </script>
</body>
</html>
