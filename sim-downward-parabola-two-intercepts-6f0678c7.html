<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downward Parabola Two X-Intercepts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { width: 300px; height: 300px; margin: 0; padding: 6px; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; width: calc(100% - 20px); height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 3, 6, -6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // X-axis with arrows on both ends
        board.create('arrow', [[-1.8, 0], [5.8, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 }
        });

        // Y-axis with arrows on both ends
        board.create('arrow', [[0, -5.5], [0, 2.8]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 }
        });

        // Origin label "0"
        board.create('text', [-0.35, -0.4, '0'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false, anchorX: 'middle'
        });

        // Axis labels
        board.create('text', [5.5, -0.5, '<i>x</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.25, 2.5, '<i>y</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });

        // Parabola: f(x) = -(x-1)(x-3) = -(x^2 - 4x + 3)
        // Opens downward, x-intercepts at x=1 and x=3, vertex at (2, 1)
        board.create('functiongraph', [
            function(x) { return -(x - 1) * (x - 3); }
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
    </script>
</body>
</html>
