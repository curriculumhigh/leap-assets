<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Graph — Feet to Metres</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1100, 2350, 7800, -350],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var i;

        /* ── Minor grid (every 100 units) ── */
        for (i = 0; i <= 7000; i += 100) {
            if (i % 1000 === 0) continue;
            board.create('segment', [[i, -350], [i, 2350]], {
                strokeColor: '#C8CCD0', strokeWidth: 0.3,
                fixed: true, highlight: false
            });
        }
        for (i = 0; i <= 2000; i += 100) {
            if (i % 500 === 0) continue;
            board.create('segment', [[-1100, i], [7800, i]], {
                strokeColor: '#C8CCD0', strokeWidth: 0.3,
                fixed: true, highlight: false
            });
        }

        /* ── Major grid ── */
        for (i = 0; i <= 7000; i += 1000) {
            if (i === 0) continue;
            board.create('segment', [[i, -350], [i, 2350]], {
                strokeColor: '#A0A8B0', strokeWidth: 0.5,
                fixed: true, highlight: false
            });
        }
        for (i = 0; i <= 2000; i += 500) {
            if (i === 0) continue;
            board.create('segment', [[-1100, i], [7800, i]], {
                strokeColor: '#A0A8B0', strokeWidth: 0.5,
                fixed: true, highlight: false
            });
        }

        /* ── Axes ── */
        board.create('arrow', [[-200, 0], [7500, 0]], {
            strokeColor: '#444444', strokeWidth: 1.0,
            lastArrow: { type: 2, size: 4 },
            fixed: true, highlight: false
        });
        board.create('arrow', [[0, -200], [0, 2250]], {
            strokeColor: '#444444', strokeWidth: 1.0,
            lastArrow: { type: 2, size: 4 },
            fixed: true, highlight: false
        });

        /* ── Tick marks and labels — x-axis (every 1000) ── */
        var xTicks = [1000, 2000, 3000, 4000, 5000, 6000, 7000];
        for (var t = 0; t < xTicks.length; t++) {
            var xv = xTicks[t];
            board.create('segment', [[xv, -40], [xv, 40]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
            board.create('text', [xv, -130, String(xv)], {
                fontSize: 7, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        /* ── Tick marks and labels — y-axis (every 500) ── */
        var yTicks = [500, 1000, 1500, 2000];
        for (var u = 0; u < yTicks.length; u++) {
            var yv = yTicks[u];
            board.create('segment', [[-40, yv], [40, yv]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
            board.create('text', [-200, yv, String(yv)], {
                fontSize: 7, anchorX: 'right', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        /* ── Origin label ── */
        board.create('text', [-200, -130, '0'], {
            fontSize: 7, anchorX: 'right', anchorY: 'middle',
            color: '#444444', fixed: true, highlight: false
        });

        /* ── Axis labels ── */
        board.create('text', [7100, -220, '\\textit{Feet}'], {
            fontSize: 9, useKatex: true, anchorX: 'middle',
            color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [250, 2200, '\\textit{Metres}'], {
            fontSize: 9, useKatex: true, anchorX: 'left',
            color: '#444444', fixed: true, highlight: false
        });

        /* ── Conversion line ── */
        var x1 = -400;
        var y1 = (7 / 31) * x1 + 500;
        var x2 = 7200;
        var y2 = (7 / 31) * x2 + 500;

        board.create('segment', [[x1, y1], [x2, y2]], {
            strokeColor: '#222222', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        /* ── Key points (marked, no labels) ── */
        board.create('point', [0, 500], {
            name: '', size: 2.5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [6200, 1900], {
            name: '', size: 2.5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
