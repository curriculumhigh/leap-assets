<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line — Midpoint Distance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.0, 4.5, 10.0, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BLUE = '#2563EB';
        var DARK = '#222222';
        var GRAY = '#444444';

        // ── Number line (horizontal arrow both directions) ──────────────
        board.create('arrow', [[-3.5, 0], [9.5, 0]], {
            strokeColor: DARK, strokeWidth: 2.0,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Tick marks and tick labels (−3 to 9) ────────────────────────
        var i;
        for (i = -3; i <= 9; i++) {
            board.create('segment', [[i, -0.25], [i, 0.25]], {
                strokeColor: GRAY, strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            board.create('text', [i, -0.75, String(i)], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 11, color: GRAY,
                fixed: true, highlight: false
            });
        }

        // ── Solid dots at 2, 5, and 8 ──────────────────────────────────
        board.create('point', [2, 0], {
            name: '', size: 5, fillColor: DARK, strokeColor: DARK,
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [5, 0], {
            name: '', size: 5, fillColor: DARK, strokeColor: DARK,
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [8, 0], {
            name: '', size: 5, fillColor: DARK, strokeColor: DARK,
            fixed: true, highlight: false, showInfobox: false
        });

        // ── Bold labels below the dots ──────────────────────────────────
        board.create('text', [2, -1.65, '\\textbf{2}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: DARK,
            useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [5, -1.65, '\\textbf{5}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: DARK,
            useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [8, -1.65, '\\textbf{8}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: DARK,
            useKatex: true,
            fixed: true, highlight: false
        });

        // ── Dashed vertical line at midpoint (5) ───────────────────────
        board.create('segment', [[5, -0.3], [5, 2.2]], {
            strokeColor: BLUE, strokeWidth: 1.5, dash: 2,
            fixed: true, highlight: false
        });

        // ── Horizontal distance arrows ──────────────────────────────────
        var arrowY = 2.0;

        // Left arrow: 5 → 2
        board.create('arrow', [[5, arrowY], [2, arrowY]], {
            strokeColor: BLUE, strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Right arrow: 5 → 8
        board.create('arrow', [[5, arrowY], [8, arrowY]], {
            strokeColor: BLUE, strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Distance labels "3" above the arrows ───────────────────────
        board.create('text', [3.5, 3.1, '\\textbf{3}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: BLUE,
            useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [6.5, 3.1, '\\textbf{3}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: BLUE,
            useKatex: true,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
