<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpendicular Chord Bisector Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.8, 5.8, 5.8, -5.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;

        // ── Center C ────────────────────────────────────────────────────
        var C = board.create('point', [0, 0], {
            name: 'C', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10], fontWeight: 'bold' }
        });

        // ── Circle ──────────────────────────────────────────────────────
        var circle = board.create('circle', [C, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Diameter KL (vertical) ──────────────────────────────────────
        var K = board.create('point', [0, R], {
            name: 'K', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, 6], fontWeight: 'bold' }
        });
        var L = board.create('point', [0, -R], {
            name: 'L', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10], fontWeight: 'bold' }
        });
        board.create('segment', [K, L], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Chord GH (horizontal) at M ──────────────────────────────────
        var MY = 1.2;
        var halfChord = Math.sqrt(R * R - MY * MY);

        var M = board.create('point', [0, MY], {
            name: 'M', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10], fontWeight: 'bold' }
        });

        var G = board.create('point', [-halfChord, MY], {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-16, -10], fontWeight: 'bold' }
        });
        var H = board.create('point', [halfChord, MY], {
            name: 'H', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10], fontWeight: 'bold' }
        });
        board.create('segment', [G, H], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle mark at M ───────────────────────────────────────
        var sqSize = 0.4;
        board.create('polygon', [
            [sqSize, MY],
            [sqSize, MY + sqSize],
            [0, MY + sqSize],
            [0, MY]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false,
            hasInnerPoints: false
        });

        // ── Arc labels ──────────────────────────────────────────────────
        var angK = Math.PI / 2;
        var angG = Math.atan2(G.Y(), G.X());
        var angGNorm = (angG + 2 * Math.PI) % (2 * Math.PI);
        var angKNorm = (angK + 2 * Math.PI) % (2 * Math.PI);
        var midLeft = (angKNorm + angGNorm) / 2;
        var labelR = R + 1.0;

        board.create('text', [
            labelR * Math.cos(midLeft),
            labelR * Math.sin(midLeft),
            '(3x+7)^\\circ'
        ], {
            useKatex: true, fontSize: 12, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var angH = Math.atan2(H.Y(), H.X());
        var angHNorm = (angH + 2 * Math.PI) % (2 * Math.PI);
        var midRight = (angKNorm + angHNorm) / 2;

        board.create('text', [
            labelR * Math.cos(midRight),
            labelR * Math.sin(midRight),
            '(5x-3)^\\circ'
        ], {
            useKatex: true, fontSize: 12, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
