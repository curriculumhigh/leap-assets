<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-45-90 Triangle Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 6.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [0, 0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var B = board.create('point', [4.5, 0], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });
        var C = board.create('point', [4.5, 4.5], { name: '', fixed: true, size: 2, color: '#222222', highlight: false });

        // Triangle edges
        board.create('segment', [A, B], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [C, A], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // Right angle marker at B (bottom-right)
        var sqSize = 0.45;
        var sq1 = board.create('point', [4.5 - sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [4.5 - sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [4.5, sqSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [sq1, sq2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // 45° angle arc at C (top-right)
        board.create('nonReflexAngle', [A, C, B], {
            radius: 0.7,
            strokeColor: '#DC2626',
            strokeWidth: 1.5,
            fillColor: '#DC2626',
            fillOpacity: 0.06,
            fixed: true,
            name: '',
            withLabel: false,
            highlight: false
        });

        // 45° label
        board.create('text', [4.15, 3.7, '45^\\circ'], {
            useKatex: true,
            fontSize: 13,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Side labels
        // Vertical leg (right side, B to C) — labeled "11"
        board.create('text', [5.15, 2.25, '11'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Horizontal leg (bottom, A to B) — labeled "x"
        board.create('text', [2.25, -0.55, 'x'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });
    </script>
</body>
</html>
