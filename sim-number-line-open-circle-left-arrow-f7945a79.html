<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x &lt; -3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.2, 2, 2.2, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Number line (main horizontal line with arrows on both ends)
        board.create('arrow', [[-7.8, 0], [1.8, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });
        board.create('arrow', [[1.8, 0], [-7.8, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels from -7 to 1
        var i;
        for (i = -7; i <= 1; i++) {
            // Tick mark (smaller)
            board.create('segment', [[i, -0.15], [i, 0.15]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            // Label (closer to tick)
            board.create('text', [i, -0.4, String(i)], {
                fontSize: 12,
                anchorX: 'middle',
                anchorY: 'top',
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Shaded ray from -3 to the left (blue arrow)
        board.create('arrow', [[-3, 0], [-7.8, 0]], {
            strokeColor: '#2563EB',
            strokeWidth: 2.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Open circle at x = -3
        board.create('point', [-3, 0], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: '#2563EB',
            strokeWidth: 2,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
