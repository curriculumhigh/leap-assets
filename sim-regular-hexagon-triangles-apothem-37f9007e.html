<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Hexagon — 6 Congruent Triangles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;
        var angles = [0, 60, 120, 180, 240, 300];
        var vertices = [];
        var vertexPoints = [];

        for (var i = 0; i < 6; i++) {
            var a = angles[i] * Math.PI / 180;
            var x = R * Math.cos(a);
            var y = R * Math.sin(a);
            vertices.push([x, y]);
            vertexPoints.push(
                board.create('point', [x, y], {
                    name: '', fixed: true, visible: false
                })
            );
        }

        var center = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2.5, color: '#222222',
            highlight: false, showInfobox: false
        });

        var hexPoly = board.create('polygon', vertexPoints, {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        for (var i = 0; i < 6; i++) {
            board.create('segment', [center, vertexPoints[i]], {
                strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        var shadedTriangle = board.create('polygon', [center, vertexPoints[4], vertexPoints[5]], {
            fillColor: '#2563EB', fillOpacity: 0.12,
            borders: { strokeColor: '#555555', strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var midBottom = [(vertices[4][0] + vertices[5][0]) / 2, (vertices[4][1] + vertices[5][1]) / 2];
        var apothemEnd = board.create('point', midBottom, {
            name: '', fixed: true, visible: false
        });

        board.create('segment', [center, apothemEnd], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2,
            fixed: true, highlight: false
        });

        var tickSize = 0.28;
        var footX = midBottom[0];
        var footY = midBottom[1];
        board.create('segment', [[footX + tickSize, footY], [footX + tickSize, footY + tickSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[footX + tickSize, footY + tickSize], [footX, footY + tickSize]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });

        board.create('text', [footX, footY - 0.55, 'b'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        var apothemMidY = (0 + footY) / 2;
        board.create('text', [footX + 0.5, apothemMidY, 'h'], {
            useKatex: true, fontSize: 15, color: '#DC2626',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
