<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle KLM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 6, 7, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.5, -0.6, '\\textit{x}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.3, 5.5, '\\textit{y}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Vertices — size 2
        var K = board.create('point', [-3, 0], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        var L = board.create('point', [0, 4], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        var M = board.create('point', [5, -8], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        // Triangle edges (no fill)
        board.create('segment', [K, L], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [L, M], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [M, K], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Vertex labels (KaTeX, name + coordinates)
        // K(-3, 0) — at x = -3.5, above the point
        board.create('text', [-3.5, 0.8, 'K(-3,\\, 0)'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle'
        });

        // L(0, 4) — to the left and slightly above to avoid y-axis
        board.create('text', [-0.3, 4.7, 'L(0,\\, 4)'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'right'
        });

        // M(5, -8) — shifted left, below the point
        board.create('text', [4.7, -8.8, 'M(5,\\, -8)'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false,
            useKatex: true, anchorX: 'right'
        });
    </script>
</body>
</html>
