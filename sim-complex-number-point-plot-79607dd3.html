<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Number on the Complex Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 150px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .panel-message { line-height: 1.8; text-align: center; font-size: 14px; }
        .panel-line { margin-bottom: 8px; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="panel-message">
                    <div class="panel-line">The point</div>
                    <div class="panel-line" id="panel-point"></div>
                    <div class="panel-line">represents the complex number</div>
                    <div class="panel-line" id="panel-complex"></div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        // Render panel message in two math parts
        katex.render('(a,\\, b)', document.getElementById('panel-point'), { throwOnError: false, displayMode: false });
        katex.render('a + bi', document.getElementById('panel-complex'), { throwOnError: false, displayMode: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 4.5, 5.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Custom axes
        var xAxis = board.create('arrow', [[-1.2, 0], [5.2, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, -1.2], [0, 4.2]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Axis labels
        board.create('text', [4.6, -0.5, 'Real axis'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [-0.1, 4.3, 'Imaginary axis'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false, anchorX: 'right'
        });

        // Point coordinates (generic a, b)
        var px = 3.5;
        var py = 2.5;

        // Dotted reference lines
        // Vertical dotted line from point down to x-axis
        board.create('segment', [[px, py], [px, 0]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });
        // Horizontal dotted line from point left to y-axis
        board.create('segment', [[px, py], [0, py]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // The point (a, b)
        board.create('point', [px, py], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Point label (a, b)
        board.create('text', [px + 0.2, py + 0.3, '(a,\\, b)'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Label 'a' on x-axis (at the foot of vertical dotted line)
        board.create('text', [px, -0.45, 'a'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false, useKatex: true, anchorX: 'middle'
        });

        // Label 'b' on y-axis (at the foot of horizontal dotted line)
        board.create('text', [-0.35, py, 'b'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false, useKatex: true, anchorX: 'middle', anchorY: 'middle'
        });

        // Small tick marks at a on x-axis and b on y-axis
        board.create('segment', [[px, -0.08], [px, 0.08]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[-0.08, py], [0.08, py]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
