<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilation — Triangle DEF and D'E'F'</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 11, 17, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [16.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 10.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Colors
        var COL_PRE = '#2563EB';   // blue — pre-image
        var COL_IMG = '#059669';   // green — image
        var COL_CENTER = '#DC2626'; // red — center of dilation

        // ── Pre-image: Triangle DEF (blue) ──────────────────────────────
        var D = board.create('point', [1, 3], {
            name: '', size: 4, color: COL_PRE, fixed: true, highlight: false, showInfobox: false
        });
        var E = board.create('point', [5, 1], {
            name: '', size: 4, color: COL_PRE, fixed: true, highlight: false, showInfobox: false
        });
        var F = board.create('point', [3, -2], {
            name: '', size: 4, color: COL_PRE, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [D, E, F], {
            fillColor: COL_PRE, fillOpacity: 0.08,
            borders: { strokeColor: COL_PRE, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Pre-image labels
        board.create('text', [0.2, 3.5, 'D(1, 3)'], {
            fontSize: 12, color: COL_PRE, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [5.3, 1.4, 'E(5, 1)'], {
            fontSize: 12, color: COL_PRE, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [3.3, -2.8, 'F(3, -2)'], {
            fontSize: 12, color: COL_PRE, fixed: true, highlight: false, useKatex: true
        });

        // ── Image: Triangle D'E'F' (green) ──────────────────────────────
        var Dp = board.create('point', [3, 9], {
            name: '', size: 4, color: COL_IMG, fixed: true, highlight: false, showInfobox: false
        });
        var Ep = board.create('point', [15, 3], {
            name: '', size: 4, color: COL_IMG, fixed: true, highlight: false, showInfobox: false
        });
        var Fp = board.create('point', [9, -6], {
            name: '', size: 4, color: COL_IMG, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [Dp, Ep, Fp], {
            fillColor: COL_IMG, fillOpacity: 0.08,
            borders: { strokeColor: COL_IMG, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Image labels
        board.create('text', [1.5, 9.5, "D'(3, 9)"], {
            fontSize: 12, color: COL_IMG, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [12.8, 3.6, "E'(15, 3)"], {
            fontSize: 12, color: COL_IMG, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [9.3, -6.8, "F'(9, -6)"], {
            fontSize: 12, color: COL_IMG, fixed: true, highlight: false, useKatex: true
        });

        // ── Center of dilation: Origin ──────────────────────────────────
        board.create('point', [0, 0], {
            name: '', size: 3, color: COL_CENTER, fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-1.6, -0.8, '\\text{Center}'], {
            fontSize: 12, color: COL_CENTER, fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
