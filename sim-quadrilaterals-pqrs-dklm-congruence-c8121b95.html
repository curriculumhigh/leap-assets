<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilaterals PQRS and DKLM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var COL_95  = '#2563EB';
        var COL_72  = '#059669';
        var COL_118 = '#D97706';
        var COL_75  = '#7C3AED';
        var COL_EDGE = '#555555';
        var COL_VERT = '#222222';
        var COL_SIDE = '#444444';

        function buildQuad(sides, angsDeg, x0, y0, hdg0Deg) {
            var v = [];
            var x = x0, y = y0;
            var h = hdg0Deg * Math.PI / 180;
            v.push([x, y]);
            for (var i = 0; i < 4; i++) {
                x += sides[i] * Math.cos(h);
                y += sides[i] * Math.sin(h);
                v.push([x, y]);
                var nextAng = angsDeg[(i + 1) % 4] * Math.PI / 180;
                h += (Math.PI - nextAng);
            }
            return v;
        }

        var masterV = buildQuad([5, 8, 6, 10], [95, 72, 118, 75], 0, 0, 0);

        function centroid4(v) {
            return [(v[0][0]+v[1][0]+v[2][0]+v[3][0])/4,
                    (v[0][1]+v[1][1]+v[2][1]+v[3][1])/4];
        }

        function shiftVerts(v, dx, dy) {
            var out = [];
            for (var i = 0; i < v.length; i++) out.push([v[i][0]+dx, v[i][1]+dy]);
            return out;
        }

        function centerAt(v, cx, cy) {
            var c = centroid4(v);
            return shiftVerts(v, cx - c[0], cy - c[1]);
        }

        function reflectX(v) {
            var c = centroid4(v);
            var out = [];
            for (var i = 0; i < v.length; i++) {
                out.push([2*c[0] - v[i][0], v[i][1]]);
            }
            return out;
        }

        var pqrs = centerAt([masterV[0], masterV[1], masterV[2], masterV[3]], 7, 6);

        var dklmRaw = [masterV[3], masterV[0], masterV[1], masterV[2]];
        var dklmRef = reflectX(dklmRaw);
        var dklm = centerAt(dklmRef, 21, 6);

        var all = pqrs.concat(dklm);
        var bMinX = 1e9, bMaxX = -1e9, bMinY = 1e9, bMaxY = -1e9;
        for (var i = 0; i < all.length; i++) {
            if (all[i][0] < bMinX) bMinX = all[i][0];
            if (all[i][0] > bMaxX) bMaxX = all[i][0];
            if (all[i][1] < bMinY) bMinY = all[i][1];
            if (all[i][1] > bMaxY) bMaxY = all[i][1];
        }
        var margin = 2.5;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [bMinX - margin, bMaxY + margin, bMaxX + margin, bMinY - margin],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        function interiorBisector(verts, idx) {
            var n = verts.length;
            var prev = verts[(idx - 1 + n) % n];
            var curr = verts[idx];
            var next = verts[(idx + 1) % n];
            var ax = prev[0]-curr[0], ay = prev[1]-curr[1];
            var bx = next[0]-curr[0], by = next[1]-curr[1];
            var la = Math.sqrt(ax*ax+ay*ay), lb = Math.sqrt(bx*bx+by*by);
            var bisX = ax/la + bx/lb, bisY = ay/la + by/lb;
            var bl = Math.sqrt(bisX*bisX + bisY*bisY);
            if (bl < 1e-9) { bisX = -ay/la; bisY = ax/la; bl = 1; }
            bisX /= bl; bisY /= bl;
            var c = centroid4(verts);
            if (bisX*(c[0]-curr[0]) + bisY*(c[1]-curr[1]) < 0) {
                bisX = -bisX; bisY = -bisY;
            }
            return [bisX, bisY];
        }

        function sideLabelXY(verts, i0, i1, offset) {
            var mx = (verts[i0][0]+verts[i1][0])/2;
            var my = (verts[i0][1]+verts[i1][1])/2;
            var dx = verts[i1][0]-verts[i0][0], dy = verts[i1][1]-verts[i0][1];
            var len = Math.sqrt(dx*dx+dy*dy);
            var nx = -dy/len, ny = dx/len;
            var c = centroid4(verts);
            if (nx*(c[0]-mx)+ny*(c[1]-my) > 0) { nx=-nx; ny=-ny; }
            return [mx+offset*nx, my+offset*ny];
        }

        function vertexOffset(verts, idx) {
            var c = centroid4(verts);
            var dx = verts[idx][0]-c[0], dy = verts[idx][1]-c[1];
            var len = Math.sqrt(dx*dx+dy*dy);
            return [Math.round((dx/len)*14), Math.round((dy/len)*14)];
        }

        function drawQuad(verts, names, sideLengths, angleDeg, angleColors) {
            var pts = [];
            for (var i = 0; i < 4; i++) {
                var off = vertexOffset(verts, i);
                pts.push(board.create('point', verts[i], {
                    name: names[i], fixed: true, size: 2, color: COL_VERT, highlight: false,
                    showInfobox: false,
                    label: { fontSize: 13, color: COL_VERT, offset: [off[0], off[1]],
                             cssStyle: 'font-weight:700' }
                }));
            }

            board.create('polygon', pts, {
                fillColor: 'none', fillOpacity: 0,
                borders: { strokeColor: COL_EDGE, strokeWidth: 1.5 },
                vertices: { visible: false },
                fixed: true, highlight: false
            });

            for (var a = 0; a < 4; a++) {
                var prevPt = pts[(a - 1 + 4) % 4];
                var currPt = pts[a];
                var nextPt = pts[(a + 1) % 4];

                var arcR = angleDeg[a] < 80 ? 0.5 : (angleDeg[a] > 110 ? 0.65 : 0.55);
                board.create('nonReflexAngle', [prevPt, currPt, nextPt], {
                    radius: arcR, fillColor: angleColors[a], fillOpacity: 0.12,
                    strokeColor: angleColors[a], strokeWidth: 1.2,
                    fixed: true, name: '', withLabel: false, highlight: false
                });

                var bis = interiorBisector(verts, a);
                var labelDist = angleDeg[a] < 80 ? 1.5 : (angleDeg[a] > 110 ? 1.1 : 1.3);
                board.create('text', [
                    verts[a][0] + labelDist * bis[0],
                    verts[a][1] + labelDist * bis[1],
                    angleDeg[a] + '\u00B0'
                ], {
                    fontSize: 10, color: angleColors[a],
                    anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false, cssStyle: 'font-weight:600'
                });
            }

            var edges = [[0,1],[1,2],[2,3],[3,0]];
            for (var s = 0; s < 4; s++) {
                var pos = sideLabelXY(verts, edges[s][0], edges[s][1], 0.55);
                board.create('text', [pos[0], pos[1], sideLengths[s]], {
                    fontSize: 11, color: COL_SIDE, anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false, cssStyle: 'font-weight:600'
                });
            }
        }

        drawQuad(
            pqrs,
            ['P', 'Q', 'R', 'S'],
            ['5', '8', '6', '10'],
            [95, 72, 118, 75],
            [COL_95, COL_72, COL_118, COL_75]
        );

        drawQuad(
            dklm,
            ['D', 'K', 'L', 'M'],
            ['10', '5', '8', '6'],
            [75, 95, 72, 118],
            [COL_75, COL_95, COL_72, COL_118]
        );
    </script>
</body>
</html>
