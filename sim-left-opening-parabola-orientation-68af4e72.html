<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left-Opening Parabola with Orientation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 4.8, 11.5, -4.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 3
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 3
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [11.0, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.25, 4.4, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Parametric curve: x = 9sin²(t), y = 3cos(t) for t ∈ [0, π]
        board.create('curve', [
            function(t) { return 9 * Math.sin(t) * Math.sin(t); },
            function(t) { return 3 * Math.cos(t); },
            0, Math.PI
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Key points — unlabeled solid dots
        board.create('point', [0, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [9, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [0, -3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });

        // Orientation arrows — direction: (0,-3) → (9,0) → (0,3)
        var arrowThetas = [Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4];

        for (var i = 0; i < arrowThetas.length; i++) {
            var t0 = arrowThetas[i] + 0.08;
            var t1 = arrowThetas[i] - 0.08;

            var x0 = 9 * Math.sin(t0) * Math.sin(t0);
            var y0 = 3 * Math.cos(t0);
            var x1 = 9 * Math.sin(t1) * Math.sin(t1);
            var y1 = 3 * Math.cos(t1);

            board.create('arrow', [[x0, y0], [x1, y1]], {
                strokeColor: '#222222',
                strokeWidth: 1.5,
                lastArrow: { type: 2, size: 5 },
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
