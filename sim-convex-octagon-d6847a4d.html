<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convex Octagon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 4, 4.5, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var angles = [0, 50, 95, 140, 185, 230, 275, 325];
        var offsets = [0.15, -0.18, 0.12, -0.10, 0.20, -0.15, 0.08, -0.12];
        var R = 3;

        var vertices = [];
        for (var i = 0; i < angles.length; i++) {
            var rad = angles[i] * Math.PI / 180;
            var r = R + offsets[i];
            var x = r * Math.cos(rad);
            var y = r * Math.sin(rad);
            var pt = board.create('point', [x, y], {
                visible: false,
                fixed: true,
                name: ''
            });
            vertices.push(pt);
        }

        board.create('polygon', vertices, {
            fillColor: '#D1D5DB',
            fillOpacity: 0.15,
            borders: {
                strokeColor: '#555555',
                strokeWidth: 2
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
