<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Parabolas — Root Behavior</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 7, 8, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [7.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 6.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Colors
        var COL_P = '#222222';
        var COL_Q = '#2563EB';
        var COL_R = '#059669';

        // p(x) = (x - 1)^2 - 3 — opens up, vertex (1, -3), two x-intercepts
        board.create('functiongraph', [
            function(x) { return (x - 1) * (x - 1) - 3; }
        ], { strokeColor: COL_P, strokeWidth: 1.8, fixed: true, highlight: false });

        // q(x) = -(x + 2)^2 - 1 — opens down, vertex (-2, -1), no real roots
        board.create('functiongraph', [
            function(x) { return -((x + 2) * (x + 2)) - 1; }
        ], { strokeColor: COL_Q, strokeWidth: 1.5, fixed: true, highlight: false });

        // r(x) = (x - 3)^2 — opens up, vertex (3, 0), one repeated root
        board.create('functiongraph', [
            function(x) { return (x - 3) * (x - 3); }
        ], { strokeColor: COL_R, strokeWidth: 1.5, fixed: true, highlight: false });

        // Function labels — positioned close to curves but offset to avoid overlap
        board.create('text', [-3.2, 5.5, 'p(x)'], {
            fontSize: 13, color: COL_P, useKatex: true, fixed: true, highlight: false
        });

        board.create('text', [-4.2, -2.2, 'q(x)'], {
            fontSize: 13, color: COL_Q, useKatex: true, fixed: true, highlight: false
        });

        board.create('text', [5.2, 3.2, 'r(x)'], {
            fontSize: 13, color: COL_R, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
