<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9, 15, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var D = board.create('point', [1, 7], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var E = board.create('point', [1, 1], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var F = board.create('point', [12, 1], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle polygon — no fill
        board.create('polygon', [D, E, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels — bold
        board.create('text', [0.2, 7.5, '<b>D</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [0.2, 0.2, '<b>E</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [12.3, 0.2, '<b>F</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });

        // Side labels
        // '9' on DE — left of midpoint
        board.create('text', [-0.2, 4, '9'], {
            fontSize: 15, color: '#222222', anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // '40' on EF — below midpoint
        board.create('text', [6.5, 0.15, '40'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        // '41' on DF — above-right of midpoint
        board.create('text', [7.2, 4.6, '41'], {
            fontSize: 15, color: '#222222', anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // Right-angle square marker at E (interior corner)
        var sq = 0.7;
        board.create('segment', [[1, 1 + sq], [1 + sq, 1 + sq]], {
            strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[1 + sq, 1 + sq], [1 + sq, 1]], {
            strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
        });
    </script>
</body>
</html>
