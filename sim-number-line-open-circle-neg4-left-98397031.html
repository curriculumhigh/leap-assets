<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x &lt; -4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-11.5, 2.5, 11.5, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Number line (main horizontal axis) ──────────────────────────
        board.create('arrow', [[-11, 0], [11, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        board.create('arrow', [[11, 0], [-11, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var i;
        for (i = -10; i <= 10; i++) {
            // Tick mark
            board.create('segment', [[i, -0.25], [i, 0.25]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [i, -0.7, String(i)], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 11, color: '#333333',
                fixed: true, highlight: false
            });
        }

        // ── Shaded ray from −4 to the left (red) ───────────────────────
        board.create('arrow', [[-4, 0], [-10.8, 0]], {
            strokeColor: '#DC2626', strokeWidth: 2.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Open circle at −4 ──────────────────────────────────────────
        board.create('point', [-4, 0], {
            name: '',
            size: 5,
            fillColor: '#ffffff',
            strokeColor: '#DC2626',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
