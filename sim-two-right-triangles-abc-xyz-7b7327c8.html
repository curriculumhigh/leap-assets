<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Right Triangles — ABC and XYZ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var COL_BLUE = '#2563EB';
        var COL_RED = '#DC2626';
        var COL_AXIS = '#444444';
        var COL_GRID = '#D1D5DB';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 12, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Manual 1×1 grid lines ──────────────────────────────────────
        var bb = board.getBoundingBox();
        var xMinG = Math.ceil(bb[0]);
        var xMaxG = Math.floor(bb[2]);
        var yMinG = Math.ceil(bb[3]);
        var yMaxG = Math.floor(bb[1]);
        var gridAttrs = { strokeColor: COL_GRID, strokeWidth: 0.4, fixed: true, highlight: false };
        var i;
        for (i = xMinG; i <= xMaxG; i++) {
            board.create('segment', [[i, bb[3] - 1], [i, bb[1] + 1]], gridAttrs);
        }
        for (i = yMinG; i <= yMaxG; i++) {
            board.create('segment', [[bb[0] - 1, i], [bb[2] + 1, i]], gridAttrs);
        }

        // ── Axes (no built-in ticks — we add our own) ──────────────────
        var xAxis = board.create('arrow', [[bb[0], 0], [bb[2], 0]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        var yAxis = board.create('arrow', [[0, bb[3]], [0, bb[1]]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Manual tick marks + labels every 2 units ────────────────────
        var tickLen = 0.15;

        // X-axis ticks
        for (i = xMinG; i <= xMaxG; i += 2) {
            if (i === 0) continue;
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: COL_AXIS, strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -0.55, String(i)], {
                fontSize: 11, color: COL_AXIS, anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // Y-axis ticks
        for (i = yMinG; i <= yMaxG; i += 2) {
            if (i === 0) continue;
            board.create('segment', [[-tickLen, i], [tickLen, i]], {
                strokeColor: COL_AXIS, strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [-0.45, i, String(i)], {
                fontSize: 11, color: COL_AXIS, anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis name labels
        board.create('text', [11.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Blue triangle ABC ───────────────────────────────────────────
        var A = board.create('point', [2, 1], {
            name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false, showInfobox: false
        });
        var B = board.create('point', [6, 1], {
            name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false, showInfobox: false
        });
        var C = board.create('point', [2, 4], {
            name: '', size: 2, color: COL_BLUE, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_BLUE, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Blue labels
        board.create('text', [1.2, 0.5, 'A'], { fontSize: 13, color: COL_BLUE, useKatex: true, fixed: true, highlight: false });
        board.create('text', [6.3, 0.5, 'B'], { fontSize: 13, color: COL_BLUE, useKatex: true, fixed: true, highlight: false });
        board.create('text', [1.2, 4.2, 'C'], { fontSize: 13, color: COL_BLUE, useKatex: true, fixed: true, highlight: false });

        // Right-angle marker at A (blue)
        var raSize = 0.4;
        board.create('segment', [[2, 1 + raSize], [2 + raSize, 1 + raSize]], {
            strokeColor: COL_BLUE, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[2 + raSize, 1 + raSize], [2 + raSize, 1]], {
            strokeColor: COL_BLUE, strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Red triangle XYZ ────────────────────────────────────────────
        var X = board.create('point', [2, -1], {
            name: '', size: 2, color: COL_RED, fixed: true, highlight: false, showInfobox: false
        });
        var Y = board.create('point', [10, -1], {
            name: '', size: 2, color: COL_RED, fixed: true, highlight: false, showInfobox: false
        });
        var Z = board.create('point', [2, 5], {
            name: '', size: 2, color: COL_RED, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [X, Y, Z], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_RED, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Red labels
        board.create('text', [1.2, -1.5, 'X'], { fontSize: 13, color: COL_RED, useKatex: true, fixed: true, highlight: false });
        board.create('text', [10.3, -1.5, 'Y'], { fontSize: 13, color: COL_RED, useKatex: true, fixed: true, highlight: false });
        board.create('text', [1.2, 5.3, 'Z'], { fontSize: 13, color: COL_RED, useKatex: true, fixed: true, highlight: false });

        // Right-angle marker at X (red)
        board.create('segment', [[2, -1 + raSize], [2 + raSize, -1 + raSize]], {
            strokeColor: COL_RED, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[2 + raSize, -1 + raSize], [2 + raSize, -1]], {
            strokeColor: COL_RED, strokeWidth: 1.2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
