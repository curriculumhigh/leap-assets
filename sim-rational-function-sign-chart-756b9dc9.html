<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of h(x)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 8, 10, -8],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    firstArrow: { type: 2, size: 6 },
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    firstArrow: { type: 2, size: 6 },
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4,
                gridX: 1,
                gridY: 1
            }
        });

        // Axis labels
        board.create('text', [9.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // h(x) = (x+1)(x-6) / ((x+3)(x-4))
        function h(x) {
            return (x + 1) * (x - 6) / ((x + 3) * (x - 4));
        }

        // Draw curve in segments to avoid connecting across asymptotes
        // Segment 1: (-inf, -3)
        board.create('functiongraph', [h, -8, -3.05], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Segment 2: (-3, 4)
        board.create('functiongraph', [h, -2.95, 3.95], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Segment 3: (4, inf)
        board.create('functiongraph', [h, 4.05, 10], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
    </script>
</body>
</html>
