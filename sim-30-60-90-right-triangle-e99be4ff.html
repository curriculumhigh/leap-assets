<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-60-90 Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 8.5, 8.5, -1.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var Ax = 1, Ay = 1;
        var Bx = 1, By = 4.5;
        var Cx = 1 + 3.5 * Math.sqrt(3), Cy = 1; // ≈ 7.06

        var A = board.create('point', [Ax, Ay], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var B = board.create('point', [Bx, By], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var C = board.create('point', [Cx, Cy], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        // ── Triangle edges (no fill) ────────────────────────────────────
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at A ─────────────────────────────────────
        var sqSize = 0.4;
        var sq1 = board.create('point', [Ax, Ay + sqSize], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [Ax + sqSize, Ay + sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [Ax + sqSize, Ay], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── 60° angle arc at B ──────────────────────────────────────────
        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.6,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // 60° label — placed along the bisector of the angle at B
        var baDx = 0, baDy = -1;
        var bcDx = Cx - Bx, bcDy = Cy - By;
        var bcLen = Math.sqrt(bcDx * bcDx + bcDy * bcDy);
        bcDx /= bcLen; bcDy /= bcLen;
        var bisX = baDx + bcDx, bisY = baDy + bcDy;
        var bisLen = Math.sqrt(bisX * bisX + bisY * bisY);
        bisX /= bisLen; bisY /= bisLen;

        var labelDist = 1.1;
        board.create('text', [Bx + bisX * labelDist, By + bisY * labelDist, '60^\\circ'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels (outside the triangle) ─────────────────────────
        // Hypotenuse BC — label "22" outside (above-right of the segment midpoint)
        var hypMidX = (Bx + Cx) / 2;
        var hypMidY = (By + Cy) / 2;
        var bcSegDx = Cx - Bx, bcSegDy = Cy - By;
        var bcSegLen = Math.sqrt(bcSegDx * bcSegDx + bcSegDy * bcSegDy);
        var normX = bcSegDy / bcSegLen;
        var normY = -bcSegDx / bcSegLen;
        var toAx = Ax - hypMidX, toAy = Ay - hypMidY;
        if (normX * toAx + normY * toAy > 0) {
            normX = -normX; normY = -normY;
        }
        var hypLabelDist = 0.55;
        board.create('text', [hypMidX + normX * hypLabelDist, hypMidY + normY * hypLabelDist, '22'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Vertical leg AB — label "y" to the left
        var abMidX = (Ax + Bx) / 2;
        var abMidY = (Ay + By) / 2;
        board.create('text', [abMidX - 0.55, abMidY, 'y'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Horizontal leg AC — label "x" below
        var acMidX = (Ax + Cx) / 2;
        var acMidY = (Ay + Cy) / 2;
        board.create('text', [acMidX, acMidY - 0.55, 'x'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
