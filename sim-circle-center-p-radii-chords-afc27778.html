<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Center P — Radii and Chords</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;

        // ── Center ──────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10], useKatex: true }
        });

        // ── Circle ──────────────────────────────────────────────────────
        var circle = board.create('circle', [P, R], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fixed: true, highlight: false
        });

        // ── Points on the circle ────────────────────────────────────────
        // M — upper left (~130°)
        var angM = 130 * Math.PI / 180;
        var M = board.create('point', [R * Math.cos(angM), R * Math.sin(angM)], {
            name: 'M', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, 6], useKatex: true }
        });

        // R_pt — upper right (~50°)
        var angR = 50 * Math.PI / 180;
        var R_pt = board.create('point', [R * Math.cos(angR), R * Math.sin(angR)], {
            name: 'R', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 6], useKatex: true }
        });

        // S — lower right (~310°)
        var angS = 310 * Math.PI / 180;
        var S = board.create('point', [R * Math.cos(angS), R * Math.sin(angS)], {
            name: 'S', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10], useKatex: true }
        });

        // T — lower left (~230°)
        var angT = 230 * Math.PI / 180;
        var T = board.create('point', [R * Math.cos(angT), R * Math.sin(angT)], {
            name: 'T', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-14, -10], useKatex: true }
        });

        // ── Radii (center to each point) ────────────────────────────────
        board.create('segment', [P, M], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, R_pt], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, S], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, T], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Chords ──────────────────────────────────────────────────────
        // Chord MT (connects M and T)
        board.create('segment', [M, T], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Chord RS (connects R and S)
        board.create('segment', [R_pt, S], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
    </script>
</body>
</html>
