<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Plane — Trail Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 8, 7, -6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Manual grid at every integer
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]), xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]), yMax = Math.floor(bb[1]);
        var i;
        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // X-axis
        board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            highlight: false,
            ticks: {
                insertTicks: false,
                ticksDistance: 1,
                minorTicks: 0,
                majorHeight: 6,
                drawLabels: true,
                label: { fontSize: 10, color: '#666', offset: [0, -12] },
                strokeColor: '#999'
            }
        });

        // Y-axis
        board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            highlight: false,
            ticks: {
                insertTicks: false,
                ticksDistance: 1,
                minorTicks: 0,
                majorHeight: 6,
                drawLabels: true,
                label: { fontSize: 10, color: '#666', offset: [-12, 0] },
                strokeColor: '#999'
            }
        });

        // Labeled locations
        var pts = [
            { xy: [-3, 4],  name: 'Ranger Station', dx: -0.4, dy: 0.5,  ax: 'right' },
            { xy: [4, 6],   name: 'Waterfall',      dx: -0.3, dy: 0.5,  ax: 'right' },
            { xy: [2, -3],  name: 'Campsite',       dx: 0.3,  dy: -0.6, ax: 'left' },
            { xy: [-5, -2], name: 'Lookout Tower',  dx: 0.3,  dy: -0.6, ax: 'left' },
            { xy: [1, 5],   name: 'Cave',           dx: 0.35, dy: 0.4,  ax: 'left' }
        ];
        pts.forEach(function (p) {
            board.create('point', p.xy, {
                size: 4, strokeColor: '#222222', fillColor: '#222222',
                fixed: true, highlight: false, name: '', showInfobox: false
            });
            board.create('text', [p.xy[0] + p.dx, p.xy[1] + p.dy, p.name], {
                anchorX: p.ax, anchorY: 'middle', fontSize: 11, color: '#222222', fixed: true, highlight: false
            });
        });

        // Scale note
        board.create('text', [-6.7, -5.4, 'Scale: 1 unit = 1 km'], {
            anchorX: 'left', anchorY: 'middle', fontSize: 10, color: '#666666', fixed: true, highlight: false
        });
    </script>
</body>
</html>
