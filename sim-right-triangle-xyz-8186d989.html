<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle XYZ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 9.5, 13, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var Z = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var Y = board.create('point', [10, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var X = board.create('point', [0, 7], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle (no fill)
        board.create('polygon', [X, Z, Y], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right angle marker at Z
        var sqSize = 0.8;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [sq1, sq2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Vertex labels
        board.create('text', [-0.9, 7.4, '\\textbf{X}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [-1.1, -0.8, '\\textbf{Z}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [10.4, -0.8, '\\textbf{Y}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false
        });

        // Side length labels
        // XZ = 7 (vertical leg, left side)
        board.create('text', [-1.8, 3.5, '7'], {
            useKatex: true, fontSize: 14, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // YZ = 10 (horizontal leg, bottom)
        board.create('text', [5, -1.3, '10'], {
            useKatex: true, fontSize: 14, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

    </script>
</body>
</html>
