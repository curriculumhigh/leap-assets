<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Curve with t-values</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 160px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 4px;
        }
        .t-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .t-table th {
            text-align: center; padding: 4px 2px; border-bottom: 2px solid #444;
            font-weight: 600; color: #444;
        }
        .t-table td {
            text-align: center; padding: 5px 2px; border-bottom: 1px solid #e5e7eb;
            color: #333;
        }
        .t-table tr:last-child td { border-bottom: none; }
        .orientation-note {
            font-size: 11px; color: #666; line-height: 1.5; margin-top: 4px;
        }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Parameter table</div>
                    <table class="t-table">
                        <thead>
                            <tr>
                                <th id="th-t"></th>
                                <th id="th-x"></th>
                                <th id="th-y"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>−3</td><td>−5</td><td>6</td></tr>
                            <tr><td>−2</td><td>−1</td><td>−2</td></tr>
                            <tr><td>−1</td><td>1</td><td>−3</td></tr>
                            <tr><td>0</td><td>3</td><td>−2</td></tr>
                            <tr><td>2</td><td>5</td><td>1</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="orientation-note">
                    Arrows show direction of increasing <span id="t-inline"></span>.
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        // Render KaTeX in panel
        katex.render('t', document.getElementById('th-t'), { throwOnError: false });
        katex.render('x', document.getElementById('th-x'), { throwOnError: false });
        katex.render('y', document.getElementById('th-y'), { throwOnError: false });
        katex.render('t', document.getElementById('t-inline'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 8.5, 7.5, -5.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Create axes manually to force ticksDistance: 1
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                ticksDistance: 1,
                minorTicks: 0,
                insertTicks: false,
                label: { fontSize: 11, offset: [0, -14] }
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                ticksDistance: 1,
                minorTicks: 0,
                insertTicks: false,
                label: { fontSize: 11, offset: [-20, 0] }
            }
        });

        // Axis labels
        board.create('text', [7.1, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 8.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Data: [t, x, y, labelOffsetX, labelOffsetY]
        var data = [
            [-3, -5,  6,  -0.3,  0.7],
            [-2, -1, -2,  -1.8, -0.1],
            [-1,  1, -3,   0.3, -0.8],
            [ 0,  3, -2,   0.4, -0.7],
            [ 2,  5,  1,   0.4,  0.5]
        ];

        // Plot key points
        for (var i = 0; i < data.length; i++) {
            var d = data[i];
            board.create('point', [d[1], d[2]], {
                name: '', size: 5, color: '#222222', fixed: true,
                highlight: false, showInfobox: false
            });

            // t-value label
            var tStr = 't = ' + d[0];
            board.create('text', [d[1] + d[3], d[2] + d[4], tStr], {
                useKatex: true, fontSize: 12, color: '#222222',
                fixed: true, highlight: false, anchorX: 'middle'
            });
        }

        // Smooth curve through points using Catmull-Rom spline
        var pts = [];
        for (var i = 0; i < data.length; i++) {
            pts.push([data[i][1], data[i][2]]);
        }

        function catmullRom(p0, p1, p2, p3, t) {
            var t2 = t * t;
            var t3 = t2 * t;
            var v = 0.5 * (
                (2 * p1) +
                (-p0 + p2) * t +
                (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
                (-p0 + 3 * p1 - 3 * p2 + p3) * t3
            );
            return v;
        }

        function getSplinePoint(s) {
            var n = pts.length;
            if (s <= 0) return { x: pts[0][0], y: pts[0][1] };
            if (s >= n - 1) return { x: pts[n-1][0], y: pts[n-1][1] };

            var i = Math.floor(s);
            var t = s - i;

            var i0 = Math.max(i - 1, 0);
            var i1 = i;
            var i2 = Math.min(i + 1, n - 1);
            var i3 = Math.min(i + 2, n - 1);

            var x = catmullRom(pts[i0][0], pts[i1][0], pts[i2][0], pts[i3][0], t);
            var y = catmullRom(pts[i0][1], pts[i1][1], pts[i2][1], pts[i3][1], t);
            return { x: x, y: y };
        }

        // Draw smooth curve
        board.create('curve', [
            function(s) { return getSplinePoint(s).x; },
            function(s) { return getSplinePoint(s).y; },
            0, pts.length - 1
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Directional arrowheads along the curve
        var arrowPositions = [0.5, 1.8, 2.5, 3.3];
        var arrowSize = 0.35;

        for (var a = 0; a < arrowPositions.length; a++) {
            var s = arrowPositions[a];
            var ds = 0.05;
            var p1 = getSplinePoint(s - ds);
            var p2 = getSplinePoint(s + ds);
            var dx = p2.x - p1.x;
            var dy = p2.y - p1.y;
            var len = Math.sqrt(dx * dx + dy * dy);
            if (len < 0.001) continue;
            dx /= len; dy /= len;

            var tip = getSplinePoint(s);

            board.create('line', [
                [tip.x - dx * arrowSize, tip.y - dy * arrowSize],
                [tip.x, tip.y]
            ], {
                straightFirst: false, straightLast: false,
                strokeColor: '#222222', strokeWidth: 1.8,
                lastArrow: { type: 2, size: 5 },
                fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
