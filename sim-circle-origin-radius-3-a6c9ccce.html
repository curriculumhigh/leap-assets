<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Centered at Origin, Radius 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 5, 5, -5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.6, -0.35, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 4.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Circle centered at origin with radius 3
        var O = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        board.create('circle', [O, 3], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // Key points at axis intersections
        var p1 = board.create('point', [3, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var p2 = board.create('point', [0, 3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var p3 = board.create('point', [-3, 0], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var p4 = board.create('point', [0, -3], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels — offset to avoid axis/tick overlap
        board.create('text', [3.15, -0.45, '(3,\\, 0)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [0.3, 3.25, '(0,\\, 3)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [-4.35, -0.45, '(-3,\\, 0)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [0.3, -3.45, '(0,\\, -3)'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
