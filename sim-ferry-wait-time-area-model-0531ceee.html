<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferry Wait Time Area Model</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.8, 18.5, 12, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Shaded strips (drawn first so they sit behind everything) ───

        // Blue vertical strip 0 ≤ x ≤ 3
        var blueP1 = board.create('point', [0, 0], { visible: false, name: '' });
        var blueP2 = board.create('point', [3, 0], { visible: false, name: '' });
        var blueP3 = board.create('point', [3, 15], { visible: false, name: '' });
        var blueP4 = board.create('point', [0, 15], { visible: false, name: '' });
        board.create('polygon', [blueP1, blueP2, blueP3, blueP4], {
            fillColor: '#2563EB', fillOpacity: 0.12,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Green horizontal strip 0 ≤ y ≤ 3
        var greenP1 = board.create('point', [0, 0], { visible: false, name: '' });
        var greenP2 = board.create('point', [9, 0], { visible: false, name: '' });
        var greenP3 = board.create('point', [9, 3], { visible: false, name: '' });
        var greenP4 = board.create('point', [0, 3], { visible: false, name: '' });
        board.create('polygon', [greenP1, greenP2, greenP3, greenP4], {
            fillColor: '#059669', fillOpacity: 0.12,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Dashed boundary lines ───────────────────────────────────────

        // x = 3 dashed line
        board.create('segment', [[3, 0], [3, 15]], {
            strokeColor: '#444444', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // y = 3 dashed line
        board.create('segment', [[0, 3], [9, 3]], {
            strokeColor: '#444444', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // ── Rectangle outline (0,0) to (9,15) ──────────────────────────

        var rP1 = board.create('point', [0, 0], { visible: false, name: '' });
        var rP2 = board.create('point', [9, 0], { visible: false, name: '' });
        var rP3 = board.create('point', [9, 15], { visible: false, name: '' });
        var rP4 = board.create('point', [0, 15], { visible: false, name: '' });
        board.create('polygon', [rP1, rP2, rP3, rP4], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Custom axes with arrows ─────────────────────────────────────

        // X-axis: arrow from origin extending slightly past 9
        board.create('arrow', [[0, 0], [10, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Y-axis: arrow from origin extending slightly past 15
        board.create('arrow', [[0, 0], [0, 16.5]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── X-axis ticks (every 1 unit) and labels (at 0, 3, 6, 9) ────

        var xTickLabels = { 0: true, 3: true, 6: true, 9: true };
        for (var i = 1; i <= 9; i++) {
            // Tick mark
            board.create('segment', [[i, -0.3], [i, 0.3]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            // Label only at 3, 6, 9
            if (xTickLabels[i] && i !== 0) {
                board.create('text', [i, -1.0, String(i)], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 11, color: '#333', fixed: true, highlight: false
                });
            }
        }

        // ── Y-axis ticks (every 3 units) and labels ────────────────────

        var yTickVals = [3, 6, 9, 12, 15];
        for (var j = 0; j < yTickVals.length; j++) {
            var yv = yTickVals[j];
            // Tick mark
            board.create('segment', [[-0.25, yv], [0.25, yv]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            // Label
            board.create('text', [-0.7, yv, String(yv)], {
                anchorX: 'right', anchorY: 'middle',
                fontSize: 11, color: '#333', fixed: true, highlight: false
            });
        }

        // ── Origin label "0" ────────────────────────────────────────────

        board.create('text', [-0.5, -1.0, '0'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 11, color: '#333', fixed: true, highlight: false
        });

        // ── Axis name labels ────────────────────────────────────────────

        // X-axis label (centered below)
        board.create('text', [4.5, -2.8, 'Wait for Ferry A (0\u20139 min)'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 12, color: '#333', fixed: true, highlight: false
        });

        // Y-axis label (rotated, left side)
        board.create('text', [-2.2, 7.5, 'Wait for Ferry B (0\u201315 min)'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 12, color: '#333', fixed: true, highlight: false,
            display: 'html',
            cssStyle: 'transform: rotate(-90deg); transform-origin: center center; white-space: nowrap;'
        });

        // ── Strip labels ────────────────────────────────────────────────

        // Blue strip label "x ≤ 3" at (1.5, 10)
        board.create('text', [1.5, 10, 'x \\leq 3'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#2563EB',
            useKatex: true, fixed: true, highlight: false
        });

        // Green strip label "y ≤ 3" at (6.5, 1.5)
        board.create('text', [6.5, 1.5, 'y \\leq 3'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#059669',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
