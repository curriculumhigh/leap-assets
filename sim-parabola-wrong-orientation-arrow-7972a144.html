<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola y=x²−6x+10 — Wrong Arrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 11, 6.5, -0.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.1, -0.3, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.15, 10.6, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Parabola y = x^2 - 6x + 10 = (x-3)^2 + 1
        board.create('functiongraph', [
            function(x) { return x * x - 6 * x + 10; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Vertex point at (3, 1)
        board.create('point', [3, 1], {
            name: '',
            size: 4,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Orientation arrow on the right branch pointing RIGHT (wrong orientation)
        var cx = 4.5;
        var cy = cx * cx - 6 * cx + 10;
        var slope = 2 * cx - 6;
        var mag = Math.sqrt(1 + slope * slope);
        var ux = 1 / mag;
        var uy = slope / mag;

        var halfLen = 0.55;

        var tailX = cx - halfLen * ux;
        var tailY = cy - halfLen * uy;
        var headX = cx + halfLen * ux;
        var headY = cy + halfLen * uy;

        var tailPt = board.create('point', [tailX, tailY], { visible: false, fixed: true, name: '' });
        var headPt = board.create('point', [headX, headY], { visible: false, fixed: true, name: '' });

        board.create('arrow', [tailPt, headPt], {
            strokeColor: '#222222',
            strokeWidth: 2.2,
            lastArrow: { type: 2, size: 8 },
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
