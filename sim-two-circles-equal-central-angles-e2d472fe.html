<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Circles — Equal Central Angles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 6, 11.5, -6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_OUTLINE = '#555555';
        var COL_POINT = '#222222';
        var COL_ARC = '#DC2626';
        var COL_ANGLE = '#222222';

        var rJ = 3.5;
        var Jx = -1.5, Jy = 0;

        var J = board.create('point', [Jx, Jy], {
            name: 'J', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-4, -16] }
        });

        var circleJ = board.create('circle', [J, rJ], {
            strokeColor: COL_OUTLINE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        var halfAngle = (95 / 2) * Math.PI / 180;
        var midAngle_J = Math.PI / 2;

        var angA = midAngle_J + halfAngle;
        var angB = midAngle_J - halfAngle;

        var A = board.create('point', [Jx + rJ * Math.cos(angA), Jy + rJ * Math.sin(angA)], {
            name: 'A', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-16, 4] }
        });

        var B = board.create('point', [Jx + rJ * Math.cos(angB), Jy + rJ * Math.sin(angB)], {
            name: 'B', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [8, 4] }
        });

        board.create('segment', [J, A], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [J, B], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        var radMidJB_x = (Jx + Jx + rJ * Math.cos(angB)) / 2;
        var radMidJB_y = (Jy + Jy + rJ * Math.sin(angB)) / 2;
        board.create('text', [
            radMidJB_x + 0.35,
            radMidJB_y - 0.15,
            '7'
        ], {
            useKatex: true, fontSize: 13, color: COL_POINT,
            anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        board.create('arc', [J, B, A], {
            strokeColor: COL_ARC, strokeWidth: 5, fixed: true, highlight: false, layer: 8
        });

        board.create('nonReflexAngle', [B, J, A], {
            radius: 0.6,
            fillColor: COL_ANGLE, fillOpacity: 0.06,
            strokeColor: COL_ANGLE, strokeWidth: 1,
            fixed: true, name: '', withLabel: false
        });

        var angleLabelDist_J = 0.95;
        board.create('text', [
            Jx + angleLabelDist_J * Math.cos(midAngle_J),
            Jy + angleLabelDist_J * Math.sin(midAngle_J),
            '95^\\circ'
        ], {
            useKatex: true, fontSize: 12, color: COL_ANGLE,
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        var rK = 1.5;
        var Kx = 6.5, Ky = 0;

        var K = board.create('point', [Kx, Ky], {
            name: 'K', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-4, -16] }
        });

        var circleK = board.create('circle', [K, rK], {
            strokeColor: COL_OUTLINE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        var midAngle_K = Math.PI / 2;

        var angC = midAngle_K + halfAngle;
        var angD = midAngle_K - halfAngle;

        var C = board.create('point', [Kx + rK * Math.cos(angC), Ky + rK * Math.sin(angC)], {
            name: 'C', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [-16, 4] }
        });

        var D = board.create('point', [Kx + rK * Math.cos(angD), Ky + rK * Math.sin(angD)], {
            name: 'D', fixed: true, size: 2, color: COL_POINT, highlight: false,
            label: { fontSize: 14, color: COL_POINT, offset: [8, 4] }
        });

        board.create('segment', [K, C], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [K, D], {
            strokeColor: COL_OUTLINE, strokeWidth: 1.5, fixed: true, highlight: false
        });

        var radMidKD_x = (Kx + Kx + rK * Math.cos(angD)) / 2;
        var radMidKD_y = (Ky + Ky + rK * Math.sin(angD)) / 2;
        board.create('text', [
            radMidKD_x + 0.25,
            radMidKD_y - 0.1,
            '3'
        ], {
            useKatex: true, fontSize: 13, color: COL_POINT,
            anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        board.create('arc', [K, D, C], {
            strokeColor: COL_ARC, strokeWidth: 5, fixed: true, highlight: false, layer: 8
        });

        board.create('nonReflexAngle', [D, K, C], {
            radius: 0.35,
            fillColor: COL_ANGLE, fillOpacity: 0.06,
            strokeColor: COL_ANGLE, strokeWidth: 1,
            fixed: true, name: '', withLabel: false
        });

        var angleLabelDist_K = 0.65;
        board.create('text', [
            Kx + angleLabelDist_K * Math.cos(midAngle_K),
            Ky + angleLabelDist_K * Math.sin(midAngle_K),
            '95^\\circ'
        ], {
            useKatex: true, fontSize: 11, color: COL_ANGLE,
            anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
    </script>
</body>
</html>
