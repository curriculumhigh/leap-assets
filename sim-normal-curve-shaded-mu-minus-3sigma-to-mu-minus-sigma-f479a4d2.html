<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Curve — Shaded Region μ−3σ to μ−σ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        /* Normal PDF: mean=0, sd=1 */
        var MU = 0;
        var SIGMA = 1;
        var INV_SQRT_2PI = 1 / Math.sqrt(2 * Math.PI);

        function normalPDF(x) {
            var z = (x - MU) / SIGMA;
            return INV_SQRT_2PI * Math.exp(-0.5 * z * z) / SIGMA;
        }

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.3, 0.52, 4.3, -0.15],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Horizontal axis line ───────────────────────────────── */
        board.create('arrow', [[-4.1, 0], [4.1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        /* ── Shaded region: μ−3σ to μ−σ ─────────────────────────── */
        var SHADE_LEFT = MU - 3 * SIGMA;
        var SHADE_RIGHT = MU - 1 * SIGMA;
        var N_PTS = 120;

        var shadePtsX = [];
        var shadePtsY = [];

        /* Bottom-left corner on axis */
        shadePtsX.push(SHADE_LEFT);
        shadePtsY.push(0);

        /* Curve from left to right */
        for (var i = 0; i <= N_PTS; i++) {
            var xi = SHADE_LEFT + (SHADE_RIGHT - SHADE_LEFT) * i / N_PTS;
            shadePtsX.push(xi);
            shadePtsY.push(normalPDF(xi));
        }

        /* Bottom-right corner on axis */
        shadePtsX.push(SHADE_RIGHT);
        shadePtsY.push(0);

        board.create('curve', [shadePtsX, shadePtsY], {
            strokeWidth: 0,
            fillColor: '#222222',
            fillOpacity: 0.12,
            fixed: true,
            highlight: false
        });

        /* ── Normal curve ────────────────────────────────────────── */
        board.create('functiongraph', [
            function(x) { return normalPDF(x); },
            -4.0, 4.0
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        /* ── Tick marks and labels ───────────────────────────────── */
        var ticks = [
            { x: -3, label: '\\mu - 3\\sigma' },
            { x: -2, label: '\\mu - 2\\sigma' },
            { x: -1, label: '\\mu - \\sigma' },
            { x:  0, label: '\\mu' },
            { x:  1, label: '\\mu + \\sigma' },
            { x:  2, label: '\\mu + 2\\sigma' },
            { x:  3, label: '\\mu + 3\\sigma' }
        ];

        for (var t = 0; t < ticks.length; t++) {
            var tx = ticks[t].x;

            /* Tick mark */
            board.create('segment', [[tx, -0.012], [tx, 0.012]], {
                strokeColor: '#444444',
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });

            /* Label below tick */
            board.create('text', [tx, -0.04, ticks[t].label], {
                useKatex: true,
                fontSize: 12,
                anchorX: 'middle',
                anchorY: 'top',
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
