<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Intersecting Lines — Angle Expressions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 4.5, 5.5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var O = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        var L = 5.0;

        var lineAng1 = 30 * Math.PI / 180;
        var P1 = board.create('point', [L * Math.cos(lineAng1), L * Math.sin(lineAng1)], {
            visible: false, fixed: true, name: ''
        });
        var P2 = board.create('point', [-L * Math.cos(lineAng1), -L * Math.sin(lineAng1)], {
            visible: false, fixed: true, name: ''
        });

        var lineAng2 = 150 * Math.PI / 180;
        var P3 = board.create('point', [L * Math.cos(lineAng2), L * Math.sin(lineAng2)], {
            visible: false, fixed: true, name: ''
        });
        var P4 = board.create('point', [-L * Math.cos(lineAng2), -L * Math.sin(lineAng2)], {
            visible: false, fixed: true, name: ''
        });

        board.create('segment', [P1, P2], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [P3, P4], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var labelR = 2.4;

        board.create('text', [
            labelR * Math.cos(90 * Math.PI / 180),
            labelR * Math.sin(90 * Math.PI / 180),
            '(11x + 14)^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [
            labelR * Math.cos(180 * Math.PI / 180),
            labelR * Math.sin(180 * Math.PI / 180),
            '(18x + 21)^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [
            labelR * Math.cos(270 * Math.PI / 180),
            labelR * Math.sin(270 * Math.PI / 180),
            '(15x - 6)^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [
            labelR * Math.cos(0),
            labelR * Math.sin(0),
            '(20x + 11)^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
