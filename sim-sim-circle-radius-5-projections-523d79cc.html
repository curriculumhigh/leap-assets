<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Radius 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 7, 7, -7],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            }
        });

        // Axis labels
        board.create('text', [6.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 6.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        var COL_E = '#2563EB';
        var COL_P = '#059669';

        // Circle
        var O = board.create('point', [0, 0], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0.35, -0.5, 'O'], { fontSize: 12, color: '#222222', fixed: true });

        board.create('circle', [O, 5], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Fixed points A, B, C, D
        board.create('point', [5, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [5.3, -0.6, 'A(5,0)'], { fontSize: 12, color: '#222222', fixed: true, useKatex: true });

        board.create('point', [0, 5], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0.4, 5.4, 'B(0,5)'], { fontSize: 12, color: '#222222', fixed: true, useKatex: true });

        board.create('point', [-5, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-5.3, -0.7, 'C(-5,0)'], { fontSize: 12, color: '#222222', fixed: true, useKatex: true, anchorX: 'right' });

        board.create('point', [0, -5], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0.4, -5.5, 'D(0,-5)'], { fontSize: 12, color: '#222222', fixed: true, useKatex: true });

        // Point E(3,4)
        board.create('point', [3, 4], {
            name: '', size: 4, color: COL_E, fixed: true, showInfobox: false, highlight: false
        });
        board.create('text', [3.3, 4.5, 'E(3,4)'], { fontSize: 12, color: COL_E, fixed: true, useKatex: true });

        // Point P(-3, 4)
        board.create('point', [-3, 4], {
            name: '', size: 4, color: COL_P, fixed: true, showInfobox: false, highlight: false
        });
        board.create('text', [-3.3, 4.5, 'P(x,y)'], { fontSize: 12, color: COL_P, fixed: true, useKatex: true, anchorX: 'right' });
    </script>
</body>
</html>
