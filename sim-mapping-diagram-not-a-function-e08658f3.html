<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping Diagram</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 200px; height: 200px; margin: 0 auto; position: relative; }
        svg { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Titles -->
            <text x="52" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">Input</text>
            <text x="148" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#222222">Output</text>

            <!-- Left oval (rounded rect) -->
            <rect x="20" y="24" width="64" height="160" rx="32" ry="32" fill="none" stroke="#555555" stroke-width="1.5"/>

            <!-- Right oval (rounded rect) — same size -->
            <rect x="116" y="24" width="64" height="160" rx="32" ry="32" fill="none" stroke="#555555" stroke-width="1.5"/>

            <!-- Input values (blue) — centered vertically -->
            <text x="46" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">1</text>
            <text x="46" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">4</text>

            <!-- Output values (red) — 4 values evenly spaced -->
            <text x="154" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">4</text>
            <text x="154" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">8</text>
            <text x="154" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">3</text>
            <text x="154" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">6</text>

            <!-- Arrowhead marker -->
            <defs>
                <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
                    <polygon points="0 0, 6 2, 0 4" fill="#222222"/>
                </marker>
            </defs>

            <!-- Arrows start right after input numbers and end just before output numbers -->
            <!-- 1→4 -->
            <line x1="56" y1="85" x2="140" y2="65" stroke="#222222" stroke-width="1" marker-end="url(#arrowhead)"/>

            <!-- 1→8 -->
            <line x1="56" y1="88" x2="140" y2="95" stroke="#222222" stroke-width="1" marker-end="url(#arrowhead)"/>

            <!-- 4→3 -->
            <line x1="56" y1="125" x2="140" y2="125" stroke="#222222" stroke-width="1" marker-end="url(#arrowhead)"/>

            <!-- 4→6 -->
            <line x1="56" y1="128" x2="140" y2="155" stroke="#222222" stroke-width="1" marker-end="url(#arrowhead)"/>
        </svg>
    </div>
</body>
</html>
