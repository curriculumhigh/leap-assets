<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filling a Pool</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 340, 9.2, -50],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 75
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis variable labels near arrow tips
        board.create('text', [8.8, -18, '<i>x</i>'], { fontSize: 13, fixed: true, highlight: false });
        board.create('text', [0.2, 330, '<i>y</i>'], { fontSize: 13, fixed: true, highlight: false });

        // Axis descriptor labels
        board.create('text', [4.5, -38, 'Time (minutes)'], { fontSize: 10, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [-2.3, 310, 'Volume'], { fontSize: 9, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [-2.3, 290, '(gallons)'], { fontSize: 9, fixed: true, highlight: false, anchorX: 'middle' });

        // Line through (2, 90) and (5, 225): slope = 45, y = 45x
        board.create('functiongraph', [
            function(x) { return 45 * x; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Key points
        board.create('point', [2, 90], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [5, 225], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels
        board.create('text', [2.3, 75, '(2, 90)'], {
            fontSize: 10, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [5.3, 210, '(5, 225)'], {
            fontSize: 10, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
