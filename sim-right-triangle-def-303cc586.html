<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 8.5, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        // E at bottom-left (right angle), D at bottom-right, F at top-left
        var Ex = 1, Ey = 0.5;
        var Dx = 7, Dy = 0.5;
        var Fx = 1, Fy = 6;

        var E = board.create('point', [Ex, Ey], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false
        });
        var D = board.create('point', [Dx, Dy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false
        });
        var F = board.create('point', [Fx, Fy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false
        });

        // Triangle polygon — no fill
        board.create('polygon', [E, D, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at E
        var sq = 0.45;
        var raP1 = board.create('point', [Ex + sq, Ey], { visible: false, fixed: true, name: '' });
        var raP2 = board.create('point', [Ex + sq, Ey + sq], { visible: false, fixed: true, name: '' });
        var raP3 = board.create('point', [Ex, Ey + sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [raP1, raP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raP2, raP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Vertex labels (KaTeX, bold italic)
        board.create('text', [Ex - 0.55, Ey - 0.45, '\\boldsymbol{E}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [Dx + 0.55, Dy - 0.45, '\\boldsymbol{D}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [Fx - 0.55, Fy + 0.45, '\\boldsymbol{F}'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Side labels (KaTeX italic)
        // p = DE (horizontal, bottom) — centered below
        board.create('text', [(Ex + Dx) / 2, Ey - 0.65, 'p'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // q = EF (vertical, left) — centered to the left
        board.create('text', [Ex - 0.65, (Ey + Fy) / 2, 'q'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // r = DF (hypotenuse) — centered along the diagonal, offset outward
        var midHx = (Dx + Fx) / 2;
        var midHy = (Dy + Fy) / 2;
        // Normal direction pointing outward (away from E / upper-right)
        var hypLen = Math.sqrt((Dx - Fx) * (Dx - Fx) + (Dy - Fy) * (Dy - Fy));
        var nx = (Fy - Dy) / hypLen;
        var ny = (Dx - Fx) / hypLen;
        var offset = 0.55;
        board.create('text', [midHx + nx * offset, midHy + ny * offset, 'r'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
