<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Revenue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
            <div class="coord-tooltip" id="tooltip"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 108, 5.8, -14],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid lines ──────────────────────────────────────────────────
        var i;
        for (i = 1; i <= 5; i++) {
            board.create('segment', [[i, 0], [i, 100]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 20; i <= 100; i += 20) {
            board.create('segment', [[0, i], [5.4, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        board.create('arrow', [[0, 0], [5.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });
        board.create('arrow', [[0, 0], [0, 105]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        // ── Tick marks and labels — x-axis ──────────────────────────────
        var tickLen = 1.5;
        for (i = 1; i <= 5; i++) {
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -5, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Tick marks and labels — y-axis ──────────────────────────────
        var xTickLen = 0.12;
        for (i = 20; i <= 100; i += 20) {
            board.create('segment', [[-xTickLen, i], [xTickLen, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [-0.3, i, String(i)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Axis name labels (KaTeX) ────────────────────────────────────
        board.create('text', [5.3, -7, 'n'], {
            fontSize: 14, useKatex: true, fixed: true, highlight: false, color: '#222222'
        });
        board.create('text', [0.25, 104, 'a_n'], {
            fontSize: 14, useKatex: true, fixed: true, highlight: false, color: '#222222'
        });

        // ── Tooltip setup ───────────────────────────────────────────────
        var tooltip = document.getElementById('tooltip');
        var boardWrapper = document.querySelector('.board-wrapper');

        function showTooltip(pt, color) {
            var xVal = Math.round(pt.X());
            var yVal = Math.round(pt.Y());
            var latex = '\\color{' + color + '}{(' + xVal + ',\\,' + yVal + ')}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';

            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var boardEl = document.getElementById('board');
            var boardRect = boardEl.getBoundingClientRect();
            var wrapperRect = boardWrapper.getBoundingClientRect();

            var sx = coords.scrCoords[1] + (boardRect.left - wrapperRect.left);
            var sy = coords.scrCoords[2] + (boardRect.top - wrapperRect.top);

            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // ── Data points with hover tooltips ─────────────────────────────
        var data = [[1, 84], [2, 72], [3, 60], [4, 48]];
        var COL_PT = '#222222';

        for (i = 0; i < data.length; i++) {
            (function(idx) {
                var pt = board.create('point', data[idx], {
                    name: '', size: 4, color: COL_PT, fixed: true,
                    showInfobox: false, highlight: true,
                    highlightFillColor: COL_PT,
                    highlightStrokeColor: COL_PT,
                    highlightSize: 5
                });
                pt.on('over', function() { showTooltip(pt, COL_PT); });
                pt.on('out', function() { hideTooltip(); });
            })(i);
        }
    </script>
</body>
</html>
