<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Sequence Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 37, 5.7, -3],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // X-axis
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        // Y-axis — tick marks every 1 unit, labels only every 5
        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9, offset: [-12, 0] },
                minorTicks: 4,
                majorHeight: 6,
                minorHeight: 4,
                ticksDistance: 5,
                insertTicks: true
            }
        });

        // Grid
        board.create('grid', [], {
            strokeColor: '#D1D5DB',
            strokeWidth: 0.4
        });

        // Axis labels
        board.create('text', [5.2, -1.4, 'n'], { useKatex: true, fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.2, 35.8, 'f(n)'], { useKatex: true, fontSize: 11, fixed: true, highlight: false });

        // Discrete points — reduced size
        var pts = [[1, 8], [2, 15], [3, 22], [4, 29]];
        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 3, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
