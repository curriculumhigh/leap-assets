<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g(x) Distractor — All Closed</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 11, 15.5, -7],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Manually create axes for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 2,
                insertTicks: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        // Axis labels
        board.create('text', [14.8, -0.7, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 10.4, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        var COL = '#222222';
        var PT_SIZE = 4;
        var SEG_WIDTH = 1.8;

        // --- Segment 1: y = 8 on [2, 5] — both closed (distractor: right should be open) ---
        board.create('segment', [[2, 8], [5, 8]], {
            strokeColor: COL, strokeWidth: SEG_WIDTH, fixed: true, highlight: false
        });
        board.create('point', [2, 8], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });
        board.create('point', [5, 8], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });

        // --- Segment 2: y = 3 on [5, 7] — both closed (distractor: right should be open) ---
        board.create('segment', [[5, 3], [7, 3]], {
            strokeColor: COL, strokeWidth: SEG_WIDTH, fixed: true, highlight: false
        });
        board.create('point', [5, 3], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });
        board.create('point', [7, 3], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });

        // --- Segment 3: y = -1 on [7, 10] — both closed (correct) ---
        board.create('segment', [[7, -1], [10, -1]], {
            strokeColor: COL, strokeWidth: SEG_WIDTH, fixed: true, highlight: false
        });
        board.create('point', [7, -1], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });
        board.create('point', [10, -1], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });

        // --- Segment 4: y = -4 on [10, 13] — both closed (distractor: left should be open) ---
        board.create('segment', [[10, -4], [13, -4]], {
            strokeColor: COL, strokeWidth: SEG_WIDTH, fixed: true, highlight: false
        });
        board.create('point', [10, -4], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });
        board.create('point', [13, -4], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            fillColor: COL, strokeColor: COL, strokeWidth: 1.5
        });

        // Function label — name only
        board.create('text', [0.8, 9.5, 'g(x)'], {
            fontSize: 11, color: COL, useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
