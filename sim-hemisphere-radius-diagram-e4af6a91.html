<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemisphere Diagram — Radius 8 m</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 7.5, 6.5, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var cx = 0;
        var cy = 0;
        var R = 4.5;
        var ellipseB = 1.2;

        // Shading: filled dome region
        var shadePts = [];
        var shadeN = 80;
        for (var i = 0; i <= shadeN; i++) {
            var t = Math.PI - (Math.PI * i / shadeN);
            shadePts.push([cx + R * Math.cos(t), cy + R * Math.sin(t)]);
        }
        for (var i = 0; i <= shadeN; i++) {
            var t = 0 + (Math.PI * i / shadeN);
            shadePts.push([cx + R * Math.cos(t), cy - ellipseB * Math.sin(t)]);
        }

        var shadeXs = [];
        var shadeYs = [];
        for (var i = 0; i < shadePts.length; i++) {
            shadeXs.push(shadePts[i][0]);
            shadeYs.push(shadePts[i][1]);
        }

        board.create('curve', [shadeXs, shadeYs], {
            strokeWidth: 0,
            fillColor: '#9CA3AF',
            fillOpacity: 0.07,
            fixed: true,
            highlight: false
        });

        // Dome arc (half-circle)
        board.create('curve', [
            function(t) { return cx + R * Math.cos(t); },
            function(t) { return cy + R * Math.sin(t); },
            0, Math.PI
        ], {
            strokeColor: '#555555',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Base ellipse — back half (dashed)
        board.create('curve', [
            function(t) { return cx + R * Math.cos(t); },
            function(t) { return cy - ellipseB * Math.sin(t); },
            Math.PI, 2 * Math.PI
        ], {
            strokeColor: '#555555',
            strokeWidth: 1.2,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Base ellipse — front half (solid)
        board.create('curve', [
            function(t) { return cx + R * Math.cos(t); },
            function(t) { return cy - ellipseB * Math.sin(t); },
            0, Math.PI
        ], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // Radius line: center to right edge of base
        board.create('segment', [[cx, cy], [cx + R, cy]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // Center point
        board.create('point', [cx, cy], {
            name: '',
            size: 2,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Endpoint on curve edge
        board.create('point', [cx + R, cy], {
            name: '',
            size: 2,
            color: '#DC2626',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Radius label
        board.create('text', [cx + R / 2, cy - 0.45, '8 \\text{ m}'], {
            useKatex: true,
            fontSize: 14,
            color: '#DC2626',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false,
            cssStyle: 'font-weight:bold'
        });
    </script>
</body>
</html>
