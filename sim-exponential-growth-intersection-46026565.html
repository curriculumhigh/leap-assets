<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponential Growth — Intersection with y = 1200</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px);
        }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 1650, 22, -150],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 200
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels (custom: t and y)
        board.create('text', [21.2, -70, 't'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [0.5, 1600, 'y'], {
            useKatex: true, fontSize: 14, fixed: true, highlight: false
        });

        // ── Exponential curve: y = 750 * 1.04^t ────────────────────────
        board.create('functiongraph', [
            function(t) { return 750 * Math.pow(1.04, t); },
            -1, 21.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Horizontal line: y = 1200 (dashed, blue) ───────────────────
        board.create('functiongraph', [
            function(t) { return 1200; },
            -2, 21.5
        ], {
            strokeColor: '#2563EB', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // ── Intersection point ──────────────────────────────────────────
        var tInt = Math.log(1200 / 750) / Math.log(1.04); // ≈ 12.08
        var yInt = 1200;

        // Dashed red vertical drop from intersection to x-axis
        board.create('segment', [[tInt, 0], [tInt, yInt]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Intersection point (red)
        board.create('point', [tInt, yInt], {
            name: '', size: 5, color: '#DC2626', fixed: true, highlight: false,
            showInfobox: false
        });

        // Intersection label
        board.create('text', [tInt + 0.6, yInt + 80, '(12.08,\\,1200)'], {
            useKatex: true, fontSize: 12, color: '#DC2626', fixed: true, highlight: false
        });

        // ── Start point (0, 750) ────────────────────────────────────────
        board.create('point', [0, 750], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // Start point label — offset left-upward to avoid axis overlap
        board.create('text', [0.6, 750 + 80, '(0,\\,750)'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });

        // ── Curve labels ────────────────────────────────────────────────
        // Exponential label — placed in upper-right area along the rising curve
        board.create('text', [15.5, 1450, 'y = 750 \\cdot 1.04^t'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        // Horizontal line label — placed to the right, slightly above the line
        board.create('text', [17.5, 1260, 'y = 1200'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false
        });
    </script>
</body>
</html>
