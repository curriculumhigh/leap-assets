<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W = 85x² shaded region</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var xMin = -0.15, xMax = 1.25, yMin = -8, yMax = 110;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [xMin, yMax, xMax, yMin],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 0.5
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 25
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [xMax - 0.08, -3.5, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.04, yMax - 3, '<i>W</i>'], { fontSize: 12, fixed: true, highlight: false });

        // W = 85x^2 function
        function W(x) {
            return 85 * x * x;
        }

        // Shaded region above/outside the parabola in Q1
        var nPts = 80;
        var shadePts = [];
        var dx = xMax / nPts;
        var i;

        // Along the curve from x=0 upward
        for (i = 0; i <= nPts; i++) {
            var xi = i * dx;
            var wi = W(xi);
            if (wi > yMax) {
                var xEdge = Math.sqrt(yMax / 85);
                shadePts.push(board.create('point', [xEdge, yMax], { visible: false, fixed: true, name: '' }));
                break;
            }
            shadePts.push(board.create('point', [xi, wi], { visible: false, fixed: true, name: '' }));
        }

        // Top-right corner
        shadePts.push(board.create('point', [xMax, yMax], { visible: false, fixed: true, name: '' }));

        // Top-left corner (at x=0, W=yMax)
        shadePts.push(board.create('point', [0, yMax], { visible: false, fixed: true, name: '' }));

        board.create('polygon', shadePts, {
            fillColor: '#888888',
            fillOpacity: 0.15,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Dashed parabola curve (x >= 0)
        board.create('functiongraph', [
            function(x) { return W(x); },
            0, xMax
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Function label — name only
        board.create('text', [0.95, 65, 'W'], {
            fontSize: 12,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
