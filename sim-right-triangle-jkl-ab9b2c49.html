<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle JKL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9, 10, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var K = board.create('point', [1, 1], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });
        var J = board.create('point', [8, 1], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });
        var L = board.create('point', [1, 7.5], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });

        // ── Triangle (no fill) ──────────────────────────────────────────
        board.create('polygon', [K, J, L], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at K ─────────────────────────────────────
        var sqSize = 0.6;
        var sq1 = board.create('point', [K.X() + sqSize, K.Y()], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [K.X() + sqSize, K.Y() + sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [K.X(), K.Y() + sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Angle arc at J (62°) ────────────────────────────────────────
        board.create('nonReflexAngle', [K, J, L], {
            radius: 1.0,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        var angJK = Math.atan2(K.Y() - J.Y(), K.X() - J.X());
        var angJL = Math.atan2(L.Y() - J.Y(), L.X() - J.X());
        var bisector = (angJK + angJL) / 2;
        var labelDist = 1.6;

        board.create('text', [
            J.X() + labelDist * Math.cos(bisector),
            J.Y() + labelDist * Math.sin(bisector),
            '62^\\circ'
        ], {
            useKatex: true, fontSize: 12, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [8.5, 0.5, 'J'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [0.4, 0.5, 'K'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [0.4, 8.0, 'L'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        var midJL_x = (J.X() + L.X()) / 2;
        var midJL_y = (J.Y() + L.Y()) / 2;
        var nLen = Math.sqrt(6.5 * 6.5 + 7 * 7);
        var nx = 6.5 / nLen;
        var ny = 7 / nLen;
        var labelOffset = 0.7;

        board.create('text', [
            midJL_x + labelOffset * nx,
            midJL_y + labelOffset * ny,
            '15'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var midKL_x = (K.X() + L.X()) / 2;
        var midKL_y = (K.Y() + L.Y()) / 2;

        board.create('text', [
            midKL_x - 0.7,
            midKL_y,
            'x'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
