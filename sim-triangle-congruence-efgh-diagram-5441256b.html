<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Diagram EFG-EHG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 6.8, 9, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Geometry layout ─────────────────────────────────────────────
        var Fx = 1.0,  Fy = 0.5;
        var Hx = 7.5,  Hy = 0.5;
        var Gx = 4.25, Gy = 0.5;
        var Ex = 4.25, Ey = 5.5;

        // ── Points ──────────────────────────────────────────────────────
        var E = board.create('point', [Ex, Ey], {
            name: 'E', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [0, 14] }
        });

        var F = board.create('point', [Fx, Fy], {
            name: 'F', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-18, -8] }
        });

        var H = board.create('point', [Hx, Hy], {
            name: 'H', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [10, -8] }
        });

        var G = board.create('point', [Gx, Gy], {
            name: 'G', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [-2, -18] }
        });

        // ── Segments ────────────────────────────────────────────────────
        board.create('segment', [E, F], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [E, H], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [E, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [F, H], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Single arc marks: ∠EFG (at F) and ∠EHG (at H) ─────────────
        board.create('nonReflexAngle', [G, F, E], {
            radius: 0.6,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false,
            highlight: false
        });

        board.create('nonReflexAngle', [E, H, G], {
            radius: 0.6,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false,
            highlight: false
        });

        // ── Tick marks on arcs (congruence indicators) ──────────────────
        function vecAngle(p1x, p1y, p2x, p2y) {
            return Math.atan2(p2y - p1y, p2x - p1x);
        }

        var tickLen = 0.15;
        var arcR = 0.6;

        // ∠EFG bisector at F
        var angFG = vecAngle(Fx, Fy, Gx, Gy);
        var angFE = vecAngle(Fx, Fy, Ex, Ey);
        var bisF = (angFG + angFE) / 2;
        if (Math.abs(angFE - angFG) > Math.PI) {
            bisF += Math.PI;
        }

        board.create('segment', [
            [Fx + (arcR - tickLen) * Math.cos(bisF), Fy + (arcR - tickLen) * Math.sin(bisF)],
            [Fx + (arcR + tickLen) * Math.cos(bisF), Fy + (arcR + tickLen) * Math.sin(bisF)]
        ], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ∠EHG bisector at H
        var angHE = vecAngle(Hx, Hy, Ex, Ey);
        var angHG = vecAngle(Hx, Hy, Gx, Gy);
        var bisH = (angHE + angHG) / 2;
        if (Math.abs(angHE - angHG) > Math.PI) {
            bisH += Math.PI;
        }

        board.create('segment', [
            [Hx + (arcR - tickLen) * Math.cos(bisH), Hy + (arcR - tickLen) * Math.sin(bisH)],
            [Hx + (arcR + tickLen) * Math.cos(bisH), Hy + (arcR + tickLen) * Math.sin(bisH)]
        ], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right angle mark at G ──────────────────────────────────────
        var sq = 0.4;
        var sqP1 = board.create('point', [Gx - sq, Gy], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [Gx - sq, Gy + sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [Gx, Gy + sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
    </script>
</body>
</html>
