<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of -sqrt(x-5) - 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; background: transparent; }
        .container { padding: 0; height: 100%; width: 100%; }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); width: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 1, 15, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        minorTicks: 0,
                        label: { fontSize: 9, color: '#444444', offset: [0, -10] },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        ticksDistance: 2,
                        insertTicks: false,
                        minorTicks: 0,
                        label: { fontSize: 9, color: '#444444', offset: [-12, 0] },
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels near arrow tips
        board.create('text', [14.3, -0.6, '<i>x</i>'], {
            fontSize: 12, fixed: true, highlight: false, color: '#444444'
        });
        board.create('text', [-1.4, 0.5, '<i>y</i>'], {
            fontSize: 12, fixed: true, highlight: false, color: '#444444'
        });

        // Function: f(x) = -sqrt(x - 5) - 4
        board.create('functiongraph', [
            function(x) {
                if (x < 5) return NaN;
                return -Math.sqrt(x - 5) - 4;
            },
            5, 15
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Endpoint at (5, -4)
        board.create('point', [5, -4], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
