<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Patio Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 6, 6, -6],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Outer square (side 8, centered at origin) ───────────────────
        var S = 4; // half-side of outer square (8/2)
        var oA = board.create('point', [-S, -S], { visible: false, fixed: true, name: '' });
        var oB = board.create('point', [S, -S],  { visible: false, fixed: true, name: '' });
        var oC = board.create('point', [S, S],   { visible: false, fixed: true, name: '' });
        var oD = board.create('point', [-S, S],  { visible: false, fixed: true, name: '' });

        var outerPoly = board.create('polygon', [oA, oB, oC, oD], {
            fillColor: '#888888', fillOpacity: 0.15,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // ── Inner square (side x, visually ~4.5, centered) ─────────────
        var iS = 2.25; // half-side of inner square
        var iA = board.create('point', [-iS, -iS], { visible: false, fixed: true, name: '' });
        var iB = board.create('point', [iS, -iS],  { visible: false, fixed: true, name: '' });
        var iC = board.create('point', [iS, iS],   { visible: false, fixed: true, name: '' });
        var iD = board.create('point', [-iS, iS],  { visible: false, fixed: true, name: '' });

        var innerPoly = board.create('polygon', [iA, iB, iC, iD], {
            fillColor: '#ffffff', fillOpacity: 1.0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // ── Dimension line helper ───────────────────────────────────────
        function dimLine(p1, p2, tickDir, tickLen, color, width) {
            board.create('segment', [p1, p2], {
                strokeColor: color, strokeWidth: width, fixed: true, highlight: false
            });
            var t1a = [p1[0] + tickDir[0] * tickLen, p1[1] + tickDir[1] * tickLen];
            var t1b = [p1[0] - tickDir[0] * tickLen, p1[1] - tickDir[1] * tickLen];
            board.create('segment', [t1a, t1b], {
                strokeColor: color, strokeWidth: width, fixed: true, highlight: false
            });
            var t2a = [p2[0] + tickDir[0] * tickLen, p2[1] + tickDir[1] * tickLen];
            var t2b = [p2[0] - tickDir[0] * tickLen, p2[1] - tickDir[1] * tickLen];
            board.create('segment', [t2a, t2b], {
                strokeColor: color, strokeWidth: width, fixed: true, highlight: false
            });
        }

        // ── Outer square label: "8 ft" on the right side ───────────────
        var dimOff = 1.1;
        dimLine(
            [S + dimOff, -S], [S + dimOff, S],
            [1, 0], 0.25, '#555555', 1.0
        );
        board.create('text', [S + dimOff + 0.55, 0, '8 \\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#333333',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Inner square label: "x" on the right side ──────────────────
        var dimOffI = 0.8;
        dimLine(
            [iS + dimOffI, -iS], [iS + dimOffI, iS],
            [1, 0], 0.2, '#555555', 1.0
        );
        board.create('text', [iS + dimOffI + 0.4, 0, 'x'], {
            useKatex: true, fontSize: 13, color: '#333333',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
