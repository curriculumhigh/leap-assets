<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Value Functions m(x) and n(x)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 10px; height: 100%; }
        .left-panel {
            width: 140px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 14px 12px;
            display: flex; flex-direction: column; justify-content: center; gap: 18px;
        }
        .func-entry { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .func-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .func-eq { font-size: 12px; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="func-entry">
                    <div class="func-swatch" style="background: #222222;"></div>
                    <div class="func-eq" id="label-m"></div>
                </div>
                <div class="func-entry">
                    <div class="func-swatch" style="background: #2563EB;"></div>
                    <div class="func-eq" id="label-n"></div>
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>

    <script>
        // Render panel labels
        katex.render('m(x)=|x-3|+1', document.getElementById('label-m'), { throwOnError: false });
        katex.render('n(x)=|3x-3|+1', document.getElementById('label-n'), { throwOnError: false });

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 9, 8.5, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        majorHeight: 0,
                        minorTicks: 0,
                        insertTicks: false,
                        ticksDistance: 1,
                        strokeOpacity: 0,
                        drawLabels: true,
                        label: { fontSize: 11, color: '#444444', offset: [0, -12] }
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        majorHeight: 0,
                        minorTicks: 0,
                        insertTicks: false,
                        ticksDistance: 2,
                        strokeOpacity: 0,
                        drawLabels: true,
                        label: { fontSize: 11, color: '#444444', offset: [-12, 0] }
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [8.1, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 8.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // m(x) = |x - 3| + 1
        board.create('functiongraph', [
            function(x) { return Math.abs(x - 3) + 1; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // n(x) = |3x - 3| + 1
        board.create('functiongraph', [
            function(x) { return Math.abs(3 * x - 3) + 1; }
        ], { strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false });

        // Vertex of m(x) at (3, 1)
        board.create('point', [3, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false
        });

        // Vertex of n(x) at (1, 1)
        board.create('point', [1, 1], {
            name: '', size: 4, color: '#2563EB', fixed: true, highlight: false
        });

        // Vertex coordinate labels
        board.create('text', [3.15, 0.3, '(3, 1)'], {
            fontSize: 11, color: '#222222', fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [0.2, 0.3, '(1, 1)'], {
            fontSize: 11, color: '#2563EB', fixed: true, highlight: false, anchorX: 'left'
        });
    </script>
</body>
</html>
