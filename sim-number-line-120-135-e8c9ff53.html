<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line 120–135</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [119.2, 3, 135.8, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Number line (horizontal arrow) ──────────────────────────────
        board.create('arrow', [[119.4, 0], [135.6, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.5,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // ── Major tick marks (integers) + labels ────────────────────────
        var i, tick;
        for (i = 120; i <= 135; i++) {
            // Major tick
            board.create('segment', [[i, -0.35], [i, 0.35]], {
                strokeColor: '#444444',
                strokeWidth: 1.4,
                fixed: true,
                highlight: false
            });
            // Integer label
            board.create('text', [i, -0.85, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 11,
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // ── Minor tick marks (0.5 intervals) ────────────────────────────
        for (i = 120.5; i < 135; i += 1) {
            board.create('segment', [[i, -0.2], [i, 0.2]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
        }

        // ── Solid dots at 128 and 131.5 ────────────────────────────────
        board.create('point', [128, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        board.create('point', [131.5, 0], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // ── Point labels (KaTeX) ────────────────────────────────────────
        board.create('text', [128, 1.1, '128'], {
            anchorX: 'middle',
            anchorY: 'middle',
            fontSize: 14,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false,
            cssStyle: 'font-weight:bold'
        });

        board.create('text', [131.5, 1.1, '131.5'], {
            anchorX: 'middle',
            anchorY: 'middle',
            fontSize: 14,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false,
            cssStyle: 'font-weight:bold'
        });
    </script>
</body>
</html>
