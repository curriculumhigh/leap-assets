<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Pentagon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 9.5, 8.5, -2.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices of the house pentagon
        var Ax = 0, Ay = 0;
        var Bx = 6, By = 0;
        var Cx = 6, Cy = 4;
        var Dx = 3, Dy = 7;
        var Ex = 0, Ey = 4;

        var A = board.create('point', [Ax, Ay], { name: 'A', size: 2, color: '#222222', fixed: true, highlight: false, label: { fontSize: 13, color: '#222222', offset: [-12, -12] } });
        var B = board.create('point', [Bx, By], { name: 'B', size: 2, color: '#222222', fixed: true, highlight: false, label: { fontSize: 13, color: '#222222', offset: [6, -12] } });
        var C = board.create('point', [Cx, Cy], { name: 'C', size: 2, color: '#222222', fixed: true, highlight: false, label: { fontSize: 13, color: '#222222', offset: [8, 0] } });
        var D = board.create('point', [Dx, Dy], { name: 'D', size: 2, color: '#222222', fixed: true, highlight: false, label: { fontSize: 13, color: '#222222', offset: [-4, 10] } });
        var E = board.create('point', [Ex, Ey], { name: 'E', size: 2, color: '#222222', fixed: true, highlight: false, label: { fontSize: 13, color: '#222222', offset: [-14, 0] } });

        // Pentagon polygon
        board.create('polygon', [A, B, C, D, E], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Side labels — offset outward from edges to avoid overlap
        // Bottom: A->B
        board.create('text', [3, -1.0, '3t'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // Right side: B->C
        board.create('text', [7.0, 2, 't'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // Right roof: C->D — midpoint is (4.5, 5.5), offset outward (perpendicular away from center)
        board.create('text', [5.5, 6.0, '(t+4)'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // Left roof: D->E — midpoint is (1.5, 5.5), offset outward (perpendicular away from center)
        board.create('text', [0.5, 6.0, '(t+4)'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // Left side: E->A
        board.create('text', [-1.0, 2, 't'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
    </script>
</body>
</html>
