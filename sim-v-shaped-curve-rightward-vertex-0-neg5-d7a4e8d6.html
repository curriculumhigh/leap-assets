<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-shaped curve rightward</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 1.5, 8, -10.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.4, 0.35, 'x'], { useKatex: true, fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 1.1, 'y'], { useKatex: true, fontSize: 10, fixed: true, highlight: false });

        // V-shaped curve: x = |y + 5|, vertex at (0, -5), opening rightward
        // Upper branch: x = y + 5 for y >= -5
        board.create('curve', [
            function(t) { return t + 5; },
            function(t) { return t; },
            -5, 1.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Lower branch: x = -(y + 5) for y <= -5
        board.create('curve', [
            function(t) { return -(t + 5); },
            function(t) { return t; },
            -10.5, -5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Orientation arrows — small normal arrowheads pointing in direction of decreasing y
        var aLen = 0.55;

        // Upper branch at (2.5, -2.5), tangent direction for decreasing y: (-1,-1)/sqrt(2)
        var u_x1 = 2.5 + aLen * 0.707;
        var u_y1 = -2.5 + aLen * 0.707;
        var u_x2 = 2.5 - aLen * 0.707;
        var u_y2 = -2.5 - aLen * 0.707;

        board.create('arrow', [[u_x1, u_y1], [u_x2, u_y2]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 4 }
        });

        // Lower branch at (2.5, -7.5), tangent direction for decreasing y: (1,-1)/sqrt(2)
        var l_x1 = 2.5 - aLen * 0.707;
        var l_y1 = -7.5 + aLen * 0.707;
        var l_x2 = 2.5 + aLen * 0.707;
        var l_y2 = -7.5 - aLen * 0.707;

        board.create('arrow', [[l_x1, l_y1], [l_x2, l_y2]], {
            strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 4 }
        });

        // Key points
        // Vertex (0, -5)
        board.create('point', [0, -5], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0.4, -4.2, '(0,\\,-5)'], {
            useKatex: true, fontSize: 9, color: '#222222', fixed: true, highlight: false
        });

        // Upper branch point (4, -1)
        board.create('point', [4, -1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [4.4, -0.5, '(4,\\,-1)'], {
            useKatex: true, fontSize: 9, color: '#222222', fixed: true, highlight: false
        });

        // Lower branch point (4, -9)
        board.create('point', [4, -9], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [4.4, -9.6, '(4,\\,-9)'], {
            useKatex: true, fontSize: 9, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
