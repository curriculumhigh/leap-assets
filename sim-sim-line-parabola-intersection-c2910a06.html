<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line and Parabola Intersection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 13, 5, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 12.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Primary curve: parabola y = x^2
        board.create('functiongraph', [
            function(x) { return x * x; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Secondary curve: line y = -2x + 5
        board.create('functiongraph', [
            function(x) { return -2 * x + 5; }
        ], { strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false });

        // Intersection points: x^2 + 2x - 5 = 0 => x = -1 ± √6
        var sq6 = Math.sqrt(6);
        var ix1 = -1 - sq6;
        var iy1 = ix1 * ix1;
        var ix2 = -1 + sq6;
        var iy2 = ix2 * ix2;

        // Left intersection point
        board.create('point', [ix1, iy1], {
            name: '', size: 5, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });

        // Right intersection point
        board.create('point', [ix2, iy2], {
            name: '', size: 5, color: '#222222', fixed: true,
            showInfobox: false, highlight: false
        });

        // Function labels (name + rule, KaTeX)
        board.create('text', [2.8, 11.5, 'f(x) = x^2'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [2.8, -2.2, 'g(x) = -2x + 5'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false
        });
    </script>
</body>
</html>
