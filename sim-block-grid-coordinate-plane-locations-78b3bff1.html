<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block-Grid Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-16, 9, 4, -14],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.4, -0.8, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.4, 8.4, 'y'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // --- Points ---

        // House at (0, 0)
        var house = board.create('point', [0, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [0.6, 0.6, '\\text{House}'], {
            useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
        });

        // Coffee Shop at (-12, 5)
        var coffee = board.create('point', [-12, 5], {
            name: '', size: 3, color: '#2563EB', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-15.4, 6.2, '\\text{Coffee Shop}'], {
            useKatex: true, fontSize: 12, color: '#2563EB', fixed: true, highlight: false
        });
        board.create('text', [-15.4, 5.0, '(-12,\\, 5)'], {
            useKatex: true, fontSize: 12, color: '#2563EB', fixed: true, highlight: false
        });

        // Park at (-7, -10)
        var park = board.create('point', [-7, -10], {
            name: '', size: 3, color: '#059669', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [-6.4, -11.2, '\\text{Park}'], {
            useKatex: true, fontSize: 12, color: '#059669', fixed: true, highlight: false
        });
        board.create('text', [-6.4, -12.4, '(-7,\\, -10)'], {
            useKatex: true, fontSize: 12, color: '#059669', fixed: true, highlight: false
        });

        // --- Segment from Coffee Shop to Park ---
        board.create('segment', [coffee, park], {
            strokeColor: '#0EA5E9', strokeWidth: 1.8, fixed: true, highlight: false
        });
    </script>
</body>
</html>
