<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time in Shop Histogram — Distractor 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            width: 300px; height: calc(100% - 12px);
            margin: 0; padding: 6px;
        }
        .board-wrapper {
            background: white; border-radius: 8px;
            padding: 6px; height: calc(100% - 12px);
            position: relative;
        }
        #board { width: 100%; height: 100%; }
        .y-axis-label {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 8px;
            color: #444444;
            font-style: italic;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div class="y-axis-label">Frequency</div>
            <div id="board"></div>
        </div>
    </div>
    <script>
        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#ffffff';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-12, 9.5, 90, -1.8],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // ── Draw horizontal gridlines only ──────────────────────────────
        for (var g = 1; g <= 8; g++) {
            board.create('line', [[0, g], [1, g]], {
                strokeColor: GRID_COL, strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // ── Custom axes starting from origin ────────────────────────────
        // X-axis: from origin to right
        board.create('arrow', [[0, 0], [88, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            fixed: true, highlight: false
        });

        // Y-axis: from origin upward
        board.create('arrow', [[0, 0], [0, 9.2]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            fixed: true, highlight: false
        });

        // ── X-axis tick marks and labels ────────────────────────────────
        var xTicks = [0, 10, 20, 30, 40, 50, 60, 70, 80];
        for (var i = 0; i < xTicks.length; i++) {
            var xv = xTicks[i];
            // Tick mark
            board.create('segment', [[xv, -0.2], [xv, 0.2]], {
                strokeColor: AXIS_COL, strokeWidth: 1,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [xv, -0.65, String(xv)], {
                fontSize: 8, color: AXIS_COL, anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Y-axis tick marks and labels ────────────────────────────────
        for (var j = 1; j <= 8; j++) {
            // Tick mark
            board.create('segment', [[-1.5, j], [0, j]], {
                strokeColor: AXIS_COL, strokeWidth: 0,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [-2.5, j, String(j)], {
                fontSize: 8, color: AXIS_COL, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Histogram bars ──────────────────────────────────────────────
        // Distractor 2: bars 4 and 5 swapped compared to correct
        var barHeights = [6, 5, 3, 1, 2, 1, 1, 1];
        var barWidth = 10;

        for (var b = 0; b < barHeights.length; b++) {
            var x0 = b * barWidth;
            var x1 = x0 + barWidth;
            var h = barHeights[b];

            var p1 = board.create('point', [x0, 0], { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [x1, 0], { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [x1, h], { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [x0, h], { visible: false, fixed: true, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL,
                fillOpacity: 0.9,
                borders: {
                    strokeColor: BAR_STROKE,
                    strokeWidth: 0.5
                },
                vertices: { visible: false },
                hasInnerPoints: false,
                fixed: true,
                highlight: false
            });
        }

        // ── X-axis label ────────────────────────────────────────────────
        board.create('text', [40, -1.2, 'Time (min)'], {
            fontSize: 8, color: AXIS_COL, anchorX: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-style:italic'
        });

        // ── Title ───────────────────────────────────────────────────────
        board.create('text', [40, 8.8, 'Time in Shop'], {
            fontSize: 10, color: '#222222', anchorX: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600'
        });
    </script>
</body>
</html>
