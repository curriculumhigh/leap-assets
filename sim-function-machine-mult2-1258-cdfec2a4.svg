  </defs>
  <!-- INPUT -->
  <rect x="20" y="20" width="150" height="34" fill="#F6C29A" stroke="#E8833A" stroke-width="2"/>
  <text x="95" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#5A3415">Input</text>
