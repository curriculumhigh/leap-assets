<svg viewBox="0 10 620 236" xmlns="http://www.w3.org/2000/svg">
  <style>text{font-family:Georgia,'Segoe UI',-apple-system,sans-serif;}</style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#222"/>
