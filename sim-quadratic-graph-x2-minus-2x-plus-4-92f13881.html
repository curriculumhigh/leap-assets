<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of x² − 2x + 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 5, 6, -1],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        /* ── Grid ──────────────────────────────────────────────── */
        board.create('grid', [], {
            strokeColor: '#D1D5DB',
            strokeWidth: 0.4,
            majorStep: [1, 1]
        });

        /* ── X-axis ────────────────────────────────────────────── */
        var xAxis = board.create('arrow', [[-2.8, 0], [5.7, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });

        /* ── Y-axis ────────────────────────────────────────────── */
        var yAxis = board.create('arrow', [[0, -0.8], [0, 4.7]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });

        /* ── X-axis tick labels (no tick marks) ────────────────── */
        var xTicks = [-2, -1, 1, 2, 3, 4, 5];
        for (var i = 0; i < xTicks.length; i++) {
            board.create('text', [xTicks[i], -0.35, String(xTicks[i])], {
                fontSize: 9,
                anchorX: 'middle',
                anchorY: 'top',
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        /* ── Y-axis tick labels (no tick marks) ────────────────── */
        var yTicks = [1, 2, 3, 4];
        for (var j = 0; j < yTicks.length; j++) {
            board.create('text', [-0.35, yTicks[j], String(yTicks[j])], {
                fontSize: 9,
                anchorX: 'right',
                anchorY: 'middle',
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        /* ── Axis labels ───────────────────────────────────────── */
        board.create('text', [5.6, -0.35, '<i>x</i>'], {
            fontSize: 12,
            color: '#444444',
            fixed: true,
            highlight: false
        });
        board.create('text', [0.2, 4.6, '<i>y</i>'], {
            fontSize: 12,
            color: '#444444',
            fixed: true,
            highlight: false
        });

        /* ── Parabola: f(x) = x² − 2x + 4 ────────────────────── */
        board.create('functiongraph', [
            function(x) { return x * x - 2 * x + 4; },
            -3, 6
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
