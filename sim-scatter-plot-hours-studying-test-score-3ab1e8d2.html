<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Hours Studying vs Test Score</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); position: relative; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .y-axis-label {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 14px;
            color: #222222;
            font-style: italic;
            white-space: nowrap;
            pointer-events: none;
        }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #2563EB;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="y-axis-label">Test Score</div>
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.0, 112, 13, -12],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');
        var COL_PT = '#2563EB';

        function showTooltip(pt) {
            var xVal = Math.round(pt.X());
            var yVal = Math.round(pt.Y());
            var latex = '\\color{' + COL_PT + '}{(' + xVal + ',\\,' + yVal + ')}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // x-axis
        board.create('arrow', [[0, 0], [12.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // y-axis
        board.create('arrow', [[0, 0], [0, 108]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Grid lines
        var i;
        for (i = 1; i <= 12; i++) {
            board.create('segment', [[i, 0], [i, 100]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 10; i <= 100; i += 10) {
            board.create('segment', [[0, i], [12, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // x-axis ticks and labels
        for (i = 1; i <= 12; i++) {
            board.create('segment', [[i, -1.5], [i, 1.5]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -5, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }
        board.create('text', [-0.5, -5, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // y-axis ticks and labels
        for (i = 10; i <= 100; i += 10) {
            board.create('segment', [[-0.2, i], [0.2, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [-0.6, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // x-axis label
        board.create('text', [6, -10, '\\textit{Hours Studying}'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // Data points with hover tooltips
        var data = [
            [1, 45], [2, 50], [3, 55], [4, 58], [5, 65],
            [7, 72], [8, 78], [9, 80], [10, 85]
        ];

        for (i = 0; i < data.length; i++) {
            (function(idx) {
                var pt = board.create('point', [data[idx][0], data[idx][1]], {
                    name: '', size: 4, color: COL_PT,
                    strokeColor: COL_PT, strokeWidth: 0,
                    fixed: true, showInfobox: false,
                    highlight: true,
                    highlightFillColor: COL_PT,
                    highlightStrokeColor: COL_PT
                });
                pt.on('over', function() { showTooltip(pt); });
                pt.on('out', function() { hideTooltip(); });
            })(i);
        }
    </script>
</body>
</html>
