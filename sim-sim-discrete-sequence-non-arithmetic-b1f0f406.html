<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Sequence Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 33, 6.8, -4],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // X-axis
        board.create('arrow', [[0, 0], [6.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        // Y-axis
        board.create('arrow', [[0, 0], [0, 32]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        // X-axis ticks and labels
        var i;
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, -0.4], [i, 0.4]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [i, -1.5, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Y-axis ticks and labels — only at even values, no minor ticks
        for (i = 2; i <= 30; i += 2) {
            board.create('segment', [[-0.15, i], [0.15, i]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [-0.55, i, String(i)], {
                fontSize: 9, anchorX: 'right', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [6.4, -1.8, 'n'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.35, 31.5, 'a_n'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Discrete points — (n, a_n)
        var pts = [[1, 4], [2, 10], [3, 15], [4, 19], [5, 22]];

        for (i = 0; i < pts.length; i++) {
            board.create('point', [pts[i][0], pts[i][1]], {
                name: '',
                size: 4,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
