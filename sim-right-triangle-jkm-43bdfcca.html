<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle JKM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 12, 12, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var J = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var M = board.create('point', [10, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var K = board.create('point', [10, 2.25], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle
        board.create('polygon', [J, M, K], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at M
        var sqSize = 0.55;
        var raPt1 = board.create('point', [10 - sqSize, 0], { visible: false, fixed: true, name: '' });
        var raPt2 = board.create('point', [10 - sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var raPt3 = board.create('point', [10, sqSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [raPt1, raPt2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [raPt2, raPt3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Vertex labels
        board.create('text', [-0.6, -0.15, 'J'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [10.3, -0.15, 'M'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });
        board.create('text', [10.3, 2.35, 'K'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600; font-style:italic;'
        });

        // Side-length labels
        // JM = 40 (bottom, centered below)
        board.create('text', [5, -0.7, '40'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600;'
        });

        // KM = 9 (right side, offset right)
        board.create('text', [10.7, 1.125, '9'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600;'
        });

        // JK = 41 (hypotenuse, offset above-left of midpoint)
        board.create('text', [4.6, 1.6, '41'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-weight:600;'
        });
    </script>
</body>
</html>
