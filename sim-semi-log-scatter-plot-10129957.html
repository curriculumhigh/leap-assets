<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Log Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.7, 3.2, 5.7, -0.4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Semi-log horizontal grid lines ───────────────────────────────
        var decades = [1, 10, 100];
        for (var d = 0; d < decades.length; d++) {
            for (var k = 1; k <= 9; k++) {
                var val = decades[d] * k;
                if (val > 1000) break;
                var logVal = Math.log10(val);
                var isMain = (k === 1);
                board.create('segment', [[0, logVal], [5, logVal]], {
                    strokeColor: '#444444',
                    strokeWidth: isMain ? 0.8 : 0.4,
                    fixed: true, highlight: false
                });
            }
        }
        // Top line at 1000
        board.create('segment', [[0, 3], [5, 3]], {
            strokeColor: '#444444', strokeWidth: 0.8,
            fixed: true, highlight: false
        });

        // ── Vertical grid lines ──────────────────────────────────────────
        for (var i = 0; i <= 5; i++) {
            board.create('segment', [[i, 0], [i, 3]], {
                strokeColor: '#444444', strokeWidth: 0.8,
                fixed: true, highlight: false
            });
        }

        // ── Axes ─────────────────────────────────────────────────────────
        // X-axis (bottom border)
        board.create('segment', [[0, 0], [5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // Y-axis (left border)
        board.create('segment', [[0, 0], [0, 3]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // ── X-axis tick marks and labels ─────────────────────────────────
        for (var i = 0; i <= 5; i++) {
            // Tick mark
            board.create('segment', [[i, -0.06], [i, 0]], {
                strokeColor: '#444444', strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            // Label
            board.create('text', [i, -0.18, String(i)], {
                fontSize: 13, color: '#333333', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Y-axis labels ────────────────────────────────────────────────
        var yTickValues = [1, 10, 100, 1000];
        var yTickLabels = ['1', '10', '100', '1000'];
        for (var i = 0; i < yTickValues.length; i++) {
            var yv = Math.log10(yTickValues[i]);
            board.create('text', [-0.15, yv, yTickLabels[i]], {
                fontSize: 12, color: '#333333', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Data points (plotted in log space) ───────────────────────────
        var data = [
            [1, 35],
            [2, 60],
            [3, 100],
            [4, 150],
            [5, 250]
        ];

        for (var i = 0; i < data.length; i++) {
            board.create('point', [data[i][0], Math.log10(data[i][1])], {
                name: '', size: 4, color: '#222222',
                strokeColor: '#222222', strokeWidth: 1,
                fillColor: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
