<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cone Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 9.5, 8.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Px = 2, Py = 8.5;
        var Qx = 2, Qy = 2.5;
        var h = Py - Qy;

        var angleQPR = 35 * Math.PI / 180;
        var baseRadius = h * Math.tan(angleQPR);

        var Rx = Qx + baseRadius, Ry = Qy;
        var Lx = Qx - baseRadius, Ly = Qy;

        var ellA = baseRadius;
        var ellB = baseRadius * 0.28;

        board.create('curve', [
            function(t) { return Qx + ellA * Math.cos(t); },
            function(t) { return Qy + ellB * Math.sin(t); },
            Math.PI, 2 * Math.PI
        ], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return Qx + ellA * Math.cos(t); },
            function(t) { return Qy + ellB * Math.sin(t); },
            0, Math.PI
        ], {
            strokeColor: '#555555', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [[Px, Py], [Rx, Ry]], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [[Px, Py], [Lx, Ly]], {
            strokeColor: '#555555', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [[Px, Py], [Qx, Qy]], {
            strokeColor: '#555555', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [[Qx, Qy], [Rx, Ry]], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        var arcR = 1.2;
        var pqAngle = Math.atan2(Qy - Py, Qx - Px);
        var prAngle = Math.atan2(Ry - Py, Rx - Px);

        board.create('curve', [
            function(t) { return Px + arcR * Math.cos(t); },
            function(t) { return Py + arcR * Math.sin(t); },
            prAngle,
            pqAngle
        ], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        var bisector = (pqAngle + prAngle) / 2;
        var lblAngleDist = 1.7;

        board.create('text', [
            Px + lblAngleDist * Math.cos(bisector),
            Py + lblAngleDist * Math.sin(bisector),
            '35^\\circ'
        ], {
            useKatex: true, fontSize: 12, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var prMidX = (Px + Rx) / 2;
        var prMidY = (Py + Ry) / 2;
        var prLen = Math.sqrt((Rx - Px) * (Rx - Px) + (Ry - Py) * (Ry - Py));
        var prNx = -(Ry - Py) / prLen;
        var prNy = (Rx - Px) / prLen;
        var lblOffset = 1.1;

        board.create('text', [
            prMidX + lblOffset * prNx,
            prMidY + lblOffset * prNy,
            '20\\text{ cm}'
        ], {
            useKatex: true, fontSize: 12, color: '#3B82F6',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('point', [Px, Py], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [Px + 0.3, Py + 0.4, 'P'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        board.create('point', [Qx, Qy], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [2, 2.3, 'Q'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        board.create('point', [Rx, Ry], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [6.4, 2.3, 'R'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });

        var sqSize = 0.45;
        board.create('polygon', [
            [Qx, Qy],
            [Qx + sqSize, Qy],
            [Qx + sqSize, Qy + sqSize],
            [Qx, Qy + sqSize]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
