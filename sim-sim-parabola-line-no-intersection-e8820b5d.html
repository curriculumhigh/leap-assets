<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola and Line — No Intersection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
            <div class="coord-tooltip" id="tooltip"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 11, 5, -7],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [4.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 10.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Colors
        var COL_F = '#222222';
        var COL_G = '#2563EB';

        // Primary curve: y = 3x^2 + 2 (parabola)
        board.create('functiongraph', [
            function(x) { return 3 * x * x + 2; }
        ], { strokeColor: COL_F, strokeWidth: 1.8, fixed: true, highlight: false });

        // Secondary curve: y = 2x - 3 (line)
        board.create('functiongraph', [
            function(x) { return 2 * x - 3; }
        ], { strokeColor: COL_G, strokeWidth: 1.5, fixed: true, highlight: false });

        // Key point: vertex of parabola at (0, 2)
        var vertexPt = board.create('point', [0, 2], {
            name: '', size: 5, color: COL_F, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_F, highlightStrokeColor: COL_F
        });

        // Key point: y-intercept of line at (0, -3)
        var yIntPt = board.create('point', [0, -3], {
            name: '', size: 5, color: COL_G, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_G, highlightStrokeColor: COL_G
        });

        // Function labels (name + rule, KaTeX)
        board.create('text', [-4.8, 9.5, 'f(x) = 3x^2 + 2'], {
            useKatex: true, fontSize: 13, color: COL_F, fixed: true, highlight: false
        });

        board.create('text', [2.2, 5.8, 'g(x) = 2x - 3'], {
            useKatex: true, fontSize: 13, color: COL_G, fixed: true, highlight: false
        });

        // ── KaTeX hover tooltips ────────────────────────────────────────
        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function formatVal(v) {
            if (Math.abs(v - Math.round(v)) < 0.001) return String(Math.round(v));
            return v.toFixed(2);
        }

        function showTooltip(pt, color) {
            var xCoord = pt.X();
            var yCoord = pt.Y();
            var latex = '\\color{' + color + '}{\\left(' + formatVal(xCoord)
                      + ',\\,' + formatVal(yCoord) + '\\right)}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [xCoord, yCoord], board);
            var sx = coords.scrCoords[1];
            var sy = coords.scrCoords[2];
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() { tooltip.style.display = 'none'; }

        vertexPt.on('over', function() { showTooltip(vertexPt, COL_F); });
        vertexPt.on('out', function() { hideTooltip(); });

        yIntPt.on('over', function() { showTooltip(yIntPt, COL_G); });
        yIntPt.on('out', function() { hideTooltip(); });
    </script>
</body>
</html>
