<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon P''Q''R''S''</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 7, 6, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 6.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var P = board.create('point', [0, 1], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var Q = board.create('point', [4, 2], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var R = board.create('point', [3, 5], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var S = board.create('point', [1, 4], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Polygon (outline only)
        board.create('polygon', [P, Q, R, S], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels with KaTeX
        board.create('text', [-0.1, 0.3, "P''(0,\\,1)"], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'right'
        });
        board.create('text', [4.2, 1.4, "Q''(4,\\,2)"], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left'
        });
        board.create('text', [3.2, 5.4, "R''(3,\\,5)"], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left'
        });
        board.create('text', [0.4, 4.4, "S''(1,\\,4)"], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left'
        });
    </script>
</body>
</html>
