<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Wheel — 8 Equal Isosceles Triangles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 4.2;
        var NUM = 8;
        var ANGLE_STEP = 2 * Math.PI / NUM;

        // Color wheel hues for 8 segments (starting from top, going clockwise)
        var fills = [
            '#E53935', // red
            '#F57C00', // orange
            '#FDD835', // yellow
            '#7CB342', // yellow-green
            '#2E7D32', // green (highlighted)
            '#00ACC1', // cyan
            '#1565C0', // blue
            '#7B1FA2'  // purple
        ];

        var strokes = [
            '#B71C1C', // red dark
            '#E65100', // orange dark
            '#F9A825', // yellow dark
            '#558B2F', // yellow-green dark
            '#1B5E20', // green dark
            '#00838F', // cyan dark
            '#0D47A1', // blue dark
            '#4A148C'  // purple dark
        ];

        // Green triangle index
        var GREEN_IDX = 4;

        // Starting angle offset
        var START_ANGLE = Math.PI / 2 + ANGLE_STEP / 2;

        // Center point
        var center = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Create 8 triangles
        for (var i = 0; i < NUM; i++) {
            var a1 = START_ANGLE - i * ANGLE_STEP;
            var a2 = START_ANGLE - (i + 1) * ANGLE_STEP;

            var x1 = R * Math.cos(a1);
            var y1 = R * Math.sin(a1);
            var x2 = R * Math.cos(a2);
            var y2 = R * Math.sin(a2);

            var isHighlighted = (i === GREEN_IDX);

            var p1 = board.create('point', [x1, y1], { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [x2, y2], { visible: false, fixed: true, name: '' });

            board.create('polygon', [center, p1, p2], {
                fillColor: fills[i],
                fillOpacity: isHighlighted ? 0.88 : 0.55,
                borders: {
                    strokeColor: strokes[i],
                    strokeWidth: isHighlighted ? 2.8 : 1.5
                },
                vertices: { visible: false },
                hasInnerPoints: false,
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
