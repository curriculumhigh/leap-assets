<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>region-between-4-minus-ex-and-x-minus-1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 320px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
      window.addEventListener('load', function () {
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 3.5, 2.2, -1.6],
            axis: true,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 0.5 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            }
        });

        var COL_H = '#B91C1C';   // upper curve h(x) = 4 - e^x
        var COL_F = '#2563EB';   // lower line  f(x) = x - 1
        var E = Math.E;
        var HTOP = 4 - E;        // h(1) = 4 - e ≈ 1.2817

        // Shaded region R, bounded left by the y-axis (x=0), right by x=1,
        // above by h(x) = 4 - e^x, below by f(x) = x - 1.
        // Trace the closed boundary counter-clockwise as a parametric curve t in [0,4].
        board.create('curve', [
            function (t) {
                if (t <= 1) { return t; }                 // along h, x: 0 -> 1
                else if (t <= 2) { return 1; }            // down x = 1
                else if (t <= 3) { return 3 - t; }        // along f, x: 1 -> 0
                else { return 0; }                        // up the y-axis
            },
            function (t) {
                if (t <= 1) { return 4 - Math.exp(t); }               // h(x)
                else if (t <= 2) { return HTOP * (2 - t); }           // x=1 from HTOP down to 0
                else if (t <= 3) { return (3 - t) - 1; }              // f(x) = x - 1
                else { return -1 + 4 * (t - 3); }                     // y-axis from -1 up to 3
            },
            0, 4,
            { stepsperarc: 90 }
        ], {
            strokeColor: 'none', strokeWidth: 0,
            fillColor: '#888888', fillOpacity: 0.15,
            fixed: true, highlight: false,
            numberPointsHigh: 400
        });

        // Boundary: upper curve h(x) = 4 - e^x on [0,1]
        board.create('functiongraph', [function (x) { return 4 - Math.exp(x); }, 0, 1], {
            strokeColor: COL_H, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Boundary: lower line f(x) = x - 1 from (0,-1) to (1,0)
        board.create('segment', [[0, -1], [1, 0]], {
            strokeColor: COL_F, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Right boundary x = 1 (dashed) from (1,0) up to (1, 4-e)
        board.create('segment', [[1, 0], [1, HTOP]], {
            strokeColor: '#6B7280', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // Corner points
        board.create('point', [0, 3],    { name: '', size: 2, color: COL_H, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [1, HTOP], { name: '', size: 2, color: COL_H, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [1, 0],    { name: '', size: 2, color: COL_F, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [0, -1],   { name: '', size: 2, color: COL_F, fixed: true, highlight: false, showInfobox: false });

        // Region label
        board.create('text', [0.28, 1.0, 'R'], {
            useKatex: true, fontSize: 18, color: '#374151', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Curve labels
        board.create('text', [1.08, 1.35, 'h(x)=4-e^{x}'], {
            useKatex: true, fontSize: 12, color: COL_H, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [1.08, 0.12, 'f(x)=x-1'], {
            useKatex: true, fontSize: 12, color: COL_F, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // Axis labels near arrow tips
        board.create('text', [2.12, -0.18, 'x'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.13, 3.35, 'y'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
      });
    </script>
</body>
</html>
