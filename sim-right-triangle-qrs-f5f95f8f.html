<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle QRS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6, 7.5, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var Q = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var R = board.create('point', [5, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var S = board.create('point', [5, 4], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        // Triangle edges
        var sideQR = board.create('segment', [Q, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        var sideRS = board.create('segment', [R, S], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        var sideQS = board.create('segment', [Q, S], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Right-angle marker at R (small square)
        var markerSize = 0.4;
        var rm1 = board.create('point', [5 - markerSize, 0], { visible: false, fixed: true, name: '' });
        var rm2 = board.create('point', [5 - markerSize, markerSize], { visible: false, fixed: true, name: '' });
        var rm3 = board.create('point', [5, markerSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [rm1, rm2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [rm2, rm3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Bold vertex labels positioned just outside each corner
        board.create('text', [-0.35, -0.35, '<b>Q</b>'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [5.35, -0.35, '<b>R</b>'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [5.35, 4.35, '<b>S</b>'], {
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
