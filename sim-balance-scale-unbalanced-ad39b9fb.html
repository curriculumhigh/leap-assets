<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Scale — Unbalanced</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 7, 8, -5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: true
        });

        // ── Constants ───────────────────────────────────────────────────
        var TILT_DEG = -10;
        var TILT_RAD = TILT_DEG * Math.PI / 180;
        var BEAM_HALF = 5.5;
        var PIVOT_X = 0, PIVOT_Y = 1.5;
        var STRING_LEN = 2.2;
        var PAN_WIDTH = 2.8;
        var PAN_DEPTH = 0.5;

        var COL_STRUCT = '#444444';
        var COL_PAN_FILL = '#f5f5f5';
        var COL_PAN_STROKE = '#555555';
        var COL_TEXT = '#222222';

        // ── Fulcrum (triangle base) ─────────────────────────────────────
        var fulcrumBase = 1.2;
        var fulcrumH = 1.8;
        var fP1 = [PIVOT_X - fulcrumBase, PIVOT_Y - fulcrumH];
        var fP2 = [PIVOT_X + fulcrumBase, PIVOT_Y - fulcrumH];
        var fP3 = [PIVOT_X, PIVOT_Y];

        board.create('polygon', [fP1, fP2, fP3], {
            fillColor: COL_STRUCT, fillOpacity: 0.15,
            borders: { strokeColor: COL_STRUCT, strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Base platform
        board.create('segment', [[PIVOT_X - 2, PIVOT_Y - fulcrumH], [PIVOT_X + 2, PIVOT_Y - fulcrumH]], {
            strokeColor: COL_STRUCT, strokeWidth: 3, fixed: true, highlight: false
        });

        // ── Pivot circle ────────────────────────────────────────────────
        board.create('point', [PIVOT_X, PIVOT_Y], {
            name: '', size: 3, color: COL_STRUCT, fixed: true, highlight: false
        });

        // ── Beam (tilted) ───────────────────────────────────────────────
        var beamLeftX = PIVOT_X + BEAM_HALF * Math.cos(Math.PI + TILT_RAD);
        var beamLeftY = PIVOT_Y + BEAM_HALF * Math.sin(Math.PI + TILT_RAD);
        var beamRightX = PIVOT_X + BEAM_HALF * Math.cos(TILT_RAD);
        var beamRightY = PIVOT_Y + BEAM_HALF * Math.sin(TILT_RAD);

        board.create('segment', [[beamLeftX, beamLeftY], [beamRightX, beamRightY]], {
            strokeColor: COL_STRUCT, strokeWidth: 3.5, fixed: true, highlight: false
        });

        // Small circles at beam ends
        board.create('point', [beamLeftX, beamLeftY], {
            name: '', size: 2, color: COL_STRUCT, fixed: true, highlight: false
        });
        board.create('point', [beamRightX, beamRightY], {
            name: '', size: 2, color: COL_STRUCT, fixed: true, highlight: false
        });

        // ── Strings (left pan) ──────────────────────────────────────────
        var leftPanCenterX = beamLeftX;
        var leftPanCenterY = beamLeftY - STRING_LEN;

        board.create('segment', [[beamLeftX, beamLeftY], [leftPanCenterX - PAN_WIDTH / 2, leftPanCenterY]], {
            strokeColor: COL_STRUCT, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[beamLeftX, beamLeftY], [leftPanCenterX + PAN_WIDTH / 2, leftPanCenterY]], {
            strokeColor: COL_STRUCT, strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Strings (right pan) ─────────────────────────────────────────
        var rightPanCenterX = beamRightX;
        var rightPanCenterY = beamRightY - STRING_LEN;

        board.create('segment', [[beamRightX, beamRightY], [rightPanCenterX - PAN_WIDTH / 2, rightPanCenterY]], {
            strokeColor: COL_STRUCT, strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[beamRightX, beamRightY], [rightPanCenterX + PAN_WIDTH / 2, rightPanCenterY]], {
            strokeColor: COL_STRUCT, strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Left pan (trapezoid shape) ──────────────────────────────────
        var lpTL = [leftPanCenterX - PAN_WIDTH / 2, leftPanCenterY];
        var lpTR = [leftPanCenterX + PAN_WIDTH / 2, leftPanCenterY];
        var lpBR = [leftPanCenterX + PAN_WIDTH / 2 - 0.3, leftPanCenterY - PAN_DEPTH];
        var lpBL = [leftPanCenterX - PAN_WIDTH / 2 + 0.3, leftPanCenterY - PAN_DEPTH];

        board.create('polygon', [lpTL, lpTR, lpBR, lpBL], {
            fillColor: COL_PAN_FILL, fillOpacity: 1.0,
            borders: { strokeColor: COL_PAN_STROKE, strokeWidth: 1.8 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // ── Right pan (trapezoid shape) ─────────────────────────────────
        var rpTL = [rightPanCenterX - PAN_WIDTH / 2, rightPanCenterY];
        var rpTR = [rightPanCenterX + PAN_WIDTH / 2, rightPanCenterY];
        var rpBR = [rightPanCenterX + PAN_WIDTH / 2 - 0.3, rightPanCenterY - PAN_DEPTH];
        var rpBL = [rightPanCenterX - PAN_WIDTH / 2 + 0.3, rightPanCenterY - PAN_DEPTH];

        board.create('polygon', [rpTL, rpTR, rpBR, rpBL], {
            fillColor: COL_PAN_FILL, fillOpacity: 1.0,
            borders: { strokeColor: COL_PAN_STROKE, strokeWidth: 1.8 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // ── Labels on pans ──────────────────────────────────────────────
        board.create('text', [leftPanCenterX, leftPanCenterY + 0.7, '2 + 7'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 18, color: COL_TEXT, cssStyle: 'font-weight:bold',
            fixed: true, highlight: false
        });

        board.create('text', [rightPanCenterX, rightPanCenterY + 0.7, '10'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 18, color: COL_TEXT, cssStyle: 'font-weight:bold',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
