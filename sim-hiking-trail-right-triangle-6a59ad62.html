<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiking Trail Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 8.5, 26, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var A = board.create('point', [0, 0], {
            name: 'A', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -10] }
        });
        var B = board.create('point', [22, 0], {
            name: 'B', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [6, -10] }
        });
        var C = board.create('point', [22, 5], {
            name: 'C', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [6, 6] }
        });

        // ── Triangle edges (no fill) ────────────────────────────────────
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Angle arc at A labelled x° ──────────────────────────────────
        board.create('nonReflexAngle', [B, A, C], {
            radius: 2.2,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.2,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        // Angle label along the bisector
        var angA = Math.atan2(5, 22);
        var bisectorA = angA / 2;
        var labelR = 3.0;
        board.create('text', [
            labelR * Math.cos(bisectorA),
            labelR * Math.sin(bisectorA),
            'x^\\circ'
        ], {
            useKatex: true, fontSize: 14, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Right-angle marker at B ─────────────────────────────────────
        var sq = 1.1;
        var raPts = [
            board.create('point', [22 - sq, 0], { visible: false, fixed: true, name: '' }),
            board.create('point', [22 - sq, sq], { visible: false, fixed: true, name: '' }),
            board.create('point', [22, sq], { visible: false, fixed: true, name: '' })
        ];
        board.create('segment', [raPts[0], raPts[1]], {
            strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [raPts[1], raPts[2]], {
            strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        // Base label "22" centered below AB
        board.create('text', [11, -1.4, '22'], {
            fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Vertical side label "5" to the right of BC
        board.create('text', [23.4, 2.5, '5'], {
            fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
