<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaded Grid 6x4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 4.8, 6.8, -0.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var shadedSet = {
            '1,1': true, '3,1': true, '5,1': true,
            '2,2': true, '4,2': true, '6,2': true,
            '1,3': true, '5,3': true,
            '3,4': true
        };

        var BLUE = '#3B82F6';
        var WHITE = '#FFFFFF';
        var BORDER = '#555555';

        for (var row = 1; row <= 4; row++) {
            for (var col = 1; col <= 6; col++) {
                var x0 = col - 1;
                var y0 = 4 - row;

                var key = col + ',' + row;
                var fill = shadedSet[key] ? BLUE : WHITE;

                var p1 = board.create('point', [x0, y0], { visible: false, fixed: true, name: '' });
                var p2 = board.create('point', [x0 + 1, y0], { visible: false, fixed: true, name: '' });
                var p3 = board.create('point', [x0 + 1, y0 + 1], { visible: false, fixed: true, name: '' });
                var p4 = board.create('point', [x0, y0 + 1], { visible: false, fixed: true, name: '' });

                board.create('polygon', [p1, p2, p3, p4], {
                    fillColor: fill,
                    fillOpacity: 1,
                    borders: { strokeColor: BORDER, strokeWidth: 1.5 },
                    vertices: { visible: false },
                    hasInnerPoints: false,
                    fixed: true,
                    highlight: false
                });
            }
        }
    </script>
</body>
</html>
