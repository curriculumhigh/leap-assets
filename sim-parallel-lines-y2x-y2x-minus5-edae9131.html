<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Parallel Lines</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 10, 8, -8],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Manually create axes with tick distance = 1
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        // Axis labels
        board.create('text', [7.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 9.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Line 1: y = 2x
        board.create('functiongraph', [function(x) { return 2 * x; }], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Line 2: y = 2x - 5
        board.create('functiongraph', [function(x) { return 2 * x - 5; }], {
            strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Key points on Line 1 (no labels)
        board.create('point', [1, 2], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        board.create('point', [3, 6], {
            name: '', size: 4, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Key points on Line 2 (no labels)
        board.create('point', [2, -1], {
            name: '', size: 4, color: '#2563EB', fixed: true, highlight: false, showInfobox: false
        });

        board.create('point', [4, 3], {
            name: '', size: 4, color: '#2563EB', fixed: true, highlight: false, showInfobox: false
        });

        // Line labels (name only)
        board.create('text', [4.5, 9.2, '\\text{Line 1}'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [5.8, 7.2, '\\text{Line 2}'], {
            useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false
        });
    </script>
</body>
</html>
