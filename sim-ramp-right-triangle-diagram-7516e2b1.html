<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramp Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.5, 7, 12, -2.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        // Bottom-left (right angle): A
        // Bottom-right (tipping angle): B
        // Top-left (top of ramp): C
        var A = board.create('point', [1, 0.5], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [10, 0.5], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [1, 6], { visible: false, fixed: true, name: '' });

        // Triangle edges
        // Base (horizontal ground)
        board.create('segment', [A, B], { strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false });
        // Vertical side (height of ramp)
        board.create('segment', [A, C], { strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false });
        // Hypotenuse (ramp)
        board.create('segment', [B, C], { strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false });

        // Right angle marker at A (bottom-left)
        var raSize = 0.45;
        board.create('segment', [[A.X() + raSize, A.Y()], [A.X() + raSize, A.Y() + raSize]], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[A.X() + raSize, A.Y() + raSize], [A.X(), A.Y() + raSize]], {
            strokeColor: '#222222', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Tipping angle arc at B (bottom-right)
        board.create('nonReflexAngle', [A, B, C], {
            radius: 1.2,
            fillColor: '#2563EB', fillOpacity: 0.08,
            strokeColor: '#2563EB', strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false
        });

        // Label: "tipping angle" near the arc at B
        board.create('text', [7.8, 1.4, 'tipping angle'], {
            fontSize: 13, color: '#2563EB', fixed: true, highlight: false
        });

        // Label: "60 ft" along the hypotenuse (midpoint, offset outward)
        // Midpoint of hypotenuse B-C
        var midHypX = (B.X() + C.X()) / 2;
        var midHypY = (B.Y() + C.Y()) / 2;
        // Offset to the right of the hypotenuse
        board.create('text', [midHypX + 0.5, midHypY + 0.3, '60 ft'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Label: "height of ramp" along the left vertical side
        // Position to the left of the vertical segment, rotated appearance via line breaks
        var midVertX = A.X();
        var midVertY = (A.Y() + C.Y()) / 2;
        board.create('text', [midVertX - 1.4, midVertY + 1.2, 'height'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [midVertX - 1.4, midVertY + 0.5, 'of ramp'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
