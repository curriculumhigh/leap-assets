<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladder Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 14, 7, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices (hidden)
        var A = board.create('point', [0, 0], { name: '', visible: false, fixed: true });
        var B = board.create('point', [0, 11.6], { name: '', visible: false, fixed: true });
        var C = board.create('point', [4.7, 0], { name: '', visible: false, fixed: true });

        // Triangle edges — dark gray, no fill
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at A (small square)
        var sqSize = 0.7;
        var sq1 = board.create('point', [sqSize, 0], { name: '', visible: false, fixed: true });
        var sq2 = board.create('point', [sqSize, sqSize], { name: '', visible: false, fixed: true });
        var sq3 = board.create('point', [0, sqSize], { name: '', visible: false, fixed: true });

        board.create('segment', [sq1, sq2], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // Label: "11.6 ft" — left of vertical leg AB
        board.create('text', [-1.2, 5.8, '11.6 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Label: "4.7 ft" — below horizontal leg AC
        board.create('text', [2.35, -1.0, '4.7 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Label: "x" — upper-right of hypotenuse BC
        board.create('text', [3.2, 6.8, 'x'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
