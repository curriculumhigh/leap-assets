<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle PQR with Altitude</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 5.3, 9.2, -1.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Points ──────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -14] }
        });
        var Q = board.create('point', [2.5, 3.5], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 12] }
        });
        var R = board.create('point', [7.4, 0], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -14] }
        });
        var S = board.create('point', [2.5, 0], {
            name: 'S', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });

        // ── Segments ────────────────────────────────────────────────────
        board.create('segment', [P, Q], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [Q, R], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, R], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [Q, S], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Right-angle marker at Q ─────────────────────────────────────
        var qx = 2.5, qy = 3.5;
        var px = 0, py = 0;
        var rx = 7.4, ry = 0;

        var dQP_x = px - qx, dQP_y = py - qy;
        var lenQP = Math.sqrt(dQP_x * dQP_x + dQP_y * dQP_y);
        var uQP_x = dQP_x / lenQP, uQP_y = dQP_y / lenQP;

        var dQR_x = rx - qx, dQR_y = ry - qy;
        var lenQR = Math.sqrt(dQR_x * dQR_x + dQR_y * dQR_y);
        var uQR_x = dQR_x / lenQR, uQR_y = dQR_y / lenQR;

        var sq = 0.35;

        board.create('polygon', [
            [qx + sq * uQP_x, qy + sq * uQP_y],
            [qx + sq * uQP_x + sq * uQR_x, qy + sq * uQP_y + sq * uQR_y],
            [qx + sq * uQR_x, qy + sq * uQR_y],
            [qx, qy]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // ── Right-angle marker at S ─────────────────────────────────────
        var sqS = 0.35;

        board.create('polygon', [
            [2.5 - sqS, 0],
            [2.5 - sqS, sqS],
            [2.5, sqS],
            [2.5, 0]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false, hasInnerPoints: false
        });

        // ── Dimension labels ────────────────────────────────────────────
        var midPS_x = (0 + 2.5) / 2;
        var midPS_y = 0 - 0.55;
        board.create('text', [midPS_x, midPS_y, '2.5 \\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var midSR_x = (2.5 + 7.4) / 2;
        var midSR_y = 0 - 0.55;
        board.create('text', [midSR_x, midSR_y, '4.9 \\text{ ft}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var xLabel_x = 2.5 + 0.35;
        var xLabel_y = (3.5 + 0) / 2;
        board.create('text', [xLabel_x, xLabel_y, 'x'], {
            useKatex: true, fontSize: 14, color: '#2563EB',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
