<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x ≤ -4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9.5, 3, 9.5, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Y = 0;
        var TICK_H = 0.2;
        var LINE_COLOR = '#222222';
        var SOL_COLOR = '#2563EB';

        // Base number line with arrows on both ends
        board.create('arrow', [[-9, Y], [9, Y]], {
            strokeColor: LINE_COLOR,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        board.create('arrow', [[9, Y], [-9, Y]], {
            strokeColor: LINE_COLOR,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Tick marks and labels from -8 to 8
        for (var i = -8; i <= 8; i++) {
            board.create('segment', [[i, Y - TICK_H], [i, Y + TICK_H]], {
                strokeColor: LINE_COLOR,
                strokeWidth: 1.2,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, Y - 0.85, String(i)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: LINE_COLOR,
                fixed: true,
                highlight: false
            });
        }

        // Solution ray: from -4 extending left to -9 (with arrow)
        board.create('arrow', [[-4, Y], [-9, Y]], {
            strokeColor: SOL_COLOR,
            strokeWidth: 2.5,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // Closed circle at x = -4 (filled, since ≤ includes -4)
        board.create('point', [-4, Y], {
            name: '',
            size: 5,
            fillColor: SOL_COLOR,
            strokeColor: SOL_COLOR,
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
