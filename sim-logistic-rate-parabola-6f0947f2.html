<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Rate dP/dt vs P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-80, 155, 560, -25],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // ── Grid lines ──────────────────────────────────────
        var i;
        for (i = 0; i <= 500; i += 100) {
            board.create('segment', [[i, -25], [i, 155]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 0; i <= 140; i += 20) {
            board.create('segment', [[-80, i], [560, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Axes ─────────────────────────────────────────────
        board.create('arrow', [[0, 0], [535, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        board.create('arrow', [[0, 0], [0, 150]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // ── Tick marks and labels — x-axis (P) ─────────────
        for (i = 100; i <= 500; i += 100) {
            board.create('segment', [[i, -3], [i, 3]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [i, -12, String(i)], {
                fontSize: 11, anchorX: 'middle', anchorY: 'middle',
                color: '#333', fixed: true, highlight: false
            });
        }

        // ── Tick marks and labels — y-axis (dP/dt) ─────────
        for (i = 20; i <= 140; i += 20) {
            board.create('segment', [[-6, i], [6, i]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [-14, i, String(i)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle',
                color: '#333', fixed: true, highlight: false
            });
        }

        // ── Origin label ────────────────────────────────────
        board.create('text', [-14, -12, '0'], {
            fontSize: 11, anchorX: 'right', anchorY: 'middle',
            color: '#444444', fixed: true, highlight: false
        });

        // ── Axis labels (KaTeX) ─────────────────────────────
        board.create('text', [520, -14, 'P'], {
            fontSize: 14, color: '#333', fixed: true, highlight: false,
            useKatex: true, anchorX: 'middle', anchorY: 'top'
        });
        board.create('text', [18, 145, '\\dfrac{dP}{dt}'], {
            fontSize: 14, color: '#333', fixed: true, highlight: false,
            useKatex: true, anchorX: 'left', anchorY: 'top'
        });

        // ── Parabola: rate = 0.002 P (500 − P) ─────────────
        board.create('functiongraph', [
            function(P) { return 0.002 * P * (500 - P); },
            0, 500
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Vertex point (unlabeled) ───────────────────────
        board.create('point', [250, 125], {
            name: '', size: 5, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
