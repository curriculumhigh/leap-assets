<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangles ABC and PQR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 9, 6, -1],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 8.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_ABC = '#2563EB';
        var COL_PQR = '#059669';

        // ── Triangle ABC: A(-1,2), B(1,2), C(0,4) ──────────────────────
        var A = board.create('point', [-1, 2], {
            name: '', size: 4, color: COL_ABC, fixed: true, highlight: false, showInfobox: false
        });
        var B = board.create('point', [1, 2], {
            name: '', size: 4, color: COL_ABC, fixed: true, highlight: false, showInfobox: false
        });
        var C = board.create('point', [0, 4], {
            name: '', size: 4, color: COL_ABC, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_ABC, strokeWidth: 2.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Labels for ABC
        board.create('text', [-1.1, 1.3, 'A(-1,\\,2)'], {
            useKatex: true, fontSize: 12, color: COL_ABC, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [1.1, 1.3, 'B(1,\\,2)'], {
            useKatex: true, fontSize: 12, color: COL_ABC, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [0, 4.4, 'C(0,\\,4)'], {
            useKatex: true, fontSize: 12, color: COL_ABC, fixed: true, highlight: false, anchorX: 'middle'
        });

        // ── Triangle PQR: P(0,3), Q(4,3), R(2,7) ───────────────────────
        var P = board.create('point', [0, 3], {
            name: '', size: 4, color: COL_PQR, fixed: true, highlight: false, showInfobox: false
        });
        var Q = board.create('point', [4, 3], {
            name: '', size: 4, color: COL_PQR, fixed: true, highlight: false, showInfobox: false
        });
        var R = board.create('point', [2, 7], {
            name: '', size: 4, color: COL_PQR, fixed: true, highlight: false, showInfobox: false
        });

        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_PQR, strokeWidth: 2.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Labels for PQR
        board.create('text', [-0.1, 2.3, 'P(0,\\,3)'], {
            useKatex: true, fontSize: 12, color: COL_PQR, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [4.1, 2.3, 'Q(4,\\,3)'], {
            useKatex: true, fontSize: 12, color: COL_PQR, fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [2, 7.4, 'R(2,\\,7)'], {
            useKatex: true, fontSize: 12, color: COL_PQR, fixed: true, highlight: false, anchorX: 'middle'
        });
    </script>
</body>
</html>
