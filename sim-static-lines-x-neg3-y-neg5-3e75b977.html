<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Lines x=-3 and y=-5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 2, 5, -7],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Manually create axes with forced tick distance of 1
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            },
            highlight: false
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                includeBoundaries: false
            },
            highlight: false
        });

        // Vertical line x = -3 (black)
        board.create('line', [[-3, 0], [-3, 1]], {
            strokeColor: '#222222', strokeWidth: 1.0, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Label for x = -3 (black)
        board.create('text', [-4.5, 1.2, 'x = -3'], {
            fontSize: 11, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Horizontal line y = -5 (blue)
        board.create('line', [[0, -5], [1, -5]], {
            strokeColor: '#2563EB', strokeWidth: 1.0, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Label for y = 5 (blue, as requested)
        board.create('text', [2.5, -4.2, 'y = 5'], {
            fontSize: 11, color: '#2563EB', fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
