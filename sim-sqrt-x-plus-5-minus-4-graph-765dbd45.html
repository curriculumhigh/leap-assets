<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of -sqrt(x+5)+4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 6, 13, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* Manual grid at 1-unit spacing — major lines only */
        var bb = board.getBoundingBox();
        var xMin = Math.ceil(bb[0]);
        var xMax = Math.floor(bb[2]);
        var yMin = Math.ceil(bb[3]);
        var yMax = Math.floor(bb[1]);
        var i;

        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }

        /* Create axes manually for full tick control */
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                strokeWidth: 0,
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                label: { fontSize: 8, offset: [0, -10], anchorX: 'middle' },
                drawZero: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            highlight: false,
            ticks: {
                strokeColor: '#444444',
                strokeWidth: 0,
                majorHeight: 0,
                minorHeight: 0,
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                label: { fontSize: 8, offset: [-12, 0], anchorY: 'middle' },
                drawZero: false
            }
        });

        /* Axis labels near arrow tips */
        board.create('text', [12.4, -0.4, '<i>x</i>'], {
            fontSize: 12, fixed: true, highlight: false
        });
        board.create('text', [0.3, 5.5, '<i>y</i>'], {
            fontSize: 12, fixed: true, highlight: false
        });

        /* Function: f(x) = -sqrt(x + 5) + 4, domain x >= -5 */
        board.create('functiongraph', [
            function(x) {
                if (x < -5) return NaN;
                return -Math.sqrt(x + 5) + 4;
            },
            -5, 13
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        /* Endpoint at (-5, 4) */
        board.create('point', [-5, 4], {
            name: '',
            size: 4,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        /* x-intercept at (11, 0) */
        board.create('point', [11, 0], {
            name: '',
            size: 4,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
