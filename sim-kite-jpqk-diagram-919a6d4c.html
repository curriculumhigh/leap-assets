<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kite JPQK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 5.5, 9, -5.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -4] }
        });

        var J = board.create('point', [1.2, 3.2], {
            name: 'J', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-8, 10] }
        });

        var K = board.create('point', [1.2, -3.2], {
            name: 'K', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-8, -16] }
        });

        var Q = board.create('point', [7, 0], {
            name: 'Q', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -4] }
        });

        // ── Kite outline (no fill) ─────────────────────────────────────
        board.create('polygon', [J, P, K, Q], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Shared diagonal PQ (solid) ─────────────────────────────────
        board.create('segment', [P, Q], {
            strokeColor: '#555555', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // ── Label placement helper ──────────────────────────────────────
        function labelOffset(p1x, p1y, p2x, p2y, dist) {
            var mx = (p1x + p2x) / 2;
            var my = (p1y + p2y) / 2;
            var dx = p2x - p1x;
            var dy = p2y - p1y;
            var len = Math.sqrt(dx * dx + dy * dy);
            var nx = -dy / len;
            var ny = dx / len;
            return [mx + dist * nx, my + dist * ny];
        }

        // JP: 4 cm label to the left (outside the kite)
        var jpPos = labelOffset(1.2, 3.2, 0, 0, -0.8);
        board.create('text', [jpPos[0], jpPos[1], '4\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // PK: 4 cm label to the left (outside the kite)
        var pkPos = labelOffset(0, 0, 1.2, -3.2, -0.8);
        board.create('text', [pkPos[0], pkPos[1], '4\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // JQ: 7 cm label above (outside the kite)
        var jqPos = labelOffset(1.2, 3.2, 7, 0, 0.6);
        board.create('text', [jqPos[0], jqPos[1], '7\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // KQ: 7 cm label below (outside the kite)
        var kqPos = labelOffset(1.2, -3.2, 7, 0, -0.6);
        board.create('text', [kqPos[0], kqPos[1], '7\\text{ cm}'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
