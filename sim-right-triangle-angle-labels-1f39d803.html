<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — Angle Labels</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7.5, 8.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        // A = bottom-left (37° angle)
        // B = bottom-right (90° right angle)
        // C = top-right (x° angle)
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [7, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [7, 7 * Math.tan(37 * Math.PI / 180)], { visible: false, fixed: true, name: '' });

        // Triangle edges
        var segAB = board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        var segBC = board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        var segCA = board.create('segment', [C, A], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        // Right angle square at B (90°)
        var sqSize = 0.55;
        var sqP1 = board.create('point', [B.X() - sqSize, B.Y()], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [B.X() - sqSize, B.Y() + sqSize], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [B.X(), B.Y() + sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // 37° angle arc at A
        board.create('nonReflexAngle', [B, A, C], {
            radius: 1.0,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // 37° label along bisector at A
        var angA = Math.atan2(C.Y() - A.Y(), C.X() - A.X()) / 2;
        board.create('text', [
            A.X() + 1.55 * Math.cos(angA),
            A.Y() + 1.55 * Math.sin(angA),
            '37^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // x° angle arc at C
        board.create('nonReflexAngle', [A, C, B], {
            radius: 0.9,
            fillColor: '#555555', fillOpacity: 0.06,
            strokeColor: '#555555', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // x° label along bisector at C
        var angCA = Math.atan2(A.Y() - C.Y(), A.X() - C.X());
        var angCB = Math.atan2(B.Y() - C.Y(), B.X() - C.X());
        var bisC = (angCA + angCB) / 2;
        var testX = C.X() + Math.cos(bisC);
        var testY = C.Y() + Math.sin(bisC);
        if (testX > C.X() + 0.5 || testY > C.Y()) {
            bisC = bisC + Math.PI;
        }
        board.create('text', [
            C.X() + 1.4 * Math.cos(bisC),
            C.Y() + 1.4 * Math.sin(bisC),
            'x^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#333',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
