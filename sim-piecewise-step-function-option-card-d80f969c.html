<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Step Function</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 10.5, 15.5, -6.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // ── Manual grid ─────────────────────────────────────────────────
        var bb = board.getBoundingBox();
        var i;
        for (i = 0; i <= 14; i += 2) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }
        for (i = -6; i <= 10; i += 1) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, straightFirst: true, straightLast: true
            });
        }

        // ── X-axis ──────────────────────────────────────────────────────
        var xAxis = board.create('arrow', [[bb[0], 0], [bb[2], 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        for (i = 2; i <= 14; i += 2) {
            board.create('segment', [[i, -0.15], [i, 0.15]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [i, -0.55, String(i)], {
                fontSize: 9, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // ── Y-axis ──────────────────────────────────────────────────────
        var yAxis = board.create('arrow', [[0, bb[3]], [0, bb[1]]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        for (i = -6; i <= 10; i += 1) {
            if (i === 0) continue;
            board.create('segment', [[-0.15, i], [0.15, i]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [-0.55, i, String(i)], {
                fontSize: 9, anchorX: 'middle', anchorY: 'middle',
                color: '#444444', fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [15.0, -0.5, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 10.1, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        var COL = '#222222';
        var SW = 1.8;
        var PT_SIZE = 3;

        // --- Segment 1: y = 8 on [2, 5) ---
        board.create('segment', [[2, 8], [5, 8]], {
            strokeColor: COL, strokeWidth: SW, fixed: true, highlight: false
        });
        board.create('point', [2, 8], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [5, 8], {
            name: '', size: PT_SIZE, fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false
        });

        // --- Segment 2: y = 3 on [5, 7) ---
        board.create('segment', [[5, 3], [7, 3]], {
            strokeColor: COL, strokeWidth: SW, fixed: true, highlight: false
        });
        board.create('point', [5, 3], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [7, 3], {
            name: '', size: PT_SIZE, fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false
        });

        // --- Segment 3: y = -1 on [7, 10] ---
        board.create('segment', [[7, -1], [10, -1]], {
            strokeColor: COL, strokeWidth: SW, fixed: true, highlight: false
        });
        board.create('point', [7, -1], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('point', [10, -1], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });

        // --- Segment 4: y = -4 on (10, 13] ---
        board.create('segment', [[10, -4], [13, -4]], {
            strokeColor: COL, strokeWidth: SW, fixed: true, highlight: false
        });
        board.create('point', [10, -4], {
            name: '', size: PT_SIZE, fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [13, -4], {
            name: '', size: PT_SIZE, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
