<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upward Parabola — No X-Intercepts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 8, 5, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // X-axis with arrows on both ends
        board.create('arrow', [[-4.6, 0], [4.6, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 }
        });

        // Y-axis with arrows on both ends
        board.create('arrow', [[0, -2.6], [0, 7.6]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 }
        });

        // Axis labels
        board.create('text', [4.4, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.3, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Origin label
        board.create('text', [-0.5, -0.5, '0'], { fontSize: 12, fixed: true, highlight: false });

        // Upward parabola that does not cross or touch x-axis
        // f(x) = x^2 - 2x + 3, vertex at (1, 2), discriminant = 4 - 12 = -8 < 0
        board.create('functiongraph', [
            function(x) { return x * x - 2 * x + 3; }
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
    </script>
</body>
</html>
