<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle on Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 4, 9, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 3.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Points
        var P1 = board.create('point', [1, 2], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var P2 = board.create('point', [7, -6], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var P3 = board.create('point', [1, -6], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels
        board.create('text', [1.3, 2.5, '(1, 2)'], {
            fontSize: 12, color: '#222222', fixed: true, useKatex: true
        });
        board.create('text', [7.3, -5.5, '(7, -6)'], {
            fontSize: 12, color: '#222222', fixed: true, useKatex: true
        });
        board.create('text', [1.3, -6.6, '(1, -6)'], {
            fontSize: 12, color: '#222222', fixed: true, useKatex: true
        });

        // Dashed segments — hypotenuse
        board.create('segment', [P1, P2], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Dashed segments — vertical leg (1,2) to (1,-6)
        board.create('segment', [P1, P3], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Dashed segments — horizontal leg (1,-6) to (7,-6)
        board.create('segment', [P3, P2], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        // Right angle marker at (1, -6)
        board.create('angle', [P2, P3, P1], {
            radius: 0.4,
            orthoType: 'square',
            strokeColor: '#222222', strokeWidth: 1.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false
        });

        // Label 'a' on horizontal leg — midpoint of (1,-6) to (7,-6)
        board.create('text', [4, -6.6, 'a'], {
            fontSize: 13, color: '#222222', fixed: true, useKatex: true, anchorX: 'middle'
        });

        // Label 'b' on vertical leg — midpoint of (1,2) to (1,-6)
        board.create('text', [0.3, -2, 'b'], {
            fontSize: 13, color: '#222222', fixed: true, useKatex: true, anchorX: 'middle'
        });
    </script>
</body>
</html>
