<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Temperature Readings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.7, 98, 14.2, -16],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // units per pixel (for pixel-sized offsets)
        var UX = (14.2 + 1.7) / board.canvasWidth;
        var UY = (98 + 16) / board.canvasHeight;
        var i;

        /* ── Grid lines ─────────────────────────────────────────────── */
        for (i = 1; i <= 13; i++) {
            board.create('segment', [[i, 0], [i, 90]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }
        for (i = 10; i <= 90; i += 10) {
            board.create('segment', [[0, i], [13, i]], { strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false });
        }

        /* ── Axes ───────────────────────────────────────────────────── */
        board.create('arrow', [[0, 0], [13.75, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });
        board.create('arrow', [[0, 0], [0, 96]], {
            strokeColor: '#444444', strokeWidth: 1.2, lastArrow: { type: 2, size: 6 }, fixed: true, highlight: false
        });

        /* ── Ticks and tick labels ──────────────────────────────────── */
        for (i = 1; i <= 13; i++) {
            board.create('segment', [[i, -4 * UY], [i, 4 * UY]], { strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false });
            board.create('text', [i, -13 * UY, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
            });
        }
        for (i = 10; i <= 90; i += 10) {
            board.create('segment', [[-4 * UX, i], [4 * UX, i]], { strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false });
            board.create('text', [-8 * UX, i, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
            });
        }
        board.create('text', [-8 * UX, -13 * UY, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
        });

        /* ── Axis name labels (KaTeX) ───────────────────────────────── */
        board.create('text', [13.75, -32 * UY, 't\\text{ (hours)}'], {
            fontSize: 14, color: '#222222', anchorX: 'right', anchorY: 'middle', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [10 * UX, 95, 'T\\text{ (}{}^{\\circ}\\text{F)}'], {
            fontSize: 14, color: '#222222', anchorX: 'left', anchorY: 'middle', useKatex: true, fixed: true, highlight: false
        });

        /* ── Temperature curve T(t) = 55 + 6t − t²/3, 0 ≤ t ≤ 12 ───── */
        var COL = '#222222';   // primary curve
        function T(t) { return 55 + 6 * t - t * t / 3; }
        board.create('functiongraph', [function(t) { return T(t); }, 0, 12], {
            strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false
        });

        /* ── Sensor readings (key points, single curve) ─────────────── */
        // [t, T, label dx (px), label dy (px), anchorX]
        var readings = [
            [3, 70, -8, 9, 'right'],
            [6, 79, -8, 9, 'right'],
            [9, 82, 0, 11, 'middle'],
            [12, 79, 8, 9, 'left']
        ];
        for (i = 0; i < readings.length; i++) {
            var r = readings[i];
            board.create('point', [r[0], r[1]], {
                name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });
            board.create('text', [r[0] + r[2] * UX, r[1] + r[3] * UY, String(r[1])], {
                fontSize: 13, color: '#222222', anchorX: r[4], anchorY: 'bottom',
                useKatex: true, fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
