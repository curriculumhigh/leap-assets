<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Cylinder — r=5, h=8.4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 2px; height: calc(100% - 4px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 2px; height: calc(100% - 4px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.2, 7.8, 5.8, -0.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var cx = 0;
        var rVis = 3;
        var ellipseB = 0.7;
        var topY = 6.5;
        var botY = 0.5;
        var COL_SHAPE = '#555555';
        var COL_DIM = '#3B82F6';
        var SHAPE_W = 2.0;
        var DIM_W = 1.5;

        // Top ellipse (full, solid)
        board.create('curve', [
            function(t) { return cx + rVis * Math.cos(t); },
            function(t) { return topY + ellipseB * Math.sin(t); },
            0, 2 * Math.PI
        ], {
            strokeColor: COL_SHAPE, strokeWidth: SHAPE_W, fixed: true, highlight: false
        });

        // Bottom ellipse — front half (solid)
        board.create('curve', [
            function(t) { return cx + rVis * Math.cos(t); },
            function(t) { return botY + ellipseB * Math.sin(t); },
            Math.PI, 2 * Math.PI
        ], {
            strokeColor: COL_SHAPE, strokeWidth: SHAPE_W, fixed: true, highlight: false
        });

        // Bottom ellipse — back half (dashed)
        board.create('curve', [
            function(t) { return cx + rVis * Math.cos(t); },
            function(t) { return botY + ellipseB * Math.sin(t); },
            0, Math.PI
        ], {
            strokeColor: COL_SHAPE, strokeWidth: SHAPE_W * 0.7, dash: 2,
            fixed: true, highlight: false
        });

        // Vertical side edges
        board.create('segment', [[cx - rVis, topY], [cx - rVis, botY]], {
            strokeColor: COL_SHAPE, strokeWidth: SHAPE_W, fixed: true, highlight: false
        });
        board.create('segment', [[cx + rVis, topY], [cx + rVis, botY]], {
            strokeColor: COL_SHAPE, strokeWidth: SHAPE_W, fixed: true, highlight: false
        });

        // Radius line on top ellipse
        board.create('segment', [[cx, topY], [cx + rVis, topY]], {
            strokeColor: COL_DIM, strokeWidth: DIM_W, fixed: true, highlight: false
        });

        // Radius label
        board.create('text', [cx + rVis / 2, topY + 0.55, '5\\text{ cm}'], {
            useKatex: true, fontSize: 13, color: COL_DIM,
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // Height dimension along the right side
        var hx = cx + rVis + 0.9;

        board.create('segment', [[hx, topY], [hx, botY]], {
            strokeColor: COL_DIM, strokeWidth: DIM_W, fixed: true, highlight: false,
            firstArrow: { type: 2, size: 5 },
            lastArrow: { type: 2, size: 5 }
        });

        board.create('segment', [[hx - 0.3, topY], [hx + 0.3, topY]], {
            strokeColor: COL_DIM, strokeWidth: DIM_W, fixed: true, highlight: false
        });
        board.create('segment', [[hx - 0.3, botY], [hx + 0.3, botY]], {
            strokeColor: COL_DIM, strokeWidth: DIM_W, fixed: true, highlight: false
        });

        board.create('text', [hx + 0.4, (topY + botY) / 2, '8.4\\text{ cm}'], {
            useKatex: true, fontSize: 13, color: COL_DIM,
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
