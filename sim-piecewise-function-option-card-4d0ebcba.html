<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise Function Option Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 8.5, 8.5, -4.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Manually create axes with controlled ticks
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 2,
                insertTicks: false,
                drawZero: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                drawZero: false
            }
        });

        // Axis labels
        board.create('text', [8.0, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 8.0, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        var COL = '#222222';

        // Piece 1: y = -2x - 5, x < -2
        board.create('functiongraph', [
            function(x) { return -2 * x - 5; },
            -7, -2
        ], { strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false });

        // Piece 2: y = x + 1, -2 <= x <= 4
        board.create('functiongraph', [
            function(x) { return x + 1; },
            -2, 4
        ], { strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false });

        // Piece 3: y = -x + 9, x > 4
        board.create('functiongraph', [
            function(x) { return -x + 9; },
            4, 9
        ], { strokeColor: COL, strokeWidth: 1.8, fixed: true, highlight: false });

        // Closed dot at (-2, -1) — piece 2 includes x = -2
        board.create('point', [-2, -1], {
            name: '', size: 3, color: COL, fixed: true, highlight: false,
            showInfobox: false
        });

        // Open circle at (4, 5) from piece 3 side, then closed dot on top from piece 2
        board.create('point', [4, 5], {
            name: '', size: 3, fillColor: '#ffffff', strokeColor: COL, strokeWidth: 1.5,
            fixed: true, highlight: false, showInfobox: false, layer: 7
        });
        board.create('point', [4, 5], {
            name: '', size: 3, color: COL, fixed: true, highlight: false,
            showInfobox: false, layer: 8
        });

        // Function label — name only
        board.create('text', [-5.5, 5.5, 'y'], {
            useKatex: true, fontSize: 11, color: COL, fixed: true, highlight: false
        });
    </script>
</body>
</html>
