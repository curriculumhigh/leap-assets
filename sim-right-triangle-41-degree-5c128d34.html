<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — 41°</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var abLen = 6.0;
        var acLen = abLen * Math.tan(41 * Math.PI / 180);

        var Ax = 2, Ay = 1.5;
        var Bx = Ax + abLen, By = Ay;
        var Cx = Ax, Cy = Ay + acLen;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [Ax - 2.5, Cy + 2, Bx + 2, Ay - 2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [Ax, Ay], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var B = board.create('point', [Bx, By], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var C = board.create('point', [Cx, Cy], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        var sq = 0.45;
        var sqP1 = board.create('point', [Ax + sq, Ay], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [Ax + sq, Ay + sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [Ax, Ay + sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('nonReflexAngle', [C, B, A], {
            radius: 0.85,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        var angBA = Math.PI;
        var angBC = Math.atan2(Cy - By, Cx - Bx);
        var bisAngle = (angBA + angBC) / 2;
        var labelR = 1.4;

        board.create('text', [
            Bx + labelR * Math.cos(bisAngle),
            By + labelR * Math.sin(bisAngle),
            '41^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [
            (Ax + Bx) / 2,
            Ay - 0.65,
            '30'
        ], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        board.create('text', [
            Ax - 0.6,
            (Ay + Cy) / 2,
            'x'
        ], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
