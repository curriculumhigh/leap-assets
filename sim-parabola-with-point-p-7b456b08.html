<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola with Point P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 5, 6, -7],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { visible: false }
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { visible: false }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 4.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Parabola: f(x) = (x+1)(x-3) = x^2 - 2x - 3
        // Vertex at (1, -3), x-intercepts at (-1, 0) and (3, 0)
        board.create('functiongraph', [
            function(x) { return (x + 1) * (x - 3); }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Function label — name only
        board.create('text', [4.0, 3.5, 'y = f(x)'], {
            fontSize: 13,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });

        // Point P at (1, -5)
        board.create('point', [1, -5], {
            name: '',
            size: 5,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Label for P
        board.create('text', [1.35, -5.1, 'P'], {
            fontSize: 14,
            color: '#222222',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
