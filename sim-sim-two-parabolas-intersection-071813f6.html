<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intersection of Two Parabolas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 7.5, 6, -3.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 7.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Primary curve: f(x) = -(x-1)^2 + 5  — vertex at (1, 5)
        board.create('functiongraph', [
            function(x) { return -(x - 1) * (x - 1) + 5; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Secondary curve: g(x) = (x+1)(x-3) + 1  — vertex at (1, -3)
        board.create('functiongraph', [
            function(x) { return (x + 1) * (x - 3) + 1; }
        ], { strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false });

        // Function labels (name + rule, near each vertex)
        // f vertex at (1, 5) — label just to the right and slightly above
        board.create('text', [1.3, 5.7, 'f(x) = -(x-1)^2 + 5'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left'
        });

        // g vertex at (1, -3) — label just to the right and slightly below
        board.create('text', [1.3, -3.2, 'g(x) = (x+1)(x-3) + 1'], {
            fontSize: 12, color: '#2563EB', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left'
        });

        // Intersection points
        board.create('point', [-1, 1], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [3, 1], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels at intersection points
        board.create('text', [-1.15, 1.6, '(-1,\\, 1)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'right'
        });
        board.create('text', [3.15, 1.6, '(3,\\, 1)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left'
        });
    </script>
</body>
</html>
