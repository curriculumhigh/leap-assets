<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Box Plot — Team A vs Team B</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [2, 8.5, 43, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_A = '#2563EB';
        var COL_B = '#059669';
        var COL_AXIS = '#444444';

        // ── Data ────────────────────────────────────────────────────────
        var teamA = { min: 10, q1: 18, med: 24, q3: 30, max: 36 };
        var teamB = { min: 14, q1: 20, med: 22, q3: 26, max: 34 };

        // ── Layout ──────────────────────────────────────────────────────
        var BOX_H = 0.8;
        var CAP_H = 0.3;
        var Y_A = 6.05;
        var Y_B = 2.55;
        var LABEL_OFFSET = 0.35;

        // ── Horizontal axis ─────────────────────────────────────────────
        board.create('segment', [[5, 0.5], [41, 0.5]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        var tickVals = [5, 10, 15, 20, 25, 30, 35, 40];
        for (var i = 0; i < tickVals.length; i++) {
            var tv = tickVals[i];
            board.create('segment', [[tv, 0.2], [tv, 0.8]], {
                strokeColor: COL_AXIS, strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [tv, -0.1, String(tv)], {
                anchorX: 'middle', anchorY: 'top', fontSize: 11,
                color: COL_AXIS, fixed: true, highlight: false
            });
        }

        board.create('text', [22.5, -0.65, 'Time (seconds)'], {
            anchorX: 'middle', anchorY: 'top', fontSize: 13,
            color: COL_AXIS, fixed: true, highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // ── Box plot drawing function ───────────────────────────────────
        function drawBoxPlot(data, yCenter, color) {
            var yTop = yCenter + BOX_H;
            var yBot = yCenter - BOX_H;

            // Box (Q1 to Q3)
            var bPts = [
                board.create('point', [data.q1, yTop], { visible: false, fixed: true, name: '' }),
                board.create('point', [data.q3, yTop], { visible: false, fixed: true, name: '' }),
                board.create('point', [data.q3, yBot], { visible: false, fixed: true, name: '' }),
                board.create('point', [data.q1, yBot], { visible: false, fixed: true, name: '' })
            ];
            board.create('polygon', bPts, {
                fillColor: color, fillOpacity: 0.15,
                borders: { strokeColor: color, strokeWidth: 1.8 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // Median line
            board.create('segment', [[data.med, yTop], [data.med, yBot]], {
                strokeColor: color, strokeWidth: 2.0, fixed: true, highlight: false
            });

            // Whiskers
            board.create('segment', [[data.min, yCenter], [data.q1, yCenter]], {
                strokeColor: color, strokeWidth: 1.5, fixed: true, highlight: false
            });
            board.create('segment', [[data.q3, yCenter], [data.max, yCenter]], {
                strokeColor: color, strokeWidth: 1.5, fixed: true, highlight: false
            });

            // Whisker caps
            board.create('segment', [[data.min, yCenter - CAP_H], [data.min, yCenter + CAP_H]], {
                strokeColor: color, strokeWidth: 1.5, fixed: true, highlight: false
            });
            board.create('segment', [[data.max, yCenter - CAP_H], [data.max, yCenter + CAP_H]], {
                strokeColor: color, strokeWidth: 1.5, fixed: true, highlight: false
            });

            // Value labels below the box plot
            var labelY = yBot - LABEL_OFFSET;
            var vals = [data.min, data.q1, data.med, data.q3, data.max];
            for (var j = 0; j < vals.length; j++) {
                board.create('text', [vals[j], labelY, String(vals[j])], {
                    anchorX: 'middle', anchorY: 'top', fontSize: 11,
                    color: color, fixed: true, highlight: false,
                    cssStyle: 'font-weight: 600;'
                });
            }
        }

        // ── Draw both box plots ─────────────────────────────────────────
        drawBoxPlot(teamA, Y_A, COL_A);
        drawBoxPlot(teamB, Y_B, COL_B);

        // ── Team labels ─────────────────────────────────────────────────
        board.create('text', [4.8, Y_A, 'Team A'], {
            anchorX: 'right', anchorY: 'middle', fontSize: 13,
            color: COL_A, fixed: true, highlight: false,
            cssStyle: 'font-weight: 700;'
        });
        board.create('text', [4.8, Y_B, 'Team B'], {
            anchorX: 'right', anchorY: 'middle', fontSize: 13,
            color: COL_B, fixed: true, highlight: false,
            cssStyle: 'font-weight: 700;'
        });
    </script>
</body>
</html>
