<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle — Side Lengths</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.8, 5.8, 5.8, -2.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var Ax = 0, Ay = 4.2;
        var Bx = -2.8, By = -0.8;
        var Cx = 2.8, Cy = -0.8;

        var A = board.create('point', [Ax, Ay], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var B = board.create('point', [Bx, By], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });
        var C = board.create('point', [Cx, Cy], {
            name: '', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false
        });

        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        var arcR = 0.6;
        var TICK_HALF = 0.16;
        var COL_MARK = '#DC2626';

        function rayAngle(fx, fy, tx, ty) {
            return Math.atan2(ty - fy, tx - fx);
        }

        function drawAngleArcWithTick(vx, vy, p1x, p1y, p2x, p2y) {
            var a1 = rayAngle(vx, vy, p1x, p1y);
            var a2 = rayAngle(vx, vy, p2x, p2y);

            var sweep = a2 - a1;
            if (sweep < 0) sweep += 2 * Math.PI;
            if (sweep > Math.PI) {
                var tmp = a1;
                a1 = a2;
                a2 = tmp;
                sweep = a2 - a1;
                if (sweep < 0) sweep += 2 * Math.PI;
            }

            var startA = a1;
            var endA = a1 + sweep;

            board.create('curve', [
                function(t) { return vx + arcR * Math.cos(t); },
                function(t) { return vy + arcR * Math.sin(t); },
                startA,
                endA
            ], {
                strokeColor: COL_MARK, strokeWidth: 1.5,
                fixed: true, highlight: false
            });

            var midA = startA + sweep / 2;
            var mx = vx + arcR * Math.cos(midA);
            var my = vy + arcR * Math.sin(midA);

            var rdx = Math.cos(midA);
            var rdy = Math.sin(midA);

            board.create('segment', [
                [mx - rdx * TICK_HALF, my - rdy * TICK_HALF],
                [mx + rdx * TICK_HALF, my + rdy * TICK_HALF]
            ], {
                strokeColor: COL_MARK, strokeWidth: 1.5,
                fixed: true, highlight: false
            });
        }

        drawAngleArcWithTick(Bx, By, Ax, Ay, Cx, Cy);
        drawAngleArcWithTick(Cx, Cy, Ax, Ay, Bx, By);

        var lmx = (Ax + Bx) / 2;
        var lmy = (Ay + By) / 2;
        board.create('text', [lmx - 0.7, lmy, '7 \\text{ in.}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var rmx = (Ax + Cx) / 2;
        var rmy = (Ay + Cy) / 2;
        board.create('text', [rmx + 0.7, rmy, '(2x-1) \\text{ in.}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var bmx = (Bx + Cx) / 2;
        var bmy = (By + Cy) / 2;
        board.create('text', [bmx, bmy - 0.6, '(x+2) \\text{ in.}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
