<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Lines A–D for m ≤ 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 10, 8.5, -1],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var yPositions = [8, 5.8, 3.6, 1.4];
        var labels = ['A', 'B', 'C', 'D'];
        var xMin = 0;
        var xMax = 6;
        var circleX = 3;
        var tickStart = 0;
        var tickEnd = 6;

        var configs = [
            { closed: true,  left: true  },
            { closed: false, left: true  },
            { closed: true,  left: false },
            { closed: false, left: false }
        ];

        var LINE_COL = '#444444';
        var MARK_COL = '#222222';
        var ARROW_EXT = 0.9;

        for (var i = 0; i < 4; i++) {
            var y = yPositions[i];
            var cfg = configs[i];

            board.create('text', [-1.2, y, '<b>' + labels[i] + '</b>'], {
                fontSize: 15, color: '#222222', fixed: true, highlight: false,
                anchorX: 'middle', anchorY: 'middle'
            });

            board.create('segment', [[xMin, y], [xMax, y]], {
                strokeColor: LINE_COL, strokeWidth: 1.2, fixed: true, highlight: false
            });

            for (var t = tickStart; t <= tickEnd; t++) {
                board.create('segment', [[t, y - 0.25], [t, y + 0.25]], {
                    strokeColor: LINE_COL, strokeWidth: 1.0, fixed: true, highlight: false
                });
                board.create('text', [t, y - 0.65, String(t)], {
                    fontSize: 11, color: '#222222', fixed: true, highlight: false,
                    anchorX: 'middle', anchorY: 'middle'
                });
            }

            if (cfg.left) {
                board.create('arrow', [[circleX, y], [xMin - ARROW_EXT, y]], {
                    strokeColor: MARK_COL, strokeWidth: 2.5, fixed: true, highlight: false,
                    lastArrow: { type: 2, size: 6 }
                });
            } else {
                board.create('arrow', [[circleX, y], [xMax + ARROW_EXT, y]], {
                    strokeColor: MARK_COL, strokeWidth: 2.5, fixed: true, highlight: false,
                    lastArrow: { type: 2, size: 6 }
                });
            }

            if (cfg.closed) {
                board.create('point', [circleX, y], {
                    name: '', size: 5, color: MARK_COL,
                    strokeColor: MARK_COL, strokeWidth: 1.5,
                    fixed: true, highlight: false, showInfobox: false
                });
            } else {
                board.create('point', [circleX, y], {
                    name: '', size: 5,
                    fillColor: '#ffffff', strokeColor: MARK_COL, strokeWidth: 1.5,
                    fixed: true, highlight: false, showInfobox: false
                });
            }
        }
    </script>
</body>
</html>
