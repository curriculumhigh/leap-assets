<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Regular Pentagons — Side by Side</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9, 6.5, 11, -6.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        function pentagonVertices(cx, cy, R) {
            var verts = [];
            for (var k = 0; k < 5; k++) {
                var angle = (-54 + k * 72) * Math.PI / 180;
                verts.push([cx + R * Math.cos(angle), cy + R * Math.sin(angle)]);
            }
            return verts;
        }

        var sin36 = Math.sin(Math.PI / 5);
        var SCALE = 0.4;
        var rLarge = (10 * SCALE) / (2 * sin36);
        var rSmall = (4 * SCALE) / (2 * sin36);

        var vertsLarge = pentagonVertices(-3, 0.3, rLarge);
        var vertsSmall = pentagonVertices(5.5, 0.3, rSmall);

        function drawPentagon(verts) {
            var pts = [];
            for (var i = 0; i < verts.length; i++) {
                pts.push(board.create('point', verts[i], {
                    name: '', size: 1.5, color: '#222222', fixed: true,
                    showInfobox: false, highlight: false
                }));
            }
            board.create('polygon', pts, {
                fillColor: 'none', fillOpacity: 0,
                borders: { strokeColor: '#555555', strokeWidth: 2.0 },
                vertices: { visible: true, size: 1.5, color: '#222222', fixed: true, showInfobox: false, highlight: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });
            return pts;
        }

        drawPentagon(vertsLarge);
        drawPentagon(vertsSmall);

        function sideMidpoint(p1, p2, offsetY) {
            return [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2 + offsetY];
        }

        var midLarge = sideMidpoint(vertsLarge[4], vertsLarge[0], -0.9);
        board.create('text', [midLarge[0], midLarge[1], '10 \\text{ in}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var midSmall = sideMidpoint(vertsSmall[4], vertsSmall[0], -0.65);
        board.create('text', [midSmall[0], midSmall[1], '4 \\text{ in}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
