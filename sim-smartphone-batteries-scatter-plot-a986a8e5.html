<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Batteries Scatter Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 112, 56, -14],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid lines every 5 units ────────────────────────────────────
        var i;
        // Vertical grid lines (x = 0, 5, 10, ..., 50)
        for (i = 0; i <= 50; i += 5) {
            board.create('segment', [[i, 0], [i, 100]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        // Horizontal grid lines (y = 0, 5, 10, ..., 100)
        for (i = 0; i <= 100; i += 5) {
            board.create('segment', [[0, i], [50, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── Axes (drawn manually for full control) ──────────────────────
        // X-axis: from 0 to beyond 50
        board.create('arrow', [[0, 0], [53, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        // Y-axis: from 0 to beyond 100
        board.create('arrow', [[0, 0], [0, 106]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // ── X-axis ticks ────────────────────────────────────────────────
        var TICK_MAJOR = 1.8;
        var TICK_MINOR = 1.0;

        for (i = 5; i <= 50; i += 5) {
            var isMajorX = (i % 10 === 0);
            var tickLen = isMajorX ? TICK_MAJOR : TICK_MINOR;
            board.create('segment', [[i, -tickLen], [i, tickLen]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            if (isMajorX) {
                board.create('text', [i, -4.5, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // ── Y-axis ticks ────────────────────────────────────────────────
        for (i = 5; i <= 100; i += 5) {
            var isMajorY = (i % 10 === 0);
            var tickLenY = isMajorY ? TICK_MAJOR : TICK_MINOR;
            board.create('segment', [[-tickLenY, i], [tickLenY, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            if (isMajorY) {
                board.create('text', [-4, i, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // Origin label
        board.create('text', [-2.5, -4.5, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Axis labels ─────────────────────────────────────────────────
        board.create('text', [25, -10, 'Age (months)'], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight: 500;'
        });
        board.create('text', [-6, 50,
            '<span style="display:inline-block; transform:rotate(-90deg); white-space:nowrap;">Battery health (%)</span>'
        ], {
            fontSize: 13, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useMathJax: false,
            cssStyle: 'font-weight: 500;'
        });

        // ── Title ───────────────────────────────────────────────────────
        board.create('text', [25, 108, 'Smartphone Batteries'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight: 700;'
        });

        // ── Data points ─────────────────────────────────────────────────
        var data = [
            [5, 92], [10, 85], [10, 80], [15, 75], [20, 65],
            [25, 60], [30, 50], [35, 45], [40, 35], [45, 25]
        ];

        for (var d = 0; d < data.length; d++) {
            board.create('point', [data[d][0], data[d][1]], {
                name: '',
                size: 3,
                color: '#2563EB',
                fillColor: '#2563EB',
                strokeColor: '#2563EB',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
