<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment Congruence Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 2, 10.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        var yLine = 0.3;
        var ptStyle = {
            size: 2.5, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        };
        var lblStyle = { fontSize: 14, color: '#222222', offset: [0, 18] };

        // Segment WX
        board.create('segment', [[1, yLine], [3, yLine]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('point', [1, yLine], Object.assign({}, ptStyle, {
            name: 'W', label: lblStyle
        }));
        board.create('point', [3, yLine], Object.assign({}, ptStyle, {
            name: 'X', label: lblStyle
        }));

        // Segment YZ
        board.create('segment', [[4.5, yLine], [6.5, yLine]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('point', [4.5, yLine], Object.assign({}, ptStyle, {
            name: 'Y', label: lblStyle
        }));
        board.create('point', [6.5, yLine], Object.assign({}, ptStyle, {
            name: 'Z', label: lblStyle
        }));

        // Segment TV
        board.create('segment', [[8, yLine], [10, yLine]], {
            strokeColor: '#222222', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('point', [8, yLine], Object.assign({}, ptStyle, {
            name: 'T', label: lblStyle
        }));
        board.create('point', [10, yLine], Object.assign({}, ptStyle, {
            name: 'V', label: lblStyle
        }));

    </script>
</body>
</html>
