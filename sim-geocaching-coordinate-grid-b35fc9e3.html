<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocaching Coordinate Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10, 45, 85, -25],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // ── Manual axes with forced ticksDistance: 5 ──────────────────
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                ticksDistance: 5,
                minorTicks: 0,
                label: { fontSize: 11, anchorX: 'middle', offset: [0, -12] },
                drawZero: false,
                insertTicks: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                ticksDistance: 5,
                minorTicks: 0,
                label: { fontSize: 11, anchorX: 'right', offset: [-6, 0] },
                drawZero: false,
                insertTicks: false
            }
        });

        // ── Grid every 5 units ───────────────────────────────────────
        var gridColor = '#D1D5DB';
        var gridWidth = 0.4;
        var x, y;

        // Vertical grid lines every 5 from -10 to 85
        for (x = -10; x <= 85; x += 5) {
            if (x === 0) continue;
            board.create('segment', [[x, -25], [x, 45]], {
                strokeColor: gridColor, strokeWidth: gridWidth,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Horizontal grid lines every 5 from -25 to 45
        for (y = -25; y <= 45; y += 5) {
            if (y === 0) continue;
            board.create('segment', [[-10, y], [85, y]], {
                strokeColor: gridColor, strokeWidth: gridWidth,
                fixed: true, highlight: false, dash: 0
            });
        }

        // ── Axis labels ──────────────────────────────────────────────
        board.create('text', [78, -2.5, '\\textit{x}\\text{ (yards)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [1.5, 43, '\\textit{y}\\text{ (yards)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });

        // ── Colors ───────────────────────────────────────────────────
        var COL_PARKING = '#222222';
        var COL_CACHE_A = '#2563EB';
        var COL_CACHE_B = '#059669';

        // --- Parking Lot (5, 35) ---
        board.create('point', [5, 35], {
            name: '', size: 5, color: COL_PARKING, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [7, 36.5, '\\text{Parking Lot}\\ (5,\\, 35)'], {
            fontSize: 12, color: COL_PARKING, fixed: true, highlight: false, useKatex: true
        });

        // --- Cache A (25, -15) ---
        board.create('point', [25, -15], {
            name: '', size: 5, color: COL_CACHE_A, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [27, -13.5, '\\text{Cache A}\\ (25,\\, -15)'], {
            fontSize: 12, color: COL_CACHE_A, fixed: true, highlight: false, useKatex: true
        });

        // --- Cache B (75, 5) ---
        board.create('point', [75, 5], {
            name: '', size: 5, color: COL_CACHE_B, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [56, 7.5, '\\text{Cache B}\\ (75,\\, 5)'], {
            fontSize: 12, color: COL_CACHE_B, fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
