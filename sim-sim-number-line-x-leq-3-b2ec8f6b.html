<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x ≤ 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { max-width: 550px; height: 100%; padding: 6px; box-sizing: border-box; }
        .board-wrapper { background: white; border-radius: 6px; height: 100%; }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9, 2.5, 7, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Main axis line with arrows on both ends
        board.create('arrow', [[-8.5, 0], [6.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });
        board.create('arrow', [[6.5, 0], [-8.5, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });

        // Tick marks and labels
        for (var i = -8; i <= 6; i++) {
            board.create('segment', [[i, -0.2], [i, 0.2]], {
                strokeColor: '#444444',
                strokeWidth: 0.8,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -0.7, i.toString()], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // Shaded ray from x=3 going left
        board.create('arrow', [[3, 0], [-8.5, 0]], {
            strokeColor: '#2563EB',
            strokeWidth: 2.5,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });

        // Closed circle at x = 3
        board.create('point', [3, 0], {
            name: '',
            size: 4,
            color: '#2563EB',
            fillColor: '#2563EB',
            strokeColor: '#2563EB',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
