<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiking Trail and Fountain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 8, 10, -6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [9.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Line: y = (1/3)x + 2 — hiking trail
        board.create('functiongraph', [
            function(x) { return x / 3 + 2; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Label for the line — "hiking trail" placed along the line in a clear area
        board.create('text', [6.8, 5.2, 'hiking trail'], {
            fontSize: 12,
            color: '#222222',
            fixed: true,
            highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // Point: fountain at (5, -3)
        board.create('point', [5, -3], {
            name: '',
            size: 3,
            color: '#DC2626',
            fixed: true,
            highlight: false,
            showInfobox: false
        });

        // Label for the fountain point
        board.create('text', [5.4, -3.8, 'fountain'], {
            fontSize: 12,
            color: '#DC2626',
            fixed: true,
            highlight: false,
            cssStyle: 'font-style: italic;'
        });

        // Coordinate label for fountain
        board.create('text', [5.4, -2.5, '(5, -3)'], {
            fontSize: 12,
            color: '#DC2626',
            useKatex: true,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
