<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Polynomial Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 9, 9.5, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                gridX: 1,
                gridY: 1,
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [9.1, -0.45, 't'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 8.6, 'd'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Piecewise function (C2-smooth at t=2, C1-smooth at t=5):
        //
        // Piece 1: d(t) = 1 + (7/3)t + (13/6)t^2 - (11/12)t^3,     0 <= t <= 2
        //   d(0)=1, d(2)=7, d'(2)=0, d''(2)=-20/3
        //
        // Piece 2: d(t) = 7 - (10/3)(t-2)^2 + (20/27)(t-2)^3,       2 < t <= 5
        //   d(2)=7, d(5)=-3, d'(2)=0, d'(5)=0, strictly decreasing, no interior TP
        //   d''(2)=-20/3 (matches piece 1)
        //
        // Piece 3: d(t) = -3 + (8/9)(t-5)^2,                        5 < t <= 8
        //   d(5)=-3, d(8)=5, d'(5)=0, strictly increasing

        function dFunc(t) {
            if (t <= 2) {
                return 1 + (7 / 3) * t + (13 / 6) * t * t - (11 / 12) * t * t * t;
            } else if (t <= 5) {
                var u = t - 2;
                return 7 - (10 / 3) * u * u + (20 / 27) * u * u * u;
            } else {
                var v = t - 5;
                return -3 + (8 / 9) * v * v;
            }
        }

        // Plot the curve on 0 <= t <= 8
        board.create('functiongraph', [
            function(t) { return dFunc(t); }, 0, 8
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points — size 3, with coordinate labels
        var keyPoints = [
            { t: 0, d: 1,  offX: -0.75, offY: 0.6 },
            { t: 2, d: 7,  offX: 0.2,   offY: 0.6 },
            { t: 5, d: -3, offX: 0.2,   offY: -0.85 },
            { t: 8, d: 5,  offX: -1.65, offY: 0.6 }
        ];

        for (var i = 0; i < keyPoints.length; i++) {
            var kp = keyPoints[i];

            board.create('point', [kp.t, kp.d], {
                name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });

            var labelStr = '(' + kp.t + ',\\,' + kp.d + ')';
            board.create('text', [kp.t + kp.offX, kp.d + kp.offY, labelStr], {
                fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
            });
        }
    </script>
</body>
</html>
