<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabola y = x² − 6x + 10</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 12.5, 7.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Manual grid
        board.create('grid', [], {
            strokeColor: '#D1D5DB',
            strokeWidth: 0.4
        });

        // Manual x-axis
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 2,
                insertTicks: false
            }
        });

        // Manual y-axis with ticksDistance: 1
        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false
            }
        });

        // Axis labels
        board.create('text', [7.1, -0.5, 'x'], { fontSize: 12, useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.2, 12.0, 'y'], { fontSize: 12, useKatex: true, fixed: true, highlight: false });

        // Parabola: y = x^2 - 6x + 10
        board.create('functiongraph', [
            function(x) { return x * x - 6 * x + 10; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Orientation arrow pointing LEFT on the left branch
        var arrowX = 0.8;
        var arrowY = arrowX * arrowX - 6 * arrowX + 10;
        var dx = -1;
        var dy = -(2 * arrowX - 6);
        var len = Math.sqrt(dx * dx + dy * dy);
        var scale = 0.9;
        var ax1 = arrowX + (dx / len) * scale * 0.5;
        var ay1 = arrowY + (dy / len) * scale * 0.5;
        var ax2 = arrowX - (dx / len) * scale * 0.5;
        var ay2 = arrowY - (dy / len) * scale * 0.5;

        board.create('arrow', [[ax2, ay2], [ax1, ay1]], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Vertex (3, 1) — marked, no label
        board.create('point', [3, 1], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Y-intercept (0, 10) — marked, no label
        board.create('point', [0, 10], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Symmetric point (6, 10) — marked, no label
        board.create('point', [6, 10], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
