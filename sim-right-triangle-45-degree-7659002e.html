<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — 45° Angle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 6.5, -1.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var A = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var B = board.create('point', [4.5, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var C = board.create('point', [4.5, 4.5], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle (no fill) ──────────────────────────────────────────
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at B ─────────────────────────────────────
        var sq = 0.4;
        var sqP1 = board.create('point', [4.5 - sq, 0], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [4.5 - sq, sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [4.5, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [sqP1, sqP2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [sqP2, sqP3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── 45° angle arc at C ──────────────────────────────────────────
        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.7,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        var labelDist = 1.3;
        var bx = -0.3536;
        var by = -0.8536;
        var blen = Math.sqrt(bx * bx + by * by);
        bx /= blen; by /= blen;

        board.create('text', [4.5 + bx * labelDist, 4.5 + by * labelDist, '45^\\circ'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        board.create('text', [4.95, 2.25, '15'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [2.25, -0.55, 'x'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
