<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; background: #ffffff; }
.container { height: calc(100% - 12px); padding: 6px; max-width: 560px; margin: 0 auto; }
#board { height: 100%; width: 100%; }
</style>
</head>
<body>
<div class="container"><div id="board"></div></div>
<script>
function _initSim() {

window.board = JXG.JSXGraph.initBoard('board', { boundingbox: [-9.4, 6.6, 9.4, -6.8], axis: false, showCopyright: false, showNavigation: false, keepAspectRatio: true, pan:{enabled:false}, zoom:{enabled:false} });
for (var gx = -8; gx <= 8; gx += 2) board.create('segment', [[gx,-6.4],[gx,6.2]], { strokeColor:'#E5E7EB', strokeWidth:0.4, fixed:true, highlight:false });
for (var gy = -6; gy <= 6; gy += 2) board.create('segment', [[-9,gy],[9,gy]], { strokeColor:'#E5E7EB', strokeWidth:0.4, fixed:true, highlight:false });
board.create('arrow', [[-9,0],[9,0]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('arrow', [[9,0],[-9,0]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('arrow', [[0,-6.4],[0,6.2]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('arrow', [[0,6.2],[0,-6.4]], { strokeColor:'#444444', strokeWidth:1.2, fixed:true, highlight:false });
board.create('text', [8.8, -0.6, 'x'], { fontSize:14, color:'#222222', cssStyle:'font-style:italic;', fixed:true, highlight:false });
board.create('text', [0.35, 5.9, 'y'], { fontSize:14, color:'#222222', cssStyle:'font-style:italic;', fixed:true, highlight:false });
[-8,-6,-4,-2,2,4,6,8].forEach(function(t){ board.create('text',[t,-0.55,String(t)],{fontSize:12,color:'#666666',anchorX:'middle',fixed:true, highlight:false}); });
[-6,-4,-2,2,4,6].forEach(function(t){ board.create('text',[-0.3,t,String(t)],{fontSize:12,color:'#666666',anchorX:'right',fixed:true, highlight:false}); });
board.create('text', [-0.6, 0.45, 'O'], { fontSize:13, color:'#222222', cssStyle:'font-style:italic;', fixed:true, highlight:false });
board.create('circle', [[0,0], 5], { strokeColor:'#2563EB', strokeWidth:1.8, fixed:true, highlight:false });
var ang = 5.36;
var dirx = Math.cos(ang), diry = Math.sin(ang);
board.create('arrow', [[0,0],[7.2*dirx, 7.2*diry]], { strokeColor:'#DC2626', strokeWidth:1.5, fixed:true, highlight:false });
board.create('curve', [function(t){ return 1.5*Math.cos(t); }, function(t){ return 1.5*Math.sin(t); }, 0, ang], { strokeColor:'#059669', strokeWidth:1.5, fixed:true, highlight:false });
board.create('text', [-3.6, 1.4, '\\color{#059669}{5.36\\ \\text{rad}}'], { fontSize:14, useKatex:true, fixed:true, highlight:false });
board.create('point', [5*dirx, 5*diry], { name:'', size:5, color:'#222222', fixed:true, highlight:false, showInfobox:false });
board.create('text', [5*dirx+0.4, 5*diry-0.25, 'A'], { fontSize:14, color:'#222222', cssStyle:'font-style:italic;font-weight:bold;', fixed:true, highlight:false });

}
(function waitForSize(n) {
  var el = document.getElementById('board');
  if (el.clientWidth > 10 && el.clientHeight > 10) { _initSim(); return; }
  if (n > 600) { _initSim(); return; }
  setTimeout(function() { waitForSize(n + 1); }, 50);
})(0);
window.addEventListener('resize', function() {
  var el = document.getElementById('board');
  if (el.clientWidth > 10 && el.clientHeight > 10 && window.board && board.resizeContainer) {
    board.resizeContainer(el.clientWidth, el.clientHeight, true);
  }
});
</script>
</body>
</html>
