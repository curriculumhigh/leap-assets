<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle ABC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 6, 7, -6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, visible: true, anchorX: 'middle', offset: [0, -12] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawLabels: true,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11, visible: true, anchorX: 'right', offset: [-8, 0] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        drawLabels: true,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.6, -0.4, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 5.6, 'y'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // Triangle vertices (invisible points)
        var A = board.create('point', [1, -1], { name: '', visible: false, fixed: true });
        var B = board.create('point', [3, -1], { name: '', visible: false, fixed: true });
        var C = board.create('point', [3, -4], { name: '', visible: false, fixed: true });

        // Triangle polygon — thick blue edges, no fill
        board.create('polygon', [A, B, C], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#2563EB',
                strokeWidth: 2.5,
                fixed: true,
                highlight: false
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Vertex labels — name only, blue, placed close to vertices
        board.create('text', [0.7, -0.7, 'A'], { useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false });
        board.create('text', [3.15, -0.7, 'B'], { useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false });
        board.create('text', [3.15, -4.3, 'C'], { useKatex: true, fontSize: 13, color: '#2563EB', fixed: true, highlight: false });
    </script>
</body>
</html>
