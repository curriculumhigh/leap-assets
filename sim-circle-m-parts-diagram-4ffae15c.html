<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle M — Parts of a Circle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 6px;
            height: calc(100% - 12px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 10px;
            height: calc(100% - 20px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;

        // ── Center M ────────────────────────────────────────────────────
        var M = board.create('point', [0, 0], {
            name: 'M',
            fixed: true,
            size: 2.5,
            color: '#222222',
            highlight: false,
            label: {
                fontSize: 14,
                color: '#222222',
                offset: [8, -12]
            }
        });

        // ── Circle ──────────────────────────────────────────────────────
        var circle = board.create('circle', [M, R], {
            strokeColor: '#555555',
            strokeWidth: 2.0,
            fixed: true,
            highlight: false
        });

        // ── Points on the circle ────────────────────────────────────────
        // P — upper left (~140°)
        var angP = 140 * Math.PI / 180;
        var P = board.create('point', [R * Math.cos(angP), R * Math.sin(angP)], {
            name: 'P',
            fixed: true,
            size: 2,
            color: '#222222',
            highlight: false,
            label: {
                fontSize: 14,
                color: '#222222',
                offset: [-14, 8]
            }
        });

        // Q — upper right (~50°)
        var angQ = 50 * Math.PI / 180;
        var Q = board.create('point', [R * Math.cos(angQ), R * Math.sin(angQ)], {
            name: 'Q',
            fixed: true,
            size: 2,
            color: '#222222',
            highlight: false,
            label: {
                fontSize: 14,
                color: '#222222',
                offset: [8, 8]
            }
        });

        // R — lower right (~330°)
        var angR = 330 * Math.PI / 180;
        var Rpt = board.create('point', [R * Math.cos(angR), R * Math.sin(angR)], {
            name: 'R',
            fixed: true,
            size: 2,
            color: '#222222',
            highlight: false,
            label: {
                fontSize: 14,
                color: '#222222',
                offset: [8, -10]
            }
        });

        // S — lower left (~210°)
        var angS = 210 * Math.PI / 180;
        var S = board.create('point', [R * Math.cos(angS), R * Math.sin(angS)], {
            name: 'S',
            fixed: true,
            size: 2,
            color: '#222222',
            highlight: false,
            label: {
                fontSize: 14,
                color: '#222222',
                offset: [-14, -10]
            }
        });

        // ── Radii: MP, MQ, MR ──────────────────────────────────────────
        board.create('segment', [M, P], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        board.create('segment', [M, Q], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        board.create('segment', [M, Rpt], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // ── Chord: PS ───────────────────────────────────────────────────
        board.create('segment', [P, S], {
            strokeColor: '#555555',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
