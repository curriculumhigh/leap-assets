<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Plane — Rectangle ABCD, Triangles BCE and ADF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-10, 13, 6, -4],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 12.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Points ──────────────────────────────────────────────────────
        var A = board.create('point', [-1, -1], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var B = board.create('point', [3, 2], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var C = board.create('point', [-3, 10], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var D = board.create('point', [-7, 7], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var E = board.create('point', [3, 10], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var F = board.create('point', [-7, -1], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });

        // ── Rectangle ABCD ─────────────────────────────────────────────
        board.create('polygon', [A, B, C, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Triangle BCE ────────────────────────────────────────────────
        board.create('polygon', [B, C, E], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Triangle ADF ────────────────────────────────────────────────
        board.create('polygon', [A, D, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Labels (KaTeX, name + coordinates) ──────────────────────────
        board.create('text', [-3.5, -1.8, 'A(-1,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [3.5, 1.5, 'B(3,\\,2)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [-3.0, 10.8, 'C(-3,\\,10)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle'
        });
        board.create('text', [-9.8, 7.0, 'D(-7,\\,7)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [3.5, 10.5, 'E(3,\\,10)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [-9.5, -1.8, 'F(-7,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
    </script>
</body>
</html>
