<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Area</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 4.5, 4.5, -5.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: true
        });

        var R = 3;

        // Shaded circle
        var center = board.create('point', [0, 0.5], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });

        var circle = board.create('circle', [center, R], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fillColor: '#2563EB', fillOpacity: 0.10,
            fixed: true, highlight: false
        });

        // Radius segment from center to right edge
        var edgePoint = board.create('point', [R, 0.5], {
            name: '', visible: false, fixed: true
        });

        board.create('segment', [center, edgePoint], {
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false
        });

        // Radius label "r"
        board.create('text', [R / 2, 1.15, 'r'], {
            fontSize: 16, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            useKatex: true,
            cssStyle: 'font-style: italic;',
            fixed: true, highlight: false
        });

        // Area label below the circle
        board.create('text', [0, -3.8, 'A = 85 \\text{ ft}^2'], {
            fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            useKatex: true,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
