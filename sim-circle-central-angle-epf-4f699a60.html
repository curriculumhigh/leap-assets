<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Central Angle EPF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;

        var angE = 130 * Math.PI / 180;
        var angF = 45 * Math.PI / 180;
        var angG = 250 * Math.PI / 180;

        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });

        var circle = board.create('circle', [P, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var E = board.create('point', [R * Math.cos(angE), R * Math.sin(angE)], {
            name: 'E', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-14, 6] }
        });

        var F = board.create('point', [R * Math.cos(angF), R * Math.sin(angF)], {
            name: 'F', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 6] }
        });

        var G = board.create('point', [R * Math.cos(angG), R * Math.sin(angG)], {
            name: 'G', fixed: true, size: 3, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });

        board.create('segment', [P, E], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [P, F], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return R * Math.cos(t); },
            function(t) { return R * Math.sin(t); },
            angE,
            angF + 2 * Math.PI
        ], {
            strokeColor: '#DC2626', strokeWidth: 5, fixed: true, highlight: false, layer: 8
        });

        board.create('nonReflexAngle', [F, P, E], {
            radius: 0.7,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var bisectorAng = (angE + angF) / 2;
        var labelR = 1.15;
        board.create('text', [
            labelR * Math.cos(bisectorAng),
            labelR * Math.sin(bisectorAng),
            '85^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

    </script>
</body>
</html>
