<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 7, 5, -7],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var LX = -2.0, RX = 2.0;
        var OVAL_RX = 1.1, OVAL_RY = 4.2;
        var OVAL_CY = -0.3;

        board.create('ellipse',
            [[LX, OVAL_CY + OVAL_RY], [LX, OVAL_CY - OVAL_RY], [LX + OVAL_RX, OVAL_CY]],
            { strokeColor: '#555555', strokeWidth: 1.3, fillColor: 'none', fixed: true, highlight: false });
        board.create('ellipse',
            [[RX, OVAL_CY + OVAL_RY], [RX, OVAL_CY - OVAL_RY], [RX + OVAL_RX, OVAL_CY]],
            { strokeColor: '#555555', strokeWidth: 1.3, fillColor: 'none', fixed: true, highlight: false });

        board.create('text', [LX, OVAL_CY + OVAL_RY + 1.0, 'Input'],
            { fontSize: 16, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false, cssStyle: 'font-weight:600;' });
        board.create('text', [RX, OVAL_CY + OVAL_RY + 1.0, 'Output'],
            { fontSize: 16, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false, cssStyle: 'font-weight:600;' });

        function stack(centerX, vals) {
            var n = vals.length;
            var top = OVAL_CY + (OVAL_RY - 1.0);
            var bot = OVAL_CY - (OVAL_RY - 1.0);
            var ys = {};
            for (var i = 0; i < n; i++) {
                var y = (n === 1) ? OVAL_CY : top + (bot - top) * (i / (n - 1));
                ys[vals[i]] = y;
                board.create('text', [centerX, y, vals[i]],
                    { fontSize: 18, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
            }
            return ys;
        }

        var inputs  = ['2', '5', '8', '11'];
        var outputs = ['3', '7', '9', '14'];
        var inY  = stack(LX, inputs);
        var outY = stack(RX, outputs);

        var SX = LX + 0.55;
        var EX = RX - 0.55;

        function arrow(fromVal, toVal) {
            var p1 = board.create('point', [SX, inY[fromVal]],  { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [EX, outY[toVal]],   { visible: false, fixed: true, name: '' });
            board.create('arrow', [p1, p2],
                { strokeColor: '#3B82F6', strokeWidth: 1.3, fixed: true, highlight: false,
                  lastArrow: { type: 2, size: 5 } });
        }

        arrow('2', '9');
        arrow('5', '3');
        arrow('5', '14');
        arrow('8', '7');
        arrow('11', '9');
    </script>
</body>
</html>
