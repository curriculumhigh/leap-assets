<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor Venn Diagram — Single Circle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 0; height: 100%; }
        #board { width: 300px; height: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="board"></div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 10.5, 14.5, -0.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            keepAspectRatio: false
        });

        // Rectangle (universal set boundary)
        var rectP1 = board.create('point', [0.5, 0.5], { visible: false, fixed: true, name: '' });
        var rectP2 = board.create('point', [14, 0.5], { visible: false, fixed: true, name: '' });
        var rectP3 = board.create('point', [14, 10], { visible: false, fixed: true, name: '' });
        var rectP4 = board.create('point', [0.5, 10], { visible: false, fixed: true, name: '' });
        board.create('polygon', [rectP1, rectP2, rectP3, rectP4], {
            fillColor: '#ffffff', fillOpacity: 1,
            borders: { strokeColor: '#333333', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // "The Class" label — top-left
        board.create('text', [1.2, 9.4, 'The Class'], {
            fontSize: 12, color: '#333333', fixed: true, highlight: false,
            cssStyle: 'font-weight: 600;'
        });

        // Single circle — center-left area
        var circCenter = board.create('point', [5.8, 4.8], { visible: false, fixed: true, name: '' });
        board.create('circle', [circCenter, 3.2], {
            strokeColor: '#2563EB', strokeWidth: 1.8,
            fillColor: '#2563EB', fillOpacity: 0.12,
            fixed: true, highlight: false
        });

        // Label inside circle: group description
        board.create('text', [5.8, 5.8, 'Scoring between'], {
            fontSize: 10, color: '#333333', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [5.8, 4.8, '50% and 70%'], {
            fontSize: 10, color: '#333333', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Number inside circle
        board.create('text', [5.8, 3.4, '35'], {
            fontSize: 15, color: '#333333', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight: 700;'
        });

        // Label outside circle — top-right area
        board.create('text', [11.5, 8.2, 'Scoring at'], {
            fontSize: 10, color: '#333333', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [11.5, 7.2, 'least 70%'], {
            fontSize: 10, color: '#333333', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Number outside circle — top-right
        board.create('text', [11.5, 5.8, '15'], {
            fontSize: 15, color: '#333333', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight: 700;'
        });
    </script>
</body>
</html>
