<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle with Altitude to Hypotenuse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 7, 15, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false, visible: false
        });
        var B = board.create('point', [13, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false, visible: false
        });
        var C = board.create('point', [4, 6], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false, visible: false
        });
        var D = board.create('point', [4, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false, visible: false
        });

        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        board.create('segment', [C, D], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        var sq = 0.45;
        var caLen = Math.sqrt(16 + 36);
        var caDx = (0 - 4) / caLen;
        var caDy = (0 - 6) / caLen;
        var cbLen = Math.sqrt(81 + 36);
        var cbDx = (13 - 4) / cbLen;
        var cbDy = (0 - 6) / cbLen;

        var rcP1 = board.create('point', [4 + sq * caDx, 6 + sq * caDy], { visible: false, fixed: true, name: '' });
        var rcP2 = board.create('point', [4 + sq * (caDx + cbDx), 6 + sq * (caDy + cbDy)], { visible: false, fixed: true, name: '' });
        var rcP3 = board.create('point', [4 + sq * cbDx, 6 + sq * cbDy], { visible: false, fixed: true, name: '' });

        board.create('segment', [rcP1, rcP2], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [rcP2, rcP3], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });

        var rdP1 = board.create('point', [4 + sq, 0], { visible: false, fixed: true, name: '' });
        var rdP2 = board.create('point', [4 + sq, sq], { visible: false, fixed: true, name: '' });
        var rdP3 = board.create('point', [4, sq], { visible: false, fixed: true, name: '' });

        board.create('segment', [rdP1, rdP2], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [rdP2, rdP3], {
            strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false
        });

        board.create('text', [4.5, 3, 'x'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'middle'
        });

        board.create('text', [2, -0.7, '4'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'top'
        });

        board.create('text', [8.5, -0.7, '9'], {
            useKatex: true, fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'top'
        });

        board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        board.create('point', [13, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        board.create('point', [4, 6], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        board.create('point', [4, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
    </script>
</body>
</html>
