<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon E'F'G'H'I'J'</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.8, 7.8, 7.8, -7.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [7.3, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.3, 7.3, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Vertex coordinates from the screenshot
        var vertices = [
            [-6, 2],   // E'
            [-4, 4],   // F'
            [-2, 4],   // G'
            [-1, 2],   // H'
            [-3, 0],   // I'
            [-4, 0]    // J'
        ];

        var names = ["E'", "F'", "G'", "H'", "I'", "J'"];
        var offsets = [
            [-12, 2],   // E' — left
            [-4, 8],    // F' — above
            [4, 8],     // G' — above right
            [6, 2],     // H' — right
            [-2, -12],  // I' — below
            [-10, -12]  // J' — below left
        ];

        // Create points
        var pts = [];
        for (var i = 0; i < vertices.length; i++) {
            var pt = board.create('point', vertices[i], {
                name: '',
                size: 3,
                color: '#DC2626',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
            pts.push(pt);

            // Label
            board.create('text', [
                vertices[i][0] + offsets[i][0] * 0.08,
                vertices[i][1] + offsets[i][1] * 0.08,
                names[i]
            ], {
                fontSize: 9,
                color: '#DC2626',
                fixed: true,
                highlight: false,
                useKatex: true,
                anchorX: 'middle',
                anchorY: 'middle'
            });
        }

        // Polygon (blue outline, no fill)
        board.create('polygon', pts, {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#2563EB',
                strokeWidth: 1.8
            },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
