<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Graph — h(t)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 500px; margin: 0; padding: 6px;
            height: calc(100% - 12px);
        }
        .sim-layout {
            display: flex; gap: 10px; height: 100%;
        }
        .left-panel {
            width: 170px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 14px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .panel-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #888; margin-bottom: 4px;
        }
        .fn-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 4px;
        }
        .fn-swatch {
            width: 18px; height: 4px; border-radius: 2px; flex-shrink: 0;
        }
        .fn-equation { min-height: 24px; }
        .hover-msg {
            font-size: 11px; color: #999; line-height: 1.5;
            border-top: 1px solid #e5e7eb; padding-top: 10px;
            margin-top: auto;
        }
        .board-wrapper {
            flex: 1; background: white; border-radius: 8px; padding: 8px;
            height: calc(100% - 16px);
        }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div>
                    <div class="panel-label">Function</div>
                    <div class="fn-row">
                        <div class="fn-swatch" style="background: #2563EB;"></div>
                        <span style="font-weight: 600; font-size: 13px; color: #2563EB;">h(t)</span>
                    </div>
                    <div class="fn-equation" id="equation"></div>
                </div>
                <div class="hover-msg">
                    Hover over the highlighted points on the graph to read their coordinates.
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
            </div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 165, 108, -20],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        label: { fontSize: 10, anchorX: 'middle', offset: [0, -12] },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        label: { fontSize: 10, anchorX: 'right', offset: [-6, 0] },
                        minorTicks: 0,
                        ticksDistance: 20
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        board.create('text', [104, -8, '<i>t</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });
        board.create('text', [2.5, 160, '<i>h</i>'], {
            fontSize: 14, fixed: true, highlight: false
        });

        var COL_H = '#2563EB';

        function hFunc(t) {
            return -16 * t * t + 96 * t + 4;
        }

        board.create('functiongraph', [
            function(t) { return hFunc(t); },
            -1, 7
        ], {
            strokeColor: COL_H, strokeWidth: 1.8, fixed: true, highlight: false
        });

        var vertexT = 3;
        var vertexH = hFunc(vertexT);

        var yIntT = 0;
        var yIntH = hFunc(yIntT);

        var disc = 96 * 96 + 4 * 16 * 4;
        var sqrtDisc = Math.sqrt(disc);
        var root1T = (96 - sqrtDisc) / (2 * 16);
        var root2T = (96 + sqrtDisc) / (2 * 16);

        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function formatValKatex(v) {
            var absV = Math.abs(v);
            var sign = v < 0 ? '-' : '';
            if (Math.abs(v - Math.round(v)) < 0.01) return String(Math.round(v));
            return v.toFixed(2);
        }

        function showTooltip(pt, color) {
            var xCoord = pt.X();
            var yCoord = pt.Y();
            var latex = '\\color{' + color + '}{\\left(' + formatValKatex(xCoord)
                      + ',\\,' + formatValKatex(yCoord) + '\\right)}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [xCoord, yCoord], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        var ptVertex = board.create('point', [vertexT, vertexH], {
            name: '', size: 5, color: COL_H, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_H, highlightStrokeColor: COL_H
        });
        ptVertex.on('over', function() { showTooltip(ptVertex, COL_H); });
        ptVertex.on('out', function() { hideTooltip(); });

        var ptYInt = board.create('point', [yIntT, yIntH], {
            name: '', size: 5, color: COL_H, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_H, highlightStrokeColor: COL_H
        });
        ptYInt.on('over', function() { showTooltip(ptYInt, COL_H); });
        ptYInt.on('out', function() { hideTooltip(); });

        var ptRoot1 = board.create('point', [root1T, 0], {
            name: '', size: 5, color: COL_H, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_H, highlightStrokeColor: COL_H
        });
        ptRoot1.on('over', function() { showTooltip(ptRoot1, COL_H); });
        ptRoot1.on('out', function() { hideTooltip(); });

        var ptRoot2 = board.create('point', [root2T, 0], {
            name: '', size: 5, color: COL_H, fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: COL_H, highlightStrokeColor: COL_H
        });
        ptRoot2.on('over', function() { showTooltip(ptRoot2, COL_H); });
        ptRoot2.on('out', function() { hideTooltip(); });

        katex.render(
            'h(t) = -16t^2 + 96t + 4',
            document.getElementById('equation'),
            { throwOnError: false }
        );
    </script>
</body>
</html>
