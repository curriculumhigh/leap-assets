<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Log Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 3.25, 5.7, -0.35],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // — Logarithmic horizontal gridlines —
        var decades = [0, 1, 2];
        var majorYVals = [0, 1, 2, 3];

        // Major horizontal gridlines (at powers of 10)
        for (var i = 0; i < majorYVals.length; i++) {
            board.create('segment', [[0, majorYVals[i]], [5.5, majorYVals[i]]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.6, fixed: true, highlight: false
            });
        }

        // Minor horizontal gridlines (at 2,3,4,5,6,7,8,9 within each decade)
        for (var d = 0; d < decades.length; d++) {
            for (var n = 2; n <= 9; n++) {
                var yPos = decades[d] + Math.log10(n);
                if (yPos <= 3.0) {
                    board.create('segment', [[0, yPos], [5.5, yPos]], {
                        strokeColor: '#D1D5DB', strokeWidth: 0.3, fixed: true, highlight: false
                    });
                }
            }
        }

        // — Vertical gridlines —
        // Major vertical gridlines at integers
        for (var x = 0; x <= 5; x++) {
            board.create('segment', [[x, 0], [x, 3]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.6, fixed: true, highlight: false
            });
        }

        // Minor vertical gridlines at 0.5 intervals
        for (var xm = 0.5; xm < 5.5; xm += 1) {
            board.create('segment', [[xm, 0], [xm, 3]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.3, fixed: true, highlight: false
            });
        }

        // — Axes —
        board.create('segment', [[0, 0], [5.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[0, 0], [0, 3.1]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // — X-axis tick marks and labels —
        for (var xt = 0; xt <= 5; xt++) {
            board.create('segment', [[xt, -0.04], [xt, 0.04]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [xt, -0.15, String(xt)], {
                fontSize: 11, color: '#222222', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // Minor x ticks at 0.5
        for (var xmt = 0.5; xmt < 5.5; xmt += 1) {
            board.create('segment', [[xmt, -0.025], [xmt, 0.025]], {
                strokeColor: '#444444', strokeWidth: 0.7, fixed: true, highlight: false
            });
        }

        // — Y-axis tick marks and labels —
        var yLabelVals = [0, 1, 2, 3];
        var yLabelText = ['1', '10', '100', '1000'];
        for (var yt = 0; yt < yLabelVals.length; yt++) {
            board.create('segment', [[-0.04, yLabelVals[yt]], [0.04, yLabelVals[yt]]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [-0.12, yLabelVals[yt], yLabelText[yt]], {
                fontSize: 11, color: '#222222', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // — Data points —
        var data = [
            [1, 10],
            [2, 31.623],
            [3, 100],
            [4, 316.23],
            [5, 1000]
        ];

        for (var p = 0; p < data.length; p++) {
            var xVal = data[p][0];
            var yVal = Math.log10(data[p][1]);
            board.create('point', [xVal, yVal], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
