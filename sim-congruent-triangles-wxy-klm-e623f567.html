<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congruent Triangles — WXY and KLM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 8, 17, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Triangle WXY (left, standard orientation) ───────────────────
        var W = [0.5, 0.5];
        var X = [6.5, 0.5];
        var Y = [1.8, 5.5];

        var pW = board.create('point', W, { name: 'W', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [-14, -12] } });
        var pX = board.create('point', X, { name: 'X', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [8, -12] } });
        var pY = board.create('point', Y, { name: 'Y', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [-6, 10] } });

        board.create('segment', [pW, pX], { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pX, pY], { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pW, pY], { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Triangle KLM (right, rotated 90° CW then flipped horizontally) ──
        var ox = 13.5;
        var oy = 6.5;

        var K = [ox + 0, oy + 0];
        var L = [ox + 0, oy - 6];
        var M = [ox - 5, oy - 1.3];

        var pK = board.create('point', K, { name: 'K', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [8, 8] } });
        var pL = board.create('point', L, { name: 'L', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [8, -12] } });
        var pM = board.create('point', M, { name: 'M', fixed: true, size: 2, color: '#222222', highlight: false, label: { fontSize: 14, color: '#222222', offset: [-14, -6] } });

        board.create('segment', [pK, pL], { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pL, pM], { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pK, pM], { strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Angle arcs ──────────────────────────────────────────────────
        var ARC_COL = '#DC2626';

        // Single arc: angle W and angle K
        board.create('nonReflexAngle', [pX, pW, pY], {
            radius: 0.55, fillColor: ARC_COL, fillOpacity: 0.06,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pL, pK, pM], {
            radius: 0.55, fillColor: ARC_COL, fillOpacity: 0.06,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // Double arc: angle X and angle L
        board.create('nonReflexAngle', [pW, pX, pY], {
            radius: 0.5, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pW, pX, pY], {
            radius: 0.7, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pK, pL, pM], {
            radius: 0.5, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pK, pL, pM], {
            radius: 0.7, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // Triple arc: angle Y and angle M
        board.create('nonReflexAngle', [pW, pY, pX], {
            radius: 0.4, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pW, pY, pX], {
            radius: 0.55, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pW, pY, pX], {
            radius: 0.7, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pK, pM, pL], {
            radius: 0.4, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pK, pM, pL], {
            radius: 0.55, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });
        board.create('nonReflexAngle', [pK, pM, pL], {
            radius: 0.7, fillColor: 'none', fillOpacity: 0,
            strokeColor: ARC_COL, strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // ── Tick marks helper ───────────────────────────────────────────
        function addTickMarks(p1, p2, count) {
            var mx = (p1[0] + p2[0]) / 2;
            var my = (p1[1] + p2[1]) / 2;
            var dx = p2[0] - p1[0];
            var dy = p2[1] - p1[1];
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var ax = dx / len;
            var ay = dy / len;

            var tickLen = 0.3;
            var spacing = 0.22;

            for (var i = 0; i < count; i++) {
                var offset = (i - (count - 1) / 2) * spacing;
                var cx = mx + offset * ax;
                var cy = my + offset * ay;
                board.create('segment', [
                    [cx - tickLen * px, cy - tickLen * py],
                    [cx + tickLen * px, cy + tickLen * py]
                ], {
                    strokeColor: ARC_COL, strokeWidth: 1.8, fixed: true, highlight: false
                });
            }
        }

        // Single tick: WX ≅ KL
        addTickMarks(W, X, 1);
        addTickMarks(K, L, 1);

        // Double tick: XY ≅ LM
        addTickMarks(X, Y, 2);
        addTickMarks(L, M, 2);

        // Triple tick: WY ≅ KM
        addTickMarks(W, Y, 3);
        addTickMarks(K, M, 3);

    </script>
</body>
</html>
