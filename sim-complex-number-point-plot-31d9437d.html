<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Number Point Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 5.5, 5.5, -4],
            axis: false,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Create axes manually for full control over ticks
        var xAxis = board.create('arrow', [[-5.8, 0], [5.2, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        var yAxis = board.create('arrow', [[0, -3.7], [0, 5.2]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Number labels along x-axis (no tick marks, just labels)
        var xLabels = [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5];
        for (var i = 0; i < xLabels.length; i++) {
            board.create('text', [xLabels[i], -0.4, String(xLabels[i])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // Number labels along y-axis (no tick marks, just labels)
        var yLabels = [-3, -2, -1, 1, 2, 3, 4, 5];
        for (var j = 0; j < yLabels.length; j++) {
            board.create('text', [-0.35, yLabels[j], String(yLabels[j])], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis variable labels (italic x and y near arrow tips)
        board.create('text', [5.0, -0.5, '<i>x</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.25, 5.1, '<i>y</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });

        // "Real axis" label — along x-axis, just below, near the right end
        board.create('text', [3.8, -0.9, 'Real axis'], {
            fontSize: 12, color: '#444444', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false, cssStyle: 'font-style:italic;'
        });

        // "Imaginary axis" label — along y-axis, just to the left, near the top
        board.create('text', [-0.5, 4.5, 'Imaginary axis'], {
            fontSize: 12, color: '#444444', anchorX: 'right', anchorY: 'middle',
            fixed: true, highlight: false, cssStyle: 'font-style:italic;'
        });

        // Points
        var ptA = board.create('point', [2, 3], {
            name: 'A', size: 5, color: '#222222', fixed: true, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, 5] }
        });

        var ptB = board.create('point', [-4, 1], {
            name: 'B', size: 5, color: '#222222', fixed: true, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 5] }
        });

        var ptC = board.create('point', [3, -2], {
            name: 'C', size: 5, color: '#222222', fixed: true, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, -5] }
        });
    </script>
</body>
</html>
