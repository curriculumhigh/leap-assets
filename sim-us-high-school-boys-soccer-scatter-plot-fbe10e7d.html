<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. High School Boys' Soccer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 700px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .sim-layout { display: flex; gap: 12px; height: 100%; }
        .left-panel {
            width: 175px; flex-shrink: 0;
            background: white; border-radius: 8px; padding: 16px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .panel-instruction {
            font-size: 13px; color: #666; line-height: 1.5; text-align: center;
        }
        .panel-instruction .icon { font-size: 22px; display: block; margin-bottom: 8px; }
        .board-wrapper { flex: 1; background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); position: relative; }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sim-layout">
            <div class="left-panel">
                <div class="panel-instruction">
                    <span class="icon">🖱️</span>
                    Hover over a point to see its coordinates.
                </div>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
                <div class="coord-tooltip" id="tooltip"></div>
            </div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 478, 7.8, 255],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* ── Custom axes ─────────────────────────────────────────────── */

        // X-axis
        board.create('arrow', [[0, 280], [7.4, 280]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Y-axis
        board.create('arrow', [[0, 280], [0, 470]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        /* ── Grid lines ──────────────────────────────────────────────── */

        var xi, yi;

        // Vertical grid lines at x = 1..7
        for (xi = 1; xi <= 7; xi++) {
            board.create('segment', [[xi, 280], [xi, 460]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Horizontal grid lines at y = 300, 325, 350, ..., 450
        for (yi = 300; yi <= 450; yi += 25) {
            board.create('segment', [[0, yi], [7.4, yi]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        /* ── Tick marks and labels — X-axis ──────────────────────────── */

        for (xi = 1; xi <= 6; xi++) {
            // Tick mark
            board.create('segment', [[xi, 277], [xi, 283]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [xi, 268, String(xi)], {
                fontSize: 12, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        /* ── Tick marks and labels — Y-axis ──────────────────────────── */

        for (yi = 300; yi <= 450; yi += 25) {
            // Tick mark
            board.create('segment', [[-0.18, yi], [0.18, yi]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            // Label
            board.create('text', [-0.35, yi, String(yi)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        /* ── Axis name labels ────────────────────────────────────────── */

        // X-axis label
        board.create('text', [3.8, 258, 'Year'], {
            fontSize: 13, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-style: italic; font-weight: 500;'
        });

        // Y-axis label — rotated
        board.create('text', [-0.95, 385, 'Participants (thousands)'], {
            fontSize: 12, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-style: italic; font-weight: 500; transform: rotate(-90deg); transform-origin: center center; white-space: nowrap;'
        });

        /* ── Title ───────────────────────────────────────────────────── */

        board.create('text', [3.8, 468, "U.S. High School Boys' Soccer"], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight: 700;'
        });

        /* ── Tooltip setup ───────────────────────────────────────────── */

        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function showTooltip(pt, color) {
            var xCoord = Math.round(pt.X());
            var yCoord = Math.round(pt.Y());
            var latex = '\\color{' + color + '}{(' + xCoord + ',\\,' + yCoord + ')}';
            katex.render(latex, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';

            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var sx = coords.scrCoords[1];
            var sy = coords.scrCoords[2];
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 32) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        /* ── Data points with hover tooltips ─────────────────────────── */

        var data = [[1,340], [2,355], [3,370], [4,390], [5,410], [6,425]];
        var POINT_COLOR = '#222222';

        var di;
        for (di = 0; di < data.length; di++) {
            (function(d) {
                var pt = board.create('point', [d[0], d[1]], {
                    name: '', size: 3.5, color: POINT_COLOR,
                    fixed: true, showInfobox: false,
                    highlight: true,
                    highlightFillColor: '#2563EB',
                    highlightStrokeColor: '#2563EB',
                    highlightSize: 5
                });
                pt.on('over', function() { showTooltip(pt, '#2563EB'); });
                pt.on('out', function() { hideTooltip(); });
            })(data[di]);
        }
    </script>
</body>
</html>
