<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Central Angles — Arc EFH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.5;
        var cx = 0, cy = 0;

        var angEPF = 68;
        var angFPG = 47;
        var angGPH = 65;

        var startDeg = -30;
        var angE = startDeg;
        var angF = angE + angEPF;
        var angG = angF + angFPG;
        var angH = angG + angGPH;

        function degToRad(d) { return d * Math.PI / 180; }
        function ptOnCircle(angleDeg) {
            return [cx + R * Math.cos(degToRad(angleDeg)), cy + R * Math.sin(degToRad(angleDeg))];
        }

        var posE = ptOnCircle(angE);
        var posF = ptOnCircle(angF);
        var posG = ptOnCircle(angG);
        var posH = ptOnCircle(angH);

        var P = board.create('point', [cx, cy], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10] }
        });

        var circle = board.create('circle', [P, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var E = board.create('point', posE, {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [10, -8] }
        });
        var F = board.create('point', posF, {
            name: 'F', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [10, 6] }
        });
        var G = board.create('point', posG, {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-4, 12] }
        });
        var H = board.create('point', posH, {
            name: 'H', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 13, color: '#222222', offset: [-16, -4] }
        });

        board.create('segment', [P, E], { strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false });
        board.create('segment', [P, F], { strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false });
        board.create('segment', [P, G], { strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false });
        board.create('segment', [P, H], { strokeColor: '#555555', strokeWidth: 1.0, fixed: true, highlight: false });

        var arcStartRad = degToRad(angE);
        var arcEndRad = degToRad(angH);
        board.create('curve', [
            function(t) { return cx + R * Math.cos(t); },
            function(t) { return cy + R * Math.sin(t); },
            arcStartRad,
            arcEndRad
        ], {
            strokeColor: '#2563EB', strokeWidth: 5, fixed: true, highlight: false, layer: 8
        });

        var angleArcRadius = 0.7;

        board.create('curve', [
            function(t) { return cx + angleArcRadius * Math.cos(t); },
            function(t) { return cy + angleArcRadius * Math.sin(t); },
            degToRad(angE),
            degToRad(angF)
        ], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return cx + angleArcRadius * Math.cos(t); },
            function(t) { return cy + angleArcRadius * Math.sin(t); },
            degToRad(angF),
            degToRad(angG)
        ], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('curve', [
            function(t) { return cx + angleArcRadius * Math.cos(t); },
            function(t) { return cy + angleArcRadius * Math.sin(t); },
            degToRad(angG),
            degToRad(angH)
        ], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        var labelRadius = 1.15;

        var midEPF = (angE + angF) / 2;
        board.create('text', [
            cx + labelRadius * Math.cos(degToRad(midEPF)),
            cy + labelRadius * Math.sin(degToRad(midEPF)),
            '68\u00B0'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 11, color: '#222222', fixed: true, highlight: false
        });

        var midFPG = (angF + angG) / 2;
        board.create('text', [
            cx + labelRadius * Math.cos(degToRad(midFPG)),
            cy + labelRadius * Math.sin(degToRad(midFPG)),
            '47\u00B0'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 11, color: '#222222', fixed: true, highlight: false
        });

        var midGPH = (angG + angH) / 2;
        board.create('text', [
            cx + labelRadius * Math.cos(degToRad(midGPH)),
            cy + labelRadius * Math.sin(degToRad(midGPH)),
            '65\u00B0'
        ], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 11, color: '#222222', fixed: true, highlight: false
        });

    </script>
</body>
</html>
