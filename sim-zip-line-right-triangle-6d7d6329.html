<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zip-Line Right Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 12, 14, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var T = board.create('point', [1, 10], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [1, 1],  { visible: false, fixed: true, name: '' });
        var G = board.create('point', [11, 1], { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('segment', [T, B], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [B, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [T, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Right angle marker at B
        var sqSize = 0.6;
        var sq1 = board.create('point', [1 + sqSize, 1], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [1 + sqSize, 1 + sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [1, 1 + sqSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [sq1, sq2], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#555555', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // Horizontal dashed reference line from T
        var horizEnd = board.create('point', [13, 10], { visible: false, fixed: true, name: '' });
        board.create('segment', [T, horizEnd], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 3, fixed: true, highlight: false
        });

        // Angle of depression arc at T
        board.create('nonReflexAngle', [G, T, horizEnd], {
            radius: 1.8,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false,
            highlight: false
        });

        // Angle label
        var labelR = 2.5;
        var bisectorAngle = -20.5 * Math.PI / 180;
        var lblX = 1 + labelR * Math.cos(bisectorAngle);
        var lblY = 10 + labelR * Math.sin(bisectorAngle);
        board.create('text', [lblX, lblY, '41°'], {
            fontSize: 14, color: '#DC2626', anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        // Vertical leg label: 9 ft
        board.create('text', [-0.6, 5.5, '9\\text{ ft}'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        // Hypotenuse label: zip-line
        var midHypX = (1 + 11) / 2;
        var midHypY = (10 + 1) / 2;
        var hypAngle = Math.atan2(1 - 10, 11 - 1);
        var perpAngle = hypAngle + Math.PI / 2;
        var offsetDist = 0.7;
        board.create('text', [
            midHypX + offsetDist * Math.cos(perpAngle),
            midHypY + offsetDist * Math.sin(perpAngle),
            '\\text{zip-line}'
        ], {
            fontSize: 13, color: '#555555', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true
        });

        // Vertex dots
        board.create('point', [1, 10], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [1, 1], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        board.create('point', [11, 1], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
    </script>
</body>
</html>
