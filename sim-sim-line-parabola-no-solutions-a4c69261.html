<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Solutions — Line and Parabola</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 300px;
            height: 200px;
            background: transparent;
        }
        .container {
            width: 300px;
            height: 200px;
            padding: 0;
            margin: 0;
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 4px;
            width: 292px;
            height: 192px;
        }
        #board {
            width: 100%;
            height: 100%;
        }
        .JXGtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3.8, 5.8, 3.8, -3.8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0.5,
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 6,
                        label: {
                            fontSize: 9,
                            color: '#444444',
                            offset: [0, -10],
                            anchorX: 'middle'
                        },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0.5,
                        minorTicks: 0,
                        ticksDistance: 1,
                        majorHeight: 6,
                        label: {
                            fontSize: 9,
                            color: '#444444',
                            offset: [-12, 0],
                            anchorY: 'middle'
                        },
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.4, -0.5, '<i>x</i>'], {
            fontSize: 11, fixed: true, highlight: false, color: '#444444'
        });
        board.create('text', [0.2, 5.4, '<i>y</i>'], {
            fontSize: 11, fixed: true, highlight: false, color: '#444444'
        });

        // Parabola: y = x² — BLUE
        board.create('functiongraph', [
            function(x) { return x * x; },
            -3.8, 3.8
        ], {
            strokeColor: '#2563EB',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Line: y = -x - 3 — BLACK (no intersection with y = x²)
        // Verification: x² = -x - 3 → x² + x + 3 = 0, discriminant = 1 - 12 = -11 < 0
        board.create('functiongraph', [
            function(x) { return -x - 3; },
            -3.8, 3.8
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
