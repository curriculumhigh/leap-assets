<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line — Two Roots</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 380px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [3.55, 1.1, 5.45, -1.1],
            axis: false, grid: false, showNavigation: false, showCopyright: false,
            keepAspectRatio: false, pan: { enabled: false }, zoom: { enabled: false }
        });

        // Number line from 3.6 to 5.4 with an arrow at the right end
        board.create('segment', [[3.6, 0], [5.4, 0]], {
            strokeColor: '#555555', strokeWidth: 1.6, lastArrow: { type: 2, size: 5 },
            firstArrow: { type: 2, size: 5 }, fixed: true, highlight: false
        });

        // Integer tick marks + labels at 4 and 5
        [4, 5].forEach(function (n) {
            board.create('segment', [[n, -0.12], [n, 0.12]], { strokeColor: '#555555', strokeWidth: 1.4, fixed: true, highlight: false });
            board.create('text', [n, -0.42, String(n)], { anchorX: 'middle', anchorY: 'middle', fontSize: 14, color: '#333333', fixed: true, highlight: false });
        });

        // Plotted roots: sqrt(a) closer to 4, sqrt(b) closer to 5 (key points, dark)
        board.create('point', [4.25, 0], { size: 4, strokeColor: '#222222', fillColor: '#222222', fixed: true, highlight: false, name: '', showInfobox: false });
        board.create('point', [4.78, 0], { size: 4, strokeColor: '#222222', fillColor: '#222222', fixed: true, highlight: false, name: '', showInfobox: false });

        // KaTeX labels above the plotted points
        board.create('text', [4.25, 0.5, '\\sqrt{a}'], { anchorX: 'middle', anchorY: 'middle', fontSize: 16, color: '#222222', useKatex: true, fixed: true, highlight: false });
        board.create('text', [4.78, 0.5, '\\sqrt{b}'], { anchorX: 'middle', anchorY: 'middle', fontSize: 16, color: '#222222', useKatex: true, fixed: true, highlight: false });
    </script>
</body>
</html>
