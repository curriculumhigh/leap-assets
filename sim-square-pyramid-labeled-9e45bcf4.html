<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Pyramid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 7.5, 5.5, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var A = board.create('point', [-3, -2], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [3, -2], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [4.5, 0], { visible: false, fixed: true, name: '' });
        var D = board.create('point', [-1.5, 0], { visible: false, fixed: true, name: '' });

        var apex = board.create('point', [0.75, 6.5], { visible: false, fixed: true, name: '' });
        var baseCenter = board.create('point', [0.75, -1], { visible: false, fixed: true, name: '' });

        board.create('segment', [D, A], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [D, C], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [B, C], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        board.create('segment', [D, apex], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });
        board.create('segment', [A, apex], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [B, apex], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [C, apex], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        board.create('segment', [apex, baseCenter], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        var raSize = 0.45;
        var raPt1 = board.create('point', [baseCenter.X() + raSize, baseCenter.Y()], { visible: false, fixed: true, name: '' });
        var raPt2 = board.create('point', [baseCenter.X() + raSize, baseCenter.Y() + raSize], { visible: false, fixed: true, name: '' });
        var raPt3 = board.create('point', [baseCenter.X(), baseCenter.Y() + raSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [raPt1, raPt2], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [raPt2, raPt3], {
            strokeColor: '#DC2626', strokeWidth: 1.0, fixed: true, highlight: false
        });

        board.create('text', [-0.4, 1.6, '9\\text{ m}'], {
            useKatex: true, fontSize: 13, color: '#DC2626',
            anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [0, -2.8, '8\\text{ m}'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

    </script>
</body>
</html>
