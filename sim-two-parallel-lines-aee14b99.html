<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Parallel Lines</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 8, 6, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0, ticksDistance: 1
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [5.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 7.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        var COL1 = '#222222';
        var COL2 = '#2563EB';

        // ── Line 1: through (1,2) and (3,6) ────────────────────────────
        var P1 = board.create('point', [1, 2], {
            name: '', size: 2, color: COL1, fixed: true, highlight: false
        });
        var P2 = board.create('point', [3, 6], {
            name: '', size: 2, color: COL1, fixed: true, highlight: false
        });

        board.create('line', [P1, P2], {
            strokeColor: COL1, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Point labels for Line 1
        board.create('text', [1.2, 1.4, '(1,\\,2)'], {
            useKatex: true, fontSize: 12, color: COL1, fixed: true, highlight: false
        });
        board.create('text', [3.2, 6.3, '(3,\\,6)'], {
            useKatex: true, fontSize: 12, color: COL1, fixed: true, highlight: false
        });

        // Line 1 label
        board.create('text', [0.2, 3.8, '\\text{Line 1}'], {
            useKatex: true, fontSize: 13, color: COL1, fixed: true, highlight: false
        });

        // ── Line 2: through (2,-1) and (4,3) ───────────────────────────
        var P3 = board.create('point', [2, -1], {
            name: '', size: 2, color: COL2, fixed: true, highlight: false
        });
        var P4 = board.create('point', [4, 3], {
            name: '', size: 2, color: COL2, fixed: true, highlight: false
        });

        board.create('line', [P3, P4], {
            strokeColor: COL2, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Point labels for Line 2
        board.create('text', [2.2, -1.6, '(2,\\,-1)'], {
            useKatex: true, fontSize: 12, color: COL2, fixed: true, highlight: false
        });
        board.create('text', [4.2, 3.3, '(4,\\,3)'], {
            useKatex: true, fontSize: 12, color: COL2, fixed: true, highlight: false
        });

        // Line 2 label
        board.create('text', [4.2, 1.2, '\\text{Line 2}'], {
            useKatex: true, fontSize: 13, color: COL2, fixed: true, highlight: false
        });
    </script>
</body>
</html>
