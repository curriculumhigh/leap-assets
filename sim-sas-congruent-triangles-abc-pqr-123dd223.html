<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Congruent Triangles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 8.5, 17, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var OUTLINE = '#555555';
        var MARK_COL = '#DC2626';
        var LBL_COL = '#222222';

        // ── Triangle ABC ────────────────────────────────────────────
        var A = board.create('point', [1.5, 7], { name: '', visible: false, fixed: true, showInfobox: false });
        var B = board.create('point', [0, 1], { name: '', visible: false, fixed: true, showInfobox: false });
        var C = board.create('point', [5.5, 1], { name: '', visible: false, fixed: true, showInfobox: false });

        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Vertex labels — ABC
        board.create('text', [1.3, 7.6, 'A'], { fontSize: 13, color: LBL_COL, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [-0.6, 0.7, 'B'], { fontSize: 13, color: LBL_COL, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [6.0, 0.7, 'C'], { fontSize: 13, color: LBL_COL, fixed: true, highlight: false, anchorX: 'middle' });

        // ── Triangle PQR ────────────────────────────────────────────
        var P = board.create('point', [11, 7], { name: '', visible: false, fixed: true, showInfobox: false });
        var Q = board.create('point', [9.5, 1], { name: '', visible: false, fixed: true, showInfobox: false });
        var R = board.create('point', [15, 1], { name: '', visible: false, fixed: true, showInfobox: false });

        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: OUTLINE, strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Vertex labels — PQR
        board.create('text', [10.8, 7.6, 'P'], { fontSize: 13, color: LBL_COL, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [8.9, 0.7, 'Q'], { fontSize: 13, color: LBL_COL, fixed: true, highlight: false, anchorX: 'middle' });
        board.create('text', [15.5, 0.7, 'R'], { fontSize: 13, color: LBL_COL, fixed: true, highlight: false, anchorX: 'middle' });

        // ── Helper: tick marks on a segment ─────────────────────────
        function drawTicks(p1, p2, count) {
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var px = -dy / len;
            var py = dx / len;
            var tickLen = 0.3;
            var spacing = 0.25;

            for (var i = 0; i < count; i++) {
                var offset = (i - (count - 1) / 2) * spacing;
                var cx = mx + offset * (dx / len);
                var cy = my + offset * (dy / len);
                board.create('segment', [
                    [cx - px * tickLen, cy - py * tickLen],
                    [cx + px * tickLen, cy + py * tickLen]
                ], {
                    strokeColor: OUTLINE, strokeWidth: 1.8, fixed: true, highlight: false
                });
            }
        }

        // Single tick on AB and PQ
        drawTicks(A, B, 1);
        drawTicks(P, Q, 1);

        // Double tick on BC and QR
        drawTicks(B, C, 2);
        drawTicks(Q, R, 2);

        // ── Angle arcs at B and Q ───────────────────────────────────
        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.7,
            fillColor: MARK_COL, fillOpacity: 0.08,
            strokeColor: MARK_COL, strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [P, Q, R], {
            radius: 0.7,
            fillColor: MARK_COL, fillOpacity: 0.08,
            strokeColor: MARK_COL, strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false
        });

        // ── Side labels (KaTeX) ─────────────────────────────────────

        // Helper: compute outward normal for a side of a triangle
        function outwardNormal(p1, p2, opp) {
            var dx = p2.X() - p1.X();
            var dy = p2.Y() - p1.Y();
            var len = Math.sqrt(dx * dx + dy * dy);
            var n1x = -dy / len;
            var n1y = dx / len;
            var mx = (p1.X() + p2.X()) / 2;
            var my = (p1.Y() + p2.Y()) / 2;
            var toOppX = opp.X() - mx;
            var toOppY = opp.Y() - my;
            var dot = n1x * toOppX + n1y * toOppY;
            if (dot > 0) {
                return { x: -n1x, y: -n1y };
            }
            return { x: n1x, y: n1y };
        }

        // AB label — outside triangle (away from C), shifted further left
        var abN = outwardNormal(A, B, C);
        var abMx = (A.X() + B.X()) / 2;
        var abMy = (A.Y() + B.Y()) / 2;
        board.create('text', [abMx + abN.x * 1.4, abMy + abN.y * 1.4, '2x + y'], {
            fontSize: 12, color: LBL_COL, useKatex: true, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // BC label — outside triangle (away from A), below base
        board.create('text', [2.75, 0.1, 'x + 3y'], {
            fontSize: 12, color: LBL_COL, useKatex: true, fixed: true, highlight: false, anchorX: 'middle'
        });

        // PQ label — outside triangle (away from R)
        var pqN = outwardNormal(P, Q, R);
        var pqMx = (P.X() + Q.X()) / 2;
        var pqMy = (P.Y() + Q.Y()) / 2;
        board.create('text', [pqMx + pqN.x * 0.9, pqMy + pqN.y * 0.9, '11'], {
            fontSize: 12, color: LBL_COL, useKatex: true, fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // QR label — outside triangle (away from P), below base
        board.create('text', [12.25, 0.1, '13'], {
            fontSize: 12, color: LBL_COL, useKatex: true, fixed: true, highlight: false, anchorX: 'middle'
        });
    </script>
</body>
</html>
