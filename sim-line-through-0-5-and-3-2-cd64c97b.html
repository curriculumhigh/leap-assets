<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line through (0,5) and (3,2)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.8, 8.3, 7.2, -1.7],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Create axes manually for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                drawZero: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                drawZero: false
            }
        });

        // Axis labels
        board.create('text', [6.8, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 7.9, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Line through (0,5) and (3,2)
        var anchor1 = board.create('point', [0, 5], { visible: false, fixed: true, name: '' });
        var anchor2 = board.create('point', [3, 2], { visible: false, fixed: true, name: '' });
        board.create('line', [anchor1, anchor2], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Key points
        board.create('point', [0, 5], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [3, 2], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels
        board.create('text', [-0.3, 5.5, '(0,\\, 5)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'right', fixed: true, highlight: false
        });
        board.create('text', [3.3, 1.4, '(3,\\, 2)'], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });
    </script>
</body>
</html>
