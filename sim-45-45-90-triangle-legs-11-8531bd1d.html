<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-45-90 Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 6.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [0, 5], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [5, 0], { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('segment', [A, B], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [B, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });
        board.create('segment', [A, C], { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false });

        // Right angle marker at B (bottom-left corner)
        var sqSize = 0.45;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [sq1, sq2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // Small angle arcs (inside the triangle)
        board.create('nonReflexAngle', [C, A, B], {
            radius: 0.7,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.7,
            fillColor: '#222222', fillOpacity: 0.05,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false
        });

        // 45° angle labels — inside the triangle
        board.create('text', [0.25, 3.95, '45\u00B0'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, anchorX: 'left', anchorY: 'middle'
        });

        board.create('text', [3.45, 0.7, '45\u00B0'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, anchorX: 'right', anchorY: 'middle'
        });

        // Side labels
        board.create('text', [-0.7, 2.5, '11'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle',
            useKatex: true
        });

        board.create('text', [2.5, -0.65, '11'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle',
            useKatex: true
        });

        board.create('text', [3.2, 3.2, 'x'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle',
            useKatex: true
        });
    </script>
</body>
</html>
