<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congruent Triangles PQR and WXY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 7, 13.5, -1],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Triangle PQR (left side, upright) ───────────────────────────
        var P = board.create('point', [2.5, 6], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-2, 12] }
        });
        var Q = board.create('point', [0.5, 1], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -8] }
        });
        var R = board.create('point', [5.5, 1], {
            name: 'R', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -8] }
        });

        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Side labels for PQR
        board.create('text', [0.9, 3.8, '4y - 5'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'middle'
        });
        board.create('text', [3.0, 0.3, '18'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [4.6, 3.8, '2x + 1'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'middle'
        });

        // ── Triangle WXY (right side, rotated and flipped) ──────────────
        var W = board.create('point', [11.5, 6], {
            name: 'W', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 12] }
        });
        var X = board.create('point', [8, 6], {
            name: 'X', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 12] }
        });
        var Y = board.create('point', [10.5, 1], {
            name: 'Y', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [4, -14] }
        });

        board.create('polygon', [W, X, Y], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        // Side labels for WXY
        board.create('text', [9.75, 6.6, '23'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [8.6, 3.3, '18'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'middle'
        });
        board.create('text', [11.6, 3.3, '11'], {
            useKatex: true, fontSize: 13, color: '#222222', fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'middle'
        });
    </script>
</body>
</html>
