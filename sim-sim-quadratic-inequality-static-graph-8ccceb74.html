<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Inequality Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 12, 8.5, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { fontSize: 11, offset: [0, -14] }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 11, offset: [-14, 0] }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 11.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Function: y = x^2 - 6x + 8
        function f(x) {
            return x * x - 6 * x + 8;
        }

        // Bounding box limits
        var xMin = -1.5;
        var xMax = 8.5;
        var yBot = -3;
        var numPts = 200;

        // Shade BELOW the parabola (outside the parabola for upward-opening)
        var shadeBelow = board.create('curve', [[], []], {
            strokeWidth: 0,
            fillColor: '#2563EB',
            fillOpacity: 0.10,
            fixed: true,
            highlight: false
        });

        var xBelow = [];
        var yBelow = [];

        // Bottom-left corner
        xBelow.push(xMin);
        yBelow.push(yBot);

        // Along the parabola from left to right
        for (var j = 0; j <= numPts; j++) {
            var xv = xMin + (xMax - xMin) * j / numPts;
            xBelow.push(xv);
            yBelow.push(f(xv));
        }

        // Right side down to bottom
        xBelow.push(xMax);
        yBelow.push(yBot);

        // Close the path
        xBelow.push(xMin);
        yBelow.push(yBot);

        shadeBelow.dataX = xBelow;
        shadeBelow.dataY = yBelow;

        // Solid parabola (blue)
        board.create('functiongraph', [f, -1.5, 8.5], {
            strokeColor: '#2563EB',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Function rule label
        board.create('text', [3, 1.5, 'y = x\u00B2 \u2212 6x + 8'], {
            fontSize: 13,
            color: '#2563EB',
            anchorX: 'middle',
            fixed: true,
            highlight: false
        });

        board.update();
    </script>
</body>
</html>
