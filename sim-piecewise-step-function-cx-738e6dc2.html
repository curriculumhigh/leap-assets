<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Function C(x)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 33, 5.2, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.9, -1.5, 'x'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 31.5, 'C(x)'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Step function segments
        // C(x) = 10, 0 < x <= 1
        board.create('segment', [[0, 10], [1, 10]], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        // C(x) = 16, 1 < x <= 2
        board.create('segment', [[1, 16], [2, 16]], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        // C(x) = 22, 2 < x <= 3
        board.create('segment', [[2, 22], [3, 22]], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        // C(x) = 28, 3 < x <= 4
        board.create('segment', [[3, 28], [4, 28]], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Closed circles (filled) at right endpoints
        board.create('point', [1, 10], { name: '', size: 5, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false });
        board.create('point', [2, 16], { name: '', size: 5, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false });
        board.create('point', [3, 22], { name: '', size: 5, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false });
        board.create('point', [4, 28], { name: '', size: 5, fillColor: '#222222', strokeColor: '#222222', fixed: true, highlight: false });

        // Open circles (hollow) at left endpoints
        board.create('point', [0, 10], { name: '', size: 5, fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('point', [1, 16], { name: '', size: 5, fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('point', [2, 22], { name: '', size: 5, fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('point', [3, 28], { name: '', size: 5, fillColor: '#ffffff', strokeColor: '#222222', strokeWidth: 1.5, fixed: true, highlight: false });

        // Function label
        board.create('text', [4.2, 30, 'C(x)'], { fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false });
    </script>
</body>
</html>
