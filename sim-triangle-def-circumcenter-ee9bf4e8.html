<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle DEF — Circumcenter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 6, 6, -4],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 5.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Triangle vertices ───────────────────────────────────────────
        var D = board.create('point', [-2, 4], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var E = board.create('point', [-2, -2], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var F = board.create('point', [4, -2], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [D, E], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [E, F], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [F, D], { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Vertex labels (name + coordinates) ──────────────────────────
        board.create('text', [-2.1, 4.5, 'D(-2, 4)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle'
        });
        board.create('text', [-2.1, -2.7, 'E(-2, -2)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle'
        });
        board.create('text', [4, -2.7, 'F(4, -2)'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle'
        });

        // ── Perpendicular bisectors (cyan, dashed) ─────────────────────
        // y = 1 (horizontal)
        board.create('line', [[0, 1], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false,
            point1: { visible: false }, point2: { visible: false }
        });
        // x = 1 (vertical)
        board.create('line', [[1, 0], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false,
            point1: { visible: false }, point2: { visible: false }
        });

        // Bisector labels
        board.create('text', [4.2, 1.4, 'y = 1'], {
            fontSize: 11, color: '#0EA5E9', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [1.4, 4.8, 'x = 1'], {
            fontSize: 11, color: '#0EA5E9', useKatex: true, fixed: true, highlight: false
        });

        // ── Circumcenter (red, attention point) ────────────────────────
        board.create('point', [1, 1], {
            name: '', size: 3, color: '#DC2626', fixed: true, highlight: false, showInfobox: false
        });
        board.create('text', [1.5, 0.4, '(1, 1)'], {
            fontSize: 12, color: '#DC2626', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
