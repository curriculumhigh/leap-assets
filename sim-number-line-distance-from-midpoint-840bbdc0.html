<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line — Distance from Midpoint</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.8, 4.2, 7.8, -3.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_ARROW = '#2563EB';
        var COL_AXIS = '#444444';
        var COL_PT = '#222222';
        var Y_LINE = 0;
        var Y_ARROW = 2.4;

        // ── Number line ─────────────────────────────────────────────────
        board.create('arrow', [[-7.3, Y_LINE], [7.3, Y_LINE]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var i;
        for (i = -6; i <= 6; i++) {
            board.create('segment', [[i, -0.2], [i, 0.2]], {
                strokeColor: COL_AXIS, strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [i, -0.7, String(i)], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 11, color: COL_AXIS,
                fixed: true, highlight: false
            });
        }

        // ── Key points: solid dots at −5, 0, 5 ─────────────────────────
        board.create('point', [-5, Y_LINE], {
            name: '', size: 5, color: COL_PT, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [0, Y_LINE], {
            name: '', size: 4, color: COL_PT, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [5, Y_LINE], {
            name: '', size: 5, color: COL_PT, fixed: true,
            highlight: false, showInfobox: false
        });

        // ── Bold labels below the key points ────────────────────────────
        board.create('text', [-5, -1.6, '\\mathbf{-5}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_PT, useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [0, -1.6, '\\mathbf{0}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_PT, useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [5, -1.6, '\\mathbf{5}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_PT, useKatex: true,
            fixed: true, highlight: false
        });

        // ── Dashed vertical drop from midpoint (0) up to arrow height ──
        board.create('segment', [[0, Y_LINE + 0.3], [0, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.2, dash: 2,
            fixed: true, highlight: false
        });

        // ── Horizontal distance arrows ──────────────────────────────────
        // Left arrow: 0 → −5
        board.create('arrow', [[0, Y_ARROW], [-5, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });
        // Right arrow: 0 → 5
        board.create('arrow', [[0, Y_ARROW], [5, Y_ARROW]], {
            strokeColor: COL_ARROW, strokeWidth: 1.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // ── Distance labels above arrows ────────────────────────────────
        board.create('text', [-2.5, Y_ARROW + 0.7, '\\mathbf{5}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: COL_ARROW, useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [2.5, Y_ARROW + 0.7, '\\mathbf{5}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 15, color: COL_ARROW, useKatex: true,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
