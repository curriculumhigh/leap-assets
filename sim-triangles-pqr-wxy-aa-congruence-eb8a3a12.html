<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangles PQR and WXY — AA Congruence Marks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8.5, 5.5, 8.5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_EDGE = '#555555';
        var COL_VERT = '#222222';
        var COL_ARC1 = '#2563EB';
        var COL_ARC2 = '#059669';

        var ptAttrs = {
            size: 2, color: COL_VERT, fixed: true,
            showInfobox: false, highlight: false, withLabel: false
        };

        // ── Base scalene triangle shape (relative to centroid) ──────────
        var bA = [0.3, 2.2];
        var bB = [-1.8, -1.0];
        var bC = [2.0, -1.0];

        var scale = 1.3;

        // ── Triangle PQR (left) ─────────────────────────────────────────
        var cx1 = -4.3, cy1 = 0.5;

        var P = board.create('point', [cx1 + bA[0] * scale, cy1 + bA[1] * scale], ptAttrs);
        var Q = board.create('point', [cx1 + bB[0] * scale, cy1 + bB[1] * scale], ptAttrs);
        var R = board.create('point', [cx1 + bC[0] * scale, cy1 + bC[1] * scale], ptAttrs);

        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EDGE, strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('text', [P.X(), P.Y() + 0.55, 'P'], {
            fontSize: 14, color: COL_VERT, anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [Q.X() - 0.5, Q.Y() - 0.2, 'Q'], {
            fontSize: 14, color: COL_VERT, anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });
        board.create('text', [R.X() + 0.5, R.Y() - 0.2, 'R'], {
            fontSize: 14, color: COL_VERT, anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });

        // Angle P — single arc (blue)
        board.create('nonReflexAngle', [Q, P, R], {
            radius: 0.6,
            strokeColor: COL_ARC1, strokeWidth: 1.8,
            fillColor: COL_ARC1, fillOpacity: 0.08,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Angle Q — double arc (green)
        board.create('nonReflexAngle', [P, Q, R], {
            radius: 0.5,
            strokeColor: COL_ARC2, strokeWidth: 1.8,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false, highlight: false
        });
        board.create('nonReflexAngle', [P, Q, R], {
            radius: 0.7,
            strokeColor: COL_ARC2, strokeWidth: 1.8,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // ── Triangle WXY (right, same size and shape) ───────────────────
        var cx2 = 4.3, cy2 = 0.5;

        var W = board.create('point', [cx2 + bA[0] * scale, cy2 + bA[1] * scale], ptAttrs);
        var X = board.create('point', [cx2 + bB[0] * scale, cy2 + bB[1] * scale], ptAttrs);
        var Y = board.create('point', [cx2 + bC[0] * scale, cy2 + bC[1] * scale], ptAttrs);

        board.create('polygon', [W, X, Y], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EDGE, strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        board.create('text', [W.X(), W.Y() + 0.55, 'W'], {
            fontSize: 14, color: COL_VERT, anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [X.X() - 0.5, X.Y() - 0.2, 'X'], {
            fontSize: 14, color: COL_VERT, anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });
        board.create('text', [Y.X() + 0.5, Y.Y() - 0.2, 'Y'], {
            fontSize: 14, color: COL_VERT, anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false
        });

        // Angle W — single arc (blue, matches P)
        board.create('nonReflexAngle', [X, W, Y], {
            radius: 0.6,
            strokeColor: COL_ARC1, strokeWidth: 1.8,
            fillColor: COL_ARC1, fillOpacity: 0.08,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Angle X — double arc (green, matches Q)
        board.create('nonReflexAngle', [W, X, Y], {
            radius: 0.5,
            strokeColor: COL_ARC2, strokeWidth: 1.8,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false, highlight: false
        });
        board.create('nonReflexAngle', [W, X, Y], {
            radius: 0.7,
            strokeColor: COL_ARC2, strokeWidth: 1.8,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, name: '', withLabel: false, highlight: false
        });
    </script>
</body>
</html>
