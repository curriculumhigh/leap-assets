<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y=(x-3)/(x+1)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 6, 7, -6],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 8, anchorX: 'middle', offset: [0, -10] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        majorHeight: 6,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 8, anchorX: 'right', offset: [-4, 0] },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        majorHeight: 6,
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.5, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.25, 5.5, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // Vertical asymptote x = -1
        board.create('line', [[-1, 0], [-1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // Horizontal asymptote y = 1
        board.create('line', [[0, 1], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // Function y = (x-3)/(x+1)
        var f = function(x) { return (x - 3) / (x + 1); };

        // Left branch: x < -1
        board.create('functiongraph', [f, -20, -1.02], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Right branch: x > -1
        board.create('functiongraph', [f, -0.98, 20], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Orientation arrows (left-to-right) on each branch
        var arrLx = -3;
        var arrLy = f(arrLx);
        var dx = 0.01;
        var dyL = f(arrLx + dx) - arrLy;
        var lenL = Math.sqrt(dx * dx + dyL * dyL);
        var sL = 0.5;
        board.create('arrow', [
            [arrLx - sL * dx / lenL, arrLy - sL * dyL / lenL],
            [arrLx + sL * dx / lenL, arrLy + sL * dyL / lenL]
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        var arrRx = 5;
        var arrRy = f(arrRx);
        var dyR = f(arrRx + dx) - arrRy;
        var lenR = Math.sqrt(dx * dx + dyR * dyR);
        var sR = 0.5;
        board.create('arrow', [
            [arrRx - sR * dx / lenR, arrRy - sR * dyR / lenR],
            [arrRx + sR * dx / lenR, arrRy + sR * dyR / lenR]
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }
        });

        // Key points (no labels)
        board.create('point', [3, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', [0, -3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
