<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpendicular Lines FG and HK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 4.5, 5, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var LEN = 3.5;
        var SQ = 0.35;

        var E = board.create('point', [0, 0], {
            name: 'E', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [10, -14] }
        });

        var F = board.create('point', [-LEN, 0], {
            name: 'F', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -4] }
        });
        var G = board.create('point', [LEN, 0], {
            name: 'G', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -4] }
        });

        board.create('segment', [F, G], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var H = board.create('point', [0, LEN], {
            name: 'H', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 6] }
        });
        var K = board.create('point', [0, -LEN], {
            name: 'K', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -14] }
        });

        board.create('segment', [H, K], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        var sq1 = board.create('point', [SQ, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [SQ, SQ], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, SQ], { visible: false, fixed: true, name: '' });

        board.create('polygon', [E, sq1, sq2, sq3], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#DC2626', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });
    </script>
</body>
</html>
