<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filling a container</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        svg { display: block; width: 100%; height: 100%; margin: 0 auto; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <!-- Static geometry drawing: shape outlines #555555, base line #444444, water as light shading. -->
            <svg viewBox="10 0 300 250" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- faucet: wall pipe + spout + handle -->
                <rect x="40" y="18" width="114" height="13" rx="3" fill="#E5E7EB" stroke="#555555" stroke-width="1.2"/>
                <rect x="30" y="10" width="13" height="29" rx="2" fill="#D1D5DB" stroke="#555555" stroke-width="1.2"/>
                <path d="M140 18 H160 Q170 18 170 28 V46 H154 V31 H140 Z" fill="#E5E7EB" stroke="#555555" stroke-width="1.2" stroke-linejoin="round"/>
                <rect x="128" y="9" width="8" height="9" fill="#D1D5DB" stroke="#555555" stroke-width="1.2"/>
                <rect x="120" y="4" width="24" height="6" rx="2" fill="#D1D5DB" stroke="#555555" stroke-width="1.2"/>
                <!-- water stream from the spout through the open top down to the floor -->
                <rect x="157" y="46" width="10" height="182" fill="#7DD3FC" fill-opacity="0.85"/>
                <ellipse cx="162" cy="228" rx="16" ry="3" fill="#7DD3FC" fill-opacity="0.7"/>
                <!-- container: truncated cone, narrow open top (54 wide), wide bottom (162 wide = 3x) -->
                <path d="M135 104 L189 104 L243 230 L81 230 Z" fill="#555555" fill-opacity="0.06" stroke="none"/>
                <polyline points="135,104 81,230 243,230 189,104" fill="none" stroke="#555555" stroke-width="2" stroke-linejoin="round"/>
                <ellipse cx="162" cy="104" rx="27" ry="4.5" fill="none" stroke="#555555" stroke-width="1.5"/>
                <!-- base line -->
                <line x1="30" y1="231" x2="290" y2="231" stroke="#444444" stroke-width="1.2"/>
            </svg>
        </div>
    </div>
</body>
</html>
