<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot — Hours Burning vs Height</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 22.5, 9, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Custom axes (origin at 0,0, first-quadrant focus)
        board.create('arrow', [[0, 0], [8.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        board.create('arrow', [[0, 0], [0, 21.5]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Grid lines
        var i;
        for (i = 1; i <= 8; i++) {
            board.create('segment', [[i, 0], [i, 20]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 1; i <= 20; i++) {
            board.create('segment', [[0, i], [8, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Tick marks & labels — x-axis
        for (i = 1; i <= 8; i++) {
            board.create('segment', [[i, -0.3], [i, 0.3]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -1.1, String(i)], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 11, color: '#444444', fixed: true, highlight: false
            });
        }

        // Tick marks & labels — y-axis (every 1)
        for (i = 1; i <= 20; i++) {
            board.create('segment', [[-0.15, i], [0.15, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [-0.45, i, String(i)], {
                anchorX: 'right', anchorY: 'middle',
                fontSize: 11, color: '#444444', fixed: true, highlight: false
            });
        }

        // Origin label
        board.create('text', [-0.45, -1.1, '0'], {
            anchorX: 'right', anchorY: 'middle',
            fontSize: 11, color: '#444444', fixed: true, highlight: false
        });

        // Axis labels (KaTeX)
        board.create('text', [4.2, -2.0, '\\textit{Hours burning}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#444444', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [-0.9, 11, '\\textit{Height (cm)}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#444444', useKatex: true, fixed: true, highlight: false,
            rotate: 90
        });

        // Data points
        var data = [
            [1, 18], [2, 15], [3, 14], [4, 11], [5, 9], [6, 7], [7, 4]
        ];

        for (i = 0; i < data.length; i++) {
            board.create('point', [data[i][0], data[i][1]], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
