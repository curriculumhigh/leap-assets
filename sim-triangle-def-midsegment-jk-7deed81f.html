<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle DEF Midsegment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.5, 8.5, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_MIDSEG = '#2563EB';

        // Vertices
        var D = board.create('point', [0.5, 0], {
            name: 'D', fixed: true, size: 1.5, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -10] }
        });
        var E = board.create('point', [3.5, 4.5], {
            name: 'E', fixed: true, size: 1.5, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, 12] }
        });
        var F = board.create('point', [7, 0], {
            name: 'F', fixed: true, size: 1.5, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });

        // Triangle outline (no fill)
        board.create('polygon', [D, E, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Midpoints
        var J = board.create('midpoint', [D, E], {
            name: 'J', fixed: true, size: 1.5, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, 2] }
        });
        var K = board.create('midpoint', [E, F], {
            name: 'K', fixed: true, size: 1.5, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, 2] }
        });

        // Midsegment JK in blue
        board.create('segment', [J, K], {
            strokeColor: COL_MIDSEG, strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Label "9" on midsegment JK (above, centered) in blue
        var jkMidX = (J.X() + K.X()) / 2;
        var jkMidY = (J.Y() + K.Y()) / 2;
        board.create('text', [jkMidX, jkMidY + 0.45, '9'], {
            fontSize: 14, color: COL_MIDSEG, anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false, useKatex: true
        });

        // Label "x" on base DF (below, centered)
        var dfMidX = (D.X() + F.X()) / 2;
        var dfMidY = (D.Y() + F.Y()) / 2;
        board.create('text', [dfMidX, dfMidY - 0.55, 'x'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
