<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-60-90 Triangle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 5.5, 8, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices:
        // A = bottom-left (90°), B = top-left (60°), C = bottom-right (30°)
        // Short leg AB = 1 (vertical), Long leg AC = √3 (horizontal), Hypotenuse BC = 2
        var scale = 4;
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [0, scale * 1], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [scale * Math.sqrt(3), 0], { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('polygon', [A, B, C], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Right angle marker at A (bottom-left)
        var sqSize = 0.4;
        board.create('polygon', [
            [0, 0], [sqSize, 0], [sqSize, sqSize], [0, sqSize]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#222222', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // 60° angle arc at B (top-left)
        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.7,
            fillColor: 'transparent', fillOpacity: 0,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // 60° label at B
        var bisB = (-Math.PI / 2 + (-Math.PI / 6)) / 2;
        board.create('text', [
            0 + 1.1 * Math.cos(bisB),
            scale * 1 + 1.1 * Math.sin(bisB),
            '60\\degree'
        ], { useKatex: true, fontSize: 12, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // 30° angle arc at C (bottom-right)
        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.9,
            fillColor: 'transparent', fillOpacity: 0,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false
        });

        // 30° label at C
        var bisC = (Math.PI + 5 * Math.PI / 6) / 2;
        board.create('text', [
            scale * Math.sqrt(3) + 1.3 * Math.cos(bisC),
            0 + 1.3 * Math.sin(bisC),
            '30\\degree'
        ], { useKatex: true, fontSize: 12, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });

        // Side labels
        // Left side (AB, vertical): label "1"
        board.create('text', [-0.6, scale * 0.5, '1'], {
            useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Bottom side (AC, horizontal): label "√3"
        board.create('text', [scale * Math.sqrt(3) / 2, -0.6, '\\sqrt{3}'], {
            useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Hypotenuse (BC): label "2"
        var midHypX = (0 + scale * Math.sqrt(3)) / 2;
        var midHypY = (scale + 0) / 2;
        board.create('text', [midHypX + 0.4, midHypY + 0.4, '2'], {
            useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

    </script>
</body>
</html>
