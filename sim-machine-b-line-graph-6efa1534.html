<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine B — Line Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); display: flex; flex-direction: column; }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; flex: 1; position: relative; }
        #board { width: 100%; height: 100%; }
        .y-axis-label {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: rotate(-90deg) translateX(-50%);
            transform-origin: 0 0;
            font-size: 13px;
            color: #444444;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div class="y-axis-label">Boxes filled</div>
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.9, 58, 7.2, -8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Grid lines
        var i;
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, 0], [i, 50]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }
        for (i = 5; i <= 50; i += 5) {
            board.create('segment', [[0, i], [6, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Axes
        board.create('arrow', [[0, 0], [6.7, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        board.create('arrow', [[0, 0], [0, 54]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // X-axis ticks and labels
        for (i = 1; i <= 6; i++) {
            board.create('segment', [[i, -0.8], [i, 0]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [i, -2.5, String(i)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }
        board.create('text', [-0.3, -2.5, '0'], {
            fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // Y-axis ticks and labels
        for (i = 5; i <= 50; i += 5) {
            board.create('segment', [[-0.12, i], [0, i]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            if (i % 10 === 0) {
                board.create('text', [-0.45, i, String(i)], {
                    fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                    fixed: true, highlight: false
                });
            }
        }

        // X-axis label
        board.create('text', [3.3, -5.8, '\\text{Time (minutes)}'], {
            fontSize: 13, color: '#444444', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // Title
        board.create('text', [3.3, 55.5, '\\textbf{Machine B}'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        // Line: y = 7x
        board.create('segment', [[0, 0], [6, 42]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points
        board.create('point', [1, 7], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [1.3, 4.5, '(1,\\, 7)'], {
            fontSize: 12, color: '#222222', anchorX: 'left', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });

        board.create('point', [5, 35], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [5.2, 32.5, '(5,\\, 35)'], {
            fontSize: 12, color: '#222222', anchorX: 'left', anchorY: 'middle',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
