<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle STU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 12, 44, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var T = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var U = board.create('point', [40, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var S = board.create('point', [0, 9], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle edges — no fill
        board.create('polygon', [S, T, U], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at T
        var sqSize = 1.6;
        var raPt1 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });
        var raPt2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var raPt3 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        board.create('segment', [raPt1, raPt2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raPt2, raPt3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Vertex labels — bold
        board.create('text', [-2.2, 10.2, '<b>S</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [-2.2, -1.8, '<b>T</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [42, -1.8, '<b>U</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Side labels outside the triangle
        // ST = 9 (vertical left leg, label to the left at midpoint)
        board.create('text', [-2.2, 4.5, '<b>9</b>'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // TU = 40 (horizontal bottom leg, label below at midpoint)
        board.create('text', [20, -1.8, '<b>40</b>'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // SU = 41 (hypotenuse, label offset outward at midpoint)
        var hypMidX = 20;
        var hypMidY = 4.5;
        var normLen = Math.sqrt(9*9 + 40*40);
        var offX = 2.5 * (9 / normLen);
        var offY = 2.5 * (40 / normLen);
        board.create('text', [hypMidX + offX, hypMidY + offY, '<b>41</b>'], {
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
