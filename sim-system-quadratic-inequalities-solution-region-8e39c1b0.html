<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System of Quadratic Inequalities — Solution Region</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4, 10, 7, -10],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.5, -0.8, '\\textit{x}'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.3, 9.3, '\\textit{y}'], { fontSize: 11, useKatex: true, fixed: true, highlight: false });

        // Functions
        function f(x) { return x * x - 4 * x - 5; }
        function g(x) { return -x * x + 2 * x + 3; }

        // Intersection points: x = -1, x = 4
        var xLeft = -1;
        var xRight = 4;

        // Build shading polygon: top boundary = g(x), bottom boundary = f(x), x in [-1, 4]
        var shadePtsX = [];
        var shadePtsYtop = [];
        var shadePtsYbot = [];
        var nPts = 80;
        var dx = (xRight - xLeft) / nPts;

        for (var i = 0; i <= nPts; i++) {
            var xi = xLeft + i * dx;
            shadePtsX.push(xi);
            shadePtsYtop.push(g(xi));
            shadePtsYbot.push(f(xi));
        }

        // Create polygon vertices: go along g(x) left-to-right, then f(x) right-to-left
        var polyPoints = [];
        for (var i = 0; i <= nPts; i++) {
            polyPoints.push(board.create('point', [shadePtsX[i], shadePtsYtop[i]], {
                visible: false, fixed: true, name: ''
            }));
        }
        for (var i = nPts; i >= 0; i--) {
            polyPoints.push(board.create('point', [shadePtsX[i], shadePtsYbot[i]], {
                visible: false, fixed: true, name: ''
            }));
        }

        board.create('polygon', polyPoints, {
            fillColor: '#888888',
            fillOpacity: 0.15,
            borders: { strokeWidth: 0, visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Upward parabola f(x) = x² - 4x - 5 — dashed, primary
        board.create('functiongraph', [f, -4, 7], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Downward parabola g(x) = -x² + 2x + 3 — solid, secondary
        board.create('functiongraph', [g, -4, 7], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // Intersection points — small structural dots
        board.create('point', [xLeft, f(xLeft)], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [xRight, f(xRight)], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false
        });

        // Function labels (name only)
        board.create('text', [-3.2, 6.5, 'f(x)'], {
            fontSize: 10, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [1.8, 5.5, 'g(x)'], {
            fontSize: 10, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
