<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle DEF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 8.5, 10, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices (small fixed points) ───────────────────────────────
        var D = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var E = board.create('point', [7, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var F = board.create('point', [7, 5], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle sides (no fill) ────────────────────────────────────
        board.create('segment', [D, E], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [E, F], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });
        board.create('segment', [D, F], {
            strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false
        });

        // ── Right-angle square marker at E ──────────────────────────────
        var sq = 0.55;
        board.create('segment', [[7 - sq, 0], [7 - sq, sq]], {
            strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[7 - sq, sq], [7, sq]], {
            strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Angle arc at D (nonReflexAngle: E → D → F) ─────────────────
        board.create('nonReflexAngle', [E, D, F], {
            radius: 1.2,
            fillColor: '#222222', fillOpacity: 0.06,
            strokeColor: '#222222', strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var bisectorAngle = Math.atan2(5, 7) / 2;
        var labelR = 1.7;
        board.create('text', [
            labelR * Math.cos(bisectorAngle),
            labelR * Math.sin(bisectorAngle),
            '42^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Vertex labels (bold) ────────────────────────────────────────
        board.create('text', [-0.5, -0.5, '\\textbf{D}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [7.5, -0.5, '\\textbf{E}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
        board.create('text', [7.5, 5.5, '\\textbf{F}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels ─────────────────────────────────────────────────
        board.create('text', [3.5, -0.7, 'w'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [7.7, 2.5, '14'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var hypLen = Math.sqrt(7 * 7 + 5 * 5);
        var nx = -5 / hypLen;
        var ny = 7 / hypLen;
        var offsetDist = 0.7;
        board.create('text', [3.5 + offsetDist * nx, 2.5 + offsetDist * ny, 'v'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
