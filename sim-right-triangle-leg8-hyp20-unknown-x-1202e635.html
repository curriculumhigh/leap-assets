<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle — Leg 8, Hypotenuse 20, Unknown Leg x</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9.5, 11, -2.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices
        var A = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [8, 0], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [0, 6.5], { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('segment', [A, C], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [A, B], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [C, B], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // Right-angle marker at vertex A
        var raSize = 0.55;
        var ra1 = board.create('point', [raSize, 0], { visible: false, fixed: true, name: '' });
        var ra2 = board.create('point', [raSize, raSize], { visible: false, fixed: true, name: '' });
        var ra3 = board.create('point', [0, raSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [ra1, ra2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [ra2, ra3], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Labels (KaTeX)
        board.create('text', [-0.9, 3.25, '8'], {
            useKatex: true, fontSize: 16, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        board.create('text', [4, -0.9, 'x'], {
            useKatex: true, fontSize: 16, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        board.create('text', [4.9, 3.9, '20'], {
            useKatex: true, fontSize: 16, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
