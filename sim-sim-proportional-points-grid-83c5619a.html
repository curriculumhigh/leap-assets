<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proportional Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 24, 10, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        insertTicks: false,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        insertTicks: false,
                        ticksDistance: 5
                    }
                }
            },
            grid: false
        });

        // Manual grid: vertical lines every 2, horizontal lines every 5
        var gx, gy;
        for (gx = 2; gx <= 9; gx += 2) {
            board.create('line', [[gx, 0], [gx, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }
        for (gy = 5; gy <= 23; gy += 5) {
            board.create('line', [[0, gy], [1, gy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // Origin label "0"
        board.create('text', [-0.4, -0.8, '0'], {
            fontSize: 11, color: '#444444', fixed: true, highlight: false,
            anchorX: 'middle'
        });

        // Axis labels
        board.create('text', [9.6, -0.8, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 23.2, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Points
        var pts = [[2, 5], [4, 10], [6, 15], [8, 20]];
        var labels = ['(2,\\,5)', '(4,\\,10)', '(6,\\,15)', '(8,\\,20)'];

        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 2, color: '#222222', fixed: true, highlight: false
            });
            board.create('text', [pts[i][0] + 0.3, pts[i][1] + 0.8, labels[i]], {
                useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false,
                anchorX: 'left'
            });
        }
    </script>
</body>
</html>
