<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Grid — Yards</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 25, 80, -35],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [76, -2.5, '\\textit{x}\\text{ (yards)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [1.5, 23.5, '\\textit{y}\\text{ (yards)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });

        // Colors
        var COL_START = '#222222';
        var COL_TOKEN1 = '#2563EB';
        var COL_TOKEN2 = '#059669';

        // --- Start Flag (15, 15) ---
        board.create('point', [15, 15], {
            name: '', size: 5, color: COL_START, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [15, 17.2, '\\text{Start Flag}\\;(15,\\,15)'], {
            fontSize: 12, color: COL_START, anchorX: 'middle', anchorY: 'bottom',
            useKatex: true, fixed: true, highlight: false
        });

        // --- Token 1 (30, -25) ---
        board.create('point', [30, -25], {
            name: '', size: 5, color: COL_TOKEN1, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [30, -27.2, '\\text{Token 1}\\;(30,\\,-25)'], {
            fontSize: 12, color: COL_TOKEN1, anchorX: 'middle', anchorY: 'top',
            useKatex: true, fixed: true, highlight: false
        });

        // --- Token 2 (70, -10) ---
        board.create('point', [70, -10], {
            name: '', size: 5, color: COL_TOKEN2, fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [70, -7.8, '\\text{Token 2}\\;(70,\\,-10)'], {
            fontSize: 12, color: COL_TOKEN2, anchorX: 'middle', anchorY: 'bottom',
            useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
