<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor — Limit Exists at x = 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 8.5, 6.5, -2.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        insertTicks: false,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        insertTicks: false,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 8.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        var COL_CURVE = '#2563EB';
        var COL_PT = '#DC2626';

        // Segment 1: (-5, 7) to (-3, 5)
        board.create('segment', [[-5, 7], [-3, 5]], {
            strokeColor: COL_CURVE, strokeWidth: 2.5, fixed: true, highlight: false
        });

        // Segment 2: (-3, 5) to (2, 1)
        board.create('segment', [[-3, 5], [2, 1]], {
            strokeColor: COL_CURVE, strokeWidth: 2.5, fixed: true, highlight: false
        });

        // Segment 3: (2, 1) to (5, -1)
        board.create('segment', [[2, 1], [5, -1]], {
            strokeColor: COL_CURVE, strokeWidth: 2.5, fixed: true, highlight: false
        });

        // Filled point at (-5, 7) — left endpoint
        board.create('point', [-5, 7], {
            name: '', size: 5, fillColor: COL_PT, strokeColor: COL_PT,
            strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Open circle at (-3, 5) — g(-3) undefined, limit = 5
        board.create('point', [-3, 5], {
            name: '', size: 5, fillColor: '#ffffff', strokeColor: COL_PT,
            strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Filled point at (2, 1) — g(2) = 1, and limit exists here (the violation)
        board.create('point', [2, 1], {
            name: '', size: 5, fillColor: COL_PT, strokeColor: COL_PT,
            strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Filled point at (5, -1) — right endpoint
        board.create('point', [5, -1], {
            name: '', size: 5, fillColor: COL_PT, strokeColor: COL_PT,
            strokeWidth: 1.5, fixed: true, highlight: false
        });

        // Function label — name only
        board.create('text', [-5.2, 7.7, 'g(x)'], {
            useKatex: true, fontSize: 13, color: COL_CURVE, fixed: true, highlight: false
        });
    </script>
</body>
</html>
