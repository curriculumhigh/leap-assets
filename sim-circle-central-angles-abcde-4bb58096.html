<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle with Central Angles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 5.5, -5.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 3.8;
        var DEG = Math.PI / 180;

        // Central angles (degrees)
        var angAPB = 47;
        var angBPC = 85;
        var angCPD = 62;
        var angDPE = 93;
        // angEPA = 360 - 47 - 85 - 62 - 93 = 73 (unlabeled)

        // Place points CLOCKWISE starting from A.
        // JSXGraph uses standard math angles (counter-clockwise from +x).
        // Clockwise in visual = decreasing math angle.
        // Start A at 70° (upper right area), then go clockwise (subtract angles).
        var angA = 70;
        var angB = angA - angAPB;           // 70 - 47 = 23
        var angC = angB - angBPC;           // 23 - 85 = -62
        var angD = angC - angCPD;           // -62 - 62 = -124
        var angE = angD - angDPE;           // -124 - 93 = -217

        // Colors
        var COL_APB = '#2563EB';
        var COL_BPC = '#059669';
        var COL_CPD = '#D97706';
        var COL_DPE = '#7C3AED';

        // Center
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2.5, color: '#222222', highlight: false,
            label: { fontSize: 15, color: '#222222', offset: [8, -10], fontWeight: 'bold' }
        });

        // Circle
        var circle = board.create('circle', [P, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // Helper: create a point on the circle at a given angle (degrees, math convention)
        function ptOnCircle(angleDeg, name, labelOffset) {
            var rad = angleDeg * DEG;
            return board.create('point', [R * Math.cos(rad), R * Math.sin(rad)], {
                name: name, fixed: true, size: 2.5, color: '#222222', highlight: false,
                label: { fontSize: 15, color: '#222222', offset: labelOffset, fontWeight: 'bold' }
            });
        }

        // Create points with label offsets pushing outward from circle
        var A = ptOnCircle(angA, 'A', [6, 10]);
        var B = ptOnCircle(angB, 'B', [10, 2]);
        var C = ptOnCircle(angC, 'C', [8, -10]);
        var D = ptOnCircle(angD, 'D', [-18, -8]);
        var E = ptOnCircle(angE, 'E', [-16, 8]);

        // Radii
        var radiiPts = [A, B, C, D, E];
        for (var i = 0; i < radiiPts.length; i++) {
            board.create('segment', [P, radiiPts[i]], {
                strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        // Helper: create an angle arc and label
        function makeAngleArc(pt1cw, pt2cw, vertex, angleDeg, color, labelDist) {
            // pt1cw is the first point clockwise, pt2cw is the second
            // CCW order for JSXGraph: [pt2cw, vertex, pt1cw]
            var arc = board.create('nonReflexAngle', [pt2cw, vertex, pt1cw], {
                radius: 0.75,
                fillColor: color, fillOpacity: 0.10,
                strokeColor: color, strokeWidth: 1.5,
                fixed: true, highlight: false,
                name: '', withLabel: false
            });

            // Label at bisector
            var a1 = Math.atan2(pt1cw.Y() - vertex.Y(), pt1cw.X() - vertex.X());
            var a2 = Math.atan2(pt2cw.Y() - vertex.Y(), pt2cw.X() - vertex.X());
            // We need the bisector of the CW arc from pt1cw to pt2cw
            // That's the same as the bisector of the CCW arc from pt2cw to pt1cw
            var diff = a1 - a2;
            if (diff < 0) diff += 2 * Math.PI;
            var bisector = a2 + diff / 2;

            var lx = vertex.X() + labelDist * Math.cos(bisector);
            var ly = vertex.Y() + labelDist * Math.sin(bisector);

            board.create('text', [lx, ly, angleDeg + '^\\circ'], {
                useKatex: true, fontSize: 13, color: color,
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false,
                cssStyle: 'font-weight:bold'
            });

            return arc;
        }

        // Create the four labeled angle arcs
        makeAngleArc(A, B, P, angAPB, COL_APB, 1.45);
        makeAngleArc(B, C, P, angBPC, COL_BPC, 1.55);
        makeAngleArc(C, D, P, angCPD, COL_CPD, 1.45);
        makeAngleArc(D, E, P, angDPE, COL_DPE, 1.55);

        // The arc EA (73°) is intentionally unlabeled — no arc marker drawn.

    </script>
</body>
</html>
