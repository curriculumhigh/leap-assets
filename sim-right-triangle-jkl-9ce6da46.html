<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle JKL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 9, 11, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var J = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var L = board.create('point', [9.5, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var K = board.create('point', [9.5, 7.4], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle polygon ────────────────────────────────────────────
        board.create('polygon', [J, L, K], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at L ─────────────────────────────────────
        var sq = 0.55;
        var sqP1 = board.create('point', [9.5 - sq, 0], { visible: false, fixed: true, name: '' });
        var sqP2 = board.create('point', [9.5 - sq, sq], { visible: false, fixed: true, name: '' });
        var sqP3 = board.create('point', [9.5, sq], { visible: false, fixed: true, name: '' });
        board.create('segment', [sqP1, sqP2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sqP2, sqP3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        // ── Angle arc at J (38°) ────────────────────────────────────────
        board.create('nonReflexAngle', [L, J, K], {
            radius: 1.0,
            fillColor: '#222222', fillOpacity: 0.08,
            strokeColor: '#222222', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Angle label along bisector
        var angJK = Math.atan2(K.Y() - J.Y(), K.X() - J.X());
        var angJL = Math.atan2(L.Y() - J.Y(), L.X() - J.X());
        var bisector = (angJL + angJK) / 2;
        var labelDist = 1.6;
        var lblX = J.X() + labelDist * Math.cos(bisector);
        var lblY = J.Y() + labelDist * Math.sin(bisector);

        board.create('text', [lblX, lblY, '38\u00B0'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [-0.6, -0.5, 'J'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });
        board.create('text', [10.1, -0.5, 'L'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });
        board.create('text', [10.1, 7.7, 'K'], {
            fontSize: 15, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });

        // ── Side labels ─────────────────────────────────────────────────
        // KL = "12" — right of vertical leg
        board.create('text', [10.3, 3.7, '12'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'left', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight:bold'
        });

        // JL = "x" — below horizontal leg
        board.create('text', [4.75, -0.7, '\\textit{x}'], {
            fontSize: 15, color: '#3B82F6', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false, useKatex: true,
            cssStyle: 'font-weight:bold'
        });
    </script>
</body>
</html>
