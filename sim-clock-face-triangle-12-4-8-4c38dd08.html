<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Face Triangle 12-4-8</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 6.5, 6.5, -6.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var R = 4.5;
        var R_NUM = 5.4;

        var center = board.create('point', [0, 0], {
            name: '', fixed: true, size: 1.5, color: '#999999',
            highlight: false, showInfobox: false
        });

        board.create('circle', [center, R], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true,
            highlight: false, fillColor: 'none'
        });

        function hourAngle(h) {
            return (90 - h * 30) * Math.PI / 180;
        }

        var hourPoints = [];
        var triangleHours = [12, 4, 8];

        for (var h = 1; h <= 12; h++) {
            var ang = hourAngle(h);
            var x = R * Math.cos(ang);
            var y = R * Math.sin(ang);

            var isVertex = triangleHours.indexOf(h) !== -1;

            var pt = board.create('point', [x, y], {
                name: '',
                fixed: true,
                size: isVertex ? 4 : 2,
                color: '#222222',
                highlight: false,
                showInfobox: false
            });

            hourPoints[h] = pt;

            var nx = R_NUM * Math.cos(ang);
            var ny = R_NUM * Math.sin(ang);

            board.create('text', [nx, ny, String(h)], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 12,
                color: '#222222',
                fixed: true,
                highlight: false,
                cssStyle: 'font-weight:600'
            });
        }

        board.create('polygon', [hourPoints[12], hourPoints[4], hourPoints[8]], {
            fillColor: 'none',
            fillOpacity: 0,
            borders: {
                strokeColor: '#222222',
                strokeWidth: 1.8,
                fixed: true,
                highlight: false
            },
            vertices: { visible: false },
            fixed: true,
            highlight: false,
            hasInnerPoints: false
        });
    </script>
</body>
</html>
