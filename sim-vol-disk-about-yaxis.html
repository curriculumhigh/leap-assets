<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>volume-disk-method-about-y-axis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 460px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
      // Build the board only after all scripts (including KaTeX) have loaded,
      // so useKatex:true labels render as math, not raw text.
      window.addEventListener('load', function () {
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.6, 4.8, 2.8, -0.6],
            axis: true,
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 },
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: { strokeColor: '#444444', label: { fontSize: 11 }, minorTicks: 0, ticksDistance: 1 }
                }
            }
        });

        // Palette
        var COL_CURVE = '#222222';   // line y = 2x boundary (primary)
        var COL_REF   = '#888888';   // reference line y = 4 (light)
        var COL_AXIS  = '#2563EB';   // y-axis = axis of revolution (emphasized)
        var COL_RAD   = '#DC2626';   // representative radius segment (attention reference)

        var YTOP = 4;                // top boundary line y = 4
        var XRIGHT = 2;              // line y = 2x meets y = 4 at (2, 4)

        // --- Shaded region: triangle (0,0), (0,4), (2,4) ---
        board.create('polygon', [[0, 0], [0, YTOP], [XRIGHT, YTOP]], {
            borders: { strokeColor: 'none', strokeWidth: 0 },
            fillColor: '#888888', fillOpacity: 0.15,
            vertices: { visible: false }, fixed: true, highlight: false, withLines: false
        });

        // --- Boundary lines ---
        // Primary line y = 2x from (0,0) to (2,4)
        board.create('segment', [[0, 0], [XRIGHT, YTOP]], {
            strokeColor: COL_CURVE, strokeWidth: 1.8, fixed: true, highlight: false
        });
        // Reference line y = 4 (light), extend slightly past region
        board.create('segment', [[-0.4, YTOP], [2.6, YTOP]], {
            strokeColor: COL_REF, strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // --- Axis of revolution: the y-axis (x = 0), emphasized blue/thicker ---
        board.create('segment', [[0, -0.4], [0, 4.6]], {
            strokeColor: COL_AXIS, strokeWidth: 2.6, fixed: true, highlight: false, layer: 6
        });

        // Corner points of the region
        board.create('point', [0, 0],      { name: '', size: 2, color: COL_CURVE, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [XRIGHT, YTOP], { name: '', size: 2, color: COL_CURVE, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [0, YTOP],   { name: '', size: 2, color: COL_CURVE, fixed: true, highlight: false, showInfobox: false });

        // --- Representative HORIZONTAL radius segment at y = 2 ---
        // x = y/2 = 1 on the line y = 2x, so segment runs from (0,2) to (1,2)
        var YS = 2;
        var XEND = YS / 2;  // = 1

        board.create('segment', [[0, YS], [XEND, YS]], {
            strokeColor: COL_RAD, strokeWidth: 2.6, fixed: true, highlight: false, layer: 7
        });
        // endpoint ticks: on the axis (0,2) and on the curve (1,2)
        board.create('point', [0, YS],    { name: '', size: 2.5, color: COL_RAD, fixed: true, highlight: false, showInfobox: false });
        board.create('point', [XEND, YS], { name: '', size: 2.5, color: COL_CURVE, fixed: true, highlight: false, showInfobox: false });

        // --- Labels (KaTeX) ---
        // radius label: just R, above the middle of the horizontal segment
        board.create('text', [XEND / 2, YS + 0.22, 'R'], {
            useKatex: true, fontSize: 14, color: COL_RAD, anchorX: 'middle', anchorY: 'bottom', fixed: true, highlight: false
        });

        // line label y = 2x, to the right of the line in a clear spot
        board.create('text', [1.5, 2.55, 'y=2x'], {
            useKatex: true, fontSize: 13, color: COL_CURVE, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // reference line label y = 4, above the line on the clear right side
        board.create('text', [2.0, YTOP + 0.22, 'y=4'], {
            useKatex: true, fontSize: 13, color: COL_REF, anchorX: 'left', anchorY: 'bottom', fixed: true, highlight: false
        });

        // axis-of-revolution label, along the y-axis (clear upper-left region)
        board.create('text', [-0.5, 4.55, '\\text{axis of revolution}'], {
            useKatex: true, fontSize: 12, color: COL_AXIS, anchorX: 'left', anchorY: 'middle', fixed: true, highlight: false
        });

        // Axis labels near arrow tips
        board.create('text', [2.62, -0.28, 'x'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        board.create('text', [0.18, 4.62, 'y'], { useKatex: true, fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
      });
    </script>
</body>
</html>
