<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Inequality Graph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 6, -4],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { fontSize: 9, offset: [0, -10] }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: 'transparent',
                        strokeWidth: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 9, offset: [-12, 0] }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.5, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.2, 7.1, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Quadratic function: y = -3(x-2)^2 + 5
        function f(x) {
            return -3 * (x - 2) * (x - 2) + 5;
        }

        // Bounding box edges
        var xMin = -2, xMax = 6, yMax = 7.5;
        var step = 0.05;

        // Shade OUTSIDE the parabola (above the curve for a downward-opening parabola)
        var shadePoints = [];

        // Along the curve from left to right
        for (var x = xMin; x <= xMax; x += step) {
            shadePoints.push([x, f(x)]);
        }
        shadePoints.push([xMax, f(xMax)]);

        // Up to top-right corner
        shadePoints.push([xMax, yMax]);

        // Along top edge to top-left corner
        shadePoints.push([xMin, yMax]);

        // Down to where curve starts on left edge
        shadePoints.push([xMin, f(xMin)]);

        board.create('polygon', shadePoints, {
            fillColor: '#222222',
            fillOpacity: 0.12,
            borders: { visible: false },
            vertices: { visible: false },
            fixed: true,
            highlight: false,
            hasInnerPoints: false
        });

        // Parabola curve (solid boundary, on top of shading)
        board.create('functiongraph', [f, xMin, xMax], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
