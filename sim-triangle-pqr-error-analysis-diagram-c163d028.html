<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle PQR — Error Analysis Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 6.5, 9.5, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var P = board.create('point', [4, 5.5], {
            name: 'P', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-2, 12] }
        });

        var Q = board.create('point', [0.5, 0.5], {
            name: 'Q', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -8] }
        });

        var R = board.create('point', [8, 0.5], {
            name: 'R', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, -8] }
        });

        // ── Triangle PQR ────────────────────────────────────────────────
        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Points M and N — visibly NOT at midpoints ───────────────────
        // M at ~1/3 from P toward Q
        var tM = 0.33;
        var Mx = P.X() + tM * (Q.X() - P.X());
        var My = P.Y() + tM * (Q.Y() - P.Y());

        var M = board.create('point', [Mx, My], {
            name: 'M', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-20, 0] }
        });

        // N at ~1/3 from P toward R
        var tN = 0.33;
        var Nx = P.X() + tN * (R.X() - P.X());
        var Ny = P.Y() + tN * (R.Y() - P.Y());

        var N = board.create('point', [Nx, Ny], {
            name: 'N', fixed: true, size: 2, color: '#222222',
            showInfobox: false, highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [10, 2] }
        });

        // ── Segment MN ─────────────────────────────────────────────────
        board.create('segment', [M, N], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Length labels (measurement blue) ────────────────────────────
        // Label "7" on MN — centered above the segment
        var mnMidX = (Mx + Nx) / 2;
        var mnMidY = (My + Ny) / 2;

        board.create('text', [mnMidX, mnMidY + 0.45, '7'], {
            fontSize: 14, color: '#3B82F6', anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold'
        });

        // Label "14" on QR — centered below the segment
        var qrMidX = (Q.X() + R.X()) / 2;
        var qrMidY = (Q.Y() + R.Y()) / 2;

        board.create('text', [qrMidX, qrMidY - 0.5, '14'], {
            fontSize: 14, color: '#3B82F6', anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false, cssStyle: 'font-weight:bold'
        });
    </script>
</body>
</html>
