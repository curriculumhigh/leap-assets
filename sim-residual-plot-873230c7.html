<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residual Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.4, 3.8, 7.5, -2.2],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // Manual axes
        board.create('line', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 },
            straightFirst: true, straightLast: true
        });
        board.create('line', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 },
            straightFirst: true, straightLast: true
        });

        // Grid and ticks
        var bb = board.getBoundingBox();
        var xMin = bb[0], yMax = bb[1], xMax = bb[2], yMin = bb[3];

        for (var tx = 1; tx <= 7; tx++) {
            board.create('segment', [[tx, -0.06], [tx, 0.06]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [tx, -0.25, String(tx)], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
            board.create('segment', [[tx, yMin], [tx, yMax]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        var yTicks = [-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2, 2.5, 3, 3.5];
        for (var i = 0; i < yTicks.length; i++) {
            var ty = yTicks[i];
            board.create('segment', [[-0.08, ty], [0.08, ty]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            var yLabelStr = '';
            if (ty === Math.floor(ty)) {
                yLabelStr = String(Math.round(ty));
            } else {
                yLabelStr = ty.toFixed(1);
            }
            board.create('text', [-0.15, ty, yLabelStr], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
            board.create('segment', [[xMin, ty], [xMax, ty]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // Axis name labels
        board.create('text', [7.1, -0.3, '\\textit{x}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 3.5, '\\textit{r}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Reference line at r = 0
        board.create('line', [[0, 0], [1, 0]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.0,
            fixed: true,
            highlight: false,
            straightFirst: true,
            straightLast: true
        });

        // Residual data
        var data = [
            [1, -0.5],
            [2, -1],
            [3, 2.5],
            [4, 0],
            [5, 1.5],
            [6, 1]
        ];

        var labelPos = [
            [0.2, -0.2, 'left', 'top'],
            [0.2, -0.2, 'left', 'top'],
            [0.2, 0.2, 'left', 'bottom'],
            [0.2, 0.25, 'left', 'bottom'],
            [0.2, 0.2, 'left', 'bottom'],
            [-0.2, 0.2, 'right', 'bottom']
        ];

        var labelStrs = ['-0.5', '-1', '2.5', '0', '1.5', '1'];

        for (var j = 0; j < data.length; j++) {
            var px = data[j][0];
            var py = data[j][1];

            if (py !== 0) {
                board.create('segment', [[px, 0], [px, py]], {
                    strokeColor: '#DC2626',
                    strokeWidth: 1.0,
                    dash: 2,
                    fixed: true,
                    highlight: false
                });
            }

            board.create('point', [px, py], {
                name: '',
                size: 4,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            var lbl = labelPos[j];
            board.create('text', [px + lbl[0], py + lbl[1], '(' + px + ',\\,' + labelStrs[j] + ')'], {
                fontSize: 12,
                color: '#222222',
                fixed: true,
                highlight: false,
                useKatex: true,
                anchorX: lbl[2],
                anchorY: lbl[3]
            });
        }
    </script>
</body>
</html>
