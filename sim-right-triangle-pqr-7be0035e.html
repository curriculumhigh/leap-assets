<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle PQR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 10, 27, -3],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var Q = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var R = board.create('point', [24, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var P = board.create('point', [0, 7], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle edges (no fill) ────────────────────────────────────
        board.create('polygon', [P, Q, R], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Right-angle marker at Q ─────────────────────────────────────
        var sqSize = 1.2;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });

        board.create('segment', [sq1, sq2], {
            strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [sq2, sq3], {
            strokeColor: '#DC2626', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Vertex labels (bold, KaTeX) ─────────────────────────────────
        board.create('text', [-1.4, 8.0, '\\textbf{P}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [-1.4, -1.2, '\\textbf{Q}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [25.2, -1.2, '\\textbf{R}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // ── Side labels (values only, KaTeX, outside triangle) ──────────
        // 7 — left of the vertical leg, at midpoint (0, 3.5)
        board.create('text', [-1.5, 3.5, '7'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // 24 — below the horizontal leg, at midpoint (12, 0)
        board.create('text', [12, -1.3, '24'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });

        // 25 — offset outward from hypotenuse midpoint
        board.create('text', [13.2, 4.5, '25'], {
            useKatex: true, fontSize: 13, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle', anchorY: 'middle'
        });
    </script>
</body>
</html>
