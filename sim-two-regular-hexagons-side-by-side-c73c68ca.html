<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Regular Hexagons</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 10, 16, -10],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        function createHexagon(cx, cy, r) {
            var pts = [];
            var startAngle = -30 * Math.PI / 180;
            for (var i = 0; i < 6; i++) {
                var angle = startAngle + i * Math.PI / 3;
                var x = cx + r * Math.cos(angle);
                var y = cy + r * Math.sin(angle);
                pts.push(board.create('point', [x, y], {
                    name: '', fixed: true, size: 2, color: '#222222',
                    showInfobox: false, highlight: false
                }));
            }
            board.create('polygon', pts, {
                fillColor: 'none', fillOpacity: 0,
                borders: { strokeColor: '#555555', strokeWidth: 2 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });
            return pts;
        }

        var leftPts = createHexagon(-5, 0, 8);
        var rightPts = createHexagon(7, 0, 2);

        var lx0 = leftPts[0].X();
        var ly0 = leftPts[0].Y();
        var lx5 = leftPts[5].X();
        var ly5 = leftPts[5].Y();
        var lMidX = (lx0 + lx5) / 2;
        var lMidY = (ly0 + ly5) / 2;
        board.create('text', [lMidX + 1.0, lMidY - 0.8, '8 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        var rx0 = rightPts[0].X();
        var ry0 = rightPts[0].Y();
        var rx5 = rightPts[5].X();
        var ry5 = rightPts[5].Y();
        var rMidX = (rx0 + rx5) / 2;
        var rMidY = (ry0 + ry5) / 2;
        board.create('text', [rMidX + 0.6, rMidY - 0.6, '2 \\text{ cm}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
