<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Intersecting Lines — Angle 4 = 36°</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 3.8, 4.5, -3.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var O = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        var angA = 72 * Math.PI / 180;
        var angB = 108 * Math.PI / 180;
        var LEN = 3.8;

        var A1 = board.create('point', [LEN * Math.cos(angA), LEN * Math.sin(angA)], {
            visible: false, fixed: true, name: ''
        });
        var A2 = board.create('point', [-LEN * Math.cos(angA), -LEN * Math.sin(angA)], {
            visible: false, fixed: true, name: ''
        });

        var B1 = board.create('point', [LEN * Math.cos(angB), LEN * Math.sin(angB)], {
            visible: false, fixed: true, name: ''
        });
        var B2 = board.create('point', [-LEN * Math.cos(angB), -LEN * Math.sin(angB)], {
            visible: false, fixed: true, name: ''
        });

        board.create('segment', [A1, A2], {
            strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [B1, B2], {
            strokeColor: '#555555', strokeWidth: 1.8, fixed: true, highlight: false
        });

        var ARC_R = 0.7;
        var COL_DEFAULT = '#888888';
        var COL_MARKED = '#DC2626';

        board.create('nonReflexAngle', [B2, O, A1], {
            radius: ARC_R, fillColor: COL_DEFAULT, fillOpacity: 0.06,
            strokeColor: COL_DEFAULT, strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [A2, O, B2], {
            radius: ARC_R, fillColor: COL_DEFAULT, fillOpacity: 0.06,
            strokeColor: COL_DEFAULT, strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [B1, O, A2], {
            radius: ARC_R, fillColor: COL_DEFAULT, fillOpacity: 0.06,
            strokeColor: COL_DEFAULT, strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [A1, O, B1], {
            radius: ARC_R, fillColor: COL_MARKED, fillOpacity: 0.10,
            strokeColor: COL_MARKED, strokeWidth: 1.5,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        var LABEL_R = 1.35;
        var LABEL_R_SMALL = 1.1;

        var bis1 = 0 * Math.PI / 180;
        var bis2 = 270 * Math.PI / 180;
        var bis3 = 180 * Math.PI / 180;
        var bis4 = 90 * Math.PI / 180;

        board.create('text', [
            LABEL_R * Math.cos(bis1), LABEL_R * Math.sin(bis1), '1'
        ], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 14,
            color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [
            LABEL_R_SMALL * Math.cos(bis2), LABEL_R_SMALL * Math.sin(bis2), '2'
        ], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 14,
            color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [
            LABEL_R * Math.cos(bis3), LABEL_R * Math.sin(bis3), '3'
        ], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 14,
            color: '#222222', fixed: true, highlight: false
        });

        board.create('text', [
            LABEL_R_SMALL * Math.cos(bis4), LABEL_R_SMALL * Math.sin(bis4), '4'
        ], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 14,
            color: COL_MARKED, fixed: true, highlight: false
        });

        board.create('text', [
            2.05 * Math.cos(bis4), 2.05 * Math.sin(bis4), '36°'
        ], {
            anchorX: 'middle', anchorY: 'middle', fontSize: 12,
            color: COL_MARKED, fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });
    </script>
</body>
</html>
