<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Through Points to Origin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 27, 10.5, -3],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // Manual grid with correct spacing: x every 2, y every 5
        for (var gx = 2; gx <= 10; gx += 2) {
            board.create('line', [[gx, 0], [gx, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true,
                straightFirst: true, straightLast: true, highlight: false
            });
        }
        for (var gy = 5; gy <= 25; gy += 5) {
            board.create('line', [[0, gy], [1, gy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true,
                straightFirst: true, straightLast: true, highlight: false
            });
        }

        // X-axis
        board.create('arrow', [[-1.5, 0], [10.5, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });
        // Y-axis
        board.create('arrow', [[0, -3], [0, 27]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // X-axis ticks and labels (every 2)
        for (var tx = 2; tx <= 10; tx += 2) {
            board.create('segment', [[tx, -0.4], [tx, 0.4]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [tx, -1.4, String(tx)], {
                fontSize: 11, anchorX: 'middle', fixed: true, highlight: false
            });
        }

        // Y-axis ticks and labels (every 5)
        for (var ty = 5; ty <= 25; ty += 5) {
            board.create('segment', [[-0.2, ty], [0.2, ty]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [-0.9, ty, String(ty)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle', fixed: true, highlight: false
            });
        }

        // Origin label "0"
        board.create('text', [0.2, -1, '0'], {
            fontSize: 11, fixed: true, highlight: false
        });

        // Axis labels
        board.create('text', [10.0, -1.4, 'x'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.4, 26.0, 'y'], { useKatex: true, fontSize: 14, fixed: true, highlight: false });

        // Line: y = (5/2)x
        board.create('functiongraph', [
            function(x) { return (5 / 2) * x; }
        ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // Data points and labels
        var pts = [[2, 5], [4, 10], [6, 15], [8, 20]];
        var labelPositions = [
            [2, 4],
            [4, 9],
            [6, 14],
            [8, 19]
        ];

        for (var i = 0; i < pts.length; i++) {
            board.create('point', [pts[i][0], pts[i][1]], {
                name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });
            board.create('text', [
                labelPositions[i][0],
                labelPositions[i][1],
                '(' + pts[i][0] + ',\\,' + pts[i][1] + ')'
            ], {
                useKatex: true, fontSize: 12, color: '#222222', fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
