<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Plot – Arithmetic Sequence</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 1.5, 5.8, -13.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Manual x-axis
        var xAxis = board.create('arrow', [[-1.5, 0], [5.8, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // Manual y-axis
        var yAxis = board.create('arrow', [[0, -13.5], [0, 1.5]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // X-axis ticks and labels (distance = 1)
        var xTickVals = [1, 2, 3, 4, 5];
        for (var i = 0; i < xTickVals.length; i++) {
            var xv = xTickVals[i];
            board.create('segment', [[xv, -0.25], [xv, 0.25]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [xv, -0.8, String(xv)], {
                fontSize: 9, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false, color: '#444444'
            });
        }

        // Y-axis ticks and labels (distance = 1)
        for (var j = -12; j <= -1; j++) {
            board.create('segment', [[-0.15, j], [0.15, j]], {
                strokeColor: '#444444', strokeWidth: 1, fixed: true, highlight: false
            });
            board.create('text', [-0.5, j, String(j)], {
                fontSize: 9, anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false, color: '#444444'
            });
        }

        // Grid lines
        // Vertical grid lines
        for (var gx = 1; gx <= 5; gx++) {
            board.create('segment', [[gx, -13.5], [gx, 1.5]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false, layer: 0
            });
        }
        // Horizontal grid lines
        for (var gy = -13; gy <= 1; gy++) {
            board.create('segment', [[-1.5, gy], [5.8, gy]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false, layer: 0
            });
        }

        // Axis labels
        board.create('text', [5.3, 0.6, 'n'], {
            fontSize: 11, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, 0.9, 'a_n'], {
            fontSize: 11, fixed: true, highlight: false, useKatex: true
        });

        // Discrete points
        var pts = [[1, -2], [2, -5], [3, -8], [4, -11]];
        for (var p = 0; p < pts.length; p++) {
            board.create('point', pts[p], {
                name: '',
                size: 3,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });
        }
    </script>
</body>
</html>
