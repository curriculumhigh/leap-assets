<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histogram — Ages of 50 Volunteers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-14, 17.5, 90, -4.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BAR_FILL = '#2563EB';
        var BAR_STROKE = '#ffffff';
        var AXIS_COL = '#444444';
        var GRID_COL = '#D1D5DB';

        // ── Data ────────────────────────────────────────────────────────
        var binStarts = [0, 10, 20, 30, 40, 50, 60, 70];
        var binWidth = 10;
        var freqs = [0, 2, 3, 4, 6, 11, 14, 10];
        var binLabels = ['0\u20139', '10\u201319', '20\u201329', '30\u201339', '40\u201349', '50\u201359', '60\u201369', '70\u201379'];
        var yTicks = [0, 2, 4, 6, 8, 10, 12, 14, 16];

        // ── Horizontal grid lines at y-tick values ──────────────────────
        for (var g = 1; g < yTicks.length; g++) {
            board.create('segment', [[0, yTicks[g]], [80, yTicks[g]]], {
                strokeColor: GRID_COL, strokeWidth: 0.4, fixed: true, highlight: false, layer: 0
            });
        }

        // ── Bars (skip bin 0 which has freq 0) ─────────────────────────
        for (var i = 0; i < freqs.length; i++) {
            if (freqs[i] === 0) continue;

            var x1 = binStarts[i];
            var x2 = x1 + binWidth;
            var h = freqs[i];

            var p1 = board.create('point', [x1, 0], { visible: false, name: '' });
            var p2 = board.create('point', [x2, 0], { visible: false, name: '' });
            var p3 = board.create('point', [x2, h], { visible: false, name: '' });
            var p4 = board.create('point', [x1, h], { visible: false, name: '' });

            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: BAR_FILL, fillOpacity: 0.9,
                borders: { strokeColor: BAR_STROKE, strokeWidth: 0.5 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false,
                layer: 5
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        board.create('arrow', [[0, 0], [86, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, layer: 7
        });
        board.create('arrow', [[0, 0], [0, 17]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, layer: 7
        });

        // ── x-axis tick marks & interval labels ─────────────────────────
        for (var t = 0; t < binStarts.length; t++) {
            var xMid = binStarts[t] + binWidth / 2;
            board.create('segment', [[binStarts[t], -0.4], [binStarts[t], 0.4]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
            board.create('text', [xMid, -1.3, binLabels[t]], {
                fontSize: 10, anchorX: 'middle', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }
        board.create('segment', [[80, -0.4], [80, 0.4]], {
            strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
        });

        // ── y-axis tick marks & labels ──────────────────────────────────
        for (var y = 0; y < yTicks.length; y++) {
            var yv = yTicks[y];
            board.create('segment', [[-0.6, yv], [0.6, yv]], {
                strokeColor: AXIS_COL, strokeWidth: 1.0, fixed: true, highlight: false, layer: 7
            });
            board.create('text', [-1.5, yv, String(yv)], {
                fontSize: 11, anchorX: 'right', anchorY: 'middle',
                color: '#333333', fixed: true, highlight: false
            });
        }

        // ── Axis title: "Age (years)" centered below x-axis ────────────
        board.create('text', [40, -3.2, '\\textit{Age (years)}'], {
            fontSize: 13, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false, useKatex: true
        });

        // ── Axis title: "Frequency" rotated along y-axis ────────────────
        board.create('text', [-8, 8, '\\textit{Frequency}'], {
            fontSize: 13, anchorX: 'middle', anchorY: 'middle',
            color: '#333333', fixed: true, highlight: false, useKatex: true,
            rotate: 90
        });
    </script>
</body>
</html>
