<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of -sqrt(x+2)+4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
        }
        .container {
            width: 300px;
            height: 200px;
            padding: 0;
            margin: 0;
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 6.5, 20, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 5,
                        label: { fontSize: 9, offset: [0, -10] }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: { fontSize: 9, offset: [-12, 0] }
                    }
                }
            },
            grid: {
                major: {
                    face: 'line',
                    strokeColor: '#D1D5DB',
                    strokeWidth: 0.4
                },
                minor: {
                    size: 0
                }
            }
        });

        /* Axis labels */
        board.create('text', [19, -0.7, '<i>x</i>'], {
            fontSize: 11, fixed: true, highlight: false, anchorX: 'right'
        });
        board.create('text', [0.5, 6, '<i>y</i>'], {
            fontSize: 11, fixed: true, highlight: false
        });

        /* Function: y = -sqrt(x + 2) + 4 */
        board.create('functiongraph', [
            function(x) {
                if (x < -2) return NaN;
                return -Math.sqrt(x + 2) + 4;
            },
            -2, 20
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        /* Starting point (-2, 4) */
        board.create('point', [-2, 4], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
