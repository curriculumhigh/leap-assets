<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Circles — Interior, Not Tangent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 4.2, 5.5, -4.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        /* Larger circle — center Q */
        var Q = board.create('point', [0, 0], {
            name: 'Q', fixed: true, size: 2.5, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10] }
        });

        board.create('circle', [Q, 3.5], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });

        /* Smaller circle — center P, offset inside the larger circle, not tangent */
        var P = board.create('point', [-0.8, 0.6], {
            name: 'P', fixed: true, size: 2.5, color: '#222222',
            highlight: false, showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [8, -10] }
        });

        board.create('circle', [P, 1.3], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fillColor: 'none', fillOpacity: 0,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
