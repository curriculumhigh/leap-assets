<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isosceles Triangle JKL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 7.5, 8, -1.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Triangle vertices: K at top (apex), J bottom-left, L bottom-right
        var J = board.create('point', [1, 0.5], { name: '', fixed: true, visible: false });
        var L = board.create('point', [6, 0.5], { name: '', fixed: true, visible: false });
        var K = board.create('point', [3.5, 5.5], { name: '', fixed: true, visible: false });

        // Polygon — no fill, dark gray outline
        var tri = board.create('polygon', [J, K, L], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // Vertex labels
        board.create('text', [0.5, 0.2, 'J'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [3.5, 6.2, 'K'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });
        board.create('text', [6.5, 0.2, 'L'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle'
        });

        // Side labels (measurements) — blue #3B82F6
        // JK side (left side) — label placed to the left of midpoint
        var midJK_x = (1 + 3.5) / 2 - 0.7;
        var midJK_y = (0.5 + 5.5) / 2 + 0.2;
        board.create('text', [midJK_x, midJK_y, '6y - 1'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });

        // KL side (right side) — label placed to the right of midpoint
        var midKL_x = (3.5 + 6) / 2 + 0.7;
        var midKL_y = (5.5 + 0.5) / 2 + 0.2;
        board.create('text', [midKL_x, midKL_y, '35'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });

        // JL side (base) — label below midpoint
        var midJL_x = (1 + 6) / 2;
        var midJL_y = 0.5 - 0.5;
        board.create('text', [midJL_x, midJL_y, '17'], {
            fontSize: 13, color: '#3B82F6', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });

        // Tick marks on JK and KL (congruence marks) — red #DC2626
        // Tick on JK (midpoint of JK, perpendicular to JK)
        var mJK_x = (1 + 3.5) / 2;
        var mJK_y = (0.5 + 5.5) / 2;
        var dxJK = 3.5 - 1;
        var dyJK = 5.5 - 0.5;
        var lenJK = Math.sqrt(dxJK * dxJK + dyJK * dyJK);
        var pxJK = -dyJK / lenJK;
        var pyJK = dxJK / lenJK;
        var tickLen = 0.25;

        board.create('segment', [
            [mJK_x + pxJK * tickLen, mJK_y + pyJK * tickLen],
            [mJK_x - pxJK * tickLen, mJK_y - pyJK * tickLen]
        ], { strokeColor: '#DC2626', strokeWidth: 2, fixed: true, highlight: false });

        // Tick on KL (midpoint of KL, perpendicular to KL)
        var mKL_x = (3.5 + 6) / 2;
        var mKL_y = (5.5 + 0.5) / 2;
        var dxKL = 6 - 3.5;
        var dyKL = 0.5 - 5.5;
        var lenKL = Math.sqrt(dxKL * dxKL + dyKL * dyKL);
        var pxKL = -dyKL / lenKL;
        var pyKL = dxKL / lenKL;

        board.create('segment', [
            [mKL_x + pxKL * tickLen, mKL_y + pyKL * tickLen],
            [mKL_x - pxKL * tickLen, mKL_y - pyKL * tickLen]
        ], { strokeColor: '#DC2626', strokeWidth: 2, fixed: true, highlight: false });

        // Angle arcs — red #DC2626
        // Angle at L (∠JLK = 55°)
        board.create('nonReflexAngle', [J, L, K], {
            radius: 0.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Angle label at L
        var aLJ = Math.atan2(0.5 - 0.5, 1 - 6);
        var aLK = Math.atan2(5.5 - 0.5, 3.5 - 6);
        var bisL = (aLJ + aLK) / 2;
        var labelDistL = 1.1;
        board.create('text', [
            6 + labelDistL * Math.cos(bisL),
            0.5 + labelDistL * Math.sin(bisL),
            '55^\\circ'
        ], {
            fontSize: 12, color: '#DC2626', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });

        // Angle at K (∠JKL = x°)
        board.create('nonReflexAngle', [J, K, L], {
            radius: 0.6,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.2,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Angle label at K
        var aKJ = Math.atan2(0.5 - 5.5, 1 - 3.5);
        var aKL = Math.atan2(0.5 - 5.5, 6 - 3.5);
        var bisK = (aKJ + aKL) / 2;
        var labelDistK = 1.1;
        board.create('text', [
            3.5 + labelDistK * Math.cos(bisK),
            5.5 + labelDistK * Math.sin(bisK),
            'x^\\circ'
        ], {
            fontSize: 12, color: '#DC2626', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle', useKatex: true
        });
    </script>
</body>
</html>
