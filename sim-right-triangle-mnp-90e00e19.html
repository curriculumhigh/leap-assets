<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle MNP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 9, 7, -2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices ────────────────────────────────────────────────────
        var P = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var N = board.create('point', [4, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var M = board.create('point', [4, 7], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle edges (no fill) ────────────────────────────────────
        board.create('polygon', [P, N, M], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // ── Right angle mark at N ───────────────────────────────────────
        var sqSize = 0.55;
        board.create('polygon', [
            [N.X(), N.Y()],
            [N.X(), N.Y() + sqSize],
            [N.X() - sqSize, N.Y() + sqSize],
            [N.X() - sqSize, N.Y()]
        ], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.2 },
            vertices: { visible: false },
            fixed: true, highlight: false
        });

        // ── Vertex labels (bold, black, KaTeX) ─────────────────────────
        board.create('text', [4.35, 7.4, '\\mathbf{M}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [4.35, -0.55, '\\mathbf{N}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [-0.85, -0.55, '\\mathbf{P}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            fixed: true, highlight: false
        });

        // ── Side labels (measurement blue, KaTeX) ──────────────────────
        board.create('text', [4.55, 3.5, '7'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            fixed: true, highlight: false
        });

        board.create('text', [1.8, -0.7, '4'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
