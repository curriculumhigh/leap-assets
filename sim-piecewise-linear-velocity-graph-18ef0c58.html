<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piecewise-linear velocity graph v(t)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, 7, 13.8, -11],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        drawZero: false
                    }
                }
            },
            grid: false
        });

        // Manual grid lines at every unit
        var xMin = -1, xMax = 13, yMin = -10, yMax = 6;
        var i;

        // Vertical grid lines
        for (i = xMin; i <= xMax; i++) {
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.8,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // Horizontal grid lines
        for (i = yMin; i <= yMax; i++) {
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.8,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [12, -1, 't\\text{ seconds}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [0.3, 6.5, 'v\\text{ (m/s)}'], {
            fontSize: 14, fixed: true, highlight: false, useKatex: true
        });

        // Vertices
        var V0 = [0, 4];
        var V1 = [6, -8];
        var V2 = [9, 4];
        var V3 = [12, 0];

        // Line segments — primary curve
        board.create('segment', [V0, V1], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [V1, V2], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [V2, V3], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points — size 3
        board.create('point', V0, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', V1, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', V2, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        board.create('point', V3, {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Coordinate labels — KaTeX, offset to avoid overlap
        board.create('text', [0.4, 4.7, '(0,\\,4)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [6.4, -8.8, '(6,\\,-8)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [9.4, 4.7, '(9,\\,4)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [10.2, 0.7, '(12,\\,0)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // Curve label — name only, upper-right area
        board.create('text', [11.0, 5.5, 'v(t)'], {
            fontSize: 13, color: '#222222', fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
