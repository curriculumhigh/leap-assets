<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan A vs Plan B Cost Comparison</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 88, 14, -8],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // x and y axis-name labels at arrow tips
        board.create('text', [13.5, -3, '<i>x</i>'], {
            fontSize: 14, fixed: true, highlight: false, color: '#222222'
        });
        board.create('text', [0.4, 85.5, '<i>y</i>'], {
            fontSize: 14, fixed: true, highlight: false, color: '#222222'
        });

        // Descriptive axis labels
        board.create('text', [5.5, -5.5, '<i>Number of classes</i>'], {
            fontSize: 11, fixed: true, highlight: false, color: '#555555',
            anchorX: 'middle'
        });
        board.create('text', [-1.3, 45, '<i>Cost (dollars)</i>'], {
            fontSize: 11, fixed: true, highlight: false, color: '#555555',
            anchorX: 'middle',
            display: 'html',
            cssStyle: 'transform: rotate(-90deg); transform-origin: center center; white-space: nowrap;'
        });

        // Plan A: y = 3x + 12 (primary, black)
        board.create('functiongraph', [
            function(x) { return 3 * x + 12; }, 0, 12
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Plan B: y = 6x (secondary, blue)
        board.create('functiongraph', [
            function(x) { return 6 * x; }, 0, 12
        ], {
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });

        // Label "A" near Plan A line at x=10 (y=42)
        board.create('text', [10.3, 37, 'A'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            fixed: true,
            highlight: false
        });

        // Label "B" near Plan B line at x=10 (y=60)
        board.create('text', [10.3, 55, 'B'], {
            useKatex: true,
            fontSize: 14,
            color: '#2563EB',
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
