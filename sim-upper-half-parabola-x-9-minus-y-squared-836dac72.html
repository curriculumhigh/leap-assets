<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upper half of x = 9 - y²</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 5.5, 12.5, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 8 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false,
                        includeBoundaryTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 9 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [11.8, -0.55, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.3, 5.1, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // Upper half of x = 9 - y^2, y >= 0
        var curve = board.create('curve', [
            function(t) { return 9 - t * t; },
            function(t) { return t; },
            0,
            5.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Vertex point at (9, 0)
        board.create('point', [9, 0], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false
        });

        // Point at (0, 3) — no label
        board.create('point', [0, 3], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false
        });

        // Orientation arrow along the curve
        var arrowY1 = 2.4;
        var arrowY2 = 1.8;
        var arrowX1 = 9 - arrowY1 * arrowY1;
        var arrowX2 = 9 - arrowY2 * arrowY2;

        board.create('arrow', [[arrowX1, arrowY1], [arrowX2, arrowY2]], {
            strokeColor: '#222222',
            strokeWidth: 1.6,
            lastArrow: { type: 2, size: 5 },
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
