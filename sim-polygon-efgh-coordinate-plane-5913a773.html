<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon EFGH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5.5, 5.5, 3.5, -3.5],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [3.1, -0.4, '\\textit{x}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 5.1, '\\textit{y}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Vertices
        var E = board.create('point', [-3, -1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var F = board.create('point', [-3, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var G = board.create('point', [1, 3], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var H = board.create('point', [1, -1], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Polygon (no fill)
        board.create('polygon', [E, F, G, H], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels — KaTeX, positioned per spec
        // E(-3,-1) → lower-left
        board.create('text', [-3.3, -1.55, 'E(-3,\\,-1)'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'top'
        });

        // F(-3,3) → upper-left
        board.create('text', [-3.3, 3.45, 'F(-3,\\,3)'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'right', anchorY: 'bottom'
        });

        // G(1,3) → upper-right
        board.create('text', [1.3, 3.45, 'G(1,\\,3)'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'bottom'
        });

        // H(1,-1) → lower-right
        board.create('text', [1.3, -1.55, 'H(1,\\,-1)'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'top'
        });
    </script>
</body>
</html>
