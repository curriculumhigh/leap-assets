<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barn Cross-Section</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-16, 18, 16, -10],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var baseY = 6;
        var peakY = baseY + 9;
        var halfBase = 12;
        var barnBottom = -4;

        var barnBL = board.create('point', [-halfBase, barnBottom], { visible: false, name: '' });
        var barnBR = board.create('point', [halfBase, barnBottom], { visible: false, name: '' });
        var barnTR = board.create('point', [halfBase, baseY], { visible: false, name: '' });
        var barnTL = board.create('point', [-halfBase, baseY], { visible: false, name: '' });

        board.create('polygon', [barnBL, barnBR, barnTR, barnTL], {
            fillColor: '#f3f4f6', fillOpacity: 0.6,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        var roofLeft = board.create('point', [-halfBase, baseY], { visible: false, name: '' });
        var roofRight = board.create('point', [halfBase, baseY], { visible: false, name: '' });
        var roofPeak = board.create('point', [0, peakY], { visible: false, name: '' });

        board.create('polygon', [roofLeft, roofPeak, roofRight], {
            fillColor: '#e5e7eb', fillOpacity: 0.5,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true
        });

        var baseMid = board.create('point', [0, baseY], { visible: false, name: '' });

        board.create('segment', [roofPeak, baseMid], {
            strokeColor: '#555555', strokeWidth: 1.5, dash: 2, fixed: true, highlight: false
        });

        var sqSize = 0.9;
        var sq1 = board.create('point', [sqSize, baseY], { visible: false, name: '' });
        var sq2 = board.create('point', [sqSize, baseY + sqSize], { visible: false, name: '' });
        var sq3 = board.create('point', [0, baseY + sqSize], { visible: false, name: '' });

        board.create('segment', [sq1, sq2], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });
        board.create('segment', [sq2, sq3], { strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false });

        board.create('text', [-2.2, baseY + 4.5, '9 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('segment', [[0, baseY - 1.2], [halfBase, baseY - 1.2]], {
            strokeColor: '#3B82F6', strokeWidth: 1.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, firstArrow: { type: 2, size: 5 }
        });

        board.create('text', [6, baseY - 2.5, '12 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#3B82F6',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [8.2, peakY - 3.5, 's'], {
            useKatex: true, fontSize: 16, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-style: italic;',
            fixed: true, highlight: false
        });

        board.create('text', [0, barnBottom - 1.5, '\\text{depth} = 50 \\text{ ft}'], {
            useKatex: true, fontSize: 12, color: '#888888',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('segment', [[0, baseY - 0.6], [0, baseY - 1.8]], {
            strokeColor: '#3B82F6', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[halfBase, baseY - 0.6], [halfBase, baseY - 1.8]], {
            strokeColor: '#3B82F6', strokeWidth: 1.0, fixed: true, highlight: false
        });

    </script>
</body>
</html>
