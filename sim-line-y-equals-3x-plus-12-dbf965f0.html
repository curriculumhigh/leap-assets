<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of y = 3x + 12</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 32, 7, -2],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [6.6, -1.2, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.2, 31, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Primary line: y = 3x + 12
        board.create('functiongraph', [function(x) { return 3 * x + 12; }, -1, 7], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points on the line (black, size 2)
        var pts = [[0, 12], [1, 15], [2, 18], [3, 21], [5, 27]];
        var offsets = [[0.2, -1.0], [0.2, -1.0], [0.2, -1.0], [0.2, -1.0], [0.2, -1.0]];

        for (var i = 0; i < pts.length; i++) {
            board.create('point', pts[i], {
                name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
            });
            board.create('text', [pts[i][0] + offsets[i][0], pts[i][1] + offsets[i][1],
                '(' + pts[i][0] + ',\\,' + pts[i][1] + ')'], {
                fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
            });
        }

        // Function label
        board.create('text', [3, 27, 'y = 3x + 12'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
    </script>
</body>
</html>
