<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>y=(x+3)/(x-1) Right-to-Left Orientation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 4px; height: calc(100% - 8px); }
        .board-wrapper { background: white; border-radius: 6px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 8, 9, -6],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Create axes manually for full tick control
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                drawZero: false
            },
            highlight: false
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 4 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 9 },
                minorTicks: 0,
                ticksDistance: 1,
                insertTicks: false,
                drawZero: false
            },
            highlight: false
        });

        // Axis labels
        board.create('text', [8.5, -0.5, '<i>x</i>'], { fontSize: 10, fixed: true, highlight: false });
        board.create('text', [0.25, 7.5, '<i>y</i>'], { fontSize: 10, fixed: true, highlight: false });

        // f(x) = (x+3)/(x-1)
        function f(x) {
            return (x + 3) / (x - 1);
        }

        // Vertical asymptote x = 1 (dashed cyan)
        board.create('line', [[1, 0], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, straightFirst: true, straightLast: true
        });

        // Horizontal asymptote y = 1 (dashed cyan)
        board.create('line', [[0, 1], [1, 1]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, straightFirst: true, straightLast: true
        });

        // Left branch: x < 1
        board.create('functiongraph', [
            function(x) { return f(x); },
            -7, 0.92
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Right branch: x > 1
        board.create('functiongraph', [
            function(x) { return f(x); },
            1.08, 9
        ], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false
        });

        // Key points (unlabeled)
        // Left branch: x-intercept (-3, 0), y-intercept (0, -3), and (-1, -1)
        board.create('point', [-3, f(-3)], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [0, f(0)], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [-1, f(-1)], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });

        // Right branch: (3, 3), (5, 2)
        board.create('point', [3, f(3)], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });
        board.create('point', [5, f(5)], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false
        });

        // Orientation arrows (right-to-left) — small arrow segments mid-curve
        // Left branch: arrow pointing left around x = -2
        var aL1x = -2;
        var aL2x = -2.6;
        board.create('arrow', [
            [aL1x, f(aL1x)],
            [aL2x, f(aL2x)]
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });

        // Right branch: arrow pointing left around x = 4
        var aR1x = 4.4;
        var aR2x = 3.6;
        board.create('arrow', [
            [aR1x, f(aR1x)],
            [aR2x, f(aR2x)]
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            lastArrow: { type: 2, size: 5 },
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
