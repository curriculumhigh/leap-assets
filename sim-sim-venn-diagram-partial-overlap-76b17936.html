<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diagram — A and B Partially Overlapping</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 4, 5, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Universal set rectangle
        var rectP1 = board.create('point', [-4.2, 3.2], { visible: false, fixed: true, name: '' });
        var rectP2 = board.create('point', [4.2, 3.2], { visible: false, fixed: true, name: '' });
        var rectP3 = board.create('point', [4.2, -3.2], { visible: false, fixed: true, name: '' });
        var rectP4 = board.create('point', [-4.2, -3.2], { visible: false, fixed: true, name: '' });

        board.create('polygon', [rectP1, rectP2, rectP3, rectP4], {
            fillColor: '#f9fafb', fillOpacity: 0.5,
            borders: { strokeColor: '#555555', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // "S" label — top-left inside rectangle
        board.create('text', [-3.7, 2.7, 'S'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });

        // Circle A — centered left
        var centerA = board.create('point', [-1.0, 0], { visible: false, fixed: true, name: '' });
        board.create('circle', [centerA, 2.2], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fillColor: '#2563EB', fillOpacity: 0.12,
            fixed: true, highlight: false
        });

        // Circle B — centered right, overlapping with A
        var centerB = board.create('point', [1.0, 0], { visible: false, fixed: true, name: '' });
        board.create('circle', [centerB, 2.2], {
            strokeColor: '#555555', strokeWidth: 2.0,
            fillColor: '#059669', fillOpacity: 0.12,
            fixed: true, highlight: false
        });

        // Label "A" — inside circle A, left of center, well clear of the outline
        board.create('text', [-1.9, 0.1, 'A'], {
            fontSize: 16, color: '#2563EB', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight:bold; font-style:italic;'
        });

        // Label "B" — inside circle B, right of center, well clear of the outline
        board.create('text', [1.9, 0.1, 'B'], {
            fontSize: 16, color: '#059669', fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'middle',
            cssStyle: 'font-weight:bold; font-style:italic;'
        });
    </script>
</body>
</html>
