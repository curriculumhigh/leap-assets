<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle FED</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var FE = 6;
        var ED = 6 * Math.tan(53 * Math.PI / 180);

        var Fx = 1, Fy = 1;
        var Ex = Fx + FE, Ey = Fy;
        var Dx = Ex, Dy = Ey + ED;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.2, Dy + 2, Ex + 2.5, -1.2],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var F = board.create('point', [Fx, Fy], {
            name: 'F', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-18, -10] }
        });
        var E = board.create('point', [Ex, Ey], {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, -10] }
        });
        var D = board.create('point', [Dx, Dy], {
            name: 'D', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [8, 6] }
        });

        board.create('polygon', [F, E, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        var sqSize = 0.55;
        var raPt1 = board.create('point', [Ex - sqSize, Ey], { visible: false, fixed: true, name: '' });
        var raPt2 = board.create('point', [Ex - sqSize, Ey + sqSize], { visible: false, fixed: true, name: '' });
        var raPt3 = board.create('point', [Ex, Ey + sqSize], { visible: false, fixed: true, name: '' });
        board.create('segment', [raPt1, raPt2], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [raPt2, raPt3], {
            strokeColor: '#DC2626', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('nonReflexAngle', [E, F, D], {
            radius: 1.0,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        var angleRad = 53 * Math.PI / 180;
        var bisectorAngle = angleRad / 2;
        var labelR = 1.45;
        board.create('text', [
            Fx + labelR * Math.cos(bisectorAngle),
            Fy + labelR * Math.sin(bisectorAngle),
            '53^\\circ'
        ], {
            useKatex: true, fontSize: 13, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [
            (Fx + Ex) / 2,
            Fy - 0.7,
            '18'
        ], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [
            Ex + 0.7,
            (Ey + Dy) / 2,
            'x'
        ], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
