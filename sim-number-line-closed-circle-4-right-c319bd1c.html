<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x ≥ 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-11.8, 1.8, 11.8, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Number line (horizontal axis) ───────────────────────────────
        board.create('arrow', [[-11.3, 0], [11.3, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var i;
        for (i = -10; i <= 10; i++) {
            // Tick mark
            board.create('segment', [[i, -0.18], [i, 0.18]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            // Label every integer
            board.create('text', [i, -0.55, String(i)], {
                fontSize: 11,
                anchorX: 'middle',
                anchorY: 'middle',
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // ── Shaded ray from 4 to the right ─────────────────────────────
        board.create('arrow', [[4, 0], [11.3, 0]], {
            strokeColor: '#DC2626',
            strokeWidth: 3.5,
            lastArrow: { type: 2, size: 7 },
            fixed: true,
            highlight: false
        });

        // ── Closed circle at x = 4 ─────────────────────────────────────
        board.create('point', [4, 0], {
            name: '',
            size: 5,
            fillColor: '#DC2626',
            strokeColor: '#DC2626',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
