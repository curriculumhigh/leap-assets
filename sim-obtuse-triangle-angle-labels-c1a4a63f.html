<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtuse Triangle with Angle Labels</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.5, 9.5, 13.5, -0.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var BLUE = '#2563EB';

        // Triangle vertices — wide, flat, obtuse-looking
        var A = board.create('point', [1.5, 7], { visible: false, fixed: true, name: '' });
        var B = board.create('point', [11.5, 7.5], { visible: false, fixed: true, name: '' });
        var C = board.create('point', [7, 1.2], { visible: false, fixed: true, name: '' });

        // Triangle polygon — light green fill
        var tri = board.create('polygon', [A, B, C], {
            fillColor: '#BBF7D0',
            fillOpacity: 0.45,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // Angle arcs
        board.create('nonReflexAngle', [C, A, B], {
            radius: 0.7,
            fillColor: BLUE, fillOpacity: 0.08,
            strokeColor: BLUE, strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [A, B, C], {
            radius: 0.7,
            fillColor: BLUE, fillOpacity: 0.08,
            strokeColor: BLUE, strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        board.create('nonReflexAngle', [B, C, A], {
            radius: 0.9,
            fillColor: BLUE, fillOpacity: 0.08,
            strokeColor: BLUE, strokeWidth: 1.0,
            fixed: true, name: '', withLabel: false, highlight: false
        });

        // Bisector position helper
        function bisectorPos(vertex, p1, p2, dist) {
            var vx = vertex.X(), vy = vertex.Y();
            var a1 = Math.atan2(p1.Y() - vy, p1.X() - vx);
            var a2 = Math.atan2(p2.Y() - vy, p2.X() - vx);
            var mid1 = (a1 + a2) / 2;
            var mid2 = mid1 + Math.PI;
            var cx = (A.X() + B.X() + C.X()) / 3;
            var cy = (A.Y() + B.Y() + C.Y()) / 3;
            var toC = Math.atan2(cy - vy, cx - vx);
            var d1 = Math.abs(mid1 - toC);
            if (d1 > Math.PI) d1 = 2 * Math.PI - d1;
            var d2 = Math.abs(mid2 - toC);
            if (d2 > Math.PI) d2 = 2 * Math.PI - d2;
            var mid = (d1 < d2) ? mid1 : mid2;
            return [vx + dist * Math.cos(mid), vy + dist * Math.sin(mid)];
        }

        var posA = bisectorPos(A, B, C, 1.6);
        var posB = bisectorPos(B, A, C, 1.6);
        var posC = bisectorPos(C, A, B, 1.7);

        // Top-left label: (y - 18)° — shifted right by 0.7
        board.create('text', [posA[0] + 0.7, posA[1], '(y - 18)^\\circ'], {
            useKatex: true,
            fontSize: 13,
            color: BLUE,
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Top-right label: y°
        board.create('text', [posB[0], posB[1], 'y^\\circ'], {
            useKatex: true,
            fontSize: 13,
            color: BLUE,
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });

        // Bottom label: x°
        board.create('text', [posC[0], posC[1], 'x^\\circ'], {
            useKatex: true,
            fontSize: 13,
            color: BLUE,
            fixed: true,
            highlight: false,
            anchorX: 'middle',
            anchorY: 'middle'
        });
    </script>
</body>
</html>
