<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diagram — Ice Cream and Cake (Disjoint)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 7.5, 13, -1.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Universal set rectangle
        var rectP1 = board.create('point', [0, 0], { visible: false, fixed: true, name: '' });
        var rectP2 = board.create('point', [12, 0], { visible: false, fixed: true, name: '' });
        var rectP3 = board.create('point', [12, 7], { visible: false, fixed: true, name: '' });
        var rectP4 = board.create('point', [0, 7], { visible: false, fixed: true, name: '' });

        board.create('polygon', [rectP1, rectP2, rectP3, rectP4], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Left circle — Ice Cream (disjoint, positioned left of center)
        var centerLeft = board.create('point', [3.8, 3.3], { visible: false, fixed: true, name: '' });
        board.create('circle', [centerLeft, 2.2], {
            strokeColor: '#2563EB', strokeWidth: 1.5,
            fillColor: '#2563EB', fillOpacity: 0.15,
            fixed: true, highlight: false
        });

        // Right circle — Cake (disjoint, positioned right of center)
        var centerRight = board.create('point', [8.2, 3.3], { visible: false, fixed: true, name: '' });
        board.create('circle', [centerRight, 2.2], {
            strokeColor: '#059669', strokeWidth: 1.5,
            fillColor: '#059669', fillOpacity: 0.15,
            fixed: true, highlight: false
        });

        // Set name labels (above circles)
        board.create('text', [3.8, 5.9, 'Ice Cream'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#2563EB', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        board.create('text', [8.2, 5.9, 'Cake'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#059669', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        // Region value labels (inside circles)
        board.create('text', [3.8, 3.3, '500'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:700'
        });

        board.create('text', [8.2, 3.3, '400'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 16, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:700'
        });

        // Outside region label (inside rectangle but outside both circles)
        board.create('text', [10.8, 0.7, '100'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: '#222222', fixed: true, highlight: false,
            cssStyle: 'font-weight:600'
        });

        // Total label (top-right corner)
        board.create('text', [11.7, 6.6, 'Total = 1000'], {
            anchorX: 'right', anchorY: 'middle',
            fontSize: 11, color: '#555555', fixed: true, highlight: false
        });
    </script>
</body>
</html>
