<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Coordinate Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-15, 55, 90, -30],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            grid: false
        });

        // --- Manual x-axis ---
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 5,
                insertTicks: false,
                drawZero: false
            }
        });

        // --- Manual y-axis ---
        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                label: { fontSize: 11 },
                minorTicks: 0,
                ticksDistance: 10,
                insertTicks: false,
                drawZero: false
            }
        });

        // --- Grid (manual, matching tick intervals) ---
        // Vertical grid lines every 5 units
        var i;
        for (i = -10; i <= 85; i += 5) {
            if (i === 0) continue;
            board.create('line', [[i, 0], [i, 1]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }
        // Horizontal grid lines every 10 units
        for (i = -20; i <= 50; i += 10) {
            if (i === 0) continue;
            board.create('line', [[0, i], [1, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                straightFirst: true, straightLast: true,
                fixed: true, highlight: false, dash: 0
            });
        }

        // Axis labels
        board.create('text', [85, -2.5, '\\textit{x}\\text{ (yards)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });
        board.create('text', [2, 53, '\\textit{y}\\text{ (yards)}'], {
            fontSize: 13, fixed: true, highlight: false, useKatex: true
        });

        // --- Trailhead at (5, 40) ---
        board.create('point', [5, 40], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [7.5, 42.5, '\\text{Trailhead}\\,(5,\\,40)'], {
            fontSize: 12, color: '#222222', fixed: true, highlight: false, useKatex: true
        });

        // --- Landmark 1 at (15, -20) ---
        board.create('point', [15, -20], {
            name: '', size: 5, color: '#2563EB', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [17.5, -17.5, '\\text{Landmark 1}\\,(15,\\,-20)'], {
            fontSize: 12, color: '#2563EB', fixed: true, highlight: false, useKatex: true
        });

        // --- Landmark 2 at (75, -10) ---
        board.create('point', [75, -10], {
            name: '', size: 5, color: '#059669', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [57, -13.5, '\\text{Landmark 2}\\,(75,\\,-10)'], {
            fontSize: 12, color: '#059669', fixed: true, highlight: false, useKatex: true
        });
    </script>
</body>
</html>
