<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle JKL with Midsegment AB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 350px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-8, 8, 6, -4],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.5, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.3, 7.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Vertices ────────────────────────────────────────────────────
        var J = board.create('point', [-6, 2], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var K = board.create('point', [0, 6], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });
        var L = board.create('point', [4, -2], {
            name: '', fixed: true, size: 3, color: '#222222',
            highlight: false, showInfobox: false
        });

        // ── Triangle sides ──────────────────────────────────────────────
        board.create('segment', [J, K], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [K, L], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });
        board.create('segment', [L, J], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Midpoints ───────────────────────────────────────────────────
        var A = board.create('midpoint', [J, K], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });
        var B = board.create('midpoint', [K, L], {
            name: '', fixed: true, size: 2, color: '#222222',
            highlight: false, showInfobox: false
        });

        // ── Midsegment AB (construction line — cyan) ────────────────────
        board.create('segment', [A, B], {
            strokeColor: '#0EA5E9', strokeWidth: 1.5, fixed: true, highlight: false
        });

        // ── Vertex labels with coordinates ──────────────────────────────
        board.create('text', [-7.6, 2.5, 'J(-6,\\, 2)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [0.3, 6.7, 'K(0,\\, 6)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
        board.create('text', [3.2, -2.8, 'L(4,\\, -2)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // ── Midpoint labels (name only) ─────────────────────────────────
        board.create('text', [-3.8, 4.5, 'A'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'right'
        });
        board.create('text', [2.4, 2.5, 'B'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false, anchorX: 'left'
        });
    </script>
</body>
</html>
