<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Inner Loop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container"><div class="board-wrapper"><div id="board"></div></div></div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.6, 4.6, 4.6, -4.6], axis: false, grid: false, keepAspectRatio: true,
            showNavigation: false, showCopyright: false,
            pan: { enabled: false }, zoom: { enabled: false }
        });
        var GRID = '#9CA3AF', CURVE = '#222222', REF = '#DC2626', LBL = '#374151';
        var MAXR = 3, i, ang;

        for (i = 1; i <= MAXR; i++)
            board.create('circle', [[0, 0], i], { strokeColor: GRID, strokeWidth: 1,
                fillColor: 'none', fixed: true, highlight: false });
        for (i = 0; i < 24; i++) {
            ang = i * Math.PI / 12;
            board.create('segment', [[0, 0], [MAXR * Math.cos(ang), MAXR * Math.sin(ang)]], {
                strokeColor: GRID, strokeWidth: 1, fixed: true, highlight: false });
        }
        board.create('segment', [[0, 0], [MAXR + 0.3, 0]], { strokeColor: '#222222',
            strokeWidth: 2.2, fixed: true, highlight: false });
        for (i = 1; i <= MAXR; i++) {
            board.create('segment', [[i, -0.13], [i, 0.13]], { strokeColor: '#222222',
                strokeWidth: 1.8, fixed: true, highlight: false });
            board.create('text', [i, -0.30, String(i)], { fontSize: 11, color: '#666666',
                anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false });
        }
        var LABELS = [['\\pi/6',1],['\\pi/3',2],['\\pi/2',3],['2\\pi/3',4],['5\\pi/6',5],
            ['\\pi',6],['7\\pi/6',7],['4\\pi/3',8],['3\\pi/2',9],['5\\pi/3',10],['11\\pi/6',11]];
        var LR = 4.1;
        for (i = 0; i < LABELS.length; i++) {
            ang = LABELS[i][1] * Math.PI / 6;
            board.create('text', [LR * Math.cos(ang), LR * Math.sin(ang), LABELS[i][0]], {
                useKatex: true, fontSize: 10, color: LBL, anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false });
        }
        board.create('text', [LR, 0.28, '0'], { useKatex: true, fontSize: 10, color: LBL,
            anchorX: 'middle', anchorY: 'bottom', fixed: true, highlight: false });
        board.create('text', [LR, -0.28, '2\\pi'], { useKatex: true, fontSize: 10, color: LBL,
            anchorX: 'middle', anchorY: 'top', fixed: true, highlight: false });
        board.create('point', [0, 0], { name: '', size: 2.5, fillColor: '#222222',
            strokeColor: '#222222', fixed: true, highlight: false });

        function rad(t) { return 1 + Math.SQRT2 * Math.cos(t); }
        function px(t) { return rad(t) * Math.cos(t); }
        function py(t) { return rad(t) * Math.sin(t); }

        var SA = 3 * Math.PI / 4, SB = 5 * Math.PI / 4, reg = [[0, 0]];
        for (i = 0; i <= 120; i++) {
            var tt = SA + (SB - SA) * i / 120;
            reg.push([px(tt), py(tt)]);
        }
        reg.push([0, 0]);
        board.create('polygon', reg.map(function (p) {
            return board.create('point', p, { visible: false, fixed: true, name: '' });
        }), { fillColor: CURVE, fillOpacity: 0.12, borders: { visible: false },
              vertices: { visible: false }, hasInnerPoints: false, fixed: true, highlight: false });
        // Bounding rays are drawn full length so their labels sit clear of the
        // curve; on this rose r = 0 at both limits, so a ray stub would be invisible.
        function bound(t, lab) {
            var rr = 3.2, lr = 2.0;
            board.create('segment', [[0, 0], [rr * Math.cos(t), rr * Math.sin(t)]], {
                strokeColor: REF, strokeWidth: 1.0, dash: 3, fixed: true, highlight: false });
            // Offset perpendicular to the ray so the dashed line does not run
            // through the text (label-clearance rule).
            var ox = -Math.sin(t) * 0.45, oy = Math.cos(t) * 0.45;
            board.create('text', [lr * Math.cos(t) + ox, lr * Math.sin(t) + oy, lab], {
                useKatex: true, fontSize: 13, color: REF,
                anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false });
        }
        bound(SA, '3\\pi/4');
        bound(SB, '5\\pi/4');
        // The arc actually swept between the two rays, drawn over the curve in the
        // reference colour so the piece being measured is findable at any scale.
        board.create('curve', [px, py, SA, SB], { strokeColor: REF, strokeWidth: 3,
            fixed: true, highlight: false, layer: 9 });

        board.create('curve', [px, py, 0, 2 * Math.PI], { strokeColor: CURVE,
            strokeWidth: 1.8, fixed: true, highlight: false });

    </script>
</body>
</html>
