<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Segment Fragment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var halfChord = 9;
        var sagitta = 4;
        var radius = (sagitta * sagitta + halfChord * halfChord) / (2 * sagitta);

        var cx = 0;
        var cy = -(radius - sagitta);

        var chordLeft = [-halfChord, 0];
        var chordRight = [halfChord, 0];
        var arcTop = [0, sagitta];

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-12.5, 7, 12.5, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var angleLeft = Math.atan2(chordLeft[1] - cy, chordLeft[0] - cx);
        var angleRight = Math.atan2(chordRight[1] - cy, chordRight[0] - cx);

        board.create('curve', [
            function(t) { return cx + radius * Math.cos(t); },
            function(t) { return cy + radius * Math.sin(t); },
            angleRight,
            angleLeft
        ], {
            strokeColor: '#555555',
            strokeWidth: 2.0,
            fixed: true,
            highlight: false
        });

        board.create('segment', [chordLeft, chordRight], {
            strokeColor: '#555555',
            strokeWidth: 2.0,
            fixed: true,
            highlight: false
        });

        board.create('point', chordLeft, {
            name: '', size: 2, color: '#555555', fixed: true, highlight: false
        });
        board.create('point', chordRight, {
            name: '', size: 2, color: '#555555', fixed: true, highlight: false
        });

        var midChord = [0, 0];

        board.create('segment', [midChord, arcTop], {
            strokeColor: '#DC2626',
            strokeWidth: 1.2,
            dash: 2,
            fixed: true,
            highlight: false
        });

        var raSize = 0.6;
        board.create('segment', [[raSize, 0], [raSize, raSize]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false
        });
        board.create('segment', [[raSize, raSize], [0, raSize]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false
        });

        var tickLen = 0.45;
        var tickAngle = Math.PI / 4;
        board.create('segment', [
            [-halfChord / 2 - tickLen * Math.cos(tickAngle), -tickLen * Math.sin(tickAngle)],
            [-halfChord / 2 + tickLen * Math.cos(tickAngle), tickLen * Math.sin(tickAngle)]
        ], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('segment', [
            [halfChord / 2 - tickLen * Math.cos(tickAngle), -tickLen * Math.sin(tickAngle)],
            [halfChord / 2 + tickLen * Math.cos(tickAngle), tickLen * Math.sin(tickAngle)]
        ], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false
        });

        board.create('text', [0, -1.8, '18 \\text{ in.}'], {
            useKatex: true,
            fontSize: 14,
            color: '#222222',
            anchorX: 'middle',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        board.create('text', [1.5, sagitta / 2, '4 \\text{ in.}'], {
            useKatex: true,
            fontSize: 14,
            color: '#DC2626',
            anchorX: 'left',
            anchorY: 'middle',
            fixed: true,
            highlight: false
        });

        board.create('point', arcTop, {
            name: '', size: 2, color: '#555555', fixed: true, highlight: false
        });
    </script>
</body>
</html>
