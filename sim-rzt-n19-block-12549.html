<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangular Block</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #fig { width: 100%; height: 100%; display: block; }
        .edge { stroke: #555555; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
        .hidden-edge { stroke: #555555; stroke-width: 1; fill: none; stroke-dasharray: 5 4; }
        .face-top { fill: #F3F4F6; stroke: none; }
        .face-side { fill: #E5E7EB; stroke: none; }
        .dim { fill: #3B82F6; font-size: 17px; font-family: 'Times New Roman', 'Latin Modern Roman', serif; }
        .dim .v { font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <!-- Pure SVG with a viewBox: scales to any container size (including after the iframe
                 is shown from display:none) with no JS initialization needed. -->
            <svg id="fig" viewBox="0 0 380 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                <!-- Oblique projection: front face 175 wide x 100 tall, depth offset (+84, -52) -->
                <polygon class="face-top" points="65,95 240,95 324,43 149,43"/>
                <polygon class="face-side" points="240,195 324,143 324,43 240,95"/>

                <!-- Hidden edges (dashed) meeting at the back-bottom-left corner -->
                <line class="hidden-edge" x1="65" y1="195" x2="149" y2="143"/>
                <line class="hidden-edge" x1="149" y1="143" x2="324" y2="143"/>
                <line class="hidden-edge" x1="149" y1="143" x2="149" y2="43"/>

                <!-- Visible edges -->
                <polygon class="edge" points="65,195 240,195 240,95 65,95"/>
                <polyline class="edge" points="65,95 149,43 324,43 240,95"/>
                <polyline class="edge" points="240,195 324,143 324,43"/>

                <!-- Dimension labels -->
                <text class="dim" x="152.5" y="218" text-anchor="middle">2<tspan class="v">x</tspan> − 1 m</text>
                <text class="dim" x="289" y="185" text-anchor="start"><tspan class="v">x</tspan> + 2 m</text>
                <text class="dim" x="54" y="150" text-anchor="end"><tspan class="v">x</tspan> m</text>
            </svg>
        </div>
    </div>
</body>
</html>
