<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Point P(4, π/3)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7.5, 7.5, 7.5, -7.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var GRID_COL = '#9CA3AF';
        var GRID_W = 1;
        var MAX_R = 5;
        var POLE = [0, 0];
        var LABEL_R = MAX_R + 1.1;

        // ── Concentric circles r = 1..5 ─────────────────────────────────
        var i, ang, x1, y1, x2, y2;
        for (i = 1; i <= MAX_R; i++) {
            board.create('circle', [[0, 0], i], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fillColor: 'none', fixed: true, highlight: false,
                dash: 0
            });
        }

        // ── Radial lines every π/12 (24 directions) ─────────────────────
        for (i = 0; i < 24; i++) {
            ang = i * Math.PI / 12;
            x2 = MAX_R * Math.cos(ang);
            y2 = MAX_R * Math.sin(ang);
            board.create('segment', [[0, 0], [x2, y2]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false
            });
        }

        // ── Polar axis (0-direction, darkened) ──────────────────────────
        var AXIS_EXT = MAX_R + 0.4;
        board.create('segment', [[0, 0], [AXIS_EXT, 0]], {
            strokeColor: '#222222', strokeWidth: 2.2,
            fixed: true, highlight: false
        });

        // Tick marks on polar axis at each circle
        for (i = 1; i <= MAX_R; i++) {
            board.create('segment', [[i, -0.13], [i, 0.13]], {
                strokeColor: '#222222', strokeWidth: 1.8,
                fixed: true, highlight: false
            });
            // Radius number below tick
            board.create('text', [i, -0.45, String(i)], {
                fontSize: 11, color: '#666666', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Pole dot ────────────────────────────────────────────────────
        board.create('point', [0, 0], {
            name: '', size: 2.5, color: '#222222', fixed: true, highlight: false
        });

        // ── Angle labels (π/6 family only, slash form) ──────────────────
        var angleLabels = [
            { ang: Math.PI / 6, tex: '\\pi/6' },
            { ang: Math.PI / 3, tex: '\\pi/3' },
            { ang: Math.PI / 2, tex: '\\pi/2' },
            { ang: 2 * Math.PI / 3, tex: '2\\pi/3' },
            { ang: 5 * Math.PI / 6, tex: '5\\pi/6' },
            { ang: Math.PI, tex: '\\pi' },
            { ang: 7 * Math.PI / 6, tex: '7\\pi/6' },
            { ang: 4 * Math.PI / 3, tex: '4\\pi/3' },
            { ang: 3 * Math.PI / 2, tex: '3\\pi/2' },
            { ang: 5 * Math.PI / 3, tex: '5\\pi/3' },
            { ang: 11 * Math.PI / 6, tex: '11\\pi/6' }
        ];

        for (i = 0; i < angleLabels.length; i++) {
            var a = angleLabels[i].ang;
            var lx = LABEL_R * Math.cos(a);
            var ly = LABEL_R * Math.sin(a);
            board.create('text', [lx, ly, angleLabels[i].tex], {
                useKatex: true, fontSize: 12, color: '#374151',
                anchorX: 'middle', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // 0 and 2π labels at end of polar axis
        board.create('text', [AXIS_EXT + 0.5, 0.3, '0'], {
            useKatex: true, fontSize: 12, color: '#374151',
            anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });
        board.create('text', [AXIS_EXT + 0.5, -0.3, '2\\pi'], {
            useKatex: true, fontSize: 12, color: '#374151',
            anchorX: 'middle', anchorY: 'top',
            fixed: true, highlight: false
        });

        // ── Segment OP (secondary color) ────────────────────────────────
        var Px = 4 * Math.cos(Math.PI / 3);
        var Py = 4 * Math.sin(Math.PI / 3);

        board.create('segment', [[0, 0], [Px, Py]], {
            strokeColor: '#2563EB', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Point P (red) ───────────────────────────────────────────────
        board.create('point', [Px, Py], {
            name: '', size: 5, color: '#DC2626', fixed: true, highlight: false,
            showInfobox: false
        });

        // Label P (KaTeX, red, bold, offset)
        board.create('text', [Px + 0.4, Py + 0.45, '\\boldsymbol{P}'], {
            useKatex: true, fontSize: 14, color: '#DC2626',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
