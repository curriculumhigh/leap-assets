<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment Bisector Diagram</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.5, 3.2, 11.5, -3.2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // === Points ===
        var P = board.create('point', [0, 0], {
            name: 'P', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-12, -14] }
        });

        var Q = board.create('point', [10, 0], {
            name: 'Q', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [6, -14] }
        });

        var N = board.create('point', [5, 0], {
            name: 'N', fixed: true, size: 2, color: '#222222', highlight: false,
            label: { fontSize: 14, color: '#222222', offset: [-4, -16] }
        });

        // === Segment PQ ===
        board.create('segment', [P, Q], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // === Label "23" on segment NQ ===
        board.create('text', [7.5, 0.55, '23'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'bottom',
            fixed: true, highlight: false
        });

        // === Line m through N at an angle (arrows at both ends) ===
        var ang = 55 * Math.PI / 180;
        var lineLen = 4.5;
        var mP1 = [5 - lineLen * Math.cos(ang), 0 - lineLen * Math.sin(ang)];
        var mP2 = [5 + lineLen * Math.cos(ang), 0 + lineLen * Math.sin(ang)];

        board.create('segment', [mP1, mP2], {
            strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false,
            firstArrow: { type: 2, size: 6 },
            lastArrow: { type: 2, size: 6 }
        });

        // === Label "m" near the upper end of the line ===
        board.create('text', [mP2[0] + 0.3, mP2[1] + 0.15, '<i>m</i>'], {
            fontSize: 14, color: '#555555', fixed: true, highlight: false
        });
    </script>
</body>
</html>
