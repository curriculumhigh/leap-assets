<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral A'B'C'D' — Distractor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, -4, 5, -12],
            axis: true,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444', label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: { strokeColor: '#D1D5DB', strokeWidth: 0.4 }
        });

        // Axis labels
        board.create('text', [4.6, -4.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, -4.4, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        var COL_EDGE = '#2563EB';
        var COL_VERT = '#DC2626';

        // Vertices
        var Ap = board.create('point', [-3, -9], {
            name: "A'", size: 3, color: COL_VERT, fixed: true, highlight: false,
            showInfobox: false,
            label: { fontSize: 12, color: COL_VERT, offset: [-12, -14], useKatex: true }
        });
        var Bp = board.create('point', [-5, -6], {
            name: "B'", size: 3, color: COL_VERT, fixed: true, highlight: false,
            showInfobox: false,
            label: { fontSize: 12, color: COL_VERT, offset: [-12, 8], useKatex: true }
        });
        var Cp = board.create('point', [-1, -6], {
            name: "C'", size: 3, color: COL_VERT, fixed: true, highlight: false,
            showInfobox: false,
            label: { fontSize: 12, color: COL_VERT, offset: [6, 8], useKatex: true }
        });
        var Dp = board.create('point', [3, -10], {
            name: "D'", size: 3, color: COL_VERT, fixed: true, highlight: false,
            showInfobox: false,
            label: { fontSize: 12, color: COL_VERT, offset: [6, -10], useKatex: true }
        });

        // Polygon edges in blue, no fill
        board.create('polygon', [Ap, Bp, Cp, Dp], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EDGE, strokeWidth: 1.8 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });
    </script>
</body>
</html>
