<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilateral PQRS Decomposition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-4.5, 7.5, 8.5, -3.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.1, -0.4, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 7.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Define all 6 vertices ───────────────────────────────────────
        var pP = board.create('point', [-2, 5], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pQ = board.create('point', [6, 3],  { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pR = board.create('point', [6, -1], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pS = board.create('point', [-2, 1], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pT = board.create('point', [-2, 3], { name: '', size: 2, color: '#222222', fixed: true, highlight: false });
        var pU = board.create('point', [6, 1],  { name: '', size: 2, color: '#222222', fixed: true, highlight: false });

        // ── Shaded regions (created first so they sit behind lines) ─────

        // Triangle PQT (top) — blue
        board.create('polygon', [pP, pQ, pT], {
            fillColor: '#2563EB', fillOpacity: 0.10,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Rectangle TQUS (middle) — green
        board.create('polygon', [pT, pQ, pU, pS], {
            fillColor: '#059669', fillOpacity: 0.10,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Triangle SUR (bottom) — orange
        board.create('polygon', [pS, pU, pR], {
            fillColor: '#D97706', fillOpacity: 0.10,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Quadrilateral PQRS — solid segments ────────────────────────
        board.create('segment', [pP, pQ], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pQ, pR], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pR, pS], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });
        board.create('segment', [pS, pP], { strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false });

        // ── Decomposition lines — dashed cyan ──────────────────────────
        board.create('segment', [pT, pQ], { strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 3, fixed: true, highlight: false });
        board.create('segment', [pS, pU], { strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 3, fixed: true, highlight: false });

        // ── KaTeX coordinate labels ─────────────────────────────────────
        // P(−2, 5) — label to the left
        board.create('text', [-2.4, 5.5, 'P(-2,\\,5)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'right', fixed: true, highlight: false
        });

        // Q(6, 3) — label to the right
        board.create('text', [6.3, 3.4, 'Q(6,\\,3)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });

        // R(6, −1) — label to the right
        board.create('text', [6.3, -1.0, 'R(6,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });

        // S(−2, 1) — label to the left
        board.create('text', [-2.4, 0.5, 'S(-2,\\,1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'right', fixed: true, highlight: false
        });

        // T(−2, 3) — label to the left
        board.create('text', [-2.4, 3.4, 'T(-2,\\,3)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'right', fixed: true, highlight: false
        });

        // U(6, 1) — label to the right
        board.create('text', [6.3, 1.4, 'U(6,\\,1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            anchorX: 'left', fixed: true, highlight: false
        });
    </script>
</body>
</html>
