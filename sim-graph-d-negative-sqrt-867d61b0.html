<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of sqrt(x+2) - 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 6px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
        .JXGtext {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 3.5, 19, -6.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    firstArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 4,
                        label: {
                            fontSize: 9,
                            offset: [0, -10],
                            anchorX: 'middle'
                        },
                        drawZero: false
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 4 },
                    firstArrow: { type: 2, size: 4 },
                    ticks: {
                        strokeColor: '#444444',
                        strokeWidth: 0,
                        majorHeight: 0,
                        minorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 2,
                        label: {
                            fontSize: 9,
                            offset: [-12, 0],
                            anchorX: 'right'
                        },
                        drawZero: false
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        board.create('text', [18.2, -0.55, '<i>x</i>'], {
            fontSize: 11, fixed: true, highlight: false
        });
        board.create('text', [0.4, 3.1, '<i>y</i>'], {
            fontSize: 11, fixed: true, highlight: false
        });

        board.create('functiongraph', [
            function(x) {
                if (x < -2) return NaN;
                return Math.sqrt(x + 2) - 4;
            },
            -2, 19
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        board.create('point', [-2, -4], {
            name: '',
            size: 3,
            color: '#222222',
            fixed: true,
            highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
