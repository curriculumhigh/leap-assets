<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line: x > -5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9, 2, 6, -2],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Number line with arrow only on the left side
        board.create('line', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            firstArrow: { type: 2, size: 6 },
            lastArrow: false,
            fixed: true,
            highlight: false
        });

        // Tick marks and labels at each integer from -8 to 5
        var tickHalf = 0.18;
        for (var i = -8; i <= 5; i++) {
            board.create('segment', [[i, -tickHalf], [i, tickHalf]], {
                strokeColor: '#444444',
                strokeWidth: 1.0,
                fixed: true,
                highlight: false
            });
            board.create('text', [i, -0.6, String(i)], {
                anchorX: 'middle',
                anchorY: 'top',
                fontSize: 10,
                color: '#444444',
                fixed: true,
                highlight: false
            });
        }

        // Blue ray from -5 to the right with arrowhead
        board.create('arrow', [[-5, 0], [5.7, 0]], {
            strokeColor: '#2563EB',
            strokeWidth: 2.5,
            lastArrow: { type: 2, size: 6 },
            fixed: true,
            highlight: false
        });

        // Open circle at x = -5 (strict inequality)
        board.create('point', [-5, 0], {
            name: '',
            size: 4,
            fillColor: '#ffffff',
            strokeColor: '#2563EB',
            strokeWidth: 1.5,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
