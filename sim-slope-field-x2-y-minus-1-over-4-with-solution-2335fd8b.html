<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope Field — dy/dx = x²(y−1)/4 with Solution Curve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 6.5, 6.5, -6.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid lines at every integer ─────────────────────────────────
        var GRID_COL = '#D1D5DB';
        var GRID_W = 0.4;
        var i;

        for (i = -5; i <= 5; i++) {
            board.create('segment', [[i, -5], [i, 5]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false, layer: 0
            });
            board.create('segment', [[-5, i], [5, i]], {
                strokeColor: GRID_COL, strokeWidth: GRID_W,
                fixed: true, highlight: false, layer: 0
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        var AXIS_COL = '#444444';

        board.create('arrow', [[-6.2, 0], [6.2, 0]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false, layer: 1
        });
        board.create('arrow', [[0, -6.2], [0, 6.2]], {
            strokeColor: AXIS_COL, strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false, layer: 1
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var TICK_LEN = 0.15;

        for (i = -5; i <= 5; i++) {
            if (i === 0) continue;

            board.create('segment', [[i, -TICK_LEN], [i, TICK_LEN]], {
                strokeColor: AXIS_COL, strokeWidth: 1.2,
                fixed: true, highlight: false, layer: 1
            });
            board.create('text', [i, -0.55, String(i)], {
                fontSize: 9, color: AXIS_COL, anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });

            board.create('segment', [[-TICK_LEN, i], [TICK_LEN, i]], {
                strokeColor: AXIS_COL, strokeWidth: 1.2,
                fixed: true, highlight: false, layer: 1
            });
            board.create('text', [-0.45, i, String(i)], {
                fontSize: 9, color: AXIS_COL, anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        board.create('text', [-0.4, -0.5, '0'], {
            fontSize: 9, color: AXIS_COL, anchorX: 'right', anchorY: 'top',
            fixed: true, highlight: false
        });

        board.create('text', [6.0, -0.45, '<i>x</i>'], { fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.3, 6.1, '<i>y</i>'], { fontSize: 12, fixed: true, highlight: false });

        // ── ODE: dy/dx = x²(y − 1) / 4 ─────────────────────────────────
        function dydx(x, y) {
            return x * x * (y - 1) / 4;
        }

        // ── Slope field ─────────────────────────────────────────────────
        var SEG_HALF = 0.28;
        var COL_FIELD = '#2563EB';

        for (var xi = -5; xi <= 5; xi++) {
            for (var yi = -5; yi <= 5; yi++) {
                var slope = dydx(xi, yi);
                var angle = Math.atan(slope);
                var dx = SEG_HALF * Math.cos(angle);
                var dy = SEG_HALF * Math.sin(angle);

                board.create('segment', [
                    [xi - dx, yi - dy],
                    [xi + dx, yi + dy]
                ], {
                    strokeColor: COL_FIELD,
                    strokeWidth: 1.75,
                    fixed: true,
                    highlight: false,
                    layer: 5
                });
            }
        }

        // ── Solution curve through (1, −3) via RK4 ─────────────────────
        var X0 = 1, Y0 = -3;
        var H_STEP = 0.02;
        var X_MIN = -6.5, X_MAX = 6.5;
        var Y_CLIP_MIN = -6.5, Y_CLIP_MAX = 6.5;
        var COL_SOL = '#DC2626';

        function rk4Step(x, y, h) {
            var k1 = dydx(x, y);
            var k2 = dydx(x + h / 2, y + h * k1 / 2);
            var k3 = dydx(x + h / 2, y + h * k2 / 2);
            var k4 = dydx(x + h, y + h * k3);
            return y + (h / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
        }

        // Integrate forward from (X0, Y0)
        var fwdPts = [[X0, Y0]];
        var xc = X0, yc = Y0;
        while (xc < X_MAX) {
            yc = rk4Step(xc, yc, H_STEP);
            xc += H_STEP;
            if (yc < Y_CLIP_MIN || yc > Y_CLIP_MAX) break;
            fwdPts.push([xc, yc]);
        }

        // Integrate backward from (X0, Y0)
        var bwdPts = [];
        xc = X0; yc = Y0;
        while (xc > X_MIN) {
            yc = rk4Step(xc, yc, -H_STEP);
            xc -= H_STEP;
            if (yc < Y_CLIP_MIN || yc > Y_CLIP_MAX) break;
            bwdPts.push([xc, yc]);
        }
        bwdPts.reverse();

        // Combine: backward points + forward points
        var solPts = bwdPts.concat(fwdPts);

        // Extract x and y arrays
        var solX = [];
        var solY = [];
        for (var s = 0; s < solPts.length; s++) {
            solX.push(solPts[s][0]);
            solY.push(solPts[s][1]);
        }

        // Draw solution curve
        board.create('curve', [solX, solY], {
            strokeColor: COL_SOL,
            strokeWidth: 1.8,
            fixed: true,
            highlight: false,
            layer: 7
        });

        // ── Initial point marker at (1, −3) ────────────────────────────
        board.create('point', [X0, Y0], {
            name: '', size: 4, color: COL_SOL,
            fixed: true, highlight: false,
            showInfobox: false,
            layer: 8
        });
    </script>
</body>
</html>
