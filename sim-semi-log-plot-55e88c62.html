<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Log Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.8, 3.6, 6.2, -0.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Custom axes ─────────────────────────────────────────────────
        board.create('arrow', [[-0.5, 0], [6.0, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        board.create('arrow', [[0, -0.3], [0, 3.45]], {
            strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 6 }
        });

        // ── Gridlines ───────────────────────────────────────────────────
        var yGridVals = [0, 1, 2, 3];
        for (var i = 0; i < yGridVals.length; i++) {
            board.create('segment', [[-0.5, yGridVals[i]], [5.8, yGridVals[i]]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        var xGridVals = [1, 2, 3, 4, 5];
        for (var j = 0; j < xGridVals.length; j++) {
            board.create('segment', [[xGridVals[j], -0.3], [xGridVals[j], 3.3]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false
            });
        }

        // ── X-axis tick marks and labels ────────────────────────────────
        for (var k = 0; k < xGridVals.length; k++) {
            board.create('segment', [[xGridVals[k], -0.06], [xGridVals[k], 0.06]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [xGridVals[k], -0.22, String(xGridVals[k])], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // ── Y-axis tick marks and labels ────────────────────────────────
        var yLabels = ['1', '10', '100', '1000'];
        for (var m = 0; m < yGridVals.length; m++) {
            board.create('segment', [[-0.06, yGridVals[m]], [0.06, yGridVals[m]]], {
                strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false
            });
            board.create('text', [-0.15, yGridVals[m] + (m === 0 ? 0.12 : 0), yLabels[m]], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // ── Axis labels ─────────────────────────────────────────────────
        board.create('text', [5.85, -0.2, '<i>x</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.15, 3.4, '<i>y</i>'], {
            fontSize: 14, color: '#444444', fixed: true, highlight: false
        });

        // ── Data points (plotted in log10 space) ────────────────────────
        var data = [
            [1, 3],
            [2, 8],
            [3, 25],
            [4, 70],
            [5, 200]
        ];

        for (var p = 0; p < data.length; p++) {
            var xVal = data[p][0];
            var yVal = Math.log10(data[p][1]);
            board.create('point', [xVal, yVal], {
                name: '', size: 4, color: '#222222',
                fixed: true, highlight: false, showInfobox: false
            });
        }
    </script>
</body>
</html>
