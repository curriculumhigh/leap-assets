<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Circles — Two Concentric Pairs on Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-15, 11, 17, -11],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 1,
                        insertTicks: false
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [16.5, -0.7, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.4, 10.5, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Colors
        var COL_GREEN = '#059669';
        var COL_ORANGE = '#D97706';
        var COL_BLUE = '#2563EB';
        var COL_DARK = '#222222';

        // Centers
        var PX = -5, PY = 0;
        var QX = 7, QY = 0;

        board.create('point', [PX, PY], {
            name: 'P', fixed: true, size: 2, color: COL_DARK, highlight: false,
            label: { fontSize: 14, color: COL_DARK, offset: [-4, -18] }
        });

        board.create('point', [QX, QY], {
            name: 'Q', fixed: true, size: 2, color: COL_DARK, highlight: false,
            label: { fontSize: 14, color: COL_DARK, offset: [-4, -18] }
        });

        // Left pair — Circle A (r=5, green)
        board.create('circle', [[PX, PY], 5], {
            strokeColor: COL_GREEN, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // Left pair — Circle B (r=8, orange)
        board.create('circle', [[PX, PY], 8], {
            strokeColor: COL_ORANGE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // Right pair — Circle C (r=8, blue)
        board.create('circle', [[QX, QY], 8], {
            strokeColor: COL_BLUE, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // Right pair — Circle D (r=5, green)
        board.create('circle', [[QX, QY], 5], {
            strokeColor: COL_GREEN, strokeWidth: 2.0, fixed: true, highlight: false,
            fillColor: 'none', fillOpacity: 0
        });

        // Circle name labels
        board.create('text', [PX + 0.5, PY + 5 + 0.6, 'A'], {
            fontSize: 15, color: COL_GREEN, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold; font-style:italic'
        });

        board.create('text', [PX + 0.5, PY + 8 + 0.6, 'B'], {
            fontSize: 15, color: COL_ORANGE, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold; font-style:italic'
        });

        board.create('text', [QX + 0.5, QY + 8 + 0.6, 'C'], {
            fontSize: 15, color: COL_BLUE, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold; font-style:italic'
        });

        board.create('text', [QX + 0.5, QY + 5 + 0.6, 'D'], {
            fontSize: 15, color: COL_GREEN, fixed: true, highlight: false,
            cssStyle: 'font-weight:bold; font-style:italic'
        });
    </script>
</body>
</html>
