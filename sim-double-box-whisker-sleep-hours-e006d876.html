<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Box-and-Whisker Plot — Sleep Hours</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2.4, 4.6, 13.4, -0.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Colors ──────────────────────────────────────────────────────
        var COL_TEENS  = '#2563EB';
        var COL_ADULTS = '#059669';
        var COL_MEDIAN = '#DC2626';
        var COL_GRID   = '#D1D5DB';
        var COL_AXIS   = '#444444';

        // ── Layout constants ────────────────────────────────────────────
        var AXIS_Y     = 0.3;
        var ADULTS_Y   = 1.3;
        var TEENS_Y    = 2.7;
        var BOX_HALF_H = 0.20;
        var CAP_HALF   = 0.15;

        // ── Five-number summaries ───────────────────────────────────────
        var teens  = { min: 3, q1: 5, med: 7, q3: 9, max: 11 };
        var adults = { min: 2, q1: 3, med: 5, q3: 6, max: 10 };

        // ── Vertical dashed grid lines at every integer 1–12 ────────────
        var i;
        for (i = 1; i <= 12; i++) {
            board.create('segment', [[i, AXIS_Y + 0.08], [i, 3.5]], {
                strokeColor: COL_GRID, strokeWidth: 0.4, dash: 2,
                fixed: true, highlight: false
            });
        }

        // ── Horizontal number line ──────────────────────────────────────
        board.create('segment', [[0.5, AXIS_Y], [12.5, AXIS_Y]], {
            strokeColor: COL_AXIS, strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // Tick marks and labels 1–12 (pushed up — tight to the line)
        for (i = 1; i <= 12; i++) {
            board.create('segment', [[i, AXIS_Y - 0.08], [i, AXIS_Y + 0.08]], {
                strokeColor: COL_AXIS, strokeWidth: 1.2,
                fixed: true, highlight: false
            });
            board.create('text', [i, AXIS_Y - 0.22, String(i)], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 11, color: COL_AXIS,
                fixed: true, highlight: false
            });
        }

        // Axis label: Sleep (hours)
        board.create('text', [6.5, -0.18, '\\textit{Sleep (hours)}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 14, color: COL_AXIS,
            useKatex: true, fixed: true, highlight: false
        });

        // ── Helper: draw one box-and-whisker plot ───────────────────────
        function drawBoxPlot(data, centerY, color, labelText) {
            var top = centerY + BOX_HALF_H;
            var bot = centerY - BOX_HALF_H;

            // --- Whisker: min to Q1 ---
            board.create('segment', [[data.min, centerY], [data.q1, centerY]], {
                strokeColor: color, strokeWidth: 1.5,
                fixed: true, highlight: false
            });

            // --- Whisker: Q3 to max ---
            board.create('segment', [[data.q3, centerY], [data.max, centerY]], {
                strokeColor: color, strokeWidth: 1.5,
                fixed: true, highlight: false
            });

            // --- Cap at min ---
            board.create('segment', [[data.min, centerY - CAP_HALF], [data.min, centerY + CAP_HALF]], {
                strokeColor: color, strokeWidth: 1.5,
                fixed: true, highlight: false
            });

            // --- Cap at max ---
            board.create('segment', [[data.max, centerY - CAP_HALF], [data.max, centerY + CAP_HALF]], {
                strokeColor: color, strokeWidth: 1.5,
                fixed: true, highlight: false
            });

            // --- Box: Q1 to Q3 ---
            var p1 = board.create('point', [data.q1, top], { visible: false, fixed: true, name: '' });
            var p2 = board.create('point', [data.q3, top], { visible: false, fixed: true, name: '' });
            var p3 = board.create('point', [data.q3, bot], { visible: false, fixed: true, name: '' });
            var p4 = board.create('point', [data.q1, bot], { visible: false, fixed: true, name: '' });
            board.create('polygon', [p1, p2, p3, p4], {
                fillColor: color, fillOpacity: 0.20,
                borders: { strokeColor: color, strokeWidth: 1.8 },
                vertices: { visible: false },
                hasInnerPoints: false, fixed: true, highlight: false
            });

            // --- Median line (red) ---
            board.create('segment', [[data.med, bot], [data.med, top]], {
                strokeColor: COL_MEDIAN, strokeWidth: 2.0,
                fixed: true, highlight: false
            });

            // --- Numeric value labels above the box plot ---
            var valY = top + 0.22;
            var vals = [data.min, data.q1, data.med, data.q3, data.max];
            for (var v = 0; v < vals.length; v++) {
                board.create('text', [vals[v], valY, String(vals[v])], {
                    anchorX: 'middle', anchorY: 'middle',
                    fontSize: 11, color: color,
                    fixed: true, highlight: false
                });
            }

            // --- Group label above the value labels ---
            var groupLabelY = valY + 0.32;
            board.create('text', [data.med, groupLabelY, labelText], {
                anchorX: 'middle', anchorY: 'middle',
                fontSize: 13, color: color,
                cssStyle: 'font-weight:600',
                fixed: true, highlight: false
            });
        }

        // ── Draw both box plots ─────────────────────────────────────────
        drawBoxPlot(teens,  TEENS_Y,  COL_TEENS,  'Teens');
        drawBoxPlot(adults, ADULTS_Y, COL_ADULTS, 'Adults');

    </script>
</body>
</html>
