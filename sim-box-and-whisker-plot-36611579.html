<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-and-Whisker Plot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [1, 6, 59, -4],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Five-number summary ─────────────────────────────────────────
        var MIN = 8, Q1 = 15, MED = 28, Q3 = 35, MAX = 52;
        var Y = 2.5;
        var BOX_H = 1.2;
        var TICK_H = 0.5;
        var COL_BOX = '#555555';
        var COL_MED = '#222222';
        var COL_PT = '#222222';
        var LABEL_COL = '#444444';
        var LABEL_SIZE = 11;
        var REF_LINE_W = 1.5;

        // ── Number line (horizontal axis) ───────────────────────────────
        board.create('arrow', [[3, 0], [57, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            firstArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Tick marks and labels every 5 from 5 to 55
        var tickVals = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
        for (var i = 0; i < tickVals.length; i++) {
            var tv = tickVals[i];
            board.create('segment', [[tv, -0.3], [tv, 0.3]], {
                strokeColor: '#444444', strokeWidth: 1.2, fixed: true, highlight: false
            });
            board.create('text', [tv, -0.9, String(tv)], {
                fontSize: LABEL_SIZE, anchorX: 'middle', anchorY: 'top',
                color: LABEL_COL, fixed: true, highlight: false
            });
        }

        // Axis label: "minutes" starting at x=50, slightly above tick labels
        board.create('text', [50, 0.45, '\\textit{minutes}'], {
            fontSize: 13, useKatex: true, anchorX: 'left', anchorY: 'bottom',
            color: '#444444', fixed: true, highlight: false
        });

        // ── Box (Q1 to Q3) — no fill ───────────────────────────────────
        var boxTop = Y + BOX_H;
        var boxBot = Y - BOX_H;

        board.create('segment', [[Q1, boxTop], [Q3, boxTop]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[Q1, boxBot], [Q3, boxBot]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[Q1, boxTop], [Q1, boxBot]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[Q3, boxTop], [Q3, boxBot]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Median line ─────────────────────────────────────────────────
        board.create('segment', [[MED, boxTop], [MED, boxBot]], {
            strokeColor: COL_MED, strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Whiskers ────────────────────────────────────────────────────
        board.create('segment', [[MIN, Y], [Q1, Y]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[Q3, Y], [MAX, Y]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Vertical ticks at min and max whisker ends ──────────────────
        board.create('segment', [[MIN, Y - TICK_H], [MIN, Y + TICK_H]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });
        board.create('segment', [[MAX, Y - TICK_H], [MAX, Y + TICK_H]], {
            strokeColor: COL_BOX, strokeWidth: 1.8, fixed: true, highlight: false
        });

        // ── Vertical reference lines from key points down to number line ─
        var allKeyPts = [MIN, Q1, MED, Q3, MAX];
        for (var k = 0; k < allKeyPts.length; k++) {
            var xv = allKeyPts[k];
            var topY = (xv === MIN || xv === MAX) ? Y - TICK_H : boxBot;
            board.create('segment', [[xv, topY], [xv, 0.3]], {
                strokeColor: '#D1D5DB', strokeWidth: REF_LINE_W, dash: 2,
                fixed: true, highlight: false
            });
        }

        // ── Key point dots (size 2) ─────────────────────────────────────
        for (var m = 0; m < allKeyPts.length; m++) {
            board.create('point', [allKeyPts[m], Y], {
                name: '', size: 2, color: COL_PT, fixed: true,
                highlight: false, showInfobox: false
            });
        }

        // ── Value labels — only min (8), median (28), max (52)
        var labelPts = [MIN, MED, MAX];
        var labelTexts = ['8', '28', '52'];
        for (var n = 0; n < labelPts.length; n++) {
            board.create('text', [labelPts[n], -1.35, labelTexts[n]], {
                fontSize: LABEL_SIZE, anchorX: 'middle', anchorY: 'top',
                color: LABEL_COL, fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
