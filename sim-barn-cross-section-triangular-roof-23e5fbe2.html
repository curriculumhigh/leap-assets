<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barn Cross-Section with Triangular Roof</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-16, 13, 16, -4],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Coordinates ─────────────────────────────────────────────────
        var baseLeft  = [-12, 0];
        var baseRight = [12, 0];
        var peak      = [0, 9];
        var baseCenter = [0, 0];

        // ── Triangle (roof outline) ─────────────────────────────────────
        var pBL = board.create('point', baseLeft, { visible: false, fixed: true, name: '' });
        var pBR = board.create('point', baseRight, { visible: false, fixed: true, name: '' });
        var pPK = board.create('point', peak, { visible: false, fixed: true, name: '' });
        var pBC = board.create('point', baseCenter, { visible: false, fixed: true, name: '' });

        // Triangle edges
        board.create('segment', [pBL, pBR], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [pBL, pPK], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });
        board.create('segment', [pPK, pBR], {
            strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false
        });

        // ── Vertical height line (dashed, red reference) ────────────────
        board.create('segment', [pPK, pBC], {
            strokeColor: '#DC2626', strokeWidth: 1.2, dash: 2, fixed: true, highlight: false
        });

        // ── Horizontal distance line (dashed, cyan construction) ────────
        var hLineY = -0.8;
        var pHL = board.create('point', [0, hLineY], { visible: false, fixed: true, name: '' });
        var pHR = board.create('point', [12, hLineY], { visible: false, fixed: true, name: '' });

        board.create('segment', [pHL, pHR], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2, fixed: true, highlight: false
        });

        // Small vertical ticks at ends of horizontal measurement
        board.create('segment', [[0, -0.3], [0, -1.3]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, fixed: true, highlight: false
        });
        board.create('segment', [[12, -0.3], [12, -1.3]], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, fixed: true, highlight: false
        });

        // ── Right-angle marker at base center ───────────────────────────
        var sq = 0.8;
        board.create('segment', [[sq, 0], [sq, sq]], {
            strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false
        });
        board.create('segment', [[sq, sq], [0, sq]], {
            strokeColor: '#DC2626', strokeWidth: 1.2, fixed: true, highlight: false
        });

        // ── Labels ──────────────────────────────────────────────────────

        // Height label: "9 ft"
        board.create('text', [-1.8, 4.5, '9 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#DC2626',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // Horizontal distance label: "12 ft"
        board.create('text', [6, -2.0, '12 \\text{ ft}'], {
            useKatex: true, fontSize: 14, color: '#0EA5E9',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // Slant side label: "s"
        var slantMidX = (0 + 12) / 2 + 1.2;
        var slantMidY = (9 + 0) / 2 + 0.5;
        board.create('text', [slantMidX, slantMidY, 's'], {
            useKatex: true, fontSize: 16, color: '#555555',
            cssStyle: 'font-weight: bold;',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // Depth annotation
        board.create('text', [6, 10.5, '\\text{Depth: } 50 \\text{ ft}'], {
            useKatex: true, fontSize: 12, color: '#888888',
            fixed: true, highlight: false, anchorX: 'middle'
        });

        // ── Small filled dots at triangle vertices ──────────────────────
        board.create('point', baseLeft, {
            name: '', size: 2, color: '#555555', fixed: true, highlight: false
        });
        board.create('point', baseRight, {
            name: '', size: 2, color: '#555555', fixed: true, highlight: false
        });
        board.create('point', peak, {
            name: '', size: 2, color: '#555555', fixed: true, highlight: false
        });

    </script>
</body>
</html>
