<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Path</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
        .coord-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <div class="coord-tooltip" id="tooltip"></div>

    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-30, 88, 320, -18],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 50
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 10
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [310, -3.5, 'x\\text{ (ft)}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [3, 85, 'y\\text{ (ft)}'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // Projectile function: y = x - x^2/288
        function yFunc(x) {
            return x - (x * x) / 288;
        }

        // Curve
        board.create('functiongraph', [yFunc, -5, 300], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // Reference lines (red, dashed)
        // Vertical drop from vertex (144,72) to (144,0)
        board.create('segment', [[144, 72], [144, 0]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.0,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // Horizontal line from y-axis to vertex at y=72
        board.create('segment', [[0, 72], [144, 72]], {
            strokeColor: '#DC2626',
            strokeWidth: 1.0,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // --- KaTeX Tooltip setup ---
        var tooltip = document.getElementById('tooltip');
        var boardContainer = document.getElementById('board');

        function showTooltip(pt, color, label) {
            katex.render(label, tooltip, { throwOnError: false });
            tooltip.style.borderColor = color;
            tooltip.style.display = 'block';
            var rect = boardContainer.getBoundingClientRect();
            var coords = new JXG.Coords(JXG.COORDS_BY_USER, [pt.X(), pt.Y()], board);
            var sx = coords.scrCoords[1] + rect.left;
            var sy = coords.scrCoords[2] + rect.top;
            tooltip.style.left = (sx + 14) + 'px';
            tooltip.style.top = (sy - 28) + 'px';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        // Key points
        // Launch point (0, 0)
        var ptLaunch = board.create('point', [0, 0], {
            name: '', size: 5, color: '#222222', fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: '#222222', highlightStrokeColor: '#222222'
        });
        ptLaunch.on('over', function() {
            showTooltip(ptLaunch, '#222222', '\\color{#222222}{(0,\\,0)}');
        });
        ptLaunch.on('out', function() { hideTooltip(); });

        // Vertex (144, 72)
        var ptVertex = board.create('point', [144, 72], {
            name: '', size: 5, color: '#DC2626', fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: '#DC2626', highlightStrokeColor: '#DC2626'
        });
        ptVertex.on('over', function() {
            showTooltip(ptVertex, '#DC2626', '\\color{#DC2626}{(144,\\,72)}');
        });
        ptVertex.on('out', function() { hideTooltip(); });

        // Landing point (288, 0)
        var ptLand = board.create('point', [288, 0], {
            name: '', size: 5, color: '#222222', fixed: true,
            showInfobox: false, highlight: true,
            highlightFillColor: '#222222', highlightStrokeColor: '#222222'
        });
        ptLand.on('over', function() {
            showTooltip(ptLand, '#222222', '\\color{#222222}{(288,\\,0)}');
        });
        ptLand.on('out', function() { hideTooltip(); });
    </script>
</body>
</html>
