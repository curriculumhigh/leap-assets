<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Curve Through Key Points</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1, 10, 8.5, -3],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [8.1, -0.45, 't'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });
        board.create('text', [0.2, 9.6, 's'], { fontSize: 14, fixed: true, highlight: false, useKatex: true });

        // ── Polynomial ──────────────────────────────────────────────────
        // P(t) = -(17/525)t^5 + (17/30)t^4 - (552/175)t^3 + (803/150)t^2 + (94/105)t + 2
        function curveS(t) {
            return -(17/525)*t*t*t*t*t + (17/30)*t*t*t*t - (552/175)*t*t*t + (803/150)*t*t + (94/105)*t + 2;
        }

        // Plot the curve — domain [0, 7]
        board.create('functiongraph', [function(t) { return curveS(t); }, 0, 7], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // ── Key points with coordinate labels ───────────────────────────
        var pts = [
            { t: 0, s: 2,  label: '(0,\\,2)',  offX: 0.25, offY: 0.7, anchorX: 'left' },
            { t: 2, s: 8,  label: '(2,\\,8)',  offX: 0.25, offY: 0.7, anchorX: 'left' },
            { t: 5, s: -1, label: '(5,\\,-1)', offX: 0.25, offY: -0.9, anchorX: 'left' },
            { t: 7, s: 5,  label: '(7,\\,5)',  offX: 0.25, offY: 0.7, anchorX: 'left' }
        ];

        for (var i = 0; i < pts.length; i++) {
            var p = pts[i];
            board.create('point', [p.t, p.s], {
                name: '', size: 3, color: '#222222', fixed: true, highlight: false
            });
            board.create('text', [p.t + p.offX, p.s + p.offY, p.label], {
                useKatex: true, fontSize: 13, color: '#222222',
                anchorX: p.anchorX, anchorY: 'bottom',
                fixed: true, highlight: false
            });
        }
    </script>
</body>
</html>
