<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph D</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 300px;
            margin: 0;
            padding: 4px;
            height: calc(100% - 8px);
        }
        .board-wrapper {
            background: white;
            border-radius: 8px;
            padding: 6px;
            height: calc(100% - 12px);
        }
        #board {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-9.5, 4.5, 5.5, -8.5],
            axis: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Manual axes ─────────────────────────────────────────────────
        var xAxis = board.create('line', [[0, 0], [1, 0]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: false,
            straightFirst: true,
            straightLast: true
        });

        var yAxis = board.create('line', [[0, 0], [0, 1]], {
            strokeColor: '#444444',
            strokeWidth: 1.2,
            fixed: true,
            highlight: false,
            lastArrow: { type: 2, size: 6 },
            firstArrow: false,
            straightFirst: true,
            straightLast: true
        });

        // ── Manual ticks — labels only, no tick marks ───────────────────
        var i;

        // X-axis tick labels
        for (i = -9; i <= 5; i++) {
            if (i === 0) continue;
            board.create('text', [i, -0.5, String(i)], {
                fontSize: 8,
                color: '#444444',
                anchorX: 'middle',
                anchorY: 'top',
                fixed: true,
                highlight: false
            });
        }

        // Y-axis tick labels
        for (i = -8; i <= 4; i++) {
            if (i === 0) continue;
            board.create('text', [-0.45, i, String(i)], {
                fontSize: 8,
                color: '#444444',
                anchorX: 'right',
                anchorY: 'middle',
                fixed: true,
                highlight: false
            });
        }

        // Axis labels near arrow tips
        board.create('text', [5.0, -0.5, '<i>x</i>'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false
        });
        board.create('text', [0.25, 4.0, '<i>y</i>'], {
            fontSize: 12, color: '#444444', fixed: true, highlight: false
        });

        // ── Grid ────────────────────────────────────────────────────────
        for (i = -9; i <= 5; i++) {
            if (i === 0) continue;
            board.create('line', [[i, -8.5], [i, 4.5]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, dash: 0
            });
        }
        for (i = -8; i <= 4; i++) {
            if (i === 0) continue;
            board.create('line', [[-9.5, i], [5.5, i]], {
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false, dash: 0
            });
        }

        // ── Function: f(x) = -2 * cbrt(x + 4) - 3 ─────────────────────
        board.create('functiongraph', [
            function(x) {
                var inner = x + 4;
                var cbrt = (inner >= 0) ? Math.pow(inner, 1 / 3) : -Math.pow(-inner, 1 / 3);
                return -2 * cbrt - 3;
            },
            -9.5, 5.5
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
