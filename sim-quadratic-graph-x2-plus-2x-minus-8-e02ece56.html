<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph of f(x) = x² + 2x - 8</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
        .container { width: 300px; height: 200px; padding: 0; }
        .board-wrapper { background: white; border-radius: 6px; padding: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6.5, 4.5, 4.5, -11.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { fontSize: 9, offset: [0, -10] }
                    }
                },
                y: {
                    strokeColor: '#444444',
                    strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 5 },
                    ticks: {
                        strokeColor: '#444444',
                        majorHeight: 0,
                        minorTicks: 0,
                        ticksDistance: 1,
                        label: { fontSize: 9, offset: [-12, 0] }
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels near arrow tips
        board.create('text', [4.0, -0.6, '<i>x</i>'], { fontSize: 11, fixed: true, highlight: false });
        board.create('text', [0.3, 4.0, '<i>y</i>'], { fontSize: 11, fixed: true, highlight: false });

        // Parabola: f(x) = x² + 2x - 8
        board.create('functiongraph', [
            function(x) { return x * x + 2 * x - 8; }
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });
    </script>
</body>
</html>
