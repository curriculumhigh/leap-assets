<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distractor: y=-5 labeled y=5, x=3 labeled x=-3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; }
        .container { height: calc(100% - 12px); padding: 6px; }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 6.5, 7, -6.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Major gridlines
        var i;
        for (i = -6; i <= 6; i++) {
            if (i !== 0) {
                board.create('line', [[i, -7], [i, 7]], {
                    strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false,
                    straightFirst: false, straightLast: false, dash: 0
                });
                board.create('line', [[-7, i], [7, i]], {
                    strokeColor: '#D1D5DB', strokeWidth: 0.4, fixed: true, highlight: false,
                    straightFirst: false, straightLast: false, dash: 0
                });
            }
        }

        // Manual x-axis
        board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                minorTicks: 0,
                majorHeight: 6,
                tickEndings: [1, 1],
                drawLabels: true,
                label: { fontSize: 9, offset: [0, -10] },
                insertTicks: false,
                ticksDistance: 2
            }
        });

        // Manual y-axis
        board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 5 },
            ticks: {
                strokeColor: '#444444',
                minorTicks: 0,
                majorHeight: 6,
                tickEndings: [1, 1],
                drawLabels: true,
                label: { fontSize: 9, offset: [-10, 0] },
                insertTicks: false,
                ticksDistance: 2
            }
        });

        // Horizontal line at y = -5 (actual position)
        board.create('line', [[0, -5], [1, -5]], {
            strokeColor: '#2563EB', strokeWidth: 1.8, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Vertical line at x = 3 (actual position)
        board.create('line', [[3, 0], [3, 1]], {
            strokeColor: '#222222', strokeWidth: 1.8, fixed: true, highlight: false,
            straightFirst: true, straightLast: true
        });

        // Mislabel: show "y = 5" on the y = -5 line
        board.create('text', [-5.8, -4.2, 'y = 5'], {
            fontSize: 11, color: '#2563EB', fixed: true, highlight: false
        });

        // Mislabel: show "x = -3" on the x = 3 line
        board.create('text', [3.3, 5.2, 'x = \u20133'], {
            fontSize: 11, color: '#222222', fixed: true, highlight: false
        });
    </script>
</body>
</html>
