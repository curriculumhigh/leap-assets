<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Rectangles — PQRS and TUVW</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 550px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 10.5, 21.5, -2.5],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        var COL_EDGE = '#555555';
        var COL_LABEL = '#222222';
        var COL_DIM = '#3B82F6';
        var COL_RA = '#DC2626';
        var EDGE_W = 2.0;
        var RA_SIZE = 0.45;

        function drawRightAngle(cx, cy, dx1, dy1, dx2, dy2, sz) {
            var p1 = [cx + dx1 * sz, cy + dy1 * sz];
            var p2 = [cx + dx1 * sz + dx2 * sz, cy + dy1 * sz + dy2 * sz];
            var p3 = [cx + dx2 * sz, cy + dy2 * sz];
            board.create('segment', [p1, p2], {
                strokeColor: COL_RA, strokeWidth: 1.5, fixed: true, highlight: false
            });
            board.create('segment', [p2, p3], {
                strokeColor: COL_RA, strokeWidth: 1.5, fixed: true, highlight: false
            });
        }

        // ── LEFT RECTANGLE — PQRS (10 ft × 6 ft → 5 × 3 display) ───────
        var LX = 1, LY = 1, LW = 5, LH = 3;

        var P = board.create('point', [LX, LY], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });
        var Q = board.create('point', [LX + LW, LY], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });
        var R = board.create('point', [LX + LW, LY + LH], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });
        var S = board.create('point', [LX, LY + LH], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });

        board.create('polygon', [P, Q, R, S], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EDGE, strokeWidth: EDGE_W },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels
        board.create('text', [LX - 0.55, LY - 0.55, '<b>P</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [LX + LW + 0.55, LY - 0.55, '<b>Q</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [LX + LW + 0.55, LY + LH + 0.55, '<b>R</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [LX - 0.55, LY + LH + 0.55, '<b>S</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Dimension labels
        board.create('text', [LX + LW / 2, LY - 0.7, '10 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [LX + LW / 2, LY + LH + 0.7, '10 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [LX - 0.9, LY + LH / 2, '6 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [LX + LW + 0.9, LY + LH / 2, '6 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Right-angle markers
        var raL = RA_SIZE;
        drawRightAngle(LX, LY, 1, 0, 0, 1, raL);
        drawRightAngle(LX + LW, LY, -1, 0, 0, 1, raL);
        drawRightAngle(LX + LW, LY + LH, -1, 0, 0, -1, raL);
        drawRightAngle(LX, LY + LH, 1, 0, 0, -1, raL);

        // ── RIGHT RECTANGLE — TUVW (20 ft × 15 ft → 10 × 7.5 display) ──
        var RX = 9, RY = 1, RW = 10, RH = 7.5;

        var T = board.create('point', [RX, RY], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });
        var U = board.create('point', [RX + RW, RY], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });
        var V = board.create('point', [RX + RW, RY + RH], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });
        var W = board.create('point', [RX, RY + RH], {
            name: '', fixed: true, size: 2, color: COL_LABEL, showInfobox: false, highlight: false
        });

        board.create('polygon', [T, U, V, W], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: COL_EDGE, strokeWidth: EDGE_W },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels
        board.create('text', [RX - 0.55, RY - 0.55, '<b>T</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [RX + RW + 0.55, RY - 0.55, '<b>U</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [RX + RW + 0.55, RY + RH + 0.55, '<b>V</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [RX - 0.55, RY + RH + 0.55, '<b>W</b>'], {
            fontSize: 13, color: COL_LABEL, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Dimension labels
        board.create('text', [RX + RW / 2, RY - 0.7, '20 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [RX + RW / 2, RY + RH + 0.7, '20 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [RX - 0.9, RY + RH / 2, '15 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });
        board.create('text', [RX + RW + 0.9, RY + RH / 2, '15 ft'], {
            fontSize: 13, color: COL_DIM, anchorX: 'middle', anchorY: 'middle', fixed: true, highlight: false
        });

        // Right-angle markers
        var raR = 0.6;
        drawRightAngle(RX, RY, 1, 0, 0, 1, raR);
        drawRightAngle(RX + RW, RY, -1, 0, 0, 1, raR);
        drawRightAngle(RX + RW, RY + RH, -1, 0, 0, -1, raR);
        drawRightAngle(RX, RY + RH, 1, 0, 0, -1, raR);
    </script>
</body>
</html>
