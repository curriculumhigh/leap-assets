<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Dish Cross-Section</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 6.8, 7, -1.8],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // === Dish interior shading ===
        var fillPtsX = [];
        var fillPtsY = [];
        var nPts = 80;
        for (var i = 0; i <= nPts; i++) {
            var xv = -4 + 8 * i / nPts;
            fillPtsX.push(xv);
            fillPtsY.push(xv * xv / 4);
        }
        fillPtsX.push(4);
        fillPtsY.push(4);
        fillPtsX.push(-4);
        fillPtsY.push(4);

        var fillVertices = [];
        for (var j = 0; j < fillPtsX.length; j++) {
            fillVertices.push(board.create('point', [fillPtsX[j], fillPtsY[j]], {
                visible: false, fixed: true, name: '', showInfobox: false
            }));
        }
        board.create('polygon', fillVertices, {
            fillColor: '#D1D5DB',
            fillOpacity: 0.25,
            borders: { visible: false },
            vertices: { visible: false },
            hasInnerPoints: false,
            fixed: true,
            highlight: false
        });

        // === Parabola curve ===
        board.create('functiongraph', [
            function(x) { return x * x / 4; }, -4, 4
        ], {
            strokeColor: '#222222',
            strokeWidth: 1.8,
            fixed: true,
            highlight: false
        });

        // === Dashed rim line at y = 4 ===
        board.create('segment', [[-4, 4], [4, 4]], {
            strokeColor: '#222222',
            strokeWidth: 1.2,
            dash: 2,
            fixed: true,
            highlight: false
        });

        // === Axis of symmetry — light dashed vertical line ===
        board.create('segment', [[0, -0.3], [0, 4.8]], {
            strokeColor: '#AAAAAA',
            strokeWidth: 0.8,
            dash: 3,
            fixed: true,
            highlight: false
        });

        // === Vertex point ===
        board.create('point', [0, 0], {
            name: '', size: 3, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [0.35, -0.5, '\\text{Vertex}'], {
            fontSize: 13, color: '#222222', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left'
        });

        // === Receiver (focus) point at (0, 1) ===
        board.create('point', [0, 1], {
            name: '', size: 5, color: '#DC2626', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('text', [0.35, 1.25, '\\text{Receiver}'], {
            fontSize: 13, color: '#DC2626', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left'
        });

        // === Rim points ===
        board.create('point', [-4, 4], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });
        board.create('point', [4, 4], {
            name: '', size: 2, color: '#222222', fixed: true,
            highlight: false, showInfobox: false
        });

        // === Diameter dimension (horizontal, above rim) ===
        var dimDY = 5.2;
        board.create('arrow', [[-4, dimDY], [4, dimDY]], {
            strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, firstArrow: { type: 2, size: 5 }
        });
        board.create('segment', [[-4, 4], [-4, dimDY + 0.2]], {
            strokeColor: '#444444', strokeWidth: 0.6, dash: 3, fixed: true, highlight: false
        });
        board.create('segment', [[4, 4], [4, dimDY + 0.2]], {
            strokeColor: '#444444', strokeWidth: 0.6, dash: 3, fixed: true, highlight: false
        });
        board.create('text', [0, dimDY + 0.4, '8 \\text{ m}'], {
            fontSize: 14, color: '#444444', useKatex: true, fixed: true, highlight: false,
            anchorX: 'middle', anchorY: 'bottom'
        });

        // === Depth dimension (vertical, on right side) ===
        var dimDX = 5.3;
        board.create('arrow', [[dimDX, 4], [dimDX, 0]], {
            strokeColor: '#444444', strokeWidth: 1.0, fixed: true, highlight: false,
            lastArrow: { type: 2, size: 5 }, firstArrow: { type: 2, size: 5 }
        });
        board.create('segment', [[4, 4], [dimDX + 0.2, 4]], {
            strokeColor: '#444444', strokeWidth: 0.6, dash: 3, fixed: true, highlight: false
        });
        board.create('segment', [[0, 0], [dimDX + 0.2, 0]], {
            strokeColor: '#444444', strokeWidth: 0.6, dash: 3, fixed: true, highlight: false
        });
        board.create('text', [dimDX + 0.4, 2, '4 \\text{ m}'], {
            fontSize: 14, color: '#444444', useKatex: true, fixed: true, highlight: false,
            anchorX: 'left', anchorY: 'middle'
        });
    </script>
</body>
</html>
