<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euler Method — Two Steps</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-0.18, 5.35, 1.32, 1.15],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Grid: every 0.25 in x, every 0.5 in y ──────────────────────
        var i, gx, gy;
        for (i = 0; i <= 5; i++) {
            gx = i * 0.25;
            board.create('line', [[gx, 0], [gx, 1]], {
                straightFirst: true, straightLast: true,
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }
        for (i = 3; i <= 11; i++) {
            gy = i * 0.5;
            board.create('line', [[0, gy], [1, gy]], {
                straightFirst: true, straightLast: true,
                strokeColor: '#D1D5DB', strokeWidth: 0.4,
                fixed: true, highlight: false
            });
        }

        // ── Axes ────────────────────────────────────────────────────────
        var xAxisY = 1.5;

        // y-axis (x=0)
        var yAxis = board.create('arrow', [[0, 1.15], [0, 5.3]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // x-axis at bottom of visible region
        var xAxis = board.create('arrow', [[-0.05, xAxisY], [1.25, xAxisY]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            fixed: true, highlight: false
        });

        // Extend y-axis down to meet x-axis
        board.create('segment', [[0, 1.15], [0, xAxisY]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            fixed: true, highlight: false
        });

        // ── Tick marks and labels ───────────────────────────────────────
        var xTicks = [0.25, 0.5, 0.75, 1];
        var yTicks = [2, 2.5, 3, 3.5, 4, 4.5, 5];

        // x-axis ticks
        for (i = 0; i < xTicks.length; i++) {
            var xv = xTicks[i];
            board.create('segment', [[xv, xAxisY - 0.06], [xv, xAxisY + 0.06]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [xv, xAxisY - 0.18, xv.toString()], {
                fontSize: 11, color: '#444444', anchorX: 'middle', anchorY: 'top',
                fixed: true, highlight: false
            });
        }

        // y-axis ticks — short ticks extending left from the axis, labels to the left
        for (i = 0; i < yTicks.length; i++) {
            var yv = yTicks[i];
            board.create('segment', [[-0.03, yv], [0.03, yv]], {
                strokeColor: '#444444', strokeWidth: 1.0,
                fixed: true, highlight: false
            });
            board.create('text', [-0.05, yv, yv % 1 === 0 ? yv.toString() : yv.toFixed(1)], {
                fontSize: 11, color: '#444444', anchorX: 'right', anchorY: 'middle',
                fixed: true, highlight: false
            });
        }

        // Axis labels
        board.create('text', [1.22, xAxisY - 0.08, 'x'], {
            fontSize: 14, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });
        board.create('text', [0.04, 5.25, 'y'], {
            fontSize: 14, color: '#222222', useKatex: true,
            fixed: true, highlight: false
        });

        // ── Slope field ─────────────────────────────────────────────────
        var sfXmin = 0, sfXmax = 1.2, sfYmin = 1.5, sfYmax = 5.0;
        var nxSF = 13, nySF = 15;
        var dxSF = (sfXmax - sfXmin) / (nxSF - 1);
        var dySF = (sfYmax - sfYmin) / (nySF - 1);
        var segLen = 0.06;

        for (var ix = 0; ix < nxSF; ix++) {
            for (var iy = 0; iy < nySF; iy++) {
                var sx = sfXmin + ix * dxSF;
                var sy = sfYmin + iy * dySF;
                var slope = sy - sx;
                var mag = Math.sqrt(1 + slope * slope);
                var ddx = segLen / mag;
                var ddy = segLen * slope / mag;
                board.create('segment', [[sx - ddx, sy - ddy], [sx + ddx, sy + ddy]], {
                    strokeColor: '#B0B0B0', strokeWidth: 0.7,
                    fixed: true, highlight: false, layer: 0
                });
            }
        }

        // ── Solution curve y = x + 1 + e^x through (0,2) ───────────────
        var solFunc = function(x) { return x + 1 + Math.exp(x); };

        board.create('functiongraph', [solFunc, -0.05, 1.25], {
            strokeColor: '#2563EB', strokeWidth: 1.8,
            fixed: true, highlight: false, layer: 5
        });

        // ── Dashed vertical red guide lines at x=0.5 and x=1 ───────────
        // Stop at the x-axis (xAxisY = 1.5), not below it
        board.create('segment', [[0.5, xAxisY], [0.5, solFunc(0.5)]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 4
        });
        board.create('segment', [[1.0, xAxisY], [1.0, solFunc(1.0)]], {
            strokeColor: '#DC2626', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false, layer: 4
        });

        // ── Small blue dots where curve crosses x=0.5 and x=1 ──────────
        board.create('point', [0.5, solFunc(0.5)], {
            name: '', size: 3, color: '#2563EB',
            fixed: true, highlight: false, showInfobox: false, layer: 7
        });
        board.create('point', [1.0, solFunc(1.0)], {
            name: '', size: 3, color: '#2563EB',
            fixed: true, highlight: false, showInfobox: false, layer: 7
        });

        // ── Euler segments (red) ────────────────────────────────────────
        board.create('segment', [[0, 2], [0.5, 3]], {
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false, layer: 6
        });
        board.create('segment', [[0.5, 3], [1, 4.25]], {
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false, layer: 6
        });

        // ── Key points (dark) ───────────────────────────────────────────
        board.create('point', [0, 2], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false, layer: 8
        });
        board.create('point', [0.5, 3], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false, layer: 8
        });
        board.create('point', [1, 4.25], {
            name: '', size: 4, color: '#222222',
            fixed: true, highlight: false, showInfobox: false, layer: 8
        });

        // ── Coordinate labels (KaTeX) ───────────────────────────────────
        // (0, 2) — upper LEFT of the point, left of y-axis, clear of curve/segment/tick labels
        board.create('text', [-0.06, 2.22, '(0,\\ 2)'], {
            fontSize: 12, color: '#222222', useKatex: true,
            anchorX: 'right', anchorY: 'bottom',
            fixed: true, highlight: false, layer: 9
        });

        // (0.5, 3) — lower right, clear of curve
        board.create('text', [0.55, 2.72, '(0.5,\\ 3)'], {
            fontSize: 12, color: '#222222', useKatex: true,
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false, layer: 9
        });

        // (1, 4.25) — lower right, clear of curve
        board.create('text', [1.04, 4.0, '(1,\\ 4.25)'], {
            fontSize: 12, color: '#222222', useKatex: true,
            anchorX: 'left', anchorY: 'top',
            fixed: true, highlight: false, layer: 9
        });

        // ── Curve label y = f(x) near upper right ──────────────────────
        board.create('text', [0.82, 5.05, 'y = f(x)'], {
            fontSize: 13, color: '#2563EB', useKatex: true,
            anchorX: 'left', anchorY: 'bottom',
            fixed: true, highlight: false, layer: 9
        });

    </script>
</body>
</html>
