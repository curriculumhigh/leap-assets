<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle GHI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        // Vertex coordinates
        var Hx = 0, Hy = 0;
        var Ix = 17, Iy = 0;
        var angleH_deg = 132;
        var angleH_rad = angleH_deg * Math.PI / 180;
        var GH = 25;
        var Gx = GH * Math.cos(angleH_rad);
        var Gy = GH * Math.sin(angleH_rad);

        // Bounding box with generous padding
        var xMin = Gx - 9;
        var xMax = Ix + 9;
        var yMin = Hy - 7;
        var yMax = Gy + 7;

        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [xMin, yMax, xMax, yMin],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Vertices (small fixed points) ───────────────────────────────
        var H = board.create('point', [Hx, Hy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var I = board.create('point', [Ix, Iy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var G = board.create('point', [Gx, Gy], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // ── Triangle edges (no fill) ────────────────────────────────────
        board.create('polygon', [G, H, I], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2.0, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Angle arc at H (132°) ──────────────────────────────────────
        board.create('nonReflexAngle', [I, H, G], {
            radius: 2.8,
            fillColor: '#DC2626', fillOpacity: 0.08,
            strokeColor: '#DC2626', strokeWidth: 1.5,
            fixed: true, highlight: false,
            name: '', withLabel: false
        });

        // Angle label along the bisector
        var bisectorAngle = angleH_rad / 2;
        var labelRadius = 3.8;
        var angleLabelX = Hx + labelRadius * Math.cos(bisectorAngle);
        var angleLabelY = Hy + labelRadius * Math.sin(bisectorAngle);

        board.create('text', [angleLabelX, angleLabelY, '132^\\circ'], {
            useKatex: true, fontSize: 14, color: '#DC2626',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false,
            cssStyle: 'font-weight: bold;'
        });

        // ── Vertex labels ───────────────────────────────────────────────
        board.create('text', [Gx - 1.8, Gy + 1.5, '\\textbf{G}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [Hx - 1.8, Hy - 1.5, '\\textbf{H}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        board.create('text', [Ix + 1.8, Iy - 1.5, '\\textbf{I}'], {
            useKatex: true, fontSize: 15, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // ── Side labels (values only) ───────────────────────────────────
        // 17 — below side HI
        var midHI_x = (Hx + Ix) / 2;
        var midHI_y = (Hy + Iy) / 2 - 2.0;

        board.create('text', [midHI_x, midHI_y, '\\boldsymbol{17}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // 25 — offset to the left of side GH
        var midGH_x = (Gx + Hx) / 2;
        var midGH_y = (Gy + Hy) / 2;
        var ghDx = Gx - Hx;
        var ghDy = Gy - Hy;
        var ghLen = Math.sqrt(ghDx * ghDx + ghDy * ghDy);
        var normX = -ghDy / ghLen;
        var normY = ghDx / ghLen;
        var labelOffset = 2.2;

        board.create('text', [midGH_x + normX * labelOffset, midGH_y + normY * labelOffset, '\\boldsymbol{25}'], {
            useKatex: true, fontSize: 14, color: '#222222',
            anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
