<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle ABCD with Midpoint Rhombus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 370px; margin: 0 auto; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 6px; height: calc(100% - 12px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-1.8, 9.6, 14.8, -1.8],
            axis: false,
            grid: false,
            keepAspectRatio: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Rectangle vertices ──
        var A = board.create('point', [0, 8], {
            name: 'A', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, 6] }
        });
        var B = board.create('point', [12, 8], {
            name: 'B', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [6, 6] }
        });
        var C = board.create('point', [12, 0], {
            name: 'C', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [6, -14] }
        });
        var D = board.create('point', [0, 0], {
            name: 'D', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 14, color: '#222222', offset: [-16, -14] }
        });

        // ── Rectangle polygon ──
        var rect = board.create('polygon', [A, B, C, D], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Midpoints ──
        var E = board.create('midpoint', [A, B], {
            name: 'E', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-2, 14] }
        });
        var F = board.create('midpoint', [B, C], {
            name: 'F', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [6, -2] }
        });
        var G = board.create('midpoint', [C, D], {
            name: 'G', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-2, -16] }
        });
        var H = board.create('midpoint', [D, A], {
            name: 'H', fixed: true, size: 2, color: '#222222', highlight: false,
            showInfobox: false,
            label: { fontSize: 13, color: '#222222', offset: [-18, -2] }
        });

        // ── Rhombus (shaded) ──
        var rhombus = board.create('polygon', [E, F, G, H], {
            fillColor: '#2563EB', fillOpacity: 0.15,
            borders: { strokeColor: '#2563EB', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Dimension labels ──
        board.create('text', [6, 9.3, '12 \\text{ cm}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#555555', fixed: true, highlight: false,
            useKatex: true
        });

        board.create('text', [13.8, 4, '8 \\text{ cm}'], {
            anchorX: 'middle', anchorY: 'middle',
            fontSize: 13, color: '#555555', fixed: true, highlight: false,
            useKatex: true
        });
    </script>
</body>
</html>
