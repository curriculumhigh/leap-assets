<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle DEF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-6, 9.5, 6, -3.5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 1
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [5.6, -0.45, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 9.1, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // Vertices
        var D = board.create('point', [-3, -1], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var E = board.create('point', [-3, 7], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });
        var F = board.create('point', [3, -1], {
            name: '', size: 2, color: '#222222', fixed: true, highlight: false, showInfobox: false
        });

        // Triangle edges
        board.create('polygon', [D, E, F], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5, fixed: true, highlight: false },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels — name + coordinates (KaTeX)
        board.create('text', [-5.7, -1.8, 'D(-3,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [-5.7, 7.6, 'E(-3,\\,7)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });
        board.create('text', [3.3, -1.8, 'F(3,\\,-1)'], {
            useKatex: true, fontSize: 12, color: '#222222',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
