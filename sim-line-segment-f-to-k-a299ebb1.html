<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Segment F to K</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 450px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-2, 3.5, 30, -3.5],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Point positions along x-axis (y = 0)
        var pts = [
            { name: 'F', x: 1 },
            { name: 'G', x: 5 },
            { name: 'H', x: 14 },
            { name: 'J', x: 21 },
            { name: 'K', x: 27 }
        ];

        // Horizontal segment from F to K
        board.create('segment', [[1, 0], [27, 0]], {
            strokeColor: '#222222',
            strokeWidth: 2,
            fixed: true,
            highlight: false
        });

        // Points and labels
        for (var i = 0; i < pts.length; i++) {
            board.create('point', [pts[i].x, 0], {
                name: '',
                size: 2,
                color: '#222222',
                fixed: true,
                highlight: false,
                showInfobox: false
            });

            board.create('text', [pts[i].x, 1.1, '<b>' + pts[i].name + '</b>'], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 15,
                color: '#222222',
                fixed: true,
                highlight: false
            });
        }

        // Distance labels between consecutive points
        var gaps = [
            { x1: 1, x2: 5, label: '4 m' },
            { x1: 5, x2: 14, label: '9 m' },
            { x1: 14, x2: 21, label: '7 m' },
            { x1: 21, x2: 27, label: '6 m' }
        ];

        for (var j = 0; j < gaps.length; j++) {
            var midX = (gaps[j].x1 + gaps[j].x2) / 2;
            board.create('text', [midX, -1.3, gaps[j].label], {
                anchorX: 'middle',
                anchorY: 'middle',
                fontSize: 13,
                color: '#555555',
                fixed: true,
                highlight: false
            });
        }
    </script>
</body>
</html>
