<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Triangle LMN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 500px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-3, 7, 23, -3],
            axis: false,
            grid: false,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // Vertices
        var M = board.create('point', [0, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var N = board.create('point', [20, 0], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });
        var L = board.create('point', [0, 4.5], {
            name: '', fixed: true, size: 2, color: '#222222', highlight: false
        });

        // Triangle (no fill)
        board.create('polygon', [L, M, N], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Right-angle marker at M
        var sqSize = 0.9;
        var sq1 = board.create('point', [sqSize, 0], { visible: false, fixed: true, name: '' });
        var sq2 = board.create('point', [sqSize, sqSize], { visible: false, fixed: true, name: '' });
        var sq3 = board.create('point', [0, sqSize], { visible: false, fixed: true, name: '' });
        board.create('polygon', [M, sq1, sq2, sq3], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.5 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // Vertex labels (bold)
        board.create('text', [-1.0, 5.0, '<b>L</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [-1.0, -1.0, '<b>M</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });
        board.create('text', [20.4, -1.0, '<b>N</b>'], {
            fontSize: 15, color: '#222222', fixed: true, highlight: false
        });

        // Side labels
        // LM = 9 (left of vertical leg)
        board.create('text', [-1.8, 2.25, '9'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // MN = 40 (below horizontal leg)
        board.create('text', [10, -1.2, '40'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });

        // LN = 41 (along hypotenuse, offset up-right from midpoint)
        board.create('text', [11.0, 3.2, '41'], {
            fontSize: 14, color: '#222222', anchorX: 'middle', anchorY: 'middle',
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
