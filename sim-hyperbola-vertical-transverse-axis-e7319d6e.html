<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbola — Vertical Transverse Axis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-5, 7, 7, -9],
            axis: false,
            grid: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false }
        });

        // ── Manual axes ─────────────────────────────────────────────────
        var xAxis = board.create('axis', [[0, 0], [1, 0]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                minorTicks: 0,
                ticksDistance: 1,
                label: { fontSize: 11 },
                drawZero: false
            }
        });

        var yAxis = board.create('axis', [[0, 0], [0, 1]], {
            strokeColor: '#444444', strokeWidth: 1.2,
            lastArrow: { type: 2, size: 6 },
            ticks: {
                strokeColor: '#444444',
                minorTicks: 0,
                ticksDistance: 1,
                drawZero: false,
                label: { visible: false }
            }
        });

        // Axis name labels
        board.create('text', [6.6, -0.5, '<i>x</i>'], { fontSize: 14, fixed: true, highlight: false });
        board.create('text', [0.25, 6.6, '<i>y</i>'], { fontSize: 14, fixed: true, highlight: false });

        // ── Manual y-axis number labels ─────────────────────────────────
        var yMin = -8, yMax = 6;
        for (var i = yMin; i <= yMax; i++) {
            if (i === 0) continue;
            board.create('text', [-0.4, i, String(i)], {
                fontSize: 11, color: '#444444', fixed: true, highlight: false,
                anchorX: 'right', anchorY: 'middle'
            });
        }

        // ── Constants ───────────────────────────────────────────────────
        var h = 1, k = -2;
        var a = 3, b = 3;

        // ── Fundamental rectangle (dashed, no fill) ─────────────────────
        var rp1 = board.create('point', [h - b, k + a], { visible: false, fixed: true, name: '' });
        var rp2 = board.create('point', [h + b, k + a], { visible: false, fixed: true, name: '' });
        var rp3 = board.create('point', [h + b, k - a], { visible: false, fixed: true, name: '' });
        var rp4 = board.create('point', [h - b, k - a], { visible: false, fixed: true, name: '' });

        board.create('polygon', [rp1, rp2, rp3, rp4], {
            fillColor: 'none', fillOpacity: 0,
            borders: { strokeColor: '#555555', strokeWidth: 1.0, dash: 2 },
            vertices: { visible: false },
            hasInnerPoints: false, fixed: true, highlight: false
        });

        // ── Asymptotes (cyan, dashed) ───────────────────────────────────
        var slope = a / b;

        board.create('functiongraph', [
            function(x) { return slope * (x - h) + k; },
            -5, 7
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        board.create('functiongraph', [
            function(x) { return -slope * (x - h) + k; },
            -5, 7
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // ── Hyperbola — vertical transverse axis ────────────────────────
        // Upper branch
        board.create('curve', [
            function(t) { return h + b * Math.tan(t); },
            function(t) { return k + a / Math.cos(t); },
            -1.25, 1.25
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Lower branch
        board.create('curve', [
            function(t) { return h + b * Math.tan(t); },
            function(t) { return k - a / Math.cos(t); },
            -1.25, 1.25
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // ── Center point ────────────────────────────────────────────────
        board.create('point', [h, k], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        // ── Vertices ────────────────────────────────────────────────────
        board.create('point', [h, k + a], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });

        board.create('point', [h, k - a], {
            name: '', size: 5, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
    </script>
</body>
</html>
