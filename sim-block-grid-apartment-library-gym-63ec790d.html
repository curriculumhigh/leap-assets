<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block-Grid Coordinate Plane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 400px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-13, 9, 19, -12],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            keepAspectRatio: true,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    firstArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    firstArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 11 },
                        minorTicks: 0,
                        ticksDistance: 5
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Compass axis labels — E, W, N, S near arrow tips
        board.create('text', [18.2, -0.7, '\\text{E}'], { fontSize: 14, color: '#444444', useKatex: true, fixed: true, highlight: false });
        board.create('text', [-12.6, -0.7, '\\text{W}'], { fontSize: 14, color: '#444444', useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.4, 8.5, '\\text{N}'], { fontSize: 14, color: '#444444', useKatex: true, fixed: true, highlight: false });
        board.create('text', [0.4, -11.5, '\\text{S}'], { fontSize: 14, color: '#444444', useKatex: true, fixed: true, highlight: false });

        // ── Points ──────────────────────────────────────────────────────

        // Apartment at origin
        var apartment = board.create('point', [0, 0], {
            name: '', size: 3, color: '#222222', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [0.8, 1.8, '\\text{Apartment}'], {
            fontSize: 12, color: '#222222', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [0.8, 0.8, '(0, 0)'], {
            fontSize: 11, color: '#222222', useKatex: true, fixed: true, highlight: false
        });

        // Library at (15, -8)
        var library = board.create('point', [15, -8], {
            name: '', size: 3, color: '#2563EB', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [10.2, -9.2, '\\text{Library}'], {
            fontSize: 12, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [10.2, -10.2, '(15, -8)'], {
            fontSize: 11, color: '#2563EB', useKatex: true, fixed: true, highlight: false
        });

        // Gym at (-9, 5)
        var gym = board.create('point', [-9, 5], {
            name: '', size: 3, color: '#059669', fixed: true, highlight: false,
            showInfobox: false
        });
        board.create('text', [-12.4, 7.6, '\\text{Gym}'], {
            fontSize: 12, color: '#059669', useKatex: true, fixed: true, highlight: false
        });
        board.create('text', [-12.4, 6.6, '(-9, 5)'], {
            fontSize: 11, color: '#059669', useKatex: true, fixed: true, highlight: false
        });

        // ── Segment from Library to Gym ─────────────────────────────────
        board.create('segment', [library, gym], {
            strokeColor: '#222222', strokeWidth: 1.5, dash: 2,
            fixed: true, highlight: false
        });
    </script>
</body>
</html>
