<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbola — Horizontal Transverse Axis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { max-width: 300px; margin: 0; padding: 6px; height: calc(100% - 12px); }
        .board-wrapper { background: white; border-radius: 8px; padding: 10px; height: calc(100% - 20px); }
        #board { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <script>
        var board = JXG.JSXGraph.initBoard('board', {
            boundingbox: [-7, 5, 7, -5],
            axis: true,
            showNavigation: false,
            showCopyright: false,
            pan: { enabled: false },
            zoom: { enabled: false },
            defaultAxes: {
                x: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                },
                y: {
                    strokeColor: '#444444', strokeWidth: 1.2,
                    lastArrow: { type: 2, size: 6 },
                    ticks: {
                        strokeColor: '#444444',
                        label: { fontSize: 10 },
                        minorTicks: 0,
                        ticksDistance: 2
                    }
                }
            },
            grid: {
                strokeColor: '#D1D5DB',
                strokeWidth: 0.4
            }
        });

        // Axis labels
        board.create('text', [6.5, -0.45, 'x'], { useKatex: true, fontSize: 12, fixed: true, highlight: false });
        board.create('text', [0.25, 4.5, 'y'], { useKatex: true, fontSize: 12, fixed: true, highlight: false });

        // Hyperbola parameters: x^2/9 - y^2/16 = 1
        var a = 3, b = 4;

        // Asymptotes: y = +-(4/3)x
        board.create('functiongraph', [
            function(x) { return (4 / 3) * x; }
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        board.create('functiongraph', [
            function(x) { return -(4 / 3) * x; }
        ], {
            strokeColor: '#0EA5E9', strokeWidth: 1.0, dash: 2,
            fixed: true, highlight: false
        });

        // Right branch: x = a * cosh(t), y = b * sinh(t)
        board.create('curve', [
            function(t) { return a * Math.cosh(t); },
            function(t) { return b * Math.sinh(t); },
            -2.5, 2.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Left branch: x = -a * cosh(t), y = b * sinh(t)
        board.create('curve', [
            function(t) { return -a * Math.cosh(t); },
            function(t) { return b * Math.sinh(t); },
            -2.5, 2.5
        ], {
            strokeColor: '#222222', strokeWidth: 1.8,
            fixed: true, highlight: false
        });

        // Center (0, 0) — small structural dot
        board.create('point', [0, 0], {
            name: '', size: 3, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Vertex (-3, 0)
        board.create('point', [-3, 0], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });

        // Vertex (3, 0)
        board.create('point', [3, 0], {
            name: '', size: 5, color: '#222222',
            fixed: true, highlight: false, showInfobox: false
        });
    </script>
</body>
</html>
